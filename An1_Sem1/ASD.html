lculul cu frecven\u021be"}, {"q": "Un cercet\u0103tor a notat grupa sanguin\u0103 (0, A, B, AB) a 200 de donatori \u0219i vrea s\u0103 raporteze tendin\u021ba central\u0103. Ce poate folosi?", "opts": ["Modul \u0219i mediana", "Media, mediana \u0219i modul", "Doar modul", "Doar mediana"], "correct": 2, "explain": "Grupa sanguin\u0103 e o variabil\u0103 nominal\u0103: categoriile nu au ordine \u0219i nici distan\u021be, deci se poate folosi doar modul \u2014 grupa cu cei mai mul\u021bi donatori. Mediana cere ordonare (nivel ordinal), media cere intervale egale, ca \u00een Cap. 1 (Introducere \u00een statistic\u0103).", "tag": "M\u0103rimi permise pe niveluri de m\u0103sur\u0103"}, {"q": "Pacien\u021bii \u00ee\u0219i evalueaz\u0103 durerea ca u\u0219oar\u0103, moderat\u0103, sever\u0103 sau insuportabil\u0103. Ce m\u0103rimi ale tendin\u021bei centrale are sens s\u0103 raportezi?", "opts": ["Doar modul", "Media, mediana \u0219i modul", "Doar media", "Modul \u0219i mediana"], "correct": 3, "explain": "R\u0103spunsurile se pot ordona, dar distan\u021bele dintre ele nu sunt egale: la nivel ordinal se folosesc modul \u0219i mediana. Doar modul ar fi limita nivelului nominal; media ar presupune c\u0103 distan\u021ba \u201eu\u0219oar\u0103\u2013moderat\u0103\u201d egaleaz\u0103 distan\u021ba \u201esever\u0103\u2013insuportabil\u0103\u201d.", "tag": "Mediana la nivel ordinal"}, {"q": "Trei scoruri, 3, 5 \u0219i 10, au media 6. C\u00e2t este suma abaterilor lor de la medie?", "opts": ["8", "0", "26", "18"], "correct": 1, "explain": "Abaterile sunt \u22123, \u22121 \u0219i +4, iar suma lor e 0 \u2014 \u00een orice distribu\u021bie, abaterile de la medie se anuleaz\u0103. 8 adun\u0103 abaterile f\u0103r\u0103 semn, 26 adun\u0103 p\u0103tratele lor, 18 este suma scorurilor.", "tag": "Suma abaterilor egal\u0103 cu zero"}, {"q": "Un statistician vrea punctul fa\u021b\u0103 de care suma p\u0103tratelor abaterilor scorurilor s\u0103 fie c\u00e2t mai mic\u0103. Ce m\u0103rime alege?", "opts": ["Mediana", "Modul", "Media aritmetic\u0103", "Centrul plajei de scoruri"], "correct": 2, "explain": "Suma p\u0103tratelor abaterilor e minim\u0103 fa\u021b\u0103 de medie (\u00een exemplul din curs, 74 fa\u021b\u0103 de media 19, dar 118 fa\u021b\u0103 de scorul 17) \u2014 proprietate folosit\u0103 apoi la m\u0103rimile dispersiei, \u00een Cap. 4 (M\u0103rimile dispersiei). Mediana \u0219i modul nu au aceast\u0103 proprietate; mijlocul plajei depinde doar de cele dou\u0103 extreme.", "tag": "Suma p\u0103tratelor abaterilor minim\u0103"}, {"q": "Cinci copii rezolv\u0103 un puzzle \u00een 30, 30, 40, 40 \u0219i 360 de secunde. Ce se \u00eent\u00e2mpl\u0103 cu media fa\u021b\u0103 de median\u0103?", "opts": ["Media e 40, mediana 100: mediana e tras\u0103 de scorul 360", "Ambele sunt 40, pentru c\u0103 scorul extrem nu conteaz\u0103", "Media e 100, mediana 35: ambele sunt trase de 360", "Media e 100, mediana 40: media e tras\u0103 de scorul 360"], "correct": 3, "explain": "Media = 500 / 5 = 100, de\u0219i patru copii au sub 41 de secunde; mediana, scorul celui de-al treilea caz din cinci, r\u0103m\u00e2ne 40, pentru c\u0103 \u021bine cont doar de ordine. Media e tras\u0103 spre scorurile extreme, mai ales spre cele mari; scorul extrem nu schimb\u0103 mediana, dar schimb\u0103 media.", "tag": "Sensibilitatea la scorurile extreme"}, {"q": "Timpii de rezolvare a unei sarcini, \u00een minute, au fost 12, 7, 15, 9 \u0219i 30. C\u00e2t este mediana?", "opts": ["12", "15", "14,6", "18,5"], "correct": 0, "explain": "\u00cent\u00e2i se ordoneaz\u0103: 7, 9, 12, 15, 30; cazul de mijloc e al 3-lea, deci mediana e 12 (dou\u0103 scoruri mai mici, dou\u0103 mai mari). 15 e scorul din mijlocul listei neordonate; 14,6 e media; 18,5 e jum\u0103tatea distan\u021bei dintre minim \u0219i maxim.", "tag": "Defini\u021bia medianei"}, {"q": "Opt v\u00e2rste ordonate: 26, 26, 28, 29, 30, 31, 32, 60. C\u00e2t este mediana?", "opts": ["29", "32,75", "29,5", "30"], "correct": 2, "explain": "Pentru n par exist\u0103 dou\u0103 cazuri de mijloc, al 4-lea (29) \u0219i al 5-lea (30); la interval \u0219i raport se ia, prin conven\u021bie, media lor: 29,5. 29 \u0219i 30 iau doar unul dintre cazurile de mijloc, iar 32,75 este media tuturor celor opt v\u00e2rste, tras\u0103 \u00een sus de scorul 60.", "tag": "Mediana pentru n impar \u0219i n par"}, {"q": "Notele a nou\u0103 elevi sunt 4, 6, 7, 7, 7, 7, 8, 9, 10. C\u00e2t este mediana?", "opts": ["7,5", "7", "7,22", "8"], "correct": 1, "explain": "Al 5-lea caz din 9 are nota 7: patru note sunt mai mici sau egale cu 7, patru sunt mai mari sau egale. Scorurile egale cu mediana sunt \u00een regul\u0103 \u2014 de aceea defini\u021bia spune \u201esau egale\u201d. 7,22 e media, 7,5 aplic\u0103 inutil conven\u021bia pentru n par.", "tag": "De ce \u201esau egale\u201d"}, {"q": "\u0218apte studen\u021bi spun c\u00e2t de des citesc: Deloc, Rar, Rar, Des, Des, Foarte des, Foarte des. Care este r\u0103spunsul median?", "opts": ["Des", "Rar", "\u00centre Des \u0219i Foarte des", "Nu exist\u0103, datele fiind ordinale"], "correct": 0, "explain": "R\u0103spunsurile sunt deja ordonate; al 4-lea caz din 7 r\u0103spunde Des, deci trei r\u0103spunsuri sunt sub el \u0219i trei peste. Mediana se poate afla la nivel ordinal; doar la n par cu dou\u0103 cazuri de mijloc diferite s-ar alege categoria dintre ele.", "tag": "Mediana la nivel ordinal"}, {"q": "La un sondaj, 40 de studen\u021bi \u00ee\u0219i aleg ramura preferat\u0103: social\u0103 15, clinic\u0103 12, organiza\u021bional\u0103 8, experimental\u0103 5. Care este modul?", "opts": ["15 studen\u021bi", "Psihologia clinic\u0103", "10 studen\u021bi pe ramur\u0103", "Psihologia social\u0103"], "correct": 3, "explain": "Variabila e nominal\u0103, deci modul e singura m\u0103rime posibil\u0103, iar modul e categoria cu cele mai multe cazuri \u2014 psihologia social\u0103 \u2014 ca statusul \u201eC\u0103s\u0103torit\u201d din exemplul cursului. 15 e frecven\u021ba modului, nu modul; 10 e o frecven\u021b\u0103 medie, f\u0103r\u0103 sens aici.", "tag": "Modul la nivel nominal"}, {"q": "Un psiholog noteaz\u0103 num\u0103rul de gre\u0219eli ale unor participan\u021bi: 3, 3, 3, 5, 5, 5, 7, 10, 12. Cum descrii modul?", "opts": ["Mul\u021bime bimodal\u0103: 3 \u0219i 5 apar de c\u00e2te trei ori", "Unimodal\u0103, cu modul 5, scorul aflat la mijloc", "F\u0103r\u0103 mod, pentru c\u0103 mai multe scoruri se repet\u0103", "Unimodal\u0103, cu modul 3, primul scor repetat"], "correct": 0, "explain": "At\u00e2t 3, c\u00e2t \u0219i 5 apar de c\u00e2te trei ori, mai des dec\u00e2t celelalte scoruri, deci mul\u021bimea e bimodal\u0103. 5 este mediana (al 5-lea caz din 9), nu modul; o mul\u021bime e \u201ef\u0103r\u0103 mod\u201d doar c\u00e2nd toate scorurile apar de acela\u0219i num\u0103r de ori.", "tag": "Mul\u021bimi unimodale \u0219i multimodale"}, {"q": "La un test, media scorurilor este 62, iar mediana 54. Ce form\u0103 are, cel mai probabil, distribu\u021bia?", "opts": ["Asimetrie negativ\u0103: c\u00e2teva scoruri foarte mici", "Simetric\u0103: diferen\u021ba dintre ele e \u00eent\u00e2mpl\u0103toare", "Asimetrie pozitiv\u0103: c\u00e2teva scoruri foarte mari", "Bimodal\u0103: dou\u0103 grup\u0103ri distincte de scoruri"], "correct": 2, "explain": "Media mai mare dec\u00e2t mediana arat\u0103 c\u0103 exist\u0103 c\u00e2teva scoruri foarte mari care o trag \u00een sus, cu predominan\u021ba celor mici: asimetrie pozitiv\u0103. Asimetria negativ\u0103 ar da medie mai mic\u0103 dec\u00e2t mediana; la o distribu\u021bie simetric\u0103 cele dou\u0103 ar coincide.", "tag": "Asimetria pozitiv\u0103"}, {"q": "Un cercet\u0103tor constat\u0103 c\u0103 media \u0219i mediana scorurilor lui sunt ambele 50. Ce poate spune despre forma distribu\u021biei?", "opts": ["Are asimetrie pozitiv\u0103", "E simetric\u0103", "Are asimetrie negativ\u0103", "E sigur bimodal\u0103"], "correct": 1, "explain": "Media \u0219i mediana au aceea\u0219i valoare numai c\u00e2nd distribu\u021bia e simetric\u0103. Asimetria pozitiv\u0103 le-ar separa cu media deasupra, cea negativ\u0103 cu media dedesubt; egalitatea lor nu spune c\u00e2te moduri are distribu\u021bia.", "tag": "Distribu\u021bia simetric\u0103"}, {"q": "Dou\u0103 facult\u0103\u021bi raporteaz\u0103 media de admitere: 8,2 la 400 de candida\u021bi \u0219i 9,0 la 100 de candida\u021bi. Cum afli media tuturor celor 500?", "opts": ["Media simpl\u0103 a celor dou\u0103 medii", "Mediana celor dou\u0103 medii raportate", "Media grupului cu mai mul\u021bi candida\u021bi", "Media ponderat\u0103 cu num\u0103rul de candida\u021bi"], "correct": 3, "explain": "Grupurile au m\u0103rimi diferite, deci fiecare medie se \u00eenmul\u021be\u0219te cu num\u0103rul de candida\u021bi, iar suma se \u00eemparte la 500: (400 \u00b7 8,2 + 100 \u00b7 9,0) / 500 = 8,36. Media simpl\u0103 (8,6) ar da aceea\u0219i greutate celor 100 ca celor 400; media grupului mai mare ignor\u0103 complet cel\u0103lalt grup.", "tag": "Media ponderat\u0103"}, {"q": "Ai doar un tabel cu intervale de clas\u0103 (10\u201314: 4 cazuri; 15\u201319: 6 cazuri) \u0219i calculezi media. Ce scor atribui fiec\u0103ruia dintre cele 6 cazuri din 15\u201319?", "opts": ["17, centrul intervalului", "14,5, limita real\u0103 inferioar\u0103", "19,5, limita real\u0103 superioar\u0103", "15, limita stabilit\u0103 inferioar\u0103"], "correct": 0, "explain": "Media pentru date grupate presupune c\u0103 toate scorurile dintr-un interval stau \u00een centrul lui, (15 + 19) / 2 = 17, deci cele 6 cazuri contribuie cu 6 \u00b7 17. Limitele reale, din Cap. 2 (Prezentarea datelor statistice), se folosesc la median\u0103 \u0219i la percentile, unde scorurile sunt presupuse distribuite uniform \u00eentre ele.", "tag": "Media pentru date grupate"}, {"q": "\u00centr-un tabel grupat, intervalul 30\u201334 are cele mai multe cazuri (25). Ce valoare raportezi ca mod?", "opts": ["25, frecven\u021ba intervalului", "29,5, limita lui real\u0103 inferioar\u0103", "32, centrul intervalului", "34,5, limita lui real\u0103 superioar\u0103"], "correct": 2, "explain": "Din date grupate modul efectiv nu se poate afla; se ia intervalul modal, iar centrul lui e considerat modul: (30 + 34) / 2 = 32. 25 e num\u0103rul de cazuri, nu un scor; limitele reale delimiteaz\u0103 intervalul, nu-i dau valoarea tipic\u0103.", "tag": "Intervalul modal"}, {"q": "Un student afl\u0103 c\u0103 scorul lui la examen este egal cu a treia cuartil\u0103 (Q3) a grupei. Ce \u00eenseamn\u0103 asta?", "opts": ["Cel pu\u021bin 75% dintre colegi au scoruri mai mari", "Cel mult 75% dintre colegi au scoruri mai mici", "Are scorul ob\u021binut cel mai des \u00een grup\u0103", "Scorul lui e \u00een al treilea interval de clas\u0103"], "correct": 1, "explain": "Q3 = P75: cel mult 75% din scoruri sunt mai mici \u0219i cel mult 25% mai mari. Varianta cu 75% deasupra inverseaz\u0103 sensul (ar fi Q1); scorul cel mai frecvent e modul; cuartilele \u00eempart scorurile ordonate \u00een sferturi, nu num\u0103r\u0103 intervale de clas\u0103.", "tag": "Cuartile \u0219i decile"}, {"q": "Un candidat afl\u0103 c\u0103 scorul lui are rangul percentilei 80. Ce \u00eenseamn\u0103?", "opts": ["A ob\u021binut 80% din punctajul maxim al testului", "80% din candida\u021bi au scoruri mai mari dec\u00e2t el", "Se afl\u0103 pe locul 80 \u00een clasamentul candida\u021bilor", "80% din candida\u021bi au scoruri mai mici sau egale"], "correct": 3, "explain": "Rangul percentilei e procentul de cazuri cu scoruri mai mici sau egale cu un scor dat. Nu e un procent din punctaj \u0219i nici un loc \u00een clasament; varianta cu 80% deasupra inverseaz\u0103 sensul.", "tag": "Rangul percentilei"}]}, {"id": "2", "eticheta": "Runda 2 \u00b7 Aplica\u021bii", "titlu": "Runda 2 \u2014 Scenarii \u0219i ra\u021bionament", "desc": "Situa\u021bii noi: alegi m\u0103rimea potrivit\u0103, calculezi pe date brute sau grupate \u0219i g\u0103se\u0219ti eroarea.", "intrebari": [{"q": "O firm\u0103 mic\u0103: 9 angaja\u021bi c\u00e2\u0219tig\u0103 \u00eentre 4000 \u0219i 5000 de lei, iar directorul 60 000. Ce m\u0103rime descrie cel mai bine venitul tipic?", "opts": ["Media, pentru c\u0103 folose\u0219te informa\u021bia din toate veniturile", "Mediana, pentru c\u0103 \u021bine cont doar de ordinea veniturilor", "Modul, singura m\u0103rime potrivit\u0103 pentru datele de raport", "Media, dup\u0103 ce venitul directorului e ponderat separat"], "correct": 1, "explain": "Ca v\u00e2rsta 60 din tabelul 3.3, venitul directorului trage media mult \u00een sus, \u00een timp ce mediana, care \u021bine cont doar de ordine, r\u0103m\u00e2ne printre veniturile obi\u0219nuite. Faptul c\u0103 media \u201efolose\u0219te toate scorurile\u201d e tocmai motivul pentru care e tras\u0103 de extreme; la raport sunt permise toate trei m\u0103rimile, nu doar modul.", "tag": "Rezisten\u021ba medianei la extreme"}, {"q": "Grupa A (20 de studen\u021bi) are media 8, grupa B (30 de studen\u021bi) are media 6. C\u00e2t este media celor 50 de studen\u021bi?", "opts": ["7,0", "7,2", "14,0", "6,8"], "correct": 3, "explain": "Media ponderat\u0103: (20 \u00b7 8 + 30 \u00b7 6) / 50 = 340 / 50 = 6,8, mai aproape de grupa mai mare. 7,0 e media mediilor (ignor\u0103 m\u0103rimea grupelor), 7,2 inverseaz\u0103 ponderile, iar 14 e doar suma mediilor.", "tag": "Media ponderat\u0103"}, {"q": "La un test foarte u\u0219or, majoritatea elevilor au note mari \u0219i doar c\u00e2\u021biva au note foarte mici. Ce rela\u021bie te a\u0219tep\u021bi \u00eentre medie \u0219i median\u0103?", "opts": ["Media mai mic\u0103 dec\u00e2t mediana: asimetrie negativ\u0103", "Media mai mare dec\u00e2t mediana: asimetrie pozitiv\u0103", "Media egal\u0103 cu mediana, c\u0103ci notele sunt de interval", "Media mai mic\u0103 dec\u00e2t mediana: asimetrie pozitiv\u0103"], "correct": 0, "explain": "C\u00e2teva scoruri foarte mici, cu predominan\u021ba celor mari, trag media \u00een jos: X\u0304 < X\u0303, adic\u0103 asimetrie negativ\u0103. Varianta cu rela\u021bia corect\u0103, dar numit\u0103 \u201epozitiv\u0103\u201d, confund\u0103 sensul asimetriei (care urmeaz\u0103 coada distribu\u021biei); nivelul de m\u0103sur\u0103 nu garanteaz\u0103 simetria.", "tag": "Asimetria negativ\u0103"}, {"q": "Satisfac\u021bia clien\u021bilor, pe scala Foarte nemul\u021bumit \u2013 Nemul\u021bumit \u2013 Neutru \u2013 Mul\u021bumit \u2013 Foarte mul\u021bumit. La 10 responden\u021bi, cazurile de mijloc r\u0103spund \u201eNemul\u021bumit\u201d \u0219i \u201eMul\u021bumit\u201d. Ce r\u0103spuns median raportezi?", "opts": ["Nu exist\u0103 median\u0103, pentru c\u0103 cele dou\u0103 cazuri de mijloc difer\u0103", "Mul\u021bumit, r\u0103spunsul mai favorabil dintre cazurile de mijloc", "Neutru, categoria aflat\u0103 \u00eentre cele dou\u0103 cazuri de mijloc", "Nemul\u021bumit, r\u0103spunsul primului dintre cele dou\u0103 cazuri de mijloc"], "correct": 2, "explain": "La date ordinale, ca la exemplul cu cinematograful, orice r\u0103spuns \u00eentre cele dou\u0103 cazuri de mijloc satisface defini\u021bia, iar practic se alege categoria dintre ele (acolo: Rar, \u00eentre Des \u0219i Foarte rar). Dou\u0103 cazuri de mijloc diferite nu anuleaz\u0103 mediana; alegerea unuia dintre ele ar l\u0103sa de o parte mai multe cazuri dec\u00e2t de cealalt\u0103.", "tag": "Mediana la nivel ordinal"}, {"q": "Un magazin a v\u00e2ndut \u00eentr-o s\u0103pt\u0103m\u00e2n\u0103 sacouri cu m\u0103surile 44, 44, 46, 46, 46, 48, 50, 50, 50, 50, 50. Ce m\u0103rime \u00eel intereseaz\u0103 cel mai mult pe director?", "opts": ["Mediana, 48: m\u0103sura aflat\u0103 la mijlocul v\u00e2nz\u0103rilor ordonate", "Modul, 50: m\u0103sura cerut\u0103 cel mai des, de care \u021bine stocul", "Media, \u2248 47,6: rezum\u0103 cel mai fidel toate m\u0103surile v\u00e2ndute", "Media, \u2248 47,6, rotunjit\u0103 la cea mai apropiat\u0103 m\u0103sur\u0103, 48"], "correct": 1, "explain": "Modul arat\u0103 unde e cea mai mare concentrare de cazuri \u2014 m\u0103sura modal\u0103 conteaz\u0103 pentru director mai mult dec\u00e2t mediana. Media nu e semnificativ\u0103 aici: numerele m\u0103surilor sunt conven\u021bionale (puteau fi litere), deci nici rotunjit\u0103 nu cap\u0103t\u0103 sens.", "tag": "Modul \u00een afara mijlocului"}, {"q": "Num\u0103rul de copii din 16 familii: 3 familii au 0 copii, 4 au unul, 7 au doi, 2 au trei. De ce mediana este 2, de\u0219i n e par \u0219i exist\u0103 dou\u0103 cazuri de mijloc?", "opts": ["Pentru c\u0103 2 este num\u0103rul de copii care apare de cele mai multe ori", "Pentru c\u0103 \u00eentre cazurile 8 \u0219i 9 se ia, prin conven\u021bie, scorul mai mare", "Pentru c\u0103 2 se afl\u0103 la mijlocul plajei de valori posibile, de la 0 la 3", "Cazurile 8 \u0219i 9 au am\u00e2ndou\u0103 2 copii: 8 familii au \u2264 2, iar 8 au \u2265 2"], "correct": 3, "explain": "Cele dou\u0103 cazuri de mijloc au acela\u0219i scor, iar \u201esau egale\u201d din defini\u021bie face ca 2 s\u0103 o satisfac\u0103: 8 familii au cel mult 2 copii, 8 au cel pu\u021bin 2. C\u0103 2 e \u0219i modul e o coinciden\u021b\u0103, nu motivul; conven\u021bia pentru cazuri de mijloc diferite e media lor, nu scorul mai mare; mijlocul plajei 0\u20133 ar fi 1,5.", "tag": "De ce \u201esau egale\u201d"}, {"q": "Scorurile 4, 7, 9, 12, 18 au media 10. Un student calculeaz\u0103 abaterile de la medie \u0219i ob\u021bine suma +3. Ce concluzie e corect\u0103?", "opts": ["A gre\u0219it un calcul: suma abaterilor de la medie e mereu zero", "Distribu\u021bia e asimetric\u0103 pozitiv, de aceea suma iese pozitiv\u0103", "Suma e corect\u0103, pentru c\u0103 scorul 18 trage abaterile \u00een sus", "A gre\u0219it doar semnul: suma corect\u0103 a abaterilor ar fi \u22123"], "correct": 0, "explain": "Abaterile sunt \u22126, \u22123, \u22121, +2, +8, cu suma 0 \u2014 \u0219i a\u0219a trebuie s\u0103 fie \u00een orice distribu\u021bie. Asimetria sau un scor extrem schimb\u0103 pozi\u021bia mediei, dar nu \u0219i faptul c\u0103 abaterile de la ea se anuleaz\u0103.", "tag": "Suma abaterilor egal\u0103 cu zero"}, {"q": "Pentru scorurile 2, 4, 9 (media 5), un cercet\u0103tor caut\u0103 valoarea fa\u021b\u0103 de care suma p\u0103tratelor abaterilor este cea mai mic\u0103. Ce g\u0103se\u0219te?", "opts": ["Mediana, 4: e mai central\u0103, nefiind tras\u0103 de scorul 9", "Orice valoare: suma p\u0103tratelor abaterilor e mereu zero", "Media, 5: suma p\u0103tratelor abaterilor fa\u021b\u0103 de ea e 26", "Scorul 2: abaterile fa\u021b\u0103 de el sunt toate pozitive"], "correct": 2, "explain": "Fa\u021b\u0103 de medie: 9 + 1 + 16 = 26; fa\u021b\u0103 de mediana 4: 4 + 0 + 25 = 29; fa\u021b\u0103 de 2: 0 + 4 + 49 = 53. Suma p\u0103tratelor e minim\u0103 fa\u021b\u0103 de medie \u2014 proprietate folosit\u0103 la m\u0103rimile dispersiei, \u00een Cap. 4 (M\u0103rimile dispersiei). Zero e suma abaterilor simple, nu a p\u0103tratelor.", "tag": "Suma p\u0103tratelor abaterilor minim\u0103"}, {"q": "O psiholog\u0103 \u0219colar\u0103 are doar tabelul grupat al scorurilor a 60 de elevi la un test de aten\u021bie: sub intervalul 30\u201334 s-au cumulat 24 de elevi, iar intervalul are 12 (m\u0103rimea 5). Ce median\u0103 aproximativ\u0103 raporteaz\u0103?", "opts": ["32,0", "32,5", "42,0", "34,5"], "correct": 0, "explain": "Cazul de mijloc: 60/2 = 30, al 6-lea din cele 12 ale intervalului; X\u0303 \u2248 29,5 + (30 \u2212 24)/12 \u00b7 5 = 29,5 + 2,5 = 32,0. 32,5 porne\u0219te gre\u0219it de la limita stabilit\u0103 30 \u00een loc de limita real\u0103 29,5; 42,0 uit\u0103 s\u0103 scad\u0103 cele 24 de cazuri cumulate.", "tag": "Mediana pentru date grupate"}, {"q": "Scorurile a 180 de subiec\u021bi, grupate \u00een intervalele 20\u201324, 25\u201329 \u2026 65\u201369, au frecven\u021bele 1, 2, 7, 18, 22, 42, 30, 37, 15, 6. Intervalele 45\u201349 (42) \u0219i 55\u201359 (37) dep\u0103\u0219esc ambele intervalele vecine. Cum descrii modul?", "opts": ["Unimodal\u0103, cu modul 47, singurul interval cu frecven\u021ba maxim\u0103", "Bimodal\u0103, cu modurile 49,5 \u0219i 59,5, limitele lor reale superioare", "Unimodal\u0103, cu modul 56, scorul cel mai frecvent din interval", "Bimodal\u0103, cu modurile 47 \u0219i 57, centrele celor dou\u0103 intervale"], "correct": 3, "explain": "Dup\u0103 defini\u021bia strict\u0103 intervalul modal ar fi doar 45\u201349, dar, ca \u00een exemplul din curs, distribu\u021bia se trateaz\u0103 ca bimodal\u0103, pentru c\u0103 are dou\u0103 intervale neadiacente mai \u00eenalte dec\u00e2t vecinele; modurile sunt centrele lor. 56 e modul scorurilor brute, care nu se poate afla din datele grupate; limitele reale superioare servesc ogivei.", "tag": "Intervalul modal"}, {"q": "Zece angaja\u021bi au la un test de dexteritate scorurile 3, 5, 6, 8, 9, 11, 14, 15, 18, 20. Firma vrea pragul primului sfert (Q1). C\u00e2t este?", "opts": ["5,5", "2,5", "6", "10"], "correct": 2, "explain": "Q1 e valoarea cu cel mult 10 \u00b7 0,25 = 2,5 scoruri sub ea \u0219i cel mult 7,5 peste: doar 6 satisface condi\u021bia (2 sub, 7 peste). 5,5 aplic\u0103 gre\u0219it conven\u021bia mediei a dou\u0103 scoruri (5 are 8 scoruri peste el); 2,5 e num\u0103rul de scoruri, nu valoarea; 10 este mediana.", "tag": "Percentile pe scoruri neagrupate"}, {"q": "Un candidat a luat 62 la un concurs cu 200 de candida\u021bi. \u00cen tabelul grupat, intervalul 60\u201364 (limite reale 59,5\u201364,5) are 20 de candida\u021bi, iar sub el s-au cumulat 140. Ce rang al percentilei are scorul lui?", "opts": ["70", "80", "75", "74"], "correct": 2, "explain": "(62 \u2212 59,5)/5 = 0,5, deci 20 \u00b7 0,5 = 10 cazuri din interval au scoruri \u2264 62; RP62 = (140 + 10)/200 \u00b7 100 = 75. 70 num\u0103r\u0103 doar cazurile de sub interval, 80 num\u0103r\u0103 tot intervalul, iar 74 porne\u0219te de la limita stabilit\u0103 60 \u00een loc de 59,5.", "tag": "Rangul percentilei"}, {"q": "Sondaj despre mijlocul de transport: autobuz 45, ma\u0219in\u0103 30, biciclet\u0103 15, pe jos 10 (codate 1\u20134). Ce raportezi ca tendin\u021b\u0103 central\u0103?", "opts": ["Mediana: codul 2, ma\u0219ina, la care cad cazurile de mijloc", "Media codurilor, \u2248 1,9, rotunjit\u0103 la categoria ma\u0219in\u0103", "Modul: 45, frecven\u021ba celei mai mari categorii", "Modul: autobuzul, categoria cu cele mai multe cazuri"], "correct": 3, "explain": "Variabila e nominal\u0103 (codurile sunt doar nume, ca \u00een Cap. 1 (Introducere \u00een statistic\u0103)), deci singura m\u0103rime permis\u0103 e modul \u2014 categoria Autobuz. Mediana cere ordonare, media cere intervale egale; iar modul este categoria, nu frecven\u021ba ei (45).", "tag": "Modul la nivel nominal"}, {"q": "Pentru cei 140 de studen\u021bi (86 de b\u0103ie\u021bi cu media 7,33 \u0219i 54 de fete cu media 8,45), un coleg raporteaz\u0103 media 7,89. Unde gre\u0219e\u0219te?", "opts": ["A ponderat invers: 54 la b\u0103ie\u021bi \u0219i 86 la fete, \u00een loc de invers", "A mediat mediile, de\u0219i grupurile au numere diferite de scoruri", "Nu gre\u0219e\u0219te: media celor dou\u0103 medii e corect\u0103 pentru orice grupuri", "A \u00eemp\u0103r\u021bit suma produselor la 140, \u00een loc de num\u0103rul de grupuri"], "correct": 1, "explain": "(7,33 + 8,45)/2 = 7,89 ignor\u0103 c\u0103 b\u0103ie\u021bii sunt mai mul\u021bi; media ponderat\u0103 e (86 \u00b7 7,33 + 54 \u00b7 8,45)/140 = 7,76. Media mediilor e corect\u0103 doar c\u00e2nd grupurile au acela\u0219i num\u0103r de scoruri; \u00eemp\u0103r\u021birea la N = 140 este chiar pasul corect.", "tag": "Eroarea mediei mediilor"}, {"q": "Timpii de reac\u021bie dintr-un experiment au o distribu\u021bie simetric\u0103, cu un singur v\u00e2rf; media este 412 ms. Ce po\u021bi spune, f\u0103r\u0103 alte calcule, despre median\u0103 \u0219i mod?", "opts": ["Au \u0219i ele valoarea de 412 ms", "Mediana e 412 ms, modul e necunoscut", "Sunt mai mici, timpii av\u00e2nd zero natural", "Nu se pot afla f\u0103r\u0103 scorurile brute"], "correct": 0, "explain": "Simetria face ca media \u0219i mediana s\u0103 coincid\u0103, iar unimodalitatea adaug\u0103 \u0219i modul \u00een acela\u0219i punct. Zeroul natural al timpului \u021bine de nivelul de raport, nu de forma distribu\u021biei; scorurile brute nu sunt necesare c\u00e2nd forma e cunoscut\u0103.", "tag": "Distribu\u021bia simetric\u0103"}, {"q": "Un cercet\u0103tor are doar tabelul grupat al unor timpi de reac\u021bie \u0219i ob\u021bine media 412 ms din centrele intervalelor. Un coleg cu scorurile brute g\u0103se\u0219te 409 ms. Ce explic\u0103 diferen\u021ba?", "opts": ["Unul a gre\u0219it, mediile ar trebui s\u0103 coincid\u0103", "Centrele trebuiau ponderate cu limitele reale", "Scorurile nu stau de fapt \u00een centrul intervalelor", "Datele grupate supraestimeaz\u0103 mereu media"], "correct": 2, "explain": "Media pentru date grupate presupune c\u0103 toate scorurile unui interval stau \u00een centrul lui; scorurile reale se abat de la el, deci rezultatul e o aproximare (\u00een curs: 49,25 fa\u021b\u0103 de 49,22). Diferen\u021ba nu e o gre\u0219eal\u0103 de calcul \u0219i nu are un sens fix \u2014 poate ie\u0219i \u0219i sub media real\u0103.", "tag": "Media pentru date grupate"}, {"q": "Zilele de concediu medical pe an ale celor 200 de angaja\u021bi: cei mai mul\u021bi au 0\u20133 zile, c\u00e2\u021biva peste 60. HR vrea un num\u0103r pentru \u201eangajatul tipic\u201d \u0219i unul din care s\u0103 estimeze totalul zilelor. Ce folose\u0219te?", "opts": ["Mediana pentru angajatul tipic, media pentru total", "Media pentru ambele, zilele fiind date de raport", "Mediana pentru ambele, fiind rezistent\u0103 la extreme", "Modul pentru angajatul tipic, mediana pentru total"], "correct": 0, "explain": "Distribu\u021bia are asimetrie pozitiv\u0103: c\u00e2\u021biva angaja\u021bi cu foarte multe zile trag media \u00een sus, a\u0219a c\u0103 mediana descrie mai bine cazul tipic. Pentru total \u00eens\u0103 conteaz\u0103 toate zilele: media \u00eenmul\u021bit\u0103 cu n red\u0103 suma (\u03a3X = n \u00b7 X\u0304) \u2014 interpretare care decurge din formula mediei. Mediana nu poate reconstitui totalul.", "tag": "Asimetria pozitiv\u0103"}, {"q": "Scoruri grupate, n = 120: sub intervalul 40\u201344 s-au cumulat 80 de cazuri, iar intervalul are 20 (limite reale 39,5\u201344,5). C\u00e2t este percentila 75?", "opts": ["42,5", "62,0", "44,5", "42,0"], "correct": 3, "explain": "P75 cere cazul 120 \u00b7 0,75 = 90, al 10-lea din cele 20 ale intervalului: 39,5 + (90 \u2212 80)/20 \u00b7 5 = 42,0. 42,5 porne\u0219te de la limita stabilit\u0103 40; 62,0 uit\u0103 s\u0103 scad\u0103 cele 80 de cazuri cumulate; 44,5 e doar limita superioar\u0103 a intervalului.", "tag": "Percentile pentru date grupate"}, {"q": "\u0218ase participan\u021bi au scorurile 4, 7, 9, 12, 15, 18. Un student raporteaz\u0103 modul 4, \u201eprimul scor din list\u0103\u201d. Ce \u00eei r\u0103spunzi?", "opts": ["Modul e 10,5, valoarea aflat\u0103 la mijlocul \u0219irului", "Mul\u021bimea nu are mod: fiecare scor apare o dat\u0103", "Corect: cel mai mic scor e considerat mereu modul", "Mul\u021bimea are \u0219ase moduri, c\u00e2te unul pentru fiecare"], "correct": 1, "explain": "Modul e scorul care apare de cele mai multe ori; c\u00e2nd toate scorurile apar de acela\u0219i num\u0103r de ori, mul\u021bimea nu are mod. 10,5 e mediana; \u201e\u0219ase moduri\u201d e gre\u0219eala celui care \u0219tie c\u0103 pot exista mai multe moduri, dar uit\u0103 c\u0103 un mod trebuie s\u0103 apar\u0103 mai des dec\u00e2t celelalte scoruri.", "tag": "Mul\u021bimi unimodale \u0219i multimodale"}, {"q": "Mediana unui test de anxietate, calculat\u0103 din date grupate pentru 180 de subiec\u021bi, a ie\u0219it 49,26. Cum o raportezi corect?", "opts": ["Exact 90 de subiec\u021bi au ob\u021binut scorul 49,26", "Cam jum\u0103tate din subiec\u021bi au sub 49,26, jum\u0103tate peste", "49,26 e scorul ob\u021binut de cei mai mul\u021bi subiec\u021bi", "Media scorurilor este \u0219i ea, obligatoriu, 49,26"], "correct": 1, "explain": "Mediana grupat\u0103 e o aproximare a punctului de mijloc: aproximativ jum\u0103tate din subiec\u021bi au sub 49,26, jum\u0103tate peste. Scorurile fiind \u00eentregi, nimeni nu are exact 49,26; scorul cel mai frecvent e modul; media coincide cu mediana doar la distribu\u021bii simetrice.", "tag": "Mediana pentru date grupate"}]}]}, {"nr": 4, "titlu": "M\u0103rimile dispersiei", "harta": {"centru": "M\u0103rimile dispersiei", "ramuri": [{"titlu": "Ce m\u0103soar\u0103 dispersia", "noduri": [{"t": "M\u0103rimile dispersiei", "d": "M\u0103rimi statistice care furnizeaz\u0103 informa\u021bie despre eterogenitatea sau varietatea unei distribu\u021bii de scoruri."}, {"t": "Tendin\u021ba central\u0103 nu ajunge", "d": "Media, mediana \u0219i modul, din Cap. 3 (M\u0103rimile tendin\u021bei centrale), nu epuizeaz\u0103 informa\u021bia: dou\u0103 e\u0219antioane de v\u00e2rste au aceea\u0219i median\u0103 (23), dar amplitudini de 26 \u0219i 11 ani. Pentru descrierea complet\u0103 a unei distribu\u021bii e nevoie \u0219i de dispersie."}], "tabel": {"cap": ["M\u0103rime", "Formula", "Ce folose\u0219te din distribu\u021bie", "Avantaj / limit\u0103"], "randuri": [["IQV", "k(n\u00b2 \u2212 \u03a3f\u00b2) / [n\u00b2(k \u2212 1)]", "frecven\u021bele celor k categorii", "merge la nivel nominal; 0 = nicio varia\u021bie, 1 = maxim\u0103"], ["Amplitudinea A", "Xmax \u2212 Xmin", "doar cele dou\u0103 scoruri extreme", "rapid\u0103; sensibil\u0103 la extreme, tace despre scorurile dintre ele"], ["Amplitudinea intercuartilic\u0103 Q", "Q3 \u2212 Q1", "dou\u0103 scoruri: Q1 \u0219i Q3 (50% centrale)", "evit\u0103 extremele; tot nu descrie scorurile dintre ele"], ["Abaterea medie d\u0304", "\u03a3|Xi \u2212 X\u0304| / n", "toate scorurile, fa\u021b\u0103 de medie", "ocole\u0219te \u03a3(Xi \u2212 X\u0304) = 0 prin valori absolute"], ["Varian\u021ba s\u00b2, \u03c3\u00b2", "\u03a3(Xi \u2212 X\u0304)\u00b2 / (n \u2212 1); \u03a3(Xi \u2212 \u03bc)\u00b2 / N", "toate scorurile, fa\u021b\u0103 de medie", "unitatea scorurilor la p\u0103trat"], ["Abaterea standard s, \u03c3", "\u221as\u00b2", "toate scorurile, fa\u021b\u0103 de medie", "\u00een aceea\u0219i unitate ca scorurile"], ["Coeficientul de varia\u021bie CV", "(s / X\u0304) \u00b7 100", "abaterea standard \u0219i media", "compar\u0103 distribu\u021bii cu medii sensibil diferite"]]}}, {"titlu": "Indicele varia\u021biei calitative", "noduri": [{"t": "Indicele varia\u021biei calitative (IQV)", "d": "Raportul dintre varia\u021bia observat\u0103 efectiv \u00eentr-o distribu\u021bie \u0219i varia\u021bia maxim posibil\u0103 pentru acea distribu\u021bie (Index of Qualitative Variation). Ia valori de la 0,00 (varia\u021bie nul\u0103) la 1,00 (varia\u021bie maxim\u0103)."}, {"t": "Formula IQV", "d": "IQV = k(n\u00b2 \u2212 \u03a3f\u00b2) / [n\u00b2(k \u2212 1)], cu k = num\u0103rul de categorii, n = num\u0103rul total de cazuri, \u03a3f\u00b2 = suma p\u0103tratelor frecven\u021belor. Cartea o numeroteaz\u0103 \u201eFormula 3.7\u201d (sc\u0103pare; urm\u0103toarea formul\u0103 din unitate este 4.2)."}, {"t": "Colectivit\u0103\u021bile A, B, C", "d": "Eterogenitatea religioas\u0103 (n = 90, k = 3, numitor 16200): A 90/0/0 \u2192 \u03a3f\u00b2 = 8100 \u2192 IQV = 0; B 60/20/10 \u2192 4100 \u2192 0,74; C 30/30/30 \u2192 2700 \u2192 1,00. Indicele confirm\u0103 ce se vede din tabel: A omogen\u0103, C cea mai eterogen\u0103."}, {"t": "Domeniul de aplicare al IQV", "d": "Se folose\u0219te \u00een mod obi\u0219nuit la variabile nominale; poate fi folosit \u0219i la celelalte niveluri de m\u0103sur\u0103 dac\u0103 scorurile sunt grupate \u00een distribu\u021bii de frecven\u021be."}], "figuri": [{"titlu": "IQV \u00een cele trei colectivit\u0103\u021bi (tabelul 4.1)", "nota": "Cu c\u00e2t frecven\u021bele sunt mai egal \u00eemp\u0103r\u021bite, cu at\u00e2t \u03a3f\u00b2 scade \u0219i IQV cre\u0219te spre 1.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 168\" role=\"img\" aria-label=\"Trei colectivit\u0103\u021bi de c\u00e2te 90 de persoane: A omogen\u0103 (IQV 0), B intermediar\u0103 (0,74), C cu varia\u021bie maxim\u0103 (1,00)\" font-family=\"Georgia, serif\" font-size=\"13\"><rect x=\"12.0\" y=\"8.0\" width=\"10.0\" height=\"10.0\" fill=\"#2a78d6\"></rect><text x=\"26.0\" y=\"17.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">Cre\u0219tin-ortodox</text><rect x=\"133.0\" y=\"8.0\" width=\"10.0\" height=\"10.0\" fill=\"#eb6834\"></rect><text x=\"147.0\" y=\"17.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">Catolic</text><rect x=\"204.4\" y=\"8.0\" width=\"10.0\" height=\"10.0\" fill=\"#1baf7a\"></rect><text x=\"218.4\" y=\"17.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">Altele</text><text x=\"26.0\" y=\"49.0\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"12.0\">A</text><rect x=\"34.0\" y=\"34.0\" width=\"190.0\" height=\"22.0\" fill=\"#2a78d6\" stroke=\"#ffffff\" stroke-width=\"1\"><title>Colectivitatea A, Cre\u0219tin-ortodox: 90</title></rect><text x=\"129.0\" y=\"49.0\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"10.8\">90</text><text x=\"232.0\" y=\"44.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"12.0\">IQV = 0</text><text x=\"232.0\" y=\"57.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.2\">\u03a3f\u00b2 = 8100</text><text x=\"26.0\" y=\"89.0\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"12.0\">B</text><rect x=\"34.0\" y=\"74.0\" width=\"126.7\" height=\"22.0\" fill=\"#2a78d6\" stroke=\"#ffffff\" stroke-width=\"1\"><title>Colectivitatea B, Cre\u0219tin-ortodox: 60</title></rect><text x=\"97.3\" y=\"89.0\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"10.8\">60</text><rect x=\"160.7\" y=\"74.0\" width=\"42.2\" height=\"22.0\" fill=\"#eb6834\" stroke=\"#ffffff\" stroke-width=\"1\"><title>Colectivitatea B, Catolic: 20</title></rect><text x=\"181.8\" y=\"89.0\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"10.8\">20</text><rect x=\"202.9\" y=\"74.0\" tru date grupate", "d": "Se aproximeaz\u0103 prin limita real\u0103 superioar\u0103 a ultimului interval minus limita real\u0103 inferioar\u0103 a primului (intervale \u00een ordine cresc\u0103toare): A \u2248 LCRSmax \u2212 LCRImin = 69,5 \u2212 19,5 = 50."}, {"t": "Limitele amplitudinii", "d": "\u021aine seama doar de scorurile extreme, care pot fi foarte dep\u0103rtate de cele intermediare; nu spune nimic despre scorurile dintre ele (grupate \u00een centru, \u00eempr\u0103\u0219tiate omogen, concentrate l\u00e2ng\u0103 extreme \u2014 distribu\u021bie bimodal\u0103)."}, {"t": "Amplitudinea relativ\u0103 (A%)", "d": "A% = A / X\u0304 \u00b7 100. Nu are \u00eentotdeauna sens intuitiv la aprecierea omogenit\u0103\u021bii unei singure distribu\u021bii: pentru e\u0219antionul 1 de v\u00e2rste, A% = 26 / 23,57 \u00b7 100 \u2248 110%."}]}, {"titlu": "Amplitudinea intercuartilic\u0103", "noduri": [{"t": "Amplitudinea intercuartilic\u0103 (Q)", "d": "Q = Q3 \u2212 Q1, pentru scoruri ordonate cresc\u0103tor; Q1 = P25 \u0219i Q3 = P75 (percentilele din Cap. 3 (M\u0103rimile tendin\u021bei centrale)). Pentru 2, 4, 4, 5, 7, 8, 10, 12, 17, 18, 18, 21, 27, 29, 30: A = 28, Q = 21 \u2212 5 = 16."}, {"t": "Cele 50% de cazuri centrale", "d": "Q ia \u00een considerare jum\u0103tatea central\u0103 a cazurilor \u0219i evit\u0103 astfel problema scorurilor extreme. Dar, ca \u0219i A, folose\u0219te doar dou\u0103 scoruri, deci nu descrie scorurile dintre ele."}, {"t": "Compara\u021bia rapid\u0103 a dou\u0103 distribu\u021bii", "d": "A \u0219i Q sunt utile pentru o m\u0103sur\u0103 rapid\u0103 a variabilit\u0103\u021bii \u0219i mai ales pentru compararea a dou\u0103 distribu\u021bii cu num\u0103r egal de scoruri. V\u00e2rste: X\u0304 = 23,57 \u0219i 22,86, mediana 23 \u00een ambele, A = 26 fa\u021b\u0103 de 11 \u2192 primul e\u0219antion e mai eterogen."}], "figuri": [{"titlu": "Amplitudinea \u0219i amplitudinea intercuartilic\u0103", "nota": "A depinde doar de cele dou\u0103 extreme; Q r=\"end\" fill=\"#6b6760\" font-size=\"10.2\">23</text><rect x=\"148.0\" y=\"113.0\" width=\"96.0\" height=\"9.0\" fill=\"#eb6834\"><title>scorul 23: abatere +4</title></rect><text x=\"250.0\" y=\"120.6\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.2\">+4</text><text x=\"40.0\" y=\"131.6\" text-anchor=\"end\" fill=\"#6b6760\" font-size=\"10.2\">23</text><rect x=\"148.0\" y=\"124.0\" width=\"96.0\" height=\"9.0\" fill=\"#eb6834\"><title>scorul 23: abatere +4</title></rect><text x=\"250.0\" y=\"131.6\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.2\">+4</text><text x=\"40.0\" y=\"142.6\" text-anchor=\"end\" fill=\"#6b6760\" font-size=\"10.2\">23</text><rect x=\"148.0\" y=\"135.0\" width=\"96.0\" height=\"9.0\" fill=\"#eb6834\"><title>scorul 23: abatere +4</title></rect><text x=\"250.0\" y=\"142.6\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.2\">+4</text><line x1=\"148.0\" y1=\"20.0\" x2=\"148.0\" y2=\"147.0\" stroke=\"#2c2a26\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><text x=\"148.0\" y=\"159.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.8\">X\u0304 = 19</text><text x=\"160.0\" y=\"177.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.8\">\u03a3(Xi \u2212 X\u0304) = \u221212 + 12 = 0</text><text x=\"160.0\" y=\"192.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.8\">\u03a3|Xi \u2212 X\u0304| = 24  \u00b7  \u03a3(Xi \u2212 X\u0304)\u00b2 = 74</text><text x=\"160.0\" y=\"207.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.8\">d\u0304 = 24 / 11  \u00b7  s\u00b2 = 74 / 10 = 7,40  \u00b7  s = 2,72</text></svg>"}]}, {"titlu": "Formule de calcul simplificat", "noduri": [{"t": "Formula 4.5", "d": "s\u00b2 = (\u03a3Xi\u00b2 \u2212 nX\u0304\u00b2) / (n \u2212 1), f\u0103r\u0103 diferen\u021bele Xi \u2212 X\u0304. Tabelul 4.2: (4045 \u2212 11 \u00b7 19\u00b2) / 10 = (4045 \u2212 3971) / 10 = 7,40."}, {"t": "Formula 4.6", "d": "s\u00b2 = [\u03a3Xi\u00b2 \u2212 (\u03a3Xi)\u00b2 / n] / (n \u2212 1). Scute\u0219te \u0219i de calculul mediei: cere doar scorurile (\u03a3Xi = 209, \u03a3Xi\u00b2 = 4045, n = 11) \u2192 (4045 \u2212 3971) / 10 = 7,40."}, {"t": "Formule echivalente algebric", "d": "Dou\u0103 formule care, aplicate la acelea\u0219i date, produc acelea\u0219i rezultate. Formulele simplificate sunt utile la e\u0219antioane mari \u0219i c\u00e2nd X\u0304 are zecimale (multe rotunjiri)."}, {"t": "Formulele pentru popula\u021bii", "d": "Se ob\u021bin din cele de mai sus \u00eenlocuind X\u0304 cu \u03bc \u0219i n \u2212 1 cu N."}]}, {"titlu": "Abaterea standard \u0219i coeficientul de varia\u021bie", "noduri": [{"t": "Unitatea varian\u021bei", "d": "Ridicarea la p\u0103trat face ca unitatea varian\u021bei s\u0103 fie p\u0103tratul unit\u0103\u021bii scorurilor: scoruri \u00een ani \u2192 varian\u021b\u0103 \u00een ani la p\u0103trat."}, {"t": "Abaterea standard", "d": "s = \u221as\u00b2 (\u03c3 la popula\u021bie), exprimat\u0103 \u00een aceea\u0219i unitate ca scorurile. Tabelul 4.2: \u221a7,40 = 2,72. Formulele 4.7\u20134.9 corespund formulelor 4.4\u20134.6, sub radical."}, {"t": "Coeficientul de varia\u021bie (CV)", "d": "CV = (s / X\u0304) \u00b7 100, de obicei \u00een procente (\u03c3 \u0219i \u03bc la popula\u021bii). Cu deosebire util la compararea variabilit\u0103\u021bii unor distribu\u021bii cu medii sensibil diferite. Pentru tabelul 4.2: 2,72 / 19 \u00b7 100 \u2248 14,3% (cartea tip\u0103re\u0219te 143,16 \u2014 virgula e deplasat\u0103)."}]}, {"titlu": "Abaterea standard pentru date grupate", "noduri": [{"t": "Aproximarea sumelor", "d": "Scorurile individuale nu se cunosc, deci \u03a3Xi \u2248 \u03a3fm (ca la media pentru date grupate, Cap. 3 (M\u0103rimile tendin\u021bei centrale)) \u0219i \u03a3Xi\u00b2 \u2248 \u03a3fm\u00b2 (centrele la p\u0103trat, \u00eenmul\u021bite cu frecven\u021bele). Rezultatul e doar aproximativ."}, {"t": "Formula 4.11", "d": "s \u2248 \u221a{[\u03a3fm\u00b2 \u2212 (\u03a3fm)\u00b2 / n] / (n \u2212 1)}, ob\u021binut\u0103 din formula 4.9 prin aceste substitu\u021bii."}, {"t": "Exemplul cu 180 de scoruri", "d": "Tabelul 4.3: n = 180, \u03a3fm = 8865, (\u03a3fm)\u00b2 / n = 436601,25; cartea d\u0103 \u03a3fm\u00b2 = 452525 \u0219i s \u2248 9,43, fa\u021b\u0103 de 9,00 la datele negrupate. Observa\u021bie: la r\u00e2ndul 30\u201334, 7 \u00b7 1024 = 7168 (cartea: 8428); cu el, \u03a3fm\u00b2 = 451265 \u0219i s \u2248 9,05."}]}]}, "runde": [{"id": "1", "eticheta": "Runda 1 \u00b7 Baz\u0103", "titlu": "Runda 1 \u2014 Concepte de baz\u0103", "desc": "Situa\u021bii scurte: recuno\u0219ti m\u0103rimea potrivit\u0103 sau aplici direct o regul\u0103.", "intrebari": [{"q": "Doi profesori raporteaz\u0103 aceea\u0219i medie la examen, 7,5. Unul spune c\u0103 notele sunt foarte apropiate \u00eentre ele, cel\u0103lalt c\u0103 sunt foarte \u00eempr\u0103\u0219tiate. Ce fel de m\u0103rime ar ar\u0103ta cine are dreptate?", "opts": ["O m\u0103rime a dispersiei, care descrie c\u00e2t de eterogene sunt notele", "O alt\u0103 m\u0103rime a tendin\u021bei centrale, de pild\u0103 mediana notelor", "Procentul de note de trecere din fiecare dintre cele dou\u0103 grupe", "Un coeficient de corela\u021bie calculat \u00eentre notele celor dou\u0103 grupe"], "correct": 0, "explain": "Media spune doar unde e centrul; c\u00e2t de apropiate sau de \u00eempr\u0103\u0219tiate sunt notele descriu m\u0103rimile dispersiei. Mediana e tot tendin\u021b\u0103 central\u0103 (Cap. 3 (M\u0103rimile tendin\u021bei centrale)) \u0219i poate fi aceea\u0219i la ambele grupe, procentele de trecere \u021bin de Cap. 2 (Prezentarea datelor statistice), iar corela\u021bia (Cap. 12 (M\u0103rimi ale corela\u021biei)) leag\u0103 dou\u0103 variabile, nu descrie \u00eempr\u0103\u0219tierea uneia.", "tag": "M\u0103rimile dispersiei"}, {"q": "O sociolog\u0103 vrea s\u0103 compare c\u00e2t de diverse sunt dou\u0103 cartiere dup\u0103 etnia locuitorilor. Ce m\u0103rime a dispersiei poate folosi?", "opts": ["Abaterea standard a etniilor", "Indicele varia\u021biei calitative", "Amplitudinea intercuartilic\u0103", "Coeficientul de varia\u021bie"], "correct": 1, "explain": "Etnia e o variabil\u0103 nominal\u0103 (Cap. 1 (Introducere \u00een statistic\u0103)): nu are medie, ordine sau distan\u021be \u00eentre categorii, deci abaterea standard, cuartilele \u0219i coeficientul de varia\u021bie nu au sens. IQV lucreaz\u0103 doar cu frecven\u021bele categoriilor, de aceea e m\u0103rimea dispersiei pentru nivelul nominal.", "tag": "Domeniul de aplicare al IQV"}, {"q": "Un cercet\u0103tor calculeaz\u0103 indicele varia\u021biei calitative pentru afilierea politic\u0103 dintr-un sat \u0219i ob\u021bine 1,25. Ce concluzie trage?", "opts": ["A gre\u0219it calculul: indicele nu poate dep\u0103\u0219i 1,00", "Satul dep\u0103\u0219e\u0219te varia\u021bia maxim\u0103 teoretic posibil\u0103", "Satul are cu 25% mai mult\u0103 varia\u021bie dec\u00e2t media \u021b\u0103rii", "Valoarea e normal\u0103 dac\u0103 exist\u0103 peste patru partide"], "correct": 0, "explain": "IQV raporteaz\u0103 varia\u021bia observat\u0103 la cea maxim posibil\u0103, deci r\u0103m\u00e2ne \u00eentre 0,00 (nicio varia\u021bie) \u0219i 1,00 (varia\u021bie maxim\u0103), oric\u00e2te categorii ar exista. O valoare peste 1 tr\u0103deaz\u0103 o eroare de calcul, nu o varia\u021bie \u201epeste maxim\u201d.", "tag": "Indicele varia\u021biei calitative (IQV)"}, {"q": "Chestionarul unei clase de 28 de elevi are 4 variante pentru limba matern\u0103, dar to\u021bi elevii au bifat aceea\u0219i limb\u0103. C\u00e2t este indicele varia\u021biei calitative?", "opts": ["1,00 \u2014 varia\u021bia maxim\u0103 posibil\u0103", "0,25 \u2014 o categorie din patru", "Nu se calculeaz\u0103, av\u00e2nd categorii goale", "0,00 \u2014 nu exist\u0103 nicio varia\u021bie"], "correct": 3, "explain": "C\u00e2nd toate cazurile sunt \u00eentr-o singur\u0103 categorie, \u03a3f\u00b2 = n\u00b2, deci num\u0103r\u0103torul k(n\u00b2 \u2212 \u03a3f\u00b2) e 0 \u2014 ca la colectivitatea A din curs, format\u0103 numai din cre\u0219tin-ortodoc\u0219i. Categoriile goale intr\u0103 \u00een k cu frecven\u021ba 0 \u0219i nu \u00eempiedic\u0103 calculul; 0,25 confund\u0103 indicele cu ponderea unei categorii.", "tag": "Colectivit\u0103\u021bile A, B, C"}, {"q": "La o \u00eentrebare cu dou\u0103 variante (da / nu), 50 de responden\u021bi se \u00eempart exact: 25 da \u0219i 25 nu. C\u00e2t este indicele varia\u021biei calitative?", "opts": ["0,50", "0,00", "1,00", "2,00"], "correct": 2, "explain": "k = 2, n = 50, \u03a3f\u00b2 = 625 + 625 = 1250: IQV = 2(2500 \u2212 1250) / [2500 \u00b7 (2 \u2212 1)] = 1,00. \u00cemp\u0103r\u021birea perfect egal\u0103 \u00eentre categorii \u00eenseamn\u0103 varia\u021bie maxim\u0103 (ca la colectivitatea C); 0,50 e propor\u021bia unei categorii, iar 2,00 dep\u0103\u0219e\u0219te limita indicelui.", "tag": "Formula IQV"}, {"q": "V\u00e2rstele participan\u021bilor la un studiu merg de la 19 la 64 de ani. C\u00e2t este amplitudinea v\u00e2rstelor?", "opts": ["45 de ani", "64 de ani", "41,5 ani", "83 de ani"], "correct": 0, "explain": "A = Xmax \u2212 Xmin = 64 \u2212 19 = 45. 64 este doar scorul maxim, 41,5 este mijlocul dintre extreme (o valoare central\u0103, nu o distan\u021b\u0103), iar 83 adun\u0103 extremele \u00een loc s\u0103 le scad\u0103.", "tag": "Amplitudinea (A)"}, {"q": "Timpii de lucru la o sarcin\u0103 sunt grupa\u021bi \u00een intervalele 10\u201314, 15\u201319, \u2026, 35\u201339 de minute; scorurile brute nu se mai cunosc. Ce amplitudine aproximativ\u0103 raportezi?", "opts": ["29 de minute", "30 de minute", "25 de minute", "35 de minute"], "correct": 1, "explain": "Pentru date grupate, A \u2248 limita real\u0103 superioar\u0103 a ultimului interval \u2212 limita real\u0103 inferioar\u0103 a primului = 39,5 \u2212 9,5 = 30 (limitele reale din Cap. 2 (Prezentarea datelor statistice)). 29 folose\u0219te limitele stabilite (39 \u2212 10), 25 centrele (37 \u2212 12), iar 35 scade limitele inferioare ale primului \u0219i ultimului interval.", "tag": "Amplitudinea pentru date grupate"}, {"q": "La un test de memorie, 29 de studen\u021bi ob\u021bin \u00eentre 12 \u0219i 18 puncte, iar unul ob\u021bine 40. Ce problem\u0103 apare dac\u0103 descrii dispersia doar prin amplitudine?", "opts": ["Amplitudinea e umflat\u0103 de un singur scor extrem", "Amplitudinea nu se calculeaz\u0103 pentru 30 de scoruri", "Amplitudinea iese negativ\u0103 din cauza scorului extrem", "Amplitudinea ignor\u0103 tocmai scorul extrem de 40"], "correct": 0, "explain": "A = 40 \u2212 12 = 28, de\u0219i aproape to\u021bi studen\u021bii sunt \u00eentr-o plaj\u0103 de 6 puncte: amplitudinea folose\u0219te doar extremele, iar un extrem dep\u0103rtat de restul o face \u00een\u0219el\u0103toare. Ea nu ignor\u0103 extremul \u2014 tocmai pe el se sprijin\u0103.", "tag": "Limitele amplitudinii"}, {"q": "\u00centr-o distribu\u021bie de scoruri ordonate, prima cuartil\u0103 este 14, mediana 19, iar a treia cuartil\u0103 26. C\u00e2t este amplitudinea intercuartilic\u0103?", "opts": ["7", "5", "40", "12"], "correct": 3, "explain": "Q = Q3 \u2212 Q1 = 26 \u2212 14 = 12. 7 este distan\u021ba dintre a treia cuartil\u0103 \u0219i median\u0103, 5 cea dintre median\u0103 \u0219i prima cuartil\u0103 (fiecare acoper\u0103 doar un sfert din cazuri), iar 40 adun\u0103 cuartilele.", "tag": "Amplitudinea intercuartilic\u0103 (Q)"}, {"q": "Pentru 200 de pacien\u021bi, prima cuartil\u0103 a scorurilor de anxietate este 22, iar a treia este 30. C\u00e2\u021bi pacien\u021bi au, aproximativ, scoruri \u00eentre 22 \u0219i 30?", "opts": ["50", "150", "100", "200"], "correct": 2, "explain": "\u00centre Q1 (P25) \u0219i Q3 (P75) se afl\u0103 jum\u0103tatea central\u0103 a cazurilor: 50% din 200 = 100 (percentilele din Cap. 3 (M\u0103rimile tendin\u021bei centrale)). 50 ar fi un sfert, 150 cei afla\u021bi sub a treia cuartil\u0103, iar 200 to\u021bi pacien\u021bii \u2014 intervalul acoperit de amplitudine.", "tag": "Cele 50% de cazuri centrale"}, {"q": "Un student adun\u0103 abaterile de la medie a 8 scoruri: \u22123, \u22122, \u22122, \u22121, 0, +2, +3, +3, ca s\u0103 m\u0103soare dispersia, \u0219i ob\u021bine 0. Ce s-a \u00eent\u00e2mplat?", "opts": ["Nimic gre\u0219it: abaterile de la medie se anuleaz\u0103 mereu", "A gre\u0219it media, altfel suma ar fi ie\u0219it pozitiv\u0103", "Scorurile sunt identice, deci dispersia e chiar zero", "Distribu\u021bia e simetric\u0103; doar atunci suma iese zero"], "correct": 0, "explain": "Pentru orice distribu\u021bie, suma abaterilor de la medie este 0 (proprietatea mediei din Cap. 3 (M\u0103rimile tendin\u021bei centrale)), simetric\u0103 sau nu \u2014 de aceea suma lor nu poate m\u0103sura dispersia. Scorurile nu sunt identice (abaterile difer\u0103), deci dispersia nu e zero; solu\u021bia sunt valorile absolute sau p\u0103tratele abaterilor.", "tag": "Abaterea de la medie"}, {"q": "Abaterile de la medie ale celor 4 scoruri ale unui e\u0219antion sunt \u22123, \u22121, +1, +3. C\u00e2t este abaterea medie?", "opts": ["0", "2", "5", "2,67"], "correct": 1, "explain": "Se neglijeaz\u0103 semnele: (3 + 1 + 1 + 3) / 4 = 8 / 4 = 2. 0 este media abaterilor luate cu semn, 5 = 20 / 4 este media p\u0103tratelor abaterilor (varian\u021ba ca pentru o popula\u021bie), iar 2,67 \u00eemparte gre\u0219it la n \u2212 1.", "tag": "Abaterea medie"}, {"q": "O cercet\u0103toare are scorurile a 25 de studen\u021bi \u0219i vrea s\u0103 estimeze din ele varian\u021ba \u00eentregii popula\u021bii de studen\u021bi. Ce numitor folose\u0219te?", "opts": ["n = 25, pentru c\u0103 at\u00e2tea scoruri a ob\u021binut", "n \u2212 1 = 24, pentru c\u0103 scorul maxim se exclude", "n \u2212 1 = 24, pentru a corecta distorsiunea estim\u0103rii", "n + 1 = 26, pentru c\u0103 se adaug\u0103 \u0219i media"], "correct": 2, "explain": "Varian\u021ba unui e\u0219antion, calculat\u0103 cu n, e un estimator distorsionat al varian\u021bei popula\u021biei; numitorul n \u2212 1 corecteaz\u0103 distorsiunea (Cap. 7 (Proceduri de estimare statistic\u0103)). Niciun scor nu se exclude; n ar fi potrivit doar dac\u0103 cele 25 de scoruri ar fi chiar toat\u0103 popula\u021bia de interes.", "tag": "Numitorul n \u2212 1"}, {"q": "\u00centr-un experiment, timpii de reac\u021bie sunt m\u0103sura\u021bi \u00een milisecunde, iar varian\u021ba lor iese 400. \u00cen ce unitate este exprimat\u0103 aceast\u0103 valoare?", "opts": ["\u00cen milisecunde, ca timpii", "\u00cen procente din timpul mediu", "F\u0103r\u0103 unitate, fiind un indice", "\u00cen milisecunde la p\u0103trat"], "correct": 3, "explain": "Varian\u021ba ridic\u0103 abaterile la p\u0103trat, deci unitatea ei este p\u0103tratul unit\u0103\u021bii scorurilor (ms\u00b2). Abaterea standard, \u221a400 = 20 ms, readuce unitatea scorurilor; procentele \u021bin de coeficientul de varia\u021bie.", "tag": "Unitatea varian\u021bei"}, {"q": "Un psiholog vrea s\u0103 compare c\u00e2t de variabil este timpul de reac\u021bie simplu (media 250 ms) cu timpul de rezolvare a unui test (media 18 minute). Ce m\u0103rime \u00eei permite compara\u021bia?", "opts": ["Abaterea standard, mai mare la variabila mai variabil\u0103", "Coeficientul de varia\u021bie, s / X\u0304 exprimat \u00een procente", "Varian\u021ba, care pune ambele variabile pe aceea\u0219i scar\u0103", "Amplitudinea, care \u021bine seama doar de extreme"], "correct": 1, "explain": "Mediile sunt foarte diferite (\u0219i unit\u0103\u021bile la fel), iar CV raporteaz\u0103 abaterea standard la medie, d\u00e2nd un procent comparabil \u2014 tocmai situa\u021bia pentru care e recomandat. Abaterea standard \u0219i varian\u021ba depind de m\u0103rimea \u0219i unitatea scorurilor; amplitudinea are aceea\u0219i problem\u0103, plus sensibilitatea la extreme.", "tag": "Coeficientul de varia\u021bie (CV)"}]}, {"id": "2", "eticheta": "Runda 2 \u00b7 Aplica\u021bii", "titlu": "Runda 2 \u2014 Scenarii \u0219i ra\u021bionament", "desc": "Calculezi, alegi m\u0103rimea potrivit\u0103 \u0219i interpretezi rezultatul pe situa\u021bii concrete.", "intrebari": [{"q": "\u00centr-o grup\u0103 de 10 studen\u021bi sunt 8 femei \u0219i 2 b\u0103rba\u021bi. C\u00e2t este indicele varia\u021biei calitative pentru variabila sex?", "opts": ["0,64", "0,80", "0,20", "0,32"], "correct": 0, "explain": "k = 2, n = 10, \u03a3f\u00b2 = 64 + 4 = 68: IQV = 2(100 \u2212 68) / [100 \u00b7 (2 \u2212 1)] = 64 / 100 = 0,64. 0,32 uit\u0103 factorul k din num\u0103r\u0103tor; 0,80 \u0219i 0,20 sunt propor\u021biile femeilor \u0219i b\u0103rba\u021bilor, nu un indice al varia\u021biei.", "tag": "Formula IQV"}, {"q": "La variabila \u201elimba matern\u0103\u201d, grupul X are IQV = 0,15, iar grupul Y are IQV = 0,92. Ce rezult\u0103?", "opts": ["Grupul X este mai eterogen, av\u00e2nd indicele mai mic", "Grupul Y are de \u0219ase ori mai multe limbi dec\u00e2t X", "Grupurile nu se pot compara printr-un astfel de indice", "Grupul Y este mult mai eterogen lingvistic dec\u00e2t X"], "correct": 3, "explain": "IQV aproape de 1 \u00eenseamn\u0103 varia\u021bie apropiat\u0103 de maximul posibil, aproape de 0 \u2014 aproape to\u021bi \u00een aceea\u0219i categorie; exact a\u0219a sunt comparate colectivit\u0103\u021bile A, B, C. Raportul indicilor nu spune c\u00e2te categorii exist\u0103, iar compararea grupurilor e chiar rostul indicelui.", "tag": "Colectivit\u0103\u021bile A, B, C"}, {"q": "Trei comunit\u0103\u021bi de c\u00e2te 90 de persoane: \u00een A to\u021bi sunt ortodoc\u0219i; \u00een B sunt 60 ortodoc\u0219i, 20 catolici, 10 de alte religii; \u00een C c\u00e2te 30 \u00een fiecare categorie. Cum se ordoneaz\u0103 indicii varia\u021biei calitative?", "opts": ["A = 1 (maxim), B la mijloc, C = 0", "A = 0, B la mijloc, C = 1 (maxim)", "B are maximul, av\u00e2nd o categorie dominant\u0103", "To\u021bi sunt egali, av\u00e2nd acela\u0219i n \u0219i k"], "correct": 1, "explain": "\u00cen comunitatea A, cu to\u021bi membrii \u00eentr-o categorie, nu exist\u0103 varia\u021bie: IQV = 0; \u00een   });
  if (D.teste.length) {
    h += '<section id="finale"><div class="finals-intro"><h2>' + esc(U.finalsTitle) + '</h2><p>' + esc(D.finalsDesc) + '</p></div>';
    D.teste.forEach(function(t, k){
      h += '<div class="fq" id="fq' + k + '"><div class="chhead"><h2>' + esc(U.finalWord + (k + 1)) + '</h2>' + topLink() + '</div>'
        + '<div id="body-fq' + k + '">' + finalBody(k) + '</div></div>';
    });
    h += '</section>';
  }
  return h;
}

function zoomOpen(nr, bi, fi){
  var f = findCap(nr).harta.ramuri[bi].figuri[fi], z = document.getElementById('zoom');
  z.innerHTML = '<div class="zbox"><span class="zclose">' + esc(U.zoomClose) + '</span>' + f.svg
    + '<div class="zcap"><b>' + esc(f.titlu) + '</b> ' + esc(f.nota || '') + '</div></div>';
  z.className = 'zoom on';
}
function zoomClose(){ var z = document.getElementById('zoom'); z.className = 'zoom'; z.innerHTML = ''; }
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') zoomClose(); });

function rerender(sec){ var el = document.getElementById('body-' + sec); if (el) el.innerHTML = sectionBody(sec); }
function jump(id){ var el = document.getElementById(id); if (el && el.scrollIntoView) el.scrollIntoView(); }

document.addEventListener('click', function(e){
  var t = e.target;
  while (t && t.getAttribute && !t.getAttribute('data-act')) t = t.parentNode;
  if (!t || !t.getAttribute) return;
  var act = t.getAttribute('data-act'), sec = t.getAttribute('data-sec');
  if (act === 'zoom') return zoomOpen(t.getAttribute('data-nr'), parseInt(t.getAttribute('data-b'), 10), parseInt(t.getAttribute('data-f'), 10));
  if (act === 'unzoom') return zoomClose();
  if (act === 'jump') { e.preventDefault(); return jump(t.getAttribute('data-to')); }
  if (act === 'tab') { S.tab[t.getAttribute('data-nr')] = t.getAttribute('data-t'); rerender(sec); return jump(sec); }
  if (act === 'br') { var k = t.getAttribute('data-k'); S.closed[k] = !S.closed[k]; return rerender('cap' + t.getAttribute('data-nr')); }
  if (act === 'mmall') {
    var nr = t.getAttribute('data-nr'), c = findCap(nr), op = t.getAttribute('data-open') === '1';
    c.harta.ramuri.forEach(function(b, i){ S.closed[nr + '-' + i] = !op; }); return rerender('cap' + nr);
  }
  if (act === 'ans') {
    var key = t.getAttribute('data-k'), qi = parseInt(t.getAttribute('data-qi'), 10);
    S.ans[key] = S.ans[key] || {};
    if (S.ans[key][qi] === undefined) S.ans[key][qi] = parseInt(t.getAttribute('data-oi'), 10);
    return rerender(sec);
  }
  if (act === 'reset') { S.ans[t.getAttribute('data-k')] = {}; S.copied = null; rerender(sec); return jump(sec); }
  if (act === 'copy') {
    var k2 = t.getAttribute('data-k'), ta = document.getElementById('res-' + k2), txt = ta ? ta.value : '';
    var done = function(){ S.copied = k2; rerender(sec); };
    var fallback = function(){ if (ta) ta.select(); try { document.execCommand('copy'); } catch (y) {} done(); };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (x) { fallback(); }
  }
});

window.QZ = { pageHtml: pageHtml, sectionBody: sectionBody, zoomOpen: zoomOpen, data: D, S: S };
document.getElementById('app').innerHTML = pageHtml();
</script>
