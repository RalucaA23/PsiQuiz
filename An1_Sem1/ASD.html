<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analiza superioară a datelor — recapitulare și quiz-uri finale</title>
<style>
  :root { --bg:#f4f1ea; --card:#fff; --ink:#2c2a26; --muted:#6b6760; --accent:#7a5c3e; --soft:#efe6d8;
    --border:#ddd5c7; --optbg:#faf8f3; --ok:#2e7d52; --okbg:#e6f3ec; --bad:#b5453a; --badbg:#f8e9e7; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, 'Times New Roman', serif; background: var(--bg); color: var(--ink); margin: 0; line-height: 1.55; }
  .wrap { max-width: var(--pagew, 960px); margin: 0 auto; padding: 24px 12px 80px; }
  .book { text-align: center; padding: 28px 16px 18px; }
  .book h1 { font-size: 2.1rem; margin: 0; color: var(--accent); }
  .book .sub { color: var(--muted); font-style: italic; margin: 6px 0 0; }
  .toc { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin: 8px 0 28px; }
  .toc h2 { font-size: 1rem; margin: 0 0 10px; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
  .toc ol { margin: 0; padding-left: 22px; columns: 2; column-gap: 28px; }
  .toc li { margin: 3px 0; break-inside: avoid; }
  .toc a { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--border); cursor: pointer; }
  .toc a:hover { color: var(--accent); }
  .toc .todo { color: var(--muted); font-style: italic; }
  .finals { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--soft); border: 1px solid var(--border); color: var(--accent); border-radius: 999px;
    padding: 6px 14px; font-size: .92rem; cursor: pointer; font-family: inherit; }
  .fnotes { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: .8rem; line-height: 1.45; }
  .fnotes b { color: var(--ink); }
  .chsec, .fq { margin: 0 0 38px; scroll-margin-top: 10px; }
  .chhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--accent);
    padding: 0 4px 6px; margin-bottom: 14px; }
  .chhead h2 { margin: 0; font-size: 1.35rem; color: var(--accent); }
  .chhead a { color: var(--muted); font-size: .85rem; white-space: nowrap; cursor: pointer; text-decoration: none; }
  .finals-intro { background: var(--card); border: 2px solid var(--accent); border-radius: 14px; padding: 18px 20px; margin-bottom: 22px; }
  .finals-intro h2 { margin: 0 0 6px; color: var(--accent); }
  .finals-intro p { margin: 0; color: var(--muted); }
  .tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
  .tab { background: var(--card); border: 1px solid var(--border); padding: 8px 16px; border-radius: 999px;
    cursor: pointer; font-family: inherit; font-size: .93rem; color: var(--ink); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .qz { max-width: 740px; margin: 0 auto; }
  .scorebar { position: sticky; top: 0; z-index: 5; background: var(--soft); border: 1px solid var(--border);
    border-radius: 12px; padding: 9px 14px; margin-bottom: 16px; display: flex; justify-content: space-between; }
  .scorebar b { color: var(--accent); }
  .rtitle { font-size: 1.15rem; color: var(--accent); margin: 4px 0 2px; }
  .rdesc { color: var(--muted); font-style: italic; margin: 0 0 16px; font-size: .95rem; }
  .q { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
  .qnum { color: var(--accent); font-weight: bold; font-size: .82rem; letter-spacing: .04em; text-transform: uppercase; }
  .qtext { font-size: 1.05rem; margin: 6px 0 14px; }
  .opt { display: block; width: 100%; text-align: left; background: var(--optbg); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 14px; margin-bottom: 9px; cursor: pointer; font-family: inherit; font-size: 1rem; color: var(--ink); }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--soft); }
  .opt:disabled { cursor: default; }
  .opt.ok { background: var(--okbg); border-color: var(--ok); color: var(--ok); font-weight: bold; }
  .opt.bad { background: var(--badbg); border-color: var(--bad); color: var(--bad); }
  .mark { float: right; font-weight: bold; }
  .explain { padding: 11px 14px; border-radius: 10px; background: var(--soft); border-left: 3px solid var(--accent); font-size: .95rem; }
  .explain b { color: var(--accent); }
  .explain .src { display: block; margin-top: 6px; color: var(--muted); font-size: .85rem; font-style: italic; }
  .final { background: var(--card); border: 2px solid var(--accent); border-radius: 14px; padding: 22px; text-align: center; }
  .final h3 { color: var(--accent); margin: 0 0 6px; }
  .final .pct { font-size: 2.3rem; font-weight: bold; color: var(--accent); }
  .btn { background: var(--accent); color: #fff; border: none; padding: 9px 20px; border-radius: 999px; cursor: pointer;
    font-family: inherit; font-size: .93rem; margin: 8px 4px 0; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .rlabel { font-weight: bold; color: var(--accent); margin-top: 12px; text-align: left; font-size: .95rem; }
  textarea.res { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; background: var(--optbg);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-top: 6px; color: var(--ink); line-height: 1.4; }
  .hint { color: var(--muted); font-size: .85rem; font-style: italic; margin-top: 8px; }
  .mmroot { text-align: center; margin: 0 auto 12px; background: var(--accent); color: #fff; border-radius: 16px;
    padding: 12px 18px; font-size: 1.1rem; font-weight: bold; max-width: 560px; }
  .mmtools { text-align: center; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--mmw, 280px)), 1fr)); gap: 14px; }
  .branch { background: var(--card); border: 1px solid var(--border); border-top: 5px solid var(--bc); border-radius: 14px; padding: 12px 16px; }
  .branch.wide { grid-column: 1 / -1; }
  .bhead { color: var(--bc); font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  .node { margin: 9px 0 0; padding-left: 12px; border-left: 2px solid var(--bc); }
  .node b { display: block; }
  .node span { font-size: .93rem; }
  .tscroll { overflow-x: auto; margin-top: 10px; }
  table.ct { border-collapse: collapse; width: 100%; font-size: .88rem; }
  table.ct th, table.ct td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
  table.ct th { background: var(--soft); }
  .muted { color: var(--muted); font-style: italic; text-align: center; }
  .figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--figw, 250px)), 1fr)); gap: 12px; margin-top: 12px; }
  figure.fig { margin: 0; background: var(--optbg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; cursor: zoom-in; }
  figure.fig:hover { border-color: var(--accent); }
  .zoom { position: fixed; inset: 0; z-index: 50; background: rgba(44,42,38,.78); display: none; align-items: center; justify-content: center; padding: 2vh 2vw; cursor: zoom-out; }
  .zoom.on { display: flex; }
  .zbox { background: var(--card); border-radius: 14px; padding: 14px 18px; width: min(96vw, 1100px); max-height: 96vh; overflow: auto; }
  .zbox svg { width: 100%; height: auto; max-height: 78vh; display: block; }
  .zbox .zcap { color: var(--muted); font-size: .95rem; margin-top: 6px; }
  .zbox .zcap b { color: var(--ink); }
  .zbox .zclose { float: right; color: var(--muted); font-size: .85rem; }
  figure.fig svg { width: 100%; height: auto; display: block; }
  figure.fig figcaption { font-size: .95rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  figure.fig figcaption b { color: var(--ink); display: block; }
  @media (max-width: 560px) { .toc ol { columns: 1; } .book h1 { font-size: 1.7rem; } .wrap { padding: 12px 6px 60px; } }
</style>
</head>

<script>
var D = {"curs": "Analiza superioar\u0103 a datelor", "sursa": "Manual UTM, Facultatea de Psihologie \u00b7 recapitulare pe unit\u0103\u021bi \u0219i quiz-uri finale", "eticheta": "Unitatea", "lista": [{"nr": 1, "titlu": "Introducere \u00een statistic\u0103"}, {"nr": 2, "titlu": "Prezentarea datelor statistice"}, {"nr": 3, "titlu": "M\u0103rimile tendin\u021bei centrale"}, {"nr": 4, "titlu": "M\u0103rimile dispersiei"}, {"nr": 5, "titlu": "Distribu\u021bia normal\u0103"}, {"nr": 6, "titlu": "E\u0219antionarea \u0219i distribu\u021bii de e\u0219antionare"}, {"nr": 7, "titlu": "Proceduri de estimare statistic\u0103"}, {"nr": 8, "titlu": "Testarea ipotezelor despre o singur\u0103 popula\u021bie"}, {"nr": 9, "titlu": "Testarea ipotezelor despre diferen\u021bele dintre dou\u0103 popula\u021bii"}, {"nr": 10, "titlu": "Analiza de varian\u021b\u0103 (ANOVA)"}, {"nr": 11, "titlu": "Teste nonparametrice"}, {"nr": 12, "titlu": "M\u0103rimi ale corela\u021biei"}], "capitole": [{"nr": 1, "titlu": "Introducere \u00een statistic\u0103", "harta": {"centru": "Introducere \u00een statistic\u0103", "ramuri": [{"titlu": "Ce este statistica", "noduri": [{"t": "Defini\u021bia statisticii", "d": "Pentru psiholog, statistica este un set de metode \u0219i tehnici matematice de organizare \u0219i prelucrare a datelor, folosite pentru a r\u0103spunde la \u00eentreb\u0103ri \u0219i a testa ipoteze."}, {"t": "Date", "d": "Informa\u021bii, \u00een principal numerice, despre anumite caracteristici (de exemplu scoruri pe o scal\u0103 de anxietate). Luate ca atare nu \u201espun\u201d mare lucru: trebuie organizate, evaluate \u0219i analizate."}, {"t": "Statistica ca instrument", "d": "Cursul trateaz\u0103 statistica drept \u201einstrument\u201d al psihologului, nu ca scop \u00een sine: at\u00e2ta matematic\u0103 c\u00e2t e nevoie ca s\u0103 \u00een\u021belegi ce face \u0219i cum face statistica."}]}, {"titlu": "Statistica \u00een cercetare", "noduri": [{"t": "Etapele cercet\u0103rii", "d": "1) formularea problemei (din teorii, cercet\u0103ri anterioare, comenzi de cercetare); 2) proiectul: ce cazuri, c\u00e2te \u0219i cum sunt investigate; 3) analiza rezultatelor, unde statistica devine direct important\u0103."}, {"t": "Rolul \u0219i limitele statisticii", "d": "Regula IGIG \u2014 \u201eintroduci gunoaie, ies gunoaie\u201d: dac\u0103 problema e formulat\u0103 gre\u0219it sau proiectul e gre\u0219it, cele mai sofisticate analize sunt lipsite de valoare. Statistica nu \u00eenlocuie\u0219te conceptualizarea riguroas\u0103."}, {"t": "Consumatori de rezultate", "d": "\u0218i cine nu face cercetare (manageri din educa\u021bie, consilieri, psihologi clinicieni) trebuie s\u0103 \u00een\u021beleag\u0103 ce informa\u021bii ofer\u0103 statistica \u0219i ce concluzii permite."}]}, {"titlu": "Opera\u021bii \u0219i numere reale", "noduri": [{"t": "Terminologia opera\u021biilor", "d": "Adunare \u2192 sum\u0103; sc\u0103dere \u2192 diferen\u021b\u0103; \u00eenmul\u021bire \u2192 produs (numerele \u00eenmul\u021bite sunt factori); \u00eemp\u0103r\u021bire \u2192 c\u00e2t (num\u0103r\u0103tor / numitor). X / Y = (X)(1/Y)."}, {"t": "Numere reale \u0219i valoare absolut\u0103", "d": "Numerele reale: toate numerele de la \u2212\u221e la +\u221e (\u00eentregi, frac\u021bii, zecimale). Valoarea absolut\u0103 (modulul) ignor\u0103 semnul: |\u22127| = |+7| = 7."}, {"t": "Reguli ale semnelor", "d": "Adunare cu acela\u0219i semn: aduni modulele \u0219i p\u0103strezi semnul; cu semne opuse: scazi modulele, semnul celui mai mare \u00een modul. Sc\u0103dere: schimbi semnul sc\u0103z\u0103torului \u0219i aduni. \u00cenmul\u021bire/\u00eemp\u0103r\u021bire: acela\u0219i semn \u2192 +, semne diferite \u2192 \u2212."}, {"t": "Propriet\u0103\u021bi ale numerelor reale", "d": "Comutativitatea (ordinea nu conteaz\u0103), asociativitatea (gruparea nu conteaz\u0103), distributivitatea \u00eenmul\u021birii fa\u021b\u0103 de adunare: X(Y + Z) = XY + XZ."}]}, {"titlu": "Indicatori speciali", "noduri": [{"t": "Exponent \u0219i radical", "d": "Exponentul arat\u0103 puterea: X\u00b2 = X \u00b7 X. Radicalul: r\u0103d\u0103cina p\u0103trat\u0103, num\u0103rul care ridicat la p\u0103trat d\u0103 num\u0103rul ini\u021bial; se scrie \u0219i cu exponentul \u00bd: \u221a36 = 36^\u00bd = 6."}, {"t": "Operatorul \u03a3", "d": "\u03a3 (sigma majuscul\u0103) indic\u0103 \u00eensumarea a ceea ce urmeaz\u0103; \u03a3 Xi de la i = 1 la N adun\u0103 de la primul la al N-lea termen. F\u0103r\u0103 indici, \u03a3 adun\u0103 toat\u0103 seria."}, {"t": "Regula 1 a operatorului \u03a3", "d": "Constanta iese \u00een fa\u021ba sumei: \u03a3 C\u00b7Xi = C \u00b7 \u03a3 Xi."}, {"t": "Regula 2 a operatorului \u03a3", "d": "Suma unor sume: \u03a3 (Xi + Yi) = \u03a3 Xi + \u03a3 Yi."}]}, {"titlu": "Concepte de baz\u0103", "noduri": [{"t": "Variabil\u0103, popula\u021bie, e\u0219antion", "d": "Variabila: tr\u0103s\u0103tur\u0103 care \u00ee\u0219i schimb\u0103 valoarea de la caz la caz (sex, v\u00e2rst\u0103, venit). Popula\u021bia: toate cazurile de interes. E\u0219antionul: submul\u021bime strict\u0103 a popula\u021biei, folosit\u0103 c\u00e2nd popula\u021bia e prea mare."}, {"t": "Statistici descriptive vs inferen\u021biale", "d": "Descriptive: prezint\u0103, clasific\u0103 \u0219i \u00eensumeaz\u0103 scorurile unei variabile. Inferen\u021biale: generalizeaz\u0103 de la un e\u0219antion la popula\u021bia din care provine."}]}, {"titlu": "Niveluri de m\u0103sur\u0103", "noduri": [{"t": "Ierarhia nivelurilor", "d": "\u00cen ordinea cresc\u0103toare a complexit\u0103\u021bii: nominal, ordinal, de interval, de raport. Fiecare nivel p\u0103streaz\u0103 propriet\u0103\u021bile celui anterior \u0219i adaug\u0103 una."}, {"t": "Nivelul nominal", "d": "Doar clasificare \u00een categorii; categoriile nu pot fi ordonate, se compar\u0103 doar dup\u0103 num\u0103rul de cazuri (sex, denomina\u021bie religioas\u0103, culoarea ochilor)."}, {"t": "Nivelul ordinal", "d": "Clasificare + ordonare de la inferior la superior, dar distan\u021bele dintre categorii nu sunt precizate (nivelul de \u0219colarizare, categoriile 1\u20136)."}, {"t": "Nivelul de interval", "d": "Plus intervale egale \u00eentre categorii succesive, dar zero arbitrar: nu putem spune \u201ede dou\u0103 ori mai\u2026\u201d (\u00b0C/\u00b0F, anul emiterii unui timbru, scale de personalitate precum stabilitatea emo\u021bional\u0103)."}, {"t": "Nivelul de raport", "d": "Plus un zero natural care reflect\u0103 absen\u021ba caracteristicii, deci rapoartele au sens (vechimea \u00een munc\u0103, venitul, num\u0103rul de copii, anii de c\u0103snicie, temperatura Kelvin)."}, {"t": "Zero arbitrar vs zero natural", "d": "Zero arbitrar = simplu punct de referin\u021b\u0103 (0 \u00b0C nu \u00eenseamn\u0103 lipsa temperaturii). Zero natural = absen\u021ba tr\u0103s\u0103turii (0 K, 0 ani vechime)."}, {"t": "Exemple pe niveluri", "d": "Culoarea ochilor \u2013 nominal; \u0219colarizarea \u2013 ordinal; anul emiterii \u2013 interval; vechimea \u00een munc\u0103 \u2013 raport."}], "tabel": {"cap": ["Nivel", "Clasificare", "Ordonare", "Intervale egale", "Zero natural", "Exemple din carte"], "randuri": [["Nominal", "da", "nu", "nu", "nu", "sex, religie, culoarea ochilor"], ["Ordinal", "da", "da", "nu", "nu", "nivelul de \u0219colarizare"], ["De interval", "da", "da", "da", "nu (arbitrar)", "\u00b0C, anul emiterii, scale de personalitate"], ["De raport", "da", "da", "da", "da", "vechime, venit, nr. de copii, Kelvin"]]}}, {"titlu": "Reguli ale m\u0103sur\u0103rii nominale", "noduri": [{"t": "Regula excluderii", "d": "Categoriile trebuie s\u0103 fie reciproc exclusive. Dou\u0103 erori: categorii care au cazuri comune (suprapunere par\u021bial\u0103) \u0219i categorii \u00een raport de incluziune."}, {"t": "Regula exhaustivit\u0103\u021bii", "d": "O categorie pentru fiecare manifestare a variabilei; de obicei se adaug\u0103 \u201eAl\u021bii/Altele\u201d."}, {"t": "Regula omogenit\u0103\u021bii", "d": "Ce au \u00een comun cazurile dintr-o categorie trebuie s\u0103 conteze mai mult, pentru scopul cercet\u0103rii, dec\u00e2t ce le deosebe\u0219te (aspirina pentru farmacist, cafeaua pentru distribuitorul de cafea)."}, {"t": "Criteriul sensului teoretic", "d": "Clasificarea trebuie s\u0103 serveasc\u0103 explica\u021biei \u0219i \u00een\u021belegerii: \u201ebursuci / non-bursuci\u201d e corect\u0103 formal, dar inutil\u0103."}]}, {"titlu": "Alegerea tehnicii statistice", "noduri": [{"t": "Criteriu necesar, nu suficient", "d": "Nivelul de m\u0103sur\u0103 permite sau exclude o tehnic\u0103, dar nu o impune singur."}, {"t": "Opera\u021bii aritmetice \u0219i nivel de m\u0103sur\u0103", "d": "Adunarea, sc\u0103derea, \u00eenmul\u021birea \u0219i \u00eemp\u0103r\u021birea cer intervale egale: media aritmetic\u0103 are sens doar la interval \u0219i raport, nu la coduri nominale sau ordinale."}, {"t": "Dilema ordinal / interval", "d": "C\u00e2nd nu e clar, se poate presupune nivelul de interval (tehnici mai sofisticate), dar se verific\u0103 prin analize la ambele niveluri; dac\u0103 rezultatele difer\u0103 substan\u021bial, supozi\u021bia se abandoneaz\u0103."}]}]}, "runde": [{"id": "1", "eticheta": "Runda 1 \u00b7 Baz\u0103", "titlu": "Runda 1 \u2014 Concepte de baz\u0103", "desc": "Recunoa\u0219tere: defini\u021bii, termeni, reguli \u0219i exemple din unitate.", "intrebari": [{"q": "Cum define\u0219te cursul statistica, din perspectiva psihologului?", "opts": ["O ramur\u0103 a matematicii pure care studiaz\u0103 propriet\u0103\u021bile numerelor reale", "O metod\u0103 de culegere a datelor prin chestionare, teste \u0219i observa\u021bie", "Un set de metode matematice de organizare \u0219i prelucrare a datelor", "O disciplin\u0103 care formuleaz\u0103 teorii psihologice direct din datele brute"], "correct": 2, "explain": "Statistica este definit\u0103 ca set de metode \u0219i tehnici matematice de organizare \u0219i prelucrare a datelor, cu scopul de a r\u0103spunde la \u00eentreb\u0103ri \u0219i de a testa ipoteze. Culegerea datelor nu \u021bine de statistic\u0103, iar datele brute \u201enu spun\u201d mare lucru f\u0103r\u0103 analiz\u0103.", "tag": "Defini\u021bia statisticii"}, {"q": "Ce subliniaz\u0103 regula IGIG \u2014 \u201eintroduci gunoaie, ies gunoaie\u201d?", "opts": ["Analizele nu pot compensa o problem\u0103 sau un proiect de cercetare gre\u0219it", "Scorurile extreme trebuie eliminate \u00eenainte de orice prelucrare statistic\u0103", "Calculatorul produce erori dac\u0103 datele nu sunt introduse \u00een ordinea corect\u0103", "Statisticile descriptive sunt inutile dac\u0103 nu sunt urmate de cele inferen\u021biale"], "correct": 0, "explain": "IGIG exprim\u0103 limita statisticii: dac\u0103 problema sau proiectul sunt gre\u0219ite, \u201ecele mai sofisticate analize statistice sunt lipsite de valoare\u201d. Statistica nu se poate substitui conceptualiz\u0103rii riguroase.", "tag": "Rolul \u0219i limitele statisticii"}, {"q": "Rezultatul \u00eenmul\u021birii se nume\u0219te \u2026, iar numerele \u00eenmul\u021bite se numesc \u2026", "opts": ["c\u00e2t; num\u0103r\u0103tori", "sum\u0103; termeni", "diferen\u021b\u0103; factori", "produs; factori"], "correct": 3, "explain": "\u00cenmul\u021birea d\u0103 un produs, iar numerele \u00eenmul\u021bite sunt factori. Suma vine din adunare, diferen\u021ba din sc\u0103dere, c\u00e2tul din \u00eemp\u0103r\u021bire (cu num\u0103r\u0103tor \u0219i numitor).", "tag": "Terminologia opera\u021biilor"}, {"q": "C\u00e2t este valoarea absolut\u0103 (modulul) a num\u0103rului \u22127?", "opts": ["\u22127, pentru c\u0103 semnul num\u0103rului se p\u0103streaz\u0103", "7, adic\u0103 valoarea num\u0103rului indiferent de semn", "0, pentru c\u0103 semnul minus anuleaz\u0103 valoarea", "49, adic\u0103 num\u0103rul ridicat la p\u0103trat"], "correct": 1, "explain": "Valoarea absolut\u0103 ignor\u0103 semnul algebric: |\u22127| = |+7| = 7. Ridicarea la p\u0103trat (49) este o alt\u0103 opera\u021bie.", "tag": "Numere reale \u0219i valoare absolut\u0103"}, {"q": "Aplic\u00e2nd regulile cursului, c\u00e2t este (\u221210) \u2212 (\u221225)?", "opts": ["\u221235", "\u221215", "+15", "+35"], "correct": 2, "explain": "La sc\u0103dere se schimb\u0103 semnul sc\u0103z\u0103torului: (\u221210) \u2212 (\u221225) = (\u221210) + (+25). Semnele fiind opuse, scazi modulele (25 \u2212 10 = 15) \u0219i p\u0103strezi semnul celui mai mare \u00een modul: +15.", "tag": "Reguli ale semnelor"}, {"q": "Ce proprietate ilustreaz\u0103 egalitatea 5(\u221210 + 15) = 5(\u221210) + 5 \u00b7 15?", "opts": ["Comutativitatea adun\u0103rii \u0219i a \u00eenmul\u021birii", "Distributivitatea \u00eenmul\u021birii fa\u021b\u0103 de adunare", "Asociativitatea termenilor unei sume", "Regula 2 a operatorului \u00eensum\u0103rii \u03a3"], "correct": 1, "explain": "Produsul unui num\u0103r cu o sum\u0103 este egal cu suma produselor: X(Y + Z) = XY + XZ \u2014 distributivitatea. Comutativitatea schimb\u0103 ordinea, asociativitatea schimb\u0103 gruparea.", "tag": "Propriet\u0103\u021bi ale numerelor reale"}, {"q": "Ce indic\u0103 operatorul \u03a3 (sigma majuscul\u0103)?", "opts": ["\u00censumarea a ceea ce urmeaz\u0103 imediat \u00een expresie", "\u00cenmul\u021birea tuturor termenilor unei serii", "Extragerea r\u0103d\u0103cinii p\u0103trate a unui num\u0103r", "Ridicarea la putere a fiec\u0103rui termen din serie"], "correct": 0, "explain": "\u03a3 este operatorul \u00eensum\u0103rii: \u03a3 Xi de la i = 1 la N adun\u0103 termenii de la primul la al N-lea. Radicalul (\u221a) \u0219i exponentul sunt al\u021bi indicatori speciali.", "tag": "Operatorul \u03a3"}, {"q": "Ce este, \u00een statistic\u0103, un e\u0219antion?", "opts": ["Grupul tuturor cazurilor de care este interesat cercet\u0103torul", "Orice tr\u0103s\u0103tur\u0103 care \u00ee\u0219i poate schimba valoarea de la caz la caz", "Grupul de persoane care au acceptat voluntar s\u0103 r\u0103spund\u0103", "O submul\u021bime strict\u0103 a popula\u021biei de referin\u021b\u0103, selectat\u0103 pentru studiu"], "correct": 3, "explain": "E\u0219antionul este o submul\u021bime strict\u0103 a popula\u021biei, folosit\u0103 c\u00e2nd popula\u021bia e prea mare pentru a fi cercetat\u0103. \u201eToate cazurile de interes\u201d define\u0219te popula\u021bia, iar \u201etr\u0103s\u0103tura care variaz\u0103\u201d define\u0219te variabila.", "tag": "Variabil\u0103, popula\u021bie, e\u0219antion"}, {"q": "La ce folosesc statisticile inferen\u021biale?", "opts": ["La prezentarea, clasificarea \u0219i \u00eensumarea scorurilor unei variabile", "La generaliz\u0103ri despre o popula\u021bie, pe baza studiului unui e\u0219antion", "La descrierea exclusiv\u0103 a variabilelor m\u0103surate la nivel nominal", "La verificarea corectitudinii culegerii datelor din teren"], "correct": 1, "explain": "Statisticile inferen\u021biale trag concluzii despre popula\u021bie din caracteristicile unui e\u0219antion. \u201ePrezint\u0103, clasific\u0103, \u00eensumeaz\u0103\u201d este defini\u021bia statisticilor descriptive.", "tag": "Statistici descriptive vs inferen\u021biale"}, {"q": "Care este ordinea cresc\u0103toare a complexit\u0103\u021bii nivelurilor de m\u0103sur\u0103?", "opts": ["Ordinal, nominal, de raport, de interval", "Nominal, de interval, ordinal, de raport", "Nominal, ordinal, de interval, de raport", "De raport, de interval, ordinal, nominal"], "correct": 2, "explain": "Ierarhia este: nominal (clasificare) \u2192 ordinal (+ ordonare) \u2192 de interval (+ intervale egale) \u2192 de raport (+ zero natural). Fiecare nivel p\u0103streaz\u0103 propriet\u0103\u021bile celui anterior.", "tag": "Ierarhia nivelurilor"}, {"q": "Care dintre urm\u0103toarele NU este un criteriu al m\u0103sur\u0103rii nominale corecte?", "opts": ["Categoriile s\u0103 fie reciproc exclusive", "Categoriile s\u0103 fie exhaustive", "Categoriile s\u0103 fie omogene fa\u021b\u0103 de scopul cercet\u0103rii", "Intervalele dintre categorii s\u0103 fie egale"], "correct": 3, "explain": "M\u0103surarea nominal\u0103 cere excludere reciproc\u0103, exhaustivitate, omogenitate \u0219i sens teoretic. Intervalele egale \u021bin de nivelul de interval \u2014 la nivel nominal categoriile nici m\u0103car nu pot fi ordonate.", "tag": "Reguli ale m\u0103sur\u0103rii nominale"}, {"q": "Ce aduce \u00een plus nivelul de raport fa\u021b\u0103 de nivelul de interval?", "opts": ["Un punct zero natural, care reflect\u0103 absen\u021ba caracteristicii m\u0103surate", "Intervale egale \u00eentre oricare dou\u0103 categorii succesive", "Posibilitatea de a ordona cazurile de la inferior la superior", "Clasificarea cazurilor \u00een categorii reciproc exclusive"], "correct": 0, "explain": "Intervalele egale exist\u0103 deja la nivelul de interval, ordonarea la cel ordinal, clasificarea la cel nominal. Doar zeroul natural (absen\u021ba tr\u0103s\u0103turii) e specific nivelului de raport \u0219i permite afirma\u021bii de tip \u201ede dou\u0103 ori mai mult\u201d.", "tag": "Nivelul de raport"}, {"q": "Care variabil\u0103 poate fi m\u0103surat\u0103 numai la nivel nominal?", "opts": ["Nivelul de \u0219colarizare", "Culoarea ochilor", "Anul emiterii unui timbru", "Vechimea \u00een munc\u0103"], "correct": 1, "explain": "Culoarea ochilor permite doar clasificarea (ca sexul sau denomina\u021bia religioas\u0103). \u0218colarizarea e ordinal\u0103, anul emiterii e de interval, vechimea \u00een munc\u0103 e de raport.", "tag": "Exemple pe niveluri"}, {"q": "R\u0103d\u0103cina p\u0103trat\u0103 a lui 36 se poate scrie \u0219i ca:", "opts": ["36\u00b2", "36 / 2", "36^(1/2)", "2 \u00b7 \u221a36"], "correct": 2, "explain": "R\u0103d\u0103cina p\u0103trat\u0103 poate fi indicat\u0103 prin exponentul frac\u021bional \u00bd: \u221a36 = 36^\u00bd = 6. 36\u00b2 \u00eenseamn\u0103 ridicare la p\u0103trat, iar 36/2 = 18 este o \u00eemp\u0103r\u021bire.", "tag": "Exponent \u0219i radical"}, {"q": "Ce este, \u00een statistic\u0103, o variabil\u0103?", "opts": ["Grupul tuturor cazurilor de care este interesat cercet\u0103torul", "Un num\u0103r fix folosit ca factor constant \u00eentr-o formul\u0103 statistic\u0103", "O submul\u021bime strict\u0103 a popula\u021biei, aleas\u0103 pentru a fi studiat\u0103", "Orice tr\u0103s\u0103tur\u0103 care \u00ee\u0219i poate schimba valoarea de la caz la caz"], "correct": 3, "explain": "Variabila e o tr\u0103s\u0103tur\u0103 care variaz\u0103 de la caz la caz (sex, v\u00e2rst\u0103, venit). \u201eToate cazurile de interes\u201d define\u0219te popula\u021bia, \u201esubmul\u021bimea strict\u0103\u201d define\u0219te e\u0219antionul, iar un num\u0103r fix este o constant\u0103 \u2014 opusul unei variabile.", "tag": "Variabil\u0103, popula\u021bie, e\u0219antion"}]}, {"id": "2", "eticheta": "Runda 2 \u00b7 Aplica\u021bii", "titlu": "Runda 2 \u2014 Scenarii \u0219i ra\u021bionament", "desc": "Situa\u021bii noi: identifici nivelul de m\u0103sur\u0103, regula \u00eenc\u0103lcat\u0103 sau consecin\u021ba logic\u0103.", "intrebari": [{"q": "Un cercet\u0103tor clasific\u0103 participan\u021bii dup\u0103 religie \u00een: \u201eortodox\u201d, \u201ecre\u0219tin\u201d, \u201ecatolic\u201d, \u201ef\u0103r\u0103 religie\u201d, \u201ealtele\u201d. Ce regul\u0103 a m\u0103sur\u0103rii nominale e \u00eenc\u0103lcat\u0103?", "opts": ["Exhaustivitatea, pentru c\u0103 lipsesc unele denomina\u021bii din list\u0103", "Excluderea reciproc\u0103, pentru c\u0103 \u201eortodox\u201d e inclus \u00een \u201ecre\u0219tin\u201d", "Omogenitatea, pentru c\u0103 persoanele f\u0103r\u0103 religie nu au o tr\u0103s\u0103tur\u0103 comun\u0103", "Sensul teoretic, pentru c\u0103 religia nu e o variabil\u0103 psihologic\u0103"], "correct": 1, "explain": "Orice ortodox este \u0219i cre\u0219tin \u2014 categoriile sunt \u00een raport de incluziune, a doua eroare fa\u021b\u0103 de regula excluderii. Exhaustivitatea e acoperit\u0103 de categoria \u201ealtele\u201d, deci varianta cu \u201elipsesc denomina\u021bii\u201d ignor\u0103 aceast\u0103 categorie.", "tag": "Regula excluderii"}, {"q": "Ieri au fost +5 \u00b0C, azi sunt +10 \u00b0C. De ce NU putem spune c\u0103 azi e de dou\u0103 ori mai cald?", "opts": ["Scala Celsius e ordinal\u0103, deci distan\u021bele dintre grade nu sunt egale", "Scala Celsius e de raport, dar raportul se poate calcula corect doar \u00een Fahrenheit", "Afirma\u021bia ar fi corect\u0103 doar pentru diferen\u021be mai mari de 10 grade", "Scala Celsius e de interval: zeroul ei e arbitrar, nu absen\u021ba temperaturii"], "correct": 3, "explain": "Celsius are intervale egale (deci nu e ordinal\u0103), dar 0 \u00b0C e doar un punct de referin\u021b\u0103, nu absen\u021ba temperaturii. F\u0103r\u0103 zero natural, rapoartele nu au sens. Doar scala Kelvin are zero absolut.", "tag": "Zero arbitrar vs zero natural"}, {"q": "Ana are scorul 20, iar Mihai scorul 10 pe o scal\u0103 de stabilitate emo\u021bional\u0103. Este Ana \u201ede dou\u0103 ori mai stabil\u0103 emo\u021bional\u201d?", "opts": ["Nu: scala e de interval, f\u0103r\u0103 zero absolut care s\u0103 indice lipsa tr\u0103s\u0103turii", "Da: scorurile sunt numere, deci raportul dintre ele este interpretabil", "Nu: scala e nominal\u0103, iar scorurile sunt doar etichete ale categoriilor", "Da, cu condi\u021bia ca e\u0219antionul de normare al scalei s\u0103 fie suficient de mare"], "correct": 0, "explain": "Scalele de personalitate sunt exemplul de interval din curs: diferen\u021bele au sens, rapoartele nu, fiindc\u0103 scorul 0 nu \u00eenseamn\u0103 absen\u021ba stabilit\u0103\u021bii emo\u021bionale. Faptul c\u0103 sunt numere nu garanteaz\u0103 un zero natural; m\u0103rimea e\u0219antionului nu schimb\u0103 nivelul de m\u0103sur\u0103.", "tag": "Nivelul de interval"}, {"q": "Nivelul de \u0219colarizare e codat 1\u20136. Un student calculeaz\u0103 media codurilor grupului: 3,4. Unde e problema?", "opts": ["Fiind nominal, nivelul nu permite nici m\u0103car ordonarea categoriilor", "Media e corect\u0103, dar trebuie rotunjit\u0103 la cel mai apropiat cod \u00eentreg", "Fiind ordinal, distan\u021bele dintre coduri nu sunt egale, deci nu le po\u021bi aduna", "Media e legitim\u0103, problema e doar lipsa unei categorii \u201eAltele\u201d"], "correct": 2, "explain": "\u0218colarizarea e ordinal\u0103: putem spune cine are mai mult\u0103 \u0219coal\u0103, dar nu c\u0103 distan\u021ba 2\u21923 egaleaz\u0103 distan\u021ba 3\u21924. Adunarea \u0219i \u00eemp\u0103r\u021birea cer intervale egale, deci media nu e justificat\u0103. Variabila nu e nominal\u0103 \u2014 categoriile se pot ordona.", "tag": "Opera\u021bii aritmetice \u0219i nivel de m\u0103sur\u0103"}, {"q": "Pentru aceea\u0219i popula\u021bie, un distribuitor de medicamente clasific\u0103 oamenii dup\u0103 tipul de aspirin\u0103 folosit, iar unul de cafea \u2014 dup\u0103 tipul de cafea. Ce ilustreaz\u0103 exemplul?", "opts": ["Exhaustivitatea depinde de num\u0103rul de categorii ales", "Omogenitatea categoriilor se judec\u0103 \u00een raport cu scopul cercet\u0103rii", "Excluderea reciproc\u0103 depinde de cine face clasificarea", "Sensul teoretic cere acelea\u0219i categorii pentru orice cercetare"], "correct": 1, "explain": "Categoriile sunt omogene dac\u0103 propriet\u0103\u021bile comune cazurilor sunt mai importante pentru scopul cercet\u0103rii dec\u00e2t cele care le diferen\u021biaz\u0103. Pentru farmacist conteaz\u0103 aspirina, pentru distribuitorul de cafea \u2014 cafeaua. Exemplul arat\u0103 exact aceast\u0103 relativitate fa\u021b\u0103 de scop.", "tag": "Regula omogenit\u0103\u021bii"}, {"q": "Variabila \u201enum\u0103rul de copii dintr-o familie\u201d: la ce nivel e m\u0103surat\u0103 \u0219i ce afirma\u021bie e permis\u0103?", "opts": ["Raport: o familie cu 4 copii are de dou\u0103 ori mai mul\u021bi copii dec\u00e2t una cu 2", "Interval: putem face diferen\u021be, dar nu rapoarte, pentru c\u0103 zeroul e arbitrar", "Ordinal: familiile pot fi ordonate, dar distan\u021bele dintre ele nu sunt egale", "Nominal: num\u0103rul de copii func\u021bioneaz\u0103 doar ca etichet\u0103 a familiei"], "correct": 0, "explain": "0 copii \u00eenseamn\u0103 absen\u021ba copiilor \u2014 un zero natural, deci nivel de raport, unde rapoartele au sens. Varianta \u201ede interval\u201d presupune gre\u0219it un zero arbitrar; num\u0103rul de copii e citat explicit \u00een curs printre variabilele de raport.", "tag": "Nivelul de raport"}, {"q": "Clasificarea universului \u00een \u201ebursuci\u201d \u0219i \u201enon-bursuci\u201d are categorii exclusive \u0219i exhaustive. De ce e totu\u0219i inacceptabil\u0103?", "opts": ["\u00cencalc\u0103 excluderea, pentru c\u0103 unele obiecte ar intra \u00een ambele clase", "\u00cencalc\u0103 exhaustivitatea, pentru c\u0103 unele obiecte nu intr\u0103 \u00een nicio clas\u0103", "Este acceptabil\u0103, pentru c\u0103 respect\u0103 primele trei reguli ale m\u0103sur\u0103rii", "Nu are sens teoretic: categoriile nu servesc explica\u021biei \u0219i \u00een\u021belegerii"], "correct": 3, "explain": "Al patrulea criteriu cere ca o clasificare s\u0103 aib\u0103 sens teoretic. Logic, \u201ebursuc / non-bursuc\u201d e impecabil (exclusiv \u0219i exhaustiv), dar nu aduce nimic cunoa\u0219terii. Respectarea regulilor formale nu e suficient\u0103.", "tag": "Criteriul sensului teoretic"}, {"q": "Cursul spune c\u0103 nivelul de m\u0103sur\u0103 e un criteriu \u201enecesar, nu \u0219i suficient\u201d pentru alegerea tehnicii. Ce rezult\u0103 de aici?", "opts": ["Orice variabil\u0103 de interval trebuie analizat\u0103 cu media aritmetic\u0103", "O variabil\u0103 nominal\u0103 poate fi mediat\u0103 dac\u0103 ipoteza cercet\u0103rii o cere", "Media e permis\u0103 la interval, dar asta nu arat\u0103 c\u0103 e tehnica potrivit\u0103", "Nivelul de m\u0103sur\u0103 devine irelevant dac\u0103 e\u0219antionul este suficient de mare"], "correct": 2, "explain": "\u201eNecesar\u201d \u00eenseamn\u0103 c\u0103 f\u0103r\u0103 nivelul potrivit tehnica e exclus\u0103 (media nominal\u0103 nu se poate calcula). \u201eNu suficient\u201d \u00eenseamn\u0103 c\u0103 nivelul potrivit doar permite tehnica, nu o impune. Varianta cu \u201etrebuie\u201d transform\u0103 o condi\u021bie necesar\u0103 \u00eentr-una suficient\u0103.", "tag": "Criteriu necesar, nu suficient"}, {"q": "Nu e clar dac\u0103 o scal\u0103 de atitudini e ordinal\u0103 sau de interval. Ce procedur\u0103 recomand\u0103 cursul?", "opts": ["O tratezi ca nominal\u0103, pentru siguran\u021b\u0103, renun\u021b\u00e2nd la ordonare", "Presupui intervalul, dar compari analizele la ambele niveluri", "Presupui intervalul f\u0103r\u0103 verificare, pentru c\u0103 permite tehnici mai sofisticate", "O tratezi ca scal\u0103 de raport, ca s\u0103 po\u021bi face \u0219i afirma\u021bii despre propor\u021bii"], "correct": 1, "explain": "Cursul spune c\u0103 e util s\u0103 presupui intervalul (tehnici mai sofisticate), dar decizia nu e lipsit\u0103 de riscuri: compari analizele la ambele niveluri, iar dac\u0103 rezultatele difer\u0103 substan\u021bial, abandonezi supozi\u021bia. Varianta \u201ef\u0103r\u0103 verificare\u201d p\u0103streaz\u0103 avantajul, dar ignor\u0103 tocmai riscul.", "tag": "Dilema ordinal / interval"}, {"q": "Pentru patru scoruri \u0219tim c\u0103 \u03a3 Xi = 15. C\u00e2t este \u03a3 3Xi, f\u0103r\u0103 a \u00eenmul\u021bi fiecare scor?", "opts": ["18", "45", "60", "225"], "correct": 1, "explain": "Regula 1: constanta iese \u00een fa\u021ba sumei, \u03a3 C\u00b7Xi = C \u00b7 \u03a3 Xi = 3 \u00b7 15 = 45. 18 ar \u00eensemna adunarea constantei (15 + 3), nu \u00eenmul\u021birea.", "tag": "Regula 1 a operatorului \u03a3"}, {"q": "Pentru dou\u0103 serii de c\u00e2te 4 numere, \u03a3 Xi = 11 \u0219i \u03a3 Yi = 27. C\u00e2t este \u03a3 (Xi + Yi)?", "opts": ["297", "16", "27", "38"], "correct": 3, "explain": "Regula 2: suma sumelor este egal\u0103 cu suma fiec\u0103rei serii, adunate: \u03a3(Xi + Yi) = \u03a3 Xi + \u03a3 Yi = 11 + 27 = 38. 297 ar fi produsul sumelor, 16 diferen\u021ba lor.", "tag": "Regula 2 a operatorului \u03a3"}, {"q": "Un psiholog testeaz\u0103 200 de studen\u021bi ai unei universit\u0103\u021bi \u0219i trage concluzii despre to\u021bi studen\u021bii acelei universit\u0103\u021bi. Ce fel de statistic\u0103 folose\u0219te?", "opts": ["Descriptiv\u0103: rezum\u0103 scorurile celor 200 de studen\u021bi testa\u021bi", "Descriptiv\u0103: e\u0219antionul e destul de mare ca s\u0103 descrie toat\u0103 universitatea", "Inferen\u021bial\u0103: generalizeaz\u0103 de la un e\u0219antion la popula\u021bia de referin\u021b\u0103", "Niciuna: concluziile despre popula\u021bie cer testarea tuturor studen\u021bilor"], "correct": 2, "explain": "Trecerea de la e\u0219antion (200) la popula\u021bie (to\u021bi studen\u021bii) e chiar defini\u021bia statisticii inferen\u021biale. M\u0103rimea e\u0219antionului nu transform\u0103 inferen\u021ba \u00een descriere, iar tocmai pentru c\u0103 popula\u021biile sunt prea mari se lucreaz\u0103 cu e\u0219antioane.", "tag": "Statistici descriptive vs inferen\u021biale"}, {"q": "Un chestionar \u00eentreab\u0103 \u201eC\u00e2te ore dormi pe noapte?\u201d, cu variantele \u201esub 5\u201d, \u201e5\u20137\u201d, \u201e7\u20139\u201d \u0219i \u201epeste 6\u201d. Ce regul\u0103 e \u00eenc\u0103lcat\u0103?", "opts": ["Excluderea reciproc\u0103: \u201epeste 6\u201d se suprapune par\u021bial cu alte categorii", "Exhaustivitatea: lipse\u0219te o categorie pentru cei care dorm peste 9 ore", "Omogenitatea: orele de somn nu sunt relevante pentru o cercetare", "Niciuna: categoriile acoper\u0103 toate valorile posibile ale somnului"], "correct": 0, "explain": "Cine doarme 6,5 ore intr\u0103 \u0219i \u00een \u201e5\u20137\u201d, \u0219i \u00een \u201epeste 6\u201d: categoriile au cazuri comune, prima eroare fa\u021b\u0103 de regula excluderii. Varianta cu exhaustivitatea nu observ\u0103 c\u0103 \u201epeste 6\u201d \u00eei cuprinde deja pe cei care dorm peste 9 ore. Faptul c\u0103 sunt acoperite toate valorile nu e suficient.", "tag": "Regula excluderii"}, {"q": "De ce putem spune c\u0103 300 K e de dou\u0103 ori mai mult dec\u00e2t 150 K, dar nu c\u0103 20 \u00b0C e de dou\u0103 ori mai mult dec\u00e2t 10 \u00b0C?", "opts": ["Scala Kelvin are intervale egale \u00eentre grade, iar Celsius nu are", "Scala Kelvin e o scal\u0103 ordinal\u0103 mai precis\u0103 dec\u00e2t scala Celsius", "Valorile Kelvin sunt mai mari, deci raportul lor e mai stabil", "Scala Kelvin are un zero absolut, care indic\u0103 absen\u021ba caracteristicii"], "correct": 3, "explain": "Ambele scale au intervale egale; diferen\u021ba e zeroul. Pe Kelvin, 0 marcheaz\u0103 absen\u021ba \u201emi\u0219c\u0103rii\u201d moleculelor \u2014 zero natural, deci nivel de raport. La Celsius, 0 \u00b0C e doar un punct de referin\u021b\u0103, deci nivel de interval.", "tag": "Zero arbitrar vs zero natural"}, {"q": "Religia e codat\u0103 1 = ortodox, 2 = catolic, 3 = protestant. Media codurilor grupului iese 1,7. Cum interpretezi?", "opts": ["Grupul e, \u00een medie, mai aproape de ortodox dec\u00e2t de catolic", "Media e corect\u0103, dar trebuie raportat\u0103 cu o zecimal\u0103 mai pu\u021bin", "Rezultatul nu are sens: codurile nominale sunt etichete, nu cantit\u0103\u021bi", "Media are sens doar dac\u0103 e\u0219antionul e reprezentativ pentru popula\u021bie"], "correct": 2, "explain": "La nivel nominal singura opera\u021bie permis\u0103 e clasificarea; numerele sunt doar nume ale categoriilor \u0219i pot fi schimbate oricum (3 = ortodox ar da alt\u0103 \u201emedie\u201d). Interpretarea \u201emai aproape de ortodox\u201d trateaz\u0103 etichetele ca pe o scal\u0103, iar reprezentativitatea nu repar\u0103 nivelul de m\u0103sur\u0103.", "tag": "Opera\u021bii aritmetice \u0219i nivel de m\u0103sur\u0103"}]}]}, {"nr": 2, "titlu": "Prezentarea datelor statistice", "harta": {"centru": "Prezentarea datelor statistice", "ramuri": [{"titlu": "Procente \u0219i propor\u021bii", "noduri": [{"t": "Propor\u021bia \u0219i procentul", "d": "Propor\u021bia p = f / n; procentul = (f / n) \u00b7 100, unde f = cazurile din categorie, n = totalul. Ex.: 167 din 269 \u2192 p = 0,621 \u2192 62,1%. Propor\u021biile \u00eensumeaz\u0103 1, procentele 100."}, {"t": "Compararea grupurilor de m\u0103rimi diferite", "d": "Universitatea A (415 studen\u021bi) are 33,0% la Psihologie, B (996) doar 18,9%, de\u0219i B are mai mul\u021bi \u00een cifre absolute (188 fa\u021b\u0103 de 137). Sub fiecare coloan\u0103 de procente se trece totalul (n). \u0218eful de departament: \u201e24% din angaja\u021bi au adus 41% din contracte\u201d."}, {"t": "Baza de compara\u021bie", "d": "F\u0103r\u0103 ea, procentele nu spun nimic sau induc \u00een eroare: \u201ecu 20% mai pu\u021bine calorii\u201d \u2014 fa\u021b\u0103 de ce? \u201eDou\u0103 din trei persoane prefer\u0103 X\u201d \u2014 dac\u0103 au fost \u00eentrebate doar trei?"}, {"t": "Eroarea adun\u0103rii procentelor", "d": "Procentele nu se adun\u0103 ca numerele cardinale: combustibil +10%, retehnologizare +20%, for\u021b\u0103 de munc\u0103 +10% nu justific\u0103 +50% la pre\u021bul kilowattului; doar o cre\u0219tere cu 50% a tuturor costurilor ar justifica-o."}], "figuri": [{"titlu": "Acelea\u0219i date, clasament inversat", "nota": "B are mai mul\u021bi studen\u021bi la Psihologie, dar A are procentul mai mare (tabelele 2.2\u20132.3).", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 200\" role=\"img\" aria-label=\"Universitatea B are mai mul\u021bi studen\u021bi la Psihologie \u00een num\u0103r absolut, dar universitatea A are procentul mai mare\" font-family=\"Georgia, serif\" font-size=\"13\"><text x=\"85.0\" y=\"14.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"12.0\">Num\u0103r de studen\u021bi</text><text x=\"240.0\" y=\"14.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"12.0\">Procent din total</text><line x1=\"30.0\" y1=\"160.0\" x2=\"140.0\" y2=\"160.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><path d=\"M40.0,160.0 V77.4 Q40.0,74.4 43.0,74.4 H71.0 Q74.0,74.4 74.0,77.4 V160.0 Z\" fill=\"#2a78d6\"><title>Universitatea A: 137</title></path><text x=\"57.0\" y=\"69.4\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"12.0\">137</text><text x=\"57.0\" y=\"174.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"12.0\">Univ. A</text><path d=\"M90.0,160.0 V45.5 Q90.0,42.5 93.0,42.5 H121.0 Q124.0,42.5 124.0,45.5 V160.0 Z\" fill=\"#eb6834\"><title>Universitatea B: 188</title></path><text x=\"107.0\" y=\"37.5\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"12.0\">188</text><text x=\"107.0\" y=\"174.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"12.0\">Univ. B</text><line x1=\"185.0\" y1=\"160.0\" x2=\"295.0\" y2=\"160.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><path d=\"M195.0,160.0 V59.9 Q195.0,56.9 198.0,56.9 H226.0 Q229.0,56.9 229.0,59.9 V160.0 Z\" fill=\"#2a78d6\"><title>Universitatea A: 33,0%</title></path><text x=\"212.0\" y=\"51.9\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"12.0\">33,0%</text><text x=\"212.0\" y=\"174.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"12.0\">Univ. A</text><path d=\"M245.0,160.0 V103.9 Q245.0,100.9 248.0,100.9 H276.0 Q279.0,100.9 279.0,103.9 V160.0 Z\" fill=\"#eb6834\"><title>Universitatea B: 18,9%</title></path><text x=\"262.0\" y=\"95.9\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"12.0\">18,9%</text><text x=\"262.0\" y=\"174.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"12.0\">Univ. B</text><text x=\"160.0\" y=\"192.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.8\">A: 137 din 415 \u00b7 B: 188 din 996</text></svg>"}]}, {"titlu": "Raporturi \u0219i rate", "noduri": [{"t": "Raportul", "d": "fi / fj: de c\u00e2te ori categoria i dep\u0103\u0219e\u0219te categoria j. \u0218tiin\u021be Economice / Psihologie la universitatea B: 279 / 188 = 1,48; \u00eenmul\u021bit cu 100 \u2192 148 de studen\u021bi la 100 de studen\u021bi la Psihologie."}, {"t": "Rata", "d": "Cazuri reale / cazuri posibile, pe o unitate de timp. Rata brut\u0103 or\u021bia este p = f / n: cazurile din categorie raportate la toate cazurile (167 / 269 = 0,621). \u00cemp\u0103r\u021birea la frecven\u021ba altei categorii d\u0103 un raport, nu o propor\u021bie; n / f r\u0103stoarn\u0103 formula \u0219i d\u0103 valori peste 1.", "tag": "Propor\u021bia \u0219i procentul"}, {"q": "Ce arat\u0103 raportul fi / fj dintre dou\u0103 categorii ale unei variabile?", "opts": ["Ce parte din totalul cazurilor din e\u0219antion revine categoriei i", "C\u00e2te cazuri reale apar la o mie de cazuri posibile, \u00eentr-un an", "De c\u00e2te ori categoria i dep\u0103\u0219e\u0219te \u00een num\u0103r de cazuri categoria j", "C\u00e2te cazuri are categoria i \u00eempreun\u0103 cu categoriile precedente"], "correct": 2, "explain": "Raportul compar\u0103 dou\u0103 categorii \u00eentre ele: 279 / 188 = 1,48 studen\u021bi la \u0218tiin\u021be Economice pentru fiecare student la Psihologie. \u201ePartea din total\u201d descrie propor\u021bia, \u201ecazuri reale la o mie de cazuri posibile pe an\u201d descrie rata, iar cumularea cu categoriile precedente descrie frecven\u021ba cumulat\u0103.", "tag": "Raportul"}, {"q": "Cum se calculeaz\u0103 o rat\u0103, de pild\u0103 rata brut\u0103 a natalit\u0103\u021bii?", "opts": ["Frecven\u021ba unei categorii \u00eemp\u0103r\u021bit\u0103 la frecven\u021ba altei categorii", "Cazurile dintr-un interval adunate cu cele din intervalele anterioare", "Frecven\u021ba unei categorii \u00eemp\u0103r\u021bit\u0103 la total, apoi \u00eenmul\u021bit\u0103 cu 100", "Cazurile reale \u00eemp\u0103r\u021bite la cazurile posibile, pe o unitate de timp"], "correct": 3, "explain": "Rata pune \u00een raport cazurile efective cu cele posibile pentru variabila de interes, pe o unitate de timp (n\u0103scu\u021bi vii / popula\u021bie, pe an, \u00d7 1000). \u00cemp\u0103r\u021birea a dou\u0103 categorii \u00eentre ele d\u0103 un raport, iar f / n \u00d7 100 este procentul.", "tag": "Rata"}, {"q": "\u00centr-un ora\u0219 cu 7000 de locuitori s-au \u00eenregistrat \u00eentr-un an 100 de n\u0103scu\u021bi vii. C\u00e2t este rata brut\u0103 a natalit\u0103\u021bii?", "opts": ["1,43\u2030", "14,3\u2030", "143\u2030", "70\u2030"], "correct": 1, "explain": "Rata = 100 / 7000 = 0,0143, \u00eenmul\u021bit cu 1000 = 14,3 n\u0103scu\u021bi vii la mia de locuitori. 1,43\u2030 \u0219i 143\u2030 mut\u0103 virgula (\u00eenmul\u021bire cu 100, respectiv cu 10 000), iar 70 vine din 7000 / 100, adic\u0103 raportul inversat.", "tag": "Rata"}, {"q": "O firm\u0103 anun\u021b\u0103 c\u0103 noua sa b\u0103utur\u0103 are \u201ecu 20% mai pu\u021bine calorii\u201d. Ce problem\u0103 semnaleaz\u0103 cursul?", "opts": ["Procentele nu se pot folosi la variabile exprimate \u00een calorii", "Procentul trebuia exprimat ca raport \u00eenmul\u021bit apoi cu 100", "Lipse\u0219te baza de compara\u021bie: 20% mai pu\u021bin fa\u021b\u0103 de ce produs?", "Procentele nu se pot aduna ca numerele cardinale obi\u0219nuite"], "correct": 2, "explain": "F\u0103r\u0103 baza de compara\u021bie, procentele \u201enu ne spun nimic sau chiar ne pot induce \u00een eroare\u201d. Interdic\u021bia de a aduna procentele e o alt\u0103 eroare, real\u0103, dar aici nu se adun\u0103 nimic; caloriile se pot exprima foarte bine \u00een procente.", "tag": "Baza de compara\u021bie"}, {"q": "Ce este o distribu\u021bie de frecven\u021be?", "opts": ["O dispunere a valorilor unei variabile care arat\u0103 c\u00e2te cazuri are fiecare categorie", "O reprezentare circular\u0103 a categoriilor, cu sectoare propor\u021bionale cu procentele", "O list\u0103 a scorurilor brute ale subiec\u021bilor, \u00een ordinea \u00een care au fost culese", "Un tabel care arat\u0103 de c\u00e2te ori fiecare categorie dep\u0103\u0219e\u0219te alt\u0103 categorie"], "correct": 0, "explain": "Distribu\u021bia de frecven\u021be arat\u0103 c\u00e2te cazuri con\u021bine fiecare categorie a variabilei \u0219i este, de regul\u0103, primul pas \u00een orice analiz\u0103 statistic\u0103. Cercul cu sectoare e diagrama circular\u0103, lista \u00een ordinea culegerii sunt datele brute (tabelul 2.4, \u201egreu de urm\u0103rit\u201d), iar compara\u021bia dintre dou\u0103 categorii e un raport.", "tag": "Distribu\u021bia de frecven\u021be"}, {"q": "C\u00e2te intervale de clas\u0103 se folosesc, de regul\u0103, \u00eentr-o distribu\u021bie grupat\u0103?", "opts": ["Exact 10, indiferent de num\u0103rul scorurilor din mul\u021bimea ini\u021bial\u0103", "\u00centre 5 \u0219i 20, dup\u0103 num\u0103rul de scoruri \u0219i scopul cercet\u0103rii", "C\u00e2te scoruri distincte exist\u0103 \u00eentre scorul minim \u0219i cel maxim", "\u00centre 2 \u0219i 5, ca predominan\u021ba unor scoruri s\u0103 fie c\u00e2t mai vizibil\u0103"], "correct": 1, "explain": "Regula 1: nici at\u00e2t de multe intervale \u00eenc\u00e2t s\u0103 nu se mai vad\u0103 predominan\u021ba unor grup\u0103ri, nici at\u00e2t de pu\u021bine \u00eenc\u00e2t s\u0103 se piard\u0103 informa\u021bii \u2014 de regul\u0103 5\u201320. Cele 10 intervale din exemplul c\u0103r\u021bii sunt o alegere, nu o norm\u0103; c\u00e2te un interval pentru fiecare scor distinct \u00eenseamn\u0103 distribu\u021bia negrupat\u0103.", "tag": "Num\u0103rul de intervale"}, {"q": "Ce nume\u0219te cursul \u201eamplitudine\u201d a unei mul\u021bimi de scoruri?", "opts": ["Num\u0103rul de scoruri distincte din mul\u021bimea ini\u021bial\u0103", "Distan\u021ba dintre limitele reale ale unui interval", "Suma limitelor unui interval, \u00eemp\u0103r\u021bit\u0103 la doi", "Diferen\u021ba dintre cel mai mare \u0219i cel mai mic scor"], "correct": 3, "explain": "Amplitudinea = scorul maxim \u2212 scorul minim (69 \u2212 24 = 45) \u0219i se \u00eemparte la num\u0103rul de intervale ca s\u0103 afli m\u0103rimea intervalului. Suma limitelor \u00eemp\u0103r\u021bit\u0103 la doi este centrul de interval; distan\u021ba dintre limitele reale ale unui interval este m\u0103rimea lui.", "tag": "Amplitudinea \u0219i m\u0103rimea intervalului"}, {"q": "Ce arat\u0103 frecven\u021ba cumulat\u0103 a unui interval de clas\u0103?", "opts": ["Cazurile din acel interval \u0219i din toate intervalele precedente", "Cazurile din acel interval raportate la num\u0103rul total de cazuri", "Cazurile din acel interval \u0219i din toate intervalele care urmeaz\u0103", "Cazurile din acel interval \u00eenmul\u021bite cu m\u0103rimea intervalului"], "correct": 0, "explain": "Frecven\u021ba cumulat\u0103 adun\u0103 frecven\u021ba intervalului cu cea cumulat\u0103 \u00een intervalul anterior (intervalele \u00een ordine cresc\u0103toare), a\u0219a c\u0103 \u00een ultimul interval este egal\u0103 cu n. Raportarea la total d\u0103 propor\u021bia; cumularea \u201espre \u00een sus\u201d inverseaz\u0103 sensul folosit \u00een curs.", "tag": "Frecven\u021ba cumulat\u0103"}, {"q": "Intervalele stabilite sunt 20\u201324, 25\u201329, 30\u201334 \u2026 Care sunt limitele reale ale intervalului 30\u201334?", "opts": ["30,0\u201334,5", "29,0\u201335,0", "29,5\u201334,5", "30,5\u201333,5"], "correct": 2, "explain": "Distan\u021ba dintre intervale e de o unitate (de la 29 la 30); jum\u0103tate din ea, 0,5, se scade din limita inferioar\u0103 \u0219i se adun\u0103 la cea superioar\u0103: 29,5\u201334,5. Corec\u021bia aplicat\u0103 doar la un cap\u0103t, corec\u021bia de o unitate \u00eentreag\u0103 sau mutarea limitelor spre interior nu respect\u0103 regula.", "tag": "Limite stabilite \u0219i limite reale"}, {"q": "Cum se afl\u0103 centrul unui interval de clas\u0103?", "opts": ["Diferen\u021ba dintre limita superioar\u0103 \u0219i cea inferioar\u0103, \u00eemp\u0103r\u021bit\u0103 la doi", "Suma limitei inferioare \u0219i a celei superioare, \u00eemp\u0103r\u021bit\u0103 la doi", "Limita inferioar\u0103 stabilit\u0103, din care se scade o jum\u0103tate de unitate", "Frecven\u021ba intervalului \u00eemp\u0103r\u021bit\u0103 la num\u0103rul total de intervale"], "correct": 1, "explain": "Centrul de interval e mijlocul intervalului: (20 + 24) / 2 = 22. Diferen\u021ba limitelor \u00eemp\u0103r\u021bit\u0103 la doi d\u0103 jum\u0103tatea m\u0103rimii intervalului, nu pozi\u021bia lui; sc\u0103derea a 0,5 din limita inferioar\u0103 d\u0103 limita real\u0103 inferioar\u0103.", "tag": "Centrul de interval"}, {"q": "Ce coloan\u0103 poate fi ad\u0103ugat\u0103 unei distribu\u021bii de frecven\u021be la orice nivel de m\u0103sur\u0103?", "opts": ["Coloana de procente cumulate", "Coloana de frecven\u021be cumulate", "Coloana de centre de interval", "Coloana de procente pe categorii"], "correct": 3, "explain": "Cursul spune explicit c\u0103 procentele sunt singura coloan\u0103 ad\u0103ugabil\u0103 la orice nivel. La nivel nominal \u0219i ordinal, frecven\u021bele \u0219i procentele cumulate sunt lipsite de sens, iar limitele reale \u0219i centrele de interval nu se pot determina, pentru c\u0103 acolo categoriile sunt \u00eentotdeauna discrete.", "tag": "Distribu\u021bii nominale \u0219i ordinale"}, {"q": "\u00centr-o diagram\u0103 circular\u0103, o categorie cuprinde 35% din cazuri. Ce unghi are sectorul ei?", "opts": ["126\u00b0", "35\u00b0", "63\u00b0", "54\u00b0"], "correct": 0, "explain": "Cercul are 360\u00b0, deci sectorul este 35% din 360\u00b0 = 126\u00b0 (exemplul celibatarilor din curs). 35\u00b0 confund\u0103 procentul cu gradele, iar 54\u00b0 este sectorul divor\u021ba\u021bilor (15%).", "tag": "Diagrama circular\u0103"}, {"q": "De ce coloanele unei histograme sunt \u00een contact, spre deosebire de cele ale unei diagrame cu coloane?", "opts": ["Histograma se folose\u0219te doar pentru variabile nominale \u0219i ordinale", "Histograma reprezint\u0103 frecven\u021bele cumulate, nu frecven\u021bele simple", "Histograma folose\u0219te limitele de clas\u0103 reale ale intervalelor", "Histograma folose\u0219te centrele de interval \u00een locul limitelor"], "correct": 2, "explain": "Limitele reale ale intervalelor vecine coincid (24,5 \u00eencheie un interval \u0219i \u00eel \u00eencepe pe urm\u0103torul), deci coloanele se ating. Histograma e pentru date de interval sau de raport; frecven\u021bele cumulate se reprezint\u0103 prin ogiv\u0103, iar centrele de interval sunt folosite de poligonul de frecven\u021be.", "tag": "Histograma"}, {"q": "Ce se dispune pe axa absciselor la construirea unei ogive?", "opts": ["Centrele de interval ale fiec\u0103rei clase din distribu\u021bie", "Limitele de clas\u0103 reale superioare ale intervalelor", "Limitele de clas\u0103 stabilite inferioare ale intervalelor", "Frecven\u021bele cumulate sau procentele cumulate ale claselor"], "correct": 1, "explain": "Ogiva folose\u0219te LCRS pe abscis\u0103, iar frecven\u021bele sau procentele cumulate pe ordonat\u0103 \u2014 de aceea varianta cu frecven\u021bele cumulate pune elementul corect pe axa gre\u0219it\u0103. Centrele de interval \u021bin de poligonul de frecven\u021be.", "tag": "Ogiva"}]}, {"id": "2", "eticheta": "Runda 2 \u00b7 Aplica\u021bii", "titlu": "Runda 2 \u2014 Scenarii \u0219i ra\u021bionament", "desc": "Situa\u021bii noi: calculezi, alegi indicatorul sau graficul potrivit \u0219i g\u0103se\u0219ti eroarea de prezentare.", "intrebari": [{"q": "Clinica A are 40 de pacien\u021bi cu tulbur\u0103ri anxioase din 200, clinica B are 60 din 500. Unde e mai mare ponderea lor?", "opts": ["\u00cen clinica B, pentru c\u0103 are mai mul\u021bi pacien\u021bi anxio\u0219i \u00een num\u0103r absolut", "\u00cen clinica A: 0,20 fa\u021b\u0103 de 0,12, de\u0219i are mai pu\u021bini pacien\u021bi anxio\u0219i", "Nu se pot compara, pentru c\u0103 totalurile celor dou\u0103 clinici sunt diferite", "La fel \u00een ambele, pentru c\u0103 diferen\u021ba de 20 de pacien\u021bi e prea mic\u0103"], "correct": 1, "explain": "Propor\u021biile (40/200 = 0,20; 60/500 = 0,12) fac comparabile grupuri de m\u0103rimi diferite \u2014 exact ca la universitatea A, cu procent mai mare la Psihologie de\u0219i cu mai pu\u021bini studen\u021bi \u00een cifre absolute. Frecven\u021ba absolut\u0103 induce \u00een eroare, iar totalurile diferite sunt tocmai motivul pentru care calcul\u0103m propor\u021bii.", "tag": "Compararea grupurilor de m\u0103rimi diferite"}, {"q": "O reclam\u0103 spune: \u201e3 din 4 psihologi recomand\u0103 aplica\u021bia X\u201d. Ce informa\u021bie \u00ee\u021bi lipse\u0219te ca s\u0103 evaluezi afirma\u021bia?", "opts": ["Ce procent \u00eenseamn\u0103 3 din 4, adic\u0103 75% dintre psihologii \u00eentreba\u021bi", "Raportul dintre cei care recomand\u0103 \u0219i cei care nu, adic\u0103 3 la 1", "Rata anual\u0103 a recomand\u0103rilor, exprimat\u0103 \u00een promile, nu \u00een procente", "C\u00e2\u021bi psihologi au fost \u00eentreba\u021bi, adic\u0103 baza pe care s-a calculat"], "correct": 3, "explain": "Ca la reclama \u201edou\u0103 din trei persoane prefer\u0103 marca X\u201d \u2014 dac\u0103 s-au chestionat doar 3 sau 4 oameni, propor\u021bia nu spune nimic. Conversia \u00een procent sau \u00een raport doar reformuleaz\u0103 aceea\u0219i cifr\u0103, f\u0103r\u0103 s\u0103 adauge baza de compara\u021bie.", "tag": "Baza de compara\u021bie"}, {"q": "Un director: \u201esalariile au crescut cu 5%, chiria cu 10%, utilit\u0103\u021bile cu 15%, deci cheltuielile firmei au crescut cu 30%\u201d. Unde gre\u0219e\u0219te?", "opts": ["Procentele unor baze diferite nu se adun\u0103 ca numerele cardinale", "Nic\u0103ieri, doar c\u0103 rezultatul trebuia exprimat \u00een promile", "Procentele trebuiau \u00eenmul\u021bite \u00eentre ele, nu adunate", "Calculul e corect dac\u0103 cele trei cheltuieli sunt la fel de mari"], "correct": 0, "explain": "Fiecare procent se raporteaz\u0103 la alt\u0103 sum\u0103; ca \u00een exemplul cu energia electric\u0103, doar o cre\u0219tere cu 30% a tuturor cheltuielilor ar da 30%. Chiar cu trei cheltuieli egale, cre\u0219terea total\u0103 ar fi media (10%), nu suma \u2014 deci \u0219i varianta \u201ecorect dac\u0103 sunt egale\u201d e gre\u0219it\u0103.", "tag": "Eroarea adun\u0103rii procentelor"}, {"q": "\u0218eful de departament: 37 din cei 154 de angaja\u021bi lucreaz\u0103 la el \u0219i au adus 7321 din cele 17832 de contracte. Cum prezint\u0103 cel mai conving\u0103tor?", "opts": ["Prin frecven\u021be: 37 de angaja\u021bi au adus 7321 de contracte", "Prin diferen\u021b\u0103: are cu 117 angaja\u021bi mai pu\u021bin dec\u00e2t restul", "Prin procente: 24% din angaja\u021bi au adus 41% din contracte", "Prin rat\u0103: 198 de contracte pe angajat, exprimate la mie"], "correct": 2, "explain": "Sunt dou\u0103 compara\u021bii parte\u2013\u00eentreg (angaja\u021bi \u0219i contracte), deci procentele le fac imediat lizibile: 37/154 \u2248 24%, 7321/17832 \u2248 41%. Frecven\u021bele brute sunt chiar prezentarea care \u00eel plictisea pe director; \u201erata la mie\u201d folose\u0219te gre\u0219it no\u021biunea de rat\u0103 (nu sunt cazuri posibile pe unitate de timp).", "tag": "Compararea grupurilor de m\u0103rimi diferite"}, {"q": "Un spital are 150 de asistente \u0219i 60 de medici. Cum exprimi raportul asistente / medici?", "opts": ["0,4: la fiecare medic revin 0,4 asistente", "2,5: la fiecare medic revin 2,5 asistente", "0,71: asistentele sunt 71% din personal", "90: sunt cu 90 de asistente mai mult"], "correct": 1, "explain": "Raportul fi / fj = 150 / 60 = 2,5 (sau 250 de asistente la 100 de medici). 0,4 inverseaz\u0103 categoriile, 0,71 = 150/210 este propor\u021bia asistentelor din total, iar 90 este o diferen\u021b\u0103, nu un raport.", "tag": "Raportul"}, {"q": "Vrei s\u0103 compari abandonul \u0219colar \u00een dou\u0103 licee de m\u0103rimi foarte diferite, de la un an la altul. Ce indicator e cel mai potrivit?", "opts": ["Un raport: abandonurile unui liceu \u00eemp\u0103r\u021bite la ale celuilalt", "O frecven\u021b\u0103 cumulat\u0103 a abandonurilor, de la primul an p\u00e2n\u0103 azi", "Num\u0103rul absolut de abandonuri, pentru c\u0103 e cifra cea mai exact\u0103", "O rat\u0103: abandonuri raportate la elevii \u00eenscri\u0219i, pe fiecare an"], "correct": 3, "explain": "Rata raporteaz\u0103 cazurile efective (abandonurile) la cele posibile (elevii \u00eenscri\u0219i) pe o unitate de timp, deci permite compara\u021bii \u00eentre grupuri diferite \u0219i \u00een momente diferite. Raportul dintre licee ignor\u0103 m\u0103rimea fiec\u0103ruia, iar cifrele absolute favorizeaz\u0103 liceul mai mare.", "tag": "Rata"}, {"q": "\u00cen tabelul grupat, intervalul 35\u201339 are 18 cazuri. Ce informa\u021bie NU mai poate fi aflat\u0103 din acest tabel?", "opts": ["C\u00e2\u021bi subiec\u021bi au ob\u021binut exact scorul 37", "C\u00e2te scoruri cad \u00eentre 35 \u0219i 39 inclusiv", "Ce procent din total cade \u00eentre 35 \u0219i 39", "C\u00e2\u021bi subiec\u021bi au ob\u021binut, cumulat, sub 40"], "correct": 0, "explain": "Gruparea produce o pierdere de informa\u021bie: \u0219tim doar c\u0103 sunt 18 scoruri \u00een 35\u201339, nu cum se \u00eempart pe 35, 36, 37, 38, 39. Procentul (18/180 = 10%) \u0219i frecven\u021ba cumulat\u0103 (28 sub 40) se pot calcula din tabelul grupat.", "tag": "Pierderea de informa\u021bie"}, {"q": "Scorurile la o scal\u0103 de anxietate merg de la 12 la 87. Vrei 15 intervale de clas\u0103 de aceea\u0219i m\u0103rime. Ce m\u0103rime alegi?", "opts": ["6, pentru c\u0103 87 / 15 \u2248 5,8, rotunjit", "7, pentru c\u0103 (87 + 12) / 15 \u2248 6,6", "5, pentru c\u0103 (87 \u2212 12) / 15 = 5", "15, c\u00e2t num\u0103rul de intervale cerut"], "correct": 2, "explain": "M\u0103rimea = amplitudinea (87 \u2212 12 = 75) \u00eemp\u0103r\u021bit\u0103 la num\u0103rul de intervale (15) = 5. \u00cemp\u0103r\u021birea doar a scorului maxim ignor\u0103 scorul minim, iar adunarea celor dou\u0103 scoruri nu d\u0103 amplitudinea.", "tag": "Amplitudinea \u0219i m\u0103rimea intervalului"}, {"q": "Un student construie\u0219te intervalele de clas\u0103 10\u201315, 15\u201320, 20\u201325, 25\u201330. Ce regul\u0103 \u00eencalc\u0103?", "opts": ["Primul interval ar trebui s\u0103 \u00eenceap\u0103 de la zero, nu de la 10", "Intervalele se suprapun: scorul 15 apar\u021bine la dou\u0103 intervale", "Intervalele ar trebui s\u0103 aib\u0103 m\u0103rimi diferite, dup\u0103 frecven\u021b\u0103", "Ultimul interval ar trebui s\u0103 con\u021bin\u0103 cel mai mic scor al mul\u021bimii"], "correct": 1, "explain": "Intervalele nu trebuie s\u0103 se suprapun\u0103 \u2014 e regula excluderii reciproce din Cap. 1 (Introducere \u00een statistic\u0103), aplicat\u0103 intervalelor (cartea d\u0103 exemplul 20\u201324, 24\u201328). Primul interval nu trebuie s\u0103 \u00eenceap\u0103 de la zero, intervalele se fac de obicei egale, iar scorul minim intr\u0103 \u00een primul interval, nu \u00een ultimul.", "tag": "Primul \u0219i ultimul interval"}, {"q": "\u00cen tabelul cu frecven\u021be cumulate, intervalul 50\u201354 are fc = 122 \u0219i %c = 67,78. Ce rezult\u0103?", "opts": ["122 de subiec\u021bi, adic\u0103 67,78%, au scoruri mai mici de 55", "122 de subiec\u021bi au ob\u021binut scoruri cuprinse \u00eentre 50 \u0219i 54", "67,78% dintre subiec\u021bi au ob\u021binut scoruri de cel pu\u021bin 50", "122 de subiec\u021bi au ob\u021binut scoruri mai mari dec\u00e2t 54"], "correct": 0, "explain": "Frecven\u021ba cumulat\u0103 include intervalul \u0219i toate intervalele precedente, deci 122 de subiec\u021bi au sub 55 (concluzia c\u0103r\u021bii). \u00centre 50 \u0219i 54 sunt doar 30 de subiec\u021bi (frecven\u021ba simpl\u0103), iar \u201ecel pu\u021bin 50\u201d \u0219i \u201epeste 54\u201d inverseaz\u0103 sensul cumul\u0103rii.", "tag": "Citirea cumulatelor"}, {"q": "Un cercet\u0103tor adaug\u0103 o coloan\u0103 de frecven\u021be cumulate la distribu\u021bia culorii preferate (ro\u0219u, albastru, verde, galben). Ce spune cursul?", "opts": ["Sunt corecte, dac\u0103 se adaug\u0103 \u0219i coloana de procente cumulate", "Sunt corecte, dac\u0103 se calculeaz\u0103 \u00eent\u00e2i centrele de interval", "Sunt corecte, dac\u0103 e\u0219antionul are cel pu\u021bin o sut\u0103 de cazuri", "La nivel nominal, frecven\u021bele cumulate sunt lipsite de sens"], "correct": 3, "explain": "Cursul spune c\u0103 la nivelurile nominal \u0219i ordinal frecven\u021bele \u0219i procentele cumulate sunt lipsite de sens; interpretarea noastr\u0103: la nivel nominal ordinea categoriilor e arbitrar\u0103, deci \u201ecumulat p\u00e2n\u0103 la verde\u201d nu \u00eenseamn\u0103 nimic. Centrele de interval nici nu exist\u0103 la categorii discrete, iar m\u0103rimea e\u0219antionului nu schimb\u0103 nivelul de m\u0103sur\u0103.", "tag": "Distribu\u021bii nominale \u0219i ordinale"}, {"q": "Ai v\u00e2rsta \u00een ani a 300 de participan\u021bi, grupat\u0103 \u00een intervale de c\u00e2te 5 ani, \u0219i vrei s\u0103 ar\u0103\u021bi forma distribu\u021biei. Ce alegi?", "opts": ["O diagram\u0103 circular\u0103, cu c\u00e2te un sector pentru fiecare v\u00e2rst\u0103", "O diagram\u0103 cu coloane separate, c\u00e2te una pe fiecare interval", "O histogram\u0103, cu limitele reale ale intervalelor pe abscis\u0103", "O diagram\u0103 de \u00eempr\u0103\u0219tiere, cu v\u00e2rsta pus\u0103 pe ambele axe"], "correct": 2, "explain": "V\u00e2rsta e o variabil\u0103 de raport, deci se reprezint\u0103 prin histogram\u0103 (sau poligon). Coloanele separate sunt pentru categorii discrete (nominale, ordinale); diagrama circular\u0103 cu zeci de sectoare devine ilizibil\u0103; diagrama de \u00eempr\u0103\u0219tiere arat\u0103 rela\u021bia dintre dou\u0103 variabile, \u00een Cap. 12 (M\u0103rimi ale corela\u021biei).", "tag": "Histograma"}, {"q": "Vrei s\u0103 ar\u0103\u021bi cum a evoluat, lun\u0103 de lun\u0103, num\u0103rul de b\u0103rba\u021bi \u0219i de femei care apeleaz\u0103 la consilierea din firm\u0103. Ce variant\u0103 ilustreaz\u0103 cursul?", "opts": ["O singur\u0103 diagram\u0103 circular\u0103, cu c\u00e2te un sector pe lun\u0103", "Coloane grupate pe luni sau o diagram\u0103 cu linii, pe sexe", "O ogiv\u0103, pentru c\u0103 lunile se cumuleaz\u0103 de la prima \u00eencoace", "O histogram\u0103 cu luni \u00een contact, f\u0103r\u0103 separare pe sexe"], "correct": 1, "explain": "Figurile 2.3 \u0219i 2.4 redau acelea\u0219i date \u00een coloane grupate \u0219i \u00een linii: se vede c\u0103 apelan\u021bii femei au crescut mai repede dec\u00e2t b\u0103rba\u021bii. O diagram\u0103 circular\u0103 pierde compara\u021bia pe sexe \u0219i evolu\u021bia, iar ogiva arat\u0103 frecven\u021be cumulate ale unei variabile de interval, nu serii \u00een timp.", "tag": "Diagrama cu linii"}, {"q": "Vrei s\u0103 cite\u0219ti rapid din grafic ce procent din subiec\u021bi au scoruri sub 60 (intervale 55\u201359, 60\u201364 \u2026). Ce folose\u0219ti?", "opts": ["Ogiva procentelor cumulate, citit\u0103 \u00een dreptul valorii 59,5", "Poligonul de frecven\u021be, citit \u00een dreptul centrului 57", "Histograma, citit\u0103 la \u00een\u0103l\u021bimea coloanei 55\u201359", "Diagrama circular\u0103, citit\u0103 la sectorul cel mai mare"], "correct": 0, "explain": "Ogiva pune procentele cumulate \u00een dreptul limitelor reale superioare, deci la 59,5 cite\u0219ti direct procentul celor sub 60 \u2014 de aceea, \u00een Cap. 3 (M\u0103rimile tendin\u021bei centrale), ogiva serve\u0219te la aflarea unor puncte ale distribu\u021biei. Poligonul \u0219i histograma arat\u0103 frecven\u021be simple, ale unui singur interval.", "tag": "Ogiva"}, {"q": "Timpi de reac\u021bie (secunde) grupa\u021bi \u00een intervalele stabilite 2,0\u20132,4; 2,5\u20132,9; 3,0\u20133,4. Care sunt limitele reale ale primului interval?", "opts": ["1,50\u20132,90", "2,00\u20132,50", "1,90\u20132,50", "1,95\u20132,45"], "correct": 3, "explain": "Distan\u021ba dintre intervale este 0,1 (de la 2,4 la 2,5); jum\u0103tate, 0,05, se scade din limita inferioar\u0103 \u0219i se adun\u0103 la cea superioar\u0103. Varianta 1,50\u20132,90 aplic\u0103 mecanic 0,5, ca la scoruri \u00eentregi, de\u0219i regula cere jum\u0103tate din distan\u021ba real\u0103 dintre intervale.", "tag": "Limite stabilite \u0219i limite reale"}]}]}, {"nr": 3, "titlu": "M\u0103rimile tendin\u021bei centrale", "harta": {"centru": "M\u0103rimile tendin\u021bei centrale", "ramuri": [{"titlu": "Media aritmetic\u0103", "noduri": [{"t": "Defini\u021bia mediei aritmetice", "d": "Suma tuturor scorurilor \u00eemp\u0103r\u021bit\u0103 la num\u0103rul lor: X\u0304 = \u03a3Xi / n (formula 3.1). Simboluri: X\u0304 pentru e\u0219antion, \u03bc (miu) pentru popula\u021bie. Se calculeaz\u0103 doar pentru variabile de interval sau de raport."}, {"t": "Calculul cu frecven\u021be", "d": "Fiecare scor se \u00eenmul\u021be\u0219te cu frecven\u021ba lui, apoi se adun\u0103 \u0219i se \u00eemparte la n: v\u00e2rstele din tabelul 3.1 dau (1\u00b716 + 4\u00b717 + 1\u00b718 + 2\u00b719 + 3\u00b723) / 11 = 209 / 11 = 19."}, {"t": "De ce e media cea mai folosit\u0103", "d": "E m\u0103rimea cea mai des folosit\u0103 la interval \u0219i raport: u\u0219or de calculat \u0219i cu dou\u0103 propriet\u0103\u021bi importante, folosite \u00een formule ulterioare; la inferen\u021b\u0103 e cu deosebire util\u0103."}]}, {"titlu": "Propriet\u0103\u021bile mediei", "noduri": [{"t": "Suma abaterilor egal\u0103 cu zero", "d": "Abaterea unui scor e Xi \u2212 X\u0304; \u00een orice distribu\u021bie \u03a3(Xi \u2212 X\u0304) = 0. Media e punctul \u00een jurul c\u0103ruia toate scorurile se anuleaz\u0103 \u2014 de aici valoarea ei ca m\u0103sur\u0103 a centralit\u0103\u021bii."}, {"t": "Suma p\u0103tratelor abaterilor minim\u0103", "d": "\u03a3(Xi \u2212 X\u0304)\u00b2 e mai mic\u0103 dec\u00e2t suma p\u0103tratelor abaterilor fa\u021b\u0103 de orice alt scor: 74 fa\u021b\u0103 de media 19, 118 fa\u021b\u0103 de 17 (tabelul 3.2). Folosit\u0103 la m\u0103rimile dispersiei, \u00een Cap. 4 (M\u0103rimile dispersiei), \u0219i la corela\u021bie, \u00een Cap. 12 (M\u0103rimi ale corela\u021biei)."}, {"t": "Sensibilitatea la scorurile extreme", "d": "15, 20, 25, 30, 35 \u2192 media 25; cu 3500 \u00een loc de 35 \u2192 718; cu 1 \u00een loc de 35 \u2192 18,2. Media e \u201etras\u0103\u201d spre extreme, mai ales spre scorurile mari. \u201eParadoxul statisticii\u201d: X are 10 paltoane, Y niciunul, deci \u201e\u00een medie\u201d c\u00e2te 5."}], "figuri": [{"titlu": "Abaterile de la medie se anuleaz\u0103 (tabelul 3.2)", "nota": "Cele 11 v\u00e2rste, cu media 19: abaterile negative \u0219i pozitive \u00eensumeaz\u0103 zero, iar suma p\u0103tratelor lor (74) e mai mic\u0103 dec\u00e2t fa\u021b\u0103 de scorul 17 (118).", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 194\" role=\"img\" aria-label=\"Abaterile celor 11 v\u00e2rste de la media 19: negativele \u00eensumeaz\u0103 \u221212, pozitivele +12\" font-family=\"Georgia, serif\" font-size=\"13\"><line x1=\"36.0\" y1=\"84.0\" x2=\"312.0\" y2=\"84.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><rect x=\"40.5\" y=\"84.0\" width=\"16.0\" height=\"33.0\" fill=\"#eb6834\"><title>scorul 16: abaterea -3</title></rect><text x=\"48.5\" y=\"129.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"9.6\">\u22123</text><text x=\"48.5\" y=\"146.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"9.6\">16</text><rect x=\"65.6\" y=\"84.0\" width=\"16.0\" height=\"22.0\" fill=\"#eb6834\"><title>scorul 17: abaterea -2</title></rect><text x=\"73.6\" y=\"118.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"9.6\">\u22122</text><text x=\"73.6\" y=\"146.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"9.6\">17</text><rect x=\"90.7\" y=\"84.0\" width=\"16.0\" height=\"22.0\" fill=\"#eb6834\"><title>scorul 17: abaterea -2</title></rect><text x=\"98.7\" y=\"118.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"9.6\">\u22122</text><text x=\"98.7\" y=\"146.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"9.6\">17</text><rect x=\"115.8\" y=\"84.0\" width=\"16.0\" height=\"22.0\" fill=\"#eb6834\"><title>scorul 17: abaterea -2</title></rect><text x=\"123.8\" y=\"118.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"9.6\">\u22122</text><text x=\"123.8\" y=\"146.0\" text-an t><rect x=\"291.5\" y=\"40.0\" width=\"16.0\" height=\"44.0\" fill=\"#2a78d6\"><title>scorul 23: abaterea +4</title></rect><text x=\"299.5\" y=\"36.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"9.6\">+4</text><text x=\"299.5\" y=\"146.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"9.6\">23</text><text x=\"12.0\" y=\"88.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">X\u0304</text><text x=\"174.0\" y=\"162.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.8\">scorurile Xi (media X\u0304 = 19)</text><text x=\"14.0\" y=\"16.0\" text-anchor=\"start\" fill=\"#eb6834\" font-size=\"10.8\">sub medie: \u22123 \u2212 2\u00b74 \u2212 1 = \u221212</text><text x=\"306.0\" y=\"16.0\" text-anchor=\"end\" fill=\"#2a78d6\" font-size=\"10.8\">peste: 4\u00b73 = +12</text><text x=\"160.0\" y=\"184.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.8\">\u03a3(Xi \u2212 X\u0304) = 0 \u00b7 \u03a3(Xi \u2212 X\u0304)\u00b2 = 74 &lt; 118 = \u03a3(Xi \u2212 17)\u00b2</text></svg>"}]}, {"titlu": "Mediana", "noduri": [{"t": "Defini\u021bia medianei", "d": "Punctul de mijloc: num\u0103rul de cazuri cu scoruri \u2264 X\u0303 egaleaz\u0103 num\u0103rul de cazuri cu scoruri \u2265 X\u0303. Simboluri: X\u0303 (e\u0219antion), \u03bc\u0303 (popula\u021bie). Se folose\u0219te la nivel ordinal, de interval \u0219i de raport; nu la nominal, unde scorurile nu se pot ordona."}, {"t": "Mediana pentru n impar \u0219i n par", "d": "Scorurile se ordoneaz\u0103. n impar: scorul cazului de mijloc, al (n + 1)/2-lea (11 v\u00e2rste \u2192 18). n par: cazurile n/2 \u0219i n/2 + 1; la interval \u0219i raport se ia media lor (26, 26, 28, 29, 30, 31, 32, 60 \u2192 29,5)."}, {"t": "De ce \u201esau egale\u201d", "d": "16 familii (tabelul 3.4): cazurile 8 \u0219i 9 au c\u00e2te 2 copii, deci mediana e 2 (8 familii au \u2264 2, 8 au \u2265 2). \u00cen 1, 2, 3, 5, 5, 5, 7, 10, 12 mediana e 5: patru scoruri \u2264 5 \u0219i patru \u2265 5."}, {"t": "Mediana la nivel ordinal", "d": "\u201eC\u00e2t de des merge\u021bi la cinematograf?\u201d (11 subiec\u021bi): al 6-lea caz r\u0103spunde Des \u2192 mediana Des. Cu 12 subiec\u021bi, cazurile de mijloc sunt Des \u0219i Foarte rar; se ia categoria dintre ele, Rar."}, {"t": "Rezisten\u021ba medianei la extreme", "d": "Mediana \u021bine cont doar de ordinea scorurilor, nu de m\u0103rimea lor: 15, 20, 25, 30, 3500 are tot mediana 25; v\u00e2rsta tipic\u0103 din tabelul 3.3 e mai bine redat\u0103 de mediana 29 dec\u00e2t de media 33. De aceea se folose\u0219te mai ales la date ordinale. Media \u0219i mediana pot coincide (15, 20, 25, 30, 35)."}], "figuri": [{"titlu": "Mediana fa\u021b\u0103 de media tras\u0103 de un scor extrem (tabelul 3.3)", "nota": "V\u00e2rsta tipic\u0103 e redat\u0103 mai bine de median\u0103 (29) dec\u00e2t de medie (33), pe care o trage scorul 60.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 154\" role=\"img\" aria-label=\"\u0218apte v\u00e2rste pe o ax\u0103: mediana 29, media 33 tras\u0103 spre scorul 60\" font-family=\"Georgia, serif\" font-size=\"13\"><line x1=\"20.0\" y1=\"92.0\" x2=\"306.0\" y2=\"92.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><line x1=\"27.5\" y1=\"92.0\" x2=\"27.5\" y2=\"96.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"27.5\" y=\"108.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"9.6\">25</text><line x1=\"65.2\" y1=\"92.0\" x2=\"65.2\" y2=\"96.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"65.2\" y=\"108.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"9.6\">30</text><line x1=\"102.8\" y1=\"92.0\" x2=\"102.8\" y2=\"96.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"102.8\" y=\"108.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"9.6\">35</text><line x1=\"140.4\" y1=\"92.0\" x2=\"140.4\" y2=\"96.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"140.4\" y=\"108.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"9.6\">40</text><line x1=\"178.1\" y1=\"92.0\" x2=\"178.1\" y2=\"96
