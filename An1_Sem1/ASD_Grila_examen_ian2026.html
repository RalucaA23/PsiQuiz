<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Grilă de examen · Analiza superioară a datelor</title>
<style>
  :root {
    --bg: #f4f1ea; --card: #ffffff; --ink: #2c2a26; --muted: #6b6760;
    --accent: #7a5c3e; --accent-soft: #efe6d8; --border: #ddd5c7; --optbg: #faf8f3;
    --correct: #2e7d52; --correct-bg: #e6f3ec; --wrong: #b5453a; --wrong-bg: #f8e9e7;
  }
  * { box-sizing: border-box; }
  body { font-family: Georgia, 'Times New Roman', serif; background: var(--bg); color: var(--ink);
    margin: 0; padding: 24px 16px 60px; line-height: 1.55; }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 8px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; color: var(--accent); }
  .sub { color: var(--muted); font-style: italic; margin: 0 0 24px; text-align: center; }
  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; }
  .tab { background: var(--card); border: 1px solid var(--border); color: var(--ink);
    padding: 10px 18px; border-radius: 999px; cursor: pointer; font-family: inherit; font-size: 0.95rem; transition: all .15s; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .scorebar { position: sticky; top: 0; z-index: 5; background: var(--accent-soft);
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; margin-bottom: 20px;
    display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; }
  .scorebar strong { color: var(--accent); }
  .q { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 22px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .qnum { color: var(--accent); font-weight: bold; font-size: 0.85rem; letter-spacing: .04em; text-transform: uppercase; }
  .qtext { font-size: 1.08rem; margin: 6px 0 16px; }
  .opt { display: block; width: 100%; text-align: left; background: var(--optbg);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px;
    cursor: pointer; font-family: inherit; font-size: 1rem; color: var(--ink); transition: all .12s; }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt.correct { background: var(--correct-bg); border-color: var(--correct); color: var(--correct); font-weight: bold; }
  .opt.wrong { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }
  .opt .mark { float: right; font-weight: bold; }
  .explain { margin-top: 8px; padding: 12px 16px; border-radius: 10px; background: var(--accent-soft);
    border-left: 3px solid var(--accent); font-size: 0.95rem; display: none; }
  .explain.show { display: block; }
  .explain b { color: var(--accent); }
  .roundtitle { font-size: 1.25rem; color: var(--accent); margin: 8px 0 4px; }
  .rounddesc { color: var(--muted); font-style: italic; margin: 0 0 18px; font-size: 0.95rem; }
  .hidden { display: none; }
  .final { background: var(--card); border: 2px solid var(--accent); border-radius: 14px;
    padding: 24px; text-align: center; margin-top: 10px; display: none; }
  .final.show { display: block; }
  .final h2 { color: var(--accent); margin: 0 0 8px; }
  .final .pct { font-size: 2.4rem; font-weight: bold; color: var(--accent); }
  .reset { background: var(--accent); color: #fff; border: none; padding: 10px 22px; border-radius: 999px;
    cursor: pointer; font-family: inherit; font-size: 0.95rem; margin-top: 14px; }
  .reset.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .results { margin-top: 18px; text-align: left; }
  .results-label { font-weight: bold; color: var(--accent); margin-bottom: 6px; font-size: .95rem; }
  .results-text { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .82rem;
    background: var(--optbg); color: var(--ink); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; resize: vertical; line-height: 1.4; }
  .results-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .results-hint { color: var(--muted); font-size: .85rem; font-style: italic; margin-top: 8px; text-align: center; }
#dlbtn{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="hdr-title"></h1>
    <p class="sub" id="hdr-sub"></p>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="scorebar">
    <span id="lbl-progress"></span>
    <span id="lbl-score"></span>
  </div>
  <div id="rounds"></div>
  <div class="final" id="final">
    <h2 id="final-h"></h2>
    <div class="pct" id="finalpct">0%</div>
    <p id="finalmsg"></p>
    <div class="results">
      <div class="results-label" id="results-label"></div>
      <textarea class="results-text" id="results-text" readonly rows="9"></textarea>
      <div class="results-btns">
        <button class="reset" id="copybtn"></button>
        <button class="reset ghost" id="dlbtn"></button>
      </div>
      <div class="results-hint" id="results-hint"></div>
    </div>
    <button class="reset ghost" id="resetbtn"></button>
  </div>
</div>
<script>
const QUIZ = {"title": "Gril\u0103 de examen \u00b7 Analiza superioar\u0103 a datelor", "subtitle": "C\u00e2te o \u00eentrebare pentru fiecare dintre cele 90 de subiecte din PDF, \u00een stilul grilei de examen \u00b7 3 variante a c\u00e2te 30", "rounds": {"1": {"title": "Subiectele 1\u201330", "desc": "30 de \u00eentreb\u0103ri, ca o variant\u0103 de examen. Alege un r\u0103spuns ca s\u0103 vezi explica\u021bia.", "questions": [{"q": "S1. Care este rolul variabilelor \u00een cercet\u0103rile psihologice?", "opts": ["A. S\u0103 clasifice datele \u00een func\u021bie de tipul lor", "B. S\u0103 descrie, s\u0103 explice sau s\u0103 investigheze comportamente \u0219i procese mentale", "C. S\u0103 analizeze tendin\u021bele demografice ale participan\u021bilor", "D. S\u0103 prezic\u0103 evolu\u021bia comportamentelor \u00een viitor"], "correct": 1, "explain": "Variabilele servesc descrierii, explic\u0103rii \u0219i investig\u0103rii comportamentelor \u0219i proceselor mentale (VI produce efectul, VD \u00eel reflect\u0103). Clasificarea datelor, analiza demografic\u0103 sau predic\u021bia sunt doar utiliz\u0103ri par\u021biale.", "tag": "Metodologie \u00b7 rolul variabilelor"}, {"q": "S2. Ce test este utilizat pentru a analiza rela\u021biile dintre variabilele categoriale?", "opts": ["A. T-test", "B. Testul chi-p\u0103trat", "C. ANOVA", "D. Regresia liniar\u0103"], "correct": 1, "explain": "Chi-p\u0103tratul de independen\u021b\u0103 verific\u0103 asocierea dintre dou\u0103 variabile categoriale, pe frecven\u021be. Testul t \u0219i ANOVA compar\u0103 medii, iar regresia liniar\u0103 cere variabile continue.", "tag": "Cap. 11 \u00b7 chi-p\u0103trat"}, {"q": "S3. Ce tip de date sunt utilizate pentru a descrie atribute sau caracteristici care nu pot fi m\u0103surate numeric?", "opts": ["A. Date cantitative", "B. Date continue", "C. Date calitative", "D. Date raport"], "correct": 2, "explain": "Atributele care nu se m\u0103soar\u0103 numeric (gen, diagnostic, tip de personalitate) sunt date calitative: nominale sau ordinale. Datele continue \u0219i cele de raport sunt cantitative.", "tag": "Cap. 1 \u00b7 niveluri de m\u0103sur\u0103"}, {"q": "S4. Ce tip de analiz\u0103 statistic\u0103 este utilizat pentru a compara mediile a trei sau mai multor grupuri?", "opts": ["A. Coeficientul de corela\u021bie Pearson", "B. Testul chi-p\u0103trat de independen\u021b\u0103", "C. Analiza de varian\u021b\u0103 (ANOVA)", "D. Testul t pentru e\u0219antioane independente"], "correct": 2, "explain": "ANOVA compar\u0103 trei sau mai multe medii \u00eentr-o singur\u0103 testare; mai multe teste t pe perechi ar umfla eroarea de tipul I. Pearson m\u0103soar\u0103 o rela\u021bie, iar chi-p\u0103tratul lucreaz\u0103 cu frecven\u021be.", "tag": "Cap. 10 \u00b7 ANOVA"}, {"q": "S5. Care sunt rolurile peincipale ale neocortexului?", "opts": ["A. Reglarea ritmului cardiac, a respira\u021biei \u0219i a reflexelor de ap\u0103rare", "B. Procesarea fricii prin amigdal\u0103 \u0219i formarea amintirilor", "C. G\u00e2ndirea, limbajul, memoria \u0219i controlul voluntar al mi\u0219c\u0103rilor", "D. Coordonarea echilibrului \u0219i a mi\u0219c\u0103rilor fine ale corpului"], "correct": 2, "explain": "Neocortexul e sediul func\u021biilor psihice superioare. Ritmul cardiac \u0219i reflexele \u021bin de creierul reptilian, echilibrul de cerebel, iar amigdala \u0219i hipocampul de sistemul limbic.", "tag": "Neuro \u00b7 neocortex"}, {"q": "S6. \u00cen teoria celor trei creiere, ce parte a creierului este considerat\u0103 responsabil\u0103 pentru comportamentele de supravie\u021buire \u0219i agresiune?", "opts": ["A. Neocortexul", "B. Creierul limbic", "C. Creierul reptilian", "D. Lobul frontal"], "correct": 2, "explain": "\u00cen teoria lui MacLean, creierul reptilian (trunchiul cerebral, ganglionii bazali) controleaz\u0103 supravie\u021buirea, agresivitatea, lupta\u2013fuga \u0219i teritoriul. Limbicul \u021bine de emo\u021bii \u0219i memorie, neocortexul de func\u021biile superioare.", "tag": "Neuro \u00b7 trei creiere"}, {"q": "S7. Care este principala caracteristic\u0103 a Industry 4.0?", "opts": ["A. Integrarea tehnologiilor digitale avansate \u00een procesele industriale", "B. Introducerea electricit\u0103\u021bii \u0219i a produc\u021biei de mas\u0103 pe band\u0103 rulant\u0103", "C. Mecanizarea produc\u021biei prin folosirea ma\u0219inilor cu abur", "D. Automatizarea prin electronic\u0103 \u0219i primele calculatoare"], "correct": 0, "explain": "Industry 4.0 \u00eenseamn\u0103 fabrici inteligente: IoT, inteligen\u021b\u0103 artificial\u0103, big data, comunicare \u00een timp real. Aburul, electricitatea \u0219i electronica sunt revolu\u021biile industriale 1, 2 \u0219i 3.", "tag": "Tehnologie \u00b7 Industry 4.0"}, {"q": "S8. Ce structur\u0103 a creierului este responsabil\u0103 pentru memoria \u0219i reglarea emo\u021biilor?", "opts": ["A. Lobul occipital", "B. Cerebelul", "C. Sistemul limbic", "D. Trunchiul cerebral"], "correct": 2, "explain": "Sistemul limbic: hipocampul (formarea amintirilor) \u0219i amigdala (fric\u0103, furie, pl\u0103cere). Cerebelul coordoneaz\u0103 mi\u0219carea, trunchiul cerebral func\u021biile vitale, lobul occipital vederea.", "tag": "Neuro \u00b7 sistemul limbic"}, {"q": "S9. Care sunt caracteristicile emisferei st\u00e2ngi a creierului?", "opts": ["A. Limbaj, logic\u0103, analiz\u0103 secven\u021bial\u0103, controlul p\u0103r\u021bii drepte a corpului", "B. Limbaj, logic\u0103, analiz\u0103 secven\u021bial\u0103, controlul p\u0103r\u021bii st\u00e2ngi a corpului", "C. Creativitate, imagina\u021bie, percep\u021bie global\u0103, controlul p\u0103r\u021bii st\u00e2ngi", "D. Emo\u021bii, intui\u021bie, recunoa\u0219terea fe\u021belor, controlul p\u0103r\u021bii drepte"], "correct": 0, "explain": "Emisfera st\u00e2ng\u0103 e analitic\u0103 \u0219i verbal\u0103 (procesare serial\u0103) \u0219i controleaz\u0103 partea dreapt\u0103 a corpului (control contralateral). Varianta cu \u201epartea st\u00e2ng\u0103\u201d gre\u0219e\u0219te doar controlul; creativitatea \u0219i recunoa\u0219terea fe\u021belor \u021bin de emisfera dreapt\u0103.", "tag": "Neuro \u00b7 emisfera st\u00e2ng\u0103"}, {"q": "S10. Cum se activeaz\u0103 emisfera dreapt\u0103 a creierului?", "opts": ["A. Prin memorare repetitiv\u0103 \u0219i exerci\u021bii de vocabular", "B. Prin citire, scriere \u0219i analiza detaliat\u0103 a textelor scrise", "C. Prin calcule matematice, analiz\u0103 logic\u0103 \u0219i rezolvarea problemelor pas cu pas", "D. Prin activit\u0103\u021bi creative, imagina\u021bie, muzic\u0103, art\u0103 \u0219i g\u00e2ndire global\u0103"], "correct": 3, "explain": "Emisfera dreapt\u0103 e holistic\u0103, non-verbal\u0103 \u0219i emo\u021bional\u0103: se activeaz\u0103 prin crea\u021bie, vizualizare, muzic\u0103, relaxare. Calculul, analiza pas cu pas \u0219i limbajul scris \u021bin de emisfera st\u00e2ng\u0103.", "tag": "Neuro \u00b7 emisfera dreapt\u0103"}, {"q": "S11. Ce tip de biosemnal m\u0103soar\u0103 activitatea electric\u0103 a inimii?", "opts": ["A. Electrocardiograma (ECG)", "B. Electromiograma (EMG)", "C. Electroencefalograma (EEG)", "D. R\u0103spunsul electrodermal (GSR)"], "correct": 0, "explain": "ECG \u00eenregistreaz\u0103 activitatea electric\u0103 a inimii. EEG m\u0103soar\u0103 activitatea electric\u0103 a creierului, EMG pe cea a mu\u0219chilor, iar GSR conductan\u021ba pielii.", "tag": "Neuro \u00b7 biosemnale"}, {"q": "S12. Care este principala func\u021bie a sistemului nervos?", "opts": ["A. Ap\u0103rarea organismului \u00eempotriva agen\u021bilor patogeni din mediu", "B. Recep\u021bia, procesarea \u0219i transmiterea informa\u021biilor \u00een organism", "C. Producerea hormonilor care regleaz\u0103 cre\u0219terea \u0219i metabolismul", "D. Transportul oxigenului \u0219i al substan\u021belor nutritive c\u0103tre \u021besuturi"], "correct": 1, "explain": "Sistemul nervos prime\u0219te stimuli, \u00eei proceseaz\u0103 \u0219i coordoneaz\u0103 r\u0103spunsurile, asigur\u00e2nd adaptarea la mediu \u0219i homeostazia. Celelalte variante descriu sistemele circulator, endocrin \u0219i imunitar.", "tag": "Neuro \u00b7 sistemul nervos"}, {"q": "S13. Care coeficient de corela\u021bie m\u0103soar\u0103 rela\u021bia liniar\u0103 \u00eentre dou\u0103 variabile continue?", "opts": ["A. Coeficientul de corela\u021bie Pearson (r)", "B. Coeficientul de corela\u021bie Spearman (\u03c1)", "C. Coeficientul de corela\u021bie Kendall (\u03c4)", "D. Coeficientul de asociere phi (\u03c6)"], "correct": 0, "explain": "Pearson m\u0103soar\u0103 rela\u021bia liniar\u0103 dintre dou\u0103 variabile continue, \u00eentre \u22121 \u0219i +1. Spearman \u0219i Kendall lucreaz\u0103 pe ranguri (date ordinale), iar phi pe variabile nominale dihotomice.", "tag": "Cap. 12 \u00b7 Pearson"}, {"q": "S14. C\u00e2nd este utilizat Coeficientul de corela\u021bie Kendall?", "opts": ["A. Pentru asocierea dintre dou\u0103 variabile ordinale, pe baza rangurilor", "B. Pentru compararea mediilor a trei sau mai multe grupuri independente", "C. Pentru rela\u021bia liniar\u0103 dintre dou\u0103 variabile continue, normal distribuite", "D. Pentru asocierea dintre dou\u0103 variabile nominale cu c\u00e2te dou\u0103 categorii"], "correct": 0, "explain": "Kendall (\u03c4) m\u0103soar\u0103 asocierea monoton\u0103 dintre variabile ordinale, pe perechi concordante \u0219i discordante, mai ales c\u00e2nd nu sunt \u00eendeplinite condi\u021biile pentru Pearson. Rela\u021bia liniar\u0103 dintre variabile continue e domeniul lui Pearson.", "tag": "Cap. 12 \u00b7 Kendall"}, {"q": "S15. Care este rolul grupului de control?", "opts": ["A. Permite generalizarea rezultatelor la \u00eentreaga popula\u021bie din care provine", "B. Serve\u0219te ca etalon de compara\u021bie pentru efectul real al interven\u021biei", "C. Prime\u0219te interven\u021bia experimental\u0103 \u00een locul grupului principal", "D. M\u0103soar\u0103 variabilele confundate care influen\u021beaz\u0103 rezultatul"], "correct": 1, "explain": "Grupul de control nu prime\u0219te interven\u021bia \u0219i e tratat identic \u00een rest, deci izoleaz\u0103 efectul VI \u0219i cre\u0219te validitatea intern\u0103. Generalizarea la popula\u021bie \u021bine de e\u0219antionare \u0219i inferen\u021b\u0103, nu de grupul de control.", "tag": "Metodologie \u00b7 grupul de control"}, {"q": "S16. Ce este \u00eenv\u0103\u021barea prin analogie \u00een contextul \u00eenv\u0103\u021b\u0103rii automate (ML)?", "opts": ["A. Rezolvarea problemelor noi prin comparare cu exemple similare cunoscute", "B. Gruparea datelor f\u0103r\u0103 etichete dup\u0103 asem\u0103n\u0103rile dintre ele", "C. \u00cenv\u0103\u021barea unor reguli explicite, formulate \u00een prealabil de un expert uman", "D. \u00cenv\u0103\u021barea prin recompense \u0219i penaliz\u0103ri primite de la mediu"], "correct": 0, "explain": "\u00cenv\u0103\u021barea prin analogie aplic\u0103 principiul \u201esitua\u021bii similare \u2192 solu\u021bii similare\u201d (k-NN, ra\u021bionamentul bazat pe cazuri). Regulile explicite \u021bin de sistemele expert, recompensele de \u00eenv\u0103\u021barea prin \u00eent\u0103rire, gruparea f\u0103r\u0103 etichete de clustering.", "tag": "Tehnologie \u00b7 ML"}, {"q": "S17. Care este rolul principal al interac\u021biunii om-calculator \u00een psihologie?", "opts": ["A. Studiul efectelor radia\u021biilor emise de ecrane asupra s\u0103n\u0103t\u0103\u021bii", "B. \u00cenlocuirea evalu\u0103rii psihologice clasice cu teste complet automatizate pe calculator", "C. Dezvoltarea componentelor hardware pentru calculatoare mai rapide", "D. Adaptarea tehnologiei la caracteristicile psihologice ale utilizatorilor"], "correct": 3, "explain": "Interac\u021biunea om\u2013calculator studiaz\u0103 cum percep \u0219i folosesc oamenii tehnologia, ca sistemele s\u0103 fie u\u0219or de utilizat, eficiente \u0219i ergonomice (usability, UX, mai pu\u021bine erori \u0219i mai pu\u021bin stres).", "tag": "Tehnologie \u00b7 IOC"}, {"q": "S18. Ce tip de comunicare este utilizat\u0103 \u00een terapia online prin e-mail?", "opts": ["A. Comunicare nonverbal\u0103, sincron\u0103", "B. Comunicare paraverbal\u0103, asincron\u0103", "C. Comunicare verbal\u0103 oral\u0103, sincron\u0103", "D. Comunicare verbal\u0103 scris\u0103, asincron\u0103"], "correct": 3, "explain": "E-mailul folose\u0219te cuvinte scrise (verbal\u0103) \u0219i are decalaj \u00eentre mesaj \u0219i r\u0103spuns (asincron\u0103). Nonverbalul \u0219i paraverbalul lipsesc \u00een e-mail; comunicarea sincron\u0103 e cea \u00een timp real (chat, video).", "tag": "Tehnologie \u00b7 terapie online"}, {"q": "S19. Care este diferen\u021ba principal\u0103 \u00eentre testul t Student \u0219i testul Mann-Whitney?", "opts": ["A. Testul t e parametric \u0219i compar\u0103 medii; Mann\u2013Whitney e neparametric \u0219i compar\u0103 ranguri", "B. Testul t e neparametric \u0219i compar\u0103 ranguri; Mann\u2013Whitney e parametric \u0219i compar\u0103 medii", "C. Testul t compar\u0103 trei sau mai multe grupuri; Mann\u2013Whitney compar\u0103 dou\u0103 grupuri", "D. Testul t compar\u0103 grupuri dependente; Mann\u2013Whitney compar\u0103 grupuri independente"], "correct": 0, "explain": "Ambele compar\u0103 dou\u0103 grupuri independente; diferen\u021ba e tipul testului. Testul t presupune normalitate \u0219i compar\u0103 mediile; Mann\u2013Whitney nu o presupune \u0219i compar\u0103 rangurile. Prima capcan\u0103 inverseaz\u0103 cele dou\u0103.", "tag": "Cap. 11 \u00b7 t vs Mann\u2013Whitney"}, {"q": "S20. Care test este utilizat pentru a compara dou\u0103 medii ale unor grupuri independente?", "opts": ["A. Testul Wilcoxon pentru e\u0219antioane pereche", "B. ANOVA cu m\u0103sur\u0103tori repetate", "C. Testul t pentru e\u0219antioane independente", "D. Testul t pentru e\u0219antioane pereche"], "correct": 2, "explain": "Dou\u0103 grupuri diferite, dou\u0103 medii \u2192 testul t pentru e\u0219antioane independente (alternativa neparametric\u0103: Mann\u2013Whitney). Variantele \u201epereche\u201d \u0219i \u201em\u0103sur\u0103tori repetate\u201d sunt pentru aceia\u0219i participan\u021bi.", "tag": "Cap. 9 \u00b7 t independente"}, {"q": "S21. Ce test neparametric este utilizat pentru a analiza datele cu dou\u0103 m\u0103sur\u0103tori repetate pe aceea\u0219i unitate experimental\u0103?", "opts": ["A. Testul Wilcoxon pentru e\u0219antioane pereche", "B. Testul Mann\u2013Whitney U", "C. Testul Kruskal\u2013Wallis", "D. Testul chi-p\u0103trat de independen\u021b\u0103"], "correct": 0, "explain": "Dou\u0103 m\u0103sur\u0103tori pe aceia\u0219i participan\u021bi, date nenormale \u2192 Wilcoxon, alternativa neparametric\u0103 la testul t pereche. Mann\u2013Whitney e pentru dou\u0103 grupuri independente, Kruskal\u2013Wallis pentru trei sau mai multe.", "tag": "Cap. 11 \u00b7 Wilcoxon"}, {"q": "S22. Care este scopul principal al regresiei logistice?", "opts": ["A. Prezicerea unei variabile dependente continue printr-o linie dreapt\u0103", "B. M\u0103surarea asocierii dintre dou\u0103 variabile ordinale prin ranguri", "C. Compararea mediilor a trei sau mai multe grupuri independente", "D. Estimarea probabilit\u0103\u021bii unui rezultat binar pe baza predictorilor"], "correct": 3, "explain": "Regresia logistic\u0103 modeleaz\u0103 o VD categorial\u0103, de regul\u0103 binar\u0103 (da/nu), \u0219i clasific\u0103 observa\u021biile. O VD continu\u0103 prezis\u0103 printr-o dreapt\u0103 e cazul regresiei liniare.", "tag": "Altele \u00b7 regresia logistic\u0103"}, {"q": "S23. Care este principala caracteristic\u0103 a testelor neparametrice?", "opts": ["A. Presupun distribu\u021bia normal\u0103 \u0219i omogenitatea varian\u021belor", "B. Nu presupun distribu\u021bia normal\u0103 \u0219i se bazeaz\u0103 pe ranguri sau frecven\u021be", "C. Compar\u0103 mediile popula\u021biilor pe baza abaterii standard", "D. Se aplic\u0103 doar e\u0219antioanelor mari, de peste 30 de subiec\u021bi \u00een fiecare grup"], "correct": 1, "explain": "Testele neparametrice nu depind de parametri ca media \u0219i abaterea standard, sunt potrivite pentru date ordinale \u0219i e\u0219antioane mici \u0219i sunt robuste la outlieri. Normalitatea \u0219i omogenitatea varian\u021belor sunt condi\u021biile testelor parametrice.", "tag": "Cap. 11 \u00b7 teste neparametrice"}, {"q": "S24. Ce presupune testul t pentru un e\u0219antion?", "opts": ["A. Compararea varian\u021belor a trei sau mai multe e\u0219antioane independente \u00eentre ele", "B. Compararea a dou\u0103 m\u0103sur\u0103tori pe acela\u0219i e\u0219antion", "C. Compararea mediilor a dou\u0103 e\u0219antioane independente", "D. Compararea mediei unui e\u0219antion cu o valoare cunoscut\u0103 sau teoretic\u0103"], "correct": 3, "explain": "Testul t pentru un e\u0219antion verific\u0103 dac\u0103 media unui grup difer\u0103 semnificativ de o valoare de referin\u021b\u0103 \u03bc\u2080 (de exemplu, media teoretic\u0103 100). Dou\u0103 e\u0219antioane sau dou\u0103 m\u0103sur\u0103tori cer alte teste t.", "tag": "Cap. 8 \u00b7 t un e\u0219antion"}, {"q": "S25. Ce presupune regresia liniar\u0103?", "opts": ["A. Compararea rangurilor a dou\u0103 grupuri independente \u00eentre ele", "B. Estimarea probabilit\u0103\u021bii ca o variabil\u0103 dependent\u0103 binar\u0103 s\u0103 ia valoarea 1 sau 0", "C. Compararea frecven\u021belor observate cu frecven\u021bele a\u0219teptate \u00een categorii", "D. Modelarea rela\u021biei dintre o VD \u0219i una sau mai multe VI printr-o linie dreapt\u0103"], "correct": 3, "explain": "Regresia liniar\u0103: Y = a + bX (simpl\u0103) sau Y = a + b\u2081X\u2081 + b\u2082X\u2082 + \u2026 (multipl\u0103), pentru explica\u021bie \u0219i predic\u021bie. Probabilitatea unui rezultat binar \u021bine de regresia logistic\u0103, frecven\u021bele de chi-p\u0103trat.", "tag": "Cap. 12 \u00b7 regresia liniar\u0103"}, {"q": "S26. Care test neparametric este echivalent cu testul t pentru e\u0219antioane independente?", "opts": ["A. Testul Kruskal\u2013Wallis", "B. Testul McNemar", "C. Testul Wilcoxon", "D. Testul Mann\u2013Whitney U"], "correct": 3, "explain": "Mann\u2013Whitney U compar\u0103 dou\u0103 grupuri independente pe ranguri, fiind echivalentul neparametric al testului t pentru e\u0219antioane independente. Wilcoxon corespunde testului t pereche, Kruskal\u2013Wallis lui ANOVA.", "tag": "Cap. 11 \u00b7 Mann\u2013Whitney"}, {"q": "S27. Care este diferen\u021ba principal\u0103 \u00eentre testul t Student \u0219i testul Mann-Whitney?", "opts": ["A. Testul t nu presupune normalitatea datelor; Mann\u2013Whitney presupune normalitatea datelor", "B. Testul t compar\u0103 dou\u0103 grupuri; Mann\u2013Whitney compar\u0103 trei sau mai multe grupuri", "C. Testul t se aplic\u0103 datelor nominale; Mann\u2013Whitney se aplic\u0103 datelor de interval", "D. Testul t presupune normalitate \u0219i compar\u0103 medii; Mann\u2013Whitney compar\u0103 ranguri"], "correct": 3, "explain": "Acela\u0219i subiect ca S19: testul t e parametric (date continue, normale, varian\u021be egale), Mann\u2013Whitney e neparametric (date ordinale sau nenormale, outlieri, e\u0219antioane mici). Ambele compar\u0103 dou\u0103 grupuri independente.", "tag": "Cap. 11 \u00b7 t vs Mann\u2013Whitney"}, {"q": "S28. Care este scopul principal al teoremei limit\u0103 central\u0103 (TLC)?", "opts": ["A. Arat\u0103 c\u0103 eroarea standard a mediei cre\u0219te odat\u0103 cu m\u0103rimea e\u0219antionului", "B. Arat\u0103 c\u0103 distribu\u021bia mediilor e\u0219antioanelor tinde spre normal\u0103 pentru e\u0219antioane mari", "C. Arat\u0103 c\u0103 distribu\u021bia scorurilor individuale devine normal\u0103 pentru e\u0219antioane suficient de mari", "D. Arat\u0103 c\u0103 abaterea standard a e\u0219antionului subestimeaz\u0103 abaterea popula\u021biei"], "correct": 1, "explain": "TLC prive\u0219te mediile e\u0219antioanelor, nu scorurile individuale: pentru n suficient de mare, distribu\u021bia lor e aproximativ normal\u0103, oricare ar fi forma popula\u021biei. De aceea se pot folosi testele parametrice. Eroarea standard (\u03c3/\u221an) scade c\u00e2nd n cre\u0219te.", "tag": "Cap. 6 \u00b7 TLC"}, {"q": "S29. Care test este utilizat pentru a compara dou\u0103 medii ale unor grupuri independente?", "opts": ["A. Analiza de varian\u021b\u0103 cu doi factori independen\u021bi", "B. Testul chi-p\u0103trat de independen\u021b\u0103", "C. Testul t Student pentru e\u0219antioane independente", "D. Coeficientul de corela\u021bie Pearson"], "correct": 2, "explain": "Acela\u0219i subiect ca S20. Chi-p\u0103tratul compar\u0103 frecven\u021be, ANOVA cu doi factori analizeaz\u0103 efectele a dou\u0103 VI, iar Pearson m\u0103soar\u0103 o rela\u021bie, nu o diferen\u021b\u0103 de medii.", "tag": "Cap. 9 \u00b7 t independente"}, {"q": "S30. Care este o condi\u021bie important\u0103 pentru stabilirea cauzalit\u0103\u021bii?", "opts": ["A. Efectul trebuie s\u0103 precead\u0103 cauza \u00een timp", "B. Cauza trebuie s\u0103 precead\u0103 efectul \u00een timp", "C. Variabilele trebuie m\u0103surate la nivel nominal", "D. E\u0219antionul trebuie s\u0103 dep\u0103\u0219easc\u0103 30 de participan\u021bi"], "correct": 1, "explain": "Prioritatea temporal\u0103 e o condi\u021bie esen\u021bial\u0103 a cauzalit\u0103\u021bii, al\u0103turi de covaria\u021bie \u0219i controlul variabilelor externe (excluderea explica\u021biilor alternative).", "tag": "Metodologie \u00b7 cauzalitate"}]}, "2": {"title": "Subiectele 31\u201360", "desc": "30 de \u00eentreb\u0103ri, ca o variant\u0103 de examen. Alege un r\u0103spuns ca s\u0103 vezi explica\u021bia.", "questions": [{"q": "S31. Ce tip de scal\u0103 este utilizat\u0103 pentru a m\u0103sura variabilele precum genul sau na\u021bionalitatea?", "opts": ["A. Scala de interval", "B. Scala de raport", "C. Scala nominal\u0103", "D. Scala ordinal\u0103"], "correct": 2, "explain": "Genul \u0219i na\u021bionalitatea sunt categorii distincte, f\u0103r\u0103 ordine \u00eentre ele \u2192 scal\u0103 nominal\u0103. Scala ordinal\u0103 presupune o ordine, cele de interval \u0219i raport distan\u021be egale.", "tag": "Cap. 1 \u00b7 niveluri de m\u0103sur\u0103"}, {"q": "S32. Care dintre urm\u0103toarele instrumente este cel mai utilizat pentru analiza datelor \u00een psihologie?", "opts": ["A. AutoCAD", "B. Adobe Photoshop", "C. Microsoft Word", "D. SPSS"], "correct": 3, "explain": "SPSS e unul dintre cele mai folosite programe pentru analiza datelor \u00een psihologie, cu o gam\u0103 larg\u0103 de tehnici statistice.", "tag": "SPSS \u00b7 instrument"}, {"q": "S33. Ce tip de analiz\u0103 este utilizat pentru a face predic\u021bii despre comportamentele viitoare pe baza datelor anterioare?", "opts": ["A. Analiza de regresie", "B. Analiza de varian\u021b\u0103 (ANOVA)", "C. Testul chi-p\u0103trat", "D. Statistica descriptiv\u0103"], "correct": 0, "explain": "Regresia folose\u0219te rela\u021biile dintre variabile pentru a prezice scorurile unei variabile din altele. ANOVA \u0219i chi-p\u0103tratul testeaz\u0103 diferen\u021be sau asocieri, iar statistica descriptiv\u0103 doar rezum\u0103 datele.", "tag": "Cap. 12 \u00b7 predic\u021bie"}, {"q": "S34. Care este principala func\u021bie a creierului reptilian?", "opts": ["A. Procesarea emo\u021biilor \u0219i formarea amintirilor de lung\u0103 durat\u0103 prin hipocamp", "B. Coordonarea echilibrului \u0219i a mi\u0219c\u0103rilor fine ale corpului", "C. G\u00e2ndirea abstract\u0103, limbajul \u0219i planificarea ac\u021biunilor", "D. Func\u021biile de baz\u0103 ale supravie\u021buirii: reflexe, ritm cardiac, respira\u021bie"], "correct": 3, "explain": "Creierul reptilian asigur\u0103 supravie\u021buirea: reflexe, ritm cardiac, respira\u021bie \u0219i comportamente instinctuale (reproducere, agresiune). Emo\u021biile \u0219i memoria \u021bin de sistemul limbic, g\u00e2ndirea abstract\u0103 de neocortex.", "tag": "Neuro \u00b7 trei creiere"}, {"q": "S35. Care dintre urm\u0103toarele manifest\u0103ri fizice este asociat\u0103 cu megatrendurile Industry 4.0?", "opts": ["A. Folosirea ma\u0219inilor cu abur \u00een fabricile mari", "B. Automatizarea industrial\u0103, cu robo\u021bi \u0219i sisteme conectate", "C. Cre\u0219terea num\u0103rului de muncitori necalifica\u021bi pe liniile de produc\u021bie", "D. Revenirea la produc\u021bia artizanal\u0103, realizat\u0103 manual"], "correct": 1, "explain": "Automatizarea industrial\u0103 (robo\u021bi, inteligen\u021b\u0103 artificial\u0103, IoT \u00een fabrica\u021bie) este manifestarea fizic\u0103 a megatrendurilor Industry 4.0.", "tag": "Tehnologie \u00b7 Industry 4.0"}, {"q": "S36. Care dintre urm\u0103toarele caracteristici ale Industry 4.0 permite interac\u021biunea dintre dispozitive inteligente \u0219i procesele de fabrica\u021bie?", "opts": ["A. Re\u021beaua de telefonie fix\u0103", "B. Realitatea virtual\u0103 (VR)", "C. Internetul lucrurilor (IoT)", "D. Produc\u021bia pe band\u0103 rulant\u0103"], "correct": 2, "explain": "IoT conecteaz\u0103 echipamentele \u0219i sistemele \u00eentr-o re\u021bea digital\u0103, permi\u021b\u00e2nd colectarea \u0219i analiza datelor \u00een timp real \u00een procesele de fabrica\u021bie.", "tag": "Tehnologie \u00b7 IoT"}, {"q": "S37. Ce parte a creierului este responsabil\u0103 pentru g\u00e2ndirea ra\u021bional\u0103, analitic\u0103 \u0219i pentru luarea deciziilor?", "opts": ["A. Lobul temporal", "B. Cerebelul", "C. Lobul frontal", "D. Lobul occipital"], "correct": 2, "explain": "Lobul frontal sus\u021bine g\u00e2ndirea ra\u021bional\u0103, planificarea, rezolvarea problemelor, decizia \u0219i controlul impulsurilor. Lobul occipital proceseaz\u0103 vederea, cel temporal auzul \u0219i limbajul, cerebelul coordonarea.", "tag": "Neuro \u00b7 lobul frontal"}, {"q": "S38. Ce func\u021bie este asociat\u0103 cu emisfera dreapt\u0103 a creierului?", "opts": ["A. Limbajul, vorbirea \u0219i ra\u021bionamentul matematic", "B. Analiza secven\u021bial\u0103, pas cu pas, a detaliilor unei probleme", "C. Creativitatea, arta, recunoa\u0219terea fe\u021belor \u0219i intui\u021bia", "D. Controlul mi\u0219c\u0103rilor p\u0103r\u021bii drepte a corpului"], "correct": 2, "explain": "Emisfera dreapt\u0103 e asociat\u0103 cu creativitatea, g\u00e2ndirea abstract\u0103, arta, recunoa\u0219terea vizual\u0103 a obiectelor \u0219i fe\u021belor, emo\u021biile \u0219i intui\u021bia. Limbajul, calculul, analiza secven\u021bial\u0103 \u0219i controlul p\u0103r\u021bii drepte \u021bin de emisfera st\u00e2ng\u0103.", "tag": "Neuro \u00b7 emisfera dreapt\u0103"}, {"q": "S39. Care este func\u021bia principal\u0103 a lobului frontal st\u00e2ng (LFS)?", "opts": ["A. Procesarea vizuo-spa\u021bial\u0103 \u0219i orientarea", "B. Procesarea primar\u0103 a informa\u021biei vizuale", "C. Limbajul, vorbirea \u0219i procesele logice", "D. Recunoa\u0219terea fe\u021belor \u0219i a emo\u021biilor"], "correct": 2, "explain": "Lobul frontal st\u00e2ng e implicat \u00een limbaj, vorbire, rezolvarea problemelor \u0219i ra\u021bionamentul matematic. Orientarea spa\u021bial\u0103 \u021bine de lobul parietal drept, fe\u021bele de emisfera dreapt\u0103, vederea primar\u0103 de lobul occipital.", "tag": "Neuro \u00b7 lobul frontal st\u00e2ng"}, {"q": "S40. Undele EEG de tip alfa sunt asociate cu:", "opts": ["A. St\u0103ri de relaxare, \u00een veghe, cu ochii \u00eenchi\u0219i", "B. Concentrare intens\u0103 \u0219i stare de alert\u0103", "C. Somnolen\u021b\u0103 \u0219i medita\u021bie profund\u0103", "D. Somn profund, f\u0103r\u0103 vise"], "correct": 0, "explain": "Undele alfa apar \u00een veghea relaxat\u0103, cu ochii \u00eenchi\u0219i, f\u0103r\u0103 somn. Somnul profund are unde delta, concentrarea \u0219i alerta unde beta, somnolen\u021ba unde theta.", "tag": "Neuro \u00b7 EEG"}, {"q": "S41. Care este rolul principal al cortexului cerebral?", "opts": ["A. Coordonarea echilibrului \u0219i a mi\u0219c\u0103rilor fine, voluntare, ale corpului", "B. Reglarea automat\u0103 a ritmului cardiac \u0219i a respira\u021biei", "C. Producerea hormonilor care controleaz\u0103 metabolismul", "D. Procesarea senzorial\u0103 \u0219i motorie \u0219i func\u021biile cognitive superioare"], "correct": 3, "explain": "Cortexul cerebral proceseaz\u0103 informa\u021biile senzoriale \u0219i motorii \u0219i sus\u021bine g\u00e2ndirea, memoria, limbajul \u0219i decizia. Ritmul cardiac \u021bine de trunchiul cerebral, echilibrul de cerebel, hormonii de sistemul endocrin.", "tag": "Neuro \u00b7 cortex"}, {"q": "S42. Ce tip de corela\u021bie exist\u0103 atunci c\u00e2nd cre\u0219terea unei variabile este asociat\u0103 cu sc\u0103derea celeilalte?", "opts": ["A. Corela\u021bie negativ\u0103", "B. Corela\u021bie par\u021bial\u0103", "C. Corela\u021bie pozitiv\u0103", "D. Corela\u021bie nul\u0103"], "correct": 0, "explain": "C\u00e2nd o variabil\u0103 cre\u0219te \u0219i cealalt\u0103 scade, variabilele se mi\u0219c\u0103 \u00een direc\u021bii opuse: corela\u021bie negativ\u0103 (invers\u0103). Corela\u021bia pozitiv\u0103 \u00eenseamn\u0103 aceea\u0219i direc\u021bie; corela\u021bia par\u021bial\u0103 controleaz\u0103 o a treia variabil\u0103.", "tag": "Cap. 12 \u00b7 sensul corela\u021biei"}, {"q": "S43. Cum se nume\u0219te procesul de analiz\u0103 a datelor experimentale pentru a generaliza rezultatele ob\u021binute pe un e\u0219antion, la \u00eentreaga popula\u021bie?", "opts": ["A. E\u0219antionare", "B. Opera\u021bionalizare", "C. Inferen\u021b\u0103 statistic\u0103", "D. Statistic\u0103 descriptiv\u0103"], "correct": 2, "explain": "Inferen\u021ba statistic\u0103 generalizeaz\u0103 de la e\u0219antion la popula\u021bie. Statistica descriptiv\u0103 doar prezint\u0103 \u0219i rezum\u0103 datele, iar e\u0219antionarea e alegerea subiec\u021bilor.", "tag": "Cap. 1 \u00b7 inferen\u021b\u0103"}, {"q": "S44. Care este principalul scop al analizei ANOVA?", "opts": ["A. Compararea mediilor a exact dou\u0103 grupuri", "B. M\u0103surarea rela\u021biei liniare dintre dou\u0103 variabile", "C. Compararea frecven\u021belor din mai multe categorii", "D. Compararea mediilor a trei sau mai multe grupuri"], "correct": 3, "explain": "ANOVA compar\u0103 mediile a trei sau mai multe grupuri, pe baza variabilit\u0103\u021bii dintre grupuri \u0219i din interiorul lor. Pentru dou\u0103 medii se folose\u0219te testul t, pentru frecven\u021be chi-p\u0103tratul.", "tag": "Cap. 10 \u00b7 scopul ANOVA"}, {"q": "S45. Ce presupune analiza ANOVA cu m\u0103sur\u0103tori repetate?", "opts": ["A. Compararea mediilor \u00een mai multe condi\u021bii m\u0103surate la aceia\u0219i subiec\u021bi", "B. Compararea mediilor unor grupuri formate din subiec\u021bi diferi\u021bi", "C. Repetarea testului t pentru fiecare pereche de grupuri", "D. Compararea rangurilor a trei sau mai multe grupuri formate din subiec\u021bi diferi\u021bi"], "correct": 0, "explain": "La ANOVA cu m\u0103sur\u0103tori repetate, aceia\u0219i subiec\u021bi sunt m\u0103sura\u021bi de mai multe ori, de obicei \u00een condi\u021bii diferite. Subiec\u021bii diferi\u021bi \u00een fiecare grup \u00eenseamn\u0103 ANOVA pentru e\u0219antioane independente.", "tag": "Cap. 10 \u00b7 m\u0103sur\u0103tori repetate"}, {"q": "S46. Ce condi\u021bie trebuie \u00eendeplinit\u0103 pentru ca datele s\u0103 poat\u0103 fi analizate prin ANOVA?", "opts": ["A. Varian\u021be c\u00e2t mai diferite \u00eentre grupurile comparate", "B. Distribu\u021bie normal\u0103, varian\u021be omogene, observa\u021bii independente", "C. Date ordinale \u0219i e\u0219antioane pereche de dimensiuni mici", "D. Date nominale, frecven\u021be a\u0219teptate peste 5 \u00een fiecare celul\u0103"], "correct": 1, "explain": "ANOVA cere observa\u021bii independente, distribu\u021bie normal\u0103, varian\u021be omogene \u00een grupuri \u0219i o VD continu\u0103. Frecven\u021bele a\u0219teptate peste 5 sunt condi\u021bia chi-p\u0103tratului.", "tag": "Cap. 10 \u00b7 condi\u021bii ANOVA"}, {"q": "S47. Care este principala func\u021bie a testului t Student pentru variabile independente?", "opts": ["A. Compararea mediilor a dou\u0103 grupuri independente", "B. Compararea mediilor a trei sau mai multe grupuri", "C. Compararea mediei unui grup cu o valoare teoretic\u0103", "D. Compararea a dou\u0103 m\u0103sur\u0103tori pe aceia\u0219i participan\u021bi"], "correct": 0, "explain": "Testul t pentru e\u0219antioane independente verific\u0103 dac\u0103 diferen\u021ba dintre mediile a dou\u0103 grupuri diferite e semnificativ\u0103 statistic. O valoare teoretic\u0103 cere testul t pentru un e\u0219antion, aceia\u0219i participan\u021bi testul t pereche.", "tag": "Cap. 9 \u00b7 t independente"}, {"q": "S48. Care dintre urm\u0103toarele estim\u0103ri SPSS este utilizat\u0103 pentru a calcula regresia liniar\u0103?", "opts": ["A. Analyze \u2192 Correlate \u2192 Bivariate", "B. Analyze \u2192 Regression \u2192 Linear", "C. Analyze \u2192 Descriptive Statistics \u2192 Frequencies", "D. Analyze \u2192 Compare Means \u2192 Means"], "correct": 1, "explain": "Regresia liniar\u0103 se calculeaz\u0103 din op\u021biunea \u201eLinear Regression\u201d (Analyze \u2192 Regression \u2192 Linear), care d\u0103 coeficien\u021bii \u0219i indicatorii regresiei. Correlate \u2192 Bivariate e pentru corela\u021bia Pearson.", "tag": "SPSS \u00b7 regresie"}, {"q": "S49. Ce reprezint\u0103 intervalul de \u00eencredere \u00een statistica inferen\u021bial\u0103?", "opts": ["A. Intervalul dintre cel mai mic \u0219i cel mai mare scor observat \u00een e\u0219antion", "B. Un interval care con\u021bine parametrul popula\u021biei cu un anumit grad de \u00eencredere", "C. Intervalul \u00een care se afl\u0103 95% din scorurile individuale observate \u00een e\u0219antion", "D. Probabilitatea ca ipoteza de nul s\u0103 fie adev\u0103rat\u0103 pentru popula\u021bie"], "correct": 1, "explain": "Intervalul de \u00eencredere estimeaz\u0103 parametrul popula\u021biei (de obicei cu 95% \u00eencredere) \u0219i arat\u0103 precizia estim\u0103rii. Distan\u021ba dintre scorul minim \u0219i cel maxim e amplitudinea; intervalul prive\u0219te parametrul, nu scorurile individuale.", "tag": "Cap. 7 \u00b7 interval de \u00eencredere"}, {"q": "S50. Ce presupune testul U al lui Mann-Whitney?", "opts": ["A. Compararea a dou\u0103 grupuri independente, f\u0103r\u0103 a presupune normalitatea", "B. Compararea a dou\u0103 m\u0103sur\u0103tori repetate pe aceia\u0219i subiec\u021bi", "C. Compararea a trei sau mai multe grupuri independente", "D. Compararea mediilor a dou\u0103 grupuri independente cu distribu\u021bie normal\u0103"], "correct": 0, "explain": "Mann\u2013Whitney U compar\u0103 dou\u0103 grupuri independente pe o variabil\u0103 ordinal\u0103 sau continu\u0103, c\u00e2nd nu sunt \u00eendeplinite condi\u021biile testului t. M\u0103sur\u0103torile repetate cer Wilcoxon, trei sau mai multe grupuri Kruskal\u2013Wallis.", "tag": "Cap. 11 \u00b7 Mann\u2013Whitney"}, {"q": "S51. Cum se nume\u0219te regresia utilizat\u0103 c\u00e2nd variabila dependent\u0103 este nominal\u0103 cu mai multe niveluri?", "opts": ["A. Regresia logistic\u0103 binar\u0103", "B. Regresia liniar\u0103 multipl\u0103", "C. Regresia liniar\u0103 simpl\u0103", "D. Regresia logistic\u0103 multinomial\u0103"], "correct": 3, "explain": "O VD nominal\u0103 cu mai mult de dou\u0103 categorii cere regresia logistic\u0103 multinomial\u0103. Cea binar\u0103 e pentru dou\u0103 categorii (da/nu), iar regresiile liniare pentru o VD continu\u0103.", "tag": "Altele \u00b7 regresia logistic\u0103"}, {"q": "S52. Ce presupune testul Chi-p\u0103trat pentru independen\u021b\u0103?", "opts": ["A. Compararea frecven\u021belor observate cu cele a\u0219teptate la independen\u021b\u0103", "B. Calculul pantei dreptei de regresie dintre dou\u0103 variabile continue", "C. Compararea rangurilor a dou\u0103 m\u0103sur\u0103tori pereche pe aceia\u0219i subiec\u021bi", "D. Compararea mediilor a dou\u0103 grupuri independente pe o variabil\u0103 continu\u0103"], "correct": 0, "explain": "Chi-p\u0103tratul de independen\u021b\u0103 verific\u0103 asocierea dintre dou\u0103 variabile categoriale, compar\u00e2nd frecven\u021bele observate cu cele a\u0219teptate sub ipoteza lipsei de asociere.", "tag": "Cap. 11 \u00b7 chi-p\u0103trat"}, {"q": "S53. Care este testul neparametric folosit pentru a analiza mai multe grupuri corelate?", "opts": ["A. Testul Friedman", "B. Testul Kruskal\u2013Wallis", "C. Testul Mann\u2013Whitney U", "D. Testul Wilcoxon"], "correct": 0, "explain": "Friedman compar\u0103 trei sau mai multe grupuri corelate (aceia\u0219i subiec\u021bi), f\u0103r\u0103 normalitate. Kruskal\u2013Wallis e pentru grupuri independente, Wilcoxon pentru dou\u0103 grupuri corelate.", "tag": "Altele \u00b7 Friedman"}, {"q": "S54. Ce presupune testul Kruskal-Wallis?", "opts": ["A. Compararea mediilor a trei sau mai multe grupuri normal distribuite", "B. Compararea a trei sau mai multe m\u0103sur\u0103tori pe aceia\u0219i subiec\u021bi", "C. Compararea a dou\u0103 grupuri independente, f\u0103r\u0103 a presupune normalitatea", "D. Compararea a trei sau mai multe grupuri independente, f\u0103r\u0103 normalitate"], "correct": 3, "explain": "Kruskal\u2013Wallis e echivalentul neparametric al ANOVA pentru grupuri independente. Dou\u0103 grupuri independente cer Mann\u2013Whitney, aceia\u0219i subiec\u021bi Friedman, iar grupurile normal distribuite ANOVA.", "tag": "Cap. 11 \u00b7 Kruskal\u2013Wallis"}, {"q": "S55. Ce test este utilizat pentru a compara mediile a dou\u0103 grupuri independente?", "opts": ["A. Testul McNemar", "B. Testul t Student", "C. Testul Kruskal\u2013Wallis", "D. Testul F (ANOVA)"], "correct": 1, "explain": "Acela\u0219i subiect ca S20 \u0219i S29: testul t Student compar\u0103 mediile a dou\u0103 grupuri independente. ANOVA e pentru trei sau mai multe grupuri, McNemar pentru frecven\u021be pereche.", "tag": "Cap. 9 \u00b7 t independente"}, {"q": "S56. Ce presupune testul ANOVA?", "opts": ["A. Compararea frecven\u021belor observate cu frecven\u021bele a\u0219teptate \u00een fiecare celul\u0103", "B. Compararea rangurilor a dou\u0103 grupuri independente", "C. Calculul corela\u021biei dintre dou\u0103 variabile continue", "D. Compararea varian\u021bei dintre grupuri cu varian\u021ba din interiorul grupurilor"], "correct": 3, "explain": "ANOVA compar\u0103 mediile a trei sau mai multe grupuri analiz\u00e2nd raportul dintre varian\u021ba dintre grupuri \u0219i cea din interiorul grupurilor (raportul F).", "tag": "Cap. 10 \u00b7 ANOVA"}, {"q": "S57. Cum se nume\u0219te testul care compar\u0103 mediile a dou\u0103 grupuri independente \u00een SPSS?", "opts": ["A. One-Sample T Test", "B. Independent-Samples T Test", "C. One-Way ANOVA", "D. Paired-Samples T Test"], "correct": 1, "explain": "\u00cen SPSS, mediile a dou\u0103 grupuri independente se compar\u0103 cu Independent-Samples T Test (Analyze \u2192 Compare Means). Paired-Samples e pentru aceia\u0219i participan\u021bi, One-Sample pentru o valoare de referin\u021b\u0103.", "tag": "SPSS \u00b7 test t"}, {"q": "S58. Ce reprezint\u0103 PC2 \u00een contextul psihoterapiei online?", "opts": ["A. Un al doilea calculator folosit de terapeut \u00een \u0219edin\u021b\u0103", "B. O platform\u0103 public\u0103 de discu\u021bii online pentru grupuri mari de pacien\u021bi", "C. O comunicare privat\u0103, confiden\u021bial\u0103 \u00eentre terapeut \u0219i pacient", "D. Un program de calculator pentru diagnosticul automat"], "correct": 2, "explain": "Conform PDF-ului, PC2 \u00eenseamn\u0103 \u201ePrivate Communication\u201d: comunicare confiden\u021bial\u0103 care protejeaz\u0103 informa\u021biile personale \u00een \u0219edin\u021bele online. Explica\u021bia din PDF nu are surs\u0103.", "tag": "Tehnologie \u00b7 terapie online"}, {"q": "S59. Care dintre urm\u0103toarele nu este o form\u0103 de terapie online?", "opts": ["A. Terapia prin videoconferin\u021b\u0103", "B. Terapia fa\u021b\u0103 \u00een fa\u021b\u0103, \u00een cabinet", "C. Terapia prin telefon", "D. Terapia prin e-mail"], "correct": 1, "explain": "Terapia online include \u0219edin\u021bele video, prin telefon sau prin e-mail; terapia fa\u021b\u0103 \u00een fa\u021b\u0103, \u00een persoan\u0103, nu e o form\u0103 online.", "tag": "Tehnologie \u00b7 terapie online"}, {"q": "S60. Care este impactul major al realit\u0103\u021bii virtuale \u00een psihoterapie?", "opts": ["A. Diagnosticarea automat\u0103 a tulbur\u0103rilor psihice prin analiza undelor cerebrale", "B. Expunerea controlat\u0103 \u0219i sigur\u0103 la situa\u021bii temute (fobii, anxietate, PTSD)", "C. Administrarea testelor psihologice standardizate direct pe calculator", "D. \u00cenlocuirea complet\u0103 a terapeutului cu un program automat de terapie"], "correct": 1, "explain": "Realitatea virtual\u0103 creeaz\u0103 medii controlate \u0219i sigure pentru expunere (anxietate, fobii, stres post-traumatic), prin simul\u0103ri imersive.", "tag": "Tehnologie \u00b7 VR"}]}, "3": {"title": "Subiectele 61\u201390", "desc": "30 de \u00eentreb\u0103ri, ca o variant\u0103 de examen. Alege un r\u0103spuns ca s\u0103 vezi explica\u021bia.", "questions": [{"q": "S61. Care dintre urm\u0103toarele tipuri de variabile necesit\u0103 distribu\u021bie normal\u0103 \u0219i sunt m\u0103surate pe scale de interval sau raport?", "opts": ["A. Variabilele ordinale, m\u0103surate prin ranguri", "B. Variabilele dihotomice, cu dou\u0103 categorii", "C. Variabilele nominale, cu categorii distincte \u0219i f\u0103r\u0103 ordine", "D. Variabilele continue, de interval sau de raport"], "correct": 3, "explain": "Variabilele continue (interval, raport) sunt cele pentru care testele parametrice (t, ANOVA) presupun distribu\u021bia normal\u0103. Mai exact: normalitatea e o condi\u021bie a testului, nu o proprietate cerut\u0103 variabilei.", "tag": "Cap. 5 \u00b7 normalitate"}, {"q": "S62. Care este scopul principal al statisticii psihologice \u00een cercetarea comportamental\u0103?", "opts": ["A. Elaborarea testelor psihologice standardizate", "B. Colectarea datelor demografice despre participan\u021bii la cercetare", "C. Analiza datelor pentru a identifica tipare \u0219i a testa teoriile", "D. \u00cenlocuirea observa\u021biei directe a comportamentului"], "correct": 2, "explain": "Statistica psihologic\u0103 analizeaz\u0103 \u0219i interpreteaz\u0103 datele pentru a identifica tipare \u00een comportament \u0219i procese mentale, a valida teorii \u0219i a fundamenta decizii.", "tag": "Cap. 1 \u00b7 scopul statisticii"}, {"q": "S63. Ce indicator al statisticii descriptive m\u0103soar\u0103 dispersia datelor \u00eentr-un set de date?", "opts": ["A. Mediana \u0219i modul", "B. Frecven\u021ba \u0219i procentul", "C. Abaterea standard \u0219i varian\u021ba", "D. Media \u0219i modul"], "correct": 2, "explain": "Abaterea standard \u0219i varian\u021ba arat\u0103 c\u00e2t de mult difer\u0103 valorile fa\u021b\u0103 de medie (dispersia). Media, mediana \u0219i modul sunt m\u0103rimi ale tendin\u021bei centrale.", "tag": "Cap. 4 \u00b7 dispersie"}, {"q": "S64. Conform teoriei celor trei creiere, care dintre urm\u0103toarele func\u021bii sunt procesate de creierul reptilian \u0219i limbic?", "opts": ["A. Reptilianul: echilibru \u0219i coordonare; limbicul: percep\u021bie vizual\u0103", "B. Reptilianul: emo\u021bii \u0219i memorie; limbicul: supravie\u021buire \u0219i instincte", "C. Reptilianul: supravie\u021buire \u0219i instincte; limbicul: emo\u021bii \u0219i memorie", "D. Reptilianul: limbaj \u0219i logic\u0103; limbicul: planificare \u0219i decizie"], "correct": 2, "explain": "Creierul reptilian gestioneaz\u0103 comportamentele de supravie\u021buire \u0219i instinctuale; creierul limbic controleaz\u0103 emo\u021biile \u0219i memoria, r\u0103spunsurile emo\u021bionale \u0219i comportamentele sociale. Prima capcan\u0103 inverseaz\u0103 cele dou\u0103.", "tag": "Neuro \u00b7 trei creiere"}, {"q": "S65. Care dintre urm\u0103toarele biosemnale este utilizat pentru monitorizarea activit\u0103\u021bii electrice a creierului?", "opts": ["A. Electroencefalografia (EEG)", "B. Electrooculografia (EOG)", "C. Electrocardiografia (ECG)", "D. Electromiografia (EMG)"], "correct": 0, "explain": "EEG \u00eenregistreaz\u0103 undele cerebrale, adic\u0103 activitatea electric\u0103 a creierului. ECG e pentru inim\u0103, EMG pentru mu\u0219chi, EOG pentru mi\u0219c\u0103rile ochilor.", "tag": "Neuro \u00b7 biosemnale"}, {"q": "S66. Care este asocierea (func\u021bia) principal\u0103 a lobului temporal st\u00e2ng (LTS)?", "opts": ["A. Recunoa\u0219terea fe\u021belor \u0219i a melodiilor", "B. Procesarea limbajului \u0219i memoria verbal\u0103", "C. Orientarea \u00een spa\u021biu \u0219i percep\u021bia ad\u00e2ncimii", "D. Planificarea \u0219i controlul impulsurilor"], "correct": 1, "explain": "Lobul temporal st\u00e2ng proceseaz\u0103 limbajul (\u00een\u021belegerea vorbirii) \u0219i memoria verbal\u0103. Orientarea spa\u021bial\u0103 \u021bine de lobul parietal drept, planificarea de lobul frontal.", "tag": "Neuro \u00b7 lobul temporal st\u00e2ng"}, {"q": "S67. Care dintre urm\u0103toarele func\u021bii este atribuit\u0103 lobului parietal drept (LPD)?", "opts": ["A. \u00cen\u021belegerea \u0219i producerea limbajului", "B. Procesarea vizuo-spa\u021bial\u0103 \u0219i orientarea \u00een spa\u021biu", "C. Planificarea \u0219i luarea deciziilor", "D. Formarea \u0219i consolidarea amintirilor de lung\u0103 durat\u0103"], "correct": 1, "explain": "Lobul parietal drept proceseaz\u0103 informa\u021biile vizuale \u0219i spa\u021biale: percep\u021bia ad\u00e2ncimii \u0219i orientarea. Limbajul \u021bine de emisfera st\u00e2ng\u0103, amintirile de hipocamp.", "tag": "Neuro \u00b7 lobul parietal drept"}, {"q": "S68. Ce regiune a creierului este responsabil\u0103 pentru controlul mi\u0219c\u0103rilor motorii \u0219i coordonarea echilibrului?", "opts": ["A. Cerebelul", "B. Amigdala", "C. Hipotalamusul", "D. Trunchiul cerebral"], "correct": 0, "explain": "Cerebelul coordoneaz\u0103 mi\u0219c\u0103rile fine \u0219i men\u021bine echilibrul. Hipotalamusul regleaz\u0103 func\u021bii vegetative \u0219i hormonale, amigdala proceseaz\u0103 emo\u021biile.", "tag": "Neuro \u00b7 cerebel"}, {"q": "S69. Ce m\u0103soar\u0103 analiza de corela\u021bie?", "opts": ["A. C\u00e2t de str\u00e2ns sunt asociate dou\u0103 sau mai multe variabile", "B. C\u00e2t de mare este diferen\u021ba dintre mediile a dou\u0103 grupuri", "C. Dac\u0103 una dintre variabile este cauza celeilalte", "D. C\u00e2t de \u00eempr\u0103\u0219tiate sunt scorurile \u00een jurul mediei"], "correct": 0, "explain": "Corela\u021bia arat\u0103 asocierea (pozitiv\u0103, negativ\u0103 sau nul\u0103), f\u0103r\u0103 a dovedi cauzalitatea. Diferen\u021ba dintre medii \u021bine de testul t, \u00eempr\u0103\u0219tierea scorurilor de m\u0103rimile dispersiei.", "tag": "Cap. 12 \u00b7 corela\u021bie"}, {"q": "S70. Ce reprezint\u0103 variabila dependent\u0103 (VD) \u00eentr-un experiment?", "opts": ["A. Variabila men\u021binut\u0103 constant\u0103 pentru to\u021bi participan\u021bii", "B. Variabila care explic\u0103 de ce VI influen\u021beaz\u0103 rezultatul", "C. Rezultatul m\u0103surat, care reflect\u0103 efectul variabilei independente", "D. Variabila manipulat\u0103 de cercet\u0103tor pentru a produce un efect asupra VD"], "correct": 2, "explain": "VD e ce m\u0103soar\u0103 cercet\u0103torul; depinde de manipularea VI. Variabila manipulat\u0103 e VI, cea men\u021binut\u0103 constant\u0103 e controlat\u0103, iar cea care explic\u0103 rela\u021bia e mediatoare.", "tag": "Cap. 10 \u00b7 VD"}, {"q": "S71. Ce tip de ANOVA este folosit atunci c\u00e2nd se analizeaz\u0103 efectele a dou\u0103 sau mai multe variabile independente?", "opts": ["A. ANOVA unifactorial\u0103 (cu un singur factor)", "B. Testul t pentru e\u0219antioane independente", "C. ANOVA cu m\u0103sur\u0103tori repetate", "D. ANOVA factorial\u0103 (cu doi sau mai mul\u021bi factori)"], "correct": 3, "explain": "ANOVA factorial\u0103 analizeaz\u0103 efectele a dou\u0103 sau mai multe VI (factori) \u0219i interac\u021biunea lor. Cea unifactorial\u0103 are o singur\u0103 VI.", "tag": "Cap. 10 \u00b7 ANOVA factorial\u0103"}, {"q": "S72. Ce reprezint\u0103 valoarea p \u00een rezultatele ANOVA?", "opts": ["A. Probabilitatea ca diferen\u021bele observate s\u0103 se datoreze \u00eent\u00e2mpl\u0103rii", "B. Propor\u021bia din varian\u021ba total\u0103 explicat\u0103 de diferen\u021bele dintre grupuri", "C. Num\u0103rul de grupuri care difer\u0103 semnificativ \u00eentre ele", "D. M\u0103rimea diferen\u021bei dintre cea mai mare \u0219i cea mai mic\u0103 medie"], "correct": 0, "explain": "Valoarea p arat\u0103 c\u00e2t de probabil e ca diferen\u021bele s\u0103 apar\u0103 doar din \u00eent\u00e2mplare; sub pragul ales (de obicei 0,05) ele sunt semnificative. p nu spune c\u00e2t de mare e diferen\u021ba \u0219i nici care grupuri difer\u0103 (pentru asta exist\u0103 testele post hoc).", "tag": "Cap. 10 \u00b7 valoarea p"}, {"q": "S73. \u00cen SPSS, ce fereastr\u0103 este utilizat\u0103 pentru vizualizarea variabilelor care constituie structura bazei de date?", "opts": ["A. Output Viewer", "B. Variable View", "C. Data View", "D. Syntax Editor"], "correct": 1, "explain": "Structura bazei de date (numele, tipul, etichetele \u0219i nivelul de m\u0103sur\u0103 al variabilelor) se vede \u00een Variable View; Data View arat\u0103 valorile introduse. Aten\u021bie: PDF-ul r\u0103spunde \u201eData View\u201d, deci verific\u0103 ce variant\u0103 se accept\u0103 la examen.", "tag": "SPSS \u00b7 ferestre"}, {"q": "S74. Care este comanda din SPSS pentru a efectua o analiz\u0103 de corela\u021bie Pearson?", "opts": ["A. Analyze \u2192 Regression \u2192 Linear", "B. Analyze \u2192 Descriptive Statistics \u2192 Crosstabs", "C. Analyze \u2192 Correlate \u2192 Bivariate", "D. Analyze \u2192 Compare Means \u2192 Means"], "correct": 2, "explain": "Corela\u021bia Pearson se calculeaz\u0103 din Analyze \u2192 Correlate \u2192 Bivariate, unde se aleg variabilele. Regression \u2192 Linear e pentru regresie, Crosstabs pentru tabele de contingen\u021b\u0103.", "tag": "SPSS \u00b7 corela\u021bie"}, {"q": "S75. Ce este intervalul de \u00eencredere \u00een statistica inferen\u021bial\u0103?", "opts": ["A. O estimare a parametrului printr-o singur\u0103 valoare calculat\u0103 din e\u0219antion", "B. Diferen\u021ba dintre media e\u0219antionului \u0219i media popula\u021biei", "C. Intervalul de valori \u00een care se afl\u0103 toate scorurile e\u0219antionului", "D. Un interval de valori care con\u021bine parametrul cu un nivel de \u00eencredere"], "correct": 3, "explain": "Intervalul de \u00eencredere d\u0103 o gam\u0103 de valori \u00een care se afl\u0103 parametrul cu un nivel de \u00eencredere (de obicei 95%). Estimarea printr-o singur\u0103 valoare e estimarea punctual\u0103.", "tag": "Cap. 7 \u00b7 interval de \u00eencredere"}, {"q": "S76. Ce m\u0103soar\u0103 coeficientul de corela\u021bie Pearson?", "opts": ["A. For\u021ba rela\u021biei dintre dou\u0103 variabile ordinale, pe baza rangurilor", "B. Gradul de asociere dintre dou\u0103 variabile nominale", "C. For\u021ba \u0219i direc\u021bia rela\u021biei liniare dintre dou\u0103 variabile continue", "D. Diferen\u021ba dintre mediile a dou\u0103 variabile continue"], "correct": 2, "explain": "Pearson ia valori \u00eentre \u22121 (corela\u021bie negativ\u0103 perfect\u0103) \u0219i +1 (pozitiv\u0103 perfect\u0103) \u0219i cere variabile continue cu rela\u021bie liniar\u0103. Pentru ranguri se folosesc Spearman sau Kendall.", "tag": "Cap. 12 \u00b7 Pearson"}, {"q": "S77. Care test este utilizat pentru a compara distribu\u021biile a dou\u0103 grupuri independente cu date neparametrice?", "opts": ["A. Testul t pentru e\u0219antioane independente", "B. Testul Mann\u2013Whitney U", "C. Testul Friedman", "D. Testul Wilcoxon pentru e\u0219antioane pereche"], "correct": 1, "explain": "Mann\u2013Whitney compar\u0103 distribu\u021biile a dou\u0103 grupuri independente cu date neparametrice. Testul t e varianta parametric\u0103, Wilcoxon e pentru grupuri pereche, Friedman pentru trei sau mai multe grupuri corelate.", "tag": "Cap. 11 \u00b7 Mann\u2013Whitney"}, {"q": "S78. Care este semnifica\u021bia unui test statistic \u00een contextul unui interval de \u00eencredere?", "opts": ["A. Dac\u0103 valoarea din H0 cade \u00een interiorul intervalului, rezultatul e semnificativ", "B. Dac\u0103 media e\u0219antionului cade \u00een interval, rezultatul e semnificativ", "C. Dac\u0103 intervalul este mai larg, rezultatul este mai semnificativ statistic", "D. Dac\u0103 valoarea din H0 cade \u00een afara intervalului, rezultatul e semnificativ"], "correct": 3, "explain": "Un rezultat e semnificativ (la \u03b1 = 0,05) c\u00e2nd valoarea din ipoteza de nul cade \u00een afara intervalului de \u00eencredere de 95%. Media e\u0219antionului e mereu \u00een centrul intervalului, deci nu poate decide. PDF-ul vorbe\u0219te de \u201evaloarea estimat\u0103\u201d, formulare imprecis\u0103.", "tag": "Cap. 7 \u00b7 semnifica\u021bie \u0219i interval"}, {"q": "S79. Care este scopul testului Chi-p\u0103trat \u00een cercetare?", "opts": ["A. Compararea a trei sau mai multe m\u0103sur\u0103tori repetate", "B. Evaluarea asocierii dintre dou\u0103 variabile categoriale", "C. M\u0103surarea rela\u021biei liniare dintre dou\u0103 variabile continue", "D. Compararea mediilor a dou\u0103 grupuri independente"], "correct": 1, "explain": "Chi-p\u0103tratul verific\u0103 dac\u0103 exist\u0103 o rela\u021bie semnificativ\u0103 \u00eentre dou\u0103 variabile categoriale, compar\u00e2nd frecven\u021bele observate cu cele a\u0219teptate.", "tag": "Cap. 11 \u00b7 chi-p\u0103trat"}, {"q": "S80. Ce reprezint\u0103 cauzalitatea \u00een cercetare?", "opts": ["A. Rela\u021bia \u00een care o variabil\u0103 r\u0103m\u00e2ne constant\u0103 de-a lungul timpului", "B. Rela\u021bia dintre un e\u0219antion \u0219i popula\u021bia din care a fost extras", "C. Rela\u021bia \u00een care dou\u0103 variabile variaz\u0103 \u00eempreun\u0103, f\u0103r\u0103 influen\u021b\u0103 direct\u0103", "D. Rela\u021bia \u00een care o variabil\u0103 produce o schimbare direct\u0103 \u00een alta"], "correct": 3, "explain": "Cauzalitatea: cauza produce o schimbare \u00een efect. Varia\u021bia \u00eempreun\u0103, f\u0103r\u0103 influen\u021b\u0103 demonstrat\u0103, e doar corela\u021bie; corela\u021bia nu dovede\u0219te cauzalitatea.", "tag": "Metodologie \u00b7 cauzalitate"}, {"q": "S81. Ce caracteristic\u0103 are testul Wilcoxon?", "opts": ["A. Test parametric pentru dou\u0103 grupuri corelate, bazat pe mediile diferen\u021belor dintre perechi", "B. Test neparametric pentru dou\u0103 grupuri corelate, bazat pe rangurile diferen\u021belor", "C. Test neparametric pentru frecven\u021be categoriale m\u0103surate \u00een perechi", "D. Test neparametric pentru dou\u0103 grupuri independente, bazat pe ranguri"], "correct": 1, "explain": "Wilcoxon e alternativa neparametric\u0103 la testul t pereche: ordoneaz\u0103 pe ranguri diferen\u021bele dintre perechi. Varianta parametric\u0103 e testul t pereche, grupurile independente cer Mann\u2013Whitney, frecven\u021bele pereche McNemar.", "tag": "Cap. 11 \u00b7 Wilcoxon"}, {"q": "S82. Ce presupune ANOVA cu m\u0103suri repetate?", "opts": ["A. Compararea mediilor aceluia\u0219i grup \u00een mai multe condi\u021bii sau momente", "B. Compararea mediilor mai multor grupuri diferite, fiecare m\u0103surat o singur\u0103 dat\u0103", "C. Compararea rangurilor aceluia\u0219i grup \u00een dou\u0103 momente diferite", "D. Analiza efectelor a doi factori asupra unor grupuri independente"], "correct": 0, "explain": "ANOVA cu m\u0103suri repetate folose\u0219te acela\u0219i grup de participan\u021bi \u00een mai multe m\u0103sur\u0103tori sau condi\u021bii. Grupurile diferite cer ANOVA pentru e\u0219antioane independente, iar rangurile \u00een dou\u0103 momente testul Wilcoxon.", "tag": "Cap. 10 \u00b7 m\u0103sur\u0103tori repetate"}, {"q": "S83. Care dintre urm\u0103toarele condi\u021bii trebuie \u00eendeplinite pentru aplicarea testului t pentru e\u0219antioane independente?", "opts": ["A. Normalitate \u00een ambele grupuri, varian\u021be omogene, grupuri independente", "B. Date ordinale, e\u0219antioane mici \u0219i prezen\u021ba valorilor extreme", "C. Normalitate \u00een ambele grupuri, varian\u021be omogene, aceia\u0219i participan\u021bi", "D. Date nominale, frecven\u021be a\u0219teptate peste 5, grupuri independente"], "correct": 0, "explain": "Testul t pentru e\u0219antioane independente cere date normal distribuite \u00een ambele grupuri, varian\u021be omogene \u0219i grupuri independente. Aceia\u0219i participan\u021bi ar cere testul t pereche; datele ordinale cu outlieri, Mann\u2013Whitney.", "tag": "Cap. 9 \u00b7 condi\u021bii test t"}, {"q": "S84. Ce tip de memorie este asociat\u0103 cu \u00eenv\u0103\u021barea prin repeti\u021bie \u0219i asociere?", "opts": ["A. Memoria episodic\u0103", "B. Memoria senzorial\u0103", "C. Memoria semantic\u0103", "D. Memoria procedural\u0103"], "correct": 3, "explain": "Memoria procedural\u0103 re\u021bine abilit\u0103\u021bi motorii \u0219i proceduri \u00eenv\u0103\u021bate prin repetare. Memoria episodic\u0103 re\u021bine evenimente tr\u0103ite, cea semantic\u0103 cuno\u0219tin\u021be generale.", "tag": "Neuro \u00b7 memorie"}, {"q": "S85. Care este principala func\u021bie a creierului reptilian?", "opts": ["A. Limbajul \u0219i procesarea informa\u021biei verbale", "B. Supravie\u021buirea: lupt\u0103 sau fug\u0103, ritm cardiac, respira\u021bie", "C. Emo\u021biile \u0219i memoria, prin amigdal\u0103 \u0219i hipocamp, \u00een situa\u021bii de pericol", "D. G\u00e2ndirea ra\u021bional\u0103 \u0219i luarea deciziilor"], "correct": 1, "explain": "Acela\u0219i subiect ca S34: creierul reptilian asigur\u0103 func\u021biile de supravie\u021buire (lupt\u0103 sau fug\u0103, ritm cardiac, respira\u021bie) \u0219i comportamentele instinctuale legate de teritoriu \u0219i reproducere.", "tag": "Neuro \u00b7 trei creiere"}, {"q": "S86. \u00cen regresia liniar\u0103 simpl\u0103, ce reprezint\u0103 coeficientul \"a\"?", "opts": ["A. Interceptul: valoarea estimat\u0103 a lui Y c\u00e2nd X = 0", "B. Coeficientul de corela\u021bie dintre variabilele X \u0219i Y", "C. Panta: cu c\u00e2t cre\u0219te Y c\u00e2nd X cre\u0219te cu o unitate", "D. Eroarea standard a estim\u0103rii variabilei Y"], "correct": 0, "explain": "\u00cen Y = a + bX, \u201ea\u201d e interceptul (punctul \u00een care dreapta taie axa Y), iar \u201eb\u201d e panta.", "tag": "Cap. 12 \u00b7 regresia liniar\u0103"}, {"q": "S87. Care este diferen\u021ba principal\u0103 \u00eentre analiza parametric\u0103 \u0219i nonparametric\u0103?", "opts": ["A. Parametrica se bazeaz\u0103 pe ranguri; nonparametrica se bazeaz\u0103 pe mediile grupurilor", "B. Nonparametrica presupune distribu\u021bie normal\u0103; parametrica nu face aceast\u0103 presupunere", "C. Parametrica se aplic\u0103 datelor nominale; nonparametrica se aplic\u0103 datelor de raport", "D. Parametrica presupune distribu\u021bie normal\u0103; nonparametrica nu face aceast\u0103 presupunere"], "correct": 3, "explain": "Analiza parametric\u0103 presupune normalitate \u0219i estimeaz\u0103 parametrii popula\u021biei; cea nonparametric\u0103 nu face aceste presupuneri \u0219i lucreaz\u0103 pe ranguri sau frecven\u021be. Prima capcan\u0103 inverseaz\u0103 cele dou\u0103.", "tag": "Cap. 11 \u00b7 parametric vs nonparametric"}, {"q": "S88. Care este caracteristica unui experiment diacron (longitudinal)?", "opts": ["A. Grupuri de v\u00e2rste diferite sunt comparate la un singur moment \u00een timp", "B. Participan\u021bii sunt repartiza\u021bi aleatoriu \u00een dou\u0103 grupuri", "C. Aceia\u0219i participan\u021bi sunt urm\u0103ri\u021bi pe o perioad\u0103 lung\u0103 de timp", "D. Experimentul se desf\u0103\u0219oar\u0103 \u00een mediul natural, f\u0103r\u0103 control"], "correct": 2, "explain": "Experimentul longitudinal (diacron) colecteaz\u0103 date de la aceia\u0219i participan\u021bi \u00een timp, ca s\u0103 urm\u0103reasc\u0103 schimb\u0103rile. Compararea grupurilor de v\u00e2rste la un singur moment e designul transversal (sincron).", "tag": "Metodologie \u00b7 longitudinal"}, {"q": "S89. Care este diferen\u021ba principal\u0103 \u00eentre un experiment de laborator \u0219i un experiment natural?", "opts": ["A. Laboratorul nu are variabil\u0103 independent\u0103; experimentul natural nu are VD", "B. Experimentul natural ofer\u0103 control mare; laboratorul are loc \u00een condi\u021bii naturale", "C. Laboratorul folose\u0219te e\u0219antioane mari; experimentul natural folose\u0219te e\u0219antioane mici", "D. Laboratorul are control mare al variabilelor; experimentul natural, mai pu\u021bin"], "correct": 3, "explain": "Experimentul de laborator are loc \u00eentr-un mediu controlat, cu control mare asupra variabilelor; cel natural se desf\u0103\u0219oar\u0103 \u00een condi\u021bii naturale, cu mai pu\u021bin control al variabilelor externe. Prima capcan\u0103 le inverseaz\u0103.", "tag": "Metodologie \u00b7 tipuri de experiment"}, {"q": "S90. Ce tehnologie joac\u0103 un rol important \u00een transformarea proceselor de fabrica\u021bie \u00een Industry 4.0?", "opts": ["A. Ma\u0219ina cu abur", "B. Banda rulant\u0103", "C. Internetul lucrurilor (IoT)", "D. Telefonia fix\u0103"], "correct": 2, "explain": "IoT interconecteaz\u0103 dispozitive \u0219i ma\u0219ini inteligente care colecteaz\u0103 \u0219i analizeaz\u0103 date \u00een timp real, optimiz\u00e2nd fabrica\u021bia. Ma\u0219ina cu abur \u0219i banda rulant\u0103 \u021bin de revolu\u021biile industriale 1 \u0219i 2.", "tag": "Tehnologie \u00b7 IoT"}]}}};
const UI = {"progress": "Progres: ", "of": " / ", "score": "Scor: ", "qword": "\u00centrebarea ", "explainLabel": "Explica\u021bie: ", "finalTitle": "Rezultat final", "reset": "Reia testul", "correctAns": "Ai r\u0103spuns corect la ", "outOf": " din ", "qsuffix": " \u00eentreb\u0103ri. ", "msgPerfect": "Perfect! St\u0103p\u00e2ne\u0219ti complet acest material. \ud83c\udf89", "msgGood": "Foarte bine! Recapituleaz\u0103 doar \u00eentreb\u0103rile gre\u0219ite.", "msgOk": "Bine, dar revezi conceptele marcate cu ro\u0219u.", "msgLow": "Recite\u0219te materialul, apoi reia testul.", "tabPrefix": "Runda ", "resultsLabel": "Rezultatele tale \u2014 pentru feedback personalizat:", "copyBtn": "Copiaz\u0103 rezultatele", "copied": "Copiat! Lipe\u0219te-l \u00een conversa\u021bia cu Claude.", "downloadBtn": "Descarc\u0103 .txt", "resultsHint": "Copiaz\u0103 blocul de mai sus \u0219i lipe\u0219te-l \u00een chat \u2014 Claude \u00ee\u021bi va spune exact ce s\u0103 repe\u021bi.", "resultsHeader": "REZULTATE QUIZ", "chosenWord": "ales ", "correctWord": "corect ", "allCorrect": "Toate corecte.", "roundWord": "Runda "};
const TAB_LABELS = {"1": "Subiectele 1\u201330", "2": "Subiectele 31\u201360", "3": "Subiectele 61\u201390"};
const roundKeys = Object.keys(QUIZ.rounds);
let state = {};
roundKeys.forEach(k => state[k] = {});
let currentRound = roundKeys[0];

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function buildRound(n){
  const data = QUIZ.rounds[n];
  let html = '<div class="roundwrap" data-round="'+n+'"'+(n===currentRound?'':' style="display:none"')+'>';
  html += '<div class="roundtitle">'+esc(data.title)+'</div>';
  html += '<div class="rounddesc">'+esc(data.desc)+'</div>';
  data.questions.forEach((item,qi)=>{
    html += '<div class="q" id="q-'+n+'-'+qi+'">';
    html += '<div class="qnum">'+esc(UI.qword)+(qi+1)+'</div>';
    html += '<div class="qtext">'+esc(item.q)+'</div>';
    item.opts.forEach((opt,oi)=>{
      html += '<button class="opt" data-n="'+n+'" data-qi="'+qi+'" data-oi="'+oi+'">'+esc(opt)+'</button>';
    });
    html += '<div class="explain" id="ex-'+n+'-'+qi+'"><b>'+esc(UI.explainLabel)+'</b>'+esc(item.explain)+'</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function answer(n,qi,oi){
  if(state[n][qi]!==undefined) return;
  state[n][qi]=oi;
  const correct = QUIZ.rounds[n].questions[qi].correct;
  const qDiv = document.getElementById('q-'+n+'-'+qi);
  const btns = qDiv.querySelectorAll('.opt');
  btns.forEach((b,idx)=>{
    b.disabled=true;
    if(idx===correct){ b.classList.add('correct'); b.innerHTML += '<span class="mark">\u2713</span>'; }
    else if(idx===oi){ b.classList.add('wrong'); b.innerHTML += '<span class="mark">\u2717</span>'; }
  });
  document.getElementById('ex-'+n+'-'+qi).classList.add('show');
  updateScore();
}

function buildResultsSummary(){
  const lines = [];
  lines.push(UI.resultsHeader);
  lines.push(QUIZ.title);
  roundKeys.forEach(k => {
    const qs = QUIZ.rounds[k].questions;
    const answers = state[k];
    const answeredCount = Object.keys(answers).length;
    if(answeredCount === 0) return;
    let score = 0; const wrong = [];
    qs.forEach((q,i) => {
      const a = answers[i];
      if(a === undefined) return;
      if(a === q.correct) score++;
      else wrong.push({i, a, q});
    });
    lines.push('');
    lines.push(UI.roundWord + k + ': ' + score + '/' + answeredCount);
    if(wrong.length === 0){ lines.push(UI.allCorrect); }
    wrong.forEach(w => {
      const tag = w.q.tag ? (' [' + w.q.tag + ']') : '';
      const stem = w.q.q.length > 60 ? w.q.q.slice(0,60) + '\u2026' : w.q.q;
      lines.push('Q' + (w.i+1) + tag + ': ' + UI.chosenWord + String.fromCharCode(65+w.a)
        + ', ' + UI.correctWord + String.fromCharCode(65+w.q.correct) + ' \u2014 ' + stem);
    });
  });
  return lines.join('\n');
}

function copyResults(){
  const ta = document.getElementById('results-text');
  const done = () => {
    const btn = document.getElementById('copybtn');
    const old = btn.textContent;
    btn.textContent = UI.copied;
    setTimeout(()=>{ btn.textContent = old; }, 2500);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(done, ()=>{ ta.select(); done(); });
  } else { ta.select(); try{ document.execCommand('copy'); }catch(e){} done(); }
}

function downloadResults(){
  const txt = document.getElementById('results-text').value;
  const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rezultate_quiz.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

function updateScore(){
  const answers = state[currentRound];
  const qs = QUIZ.rounds[currentRound].questions;
  let answered=0, score=0;
  Object.keys(answers).forEach(k=>{ answered++; if(answers[k]===qs[k].correct) score++; });
  document.getElementById('lbl-progress').innerHTML = esc(UI.progress)+'<strong>'+answered+'</strong>'+esc(UI.of)+'<strong>'+qs.length+'</strong>';
  document.getElementById('lbl-score').innerHTML = esc(UI.score)+'<strong>'+score+'</strong>';
  if(answered===qs.length){
    const pct = Math.round((score/qs.length)*100);
    document.getElementById('finalpct').textContent = pct+'%';
    let msg;
    if(pct===100) msg=UI.msgPerfect;
    else if(pct>=80) msg=UI.msgGood;
    else if(pct>=60) msg=UI.msgOk;
    else msg=UI.msgLow;
    document.getElementById('finalmsg').textContent = UI.correctAns+score+UI.outOf+qs.length+UI.qsuffix+msg;
    document.getElementById('results-text').value = buildResultsSummary();
    document.getElementById('final').classList.add('show');
  } else {
    document.getElementById('final').classList.remove('show');
  }
}

function switchRound(n){
  currentRound=n;
  document.querySelectorAll('.tab').forEach(t=>{ t.classList.toggle('active', t.dataset.round===n); });
  document.querySelectorAll('.roundwrap').forEach(r=>{ r.style.display = (r.dataset.round===n)?'':'none'; });
  updateScore();
}

function resetAll(){
  roundKeys.forEach(k => state[k] = {});
  renderRounds();
  document.getElementById('final').classList.remove('show');
  updateScore();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderTabs(){
  const wrap = document.getElementById('tabs');
  if(roundKeys.length < 2){ wrap.style.display='none'; return; }
  let html='';
  roundKeys.forEach((k,i)=>{
    const label = (TAB_LABELS && TAB_LABELS[k]) ? TAB_LABELS[k] : (UI.tabPrefix + (i+1));
    const count = QUIZ.rounds[k].questions.length;
    html += '<button class="tab'+(k===currentRound?' active':'')+'" data-round="'+k+'">'+esc(label)+' ('+count+')</button>';
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll('.tab').forEach(t=>{ t.addEventListener('click', ()=> switchRound(t.dataset.round)); });
}

function renderRounds(){
  let html='';
  roundKeys.forEach(k=>{ html += buildRound(k); });
  document.getElementById('rounds').innerHTML = html;
  document.querySelectorAll('.opt').forEach(b=>{
    b.addEventListener('click', ()=> answer(b.dataset.n, parseInt(b.dataset.qi), parseInt(b.dataset.oi)));
  });
}

document.getElementById('hdr-title').textContent = QUIZ.title;
document.getElementById('hdr-sub').textContent = QUIZ.subtitle;
document.getElementById('final-h').textContent = UI.finalTitle;
document.getElementById('resetbtn').textContent = UI.reset;
document.getElementById('resetbtn').addEventListener('click', resetAll);
document.getElementById('results-label').textContent = UI.resultsLabel;
document.getElementById('results-hint').textContent = UI.resultsHint;
document.getElementById('copybtn').textContent = UI.copyBtn;
document.getElementById('copybtn').addEventListener('click', copyResults);
document.getElementById('dlbtn').textContent = UI.downloadBtn;
document.getElementById('dlbtn').addEventListener('click', downloadResults);
renderTabs();
renderRounds();
updateScore();
</script>
</body>
</html>
