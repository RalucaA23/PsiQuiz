<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subiecte examen ianuarie 2026 · Analiza superioară a datelor</title>
<style>
  :root { --bg:#f4f1ea; --card:#fff; --ink:#2c2a26; --muted:#6b6760; --accent:#7a5c3e; --soft:#efe6d8;
    --border:#ddd5c7; --optbg:#faf8f3; --warn:#9a5a12; --warnbg:#fbf0dd; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, 'Times New Roman', serif; background: var(--bg); color: var(--ink); margin: 0; line-height: 1.55; font-size: 17px; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 18px 12px 80px; }
  .book { text-align: center; padding: 18px 8px 10px; }
  .book h1 { font-size: 1.7rem; margin: 0; color: var(--accent); line-height: 1.25; }
  .book .sub { color: var(--muted); font-style: italic; margin: 6px 0 0; }
  .toc { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin: 10px 0 16px; }
  .toc h2 { font-size: .9rem; margin: 0 0 8px; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
  .toc .row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dotted var(--border); cursor: pointer; }
  .toc .row:last-of-type { border-bottom: 0; }
  .toc .row span:first-child { border-left: 4px solid var(--bc); padding-left: 8px; }
  .toc .row b { color: var(--muted); font-weight: normal; white-space: nowrap; }
  .toc .sep { margin: 10px 0 2px; color: var(--muted); font-size: .85rem; font-style: italic; }
  .toc .note { color: var(--muted); font-size: .82rem; margin: 10px 0 0; line-height: 1.45; }
  .tools { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tools input { flex: 1 1 180px; min-width: 0; font-family: inherit; font-size: 1rem; padding: 8px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); color: var(--ink); }
  .btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-family: inherit; font-size: .9rem; }
  .btn.on { background: var(--accent); color: #fff; }
  .seg { display: inline-flex; }
  .seg .btn { border-radius: 0; }
  .seg .btn:first-child { border-radius: 999px 0 0 999px; }
  .seg .btn:last-child { border-radius: 0 999px 999px 0; border-left: 0; }
  .captag { display: block; font-weight: normal; font-size: .78rem; color: var(--bc); letter-spacing: .02em; }
  .count { color: var(--muted); font-size: .85rem; width: 100%; }
  .grp { margin: 22px 0 0; scroll-margin-top: 64px; }
  .mmroot { text-align: center; background: var(--bc); color: #fff; border-radius: 16px; padding: 10px 16px; font-weight: bold; font-size: 1.05rem; }
  .mmroot small { display: block; font-weight: normal; opacity: .9; font-size: .82rem; }
  .branch { background: var(--card); border: 1px solid var(--border); border-top: 5px solid var(--bc); border-radius: 14px; padding: 12px 15px; margin-top: 12px; }
  .bhead { cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
  .bhead .nr { background: var(--bc); color: #fff; border-radius: 8px; padding: 1px 7px; font-size: .8rem; font-weight: bold; white-space: nowrap; margin-top: 3px; }
  .bhead .qq { flex: 1; font-weight: bold; color: var(--ink); }
  .bhead .tri { color: var(--bc); font-weight: bold; }
  .ans { margin: 10px 0 0; background: var(--optbg); border-left: 3px solid var(--bc); border-radius: 8px; padding: 8px 12px; }
  .ans i { color: var(--bc); font-style: normal; font-weight: bold; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; display: block; }
  .node { margin: 9px 0 0; padding-left: 12px; border-left: 2px solid var(--bc); }
  .node b { display: block; }
  .node span { font-size: .95rem; }
  .pdf { margin: 12px 0 0; border-top: 1px dashed var(--border); padding-top: 8px; }
  .pdf > i { color: var(--muted); font-style: normal; font-weight: bold; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; display: block; margin-bottom: 4px; }
  .pdf p { margin: 4px 0; }
  .pdf p.num { font-weight: bold; margin-top: 10px; }
  .pdf h4 { margin: 10px 0 2px; font-size: 1rem; color: var(--bc); }
  .pdf ul { margin: 2px 0 4px; padding-left: 22px; }
  .pdf table { border-collapse: collapse; width: 100%; font-size: .9rem; margin: 6px 0; }
  .pdf td, .pdf th { border: 1px solid var(--border); padding: 5px 7px; text-align: left; vertical-align: top; }
  .pdf th { background: var(--soft); }
  .where { margin: 10px 0 0; color: var(--muted); font-size: .86rem; font-style: italic; }
  .ref { margin: 8px 0 0; color: var(--muted); font-size: .88rem; }
  .nota { margin: 8px 0 0; background: var(--warnbg); color: var(--warn); border-radius: 8px; padding: 6px 10px; font-size: .88rem; }
  .closed .body { display: none; }
  .hide { display: none; }
  mark { background: #f3dd9b; color: inherit; padding: 0 1px; border-radius: 3px; }
  .top { display: block; text-align: right; margin-top: 6px; font-size: .82rem; color: var(--muted); cursor: pointer; }
  @media (max-width: 480px) { body { font-size: 16px; } .book h1 { font-size: 1.4rem; } .branch { padding: 11px 12px; } }
</style>
</head>

(function(){
var D = {"g": [{"k": "c1", "et": "Cap. 1", "tit": "Introducere în statistică", "col": "#7a5c3e", "s": [{"nr": 3, "q": "Care sunt tipurile de date utilizate pentru a descrie atribute sau caracteristici psihologice?", "r": "Date nominale, ordinale, de interval și de raport (primele două calitative, ultimele două cantitative).", "e": [{"p": "1. Date nominale"}, {"p": "Clasifică participanții în categorii distincte, fără ordine."}, {"p": "Răspund la întrebarea: „Ce tip?”"}, {"p": "Exemple: gen (feminin/masculin), diagnostic (prezent/absent), tip de personalitate."}, {"p": "Utilizare: identificare și clasificare."}, {"p": "2. Date ordinale"}, {"p": "Implică ordonare, dar fără distanțe egale între categorii."}, {"p": "Răspund la întrebarea: „În ce ordine?”"}, {"p": "Exemple: nivel scăzut/mediu/ridicat de anxietate, ranguri, scale de satisfacție."}, {"p": "Utilizare: compararea poziției relative."}, {"p": "3. Date de interval"}, {"p": "Au intervale egale între valori, dar nu au zero absolut."}, {"p": "Răspund la întrebarea: „Cu cât mai mult?”"}, {"p": "Exemple: scor IQ, scoruri la teste psihologice standardizate, temperatura în °C."}, {"p": "Utilizare: analize statistice avansate (medie, deviație standard)."}, {"p": "4. Date de raport (ratio)"}, {"p": "Au intervale egale și zero absolut."}, {"p": "Permit toate operațiile matematice."}, {"p": "Exemple: timp de reacție, număr de erori, vârsta, durata unui comportament."}, {"p": "Utilizare: cele mai precise măsurători cantitative."}, {"p": "Clasificare generală"}, {"p": "Date calitative: nominale, ordinale"}, {"p": "Date cantitative: interval, raport"}], "u": "Cap. 1, secțiunea 1.6 (niveluri de măsură).", "n": "În grila scanată de la final, întrebarea apare ca „atribute care nu pot fi măsurate numeric” — atunci răspunsul vizat e „date calitative”.", "w": true}, {"nr": 31, "q": "Ce tip de scală este utilizată pentru a măsura variabilele precum genul sau naționalitatea?", "r": "Scala nominală: categorii distincte, fără ordine.", "e": [{"p": "Variabilele precum genul sau naționalitatea sunt măsurate pe o scală nominală."}, {"p": "Aceasta este o scală categorială care clasifică datele în grupuri distincte, fără a implica un ordin sau o diferență între ele."}], "u": "Cap. 1, secțiunea 1.6.", "n": "", "w": false}, {"nr": 43, "q": "Cum se numește procesul de analiză a datelor experimentale pentru a generaliza rezultatele obținute pe un eșantion la întreaga populație?", "r": "Inferența statistică.", "e": [{"p": "Acest proces se numește inferență statistică, prin care se utilizează datele dintr-un eșantion pentru a face predicții sau concluzii despre întreaga populație."}], "u": "Cap. 1, secțiunea 1.5 (statistici descriptive și inferențiale); strategia inferențială în Cap. 6 (Eșantionarea și distribuții de eșantionare).", "n": "", "w": false}, {"nr": 62, "q": "Care este scopul principal al statisticii psihologice în cercetarea comportamentală?", "r": "Analiza și interpretarea datelor pentru a identifica tipare în comportament și procese mentale, a valida teorii și a lua decizii informate.", "e": [{"p": "Scopul principal al statisticii psihologice este de a analiza și interpreta datele pentru a identifica tipare în comportamentele și procesele mentale, ajutând la validarea teoriilor psihologice și la luarea de decizii informate în practică."}], "u": "Cap. 1 (statistica ca set de instrumente pentru a răspunde la întrebări și a testa ipoteze).", "n": "", "w": false}]}, {"k": "c4", "et": "Cap. 4", "tit": "Mărimile dispersiei", "col": "#2f6f8f", "s": [{"nr": 63, "q": "Ce indicator al statisticii descriptive măsoară dispersia datelor într-un set de date?", "r": "Abaterea standard și varianța: cât de mult diferă valorile față de medie.", "e": [{"p": "Indicatorii care măsoară dispersia datelor sunt deviația standard și varianța."}, {"p": "Aceștia indică cât de mult diferă valorile față de media unui set de date."}], "u": "Cap. 4.", "n": "", "w": false}]}, {"k": "c5", "et": "Cap. 5", "tit": "Distribuția normală", "col": "#8a4f7d", "s": [{"nr": 61, "q": "Care tipuri de variabile necesită distribuție normală și sunt măsurate pe scale de interval sau raport?", "r": "Variabilele continue (interval sau raport) — normalitatea e cerută ca să poți aplica teste parametrice (t, ANOVA).", "e": [{"p": "Variabilele continue, măsurate pe scale de interval sau raport, necesită distribuție normală pentru a putea aplica analize statistice parametrice, cum ar fi testele t sau ANOVA."}], "u": "Cap. 5 (modelul normal se aplică variabilelor de interval sau de raport); nivelurile în Cap. 1 (Introducere în statistică).", "n": "Mai exact: nu variabila „necesită” normalitate, ci testele parametrice presupun date aproximativ normale.", "w": true}]}, {"k": "c6", "et": "Cap. 6", "tit": "Eșantionarea și distribuții de eșantionare", "col": "#4f7a3a", "s": [{"nr": 28, "q": "Care este scopul principal al teoremei limită centrală (TLC)?", "r": "Arată că distribuția mediilor eșantioanelor tinde spre normală, indiferent de forma populației, dacă eșantionul e suficient de mare.", "e": [{"p": "Teorema limită centrală are ca scop principal să arate că distribuția mediilor eșantioanelor tinde către o distribuție normală, indiferent de forma distribuției populației, dacă eșantionul este suficient de mare."}, {"h": "Ce afirmă pe scurt:"}, {"p": "Pentru eșantioane mari, media eșantionului este aproximativ normal distribuită."}, {"p": "Acest lucru este valabil chiar dacă datele inițiale nu sunt normale."}, {"h": "De ce este importantă:"}, {"b": "Permite utilizarea testelor parametrice (t, ANOVA etc.)"}, {"b": "Face posibilă inferenta statistică"}, {"b": "Leagă statisticile eșantionului de parametrii populației"}, {"h": "Răspuns foarte scurt pentru examen:"}, {"p": "1. Teorema limită centrală explică de ce mediile eșantioanelor au o distribuție normală pentru eșantioane suficient de mari, indiferent de distribuția populației."}, {"p": "2. Scopul principal al teoremei limită centrală este să explice comportamentul distribuției mediei eșantionului pe măsură ce mărimea eșantionului crește. Conform TLC, mediile eșantionului tind să urmeze o distribuție normală, indiferent de distribuția populației, atunci când eșantionul este suficient de mare."}], "u": "Cap. 6 (teorema limitei centrale).", "n": "", "w": false}]}, {"k": "c7", "et": "Cap. 7", "tit": "Proceduri de estimare statistică", "col": "#b0603a", "s": [{"nr": 49, "q": "Ce reprezintă intervalul de încredere în statistica inferențială?", "r": "Un interval estimat care conține valoarea reală a unui parametru al populației cu un anumit grad de încredere (de obicei 95%); arată cât de precisă e estimarea.", "e": [{"p": "Intervalul de încredere reprezintă un interval estimativ care conține valoarea reală a unui parametru al populației cu un anumit grad de încredere (de obicei 95%), indicând cât de precis este un estimat pe baza unui eșantion."}], "u": "Cap. 7 (estimarea prin interval).", "n": "Vezi și S75.", "w": false}, {"nr": 75, "q": "Ce este intervalul de încredere în statistica inferențială?", "r": "O estimare a unui parametru populațional sub forma unui interval de valori care îl conține cu un anumit nivel de încredere (de obicei 95%).", "e": [{"p": "Intervalul de încredere reprezintă o estimare a unui parametru populațional, oferind o gamă de valori în care se află cu un anumit nivel de încredere (de obicei 95%) valoarea reală a parametrului."}], "u": "Cap. 7.", "n": "Vezi și S49.", "w": false}, {"nr": 78, "q": "Care este semnificația unui test statistic în contextul unui interval de încredere?", "r": "Dacă valoarea din ipoteza de nul (de pildă diferența 0) cade în afara intervalului de încredere de 95%, rezultatul e semnificativ la α = 0,05; dacă e în interval, nu respingem H0.", "e": [{"p": "Semnificația unui test statistic într-un interval de încredere arată dacă valoarea estimată a parametrului cade în intervalul calculat. Dacă valoarea estimată este în afara intervalului de încredere, aceasta sugerează că diferența este semnificativă din punct de vedere statistic."}], "u": "Cap. 7 (intervalul) și Cap. 8 (Testarea ipotezelor despre o singură populație) (decizia).", "n": "PDF-ul spune că se verifică dacă „valoarea estimată” cade în interval; corect este valoarea din H0 (estimarea e mereu în centrul intervalului).", "w": true}]}, {"k": "c8", "et": "Cap. 8", "tit": "Testarea ipotezelor despre o singură populație", "col": "#5a5fa8", "s": [{"nr": 24, "q": "Ce presupune testul t pentru un eșantion?", "r": "Compararea mediei unui eșantion cu o valoare cunoscută sau teoretică (μ₀), pentru a vedea dacă diferența e semnificativă.", "e": [{"p": "Testul t pentru un eșantion presupune compararea mediei unui singur eșantion cu o valoare cunoscută sau teoretică (media populației sau o valoare de referință), pentru a verifica dacă diferența este semnificativă statistic."}, {"h": "Ce verifică:"}, {"p": "dacă media eșantionului este diferită semnificativ de o valoare dată (μ₀)"}, {"h": "Presupoziții (condiții):"}, {"b": "variabila dependentă este continuă"}, {"b": "datele sunt aproximativ normal distribuite (mai ales pentru eșantioane mici)"}, {"b": "observațiile sunt independente"}, {"h": "Exemplu:"}, {"p": "Se compară scorul mediu la un test al unui grup de studenți cu media teoretică de 100."}, {"p": "Se verifică dacă performanța grupului diferă semnificativ de standard."}, {"h": "Răspuns foarte scurt pentru examen:"}, {"p": "1. Testul t pentru un eșantion presupune compararea mediei unui eșantion cu o valoare cunoscută, pentru a stabili dacă diferența este semnificativă statistic."}, {"p": "2. Testul t pentru un eșantion presupune compararea mediei unui eșantion cu o valoare cunoscută (de obicei media populației). Este folosit pentru a verifica dacă există o diferență semnificativă între media eșantionului și o valoare teoretică sau de referință."}], "u": "Cap. 8 (testul t pentru o singură populație, n < 30).", "n": "", "w": false}]}, {"k": "c9", "et": "Cap. 9", "tit": "Testarea ipotezelor despre diferențele dintre două populații", "col": "#2e7d6f", "s": [{"nr": 20, "q": "Care test este utilizat pentru a compara două medii ale unor grupuri independente?", "r": "Testul t Student pentru eșantioane independente.", "e": [{"p": "Testul t Student pentru eșantioane independente"}, {"h": "De ce se folosește:"}, {"p": "Compară mediile a două grupuri diferite (independente)"}, {"p": "Verifică dacă diferența dintre medii este semnificativă statistic"}, {"h": "Condiții:"}, {"p": "variabila dependentă este continuă"}, {"p": "distribuția este aproximativ normală"}, {"p": "grupurile sunt independente"}, {"p": "varianțe relativ egale (sau se folosește varianta Welch)"}, {"h": "Alternativă (când condițiile nu sunt îndeplinite):"}, {"p": "Testul Mann–Whitney U (neparametric)"}, {"h": "Răspuns foarte scurt pentru examen:"}, {"p": "1. Testul t Student pentru eșantioane independente este utilizat pentru a compara două medii ale unor grupuri independente."}, {"p": "2. Testul t Student este utilizat pentru a compara mediile a două grupuri independente. Acesta presupune că datele sunt distribuite normal și sunt folosite pentru a testa dacă există diferențe semnificative între cele două grupuri."}], "u": "Cap. 9 (testul t pentru diferența dintre două medii; cu eșantioane mari, testul Z).", "n": "Același subiect ca S29 și, aproape identic, S55.", "w": false}, {"nr": 29, "q": "Care test este utilizat pentru a compara două medii ale unor grupuri independente?", "r": "Testul t Student pentru eșantioane independente.", "e": [{"p": "Testul t Student pentru eșantioane independente"}, {"h": "De ce se folosește:"}, {"p": "compară mediile a două grupuri diferite"}, {"p": "verifică dacă diferența dintre medii este semnificativă statistic"}, {"h": "Condiții:"}, {"p": "variabila dependentă este continuă"}, {"p": "distribuția este aproximativ normală"}, {"p": "grupurile sunt independente"}, {"p": "varianțe aproximativ egale (sau se folosește varianta Welch)"}, {"h": "Alternativă (când condițiile nu sunt îndeplinite):"}, {"p": "Testul Mann–Whitney U (neparametric)"}, {"h": "Răspuns foarte scurt pentru examen:"}, {"p": "1. Testul t Student pentru eșantioane independente este utilizat pentru a compara două medii ale unor grupuri independente."}, {"p": "2, Testul t Student este utilizat pentru a compara două medii ale unor grupuri independente, presupunând că datele sunt distribuite normal și că varianțele celor două grupuri sunt egale."}], "u": "Cap. 9.", "n": "Același subiect ca S20.", "w": false}, {"nr": 47, "q": "Care este principala funcție a testului t Student pentru variabile independente?", "r": "Compararea mediilor a două grupuri independente, pentru a vedea dacă diferența e semnificativă statistic.", "e": [{"p": "Testul t Student pentru variabile independente este folosit pentru a compara mediile a două grupuri independente și pentru a determina dacă diferențele dintre grupuri sunt semnificative din punct de vedere statistic."}], "u": "Cap. 9.", "n": "", "w": false}, {"nr": 55, "q": "Ce test este utilizat pentru a compara mediile a două grupuri independente?", "r": "Testul t Student (pentru eșantioane independente).", "e": [{"p": "Testul t Student este utilizat pentru a compara mediile a două grupuri independente. Acesta evaluează dacă diferențele dintre cele două grupuri sunt semnificative din punct de vedere statistic."}], "u": "Cap. 9.", "n": "Aproape identic cu S20 și S29.", "w": false}, {"nr": 83, "q": "Care condiții trebuie îndeplinite pentru aplicarea testului t pentru eșantioane independente?", "r": "Date normal distribuite în ambele grupuri, varianțe omogene, grupuri independente.", "e": [{"p": "Pentru aplicarea testului t pentru eșantioane independente, datele trebuie să fie distribuite normal în ambele grupuri, iar varianțele să fie omogene. De asemenea, grupurile trebuie să fie independente între ele."}], "u": "Cap. 9 (manualul cere σ1 = σ2 și, practic, eșantioane de mărimi apropiate).", "n": "", "w": false}]}, {"k": "c10", "et": "Cap. 10", "tit": "Analiza de varianță (ANOVA)", "col": "#9a7b1f", "s": [{"nr": 4, "q": "Ce tip de analiză statistică este utilizat pentru a compara mediile a trei sau mai multor grupuri?", "r": "Analiza de varianță (ANOVA).", "e": [{"p": "Analiza varianței (ANOVA – Analysis of Variance)"}, {"p": "Testează dacă există diferențe semnificative statistic între mediile mai multor grupuri."}, {"p": "Evită creșterea erorii de tip I care ar apărea dacă am face mai multe teste t perechi."}, {"p": "Răspunde la întrebarea: „Există cel puțin un grup care diferă de celelalte?” Tipuri frecvente de ANOVA ANOVA unifactorială (one-way ANOVA) Un singur factor independent (ex: tip de terapie A/B/C) VD continuă (ex: scor de anxietate) ANOVA multifactorială (two-way / factorial ANOVA) Doi sau mai mulți factori independenți Permite analizarea efectelor principale și a interacțiunilor ANOVA cu măsuri repetate Aceiași participanți măsurați în mai multe condiții sau momente După ANOVA Dacă rezultatul este semnificativ, se aplică teste post-hoc (ex: Tukey, Bonferroni) pentru a identifica care grupuri diferă între ele."}, {"p": "Concluzie"}, {"p": "ANOVA (Analiza varianței) este metoda statistică standard pentru compararea mediilor a trei sau mai multor grupuri."}], "u": "Cap. 10, secțiunile 10.1–10.3.", "n": "", "w": false}, {"nr": 44, "q": "Care este principalul scop al analizei ANOVA?", "r": "Compararea mediilor a trei sau mai multe grupuri, pe baza variabilității dintre grupuri și din interiorul grupurilor.", "e": [{"p": "Scopul principal al analizei ANOVA (Analiza Varianței) este de a compara mediile a trei sau mai multe grupuri pentru a determina dacă există diferențe semnificative între ele, pe baza variabilității interne și externe."}], "u": "Cap. 10.", "n": "", "w": false}, {"nr": 45, "q": "Ce presupune analiza ANOVA cu măsurători repetate?", "r": "Compararea mediilor din trei sau mai multe condiții/momente în care sunt măsurați aceiași subiecți.", "e": [{"p": "Analiza ANOVA cu măsurători repetate presupune compararea mediilor a trei sau mai multe grupuri în care aceleași subiecte sunt măsurate de mai multe ori, de obicei în condiții diferite, pentru a evalua schimbările într-o variabilă dependentă."}], "u": "Cap. 10, secțiunea 10.3 (ANOVA pentru eșantioane dependente).", "n": "Vezi și S82.", "w": false}, {"nr": 46, "q": "Ce condiție trebuie îndeplinită pentru ca datele să poată fi analizate prin ANOVA?", "r": "Observații independente, distribuție normală, varianțe omogene în grupuri și VD continuă (interval/raport).", "e": [{"p": "Pentru a aplica ANOVA, datele trebuie să fie independente și distribuite normal, iar grupurile comparate trebuie să aibă varianțe omogene (adică să aibă aceeași varianță). De asemenea, variabila dependentă trebuie să fie continuă."}], "u": "Cap. 10.", "n": "", "w": false}, {"nr": 56, "q": "Ce presupune testul ANOVA?", "r": "Compararea mediilor a trei sau mai multe grupuri prin raportul dintre varianța dintre grupuri și varianța din interiorul grupurilor (F).", "e": [{"p": "Testul ANOVA presupune compararea mediilor a trei sau mai multe grupuri pentru a determina dacă există diferențe semnificative între grupuri. Analizează varianța dintre grupuri față de varianța din interiorul grupurilor pentru a testa semnificația."}], "u": "Cap. 10, secțiunea 10.1.", "n": "", "w": false}, {"nr": 70, "q": "Ce reprezintă variabila dependentă (VD) într-un experiment?", "r": "Rezultatul pe care cercetătorul îl măsoară; reflectă efectul manipulării variabilei independente.", "e": [{"p": "Variabila dependentă reprezintă rezultatul pe care cercetătorul îl măsoară în experiment. Ea depinde de manipularea variabilei independente și reflectă efectele acesteia asupra comportamentului sau proceselor psihologice studiate."}], "u": "Cap. 10, la începutul secțiunii 10.1 (variabila manipulată = independentă; cea observată și măsurată = dependentă).", "n": "Vezi și S1.", "w": false}, {"nr": 71, "q": "Ce tip de ANOVA este folosit atunci când se analizează efectele a două sau mai multe variabile independente?", "r": "ANOVA factorială (cu doi sau mai mulți factori): efectele fiecărui factor și interacțiunea lor.", "e": [{"p": "ANOVA cu două sau mai multe factori (factors) este folosită pentru a analiza efectele a două sau mai multe variabile independente (factori) asupra unei variabile dependente. Aceasta permite evaluarea interacțiunii dintre factori și impactul fiecăruia asupra rezultatului."}], "u": "Cap. 10, secțiunea 10.2 (ANOVA pentru două variabile independente).", "n": "", "w": false}, {"nr": 72, "q": "Ce reprezintă valoarea p în rezultatele ANOVA?", "r": "Probabilitatea de a obține diferențe cel puțin atât de mari dacă ele s-ar datora doar întâmplării; sub pragul ales (de obicei 0,05) diferențele sunt semnificative.", "e": [{"p": "Valoarea p în ANOVA indică probabilitatea ca diferențele observate între grupuri să fie datorate întâmplării. Dacă p este mai mică decât un prag prestabilit (de obicei 0,05), atunci diferențele sunt considerate semnificative din punct de vedere statistic."}], "u": "Cap. 10; pragul α și decizia, din Cap. 8 (Testarea ipotezelor despre o singură populație).", "n": "", "w": false}, {"nr": 82, "q": "Ce presupune ANOVA cu măsuri repetate?", "r": "Compararea mediilor aceluiași grup de participanți în mai multe condiții sau momente.", "e": [{"p": "ANOVA cu măsuri repetate presupune compararea mediilor unui grup pe mai multe măsurători sau condiții, utilizând același grup de participanți. Este utilă atunci când se analizează efectele variabilelor asupra aceleași persoane în diferite momente."}], "u": "Cap. 10, secțiunea 10.3.", "n": "Vezi și S45.", "w": false}]}, {"k": "c11", "et": "Cap. 11", "tit": "Teste nonparametrice", "col": "#a8434f", "s": [{"nr": 2, "q": "Ce test este utilizat pentru a analiza relațiile dintre variabilele categoriale?", "r": "Testul chi-pătrat (χ²) de independență.", "e": [{"p": "Testul Chi-Pătrat de independență (χ²)"}, {"h": "Rol:"}, {"p": "Verifică dacă există o asociere semnificativă între două variabile categoriale."}, {"p": "Nu arată cauzalitate, ci doar dacă variabilele sunt sau nu independente una de cealaltă."}, {"h": "Exemplu de utilizare:"}, {"p": "Relația dintre gen (masculin/feminin) și preferința pentru un tip de terapie (A/B/C) Relația dintre nivelul de educație (liceu/facultate/master) și prezența unui comportament (da/nu) Condiții principale:"}, {"p": "Datele sunt frecvențe (număr de persoane în fiecare categorie)"}, {"p": "Categoriile sunt independente"}, {"p": "De regulă, frecvențele așteptate în fiecare celulă a tabelului > 5"}, {"h": "Alte teste posibile (mai rar, dar utile în situații specifice):"}, {"tab": [["Test", "Când se folosește"], ["Testul Fisher Exact", "Când eșantionul este mic și Chi-Pătrat nu îndeplinește condițiile"], ["Coeficientul Cramer’s V", "După Chi-Pătrat, pentru a măsura puterea asocierii"], ["Testul McNemar", "Când variabilele sunt categoriale pereche (măsurători repetate pe același grup)"]]}, {"p": "Chi-Pătrat de independență (χ²) este testul standard pentru analiza relațiilor dintre variabile categoriale."}], "u": "Cap. 11, secțiunea 11.1 (testul chi-pătrat) și 11.2 (McNemar); V al lui Cramer în Cap. 12 (Mărimi ale corelației), 12.2.", "n": "", "w": false}, {"nr": 19, "q": "Care este diferența principală între testul t Student și testul Mann–Whitney?", "r": "Testul t e parametric și compară mediile; Mann–Whitney e neparametric și compară rangurile, folosit când condițiile testului t nu sunt îndeplinite.", "e": [{"p": "Diferența principală este legată de tipul de date și de condițiile statistice pe care le presupun."}, {"p": "Testul t Student"}, {"p": "Parametric: Compară mediile a două grupuri independente"}, {"p": "Se folosește când: datele sunt continue; distribuția este aproximativ normală;"}, {"p": "varianțele sunt relativ egale"}, {"p": "Testul Mann–Whitney (U)"}, {"p": "Neparametric: Compară rangurile a două grupuri independente"}, {"p": "Se folosește când: datele sunt ordonale sau nenormale; eșantionul este mic; există outlieri Răspunsuri foarte scurt pentru examen:"}, {"p": "1. Testul t Student este parametric și compară mediile, iar testul Mann–Whitney este neparametric și compară rangurile, fiind folosit când nu sunt îndeplinite condițiile pentru testul t."}, {"p": "2. Testul t Student este utilizat pentru a compara mediile a două grupuri independente, presupunând o distribuție normală a datelor. Testul Mann-Whitney este un test neparametric care compară două grupuri independente pe baza rangurilor, fără a presupune normalitatea datelor."}], "u": "Mann–Whitney: Cap. 11, secțiunea 11.3; testul t: Cap. 9 (Testarea ipotezelor despre diferențele dintre două populații).", "n": "Același subiect ca S27.", "w": false}, {"nr": 21, "q": "Ce test neparametric este utilizat pentru a analiza datele cu două măsurători repetate pe aceeași unitate experimentală?", "r": "Testul Wilcoxon pentru eșantioane pereche (Wilcoxon Signed-Rank).", "e": [{"p": "Testul neparametric utilizat pentru a analiza datele cu două măsurători repetate pe aceeași unitate experimentală este:"}, {"p": "Testul Wilcoxon pentru eșantioane pereche (Wilcoxon Signed-Rank Test)"}, {"h": "De ce se folosește:"}, {"b": "Compară două condiții/momente măsurate pe aceiași participanți"}, {"b": "Este alternativa neparametrică la testul t pentru eșantioane pereche"}, {"b": "Nu necesită distribuție normală a datelor"}, {"h": "Când se aplică:"}, {"b": "date ordonale sau continue nenormale"}, {"b": "două măsurători repetate (ex: înainte–după)"}, {"b": "eșantioane mici sau cu outlieri"}, {"h": "Răspuns foarte scurt pentru examen:"}, {"p": "1. Testul Wilcoxon pentru eșantioane pereche este utilizat pentru două măsurători repetate pe aceeași unitate experimentală."}, {"p": "2. Testul neparametric utilizat pentru a analiza datele cu două măsurători repetate pe aceeași unitate experimentală este testul Wilcoxon pentru eșantioane pereche. Acesta este folosit atunci când datele nu respectă presupunerile de normalitate necesare testului t pentru eșantioane pereche."}], "u": "Cap. 11, secțiunea 11.6 (testul Wilcoxon T).", "n": "", "w": false}, {"nr": 23, "q": "Care este principala caracteristică a testelor neparametrice?", "r": "Nu presupun distribuția normală a datelor și se bazează pe ranguri sau frecvențe; se folosesc când condițiile testelor parametrice nu sunt îndeplinite.", "e": [{"p": "Principala caracteristică a testelor neparametrice"}, {"p": "Testele neparametrice se caracterizează prin faptul că nu presupun o distribuție normală a datelor și nu depind de parametri populaționali (precum media și deviația standard)."}, {"h": "Ce le diferențiază esențial:"}, {"b": "sunt utilizate când ipotezele testelor parametrice nu sunt îndeplinite"}, {"b": "se bazează pe ranguri sau frecvențe, nu direct pe valori numerice"}, {"b": "sunt potrivite pentru date ordinale sau eșantioane mici"}, {"b": "sunt mai robuste la valori extreme (outlieri)"}, {"h": "Răspuns foarte scurt pentru examen:"}, {"p": "1. Testele neparametrice nu necesită distribuție normală a datelor și se bazează pe ranguri, fiind utilizate când condițiile testelor parametrice nu sunt îndeplinite."}, {"p": "2. Principala caracteristică a testelor neparametrice este că acestea nu presupun că datele urmează o distribuție normală. Acestea sunt folosite atunci când datele sunt de tip ordinal sau când presupunerile testelor parametrice nu sunt îndeplinite."}], "u": "Cap. 11, introducerea unității.", "n": "", "w": false}, {"nr": 26, "q": "Care test neparametric este echivalent cu testul t pentru eșantioane independente?", "r": "Testul Mann–Whitney U.", "e": [{"p": "Testul Mann–Whitney U"}, {"h": "De ce este echivalent:"}, {"b": "Compară două grupuri independente"}, {"b": "Este alternativa neparametrică la testul t Student"}, {"b": "Se bazează pe ranguri, nu pe medii"}, {"h": "Când se folosește:"}, {"b": "datele nu sunt normal distribuite"}, {"b": "variabilele sunt ordonale sau continue cu outlieri"}, {"b": "eșantioane mici"}, {"h": "Răspuns foarte scurt pentru examen:"}, {"p": "1. Testul Mann–Whitney U este echivalentul neparametric al testului t pentru eșantioane independente."}, {"p": "2. Testul Mann-Whitney este echivalentul neparametric al testului t pentru eșantioane independente. Acesta compară distribuțiile a două grupuri independente și este utilizat când datele nu respectă presupunerile de normalitate."}], "u": "Cap. 11, secțiunea 11.3.", "n": "Vezi și S50 și S77.", "w": false}, {"nr": 27, "q": "Care este diferența principală între testul t Student și testul Mann–Whitney?", "r": "Testul t e parametric și compară mediile; Mann–Whitney e neparametric și compară rangurile.", "e": [{"p": "Diferența principală constă în tipul de date și presupunerile statistice pe care le fac cele două teste."}, {"p": "Testul t Student: Este un test parametric;"}, {"p": "Compară mediile a două grupuri independente"}, {"h": "Presupune:"}, {"b": "date continue; - distribuție normală; -varianțe aproximativ egale"}, {"p": "Testul Mann–Whitney U: Este un test neparametric"}, {"p": "Compară rangurile a două grupuri independente"}, {"h": "Se utilizează când:"}, {"b": "datele nu sunt normal distribuite"}, {"b": "variabilele sunt ordonale"}, {"b": "există outlieri sau eșantioane mici"}, {"h": "Răspuns foarte scurt pentru examen:"}, {"p": "1. Testul t Student este parametric și compară mediile, iar testul Mann–Whitney este neparametric și compară rangurile, fiind folosit când nu sunt îndeplinite condițiile pentru testul t."}, {"p": "2. Testul t Student este un test parametric care compară mediile a două grupuri independente, presupunând o distribuție normală a datelor, în timp ce testul Mann–Whitney este un test neparametric care compară rangurile a două grupuri independente și nu necesită normalitatea datelor."}], "u": "Cap. 11, secțiunea 11.3.", "n": "Același subiect ca S19.", "w": false}, {"nr": 50, "q": "Ce presupune testul U al lui Mann–Whitney?", "r": "Test neparametric care compară două grupuri independente pe o variabilă ordinală sau continuă, când nu sunt îndeplinite condițiile testului t.", "e": [{"p": "Testul U al lui Mann-Whitney este un test neparametric utilizat pentru a compara două grupuri independente pe o variabilă ordinară sau continuă atunci când nu sunt îndeplinite presupunerile pentru testul t, evaluând diferențele de distribuție între grupuri."}], "u": "Cap. 11, secțiunea 11.3.", "n": "În PDF scrie „variabilă ordinară” — e vorba de variabilă ordinală.", "w": true}, {"nr": 52, "q": "Ce presupune testul chi-pătrat pentru independență?", "r": "Verifică asocierea dintre două variabile categoriale, comparând frecvențele observate cu cele așteptate dacă variabilele ar fi independente.", "e": [{"p": "Testul Chi-pătrat pentru independență presupune verificarea existenței asocierii semnificative între două variabile categoriale. Compară frecvențele observate în categorii cu cele așteptate sub ipoteza că nu există nicio asociere între variabile."}], "u": "Cap. 11, secțiunea 11.1.", "n": "", "w": false}, {"nr": 54, "q": "Ce presupune testul Kruskal–Wallis?", "r": "Test neparametric care compară trei sau mai multe grupuri independente; echivalentul neparametric al ANOVA, fără normalitate.", "e": [{"p": "Testul Kruskal-Wallis este un test neparametric utilizat pentru a compara trei sau mai multe grupuri independente pe o variabilă ordinară sau continuă. Acesta este echivalentul neparametric al ANOVA și nu presupune normalitatea datelor."}], "u": "Cap. 11, secțiunea 11.7 (testul Kruskal–Wallis H).", "n": "", "w": false}, {"nr": 77, "q": "Care test este utilizat pentru a compara distribuțiile a două grupuri independente cu date neparametrice?", "r": "Testul Mann–Whitney, echivalentul neparametric al testului t pentru eșantioane independente.", "e": [{"p": "Testul Mann-Whitney este utilizat pentru a compara distribuțiile a două grupuri independente cu date neparametrice, fiind echivalentul neparametric al testului t pentru eșantioane independente."}], "u": "Cap. 11, secțiunea 11.3.", "n": "", "w": false}, {"nr": 79, "q": "Care este scopul testului chi-pătrat în cercetare?", "r": "Evaluarea asocierii dintre două variabile categoriale, comparând frecvențele observate cu cele așteptate.", "e": [{"p": "Testul Chi-pătrat este utilizat pentru a evalua asocierea între două variabile categoriale, determinând dacă există o relație semnificativă între frecvențele observate și cele așteptate într-o distribuție de date."}], "u": "Cap. 11, secțiunea 11.1.", "n": "", "w": false}, {"nr": 81, "q": "Ce caracteristică are testul Wilcoxon?", "r": "Test neparametric pentru două grupuri corelate (pereche); alternativa la testul t pentru eșantioane pereche; ordonează diferențele dintre perechi pe ranguri.", "e": [{"p": "Testul Wilcoxon este un test neparametric utilizat pentru a compara două grupuri corelate, fiind o alternativă la testul t pentru eșantioane pereche."}, {"p": "Acesta analizează diferențele dintre valorile perechilor și le ordonează pe baza rangurilor."}], "u": "Cap. 11, secțiunea 11.6.", "n": "Vezi și S21.", "w": false}, {"nr": 87, "q": "Care este diferența principală între analiza parametrică și cea nonparametrică?", "r": "Analiza parametrică presupune distribuție normală și estimează parametrii populației; cea nonparametrică nu face aceste presupuneri.", "e": [{"p": "Analiza parametrică presupune că datele urmează o distribuție normală și se bazează pe estimarea parametrilor populației, în timp ce analiza nonparametrică nu face astfel de presupuneri și este utilizată pentru date care nu respectă distribuția normală."}], "u": "Cap. 11, introducerea unității.", "n": "Vezi și S23.", "w": false}]}, {"k": "c12", "et": "Cap. 12", "tit": "Mărimi ale corelației", "col": "#7a5c3e", "s": [{"nr": 13, "q": "Care coeficient de corelație măsoară relația liniară între două variabile continue?", "r": "Coeficientul de corelație Pearson (r).", "e": [{"p": "Coeficientul de corelație care măsoară relația liniară dintre două variabile continue este: Coeficientul de corelație Pearson (r) Ce indică Pearson (r):"}, {"p": "Direcția relației: pozitivă (+) sau negativă (−)"}, {"p": "Intensitatea relației: valori între −1 și +1"}, {"p": "r = 0 → fără relație liniară"}, {"p": "r = ±1 → relație liniară perfectă"}, {"h": "Condiții de utilizare:"}, {"p": "variabile continue"}, {"p": "relație liniară"}, {"p": "distribuție aproximativ normală"}, {"h": "Răspuns foarte scurt pentru examen:"}, {"p": "Coeficientul de corelație Pearson (r) măsoară relația liniară dintre două variabile continue."}], "u": "Cap. 12, secțiunea 12.4 (corelația la nivel de interval sau de raport).", "n": "", "w": false}, {"nr": 14, "q": "Când este utilizat coeficientul de corelație Kendall?", "r": "Pentru asocierea dintre două variabile ordinale (ranguri), mai ales când datele nu îndeplinesc condițiile pentru Pearson.", "e": [{"p": "Coeficientul Kendall (τ) este utilizat pentru a măsura relația de asociere (monotonă) dintre două variabile ordinale sau atunci când datele nu îndeplinesc condițiile pentru Pearson."}, {"h": "Se folosește când:"}, {"b": "variabilele sunt ordonate (ranguri)"}, {"b": "relația este monotonă, dar nu neapărat liniară"}, {"b": "eșantionul este mic"}, {"b": "există valori extreme (outlieri)"}, {"b": "datele nu au distribuție normală"}, {"p": "Este frecvent utilizat în psihologie, științe sociale și evaluări pe bază de ranguri."}, {"p": "τ = (C − D) / [n(n − 1)/2]"}, {"h": "Unde:"}, {"p": "C = numărul de perechi concordante"}, {"p": "D = numărul de perechi discordante"}, {"p": "n = numărul de observații"}, {"p": "n(n − 1)/2 = numărul total de perechi posibile"}, {"p": "Coeficientul Kendall se utilizează pentru a măsura corelația dintre variabile ordinale, pe baza rangurilor, mai ales când datele nu respectă condițiile pentru Pearson."}], "u": "Cap. 12, secțiunea 12.3 (corelația la nivel ordinal: γ, d al lui Somer, τb al lui Kendall, ρs al lui Spearman).", "n": "Subiectul e pe pagina 15 a PDF-ului, ca imagine (nu ca text).", "w": false}, {"nr": 25, "q": "Ce presupune regresia liniară?", "r": "Modelarea relației dintre o VD (Y) și una sau mai multe VI (X) printr-o linie dreaptă, pentru explicație și predicție.", "e": [{"p": "Regresia liniară presupune modelarea relației dintre o variabilă dependentă (Y) și una sau mai multe variabile independente (X), relație care este aproximată printr-o linie dreaptă."}, {"h": "Ce face concret:"}, {"b": "Estimează influența variabilei (lor) independente asupra variabilei dependente"}, {"b": "Prezice valori ale lui Y pe baza lui X"}, {"b": "Evaluează forța și direcția relației dintre variabile"}, {"h": "Forma generală:"}, {"p": "Regresie liniară simplă: Y = a + bX"}, {"p": "Regresie liniară multiplă: Y = a + b₁X₁ + b₂X₂ + …"}, {"h": "Presupoziții principale:"}, {"b": "relație liniară între variabile"}, {"b": "erori independente"}, {"b": "normalitatea reziduurilor"}, {"b": "homoscedasticitate (varianță constantă a erorilor)"}, {"h": "Răspuns foarte scurt pentru examen:"}, {"p": "1. Regresia liniară presupune analizarea și estimarea relației liniare dintre o variabilă dependentă și una sau mai multe variabile independente, pentru explicație și predicție."}, {"p": "2. Regresia liniară presupune modelarea relației dintre o variabilă dependentă continuă și una sau mai multe variabile independente, folosind o linie dreaptă. Aceasta este folosită pentru a face predicții și a înțelege cum variabilele independente influențează variabila dependentă."}], "u": "Cap. 12, secțiunea 12.4 (ecuația de regresie) și 12.6 (regresia multiplă).", "n": "Subiectul e pe pagina 26 a PDF-ului, ca imagine (nu ca text).", "w": false}, {"nr": 33, "q": "Ce tip de analiză este utilizat pentru a face predicții despre comportamentele viitoare pe baza datelor anterioare?", "r": "Analiza de regresie: identifică relațiile dintre variabile și le folosește pentru predicție.", "e": [{"p": "Analiza de regresie este utilizată pentru a face predicții despre comportamentele viitoare pe baza datelor anterioare. Aceasta permite identificarea relațiilor dintre variabile și utilizarea acestora pentru a prezice comportamente viitoare."}], "u": "Cap. 12, secțiunile 12.4 și 12.6 (predicția e cu atât mai precisă cu cât corelația e mai puternică).", "n": "", "w": false}, {"nr": 42, "q": "Ce tip de corelație există atunci când creșterea unei variabile este asociată cu scăderea celeilalte?", "r": "Corelația negativă (inversă): variabilele se mișcă în direcții opuse.", "e": [{"p": "Corelația negativă există atunci când creșterea unei variabile este asociată cu scăderea celeilalte. În această relație, variabilele se mișcă în direcții opuse."}], "u": "Cap. 12, secțiunea 12.1 (sensul corelației).", "n": "", "w": false}, {"nr": 69, "q": "Ce măsoară analiza de corelație?", "r": "Cât de strâns sunt asociate două sau mai multe variabile (corelație pozitivă, negativă sau nulă), fără a dovedi cauzalitatea.", "e": [{"p": "Analiza de corelație măsoară relația dintre două sau mai multe variabile, indicând cât de strâns sunt asociate. Aceasta poate arăta o corelație pozitivă, negativă sau nulă, fără a implica relații cauzale."}], "u": "Cap. 12, secțiunea 12.1.", "n": "", "w": false}, {"nr": 76, "q": "Ce măsoară coeficientul de corelație Pearson?", "r": "Forța și direcția relației liniare dintre două variabile continue, între −1 și +1.", "e": [{"p": "Coeficientul de corelație Pearson măsoară forța și direcția relației liniare între două variabile continue. Valoarea variază între -1 și +1, unde 1 indică o corelație pozitivă perfectă, iar -1 o corelație negativă perfectă."}], "u": "Cap. 12, secțiunea 12.4.", "n": "Vezi și S13.", "w": false}, {"nr": 86, "q": "În regresia liniară simplă, ce reprezintă coeficientul „a”?", "r": "Interceptul (ordonata la origine): valoarea estimată a lui Y când X = 0.", "e": [{"p": "În regresia liniară simplă, coeficientul \"a\" reprezintă interceptul cu axa Y, adică valoarea estimată a variabilei dependente când variabila independentă este zero."}], "u": "Cap. 12, secțiunea 12.4 (Y = a + bX; în exemplul cărții, a = 30,8).", "n": "b este panta.", "w": false}]}, {"k": "a_met", "et": "Altele", "tit": "Metodologia cercetării", "col": "#2f6f8f", "s": [{"nr": 1, "q": "Care sunt și care este rolul variabilelor în cercetările psihologice?", "r": "VI e manipulată de cercetător ca să producă un efect; VD e măsurată și reflectă efectul; celelalte variabile trebuie controlate sau explică relația.", "e": [{"p": "1. Variabila independentă (VI)"}, {"p": "Este manipulată sau controlată de cercetător."}, {"p": "Rol: să producă un efect sau o schimbare."}, {"p": "Ex: tipul de terapie, cantitatea de somn, nivelul de zgomot."}, {"p": "2. Variabila dependentă (VD)"}, {"p": "Este măsurată de cercetător."}, {"p": "Rol: reflectă efectul produs de VI."}, {"p": "Ex: nivelul de anxietate, performanța la un test, timpul de reacție."}, {"p": "3. Variabile controlate / constante"}, {"p": "Sunt menținute la același nivel pentru toți participanții."}, {"p": "Rol: elimină influențele nedorite asupra VD."}, {"p": "Ex: vârsta participanților, ora testării, temperatura camerei."}, {"p": "4. Variabile confundate (confounders)"}, {"p": "Nu sunt controlate și pot influența VD în mod neintenționat."}, {"p": "Rol: reprezintă o amenințare la validitatea studiului."}, {"p": "Ex: motivația participantului, oboseala, starea emoțională."}, {"p": "5. Variabile moderatoare"}, {"p": "Influentează intensitatea sau direcția relației dintre VI și VD."}, {"p": "Ex: genul, personalitatea, nivelul de suport social."}, {"p": "6. Variabile mediatoare"}, {"p": "Explică cum sau de ce VI influențează VD."}, {"p": "Ex: stresul poate media relația dintre lipsa somnului (VI) și scăderea atenției (VD)."}], "u": "Manualul definește doar VI și VD, la începutul Cap. 10 (Analiza de varianță (ANOVA)); restul ține de metodologia cercetării.", "n": "", "w": false}, {"nr": 15, "q": "Care este rolul grupului de control?", "r": "Grupul de control e etalonul de comparație: arată efectul real al intervenției experimentale.", "e": [{"p": "Grupul de control are rolul de etalon de comparație într-un experiment, permițând evaluarea efectului real al variabilei independente."}, {"h": "Ce face concret:"}, {"b": "Nu primește intervenția/tratamentul experimental"}, {"b": "Este tratat identic cu grupul experimental, exceptând factorul testat"}, {"b": "Ajută la stabilirea relației cauză–efect"}, {"h": "De ce este important:"}, {"b": "Izolează efectul variabilei independente"}, {"b": "Reduce influența factorilor externi"}, {"b": "Crește validitatea internă a cercetării"}, {"h": "Răspuns foarte scurt pentru examen:"}, {"p": "Grupul de control permite compararea și evidențierea efectului real al intervenției experimentale."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 30, "q": "Care este o condiție importantă pentru stabilirea cauzalității?", "r": "Cauza trebuie să preceadă efectul în timp (prioritate temporală).", "e": [{"p": "Cauzalitatea reprezintă relația prin care o variabilă (cauza) produce o schimbare într-o altă variabilă (efectul)."}, {"h": "O condiție importantă pentru stabilirea cauzalității:"}, {"p": "Cauza trebuie să preceadă efectul în timp (prioritate temporală)."}, {"h": "Explicație:"}, {"b": "variabila cauză apare înainte de variabila efect;"}, {"b": "fără această condiție, nu se poate afirma că există o relație de determinare;"}, {"h": "Alte condiții (pentru context):"}, {"p": "covariația: cauza și efectul variază împreună"}, {"p": "controlul variabilelor externe: eliminarea explicațiilor alternative"}, {"h": "Răspuns foarte scurt pentru examen:"}, {"p": "1. O condiție esențială pentru cauzalitate este ca variabila cauză să apară înaintea efectului (prioritate temporală)."}, {"p": "2. O condiție importantă pentru stabilirea cauzalității este existența unei relații temporale, adică variabila independentă trebuie să preceadă în timp schimbările observate în variabila dependentă, iar aceasta trebuie să fie consistentă și replicabilă."}], "u": "Manualul spune doar, în Cap. 12 (Mărimi ale corelației), că o corelație nu dovedește o relație cauzală, ci poate fi un argument pentru sau împotriva ei.", "n": "", "w": false}, {"nr": 80, "q": "Ce reprezintă cauzalitatea în cercetare?", "r": "Relația în care o variabilă (cauza) produce o schimbare directă în alta (efectul).", "e": [{"p": "Causalitatea se referă la relația în care o variabilă (cauza) produce o schimbare directă în alta (efectul). Identificarea cauzalității este esențială pentru a înțelege și manipula comportamentele și fenomenele observate în cercetare."}], "u": "Manualul spune doar, în Cap. 12 (Mărimi ale corelației), că o corelație nu dovedește o relație cauzală.", "n": "Vezi și S30.", "w": false}, {"nr": 88, "q": "Care este caracteristica unui experiment diacron (longitudinal)?", "r": "Datele se colectează de la aceiași participanți pe o perioadă lungă, pentru a urmări schimbările în timp.", "e": [{"p": "Caracteristica principală a unui experiment longitudinal este că se colectează date de la aceleași participanți pe o perioadă lungă de timp, pentru a analiza schimbările și evoluțiile în comportament sau caracteristici."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 89, "q": "Care este diferența principală între un experiment de laborator și un experiment natural?", "r": "Laboratorul oferă control mare asupra variabilelor, în mediu controlat; experimentul natural se desfășoară în condiții naturale, cu mai puțin control.", "e": [{"p": "Un experiment de laborator are un control mai mare asupra variabilelor și condițiilor experimentale, fiind realizat într-un mediu controlat, în timp ce un experiment natural se desfășoară în condiții naturale, cu mai puțin control asupra variabilelor externe."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}]}, {"k": "a_neuro", "et": "Altele", "tit": "Creier, sistem nervos și biosemnale", "col": "#8a4f7d", "s": [{"nr": 5, "q": "Care sunt rolurile principale ale neocortexului?", "r": "Neocortexul e sediul funcțiilor psihice superioare: gândire, limbaj, memorie, percepție conștientă, control voluntar al mișcărilor și reglarea comportamentului.", "e": [{"p": "1. Procese cognitive superioare"}, {"p": "Gândire logică și abstractă"}, {"p": "Raționament și rezolvare de probleme"}, {"p": "Planificare și luarea deciziilor"}, {"p": "2. Funcții de limbaj"}, {"p": "Înțelegerea limbajului"}, {"p": "Producerea vorbirii"}, {"p": "Citit și scris"}, {"p": "3. Memorie și învățare"}, {"p": "Integrarea informațiilor noi"}, {"p": "Stocarea și reactualizarea cunoștințelor"}, {"p": "4. Percepție senzorială conștientă"}, {"p": "Interpretarea stimulilor vizuali, auditivi, tactili"}, {"p": "Integrarea informațiilor senzoriale"}, {"p": "5. Control voluntar al mișcărilor"}, {"p": "Inițierea și coordonarea mișcărilor intenționate"}, {"p": "6. Reglarea comportamentului și a emoțiilor"}, {"p": "Autocontrol"}, {"p": "Adaptare socială"}, {"p": "Comportament conștient și intențional"}, {"p": "CONCLUZIE: Neocortexul – sediul funcțiilor psihice superioare: gândire, limbaj, memorie, percepție conștientă, control voluntar al mișcărilor și reglarea comportamentului."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 6, "q": "În teoria celor trei creiere, ce parte a creierului este considerată responsabilă pentru comportamentele de supraviețuire și agresiune?", "r": "Creierul reptilian (teoria lui Paul MacLean).", "e": [{"p": "În teoria celor trei creiere (Paul MacLean), partea responsabilă pentru comportamentele de supraviețuire și agresiune este: Creierul reptilian Roluri:"}, {"p": "1. Asigură funcțiile de bază pentru supraviețuire"}, {"p": "2. Controlează comportamente instinctive: agresivitate, luptă–fugă, dominanță, teritoriu"}, {"p": "3. Include: trunchiul cerebral și ganglionii bazali."}, {"h": "Răspuns foarte scurt pentru examen:"}, {"p": "Creierul reptilian – responsabil de comportamentele instinctive, de supraviețuire și agresiune."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 8, "q": "Ce structură a creierului este responsabilă pentru memoria și reglarea emoțiilor?", "r": "Sistemul limbic.", "e": [{"h": "Structura creierului responsabilă pentru memorie și reglarea emoțiilor este:"}, {"p": "Sistemul limbic."}, {"h": "Roluri principale:"}, {"p": "Memorie – în special prin hipocamp (formarea și consolidarea amintirilor)"}, {"p": "Emoții – prin amigdală (procesarea fricii, furiei, plăcerii)"}, {"p": "Reglarea emoțională și motivațională"}, {"p": "Legătura dintre emoții și comportament"}, {"h": "Răspuns foarte scurt pentru examen:"}, {"p": "Sistemul limbic – responsabil de memorie și reglarea emoțiilor."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 9, "q": "Care sunt caracteristicile emisferei stângi a creierului?", "r": "Emisfera stângă: limbaj, logică, analiză, matematică și controlul părții drepte a corpului.", "e": [{"p": "(ES) Emisfera stângă este asociată în principal cu procesele cognitive analitice și verbale (procesator serial, simulează timpul) și are următoarele caracteristici:"}, {"p": "Limbaj – vorbire, citire, scriere, înțelegerea limbajului"}, {"p": "Gândire logică și analitică"}, {"p": "Raționament matematic și calcul"}, {"p": "Procesare secvențială (pas cu pas, serială, cauză-efect)"}, {"p": "Analiza detaliilor"}, {"p": "Controlul părții drepte a corpului (control contralateral)"}, {"h": "Pe scurt (pentru examen):"}, {"p": "Emisfera stângă este responsabilă de limbaj, logică, analiză, matematică și controlul părții drepte a corpului."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 10, "q": "Cum se activează emisfera dreaptă a creierului?", "r": "Prin activități creative, imaginație, emoții, muzică, artă și gândire globală.", "e": [{"p": "Emisfera dreaptă este asociată cu creativitatea, imaginația, emoțiile și percepția globală."}, {"h": "Ea se activează în special prin:"}, {"p": "Activități creative – desen, pictură, muzică, dans"}, {"p": "Imaginație și vizualizare – fantezie, visare, meditație ghidată"}, {"p": "Procesare holistică – înțelegerea ansamblului, nu a detaliilor"}, {"p": "Emoții și empatie – exprimare emoțională, relaționare afectivă"}, {"p": "Stimuli non-verbali – imagini, culori, forme, muzică"}, {"p": "Relaxare și mindfulness – reducerea controlului logic excesiv"}, {"h": "Răspuns scurt pentru examen:"}, {"p": "Emisfera dreaptă se activează prin activități creative, imaginație, emoții, muzică, artă și gândire globală."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 11, "q": "Ce tip de biosemnal măsoară activitatea electrică a inimii?", "r": "Electrocardiograma (ECG / EKG).", "e": [{"p": "Electrocardiograma (ECG / EKG)"}, {"h": "Explicație scurtă:"}, {"p": "ECG înregistrează activitatea electrică a inimii în timpul bătăilor cardiace."}, {"p": "Este utilizată pentru evaluarea ritmului cardiac, a frecvenței și a posibilelor afecțiuni cardiace."}, {"h": "Răspuns foarte scurt pentru examen:"}, {"p": "Electrocardiograma (ECG) măsoară activitatea electrică a inimii."}], "u": "Nu apare în manualul de statistică.", "n": "Nu confunda cu EEG, care înregistrează activitatea electrică a creierului (S65).", "w": false}, {"nr": 12, "q": "Care este principala funcție a sistemului nervos?", "r": "Recepția, procesarea și transmiterea informațiilor, pentru a coordona activitatea organismului și adaptarea la mediu.", "e": [{"p": "Principala funcție a sistemului nervos este recepția, procesarea și transmiterea informațiilor, pentru a coordona și regla activitatea organismului și a asigura adaptarea la mediu."}, {"h": "Pe înțeles clar:"}, {"p": "Recepționează stimuli din mediul intern și extern"}, {"p": "Procesează informația la nivel cerebral"}, {"p": "Coordonează răspunsurile (mişcare, secreţii, comportament)"}, {"p": "Menține echilibrul organismului (homeostazia)"}, {"h": "Răspuns foarte scurt pentru examen:"}, {"p": "Sistemul nervos are rolul de a coordona și controla activitatea organismului, asigurând adaptarea la mediu."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 34, "q": "Care este principala funcție a creierului reptilian?", "r": "Funcțiile de bază ale supraviețuirii (reflexe, ritm cardiac, respirație) și comportamentele instinctuale legate de reproducere și agresiune.", "e": [{"p": "Creierul reptilian este responsabil pentru funcțiile de bază ale supraviețuirii, cum ar fi reflexele, ritmul cardiac și respirația, precum și comportamentele instinctuale legate de reproducere și agresiune."}], "u": "Nu apare în manualul de statistică.", "n": "Vezi și S6 și S85.", "w": false}, {"nr": 37, "q": "Ce parte a creierului este responsabilă pentru gândirea rațională, analitică și pentru luarea deciziilor?", "r": "Lobul frontal: planificare, rezolvarea problemelor, controlul impulsurilor.", "e": [{"p": "Lobul frontal este responsabil pentru gândirea rațională, analitică și pentru luarea deciziilor. Această zonă a creierului este esențială pentru planificare, rezolvarea problemelor și controlul impulsurilor."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 38, "q": "Ce funcție este asociată cu emisfera dreaptă a creierului?", "r": "Funcții creative: gândire abstractă, aprecierea artei, recunoașterea vizuală a obiectelor și fețelor; emoții și intuiție.", "e": [{"p": "Emisfera dreaptă a creierului este asociată cu funcțiile creative, cum ar fi gândirea abstractă, aprecierea artei și recunoașterea vizuală a obiectelor și fețelor. Ea este implicată și în procesarea emoțiilor și intuiției."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 39, "q": "Care este funcția principală a lobului frontal stâng (LFS)?", "r": "Limbajul, vorbirea și procesele logice (rezolvarea de probleme, raționamentul matematic).", "e": [{"p": "Funcția principală a lobului frontal stâng (LFS) este utilizată pentru a monitoriza activitatea electrică a creierului, înregistrând undele cerebrale și activitatea neuronală."}], "u": "Nu apare în manualul de statistică.", "n": "Nu confunda cu ECG (inima, S11).", "w": false}, {"nr": 66, "q": "Care este funcția principală a lobului temporal stâng (LTS)?", "r": "Procesarea limbajului (înțelegerea vorbirii) și memoria verbală.", "e": [{"p": "Lobul temporal stâng este asociat cu procesarea limbajului, inclusiv înțelegerea vorbirii și producerea limbajului, precum și cu memoria verbală."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 67, "q": "Care funcție este atribuită lobului parietal drept (LPD)?", "r": "Procesarea vizuo-spațială: percepția adâncimii și orientarea în spațiu.", "e": [{"p": "Lobul parietal drept este implicat în procesarea informațiilor vizuale și spațiale, ajutând la percepția adâncimii și a orientării în spațiu."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 68, "q": "Ce regiune a creierului este responsabilă pentru controlul mișcărilor motorii și coordonarea echilibrului?", "r": "Cerebelul: coordonarea mișcărilor fine și menținerea echilibrului.", "e": [{"p": "Cerebelul este responsabil pentru coordonarea mișcărilor motorii și menținerea echilibrului. Acesta reglează mișcările fine și coordonate ale corpului."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 84, "q": "Ce tip de memorie este asociată cu învățarea prin repetiție și asociere?", "r": "Memoria procedurală: abilități motorii și proceduri învățate prin repetare.", "e": [{"p": "Memoria procedurală este asociată cu învățarea prin repetiție și asociere."}, {"p": "Aceasta ajută la învățarea și memorarea abilităților motorii și procedurilor prin repetarea acestora."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 85, "q": "Care este principala funcție a creierului reptilian?", "r": "Supraviețuirea: reflexe de luptă sau fugă, ritm cardiac și respirație, comportamente instinctuale legate de teritoriu și reproducere.", "e": [{"p": "Creierul reptilian este responsabil pentru funcțiile de bază de supraviețuire, cum ar fi reflexele de luptă sau fugă, reglează ritmul cardiac și respirația și controlează comportamentele instinctuale legate de teritoriul și reproducerea speciei."}], "u": "Nu apare în manualul de statistică.", "n": "Același subiect ca S34.", "w": false}]}, {"k": "a_teh", "et": "Altele", "tit": "Tehnologie și psihologie (Industry 4.0, IOC, ML, terapie online)", "col": "#4f7a3a", "s": [{"nr": 7, "q": "Care este principala caracteristică a Industry 4.0?", "r": "Integrarea tehnologiilor digitale avansate în procesele industriale, pentru sisteme de producție inteligente, flexibile și eficiente.", "e": [{"p": "Principala caracteristică a Industry 4.0 este integrarea tehnologiilor digitale avansate în procesele industriale, cu scopul de a crea sisteme de producție inteligente, flexibile și eficiente. Această revoluție industrială se bazează pe automatizare avansată și pe conectarea echipamentelor, mașinilor și sistemelor prin Internetul lucrurilor (IoT), permițând comunicarea în timp real între componentele procesului de producție."}, {"p": "De asemenea, inteligența artificială și analiza volumelor mari de date (big data) joacă un rol esențial, deoarece permit monitorizarea continuă a proceselor, optimizarea deciziilor și anticiparea problemelor înainte ca acestea să apară. Astfel, producția devine mai rapidă, mai precisă și mai adaptată cerințelor pieței."}, {"p": "În concluzie, Industry 4.0 transformă fabricile tradiționale în fabrici inteligente, capabile să se autoregleze, să se adapteze și să funcționeze eficient prin utilizarea tehnologiilor digitale interconectate."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 16, "q": "Ce este învățarea prin analogie în contextul învățării automate (ML)?", "r": "Un sistem rezolvă probleme noi comparându-le cu exemple similare cunoscute și transferându-le soluțiile.", "e": [{"p": "Învățarea prin analogie este un tip de învățare în care un sistem de învățare automată rezolvă probleme noi prin compararea lor cu exemple sau situații cunoscute, folosind similarități între date."}, {"h": "Modelul nu învață reguli explicite, ci:"}, {"b": "identifică cazuri similare din datele anterioare"}, {"b": "transferă soluția sau eticheta de la cazurile cunoscute la cele noi"}, {"p": "Decizia se bazează pe principiul: „situații similare → soluții similare”"}, {"p": "Exemple în ML"}, {"p": "k-Nearest Neighbors (k-NN) – clasifică un exemplu nou pe baza celor mai apropiate exemple cunoscute Case-Based Reasoning – rezolvă probleme noi folosind soluții din cazuri anterioare Sisteme de recomandare bazate pe similaritatea utilizatorilor sau produselor Avantaje Intuitiv și ușor de înțeles Nu necesită un model matematic complex Eficient când există exemple relevante în datele istorice Răspuns foarte scurt pentru examen:"}, {"p": "Învățarea prin analogie este un tip de învățare automată în care un sistem rezolvă probleme noi prin compararea lor cu exemple similare cunoscute și transferă soluțiile acestora."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 17, "q": "Care este rolul principal al interacțiunii om–calculator în psihologie?", "r": "Adaptarea sistemelor informatice la caracteristicile psihologice ale utilizatorilor, pentru o utilizare eficientă și ergonomică.", "e": [{"p": "Interacțiunea om-calculator în psihologie se concentrează pe optimizarea experienței utilizatorilor prin înțelegerea modului în care oamenii interacționează cu tehnologia."}, {"p": "Aceasta ajută la crearea de interfețe mai eficiente și accesibile și la îmbunătățirea performanței cognitive."}, {"p": "Rolul principal al interacțiunii om–calculator este de a înțelege și optimiza modul în care oamenii percep, folosesc și reacționează la sistemele informatice, astfel încât acestea să fie ușor de utilizat, eficiente și adaptate capacităților cognitive și emoționale ale utilizatorilor."}, {"p": "Pe scurt: Studiază comportamentul utilizatorului în interacțiunea cu tehnologia, îmbunătățește usability, experiența utilizatorului (UX) și satisfacția, reduce erorile, stresul și suprasolicitarea cognitivă Răspuns foarte scurt pentru examen:"}, {"p": "Interacțiunea om–calculator are rolul de a adapta sistemele informatice la caracteristicile psihologice ale utilizatorilor, pentru o utilizare eficientă și ergonomică."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 18, "q": "Ce tip de comunicare este utilizată în terapia online prin e-mail?", "r": "Comunicare verbală scrisă, asincronă, mediată de calculator.", "e": [{"p": "Tipuri de comunicare (clasificare relevantă pentru psihologie și online)"}, {"p": "După canal"}, {"p": "Verbală – prin cuvinte (scris sau oral)"}, {"p": "Nonverbală – gesturi, mimică, postură, ton (lipsește în e-mail)"}, {"p": "Paraverbală – intonație, ritm, volum (lipsește în e-mail)"}, {"p": "După sincronizare"}, {"p": "Comunicare sincronă – are loc în timp real"}, {"p": "(ex: chat live, video call)"}, {"p": "Comunicare asincronă – există decalaj de timp între mesaj și răspuns (ex: e-mail, forum) După mediu Față în față Mediată de tehnologie (online) Ce tip de comunicare este utilizată în terapia online prin e-mail?"}, {"p": "Comunicare scrisă, verbală, asincronă, mediată de calculator"}, {"p": "Explicație scurtă: este scrisă (mesaje text), este verbală (folosește limbajul), este asincronă (nu are loc în timp real), este mediată tehnologic (prin e-mail) Răspuns foarte scurt pentru examen:"}, {"p": "Terapia online prin e-mail utilizează comunicare verbală scrisă, asincronă."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 35, "q": "Ce manifestare fizică este asociată cu megatrendurile Industry 4.0?", "r": "Automatizarea industrială: roboți, inteligență artificială și IoT în fabricație.", "e": [{"p": "Automatizarea industrială este o manifestare fizică asociată cu megatrendurile Industry 4.0. Aceasta include utilizarea roboților, a inteligenței artificiale și a Internetului Lucrurilor (IoT) în procesele de fabricație."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 36, "q": "Ce caracteristică a Industry 4.0 permite interacțiunea dintre dispozitivele inteligente și procesele de fabricație?", "r": "Internetul lucrurilor (IoT): conectează echipamentele într-o rețea și permite colectarea și analiza datelor în timp real.", "e": [{"p": "Internetul Lucrurilor (IoT) permite interacțiunea dintre dispozitivele inteligente și procesele de fabricație. IoT conectează echipamentele și sistemele într-o rețea digitală, facilitând colectarea și analiza datelor în timp real pentru îmbunătățirea proceselor de producție."}], "u": "Nu apare în manualul de statistică.", "n": "Vezi și S90.", "w": false}, {"nr": 58, "q": "Ce reprezintă PC2 în contextul psihoterapiei online?", "r": "Conform PDF-ului: „Private Communication” — comunicare confidențială terapeut–pacient, care protejează informațiile personale.", "e": [{"p": "PC2 în contextul psihoterapiei online se referă la \"Private Communication\", o metodă de comunicare confidențială între terapeut și pacient, care asigură securitatea și protecția informațiilor personale în timpul sesiunilor online."}], "u": "Nu apare în manualul de statistică.", "n": "Explicația din PDF nu are sursă; verific-o în cursul de unde provine subiectul.", "w": true}, {"nr": 59, "q": "Care dintre următoarele nu este o formă de terapie online?", "r": "Terapia față în față, în persoană. Terapia online include sesiunile video, telefon sau e-mail.", "e": [{"p": "Terapia față în față, în persoană, nu este o formă de terapie online. Terapia online include sesiunile prin video, telefon sau e-mail."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 60, "q": "Care este impactul major al realității virtuale în psihoterapie?", "r": "Medii controlate și sigure pentru expunere, în tratarea anxietății, fobiilor și stresului post-traumatic.", "e": [{"p": "Realitatea virtuală (VR) permite crearea unor medii controlate și sigure în care pacienții pot experimenta situații de expunere pentru tratarea anxietății, fobiilor și stresului post-traumatic, îmbunătățind tratamentele prin simulări imersive."}], "u": "Nu apare în manualul de statistică.", "n": "", "w": false}, {"nr": 90, "q": "Ce tehnologie joacă un rol important în transformarea proceselor de fabricație în Industry 4.0?", "r": "Internetul lucrurilor (IoT): dispozitive și mașini interconectate care colectează și analizează date în timp real.", "e": [{"p": "Internetul Lucrurilor (IoT) joacă un rol important în Industry 4.0, permițând interconectarea dispozitivelor și mașinilor inteligente care colectează și analizează date în timp real pentru a optimiza procesele de fabricație și a îmbunătăți eficiența operațională."}], "u": "Nu apare în manualul de statistică.", "n": "Vezi și S36.", "w": false}]}, {"k": "a_spss", "et": "Altele", "tit": "SPSS", "col": "#b0603a", "s": [{"nr": 32, "q": "Care este cel mai utilizat instrument pentru analiza datelor în psihologie?", "r": "SPSS (Statistical Package for the Social Sciences).", "e": [{"p": "SPSS (Statistical Package for the Social Sciences) este unul dintre cele mai utilizate instrumente pentru analiza datelor în psihologie. Acesta oferă o gamă largă de tehnici statistice pentru analiza datelor și interpretarea acestora."}], "u": "Manualul nu prezintă programe de calcul.", "n": "", "w": false}, {"nr": 48, "q": "Ce estimare SPSS este utilizată pentru a calcula regresia liniară?", "r": "Opțiunea „Linear Regression” (Analyze → Regression → Linear), care dă coeficienții și indicatorii regresiei.", "e": [{"p": "În SPSS, estimarea pentru calculul regresiei liniare este obținută folosind opțiunea \"Linear Regression\" din meniul de analize statistice, care oferă coeficienții și indicatorii necesari pentru analiza regresiei."}], "u": "Manualul nu prezintă programe de calcul.", "n": "", "w": false}, {"nr": 57, "q": "Cum se numește testul care compară mediile a două grupuri independente în SPSS?", "r": "„Independent-Samples T Test” (Analyze → Compare Means).", "e": [{"p": "Testul care compară mediile a două grupuri independente în SPSS se numește"}, {"p": "\"Independent Samples T Test\", iar acesta este disponibil în meniul de analize statistice."}], "u": "Manualul nu prezintă programe de calcul.", "n": "", "w": false}, {"nr": 73, "q": "În SPSS, ce fereastră este utilizată pentru vizualizarea variabilelor care constituie structura bazei de date?", "r": "Variable View (definește variabilele: nume, tip, etichete, nivel de măsură). Data View arată valorile introduse.", "e": [{"p": "Fereastra \"Data View\" din SPSS este utilizată pentru a vizualiza variabilele și valorile lor, constituind baza de date în care sunt stocate informațiile pentru analiza ulterioară."}], "u": "Manualul nu prezintă programe de calcul.", "n": "PDF-ul răspunde „Data View”, dar pentru „variabilele care constituie structura bazei de date” fereastra este Variable View. Verifică varianta acceptată la examen.", "w": true}, {"nr": 74, "q": "Care este comanda din SPSS pentru a efectua o analiză de corelație Pearson?", "r": "Analyze → Correlate → Bivariate (bifezi Pearson).", "e": [{"p": "În SPSS, comanda pentru analiza de corelație Pearson este găsită sub"}, {"p": "\"Analyze\" > \"Correlate\" > \"Bivariate\". Aici se selectează variabilele pentru a calcula coeficientul de corelație Pearson."}], "u": "Manualul nu prezintă programe de calcul.", "n": "", "w": false}]}, {"k": "a_stat", "et": "Altele", "tit": "Statistică în afara manualului", "col": "#5a5fa8", "s": [{"nr": 22, "q": "Care este scopul principal al regresiei logistice?", "r": "Estimarea probabilității unui rezultat binar (da/nu) pe baza unuia sau mai multor predictori și clasificarea observațiilor.", "e": [{"p": "Regresia logistică este o metodă statistică și de învățare automată utilizată pentru modelarea relației dintre una sau mai multe variabile independente și o variabilă dependentă categorială, de regulă binara (ex: da/nu, 0/1)."}, {"p": "Scopul principal al regresiei logistice"}, {"p": "Estimarea probabilității ca un eveniment să apară (sau nu), pe baza predictorilor disponibili, și clasificarea observațiilor în categorii."}, {"h": "Ce face concret:"}, {"b": "Prezice probabilitatea unui rezultat (ex: probabilitatea de a dezvolta o boală)"}, {"b": "Clasifică observațiile în clase (ex: risc / fără risc)"}, {"b": "Analizează influența variabilelor independente asupra rezultatului"}, {"h": "Exemple de utilizare:"}, {"b": "diagnostic psihologic: tulburare prezentă / absentă"}, {"b": "marketing: cumpără / nu cumpără"}, {"b": "medicină: boală / sănătos"}, {"h": "Răspuns foarte scurt pentru examen:"}, {"p": "1. Regresia logistică are ca scop estimarea probabilității și clasificarea unui rezultat binar, pe baza uneia sau mai multor variabile independente."}, {"p": "2. Scopul principal al regresiei logistice este de a prezice probabilitatea unui eveniment binar (de tipul da/nu) pe baza uneia sau mai multor variabile independente. Este folosită când variabila dependentă este de tip categorial (binară), cum ar fi prezența sau absența unei boli."}], "u": "Manualul are doar regresia liniară și cea multiplă (Cap. 12 (Mărimi ale corelației), 12.4 și 12.6), nu și regresia logistică.", "n": "", "w": false}, {"nr": 51, "q": "Cum se numește regresia utilizată când variabila dependentă este nominală cu mai multe niveluri?", "r": "Regresia logistică multinomială.", "e": [{"p": "Când variabila dependentă este nominală cu mai multe niveluri, se utilizează regresia logistică multinomială, care permite modelarea relației între o variabilă dependentă multinomială și una sau mai multe variabile independente."}], "u": "Nu apare în manual.", "n": "", "w": false}, {"nr": 53, "q": "Care este testul neparametric folosit pentru a analiza mai multe grupuri corelate?", "r": "Testul Friedman: trei sau mai multe măsurători pe aceiași subiecți, date nenormale.", "e": [{"p": "Testul neparametric utilizat pentru a analiza mai multe grupuri corelate este testul Friedman. Acesta este folosit atunci când datele nu sunt distribuite normal și se dorește compararea a trei sau mai multe grupuri."}], "u": "Nu apare în manual. Cele mai apropiate: Kruskal–Wallis (grupuri independente, Cap. 11, 11.7) și ANOVA pentru eșantioane dependente (Cap. 10 (Analiza de varianță (ANOVA)), 10.3).", "n": "", "w": false}]}], "inCurs": 46};

function hl(s, q){ s = esc(s); if (!q) return s; var low = s.toLowerCase(), out = '', i = 0, j;
  var qe = esc(q).toLowerCase();
  while ((j = low.indexOf(qe, i)) >= 0) { out += s.slice(i, j) + '<mark>' + s.slice(j, j + qe.length) + '</mark>'; i = j + qe.length; }
  return out + s.slice(i); }

function togLabel(){ return anyOpen() ? 'Închide tot' : 'Deschide tot'; }
function render(){
  var tot = 0, h = '<div class="book"><h1>Subiecte examen · ianuarie 2026</h1><p class="sub">Analiza superioară a datelor · cele 90 de subiecte, grupate pe capitolele manualului</p></div>';
  h += '<div class="toc"><h2>Cuprins</h2>';
  var altele = false;
  D.g.forEach(function(g){
    if (g.et === 'Altele' && !altele) { altele = true; h += '<div class="sep">Altele — subiecte care nu apar în manual</div>'; }
    h += '<div class="row" data-go="' + g.k + '" style="--bc:' + g.col + '"><span>' + esc((g.et === 'Altele' ? '' : g.et + ' · ') + g.tit) + '</span><b>' + g.s.length + '</b></div>';
  });
  h += '<p class="note">' + D.inCurs + ' subiecte se regăsesc în manual, ' + (90 - D.inCurs) + ' în „Altele”. Subiectele repetate sunt marcate „Același subiect ca…”. '
    + 'Fiecare card are un răspuns scurt, apoi explicația completă din PDF. Unde explicația din PDF pare greșită, apare o notă galbenă. Subiectele 14 și 25 sunt în PDF ca imagini. Grila scanată de pe ultima pagină nu e inclusă aici.</p></div>';
  h += '<div class="tools"><input id="q" type="search" placeholder="Caută (ex.: Wilcoxon)" value="' + esc(query) + '">'
    + '<span class="seg"><button class="btn' + (order === 'cap' ? ' on' : '') + '" data-ord="cap">Pe capitole</button><button class="btn' + (order === 'pdf' ? ' on' : '') + '" data-ord="pdf">Ordinea din PDF</button></span>'
    + '<button class="btn" id="tog" data-all="1">' + togLabel() + '</button><div class="count" id="cnt"></div></div>';
  var q = query.trim().toLowerCase();
  function capName(g){ return g.et === 'Altele' ? 'Altele · ' + g.tit : g.et + ' — ' + g.tit; }
  function match(s){ if (!q) return true; var txt = [s.q, s.r, s.u, s.n].concat(s.e.map(function(x){ return x.tab ? x.tab.join(' ') : (x.p || x.h || x.b); })).join(' ').toLowerCase();
    return txt.indexOf(q) >= 0 || ('s' + s.nr) === q; }
  function card(s, g, showCap){
    var cards = '';
      var c = shut[s.nr] && !q;
      cards += '<div class="branch' + (c ? ' closed' : '') + '" style="--bc:' + g.col + '"><div class="bhead" data-nr="' + s.nr + '"><span class="nr">S' + s.nr + '</span><span class="qq">' + (showCap ? '<span class="captag">' + esc(capName(g)) + '</span>' : '') + hl(s.q, q) + '</span><span class="tri">' + (c ? '+' : '▾') + '</span></div><div class="body">'
        + '<div class="ans"><i>Răspuns scurt</i>' + hl(s.r, q) + '</div>';
      cards += '<div class="pdf">';
      var ul = false;
      s.e.forEach(function(x){
        if (x.b !== undefined) { if (!ul) { cards += '<ul>'; ul = true; } cards += '<li>' + hl(x.b, q) + '</li>'; return; }
        if (ul) { cards += '</ul>'; ul = false; }
        if (x.h !== undefined) cards += '<h4>' + hl(x.h, q) + '</h4>';
        else if (x.tab) { cards += '<table>'; x.tab.forEach(function(r, k){ cards += '<tr>' + r.map(function(c){ return k ? '<td>' + hl(c, q) + '</td>' : '<th>' + esc(c) + '</th>'; }).join('') + '</tr>'; }); cards += '</table>'; }
        else cards += '<p' + (/^\d+\. /.test(x.p) && x.p.length < 60 ? ' class="num"' : '') + '>' + hl(x.p, q) + '</p>';
      });
      if (ul) cards += '</ul>';
      cards += '</div>';
      if (s.n) cards += '<div class="' + (s.w ? 'nota' : 'ref') + '">' + hl(s.n, q) + '</div>';
      cards += '<div class="where">Unde: ' + hl(s.u, q) + '</div></div></div>';
    return cards;
  }
  if (order === 'pdf') {
    var all = [];
    D.g.forEach(function(g){ g.s.forEach(function(s){ if (match(s)) all.push([s, g]); }); });
    all.sort(function(x, y){ return x[0].nr - y[0].nr; });
    tot = all.length;
    h += '<section class="grp" id="lista">' + all.map(function(x){ return card(x[0], x[1], true); }).join('') + (tot ? '<span class="top" data-top="1">↑ Cuprins</span>' : '') + '</section>';
  } else D.g.forEach(function(g){
    var cards = '', n = 0;
    g.s.forEach(function(s){ if (!match(s)) return; n++; cards += card(s, g, false); });
    tot += n;
    if (!n) return;
    h += '<section class="grp" id="' + g.k + '" style="--bc:' + g.col + '"><div class="mmroot">' + esc(capName(g)) + '<small>' + n + (n === 1 ? ' subiect' : ' subiecte') + '</small></div>' + cards + '<span class="top" data-top="1">↑ Cuprins</span></section>';
  });
  app.innerHTML = h;
  document.getElementById('cnt').textContent = q ? (tot + ' subiecte găsite') : '';
  var inp = document.getElementById('q');
  inp.addEventListener('input', function(){ query = inp.value; var pos = inp.selectionStart; render(); var i2 = document.getElementById('q'); i2.focus(); try { i2.setSelectionRange(pos, pos); } catch(e) {} });
}
app.addEventListener('click', function(e){
  var t = e.target.closest('[data-nr],[data-go],[data-all],[data-top],[data-ord]'); if (!t) return;
  if (t.dataset.nr) { var nr = t.dataset.nr; shut[nr] = !shut[nr]; var b = t.parentNode; b.classList.toggle('closed'); t.querySelector('.tri').textContent = shut[nr] ? '+' : '▾'; document.getElementById('tog').textContent = togLabel(); }
  else if (t.dataset.ord) { if (order !== t.dataset.ord) { order = t.dataset.ord; render(); } }
  else if (t.dataset.go) { if (order !== 'cap') { order = 'cap'; render(); } var el = document.getElementById(t.dataset.go); if (el) el.scrollIntoView({behavior: 'smooth'}); }
  else if (t.dataset.top) { window.scrollTo({top: 0, behavior: 'smooth'}); }
  else { var cl = anyOpen(); D.g.forEach(function(g){ g.s.forEach(function(s){ shut[s.nr] = cl; }); }); render(); }
});
render();
})();
</script>
</body>
</html>
