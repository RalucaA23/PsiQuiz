" stroke=\"#2c2a26\" stroke-width=\"1.3\"/><circle cx=\"220.0\" cy=\"104.0\" r=\"9.0\" fill=\"#b5453a\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><rect x=\"246.0\" y=\"95.0\" width=\"18\" height=\"18\" fill=\"#ffffff\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><circle cx=\"290.0\" cy=\"104.0\" r=\"9.0\" fill=\"#b5453a\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><rect x=\"316.0\" y=\"95.0\" width=\"18\" height=\"18\" fill=\"#ffffff\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><text x=\"272.0\" y=\"136.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">tat\u0103l afectat: toate</text><text x=\"272.0\" y=\"149.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">fiicele afectate, fiii nu</text><rect x=\"14.0\" y=\"230.0\" width=\"12\" height=\"12\" fill=\"#b5453a\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><text x=\"31.0\" y=\"240.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.2\">afectat</text><circle cx=\"88.8\" cy=\"236.0\" r=\"6.0\" fill=\"#ffffff\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><circle cx=\"88.8\" cy=\"236.0\" r=\"1.7\" fill=\"#b5453a\"/><text x=\"99.8\" y=\"240.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.2\">purt\u0103toare s\u0103n\u0103toas\u0103</text><rect x=\"221.8\" y=\"230.0\" width=\"12\" height=\"12\" fill=\"#ffffff\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><text x=\"238.8\" y=\"240.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.2\">s\u0103n\u0103tos</text></svg>"}]}]}, "sectiuni": [], "runde": [{"id": "1", "eticheta": "Runda 1 \u00b7 Baz\u0103", "titlu": "Runda 1 \u2014 Concepte de baz\u0103", "desc": "Teorie: modelele de transmitere, excep\u021biile lor, consangvinitatea \u0219i ereditatea legat\u0103 de sex, \u00een \u00eentreb\u0103ri directe.", "intrebari": [{"q": "Ce face ca un caracter s\u0103 fie monogenic?", "opts": ["Prezen\u021ba lui depinde de gene de pe cromozomul X", "Prezen\u021ba lui depinde de mai multe gene \u0219i de mediu", "Prezen\u021ba lui depinde de un singur cuplu de gene", "Prezen\u021ba lui depinde de un cromozom \u00eentreg"], "correct": 2, "explain": "Un caracter monogenic (mendelian) e determinat de un singur locus, deci de un cuplu de alele, \u0219i segreg\u0103 \u00een propor\u021bii fixe. Genele de pe X dau doar un anumit model de transmitere, nu fac caracterul monogenic; mai multe gene plus mediu descriu ereditatea multifactorial\u0103.", "tag": "Caracterul monogenic"}, {"q": "Ce gre\u0219eal\u0103 con\u021bine formula \u201epersoana X are gena pentru boala Y\u201d?", "opts": ["Gena bolii apare doar la purt\u0103torii heterozigo\u021bi", "To\u021bi avem gena; bolnavul are o muta\u021bie a ei", "Bolile monogenice sunt produse de cromozomi \u00eentregi", "Gena bolii e activ\u0103 doar \u00een prezen\u021ba mediului"], "correct": 1, "explain": "To\u021bi oamenii au gena respectiv\u0103; bolnavul are o form\u0103 mutant\u0103, uneori nefunc\u021bional\u0103, a ei. A defini gena prin boal\u0103 e ca a spune c\u0103 ficatul exist\u0103 pentru ciroz\u0103. Purt\u0103torii, cromozomii sau mediul nu schimb\u0103 faptul c\u0103 gena normal\u0103 e prezent\u0103 la toat\u0103 lumea.", "tag": "Gena definit\u0103 prin boal\u0103"}, {"q": "Ce dificultate a omului ca obiect de studiu genetic se poate dep\u0103\u0219i cumul\u00e2nd datele din mai multe familii?", "opts": ["Num\u0103rul mic de membri ai unei familii", "Intervalul mare dintre dou\u0103 genera\u021bii", "Imposibilitatea experien\u021belor genetice pe om", "Diversitatea foarte mare a indivizilor"], "correct": 0, "explain": "Riscul mendelian se verific\u0103 doar \u00een familii mari; datele din mai multe familii cu aceea\u0219i tr\u0103s\u0103tur\u0103 se pot prelucra statistic \u00eempreun\u0103. Intervalul dintre genera\u021bii \u0219i interdic\u021bia experien\u021belor r\u0103m\u00e2n limite de neocolit, iar diversitatea (omul e un polihibrid) nu dispare prin cumulare.", "tag": "Omul ca obiect de studiu genetic"}, {"q": "Ce cere o anchet\u0103 familial\u0103 corect\u0103?", "opts": ["Probandul \u0219i p\u0103rin\u021bii lui, examina\u021bi direct", "Membri c\u00e2t mai mul\u021bi, pe cel pu\u021bin trei genera\u021bii", "Cel pu\u021bin cinci genera\u021bii, examinate direct", "Rudele afectate, pe dou\u0103 genera\u021bii succesive"], "correct": 1, "explain": "Ancheta cere investigarea direct\u0103 a c\u00e2t mai multor membri, pe cel pu\u021bin trei genera\u021bii, cu fra\u021bii p\u0103rin\u021bilor \u0219i ascenden\u021bii lor. Cinci genera\u021bii e maximul pe care \u00eel poate vedea direct un observator \u00een via\u021ba lui, nu o cerin\u021b\u0103; doar rudele afectate sau doar p\u0103rin\u021bii nu arat\u0103 modelul de transmitere.", "tag": "Ancheta familial\u0103"}, {"q": "Ce doi factori decid modelul de pedigree al unui caracter monogenic?", "opts": ["Dominan\u021ba genei \u0219i cromozomul pe care se afl\u0103", "Num\u0103rul de gene implicate \u0219i influen\u021ba mediului", "Frecven\u021ba genei \u0219i m\u0103rimea familiilor studiate", "V\u00e2rsta de debut \u0219i gravitatea bolii produse"], "correct": 0, "explain": "Modelul depinde de expresia genei (dominant\u0103 sau recesiv\u0103) \u0219i de locul ei (autozom sau gonozom), de unde cele patru modele de baz\u0103. Num\u0103rul de gene \u0219i mediul \u021bin de ereditatea multifactorial\u0103; v\u00e2rsta de debut \u0219i frecven\u021ba pot doar modifica aspectul unui model.", "tag": "Cele patru modele de transmitere"}, {"q": "Ce semn de pedigree e tipic transmiterii autozomale dominante?", "opts": ["Bolnavi \u00eentr-o singur\u0103 genera\u021bie, \u00eentre fra\u021bi", "Transmitere oblic\u0103, prin femei purt\u0103toare s\u0103n\u0103toase", "B\u0103rba\u021bi bolnavi care transmit boala doar fiicelor", "Continuitate pe vertical\u0103, \u00een fiecare genera\u021bie"], "correct": 3, "explain": "Muta\u021bia dominant\u0103 se vede la fiecare purt\u0103tor, deci apare \u00een fiecare genera\u021bie: continuitate pe vertical\u0103. Bolnavii doar \u00eentre fra\u021bi (model orizontal) indic\u0103 ereditatea recesiv\u0103 autozomal\u0103, transmiterea oblic\u0103 pe cea recesiv\u0103 legat\u0103 de X, iar tat\u0103l care transmite doar fiicelor pe cea dominant\u0103 legat\u0103 de X.", "tag": "Criteriile transmiterii dominante"}, {"q": "De ce consangvinitatea nu e mai frecvent\u0103 \u00een familiile cu o boal\u0103 autozomal\u0103 dominant\u0103?", "opts": ["Bolile dominante sunt eliminate repede de selec\u021bie", "Muta\u021biile dominante apar mai ales ca muta\u021bii noi", "Purt\u0103torii s\u0103n\u0103to\u0219i nu transmit mai departe gena", "Un bolnav are copii bolnavi \u0219i cu un partener ne\u00eenrudit"], "correct": 3, "explain": "La boala dominant\u0103 o singur\u0103 alel\u0103 mutant\u0103 ajunge; un bolnav o transmite cu risc de 50% oricare ar fi partenerul, deci \u00eenrudirea nu conteaz\u0103. Consangvinitatea ajut\u0103 doar unde trebuie s\u0103 se \u00eent\u00e2lneasc\u0103 dou\u0103 alele recesive. Selec\u021bia, muta\u021biile noi \u0219i faptul c\u0103 transmit doar afecta\u021bii nu explic\u0103 absen\u021ba consangvinit\u0103\u021bii.", "tag": "Criteriile transmiterii dominante"}, {"q": "Ce arat\u0103 faptul c\u0103 la hipercolesterolemia familial\u0103 homozigo\u021bii sunt mai grav afecta\u021bi dec\u00e2t heterozigo\u021bii?", "opts": ["Semidominan\u021ba genei mutante", "Penetran\u021ba incomplet\u0103 a genei mutante", "Influen\u021ba sexului asupra expresiei genei", "Heterogenitatea genetic\u0103 a bolii"], "correct": 0, "explain": "Trei fenotipuri distincte (+/+ normal, +/\u2212 moarte ca adult t\u00e2n\u0103r, \u2212/\u2212 moarte \u00een copil\u0103rie) arat\u0103 c\u0103 heterozigotul e intermediar: semidominan\u021b\u0103, ca \u00een Cap. 2 (Ereditatea mendelian\u0103: legile lui Mendel). Penetran\u021ba incomplet\u0103 ar \u00eensemna purt\u0103tori f\u0103r\u0103 boal\u0103, influen\u021ba sexului diferen\u021be \u00eentre b\u0103rba\u021bi \u0219i femei, iar heterogenitatea muta\u021bii diferite pentru acela\u0219i fenotip.", "tag": "Homozigotul dominant"}, {"q": "Prin ce se deosebe\u0219te penetran\u021ba incomplet\u0103 de expresivitatea variabil\u0103?", "opts": ["Prima prive\u0219te c\u00e2t de intens se manifest\u0103 gena, a doua dac\u0103", "Prima e produs\u0103 de mediu, a doua de genotipul purt\u0103torului", "Prima apare la genele recesive, a doua la cele dominante", "Prima prive\u0219te dac\u0103 gena se manifest\u0103, a doua c\u00e2t de intens"], "correct": 3, "explain": "Penetran\u021ba e procentul purt\u0103torilor care manifest\u0103 fenotipul (unii nu-l manifest\u0103 deloc: saltul unei genera\u021bii); expresivitatea e gradul \u00een care se manifest\u0103 la cei afecta\u021bi (forme u\u0219oare sau severe). Inversarea lor e confuzia tipic\u0103; ambele fenomene sunt descrise la gene dominante \u0219i niciunul nu e definit ca efect al mediului.", "tag": "Expresivitatea variabil\u0103"}, {"q": "De ce o muta\u021bie care anuleaz\u0103 o enzim\u0103 se manifest\u0103 de obicei recesiv?", "opts": ["Enzimele sunt codificate mai ales pe cromozomul X", "O singur\u0103 alel\u0103 normal\u0103 asigur\u0103 \u00eenc\u0103 activitatea enzimei", "Muta\u021biile enzimatice apar numai \u00een timpul meiozei", "Enzima mutant\u0103 blocheaz\u0103 activitatea celei normale"], "correct": 1, "explain": "Pentru pierderea complet\u0103 a activit\u0103\u021bii enzimatice trebuie s\u0103 lipseasc\u0103 ambele copii ale genei; heterozigotul, cu o copie normal\u0103, r\u0103m\u00e2ne s\u0103n\u0103tos (fenilcetonurie, galactozemie). O enzim\u0103 mutant\u0103 care o blocheaz\u0103 pe cea normal\u0103 ar da tocmai un efect dominant; localizarea pe X sau momentul muta\u021biei nu explic\u0103 recesivitatea.", "tag": "Recesivitatea \u0219i enzimele"}, {"q": "Ce fenomen explic\u0103 excep\u021bia de la regula c\u0103 doi p\u0103rin\u021bi cu aceea\u0219i boal\u0103 recesiv\u0103 au numai copii bolnavi?", "opts": ["Penetran\u021ba incomplet\u0103", "Muta\u021bia de novo", "Heterogenitatea genetic\u0103", "Expresivitatea variabil\u0103"], "correct": 2, "explain": "Aceea\u0219i boal\u0103 poate fi produs\u0103 de muta\u021bii \u00een gene diferite (4\u20135 forme de albinism, 20 de forme de surditate); p\u0103rin\u021bii cu forme diferite au copii heterozigo\u021bi pentru ambele gene, deci s\u0103n\u0103to\u0219i. Penetran\u021ba \u0219i expresivitatea privesc o singur\u0103 gen\u0103, iar o muta\u021bie nou\u0103 ar explica un bolnav nea\u0219teptat, nu un copil s\u0103n\u0103tos.", "tag": "Heterogenitatea genetic\u0103"}, {"q": "Ce deosebe\u0219te coeficientul de \u00eenrudire de coeficientul de consangvinitate?", "opts": ["Primul d\u0103 homozigo\u021bia copilului, al doilea genele comune rudelor", "Primul d\u0103 genele comune rudelor, al doilea homozigo\u021bia copilului", "Primul prive\u0219te rudele de gradul I, al doilea rudele \u00eendep\u0103rtate", "Primul se calculeaz\u0103 pentru p\u0103rin\u021bi, al doilea pentru bunici"], "correct": 1, "explain": "Coeficientul de \u00eenrudire arat\u0103 propor\u021bia de gene comune membrilor cuplului consangvin (fra\u021bi: 1/2); coeficientul de consangvinitate F arat\u0103 probabilitatea ca un copil al lor s\u0103 primeasc\u0103 ambele alele ale unei gene de la str\u0103mo\u0219ul comun (fra\u021bi: 1/4). Ambii se calculeaz\u0103 pentru orice grad de rudenie.", "tag": "Coeficien\u021bii de \u00eenrudire \u0219i consangvinitate"}, {"q": "De ce o muta\u021bie recesiv\u0103 de pe X se manifest\u0103 la b\u0103rba\u021bi, dar nu la femeile heterozigote?", "opts": ["B\u0103rba\u021bii au o singur\u0103 copie a genelor de pe X", "Cromozomul Y poart\u0103 perechea recesiv\u0103 a genei", "Femeile inactiveaz\u0103 de regul\u0103 X-ul cu muta\u021bia", "Gena e dominant\u0103 la b\u0103rba\u021bi \u0219i recesiv\u0103 la femei"], "correct": 0, "explain": "Hemizigo\u021bia: b\u0103rbatul are un singur X, deci nicio alel\u0103 normal\u0103 care s\u0103 mascheze muta\u021bia; la femeie, alela normal\u0103 de pe cel\u0103lalt X o mascheaz\u0103. Y nu poart\u0103 perechea genelor de pe X, inactivarea unui X e \u00eent\u00e2mpl\u0103toare, nu \u021bintit\u0103, iar o gen\u0103 care \u00ee\u0219i schimb\u0103 dominan\u021ba dup\u0103 sex descrie ereditatea influen\u021bat\u0103 de sex.", "tag": "Hemizigo\u021bia"}, {"q": "Ce rela\u021bie dintre dezgustul fa\u021b\u0103 de incest \u0219i legile care \u00eel interzic sus\u021bine ipoteza unui mecanism \u00eenn\u0103scut?", "opts": ["Legile au creat dezgustul, la trecerea spre cultur\u0103", "Dezgustul \u0219i legile au ap\u0103rut independent unul de altul", "Dezgustul a dus la legi, nu legile la dezgust", "Legile apar doar \u00een societ\u0103\u021bile f\u0103r\u0103 acest dezgust"], "correct": 2, "explain": "Observa\u021biile la primate (Jane Goodall) sugereaz\u0103 o aversiune \u00eenn\u0103scut\u0103 fa\u021b\u0103 de consangvinitate, din care ar fi rezultat legile. Varianta cu trecerea de la natur\u0103 la cultur\u0103 e pozi\u021bia lui Claude L\u00e9vi-Strauss, pe care ipoteza o contrazice; celelalte nu leag\u0103 cele dou\u0103 fenomene.", "tag": "Prohibi\u021bia incestului"}, {"q": "Ce deosebe\u0219te ereditatea influen\u021bat\u0103 de sex de ereditatea legat\u0103 de sex?", "opts": ["Gena e pe X \u0219i se exprim\u0103 doar la b\u0103rba\u021bii hemizigo\u021bi", "Gena e pe Y \u0219i se transmite numai de la tat\u0103 la fiu", "Gena e pe un autozom, dar se exprim\u0103 diferit dup\u0103 sex", "Gena e pe X, dar e inactivat\u0103 la toate femeile purt\u0103toare"], "correct": 2, "explain": "La ereditatea influen\u021bat\u0103 de sex gena e autozomal\u0103, doar manifestarea difer\u0103 (guta \u0219i calvi\u021bia frontal\u0103 mai ales la b\u0103rba\u021bi, c\u0103derea precoce a din\u021bilor la femei). Gena de pe X sau de pe Y descrie ereditatea legat\u0103 de sex, respectiv holandric\u0103.", "tag": "Ereditatea influen\u021bat\u0103 de sex"}]}, {"id": "2", "eticheta": "Runda 2 \u00b7 Aplica\u021bii", "titlu": "Runda 2 \u2014 Scenarii \u0219i ra\u021bionament", "desc": "Situa\u021bii cu mai mul\u021bi pa\u0219i: cite\u0219ti pedigree-uri, deduci modelul \u0219i genotipurile, calculezi riscuri pentru sfatul genetic.", "intrebari": [{"q": "\u00centr-o familie, patru persoane sunt heterozigote pentru polidactilie (dominant\u0103 autozomal\u0103), dar una dintre ele nu are degete \u00een plus. Care e riscul ca un copil al unui heterozigot cu un partener s\u0103n\u0103tos s\u0103 aib\u0103 polidactilie?", "opts": ["50%", "75%", "25%", "37,5%"], "correct": 3, "explain": "Penetran\u021ba e 3/4 = 75% (trei din patru purt\u0103tori manifest\u0103 gena); riscul se ob\u021bine \u00eenmul\u021bind riscul mendelian cu penetran\u021ba: 0,50 \u00d7 0,75 = 0,375. 50% ar fi riscul f\u0103r\u0103 penetran\u021b\u0103 incomplet\u0103, 75% e penetran\u021ba singur\u0103, iar 25% e riscul la doi purt\u0103tori ai unei boli recesive.", "tag": "Penetran\u021ba incomplet\u0103"}, {"q": "Doi p\u0103rin\u021bi de talie normal\u0103, f\u0103r\u0103 boala \u00een familie, au un copil cu acondroplazie (dominant\u0103 autozomal\u0103); tat\u0103l avea 48 de ani la concep\u021bie. Ce risc are urm\u0103torul copil al cuplului \u0219i ce risc vor avea copiii acestui copil?", "opts": ["25% pentru frate; 50% pentru copiii lui", "Neglijabil pentru frate; 50% pentru copiii lui", "50% pentru frate; 50% pentru copiii lui", "Neglijabil pentru frate; 25% pentru copiii lui"], "correct": 1, "explain": "Cazul sporadic, cu tat\u0103 v\u00e2rstnic, indic\u0103 o muta\u021bie de novo ap\u0103rut\u0103 \u00eentr-un gamet: accidentul nu se repet\u0103 identic, deci fra\u021bii au risc neglijabil, dar purt\u0103torul o transmite mai departe cu 50%, ca la orice boal\u0103 dominant\u0103. 25% ar presupune o boal\u0103 recesiv\u0103 cu p\u0103rin\u021bi purt\u0103tori.", "tag": "Muta\u021bia de novo"}, {"q": "Doi p\u0103rin\u021bi cu acondroplazie au doi copii: unul cu acondroplazie \u0219i unul de talie normal\u0103. Ce rezult\u0103 despre modul de transmitere \u0219i despre genotipuri?", "opts": ["Dominant autozomal; p\u0103rin\u021bii sunt Mn, copilul normal nn", "Recesiv autozomal; copilul normal arat\u0103 heterogenitate", "Dominant autozomal; p\u0103rin\u021bii sunt MM, copilul normal Mn", "Dominant cu penetran\u021b\u0103 incomplet\u0103; copilul normal e Mn"], "correct": 0, "explain": "Doi p\u0103rin\u021bi bolnavi cu un copil s\u0103n\u0103tos: boala nu poate fi recesiv\u0103 (p\u0103rin\u021bi mm ar avea numai copii mm), deci e dominant\u0103, iar p\u0103rin\u021bii sunt heterozigo\u021bi Mn, fiecare d\u00e2nd copilului normal alela n. Cu MM to\u021bi copiii ar fi afecta\u021bi; penetran\u021ba incomplet\u0103 e posibil\u0103 \u00een principiu, dar nu e cerut\u0103 de date.", "tag": "Criteriile transmiterii dominante"}, {"q": "Doi so\u021bi au albinism oculo-cutanat, o tr\u0103s\u0103tur\u0103 recesiv\u0103 autozomal\u0103, \u0219i au trei copii, to\u021bi cu pigmentare normal\u0103. Ce explica\u021bie se potrive\u0219te cu genetica?", "opts": ["Ambii au aceea\u0219i muta\u021bie, iar copiii au primit c\u00e2te o muta\u021bie invers\u0103 nou\u0103", "Copiii poart\u0103 alela albinismului, dar ea are la ei penetran\u021b\u0103 incomplet\u0103", "Au forme de albinism date de gene diferite; copiii sunt dublu heterozigo\u021bi", "Copiii au o fenocopie a pigment\u0103rii normale, produs\u0103 de expunerea la soare"], "correct": 2, "explain": "Heterogenitatea genetic\u0103: exist\u0103 4\u20135 forme de albinism, din gene diferite. Fiecare p\u0103rinte e homozigot recesiv pentru alt\u0103 gen\u0103, iar copiii primesc o alel\u0103 normal\u0103 pentru fiecare gen\u0103, deci sunt s\u0103n\u0103to\u0219i. Trei muta\u021bii inverse la r\u00e2nd sunt improbabile, iar fenocopia imit\u0103 o boal\u0103, nu o stare normal\u0103.", "tag": "Heterogenitatea genetic\u0103"}, {"q": "Un copil are osteogenez\u0103 imperfect\u0103 (fracturi multiple, sclere albastre). P\u0103rin\u021bii par s\u0103n\u0103to\u0219i, dar la examinare mama are sclere albastre, f\u0103r\u0103 fracturi. Ce schimb\u0103 observa\u021bia \u00een sfatul genetic?", "opts": ["Boala e o muta\u021bie nou\u0103: risc neglijabil pentru fra\u021bi", "Mama poart\u0103 probabil muta\u021bia: risc 50% la fiecare copil", "Copilul are o fenocopie, care nu se va transmite", "Mama e purt\u0103toare recesiv\u0103: risc de 25% la fiecare copil"], "correct": 1, "explain": "Sclerele albastre sunt o form\u0103 frust\u0103: aceea\u0219i muta\u021bie dominant\u0103, cu expresivitate variabil\u0103. Mama e deci purt\u0103toare, iar riscul de transmitere e 50%. F\u0103r\u0103 examinare, cazul ar fi p\u0103rut o muta\u021bie de novo, cu risc de recuren\u021b\u0103 neglijabil pentru p\u0103rin\u021bi; boala e dominant\u0103, nu recesiv\u0103.", "tag": "Formele fruste"}, {"q": "\u00centr-o familie, bunicul a avut primele simptome ale unei boli neurodegenerative la 58 de ani, fiica lui la 44, iar nepotul la 31. Ce explic\u0103 acest \u0219ir?", "opts": ["Penetran\u021ba incomplet\u0103: gena sare peste unele genera\u021bii", "Anticipa\u021bia: un triplet repetat se amplific\u0103 la fiecare transmitere", "Ereditatea influen\u021bat\u0103 de sex: boala e mai grav\u0103 la b\u0103rba\u021bi", "Fenocopia: un factor de mediu comun produce boala tot mai devreme"], "correct": 1, "explain": "Debutul tot mai precoce \u00een genera\u021bii succesive e anticipa\u021bia; substratul e o muta\u021bie dinamic\u0103, num\u0103rul de repeti\u021bii ale unui triplet (CAG \u00een coreea Huntington) cresc\u00e2nd \u00een meioz\u0103. Nicio genera\u021bie nu e s\u0103rit\u0103, femeia e \u0219i ea afectat\u0103, iar o fenocopie nu s-ar transmite.", "tag": "Anticipa\u021bia"}, {"q": "O boal\u0103 dominant\u0103 \u0219i letal\u0103 debuteaz\u0103 \u00een jurul v\u00e2rstei de 50 de ani; alta, la fel de grav\u0103, debuteaz\u0103 \u00een copil\u0103rie. Care se a\u0219teapt\u0103 s\u0103 fie mai frecvent\u0103 \u00een popula\u021bie \u0219i de ce?", "opts": ["Cea din copil\u0103rie: e diagnosticat\u0103 mai u\u0219or", "Cea din copil\u0103rie: apare des prin muta\u021bii noi", "Au aceea\u0219i frecven\u021b\u0103: am\u00e2ndou\u0103 sunt dominante", "Cea tardiv\u0103: purt\u0103torii se reproduc \u00eenainte"], "correct": 3, "explain": "Bolile cu debut tardiv scap\u0103 selec\u021biei naturale: purt\u0103torii se reproduc \u00eenainte s\u0103 se \u00eemboln\u0103veasc\u0103, deci transmit gena (coreea Huntington). Boala letal\u0103 din copil\u0103rie elimin\u0103 purt\u0103torii \u00eenainte de reproducere; muta\u021biile noi o fac s\u0103 reapar\u0103, dar nu o fac mai frecvent\u0103.", "tag": "Bolile cu debut tardiv"}, {"q": "\u00cen 1960, un nou-n\u0103scut are membrele foarte scurte, prinse aproape direct de trunchi; mama luase la \u00eenceputul sarcinii un medicament contra gre\u021burilor. Ce se a\u0219teapt\u0103 la copiii lui, peste ani?", "opts": ["Jum\u0103tate dintre copii cu anomalie, ca la o boal\u0103 dominant\u0103", "Copii f\u0103r\u0103 anomalie, fiindc\u0103 ea nu e ereditar\u0103", "Un sfert dintre copii cu anomalie, ca la o boal\u0103 recesiv\u0103", "Copii cu anomalie doar dac\u0103 partenera \u00eei e rud\u0103"], "correct": 1, "explain": "Talidomida, un teratogen, a produs anomalii ca \u00een focomelie: o fenocopie, adic\u0103 o modificare de mediu care imit\u0103 o boal\u0103 genetic\u0103. Fenocopiile nu se transmit, de\u0219i clinic nu se deosebesc de boala imitat\u0103; riscurile de 50% sau 25% ar presupune o muta\u021bie.", "tag": "Fenocopiile"}, {"q": "Doi p\u0103rin\u021bi s\u0103n\u0103to\u0219i au un copil cu galactozemie (recesiv\u0103 autozomal\u0103). Fratele s\u0103n\u0103tos al copilului vrea s\u0103 \u0219tie ce probabilitate are s\u0103 fie purt\u0103tor. Ce \u00eei r\u0103spunde geneticianul?", "opts": ["2/3", "1/2", "1/4", "3/4"], "correct": 0, "explain": "Copilul bolnav e mm, deci p\u0103rin\u021bii sunt Nm. Copiii lor sunt \u00bc NN, \u00bd Nm, \u00bc mm; \u0219tiind c\u0103 fratele e s\u0103n\u0103tos, r\u0103m\u00e2n NN \u0219i Nm \u00een raport 1 : 2, deci 2/3 purt\u0103tor. 1/2 e propor\u021bia Nm din to\u021bi copiii, 1/4 riscul de boal\u0103, 3/4 \u0219ansa de a fi s\u0103n\u0103tos.", "tag": "\u00cencruci\u0219area purt\u0103tor \u00d7 purt\u0103tor"}, {"q": "Un cuplu de purt\u0103tori s\u0103n\u0103to\u0219i ai bolii Tay-Sachs are deja trei copii afecta\u021bi \u0219i crede c\u0103, dup\u0103 at\u00e2tea cazuri, urm\u0103torul copil va fi sigur s\u0103n\u0103tos. Ce le spune geneticianul?", "opts": ["Riscul r\u0103m\u00e2ne 1/4 \u0219i la sarcina urm\u0103toare", "Riscul a sc\u0103zut, cazurile s-au \u201econsumat\u201d", "Riscul a crescut la 1/2, dup\u0103 trei cazuri", "Riscul e 3/4, c\u00e2t propor\u021bia de copii s\u0103n\u0103to\u0219i"], "correct": 0, "explain": "Fiecare sarcin\u0103 e independent\u0103: riscul genetic r\u0103m\u00e2ne acela\u0219i, indiferent c\u00e2\u021bi copii afecta\u021bi s-au n\u0103scut deja. Ideea c\u0103 riscul se \u201econsum\u0103\u201d sau cre\u0219te dup\u0103 cazuri anterioare e o eroare de ra\u021bionament; 3/4 e probabilitatea unui copil s\u0103n\u0103tos.", "tag": "Riscul de recuren\u021b\u0103"}, {"q": "O boal\u0103 recesiv\u0103 rar\u0103 apare la un copil ai c\u0103rui p\u0103rin\u021bi, s\u0103n\u0103to\u0219i, sunt veri primari; nimeni din familie nu a mai avut boala. Ce rol a avut \u00eenrudirea p\u0103rin\u021bilor?", "opts": ["A produs muta\u021bia, fiindc\u0103 rudele au gene prea asem\u0103n\u0103toare", "Nu a avut rol: bolile recesive rare apar prin muta\u021bii noi", "A crescut \u0219ansa ca ambii s\u0103 poarte aceea\u0219i muta\u021bie de la bunic", "A transformat o alel\u0103 recesiv\u0103 \u00eentr-una dominant\u0103 la copil"], "correct": 2, "explain": "Consangvinitatea m\u0103re\u0219te probabilitatea ca doi heterozigo\u021bi pentru aceea\u0219i gen\u0103 s\u0103 se \u00eent\u00e2lneasc\u0103, fiindc\u0103 au primit-o de la un str\u0103mo\u0219 comun; a\u0219a apar homozigo\u021bii afecta\u021bi. \u00cenrudirea nu creeaz\u0103 muta\u021bii \u0219i nu schimb\u0103 dominan\u021ba; o boal\u0103 recesiv\u0103 poate trece t\u0103cut prin purt\u0103tori multe genera\u021bii.", "tag": "Consangvinitatea"}, {"q": "\u00cen familiile regale europene din secolul al XIX-lea, hemofilia a fost mult mai frecvent\u0103 dec\u00e2t \u00een popula\u021bia general\u0103 (1/10 000), de\u0219i bolnavii erau aproape numai b\u0103rba\u021bi. Ce explica\u021bie se potrive\u0219te?", "opts": ["B\u0103rba\u021bii bolnavi au transmis boala fiilor, din genera\u021bie \u00een genera\u021bie", "Boala era o fenocopie produs\u0103 de modul de via\u021b\u0103 al acestor familii", "Alela hemofiliei a devenit dominant\u0103 \u00een aceste familii \u00eenrudite", "C\u0103s\u0103toriile \u00eentre rude au r\u0103sp\u00e2ndit un X mutant, purtat de femei"], "correct": 3, "explain": "Hemofilia e recesiv\u0103 legat\u0103 de X: femeile purt\u0103toare o transmit fiilor, iar c\u0103s\u0103toriile repetate \u00eentre familiile regale au r\u0103sp\u00e2ndit X-ul mutant (risc de 50% pentru fiecare fiu al unei purt\u0103toare). Tat\u0103l nu-\u0219i transmite X-ul fiului, o fenocopie nu s-ar mo\u0219teni, iar dominan\u021ba nu se schimb\u0103 prin \u00eenrudire.", "tag": "Transmiterea recesiv\u0103 legat\u0103 de X"}, {"q": "Un b\u0103rbat cu un defect al smal\u021bului dentar \u0219i o femeie normal\u0103 au opt copii: cele cinci fete au defectul, cei trei b\u0103ie\u021bi nu. Ce model de transmitere sugereaz\u0103 familia?", "opts": ["Recesiv legat de X", "Holandric, legat de Y", "Dominant legat de X", "Influen\u021bat de sex, autozomal"], "correct": 2, "explain": "Tat\u0103l afectat transmite X-ul tuturor fiicelor \u0219i Y-ul tuturor fiilor: dac\u0103 gena e dominant\u0103 pe X, toate fetele sunt afectate \u0219i niciun b\u0103iat (amelogeneza imperfect\u0103). Recesiv pe X, fetele ar fi doar purt\u0103toare; holandric, ar fi afecta\u021bi b\u0103ie\u021bii; o gen\u0103 autozomal\u0103 n-ar separa at\u00e2t de net sexele.", "tag": "Transmiterea dominant\u0103 legat\u0103 de X"}, {"q": "\u00centr-un pedigree, o boal\u0103 rar\u0103 apare \u00een trei genera\u021bii la r\u00e2nd, la b\u0103rba\u021bi \u0219i la femei, iar un tat\u0103 bolnav are un fiu bolnav. Ce model de transmitere e cel mai probabil?", "opts": ["Recesiv legat de X", "Dominant legat de X", "Dominant autozomal", "Recesiv autozomal"], "correct": 2, "explain": "Continuitatea pe vertical\u0103 \u0219i ambele sexe afectate indic\u0103 dominan\u021ba autozomal\u0103, iar transmiterea de la tat\u0103 la fiu exclude o gen\u0103 de pe X (fiul prime\u0219te de la tat\u0103 Y). O boal\u0103 recesiv\u0103 rar\u0103 nu ar ap\u0103rea \u00een trei genera\u021bii la r\u00e2nd.", "tag": "Criteriile transmiterii dominante"}, {"q": "\u00centr-o familie cu o gen\u0103 dominant\u0103 pentru degete permanent flexate, unii purt\u0103tori au un deget afectat, al\u021bii patru, iar un purt\u0103tor sigur (are copii afecta\u021bi) nu are niciun deget afectat. Ce arat\u0103 familia?", "opts": ["Penetran\u021b\u0103 incomplet\u0103 \u0219i expresivitate variabil\u0103", "Expresivitate variabil\u0103, f\u0103r\u0103 penetran\u021b\u0103 incomplet\u0103", "Penetran\u021b\u0103 incomplet\u0103, f\u0103r\u0103 expresivitate variabil\u0103", "Heterogenitate genetic\u0103, nu una dintre acestea"], "correct": 0, "explain": "Camptodactilia: purt\u0103torul f\u0103r\u0103 degete afectate arat\u0103 penetran\u021ba incomplet\u0103, iar num\u0103rul diferit de degete afectate la ceilal\u021bi arat\u0103 expresivitatea variabil\u0103. Cele dou\u0103 fenomene pot coexista la aceea\u0219i gen\u0103; heterogenitatea ar cere gene diferite, dar aici e o singur\u0103 gen\u0103 \u00een familie.", "tag": "Expresivitatea variabil\u0103"}]}]}, {"nr": 4, "titlu": "Bazele cromozomiale ale eredit\u0103\u021bii. Cromozomii umani: morfologie, structur\u0103, func\u021bie", "harta": {"centru": "Bazele cromozomiale ale eredit\u0103\u021bii: cromozomii umani", "ramuri": [{"titlu": "Citogenetica \u0219i teoria cromozomial\u0103", "noduri": [{"t": "Cromozomii", "d": "Depozitarii \u0219i vehiculele genelor, de la o celul\u0103 la alta \u0219i de la p\u0103rin\u021bi la copii. Morfologia lor e constant\u0103 \u00een specie, similar\u0103 la toate rasele; se v\u0103d doar \u00een diviziune."}, {"t": "Teoria cromozomial\u0103", "d": "Thomas Morgan: cromozomii sunt baza material\u0103 a eredit\u0103\u021bii. Teze: gene a\u0219ezate liniar, linkage, crossing-over, segregarea cromozomilor explic\u0103 segregarea genelor. Confirm\u0103 legile lui Mendel."}, {"t": "Linkage", "d": "Genele de pe acela\u0219i cromozom se transmit \u00eenl\u0103n\u021buit, \u00een bloc (grup\u0103 de linkage): \u00een diviziune, cromozomul se comport\u0103 ca o unitate."}, {"t": "Crossing-over", "d": "Schimb de fragmente \u00eentre cromozomii omologi \u00een meioz\u0103: genele trec pe cromozomul opus \u0219i apar game\u021bi recombina\u021bi."}, {"t": "Drosophila \u0219i cromozomii gigan\u021bi", "d": "Musculi\u021ba de o\u021bet: 4 perechi de cromozomi, prolific\u0103; larvele au cromozomi de 150 de ori mai lungi, cu benzi. Muta\u021biile se vedeau ca schimb\u0103ri de benzi: primele gene localizate."}, {"t": "Muta\u021bia \u0219i mutageneza", "d": "Muta\u021bia: orice modificare ereditar\u0103 a informa\u021biei genetice; mutageneza: procesul care le produce. Morgan le-a indus prin raze X. La om, benzile se ob\u021bin prin colora\u021bii speciale."}]}, {"titlu": "Mitoza \u0219i meioza", "noduri": [{"t": "Axioma lui Virchow", "d": "\u201eOmnis cellula e cellula\u201d: celulele noi provin prin diviziunea celor existente. Cromozomii apar, ca filamente, \u00een momentul diviziunii."}, {"t": "Meioza", "d": "Diviziunea care formeaz\u0103 game\u021bii, cu num\u0103r haploid (n = 23): fiecare nucleu prime\u0219te c\u00e2te un membru din fiecare pereche de omologi."}, {"t": "Recombinarea genetic\u0103", "d": "Meioza produce variabilitate prin crossing-over \u0219i prin combinarea \u00eent\u00e2mpl\u0103toare a setului matern cu cel patern; fecunda\u021bia adaug\u0103 combinarea game\u021bilor."}, {"t": "Mitoza", "d": "Diviziunea celulelor somatice: dou\u0103 celule-fiice identice cu celula-mam\u0103, cu acela\u0219i num\u0103r diploid (2n = 46). P\u0103streaz\u0103 intacte num\u0103rul \u0219i con\u021binutul cromozomial."}]}, {"titlu": "Ciclul celular", "noduri": [{"t": "Interfaza (G1, S, G2)", "d": "Perioada de activitate dintre diviziuni: G1 \u0219i G2 sunt faze de \u201egol\u201d metabolic, iar \u00een faza S, la mijloc, ADN-ul se duplic\u0103. Cromozomii nu se v\u0103d."}, {"t": "Mitoza \u00een ciclul celular", "d": "Compartimentul distributiv: nucleul \u0219i citoplasma se \u00eempart, iar ADN-ul dublat ajunge egal \u00een celulele-fiice. Dureaz\u0103 circa o or\u0103 din cele circa 24 ale ciclului."}, {"t": "Punctele de control \u0219i apoptoza", "d": "Opresc intrarea \u00een mitoz\u0103 a unei celule cu rupturi cromozomiale nereparate; dac\u0103 leziunea nu se poate repara, celula se sinucide (apoptoza, moartea programat\u0103)."}, {"t": "Inhibi\u021bia de contact", "d": "Celulele normale \u00ee\u0219i limiteaz\u0103 reciproc diviziunile la contact; celulele canceroase se divid \u0219i cresc f\u0103r\u0103 restric\u021bii."}, {"t": "Radia\u021biile \u0219i diviziunea", "d": "Dup\u0103 doz\u0103: omoar\u0103 celula, rup ADN-ul \u0219i blocheaz\u0103 diviziunea sau produc muta\u021bii transmise celulelor-fiice (cancere). Sensibilitate maxim\u0103 chiar \u00eenainte de mitoz\u0103, de unde radioterapia."}, {"t": "Categoriile de celule", "d": "Oprite \u00een G1 dup\u0103 na\u0219tere: neuronii, celulele musculare. Diviziune redus\u0103, posibil\u0103 \u00een anumite condi\u021bii: hepatocitele, glandele endocrine. Rapid\u0103: m\u0103duva osoas\u0103, epidermul, mucoasa intestinal\u0103."}], "figuri": [{"titlu": "Ciclul celular cu punctele de control", "nota": "Redesenat dup\u0103 manual; propor\u021biile fazelor din interfaz\u0103 sunt ilustrative (manualul d\u0103 doar mitoza, \u2248 1 or\u0103 din \u2248 24).", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 370 300\" role=\"img\" aria-label=\"Ciclul celular: G1, S (duplicarea ADN), G2 formeaz\u0103 interfaza, de circa 23 de ore; mitoza dureaz\u0103 circa o or\u0103; punctele de control opresc celulele cu leziuni\" font-family=\"Georgia, serif\" font-size=\"13\"><path d=\"M187.0,42.0 A78,78 0 0,1 232.4,181.9\" fill=\"none\" stroke=\"#2a78d6\" stroke-width=\"24\"/><text x=\"259.2\" y=\"100.4\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"12.0\" font-weight=\"bold\">G1</text><path d=\"M229.2,184.2 A78,78 0 0,1 111.4,146.0\" fill=\"none\" stroke=\"#1baf7a\" stroke-width=\"24\"/><text x=\"160.9\" y=\"198.7\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"12.0\" font-weight=\"bold\">S</text><path d=\"M110.2,142.2 A78,78 0 0,1 154.5,48.2\" fill=\"none\" stroke=\"#eb6834\" stroke-width=\"24\"/><text x=\"114.4\" y=\"91.3\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"12.0\" font-weight=\"bold\">G2</text><path d=\"M158.1,46.8 A78,78 0 0,1 183.0,42.0\" fill=\"none\" stroke=\"#b5453a\" stroke-width=\"24\"/><text x=\"170.4\" y=\"47.9\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"12.0\" font-weight=\"bold\">M</text><line x1=\"220.9\" y1=\"169.4\" x2=\"240.8\" y2=\"196.9\" stroke=\"#2c2a26\" stroke-width=\"2.4\"/><line x1=\"162.5\" y1=\"63.3\" x2=\"150.0\" y2=\"31.7\" stroke=\"#2c2a26\" stroke-width=\"2.4\"/><line x1=\"175.5\" y1=\"59.8\" x2=\"170.1\" y2=\"26.2\" stroke=\"#2c2a26\" stroke-width=\"2.4\"/><text x=\"185.0\" y=\"112.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"12.0\" font-weight=\"bold\">interfaza</text><text x=\"185.0\" y=\"128.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.8\">\u2248 23 de ore</text><text x=\"185.0\" y=\"144.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">(G1 + S + G2)</text><text x=\"291.7\" y=\"86.6\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.2\">G1: cre\u0219tere,</text><text x=\"291.7\" y=\"99.6\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.2\">gol metabolic</text><text x=\"145.6\" y=\"232.7\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.2\">S: duplicarea ADN</text><text x=\"88.9\" y=\"75.7\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.2\">G2: preg\u0103tirea</text><text x=\"88.9\" y=\"88.7\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.2\">diviziunii</text><text x=\"162.3\" y=\"15.8\" text-anchor=\"end\" fill=\"#b5453a\" font-size=\"10.2\">M: mitoza \u2248 1 or\u0103</text><line x1=\"10.0\" y1=\"256.0\" x2=\"24.0\" y2=\"256.0\" stroke=\"#2c2a26\" stroke-width=\"2.4\"/><text x=\"30.0\" y=\"260.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.2\">punct de control: o leziune nereparat\u0103 opre\u0219te celula</text><text x=\"30.0\" y=\"273.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.2\">\u00eenainte de mitoz\u0103 (sau o duce la apoptoz\u0103)</text><text x=\"10.0\" y=\"292.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.2\">Neuronii \u0219i celulele musculare r\u0103m\u00e2n oprite \u00een G1.</text></svg>"}]}, {"titlu": "Morfologia cromozomului", "lat": true, "noduri": [{"t": "Cromatidele", "d": "La \u00eenceputul diviziunii, cromozomul e dedublat \u00een dou\u0103 cromatide identice ca m\u0103rime, form\u0103 \u0219i informa\u021bie, libere pe lungime, unite doar la centromer."}, {"t": "Centromerul", "d": "Constric\u021bia primar\u0103: punctul de fixare pe fusul de diviziune. Prin divizarea lui, fiecare celul\u0103-fiic\u0103 prime\u0219te c\u00e2te o cromatid\u0103."}, {"t": "Telomerele", "d": "Capetele cromatidelor: dau stabilitate cromozomului \u0219i \u00eempiedic\u0103 asocierea lui cu al\u021bi cromozomi."}, {"t": "Bra\u021bele p \u0219i q", "d": "Centromerul \u00eemparte cromozomul \u00een bra\u021bul p (scurt, \u201epetit\u201d), desenat deasupra, \u0219i bra\u021bul q (lung)."}, {"t": "Tipurile morfologice", "d": "Dup\u0103 pozi\u021bia centromerului: metacentric (median), submetacentric, subtelocentric, acrocentric (aproape terminal), telocentric (terminal, inexistent la om)."}], "figuri": [{"titlu": "P\u0103r\u021bile cromozomului metafazic", "nota": "Redesenat dup\u0103 manual.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 246\" role=\"img\" aria-label=\"Cromozomul metafazic: dou\u0103 cromatide identice unite la centromer, bra\u021bul scurt p deasupra, bra\u021bul lung q dedesubt, telomere la capete\" font-family=\"Georgia, serif\" font-size=\"13\"><rect x=\"96.0\" y=\"20.0\" width=\"22\" height=\"65.2\" rx=\"11.0\" fill=\"#2a78d6\"/><rect x=\"96.0\" y=\"89.2\" width=\"22\" height=\"140.8\" rx=\"11.0\" fill=\"#2a78d6\"/><rect x=\"122.0\" y=\"20.0\" width=\"22\" height=\"65.2\" rx=\"11.0\" fill=\"#2a78d6\"/><rect x=\"122.0\" y=\"89.2\" width=\"22\" height=\"140.8\" rx=\"11.0\" fill=\"#2a78d6\"/><circle cx=\"120.0\" cy=\"87.2\" r=\"5\" fill=\"#2c2a26\"/><rect x=\"94.0\" y=\"20.0\" width=\"22\" height=\"8\" rx=\"4\" fill=\"#eb6834\"/><rect x=\"122.0\" y=\"20.0\" width=\"22\" height=\"8\" rx=\"4\" fill=\"#eb6834\"/><rect x=\"94.0\" y=\"222.0\" width=\"22\" height=\"8\" rx=\"4\" fill=\"#eb6834\"/><rect x=\"122.0\" y=\"222.0\" width=\"22\" height=\"8\" rx=\"4\" fill=\"#eb6834\"/><line x1=\"146.0\" y1=\"24.0\" x2=\"172.0\" y2=\"24.0\" stroke=\"#6b6760\" stroke-width=\"1\"/><text x=\"176.0\" y=\"28.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.2\">telomer\u0103 (cap\u0103tul cromatidei)</text><line x1=\"146.0\" y1=\"53.6\" x2=\"172.0\" y2=\"53.6\" stroke=\"#6b6760\" stroke-width=\"1\"/><text x=\"176.0\" y=\"57.6\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.2\">bra\u021bul p (scurt, deasupra)</text><line x1=\"126.0\" y1=\"87.2\" x2=\"172.0\" y2=\"87.2\" stroke=\"#6b6760\" stroke-width=\"1\"/><text x=\"176.0\" y=\"91.2\"  \u0219oarece e tot pe X la c\u00e2ine \u0219i la om (hemofilia)."}, {"t": "Hemizigo\u021bia \u0219i femeile purt\u0103toare", "d": "B\u0103rbatul, cu un singur X, manifest\u0103 orice muta\u021bie recesiv\u0103 de pe X; la femeia heterozigot\u0103 (purt\u0103toare, conductoare), alela dominant\u0103 o mascheaz\u0103."}, {"t": "Compensarea dozajului genic", "d": "Femeile ar trebui s\u0103 produc\u0103 dublu proteinele genelor de pe X, dar doz\u0103rile enzimatice arat\u0103 valori egale cu ale b\u0103rba\u021bilor: un mecanism egalizeaz\u0103 sinteza."}, {"t": "Lyonizarea", "d": "Mary Lyon: femeia p\u0103streaz\u0103 un singur X activ, ceilal\u021bi se condenseaz\u0103. \u00cencepe \u00een embrionul de 3000\u20134000 de celule (zilele 16\u201318), e \u00eent\u00e2mpl\u0103toare \u0219i se p\u0103streaz\u0103 \u00een celulele-fiice."}, {"t": "Corpusculul Barr", "d": "X-ul inactivat, v\u0103zut \u00een nucleul interfazic ca un corpuscul intens colorat l\u00e2ng\u0103 membrana nuclear\u0103 (cromatina de sex X); st\u0103 la baza testului Barr al sexului genetic. Interpretare: num\u0103rul lor = num\u0103rul de X minus unu."}, {"t": "Femeile ca mozaic", "d": "Femeia e un mozaic de clone cu X matern sau patern activ. F\u0103r\u0103 importan\u021b\u0103 dac\u0103 X-urile sunt normale; la o purt\u0103toare (hemofilie), dac\u0103 domin\u0103 celulele cu X-ul mutant activ, apar simptome."}, {"t": "Reglajul genetic", "d": "Genele X-ului inactivat exist\u0103, dar nu func\u021bioneaz\u0103: nu genele singure fac \u201esimfonia vie\u021bii\u201d, ci dirijarea \u201eorchestrei genetice\u201d prin reglarea activit\u0103\u021bii lor."}], "figuri": [{"titlu": "Lyonizarea: inactivarea \u00eent\u00e2mpl\u0103toare a unui X", "nota": "Schem\u0103 ilustrativ\u0103. X mat. = cromozomul X primit de la mam\u0103, X pat. = de la tat\u0103; punctul mic = X-ul inactivat (corpusculul Barr).", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 364 172\" role=\"img\" aria-label=\"L "middle\" fill=\"#6b6760\" font-size=\"10.2\">mozaic de clone:</text><text x=\"312.0\" y=\"123.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">modelul se p\u0103streaz\u0103</text><text x=\"312.0\" y=\"136.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">\u00een celulele-fiice</text><rect x=\"14.0\" y=\"156.0\" width=\"10.0\" height=\"10.0\" fill=\"#2a78d6\"></rect><text x=\"28.0\" y=\"165.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">activ X matern</text><rect x=\"128.8\" y=\"156.0\" width=\"10.0\" height=\"10.0\" fill=\"#eb6834\"></rect><text x=\"142.8\" y=\"165.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">activ X patern</text></svg>"}]}]}, "sectiuni": [], "runde": [{"id": "1", "eticheta": "Runda 1 \u00b7 Baz\u0103", "titlu": "Runda 1 \u2014 Concepte de baz\u0103", "desc": "Teorie: teoria cromozomial\u0103, diviziunea \u0219i ciclul celular, morfologia cromozomilor, cariotipul \u0219i inactivarea X, \u00een \u00eentreb\u0103ri directe.", "intrebari": [{"q": "Cum explic\u0103 teoria cromozomial\u0103 segregarea caracterelor mendeliene?", "opts": ["Prin amestecul s\u00e2ngelui celor doi p\u0103rin\u021bi", "Prin muta\u021biile noi ap\u0103rute \u00een fiecare genera\u021bie de urma\u0219i", "Prin separarea cromozomilor \u00een timpul diviziunii", "Prin inactivarea unui cromozom la fiecare sex"], "correct": 2, "explain": "Morgan arat\u0103 c\u0103 genele stau pe cromozomi, iar segregarea cromozomilor \u00een diviziune explic\u0103 segregarea genelor, ca \u00een Cap. 2 (Ereditatea mendelian\u0103: legile lui Mendel). Amestecul s\u00e2ngelui e teoria respins\u0103 de Mendel; muta\u021biile sunt rare \u0219i neregulate; inactivarea unui X prive\u0219te doar compensarea dozei la femeie.", "tag": "Teoria cromozomial\u0103"}, {"q": "Ce se \u00eent\u00e2mpl\u0103, prin linkage, cu dou\u0103 gene aflate pe acela\u0219i cromozom?", "opts": ["Se asorteaz\u0103 independent, ca \u00een legea a II-a", "Tind s\u0103 se transmit\u0103 \u00eempreun\u0103, \u00een bloc", "Se exprim\u0103 numai la indivizii heterozigo\u021bi", "Se inactiveaz\u0103 una pe alta \u00een celulele-fiice"], "correct": 1, "explain": "\u00cen diviziune cromozomul se comport\u0103 ca o unitate, deci genele de pe el se transmit \u00eenl\u0103n\u021buit (grup\u0103 de linkage). Asortarea independent\u0103 din legea a II-a, din Cap. 2 (Ereditatea mendelian\u0103: legile lui Mendel), e valabil\u0103 pentru genele de pe cromozomi diferi\u021bi; expresia sau inactivarea genelor nu \u021bin de linkage.", "tag": "Linkage"}, {"q": "Ce efect are crossing-over-ul asupra game\u021bilor?", "opts": ["Produce game\u021bi recombina\u021bi, cu gene trecute pe omologul opus", "\u00cenjum\u0103t\u0103\u021be\u0219te num\u0103rul de cromozomi din fiecare gamet", "Dubleaz\u0103 cantitatea de ADN din nucleu \u00eenaintea diviziunii celulei", "D\u0103 fiec\u0103rei celule-fiice c\u00e2te o cromatid\u0103 identic\u0103"], "correct": 0, "explain": "Crossing-over-ul e schimbul de fragmente \u00eentre cromozomii omologi \u00een meioz\u0103: genele trec pe cromozomul opus \u0219i apar game\u021bi recombina\u021bi. \u00cenjum\u0103t\u0103\u021birea num\u0103rului \u021bine de meioz\u0103 \u00een ansamblu, dublarea ADN-ului de faza S, iar repartizarea cromatidelor de mitoz\u0103.", "tag": "Crossing-over"}, {"q": "Ce avantaj i-au oferit lui Morgan larvele de Drosophila pentru localizarea genelor?", "opts": ["Cromozomi identici ca form\u0103 cu cromozomii umani", "Cromozomi gigantici, cu benzi vizibile \u00een mod natural", "Cromozomi care r\u0103m\u00e2n vizibili \u0219i \u00een perioada dintre diviziuni", "Un singur cromozom, f\u0103r\u0103 pereche de omologi"], "correct": 1, "explain": "Glandele salivare ale larvelor au cromozomi de 150 de ori mai lungi, cu benzi; o muta\u021bie indus\u0103 cu raze X se vedea ca o schimbare a modelului de benzi, deci gena putea fi localizat\u0103. Musculi\u021ba are patru perechi de cromozomi, diferi\u021bi de cei umani; la om benzile s-au ob\u021binut abia prin colora\u021bii speciale.", "tag": "Drosophila \u0219i cromozomii gigan\u021bi"}, {"q": "Pe ce c\u0103i produce meioza variabilitate genetic\u0103?", "opts": ["Crossing-over \u0219i asortarea cromozomilor materni \u0219i paterni", "Replicarea ADN-ului \u00een faza S \u0219i inhibi\u021bia de contact \u00eentre celule", "Condensarea cromatinei \u0219i inactivarea unui cromozom X", "Muta\u021biile din faza S \u0219i moartea programat\u0103 a celulelor"], "correct": 0, "explain": "Meioza recombin\u0103 genele prin crossing-over (schimb \u00eentre omologi) \u0219i prin combinarea \u00eent\u00e2mpl\u0103toare a setului matern cu cel patern; fecunda\u021bia adaug\u0103 combinarea game\u021bilor. Replicarea, inhibi\u021bia de contact \u0219i apoptoza \u021bin de ciclul celular, iar inactivarea unui X de compensarea dozei.", "tag": "Recombinarea genetic\u0103"}, {"q": "Ce asigur\u0103 mitoza \u00een celulele somatice?", "opts": ["Reducerea la jum\u0103tate a num\u0103rului de cromozomi", "Recombinarea genelor materne cu cele paterne \u00een celule", "Inactivarea cromozomilor X afla\u021bi \u00een plus", "P\u0103strarea num\u0103rului \u0219i a con\u021binutului cromozomial"], "correct": 3, "explain": "Mitoza d\u0103 dou\u0103 celule-fiice identice cu celula-mam\u0103, cu acela\u0219i num\u0103r diploid (2n = 46). Reducerea la n = 23 \u0219i recombinarea sunt rolurile meiozei; inactivarea X-urilor suplimentare e lyonizarea, alt mecanism.", "tag": "Mitoza"}, {"q": "De ce nu se v\u0103d cromozomii la microscop \u00een interfaz\u0103?", "opts": ["Sunt degrada\u021bi \u0219i ref\u0103cu\u021bi la fiecare diviziune", "Ies din nucleu \u0219i se \u00eempr\u0103\u0219tie \u00een toat\u0103 citoplasma celulei", "Se unesc temporar \u00eentr-un singur cromozom gigant", "Materialul lor e decondensat, sub form\u0103 de cromatin\u0103"], "correct": 3, "explain": "\u00cen interfaz\u0103 materialul cromozomial e despiralizat, ca un ghem de cromatin\u0103 (ADN, ARN, histone), deci nu se distinge; se condenseaz\u0103 \u0219i devine vizibil doar \u00een diviziune. Cromozomii nu se distrug, nu p\u0103r\u0103sesc nucleul \u0219i nu se unesc \u00eentre ei.", "tag": "Cromatina"}, {"q": "Ce se \u00eent\u00e2mpl\u0103 cu o celul\u0103 a c\u0103rei leziune cromozomial\u0103 nu poate fi reparat\u0103?", "opts": ["E oprit\u0103 \u00eenaintea mitozei \u0219i moare prin apoptoz\u0103", "Intr\u0103 \u00een mitoz\u0103, iar leziunea se dilueaz\u0103 \u00een celulele-fiice", "Trece \u00een meioz\u0103 \u0219i devine un gamet haploid", "Sare peste faza S \u0219i r\u0103m\u00e2ne f\u0103r\u0103 replicare"], "correct": 0, "explain": "Punctele de control ale ciclului celular \u00eempiedic\u0103 o celul\u0103 cu rupturi nereparate s\u0103 intre \u00een mitoz\u0103; dac\u0103 leziunea nu se poate repara, celula comite suicid (apoptoza, moartea programat\u0103). Leziunile nu se dilueaz\u0103 prin diviziune, iar celulele somatice nu trec \u00een meioz\u0103.", "tag": "Punctele de control \u0219i apoptoza"}, {"q": "Ce rol are centromerul \u00een timpul mitozei?", "opts": ["Protejeaz\u0103 capetele cromatidelor de asocieri cu al\u021bi cromozomi", "\u00cenf\u0103\u0219oar\u0103 ADN-ul \u00een jurul histonelor, ca un \u0219irag de m\u0103rgele", "Separ\u0103 cromozomii omologi \u0219i reduce num\u0103rul la jum\u0103tate", "Fixeaz\u0103 cromozomul pe fus, care d\u0103 fiec\u0103rei celule o cromatid\u0103"], "correct": 3, "explain": "Centromerul (constric\u021bia primar\u0103) e punctul prin care cromozomul se prinde de fibrele fusului; prin divizarea lui, fiecare celul\u0103-fiic\u0103 prime\u0219te c\u00e2te o cromatid\u0103. Protec\u021bia capetelor e rolul telomerelor, \u00eenf\u0103\u0219urarea \u00een jurul histonelor formeaz\u0103 nucleosomii, iar separarea omologilor e specific\u0103 meiozei.", "tag": "Centromerul"}, {"q": "Prin ce se deosebe\u0219te un cromozom acrocentric de unul metacentric?", "opts": ["Are trei cromatide \u00een loc de dou\u0103", "Are centromerul aproape terminal, nu median", "Nu are telomere la cap\u0103tul bra\u021belor", "Are bra\u021bul p mai lung dec\u00e2t bra\u021bul q"], "correct": 1, "explain": "Tipul morfologic depinde de pozi\u021bia centromerului: median la metacentric, aproape terminal la acrocentric (bra\u021bul p foarte scurt). To\u021bi cromozomii metafazici au dou\u0103 cromatide \u0219i telomere, iar p e prin conven\u021bie bra\u021bul scurt.", "tag": "Tipurile morfologice"}, {"q": "Ce indic\u0103 litera p \u00eentr-o descriere a cromozomului?", "opts": ["Bra\u021bul lung, aflat dedesubtul centromerului", "Cromozomul pereche mo\u0219tenit de la tat\u0103", "Bra\u021bul scurt, de deasupra centromerului", "Perechea cromozomilor de sex, X sau Y"], "correct": 2, "explain": "p vine de la \u201epetit\u201d (mic): bra\u021bul scurt, desenat prin conven\u021bie deasupra centromerului; bra\u021bul lung e q, urm\u0103toarea liter\u0103 din alfabet. Litera nu are leg\u0103tur\u0103 cu originea patern\u0103, de\u0219i ideea e tentant\u0103.", "tag": "Bra\u021bele p \u0219i q"}, {"q": "Cum \u00eencape o molecul\u0103 de ADN de circa 5 cm \u00eentr-o cromatid\u0103 de circa 5 \u00b5m?", "opts": ["Prin t\u0103ierea ADN-ului \u00een fragmente foarte scurte", "Prin \u00eempachet\u0103ri \u0219i spiraliz\u0103ri succesive ale fibrei", "Prin eliminarea secven\u021belor care nu codific\u0103", "Prin \u00eemperecherea str\u00e2ns\u0103 cu cromozomul omolog"], "correct": 1, "explain": "Fibra de ADN se \u00eenf\u0103\u0219oar\u0103 \u00een jurul nucleosomilor (1 : 6), formeaz\u0103 fibra de 30 nm (1 : 36), se spiralizeaz\u0103 ca solenoid \u0219i apoi \u00een cromozomul metafazic (peste 1 : 10 000). ADN-ul r\u0103m\u00e2ne o molecul\u0103 \u00eentreag\u0103, cu toate secven\u021bele, iar omologii nu se \u00eemperecheaz\u0103 \u00een mitoz\u0103.", "tag": "Nivelurile de \u00eempachetare"}, {"q": "Dup\u0103 ce criterii se ordoneaz\u0103 cromozomii \u00eentr-un cariotip?", "opts": ["Lungimea, pozi\u021bia centromerului \u0219i modelul de benzi", "Originea matern\u0103 sau patern\u0103 a fiec\u0103ruia", "Num\u0103rul de gene active \u0219i de corpusculi Barr", "Momentul \u00een care se replic\u0103 \u00een faza S"], "correct": 0, "explain": "Cariotipul a\u0219az\u0103 cromozomii \u00een perechi de omologi dup\u0103 criterii morfologice (lungime, centromer, benzi), dup\u0103 un standard interna\u021bional. Originea parental\u0103 nu se vede la microscop, iar corpusculii Barr \u0219i replicarea nu servesc la ordonare.", "tag": "Cariotipul"}, {"q": "Ce observa\u021bie a dus la ideea compens\u0103rii dozajului genic?", "opts": ["B\u0103rba\u021bii au un X, dar nu sufer\u0103 de bolile recesive de pe X", "Femeile au dou\u0103 X, dar sufer\u0103 mai des de bolile de pe X", "Femeile au dou\u0103 X, dar nu produc dublu enzimele de pe X", "Cromozomul Y e mic, dar poart\u0103 mai multe gene dec\u00e2t X"], "correct": 2, "explain": "Ar fi de a\u0219teptat ca proteinele genelor de pe X s\u0103 fie \u00een cantitate dubl\u0103 la femei; doz\u0103rile enzimatice arat\u0103 \u00eens\u0103 valori egale cu ale b\u0103rba\u021bilor, deci un X e inactivat (Mary Lyon). B\u0103rba\u021bii sunt tocmai cei afecta\u021bi de muta\u021biile recesive de pe X, iar Y e mic \u0219i s\u0103rac \u00een gene.", "tag": "Compensarea dozajului genic"}, {"q": "Ce se vede \u00een nucleul interfazic al unei celule feminine \u00een locul cromozomului X inactivat?", "opts": ["Un cromozom gigant, cu benzi vizibile \u00een mod natural", "Un \u0219irag de nucleosomi liber, desf\u0103cut din cromatin\u0103", "Un corpuscul mai intens colorat, lipit de membrana nuclear\u0103", "Un centromer izolat, f\u0103r\u0103 cromatidele lui obi\u0219nuite"], "correct": 2, "explain": "X-ul inactivat se condenseaz\u0103 \u0219i apare ca un corpuscul intens colorat pe fa\u021ba intern\u0103 a membranei nucleare: corpusculul Barr (cromatina de sex X), baza testului Barr al sexului genetic. Cromozomii gigan\u021bi sunt specifici larvelor de Drosophila.", "tag": "Corpusculul Barr"}]}, {"id": "2", "eticheta": "Runda 2 \u00b7 Aplica\u021bii", "titlu": "Runda 2 \u2014 Scenarii \u0219i ra\u021bionament", "desc": "Situa\u021bii cu mai mul\u021bi pa\u0219i: interpretezi observa\u021bii la microscop, calculezi cantit\u0103\u021bi de ADN \u0219i corpusculi Barr, explici fenomene celulare.", "intrebari": [{"q": "Un student \u0219tie c\u0103 genomul unei celule haploide are, \u00eentins, circa 1 m de ADN. C\u00e2\u021bi metri de ADN ar avea, \u00eentin\u0219i, cromozomii dintr-o celul\u0103 a pielii?", "opts": ["Circa 1 m, fiindc\u0103 omologii sunt identici", "Circa 0,5 m, fiindc\u0103 ADN-ul e \u00eempachetat", "Circa 46 m, c\u00e2te un metru de cromozom", "Circa 2 m, fiindc\u0103 celula e diploid\u0103"], "correct": 3, "explain": "Celula somatic\u0103 are dou\u0103 seturi de cromozomi (2n = 46), deci dublul genomului haploid: aproximativ 2 m. Omologii poart\u0103 acelea\u0219i gene, dar sunt molecule distincte; \u00eempachetarea scurteaz\u0103 fibra, nu cantitatea de ADN, iar 1 m e lungimea \u00eentregului set haploid, nu a unui cromozom.", "tag": "Lungimea genomului"}, {"q": "Un cercet\u0103tor urm\u0103re\u0219te dou\u0103 gene la musculi\u021be. Dac\u0103 ar fi pe cromozomi diferi\u021bi, ar a\u0219tepta patru tipuri de game\u021bi \u00een propor\u021bii egale; observ\u0103 \u00eens\u0103 c\u0103 majoritatea game\u021bilor p\u0103streaz\u0103 combina\u021biile p\u0103rin\u021bilor \u0219i doar pu\u021bini sunt recombina\u021bi. Ce explic\u0103 rezultatul?", "opts": ["Genele sunt pe cromozomi diferi\u021bi, dar una dintre ele e dominant\u0103", "Genele sunt pe acela\u0219i cromozom; recombina\u021bii apar prin crossing-over", "Game\u021bii recombina\u021bi provin din muta\u021bii noi ap\u0103rute \u00een meioz\u0103", "Genele sunt pe cromozomi diferi\u021bi, dar unul e inactivat"], "correct": 1, "explain": "Genele \u00eenl\u0103n\u021buite (linkage) se transmit \u00een bloc, deci domin\u0103 combina\u021biile parentale; pu\u021binii game\u021bi recombina\u021bi apar prin schimbul de fragmente \u00eentre omologi. Dominan\u021ba nu schimb\u0103 propor\u021biile game\u021bilor, muta\u021biile ar fi mult prea rare, iar inactivarea prive\u0219te doar un X la femeie.", "tag": "Linkage"}, {"q": "Un radioterapeut trateaz\u0103 o tumor\u0103 ale c\u0103rei celule se divid mult mai repede dec\u00e2t \u021besutul din jur. \u00cen ce moment al ciclului sunt celulele cele mai sensibile la radia\u021bii \u0219i pe care le love\u0219te mai ales tratamentul?", "opts": ["Chiar \u00eenainte de mitoz\u0103; mai ales celulele tumorale", "\u00cen faza G1; mai ales neuronii din vecin\u0103tatea tumorii", "\u00cen faza S; la fel toate celulele din organ", "Dup\u0103 mitoz\u0103; mai ales celulele s\u0103n\u0103toase"], "correct": 0, "explain": "Sensibilitatea maxim\u0103 la radia\u021bii e chiar \u00eenainte de mitoz\u0103, iar celulele care se divid des trec mai des prin acest moment: radia\u021biile blocheaz\u0103 sau ucid mai ales celulele canceroase. Neuronii, opri\u021bi \u00een G1, nu se mai divid, deci nu sunt \u021binta tratamentului.", "tag": "Radia\u021biile \u0219i diviziunea"}, {"q": "Dup\u0103 un accident, un pacient are leziuni ale pielii, ale ficatului \u0219i ale unor neuroni din m\u0103duva spin\u0103rii. Ce \u021besuturi se pot reface prin diviziuni celulare?", "opts": ["Pielea, ficatul \u0219i neuronii, prin mitoz\u0103 obi\u0219nuit\u0103", "Doar neuronii, care a\u0219teapt\u0103 \u00een faza G2 un semnal de diviziune", "Pielea repede, ficatul \u00een anumite condi\u021bii, neuronii nu", "Ficatul \u0219i neuronii repede, pielea foarte lent"], "correct": 2, "explain": "Celulele epidermului se divid rapid, hepatocitele au o capacitate redus\u0103, dar se pot divide \u00een anumite condi\u021bii, iar neuronii \u0219i-au pierdut dup\u0103 na\u0219tere capacitatea de diviziune \u0219i r\u0103m\u00e2n opri\u021bi \u00een G1. Varianta cu G2 inverseaz\u0103 faza, iar cea cu pielea lent\u0103 inverseaz\u0103 categoriile.", "tag": "Categoriile de celule"}, {"q": "Un laborator examineaz\u0103 celule de la trei persoane: un b\u0103rbat 46,XY, o femeie 46,XX \u0219i o femeie cu trei cromozomi X. C\u00e2\u021bi corpusculi Barr se a\u0219teapt\u0103 \u00een nucleele lor?", "opts": ["1, 2 \u0219i 3", "0, 1 \u0219i 2", "0, 2 \u0219i 3", "1, 1 \u0219i 1"], "correct": 1, "explain": "Femeia are nevoie de un singur X activ; ceilal\u021bi se condenseaz\u0103 \u00een corpusculi Barr, deci num\u0103rul lor e num\u0103rul de X minus unu: 0 la XY, 1 la XX, 2 la XXX. A num\u0103ra to\u021bi cromozomii X uit\u0103 c\u0103 unul r\u0103m\u00e2ne activ, iar \u201ec\u00e2te unul la to\u021bi\u201d ignor\u0103 c\u0103 b\u0103rbatul nu are ce inactiva.", "tag": "Corpusculul Barr"}, {"q": "La pisici, o gen\u0103 pentru culoarea portocalie a bl\u0103nii se afl\u0103 pe cromozomul X. Femelele heterozigote au blana \u00een pete portocalii \u0219i negre, masculii o singur\u0103 culoare. Ce explic\u0103 petele?", "opts": ["Expresivitatea variabil\u0103 a unei gene autozomale a culorii", "Inactivarea \u00eent\u00e2mpl\u0103toare a unui X, p\u0103strat\u0103 \u00een celulele-fiice", "Muta\u021bii noi ap\u0103rute separat \u00een fiecare zon\u0103 a pielii", "Dominan\u021ba incomplet\u0103 a alelei pentru culoarea portocalie"], "correct": 1, "explain": "\u00cen embrion fiecare celul\u0103 inactiveaz\u0103 la \u00eent\u00e2mplare X-ul matern sau pe cel patern, iar modelul se transmite celulelor-fiice: femela e un mozaic de clone, cu pete. Expresivitatea variabil\u0103, din Cap. 3 (Modele de transmitere a caracterelor monogenice), ar privi o gen\u0103 autozomal\u0103; dominan\u021ba incomplet\u0103 ar da o culoare intermediar\u0103 uniform\u0103.", "tag": "Lyonizarea"}, {"q": "Un cercet\u0103tor fotografiaz\u0103 la \u00eent\u00e2mplare 240 de celule dintr-o cultur\u0103 al c\u0103rei ciclu celular dureaz\u0103 circa 24 de ore. \u00cen c\u00e2te dintre ele se a\u0219teapt\u0103 s\u0103 vad\u0103 cromozomi?", "opts": ["\u00cen circa 120, jum\u0103tatea aflat\u0103 \u00een diviziune", "\u00cen toate, cromozomii fiind structuri permanente", "\u00cen circa 60, cele aflate \u00een faza S", "\u00cen circa 10, cele aflate \u00een mitoz\u0103"], "correct": 3, "explain": "Cromozomii se v\u0103d doar \u00een mitoz\u0103, care dureaz\u0103 circa o or\u0103 din 24, deci \u00een aproximativ 1/24 din celule: 240 / 24 = 10. \u00cen faza S ADN-ul se dubleaz\u0103, dar e decondensat; cromozomii exist\u0103 mereu, \u00eens\u0103 ca cromatin\u0103 invizibil\u0103 \u00een interfaz\u0103.", "tag": "Mitoza \u00een ciclul celular"}, {"q": "Cariotipul unei persoane arat\u0103 22 de perechi de cromozomi cu modele de benzi identice \u0219i o pereche format\u0103 dintr-un cromozom mare \u0219i unul mic. Ce formul\u0103 cromozomial\u0103 are persoana?", "opts": ["46,XX", "46,XY", "44,XY", "23,XY"], "correct": 1, "explain": "22 de perechi de autozomi \u00eenseamn\u0103 44 de cromozomi, plus perechea inegal\u0103 X (mare) \u0219i Y (mic): 46 \u00een total, la un b\u0103rbat. Formula 44,XY num\u0103r\u0103 doar autozomii ca total, 23 e num\u0103rul haploid al game\u021bilor, iar perechea XX ar fi format\u0103 din doi cromozomi la fel.", "tag": "Formula cromozomial\u0103"}, {"q": "B\u0103rba\u021bii au un singur X; femeile au doi, dar unul e inactivat \u00een fiecare celul\u0103, deci \u0219i ele au un singur X func\u021bional per celul\u0103. De ce femeile purt\u0103toare nu sunt afectate de muta\u021biile recesive de pe X la fel de des ca b\u0103rba\u021bii?", "opts": ["Inactivarea e \u00eent\u00e2mpl\u0103toare: unele celule folosesc X-ul normal", "La femei e inactivat de regul\u0103 tocmai X-ul care poart\u0103 muta\u021bia", "Cromozomul Y al b\u0103rba\u021bilor amplific\u0103 efectul muta\u021biei", "Femeile au copii de rezerv\u0103 ale genelor pe autozomi"], "correct": 0, "explain": "La femeia heterozigot\u0103, \u00een unele celule r\u0103m\u00e2ne activ X-ul normal, \u00een altele cel mutant; celulele normale asigur\u0103 \u00een general func\u021bia, deci femeia e s\u0103n\u0103toas\u0103. La b\u0103rbatul hemizigot toate celulele au X-ul mutant. Inactivarea nu \u021binte\u0219te muta\u021bia, iar Y nu poart\u0103 perechea genelor de pe X.", "tag": "Femeile ca mozaic"}, {"q": "Cantitatea de ADN a unei celule somatice e m\u0103surat\u0103 o dat\u0103 \u00een faza G1 \u0219i apoi din nou \u00een faza G2, \u00eenaintea mitozei. Ce se constat\u0103?", "opts": ["S-a dublat, fiindc\u0103 replicarea are loc \u00een faza S", "S-a \u00eenjum\u0103t\u0103\u021bit, fiindc\u0103 celula preg\u0103te\u0219te meioza", "E aceea\u0219i, fiindc\u0103 ADN-ul se copiaz\u0103 abia \u00een mitoz\u0103", "S-a dublat, fiindc\u0103 celula a fuzionat cu o vecin\u0103"], "correct": 0, "explain": "Faza S, \u00een mijlocul interfazei, e cea \u00een care ADN-ul se duplic\u0103; \u00een G2 celula are deci dublul cantit\u0103\u021bii din G1, pe care o \u00eemparte apoi egal celor dou\u0103 celule-fiice. Mitoza distribuie ADN-ul, nu \u00eel copiaz\u0103; celulele somatice nu intr\u0103 \u00een meioz\u0103.", "tag": "Interfaza (G1, S, G2)"}, {"q": "Un cercet\u0103tor iradiaz\u0103 musculi\u021be cu raze X \u0219i g\u0103se\u0219te o linie mutant\u0103. \u00cen glandele salivare ale larvelor ei, un cromozom gigant are o band\u0103 lips\u0103, care la musculi\u021bele normale exist\u0103. Ce poate deduce?", "opts": ["Muta\u021bia a afectat \u00een egal\u0103 m\u0103sur\u0103 to\u021bi cromozomii", "Banda lips\u0103 e o fenocopie produs\u0103 de iradiere", "Gena mutant\u0103 se afl\u0103 probabil \u00een regiunea benzii lips\u0103", "Gena se afl\u0103 pe alt cromozom dec\u00e2t cel modificat"], "correct": 2, "explain": "A\u0219a a localizat Morgan primele gene: o muta\u021bie indus\u0103 se vedea ca modificare a modelului de benzi, deci gena e \u00een regiunea modificat\u0103. Fenocopia, din Cap. 3 (Modele de transmitere a caracterelor monogenice), e o modificare de mediu care nu se transmite, pe c\u00e2nd linia mutant\u0103 se transmite.", "tag": "Drosophila \u0219i cromozomii gigan\u021bi"}, {"q": "\u00centr-o cultur\u0103, celulele normale se opresc din diviziune c\u00e2nd acoper\u0103 fundul vasului; o alt\u0103 linie continu\u0103 s\u0103 se divid\u0103 \u0219i formeaz\u0103 mase suprapuse. Ce sugereaz\u0103 comportamentul celei de-a doua linii?", "opts": ["E o linie de neuroni, care s-a oprit definitiv \u00een faza G1", "E o linie haploid\u0103, rezultat\u0103 dintr-o meioz\u0103", "E o linie cu punctele de control ale ciclului intacte", "E o linie canceroas\u0103, care a sc\u0103pat de inhibi\u021bia de contact"], "correct": 3, "explain": "Celulele normale \u00ee\u0219i limiteaz\u0103 reciproc diviziunile prin inhibi\u021bia de contact; celulele canceroase se divid \u0219i cresc f\u0103r\u0103 restric\u021bii. Neuronii nu se mai divid deloc, celulele haploide sunt game\u021bi, iar punctele de control intacte ar fr\u00e2na, nu ar \u00eentre\u021bine diviziunea.", "tag": "Inhibi\u021bia de contact"}, {"q": "Un cuplu are trei fiice \u0219i se \u00eentreab\u0103 de ce depinde sexul urm\u0103torului copil. Ce le explic\u0103 geneticianul?", "opts": ["De ovul, care duce un X sau un Y; \u0219ansa r\u0103m\u00e2ne \u00bd", "De num\u0103rul fiicelor de p\u00e2n\u0103 acum, care m\u0103re\u0219te \u0219ansa unui b\u0103iat", "De spermatozoid, care duce un X sau un Y; \u0219ansa r\u0103m\u00e2ne \u00bd", "De hormonii mamei \u00een primele s\u0103pt\u0103m\u00e2ni de sarcin\u0103"], "correct": 2, "explain": "B\u0103rbatul e heterogametic (XY) \u0219i produce spermatozoizi cu X sau cu Y; femeia, XX, d\u0103 numai ovule cu X. Fiecare concep\u021bie e independent\u0103, deci \u0219ansa r\u0103m\u00e2ne \u00bd. Cromozomii de sex determin\u0103 sexul, nu hormonii materni.", "tag": "Autozomi \u0219i gonozomi"}, {"q": "La \u00eenceputul unei mitoze, fiecare cromozom e format din dou\u0103 cromatide unite la centromer. C\u00e2te molecule de ADN are \u00een acel moment un cromozom?", "opts": ["Una, pe care cromatidele o \u00eempart", "Patru, c\u00e2te una pe fiecare bra\u021b", "Dou\u0103, c\u00e2te una \u00een fiecare cromatid\u0103", "46, c\u00e2te una pentru fiecare cromozom"], "correct": 2, "explain": "Un cromozom con\u021bine o singur\u0103 molecul\u0103 liniar\u0103 de ADN; dup\u0103 replicarea din faza S el e dedublat \u00een dou\u0103 cromatide identice, deci are dou\u0103 molecule, c\u00e2te una de fiecare celul\u0103-fiic\u0103. Bra\u021bele p \u0219i q sunt p\u0103r\u021bi ale aceleia\u0219i cromatide, nu molecule separate.", "tag": "Cromatidele"}, {"q": "O muta\u021bie care produce hemofilie la c\u00e2ine e g\u0103sit\u0103 pe cromozomul X. Unde se a\u0219teapt\u0103 cercet\u0103torii s\u0103 g\u0103seasc\u0103 gena corespunz\u0103toare la om?", "opts": ["Tot pe X, fiindc\u0103 acesta s-a conservat la mamifere", "Pe un autozom, fiindc\u0103 omul are mai mul\u021bi cromozomi", "Pe Y, fiindc\u0103 la om boala afecteaz\u0103 mai ales b\u0103rba\u021bii", "Oriunde, fiindc\u0103 pozi\u021bia genelor variaz\u0103 \u00eentre specii"], "correct": 0, "explain": "Cromozomul X s-a p\u0103strat ca atare \u00een evolu\u021bia mamiferelor: o muta\u021bie de pe X la \u0219oarece sau la c\u00e2ine e tot pe X la om (hemofilia, distrofia Duchenne). Faptul c\u0103 b\u0103rba\u021bii sunt afecta\u021bi \u021bine tocmai de hemizigo\u021bia lor pentru X, nu de Y.", "tag": "Cromozomul X la mamifere"}]}]}, {"nr": 5, "titlu": "Anomaliile cromozomiale \u0219i consecin\u021bele lor clinice", "harta": {"centru": "Anomaliile cromozomiale \u0219i consecin\u021bele lor clinice", "ramuri": [{"titlu": "Defini\u021bie, frecven\u021b\u0103, tipuri", "figuri": [{"titlu": "Frecven\u021ba anomaliilor cromozomiale", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 236\" role=\"img\" aria-label=\"Frecven\u021ba anomaliilor cromozomiale: 50\u201360% \u00een avorturile din trimestrul I, 40% \u00een trimestrul II, 10% \u00een trimestrul III, 0,5\u20130,7% la nou-n\u0103scu\u021bi\" font-family=\"Georgia, serif\" font-size=\"13\"><line x1=\"44.0\" y1=\"190.0\" x2=\"320.0\" y2=\"190.0\" stroke=\"#e6e0d4\" stroke-width=\"1\"/><text x=\"40.0\" y=\"193.5\" text-anchor=\"end\" fill=\"#6b6760\" font-size=\"10.2\">0%</text><line x1=\"44.0\" y1=\"136.7\" x2=\"320.0\" y2=\"136.7\" stroke=\"#e6e0d4\" stroke-width=\"1\"/><text x=\"40.0\" y=\"140.2\" text-anchor=\"end\" fill=\"#6b6760\" font-size=\"10.2\">20%</text><line x1=\"44.0\" y1=\"83.3\" x2=\"320.0\" y2=\"83.3\" stroke=\"#e6e0d4\" stroke-width=\"1\"/><text x=\"40.0\" y=\"86.8\" text-anchor=\"end\" fill=\"#6b6760\" font-size=\"10.2\">40%</text><line x1=\"44.0\" y1=\"30.0\" x2=\"320.0\" y2=\"30.0\" stroke=\"#e6e0d4\" stroke-width=\"1\"/><text x=\"40.0\" y=\"33.5\" text-anchor=\"end\" fill=\"#6b6760\" font-size=\"10.2\">60%</text><rect x=\"58.0\" y=\"43.3\" width=\"34.0\" height=\"146.7\" fill=\"#2a78d6\"><title>trim. I: 50\u201360%</title></rect><text x=\"75.0\" y=\"38.3\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.2\">50\u201360%</text><text x=\"75.0\" y=\"206.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">trim. I</text><rect x=\"110.0\" y=\"83.3\" width=\"34.0\" height=\"106.7\" fill=\"#2a78d6\"><title>trim. II: 40%</title></rect><text x=\"127.0\" y=\"78.3\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.2\">40%</text><text x=\"127.0\" y=\"206.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">trim. II</text><rect x=\"162.0\" y=\"163.3\" width=\"34.0\" height=\"26.7\" fill=\"#2a78d6\"><title>trim. III: 10%</title></rect><text x=\"179.0\" y=\"158.3\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.2\">10%</text><text x=\"179.0\" y=\"206.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">trim. III</text><rect x=\"214.0\" y=\"174.0\" width=\"34.0\" height=\"16.0\" fill=\"#eb6834\"><title>decese: \u2248 6%</title></rect><text x=\"231.0\" y=\"169.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.2\">\u2248 6%</text><text x=\"231.0\" y=\"206.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">decese</text><rect x=\"266.0\" y=\"188.4\" width=\"34.0\" height=\"1.6\" fill=\"#eb6834\"><title>nou-n\u0103scu\u021bi: 0,5\u20130,7%</title></rect><text x=\"283.0\" y=\"183.4\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.2\">0,5\u20130,7%</text><text x=\"283.0\" y=\"206.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">nou-n\u0103scu\u021bi</text><line x1=\"44.0\" y1=\"190.0\" x2=\"320.0\" y2=\"190.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"122.0\" y=\"226.0\" text-anchor=\"middle\" fill=\"#2a78d6\" font-size=\"10.8\">avorturi spontane</text><text x=\"270.0\" y=\"226.0\" text-anchor=\"middle\" fill=\"#eb6834\" font-size=\"10.8\">perinatal / la na\u0219tere</text><text x=\"44.0\" y=\"18.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.2\">anomalii cromozomiale (% din cazuri)</text></svg>", "nota": "Redesenat pe trimestre, cu valorile din text; bara \u201edecese\u201d (perinatale) e citit\u0103 aproximativ din figura manualului."}], "noduri": [{"t": "Lejeune \u0219i trisomia 21 (1958)", "d": "Lejeune arat\u0103 c\u0103 sindromul Down (numit atunci \u201emongolism\u201d) are un cromozom 21 suplimentar. Citogenetica explic\u0103 apoi multe avorturi spontane, sindroame malformative, sterilit\u0103\u021bi \u0219i intersexualit\u0103\u021bi."}, {"t": "Pragul vizibilit\u0103\u021bii (4 Mb)", "d": "Anomalia cromozomial\u0103 e o modificare vizibil\u0103 a cromozomilor: pe preparate standard, de la circa 4 Mb de ADN. Hibridizarea in situ arat\u0103 modific\u0103ri mult mai mici, \u0219terg\u00e2nd grani\u021ba fa\u021b\u0103 de muta\u021biile genice."}, {"t": "Mecanica cromozomial\u0103 defectuoas\u0103", "d": "Trei mecanisme: segregarea gre\u0219it\u0103 a cromozomilor \u00een mitoz\u0103 sau meioz\u0103, recombin\u0103ri improprii, repararea gre\u0219it\u0103 a rupturilor."}, {"t": "Constitu\u021bional\u0103 vs somatic\u0103", "d": "Constitu\u021bional\u0103: \u00een toate celulele, deci ap\u0103rut\u0103 foarte devreme (gamet anormal, fecundare anormal\u0103, primele diviziuni). Somatic\u0103 (c\u00e2\u0219tigat\u0103): doar \u00een unele \u021besuturi; individul e un mozaic."}, {"t": "Accidentale vs mo\u0219tenite", "d": "Distinc\u021bie important\u0103 pentru riscul reproductiv: majoritatea anomaliilor sunt accidente genetice, cu risc mic de repetare; o mic\u0103 parte sunt mo\u0219tenite de la un p\u0103rinte purt\u0103tor. Alt\u0103 \u00eemp\u0103r\u021bire: numerice vs structurale."}, {"t": "Selec\u021bia intrauterin\u0103", "d": "Frecven\u021ba scade de la 50\u201360% (avorturi, trimestrul I) la 0,5\u20130,7% (nou-n\u0103scu\u021bi): majoritatea concep\u021biilor anormale se elimin\u0103, iar cele viabile sunt \u201ev\u00e2rful aisbergului\u201d. Explic\u0103 \u0219i multe e\u0219ecuri ale fertiliz\u0103rii in vitro."}]}, {"titlu": "Poliploidia", "figuri": [{"titlu": "Originea triploidiei \u0219i a tetraploidiei", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 276\" role=\"img\" aria-label=\"Triploidia: dispermie 66%, ovul diploid 10%, spermatozoid diploid 24%; tetraploidia: endomitoza primei diviziuni a zigotului\" font-family=\"Georgia, serif\" font-size=\"13\"><text x=\"4.0\" y=\"16.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"12.0\" font-weight=\"bold\">Triploidie (3n = 69)</text><circle cx=\"55.0\" cy=\"62.0\" r=\"26\" fill=\"#fbeec9\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><circle cx=\"55\" cy=\"62\" r=\"26\" fill=\"none\" stroke=\"#b9b0a0\"/><circle cx=\"55.0\" cy=\"62.0\" r=\"10\" fill=\"#cfe0f5\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><text x=\"55.0\" y=\"66.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.8\">n</text><line x1=\"41.0\" y1=\"92.0\" x2=\"31.8\" y2=\"112.0\" stroke=\"#b5453a\" stroke-width=\" " fill=\"#6b6760\"/><text x=\"165.0\" y=\"214.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.8\">endomitoz\u0103</text><text x=\"165.0\" y=\"266.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">ADN replicat, celula nedivizat\u0103</text></svg>", "nota": "Dup\u0103 figura manualului; procentele sunt cele din figur\u0103 (textul nu le d\u0103)."}], "noduri": [{"t": "Triploidia (3n = 69)", "d": "Trei seturi complete de cromozomi, la 1\u20133% din sarcinile recunoscute clinic; rareori ajunge la termen \u0219i e incompatibil\u0103 cu via\u021ba postnatal\u0103."}, {"t": "Accidentul de fecunda\u021bie", "d": "Cauza obi\u0219nuit\u0103 a triploidiei: dispermia (un ovul fecundat de doi spermatozoizi) sau fecundarea cu un gamet diploid."}, {"t": "Tetraploidia \u0219i endomitoza", "d": "4n = 92: mult mai rar\u0103 \u0219i letal\u0103, g\u0103sit\u0103 doar \u00een avorturi. Apare prin reduplicare endomitotic\u0103: \u00een prima diviziune a zigotului ADN-ul se replic\u0103, dar celula nu se divide."}, {"t": "Celule poliploide normale", "d": "De\u0219i poliploidia constitu\u021bional\u0103 e letal\u0103, orice om are c\u00e2teva celule poliploide: megacariocitele din m\u0103duv\u0103 (16n\u201364n), hepatocitele (2n\u20138n), cardiomiocitele (4n\u20138n)."}, {"t": "Letalitatea triploizilor", "d": "Neclar\u0103, fiindc\u0103 dozajul autozomilor e echilibrat; probabil conteaz\u0103 dezechilibrul dintre produ\u0219ii X \u0219i cei autozomali, necompensat de inactivarea X. Triploizii vegetali sunt doar sterili."}]}, {"titlu": "Aneuploidia \u0219i v\u00e2rsta mamei", "figuri": [{"titlu": "Riscul de sindrom Down dup\u0103 v\u00e2rsta mamei", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 230\" role=\"img\" aria-label=\"Riscul de sindrom Down cre\u0219te cu v\u00e2rsta mamei: 1 la 1450 la 20 de ani, 1 la 410 la 35, 1 la 90 la 40, 1 la 55 la 44\" font-family=\"Georgia, serif\" font-size=\"13\"><line x1=\"44.0\" y1=\"190.0\" x2=\"316.0\" y 16.0\" y2=\"194.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"316.0\" y=\"205.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">45</text><line x1=\"207.2\" y1=\"24.0\" x2=\"207.2\" y2=\"190.0\" stroke=\"#eb6834\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><text x=\"204.2\" y=\"34.0\" text-anchor=\"end\" fill=\"#eb6834\" font-size=\"10.2\">35 de ani</text><polyline points=\"44.0,184.3 98.4,184.5 152.8,183.4 163.7,181.3 174.6,179.6 185.4,176.2 196.3,174.9 207.2,169.8 218.1,164.5 229.0,156.8 239.8,152.3 250.7,134.7 261.6,97.8 305.1,39.1\" fill=\"none\" stroke=\"#2a78d6\" stroke-width=\"2\"/><circle cx=\"44.0\" cy=\"184.3\" r=\"3.2\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"><title>20 de ani: 1 la 1450</title></circle><circle cx=\"98.4\" cy=\"184.5\" r=\"3.2\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"><title>25 de ani: 1 la 1500</title></circle><circle cx=\"152.8\" cy=\"183.4\" r=\"3.2\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"><title>30 de ani: 1 la 1250</title></circle><circle cx=\"163.7\" cy=\"181.3\" r=\"3.2\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"><title>31 de ani: 1 la 950</title></circle><circle cx=\"174.6\" cy=\"179.6\" r=\"3.2\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"><title>32 de ani: 1 la 800</title></circle><circle cx=\"185.4\" cy=\"176.2\" r=\"3.2\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"><title>33 de ani: 1 la 600</title></circle><circle cx=\"196.3\" cy=\"174.9\" r=\"3.2\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"><title>34 de ani: 1 la 550</title></circle><circle cx=\"207.2\" cy=\"169.8\" r=\"3.2\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"><title>35 de ani: 1 la 410</title></circle><circle cx=\"218.1\" cy=\"164.5\" r=\"3.2\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"><title>36 de ani: 1 la 325</title></circle><circle cx=\"229.0\" cy=\"156.8\" r=\"3.2\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"><title>37 de ani: 1 la 250</title></circle><circle cx=\"239.8\" cy=\"152.3\" r=\"3.2\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"><title>38 de ani: 1 la 220</title></circle><circle cx=\"250.7\" cy=\"134.7\" r=\"3.2\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"><title>39 de ani: 1 la 150</title></circle><circle cx=\"261.6\" cy=\"97.8\" r=\"3.2\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"><title>40 de ani: 1 la 90</title></circle><circle cx=\"305.1\" cy=\"39.1\" r=\"3.2\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"><title>44 de ani: 1 la 55</title></circle><text x=\"46.0\" y=\"176.3\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.2\">1/1450</text><text x=\"201.2\" y=\"160.8\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.2\">1/410</text><text x=\"255.6\" y=\"91.8\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.2\">1/90</text><text x=\"301.1\" y=\"31.1\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.2\">1/55</text><text x=\"44.0\" y=\"14.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.2\">copii cu trisomie 21 la 1000 de na\u0219teri</text><text x=\"180.0\" y=\"222.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">v\u00e2rsta mamei (ani)</text></svg>", "nota": "Datele tabelului din manual (risc observat \u00een popula\u021bia general\u0103). Punctul de 25 de ani (1/1500) e u\u0219or sub cel de 20 (1/1450), ca \u00een carte."}], "noduri": [{"t": "Euploidie vs aneuploidie", "d": "Euploidie: seturi complete (n, 2n, 3n). Aneuploidie: unul sau mai mul\u021bi cromozomi lipsesc sau sunt \u00een plus fa\u021b\u0103 de un set euploid; extrem\u0103 \u00een celulele canceroase."}, {"t": "Trisomia (2n+1)", "d": "Trei copii ale unui cromozom \u00eentr-o celul\u0103 diploid\u0103: trisomia 21 (47,XX,+21 sau 47,XY,+21) \u00een sindromul Down."}, {"t": "Monosomia (2n\u22121)", "d": "Lipse\u0219te un cromozom dintr-o pereche de omologi; cu excep\u021bia monosomiei X (sindromul Turner), monosomicii nu sunt viabili."}, {"t": "Non-disjunc\u021bia", "d": "Cromozomii nu se separ\u0103 \u00een diviziune: \u00een meioz\u0103 d\u0103 game\u021bi cu 22 sau 24 de cromozomi (zigo\u021bi cu 45 sau 47), \u00een mitoz\u0103 un mozaic. Alt mecanism: \u00eent\u00e2rzierea (lagging), cromozomul r\u0103mas \u00een citoplasm\u0103 se pierde."}, {"t": "Efectul v\u00e2rstei materne", "d": "Riscul de trisomie 21 cre\u0219te cu v\u00e2rsta mamei; \u00een 95% din cazuri non-disjunc\u021bia are loc \u00een ovogenez\u0103. Cauza posibil\u0103: ovulele r\u0103m\u00e2n blocate ani \u00eentregi \u00een dictioten, din ovarul fetal p\u00e2n\u0103 la ovula\u021bie."}, {"t": "Pierderea fetal\u0103 \u0219i monitorizarea", "d": "\u00cen sarcinile monitorizate prenatal riscul g\u0103sit e mai mare: 90% din fe\u021bii cu trisomie 21 se pierd \u00eentre s\u0103pt\u0103m\u00e2nile 12 \u0219i 16. Multe \u021b\u0103ri recomand\u0103 monitorizarea dup\u0103 35 sau 38 de ani."}, {"t": "Diagnosticul prenatal", "d": "Neinvaziv (ecografie, teste serologice): sugereaz\u0103 un risc. Invaziv (biopsia de trofoblast, amniocenteza): singurul care precizeaz\u0103 anomalia. Amniocenteza: din s\u0103pt\u0103m\u00e2na 16, rezultat dup\u0103 2\u20133 s\u0103pt\u0103m\u00e2ni de cultur\u0103."}]}, {"titlu": "Mozaicul \u0219i himera", "figuri": [{"titlu": "Mozaic \u0219i himer\u0103", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 210\" role=\"img\" aria-label=\"Mozaicul are dou\u0103 linii celulare din acela\u0219i zigot, prin non-disjunc\u021bie dup\u0103 fecundare; himera are dou\u0103 linii din doi zigo\u021bi care fuzioneaz\u0103\" font-family=\"Georgia, serif\" font-size=\"13\"><text x=\"4.0\" y=\"16.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"12.0\" font-weight=\"bold\">Mozaic: un singur zigot</text><circle cx=\"24.0\" cy=\"52.0\" r=\"11\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><text x=\"24.0\" y=\"80.0\" text-anchor=\"midd
