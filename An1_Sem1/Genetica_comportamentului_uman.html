<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genetica comportamentului uman — recapitulare și quiz-uri finale</title>
<style>
  :root { --bg:#f4f1ea; --card:#fff; --ink:#2c2a26; --muted:#6b6760; --accent:#7a5c3e; --soft:#efe6d8;
    --border:#ddd5c7; --optbg:#faf8f3; --ok:#2e7d52; --okbg:#e6f3ec; --bad:#b5453a; --badbg:#f8e9e7; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, 'Times New Roman', serif; background: var(--bg); color: var(--ink); margin: 0; line-height: 1.55; }
  .wrap { max-width: var(--pagew, 960px); margin: 0 auto; padding: 24px 12px 80px; }
  .book { text-align: center; padding: 28px 16px 18px; }
  .book h1 { font-size: 2.1rem; margin: 0; color: var(--accent); }
  .book .sub { color: var(--muted); font-style: italic; margin: 6px 0 0; }
  .toc { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin: 8px 0 28px; }
  .toc h2 { font-size: 1rem; margin: 0 0 10px; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
  .toc ol { margin: 0; padding-left: 22px; columns: 2; column-gap: 28px; }
  .toc li { margin: 3px 0; break-inside: avoid; }
  .toc a { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--border); cursor: pointer; }
  .toc a:hover { color: var(--accent); }
  .toc .todo { color: var(--muted); font-style: italic; }
  .finals { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--soft); border: 1px solid var(--border); color: var(--accent); border-radius: 999px;
    padding: 6px 14px; font-size: .92rem; cursor: pointer; font-family: inherit; }
  .fnotes { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: .8rem; line-height: 1.45; }
  .fnotes b { color: var(--ink); }
  .chsec, .fq { margin: 0 0 38px; scroll-margin-top: 10px; }
  .chhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--accent);
    padding: 0 4px 6px; margin-bottom: 14px; }
  .chhead h2 { margin: 0; font-size: 1.35rem; color: var(--accent); }
  .chhead a { color: var(--muted); font-size: .85rem; white-space: nowrap; cursor: pointer; text-decoration: none; }
  .finals-intro { background: var(--card); border: 2px solid var(--accent); border-radius: 14px; padding: 18px 20px; margin-bottom: 22px; }
  .finals-intro h2 { margin: 0 0 6px; color: var(--accent); }
  .finals-intro p { margin: 0; color: var(--muted); }
  .tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
  .tab { background: var(--card); border: 1px solid var(--border); padding: 8px 16px; border-radius: 999px;
    cursor: pointer; font-family: inherit; font-size: .93rem; color: var(--ink); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .qz { max-width: 740px; margin: 0 auto; }
  .scorebar { position: sticky; top: 0; z-index: 5; background: var(--soft); border: 1px solid var(--border);
    border-radius: 12px; padding: 9px 14px; margin-bottom: 16px; display: flex; justify-content: space-between; }
  .scorebar b { color: var(--accent); }
  .rtitle { font-size: 1.15rem; color: var(--accent); margin: 4px 0 2px; }
  .rdesc { color: var(--muted); font-style: italic; margin: 0 0 16px; font-size: .95rem; }
  .q { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
  .qnum { color: var(--accent); font-weight: bold; font-size: .82rem; letter-spacing: .04em; text-transform: uppercase; }
  .qtext { font-size: 1.05rem; margin: 6px 0 14px; }
  .opt { display: block; width: 100%; text-align: left; background: var(--optbg); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 14px; margin-bottom: 9px; cursor: pointer; font-family: inherit; font-size: 1rem; color: var(--ink); }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--soft); }
  .opt:disabled { cursor: default; }
  .opt.ok { background: var(--okbg); border-color: var(--ok); color: var(--ok); font-weight: bold; }
  .opt.bad { background: var(--badbg); border-color: var(--bad); color: var(--bad); }
  .mark { float: right; font-weight: bold; }
  .explain { padding: 11px 14px; border-radius: 10px; background: var(--soft); border-left: 3px solid var(--accent); font-size: .95rem; }
  .explain b { color: var(--accent); }
  .explain .src { display: block; margin-top: 6px; color: var(--muted); font-size: .85rem; font-style: italic; }
  .final { background: var(--card); border: 2px solid var(--accent); border-radius: 14px; padding: 22px; text-align: center; }
  .final h3 { color: var(--accent); margin: 0 0 6px; }
  .final .pct { font-size: 2.3rem; font-weight: bold; color: var(--accent); }
  .btn { background: var(--accent); color: #fff; border: none; padding: 9px 20px; border-radius: 999px; cursor: pointer;
    font-family: inherit; font-size: .93rem; margin: 8px 4px 0; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .rlabel { font-weight: bold; color: var(--accent); margin-top: 12px; text-align: left; font-size: .95rem; }
  textarea.res { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; background: var(--optbg);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-top: 6px; color: var(--ink); line-height: 1.4; }
  .hint { color: var(--muted); font-size: .85rem; font-style: italic; margin-top: 8px; }
  .mmroot { text-align: center; margin: 4px auto 18px; background: var(--accent); color: #fff; border-radius: 999px;
    padding: 14px 20px; font-size: 1.1rem; font-weight: bold; max-width: 520px; }
  .mmtools { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-bottom: 10px; }
  .mmtools .btn { padding: 6px 14px; font-size: .85rem; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--mmw, 280px)), 1fr)); gap: 14px; }
  .branch { background: var(--card); border: 1px solid var(--border); border-top: 5px solid var(--bc); border-radius: 14px; padding: 12px 16px; }
  .branch.wide { grid-column: 1 / -1; }
  .bhead { color: var(--bc); font-weight: bold; font-size: 1.02rem; margin: 0 0 10px; }
  .node { background: var(--optbg); border-left: 3px solid var(--bc); border-radius: 8px; margin: 0 0 8px; }
  .node .nt { padding: 8px 12px; font-weight: bold; font-size: .95rem; cursor: pointer; }
  .node .nt.plain { cursor: default; }
  .node .mk { color: var(--bc); display: inline-block; width: 16px; }
  .node .nd { padding: 0 12px 10px 28px; font-size: .92rem; }
  .tscroll { overflow-x: auto; margin-top: 10px; }
  table.ct { border-collapse: collapse; width: 100%; font-size: .88rem; }
  table.ct th, table.ct td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
  table.ct th { background: var(--soft); }
  .muted { color: var(--muted); font-style: italic; text-align: center; }
  .sintro { max-width: 820px; margin: 0 auto 14px; color: var(--muted); font-size: .95rem; text-align: center; }
  .figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--figw, 250px)), 1fr)); gap: 12px; margin-top: 12px; }
  figure.fig { margin: 0; background: var(--optbg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; cursor: zoom-in; }
  figure.fig:hover { border-color: var(--accent); }
  .zoom { position: fixed; inset: 0; z-index: 50; background: rgba(44,42,38,.78); display: none; align-items: center; justify-content: center; padding: 2vh 2vw; cursor: zoom-out; }
  .zoom.on { display: flex; }
  .zbox { background: var(--card); border-radius: 14px; padding: 14px 18px; width: min(96vw, 1100px); max-height: 96vh; overflow: auto; }
  .zbox svg { width: 100%; height: auto; max-height: 78vh; display: block; }
  .zbox .zcap { color: var(--muted); font-size: .95rem; margin-top: 6px; }
  .zbox .zcap b { color: var(--ink); }
  .zbox .zclose { float: right; color: var(--muted); font-size: .85rem; }
  figure.fig svg { width: 100%; height: auto; display: block; }
  figure.fig figcaption { font-size: .95rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  figure.fig figcaption b { color: var(--ink); display: block; }
  @media (max-width: 560px) { .toc ol { columns: 1; } .book h1 { font-size: 1.7rem; } .wrap { padding: 12px 6px 60px; } }
</style>
</head>

<script>
var D = {"curs": "Genetica comportamentului uman", "sursa": "Manual UTM, Facultatea de Psihologie \u00b7 recapitulare pe unit\u0103\u021bi \u0219i quiz-uri finale", "eticheta": "Unitatea", "lista": [{"nr": 1, "titlu": "Introducere \u00een genetic\u0103"}, {"nr": 2, "titlu": "Ereditatea mendelian\u0103: legile lui Mendel"}, {"nr": 3, "titlu": "Modele de transmitere a caracterelor monogenice (mendeliene) \u00een familiile umane"}, {"nr": 4, "titlu": "Bazele cromozomiale ale eredit\u0103\u021bii. Cromozomii umani: morfologie, structur\u0103, func\u021bie"}, {"nr": 5, "titlu": "Anomaliile cromozomiale \u0219i consecin\u021bele lor clinice"}, {"nr": 6, "titlu": "Ereditatea multifactorial\u0103 sau poligenic\u0103"}], "capitole": [{"nr": 1, "titlu": "Introducere \u00een genetic\u0103", "harta": {"centru": "Introducere \u00een genetic\u0103", "ramuri": [{"titlu": "Obiectul geneticii", "noduri": [{"t": "Ereditatea", "d": "Proprietatea organismelor de a transmite urma\u0219ilor caracteristici morfologice, fiziologice, biochimice \u0219i comportamentale. Nu caracterele se transmit direct, ci informa\u021bia din genele game\u021bilor: ereditatea e un proces informa\u021bional de stocare, exprimare \u0219i transmitere. \u00cen practic\u0103 are sens restr\u00e2ns: cum se transmite o gen\u0103 (dominant, recesiv, legat de sex). Termenul a intrat \u00een biologie prin psihiatrul Prosper Lucas (1847); Mendel \u00ee\u0219i numise legile \u201eale hibrid\u0103rii\u201d."}, {"t": "Genetica", "d": "\u0218tiin\u021ba legilor eredit\u0103\u021bii; azi, studiul structurii \u0219i func\u021biei genelor \u0219i al rela\u021biei lor cu mediul (intern \u0219i extern). Genetica uman\u0103 studiaz\u0103 ereditatea \u0219i variabilitatea la om."}, {"t": "Gena", "d": "Unitatea structural\u0103 \u0219i func\u021bional\u0103 a materialului genetic: segment de ADN care codific\u0103 un polipeptid. ADN-ul e o macromolecul\u0103 din dou\u0103 lan\u021buri de nucleotide complementare, \u00een dublu helix, aflat\u0103 \u00een cele 23 de perechi de cromozomi. Formula clasic\u0103 \u201eo gen\u0103 \u2192 un caracter\u201d a devenit \u201eo gen\u0103 \u2192 o protein\u0103\u201d (\u201edogma central\u0103\u201d)."}, {"t": "Bre\u0219ele dogmei centrale", "d": "Genele reglatoare (netraduse \u00een proteine) activeaz\u0103 sau suprim\u0103 genele codificatoare; genele sunt \u00eentrerupte de introni necodan\u021bi, elimina\u021bi din mesaj; decuparea \u0219i citirea exonilor depinde de tipul \u0219i starea celulei; exist\u0103 gene \u00een interiorul altor gene. Aceea\u0219i gen\u0103 poate fi citit\u0103 diferit: gena devine \u201eo entitate func\u021bional\u0103 labil\u0103\u201d."}, {"t": "Muta\u021bia \u0219i alela", "d": "Muta\u021bia = modificarea brusc\u0103, uneori punctiform\u0103, a structurii unei gene; produce o variant\u0103 numit\u0103 alel\u0103, normal\u0103 sau anormal\u0103, care se poate transmite. Muta\u021biile sunt fenomene naturale \u0219i o surs\u0103 de variabilitate."}, {"t": "Variabilitatea genetic\u0103", "d": "Ansamblul fenomenelor care produc diferen\u021bele genetice dintre indivizi \u0219i dintre popula\u021bii. Surse: muta\u021biile \u0219i recombin\u0103rile de la formarea game\u021bilor. Doi p\u0103rin\u021bi pot da virtual 10\u00b2\u2077\u2070 combina\u021bii. I se adaug\u0103 variabilitatea nongenetic\u0103, produs\u0103 de mediu."}]}, {"titlu": "Genotip \u0219i fenotip", "noduri": [{"t": "Genotipul", "d": "Constitu\u021bia genetic\u0103 stabilit\u0103 la fecunda\u021bie, constant\u0103 toat\u0103 via\u021ba: individualitatea genetic\u0103. Dovad\u0103 indirect\u0103 a unicit\u0103\u021bii ei: \u201exenofobia organic\u0103\u201d, respingerea oric\u0103rui \u021besut str\u0103in (grefe, transplanturi)."}, {"t": "Fenotipul", "d": "Totalitatea caracterelor vizibile, m\u0103surabile: individualitatea biologic\u0103. Poten\u021bial variabil, la confluen\u021ba eredit\u0103\u021bii cu mediul; e starea organismului la un moment dat. Nu exist\u0103 doi indivizi identici, nici gemenii monozigo\u021bi."}, {"t": "Genotipul se vede prin fenotip", "d": "Genotipul nu se poate deduce cu precizie din fenotip, dar nu e accesibil dec\u00e2t prin el. Jacquard: genotipul e \u201epartitura\u201d, fenotipul \u201esimfonia\u201d pe care o auzim. Analiza eredit\u0103\u021bii \u00eencepe prin a separa elementele constitu\u021bionale de cele fenotipice."}, {"t": "Comportamentul ca fenotip", "d": "Pentru genetica comportamental\u0103, comportamentul e un fenotip: o caracteristic\u0103 observabil\u0103 pe care o putem m\u0103sura. Rezumatul distinge trei niveluri: individualitate genetic\u0103 (genotip), biologic\u0103 (fenotip) \u0219i bio-psiho-social\u0103."}]}, {"titlu": "Determinismul caracterelor", "lat": true, "figuri": [{"titlu": "Ponderea eredit\u0103\u021bii \u0219i a mediului \u00een determinarea tr\u0103s\u0103turilor", "nota": "Redesenat\u0103 dup\u0103 figura din manual: procentul arat\u0103 c\u00e2t din determinism revine eredit\u0103\u021bii (restul, mediului). Pozi\u021biile sunt aproximative; pentru \u00een\u0103l\u021bime textul d\u0103 o condi\u021bionare genetic\u0103 de 76%. Chiar \u0219i la 0% r\u0103spunsul la agresiune depinde de \u201eterenul\u201d genetic.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 400\" role=\"img\" aria-label=\"Ponderea eredit\u0103\u021bii \u0219i a mediului \u00een determinarea unor tr\u0103s\u0103turi normale \u0219i anormale, de la 100% ereditate la 0%\" font-family=\"Georgia, serif\" font-size=\"13\"><defs><linearGradient id=\"g11\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#2a78d6\"/><stop offset=\"1\" stop-color=\"#eb6834\"/></linearGradient></defs><text x=\"170.0\" y=\"18.0\" text-anchor=\"middle\" fill=\"#2a78d6\" font-size=\"12.0\" font-weight=\"bold\">EREDITATE</text><text x=\"170.0\" y=\"390.0\" text-anchor=\"middle\" fill=\"#eb6834\" font-size=\"12.0\" font-weight=\"bold\">MEDIU</text><text x=\"144.0\" y=\"42.0\" text-anchor=\"end\" fill=\"#6b6760\" font-size=\"10.8\" font-style=\"italic\">Tr\u0103s\u0103turi normale</text><text x=\"196.0\" y=\"42.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.8\" font-style=\"italic\">Tr\u0103s\u0103turi anormale</text><rect x=\"152.0\" y=\"54\" width=\"36\" height=\"306\" rx=\"6\" fill=\"url(#g11)\"/><text x=\"170.0\" y=\"65.6\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"10.2\" font-weight=\"bold\">100%</text><text x=\"170.0\" y=\"138.1\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"10.2\" font-weight=\"bold\">75%</text><text x=\"170.0\" y=\"210.6\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"10.2\" font-weight=\"bold\">50%</text><text x=\"170.0\" y=\"283.1\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"10.2\" font-weight=\"bold\">25%</text><text x=\"170.0\" y=\"355.6\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"10.2\" font-weight=\"bold\">0%</text><line x1=\"146.0\" y1=\"62.0\" x2=\"152.0\" y2=\"62.0\" stroke=\"#2c2a26\" stroke-width=\"1\"/><circle cx=\"146.0\" cy=\"62.0\" r=\"2.5\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><text x=\"140.0\" y=\"66.0\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.8\">Grupa sanguin\u0103</text><line x1=\"146.0\" y1=\"134.5\" x2=\"152.0\" y2=\"134.5\" stroke=\"#2c2a26\" stroke-width=\"1\"/><circle cx=\"146.0\" cy=\"134.5\" r=\"2.5\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><text x=\"140.0\" y=\"132.0\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.8\">Talia, dermatoglifele,</text><text x=\"140.0\" y=\"145.0\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.8\">culoarea pielii</text><line x1=\"146.0\" y1=\"172.2\" x2=\"152.0\" y2=\"172.2\" stroke=\"#2c2a26\" stroke-width=\"1\"/><circle cx=\"146.0\" cy=\"172.2\" r=\"2.5\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><text x=\"140.0\" y=\"176.2\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.8\">Greutatea</text><line x1=\"146.0\" y1=\"207.0\" x2=\"152.0\" y2=\"207.0\" stroke=\"#2c2a26\" stroke-width=\"1\"/><circle cx=\"146.0\" cy=\"207.0\" r=\"2.5\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><text x=\"140.0\" y=\"211.0\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.8\">Inteligen\u021ba</text><line x1=\"146.0\" y1=\"279.5\" x2=\"152.0\" y2=\"279.5\" stroke=\"#2c2a26\" stroke-width=\"1\"/><circle cx=\"146.0\" cy=\"279.5\" r=\"2.5\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><text x=\"140.0\" y=\"283.5\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.8\">Tensiunea arterial\u0103</text><line x1=\"146.0\" y1=\"317.2\" x2=\"152.0\" y2=\"317.2\" stroke=\"#2c2a26\" stroke-width=\"1\"/><circle cx=\"146.0\" cy=\"317.2\" r=\"2.5\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><text x=\"140.0\" y=\"321.2\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.8\">Dezvoltarea muscular\u0103</text><line x1=\"188.0\" y1=\"62.0\" x2=\"194.0\" y2=\"62.0\" stroke=\"#2c2a26\" stroke-width=\"1\"/><circle cx=\"194.0\" cy=\"62.0\" r=\"2.5\" fill=\"#b5453a\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><text x=\"200.0\" y=\"59.5\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">Albinism, hemofilie,</text><text x=\"200.0\" y=\"72.5\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">acondroplazie, sdr. Down</text><line x1=\"188.0\" y1=\"134.5\" x2=\"194.0\" y2=\"134.5\" stroke=\"#2c2a26\" stroke-width=\"1\"/><circle cx=\"194.0\" cy=\"134.5\" r=\"2.5\" fill=\"#b5453a\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><text x=\"200.0\" y=\"132.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">Schizofrenia,</text><text x=\"200.0\" y=\"145.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">buza de iepure</text><line x1=\"188.0\" y1=\"207.0\" x2=\"194.0\" y2=\"207.0\" stroke=\"#2c2a26\" stroke-width=\"1\"/><circle cx=\"194.0\" cy=\"207.0\" r=\"2.5\" fill=\"#b5453a\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><text x=\"200.0\" y=\"211.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">Diabetul zaharat</text><line x1=\"188.0\" y1=\"279.5\" x2=\"194.0\" y2=\"279.5\" stroke=\"#2c2a26\" stroke-width=\"1\"/><circle cx=\"194.0\" cy=\"279.5\" r=\"2.5\" fill=\"#b5453a\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><text x=\"200.0\" y=\"277.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">Ulcerul gastro-duodenal,</text><text x=\"200.0\" y=\"290.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">cardiopatia ischemic\u0103</text><line x1=\"188.0\" y1=\"352.0\" x2=\"194.0\" y2=\"352.0\" stroke=\"#2c2a26\" stroke-width=\"1\"/><circle cx=\"194.0\" cy=\"352.0\" r=\"2.5\" fill=\"#b5453a\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><text x=\"200.0\" y=\"349.5\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">Infec\u021bii, intoxica\u021bii,</text><text x=\"200.0\" y=\"362.5\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">accidente</text></svg>"}], "noduri": [{"t": "Determinism exclusiv genetic", "d": "Caracterele de specie \u0219i cele ale individualit\u0103\u021bii biologice (grupe sanguine, grupe tisulare HLA, proteine serice, enzime) \u0219i unele anormale (hemofilia, sindromul Down); determinism monogenic, transmitere mendelian\u0103. Utile la identificare, paternitate, transfuzii, transplant, diagnosticul gemenilor monozigo\u021bi/dizigo\u021bi. Fiind polimorfe, fac din fiecare un unicat biologic."}, {"t": "Ereditar nu \u00eenseamn\u0103 inevitabil", "d": "\u0218i bolile genetice pot fi influen\u021bate de mediu, prin terapie: fenilcetonuria (evolueaz\u0103 spre retard sever) se previne prin depistare la na\u0219tere \u0219i diet\u0103 f\u0103r\u0103 fenilalanin\u0103; hipotiroidismul se trateaz\u0103 cu hormoni de substitu\u021bie. Contrazice prejudecata c\u0103 bolile genetice nu se pot trata."}, {"t": "Determinism eco-genetic", "d": "Caracterele multifactoriale: interac\u021biunea, \u00een propor\u021bii diferite, dintre mai multe gene \u0219i mai mul\u021bi factori de mediu. Normale: \u00een\u0103l\u021bimea (condi\u021bionat\u0103 genetic 76%; a crescut unde s-au ameliorat condi\u021biile), greutatea, inteligen\u021ba. Nu mo\u0219tenim un IQ, ci abilitatea de a-l dezvolta; testele nu m\u0103soar\u0103 factorul ereditar."}, {"t": "Norma de reac\u021bie", "d": "La caracterele multifactoriale normale, ereditatea condi\u021bioneaz\u0103 doar un poten\u021bial, care se realizeaz\u0103 sau nu dup\u0103 condi\u021bii: o norm\u0103 de reac\u021bie la mediu care permite adaptarea, dar numai \u00eentre anumite limite."}, {"t": "Predispozi\u021bia genetic\u0103", "d": "Caracterele multifactoriale anormale: bolile comune ale adultului (hipertensiune arterial\u0103 primar\u0103, diabet, boal\u0103 coronarian\u0103, psihoza maniaco-depresiv\u0103, epilepsie) \u0219i malforma\u021biile congenitale comune (de cord, luxa\u021bia congenital\u0103 de \u0219old, buza de iepure). Genele dau doar vulnerabilitate, care devine boal\u0103 prin interac\u021biunea cu mediul. F\u0103r\u0103 transmitere mendelian\u0103, au totu\u0219i concentrare familial\u0103, deci medicul prive\u0219te \u0219i familia."}, {"t": "Determinism exclusiv ecologic", "d": "Accidente, intoxica\u021bii, traumatisme, avitaminoze. Dar \u0219i aici r\u0103spunsul depinde de structura genetic\u0103: \u00een epidemii nu se \u00eemboln\u0103vesc to\u021bi expu\u0219ii. Claude Bernard: \u201emicrobul nu-i nimic, terenul este totul\u201d; Ambroise Par\u00e9: \u201enu exist\u0103 boli, exist\u0103 bolnavi\u201d (extins: \u201efamilii de bolnavi\u201d). Aproape nu exist\u0103 caractere strict ecologice."}]}, {"titlu": "Rela\u021bia ereditate\u2013mediu", "noduri": [{"t": "Interac\u021biunea ereditate\u2013mediu", "d": "Fiecare organism e, \u00een egal\u0103 m\u0103sur\u0103, produsul eredit\u0103\u021bii \u0219i al mediului. Teoriile clasice separau net \u00eenn\u0103scutul de dob\u00e2ndit; cercet\u0103rile recente arat\u0103 c\u0103 interac\u021bioneaz\u0103, fiecare depinz\u00e2nd de cel\u0103lalt, evident mai ales la dezvoltarea creierului \u0219i a inteligen\u021bei. Dobzhansky: \u201eOmul este o parte a mediului s\u0103u\u201d; omul \u0219i cultura au evoluat sincron."}, {"t": "Mediul", "d": "Nu doar factorii naturali: \u0219i condi\u021biile socio-economice \u0219i cultura (cuno\u0219tin\u021be, credin\u021be, art\u0103, moral\u0103, legi, obiceiuri \u2014 c\u00e2\u0219tigate, nu mo\u0219tenite). Mediul = totalitatea factorilor ecologici (fizici, chimici, biologici) \u0219i mai ales psihologici \u0219i socio-culturali."}, {"t": "Analogia dreptunghiului", "d": "Suprafa\u021ba unui dreptunghi nu exist\u0103 f\u0103r\u0103 lungime \u0219i l\u0103\u021bime \u0219i se schimb\u0103 dac\u0103 se schimb\u0103 oricare. La fel, comportamentul e determinat de ereditate \u0219i de mediu, \u00eentre care exist\u0103 interac\u021biune \u0219i intercondi\u021bionare total\u0103; \u00eentrebarea \u201ec\u00e2t la sut\u0103\u201d e gre\u0219it pus\u0103."}, {"t": "Lewontin: biologia ne face liberi", "d": "Lewontin (1985): determinismul biologic spune c\u0103 nu suntem liberi; dar creierul, m\u00e2inile \u0219i limbajul ne-au f\u0103cut independen\u021bi de multe tr\u0103s\u0103turi ale mediului, creatori care \u00eel recreeaz\u0103: \u201etocmai biologia noastr\u0103 ne face liberi\u201d. Opusul libert\u0103\u021bii nu e determinismul, ci coerci\u021bia; mul\u021bi invoc\u0103 determinismul genetic ca s\u0103 scape de responsabilitate."}]}, {"titlu": "Congenital, ereditar, genetic", "tabel": {"cap": ["Termen", "Ce spune", "Nu \u00eenseamn\u0103", "Exemplu"], "randuri": [["Congenital", "prezent la na\u0219tere; f\u0103r\u0103 conota\u021bie de cauz\u0103", "c\u0103 e mo\u0219tenit", "malforma\u021bii prin medicamente, radia\u021bii, virusuri; sifilisul congenital (gre\u0219it numit \u201eeredosifilis\u201d)"], ["Ereditar", "boal\u0103 genetic\u0103 mo\u0219tenit\u0103 de la p\u0103rin\u021bi", "c\u0103 e prezent\u0103 la na\u0219tere", "coreea Huntington: se exprim\u0103 t\u00e2rziu"], ["Genetic", "\u021bine de materialul genetic", "c\u0103 e mo\u0219tenit", "sindromul Down: de regul\u0103 accident cromozomial nou"]]}, "noduri": [{"t": "Congenital", "d": "Orice caracter, normal sau patologic, prezent la na\u0219tere, f\u0103r\u0103 conota\u021bie etiologic\u0103: poate fi \u00eenn\u0103scut sau dob\u00e2ndit intrauterin (radia\u021bii, medicamente, virusuri). Sifilisul congenital, contaminare feto-matern\u0103, a fost gre\u0219it numit \u201eeredosifilis\u201d."}, {"t": "Ereditar", "d": "Boal\u0103 genetic\u0103 mo\u0219tenit\u0103 de la p\u0103rin\u021bi. O boal\u0103 ereditar\u0103 nu e congenital\u0103 dac\u0103 anomalia se exprim\u0103 mult dup\u0103 na\u0219tere (coreea Huntington)."}, {"t": "Genetic", "d": "Orice boal\u0103 ereditar\u0103 e genetic\u0103, dar nu orice boal\u0103 genetic\u0103 e ereditar\u0103: poate ap\u0103rea printr-o muta\u021bie nou\u0103 la embrion sau la gamet, f\u0103r\u0103 ca p\u0103rin\u021bii s\u0103 fie purt\u0103tori (sindromul Down, de regul\u0103 accident cromozomial)."}]}, {"titlu": "Genetica \u0219i psihologia", "noduri": [{"t": "Ramurile geneticii", "d": "Genetica formal\u0103 (legile transmiterii caracterelor), genetica molecular\u0103 (ereditatea la nivel molecular), genetica uman\u0103, care se \u00eentrep\u0103trunde cu medicina, psihologia \u0219i etologia: genetica medical\u0103, psihogenetica, genetica comportamental\u0103."}, {"t": "Psihogenetica", "d": "Ramur\u0103 nou\u0103, revendicat\u0103 \u0219i de psihologi: rolul factorilor ereditari \u00een via\u021ba psihic\u0103; serve\u0219te pedagogiei. \u00centre influen\u021ba genetic\u0103 \u0219i importan\u021ba educa\u021biei nu e nicio contradic\u021bie. Voltaire: \u201eO educa\u021bie aleas\u0103 pune \u00een valoare calit\u0103\u021bile omului, dar nu poate s\u0103 le creeze\u201d."}, {"t": "Genetica comportamental\u0103", "d": "Disciplin\u0103 distinct\u0103 odat\u0103 cu prima carte, Fuller \u0219i Thompson (1960); cre\u0219tere exponen\u021bial\u0103 dup\u0103 anii \u201970. Istoria ei \u00eencepe cu Darwin (\u201eExpresia emo\u021biilor la om \u0219i animale\u201d) \u0219i cu Galton, care a sugerat studiul gemenilor \u0219i al copiilor adopta\u021bi."}, {"t": "Eugenismul \u0219i ambientalismul", "d": "La \u00eenceput de secol XX, comportamentul era v\u0103zut ca puternic ereditar; darwinismul social a dus la eugenism \u0219i la steriliz\u0103ri (30 de state ale SUA). Davenport: \u201egena thalassophiliei\u201d pe cromozomul X. Apoi, teoriile ambientaliste (mediul decisiv: s\u0103r\u0103cie, educa\u021bie), cu programe sociale costisitoare, abandonate. Behaviori\u0219tii (Skinner) au exclus o vreme genetica: doctrina uniformit\u0103\u021bii copiilor la na\u0219tere."}, {"t": "Diferen\u021bele interindividuale", "d": "Studiul lor conteaz\u0103 pentru: politica educa\u021bional\u0103 (\u00eenv\u0103\u021b\u0103m\u00e2nt diferen\u021biat dup\u0103 posibilit\u0103\u021bi \u0219i aptitudini), orientarea profesional\u0103 (\u201eomul potrivit la locul potrivit\u201d, f\u0103r\u0103 risip\u0103 de aptitudini), psihoterapie (identificarea datelor \u00eenn\u0103scute care nu pot fi schimbate \u0219i c\u0103utarea altor c\u0103i)."}, {"t": "Direc\u021bii de cercetare", "d": "Niciun comportament nu a fost legat strict de markeri genetici: comportamentul nu e mo\u0219tenit per se, dar zestrea ereditar\u0103 poate facilita sau fr\u00e2na \u00eenv\u0103\u021barea. Teme: originea limbajului, personalitatea, boala mental\u0103, agresiunea, diferen\u021bele de gen, inteligen\u021ba. Direc\u021bii noi: epidemiologia genetic\u0103 a bolilor psihice; scanarea genomului pentru gene de predispozi\u021bie (boala maniaco-depresiv\u0103, schizofrenie, Alzheimer, alcoolism, autism); problemele etice ale discrimin\u0103rii genetice."}]}, {"titlu": "Bioetica", "noduri": [{"t": "Bioetica", "d": "Bios + ethos: etica \u0219tiin\u021belor vie\u021bii; se ocup\u0103 de consecin\u021bele etice ale performan\u021belor biomedicale, mai ales genetice (teste genetice, profil genetic, OMG, clonare), \u0219i caut\u0103 consensul dintre \u0219tiin\u021bific \u0219i etic. Reglement\u0103rile devin repede caduce \u0219i se reexamineaz\u0103. Jonas Salk: \u201eResponsabilitatea noastr\u0103 este s\u0103 fim buni str\u0103mo\u0219i!\u201d"}, {"t": "Declara\u021bia Universal\u0103 asupra Genomului Uman", "d": "Lansat\u0103 \u00een 1997 de Comitetul Interna\u021bional de Bioetic\u0103 UNESCO (la 50 de ani de la Carta Drepturilor Omului), cu 186 de state. Genomul uman e patrimoniu comun al umanit\u0103\u021bii; nimeni nu va fi discriminat dup\u0103 caracteristicile genetice; limite pentru interven\u021bii, ap\u0103rarea demnit\u0103\u021bii, respingerea determinismului genetic."}, {"t": "Principiile bioeticii", "d": "ADN-ul e \u201ecartea noastr\u0103 de identitate biologic\u0103\u201d, iar mostre l\u0103s\u0103m peste tot; cu amprentele genetice banalizate, folosirea lor devine incontrolabil\u0103 dac\u0103 nu se respect\u0103 autonomia, consim\u021b\u0103m\u00e2ntul informat \u0219i confiden\u021bialitatea."}]}, {"titlu": "Programul Genomul Uman", "noduri": [{"t": "Genom \u0219i proteom", "d": "Genom = totalitatea informa\u021biei genetice din ADN, aceea\u0219i \u00een toate celulele. Proteom = setul de proteine codificat; difer\u0103 \u00eentre celule, pentru c\u0103 activitatea genelor depinde de tipul de celul\u0103, \u021besut, etap\u0103 a vie\u021bii. Genomica: cartografierea, secven\u021bierea \u0219i analiza genomului (ordinea bazelor A, T, G, C, circa 3 miliarde de \u201elitere\u201d); proteomica: studiul proteinelor."}, {"t": "Desf\u0103\u0219urarea programului", "d": "\u00cenceput \u00een SUA \u00een 1989, demarat \u00een 1990 pe 15 ani, coordonat de HUGO, comparabil financiar cu programul Apollo. Finalizare anun\u021bat\u0103 \u00een aprilie 2003, devansat\u0103 datorit\u0103 automatiz\u0103rii \u0219i informaticii \u0219i intr\u0103rii firmei private Celera Genomics al\u0103turi de consor\u021biul public."}, {"t": "Pu\u021bine gene, multe proteine", "d": "Doar 25.000\u201335.000 de gene, de circa dou\u0103 ori c\u00e2t la musculi\u021ba de o\u021bet. Explica\u021bia: gene foarte eficiente, cu mai multe func\u021bii, care produc \u00een medie trei proteine. Peste 10.000 localizate pe cromozomi, circa 5000 cu func\u021bie cunoscut\u0103."}, {"t": "ADN-ul necodant", "d": "Gene distribuite neuniform (zone aglomerate \u0219i zone \u201ede\u0219ertice\u201d). Peste 90% din ADN nu codific\u0103 nicio gen\u0103, cu rost necunoscut; secven\u021bele repetitive sunt un document fosil al evolu\u021biei. \u00cen zonele necodante se acumuleaz\u0103 polimorfisme ADN, probabil legate de susceptibilitatea la boli comune \u0219i de r\u0103spunsul diferit la medicamente."}, {"t": "99,9% identic", "d": "99,9% din secven\u021bele genomului sunt identice la to\u021bi oamenii; 0,1% (circa 3 milioane de nucleotide) ne diferen\u021biaz\u0103 \u0219i explic\u0103 individualitatea. Urmeaz\u0103 elucidarea func\u021biilor genelor \u0219i medicina predictiv\u0103: \u201ecunoa\u0219te-\u021bi genomul\u201d."}]}]}, "sectiuni": [], "runde": [{"id": "1", "eticheta": "Runda 1 \u00b7 Baz\u0103", "titlu": "Runda 1 \u2014 Concepte de baz\u0103", "desc": "Teorie: concepte, deosebiri \u0219i principii, \u00een \u00eentreb\u0103ri directe.", "intrebari": [{"q": "Prin ce se deosebe\u0219te un caracter congenital de unul ereditar?", "opts": ["Congenitalul e mo\u0219tenit, dar se exprim\u0103 abia la v\u00e2rsta adult\u0103", "Congenitalul e produs de muta\u021bii ap\u0103rute \u00een game\u021bi", "Congenitalul e prezent la na\u0219tere, oricare i-ar fi cauza", "Congenitalul se transmite numai pe linie matern\u0103"], "correct": 2, "explain": "\u201eCongenital\u201d nu are nicio conota\u021bie de cauz\u0103: caracterul e prezent la na\u0219tere \u0219i poate fi \u00eenn\u0103scut sau dob\u00e2ndit \u00een via\u021ba intrauterin\u0103 (medicamente, radia\u021bii, virusuri). Un caracter mo\u0219tenit care se exprim\u0103 abia la adult descrie invers situa\u021bia unei boli ereditare necongenitale, iar muta\u021biile din game\u021bi \u021bin de bolile genetice.", "tag": "Congenital"}, {"q": "De ce nu orice boal\u0103 genetic\u0103 este \u0219i ereditar\u0103?", "opts": ["Poate fi produs\u0103 de un factor de mediu intrauterin", "Poate ap\u0103rea printr-o muta\u021bie nou\u0103, f\u0103r\u0103 p\u0103rin\u021bi purt\u0103tori", "Poate r\u0103m\u00e2ne mult timp nemanifestat\u0103, p\u00e2n\u0103 la v\u00e2rsta adult\u0103", "Poate fi tratat\u0103 prin diet\u0103 sau prin hormoni"], "correct": 1, "explain": "O boal\u0103 genetic\u0103 e ereditar\u0103 doar dac\u0103 e mo\u0219tenit\u0103; dac\u0103 apare dup\u0103 o muta\u021bie nou\u0103 la embrion sau la gamet, f\u0103r\u0103 ca p\u0103rin\u021bii s\u0103 fie purt\u0103tori, e genetic\u0103 dar neereditar\u0103 (sindromul Down, de regul\u0103). Factorul de mediu intrauterin explic\u0103 un caracter congenital negenetic, debutul tardiv prive\u0219te rela\u021bia ereditar\u2013congenital, iar tratamentul nu schimb\u0103 natura bolii.", "tag": "Genetic"}, {"q": "Care dintre urm\u0103toarele boli e ereditar\u0103, dar nu congenital\u0103?", "opts": ["Coreea Huntington", "Sindromul Down", "Sifilisul congenital", "Buza de iepure"], "correct": 0, "explain": "Coreea Huntington e mo\u0219tenit\u0103, dar anomalia din genom se exprim\u0103 mult dup\u0103 na\u0219tere, deci nu e congenital\u0103. Sindromul Down e, de regul\u0103, genetic dar neereditar; sifilisul congenital e dob\u00e2ndit prin contaminare feto-matern\u0103; buza de iepure e o malforma\u021bie congenital\u0103 multifactorial\u0103.", "tag": "Ereditar"}, {"q": "Ce principiu ilustreaz\u0103 exemplul fenilcetonuriei, prevenit\u0103 prin depistare la na\u0219tere \u0219i diet\u0103?", "opts": ["Congenital nu \u00eenseamn\u0103 ereditar", "Ereditar nu \u00eenseamn\u0103 inevitabil", "Genetic nu \u00eenseamn\u0103 ereditar", "Familial nu \u00eenseamn\u0103 mendelian"], "correct": 1, "explain": "Fenilcetonuria e o boal\u0103 ereditar\u0103 care, netratat\u0103, duce la retard sever, dar se poate preveni printr-un regim f\u0103r\u0103 fenilalanin\u0103: manifestarea unei boli genetice poate fi influen\u021bat\u0103 de mediu. Celelalte trei distinc\u021bii sunt reale, dar \u021bin de alte exemple: sifilisul congenital, sindromul Down, bolile comune ale adultului.", "tag": "Ereditar nu \u00eenseamn\u0103 inevitabil"}, {"q": "Ce caractere sunt folosite \u00een expertiza paternit\u0103\u021bii, fiind determinate strict genetic?", "opts": ["Grupele sanguine \u0219i grupele tisulare HLA", "Talia \u0219i culoarea pielii", "Dermatoglifele \u0219i dezvoltarea muscular\u0103", "Enzimele \u0219i predispozi\u021bia la boli comune"], "correct": 0, "explain": "Caracterele individualit\u0103\u021bii biologice (grupe sanguine, grupe tisulare, proteine serice, enzime) au determinism genetic, monogenic, \u0219i sunt foarte polimorfe, deci servesc la identificare \u0219i la expertiza paternit\u0103\u021bii. Talia, dermatoglifele, culoarea pielii \u0219i dezvoltarea muscular\u0103 sunt influen\u021bate \u0219i de mediu, iar predispozi\u021bia la boli comune e multifactorial\u0103.", "tag": "Determinism exclusiv genetic"}, {"q": "Ce rol au genele \u00een bolile comune ale adultului, cum ar fi diabetul zaharat?", "opts": ["Produc singure boala, dup\u0103 un tipar mendelian dominant clasic", "Au un rol neglijabil, boala \u021bin\u00e2nd de stilul de via\u021b\u0103", "Produc boala de la na\u0219tere, cu manifestare tardiv\u0103", "Dau o vulnerabilitate, care devine boal\u0103 doar cu mediul"], "correct": 3, "explain": "\u00cen bolile comune ale adultului, factorii genetici realizeaz\u0103 doar o predispozi\u021bie, care se transform\u0103 \u00een boal\u0103 prin interac\u021biunea cu mediul; nu to\u021bi cei predispu\u0219i se \u00eemboln\u0103vesc. Boala nu se transmite mendelian, dar are concentrare familial\u0103, pentru c\u0103 genele de susceptibilitate se transmit \u00een familie: rolul lor nu e neglijabil.", "tag": "Predispozi\u021bia genetic\u0103"}, {"q": "Ce exprim\u0103 afirma\u021bia lui Claude Bernard: \u201emicrobul nu-i nimic, terenul este totul\u201d?", "opts": ["Bolile infec\u021bioase se transmit ereditar \u00een familii", "Mediul de via\u021b\u0103 al bolnavului conteaz\u0103 mai mult dec\u00e2t microbul", "Microbii produc muta\u021bii care devin apoi ereditare", "R\u0103spunsul la boal\u0103 depinde de structura genetic\u0103 a fiec\u0103ruia"], "correct": 3, "explain": "Chiar \u0219i bolile produse de agen\u021bi din mediu sunt influen\u021bate de structura genetic\u0103 a fiec\u0103rui individ, care determin\u0103 un r\u0103spuns specific: \u00een epidemii nu se \u00eemboln\u0103vesc to\u021bi expu\u0219ii. De aceea aproape nu exist\u0103 caractere strict ecologice. Infec\u021biile nu se transmit ereditar, iar \u201eterenul\u201d nu \u00eenseamn\u0103 mediul de via\u021b\u0103.", "tag": "Determinism exclusiv ecologic"}, {"q": "Care grup cuprinde caractere multifactoriale normale, produse de mai multe gene \u0219i mai mul\u021bi factori de mediu?", "opts": ["\u00cen\u0103l\u021bimea, greutatea \u0219i inteligen\u021ba", "Hemofilia, albinismul \u0219i acondroplazia", "Diabetul, ulcerul \u0219i boala coronarian\u0103", "Infec\u021biile, intoxica\u021biile \u0219i accidentele"], "correct": 0, "explain": "Caracterele cantitative (\u00een\u0103l\u021bimea, greutatea, inteligen\u021ba) sunt exemplele de caractere multifactoriale normale: ereditatea d\u0103 doar un poten\u021bial. Diabetul, ulcerul \u0219i boala coronarian\u0103 sunt tot multifactoriale, dar anormale; hemofilia, albinismul \u0219i acondroplazia sunt determinate genetic, iar infec\u021biile \u0219i accidentele \u021bin de mediu.", "tag": "Determinism eco-genetic"}, {"q": "Ce rol au genele reglatoare, una dintre descoperirile care au schimbat conceptul de gen\u0103?", "opts": ["Codific\u0103 direct proteinele structurale \u0219i enzimele celulei", "Sunt segmente necodante eliminate din mesaj", "Poart\u0103 polimorfisme f\u0103r\u0103 efecte vizibile", "Activeaz\u0103 sau suprim\u0103 ac\u021biunea genelor codificatoare"], "correct": 3, "explain": "Genele reglatoare nu sunt traduse \u00een proteine pe care s\u0103 le putem urm\u0103ri, ci activeaz\u0103 sau suprim\u0103 ac\u021biunea genelor codificatoare; s-au dovedit mai numeroase dec\u00e2t se credea. Proteinele sunt codificate de genele codificatoare, segmentele eliminate din mesaj sunt intronii, iar polimorfismele se acumuleaz\u0103 \u00een ADN-ul necodant.", "tag": "Bre\u0219ele dogmei centrale"}, {"q": "Care sunt principalele surse ale variabilit\u0103\u021bii genetice?", "opts": ["Muta\u021biile \u0219i influen\u021bele mediului intrauterin", "Muta\u021biile \u0219i recombin\u0103rile de la formarea game\u021bilor", "Recombin\u0103rile \u0219i diferen\u021bele de proteom", "Influen\u021bele mediului \u0219i diferen\u021bele de educa\u021bie"], "correct": 1, "explain": "Variabilitatea genetic\u0103 are dou\u0103 surse: muta\u021biile \u0219i recombin\u0103rile genetice care au loc la formarea game\u021bilor. Influen\u021bele mediului (intrauterin, educa\u021bional) produc variabilitate nongenetic\u0103, iar proteomul difer\u0103 \u00eentre celulele aceluia\u0219i om f\u0103r\u0103 ca genele s\u0103 difere.", "tag": "Variabilitatea genetic\u0103"}, {"q": "Prin ce se deosebe\u0219te fenotipul de genotip?", "opts": ["Fenotipul e constant, genotipul se schimb\u0103 cu v\u00e2rsta", "Fenotipul \u021bine de ereditate, genotipul de mediu", "Fenotipul e variabil, genotipul e constant toat\u0103 via\u021ba", "Fenotipul se deduce, genotipul se vede direct"], "correct": 2, "explain": "Genotipul se stabile\u0219te la fecunda\u021bie \u0219i r\u0103m\u00e2ne constant; fenotipul, poten\u021bial variabil, se afl\u0103 la confluen\u021ba eredit\u0103\u021bii cu mediul \u0219i descrie starea organismului la un moment dat. Genotipul e accesibil doar prin fenotip, nu invers, iar mediul ac\u021bioneaz\u0103 asupra fenotipului.", "tag": "Fenotipul"}, {"q": "Ce fenomen e considerat o dovad\u0103 indirect\u0103 a unicit\u0103\u021bii genotipului fiec\u0103rui om?", "opts": ["Diferen\u021bele de \u00een\u0103l\u021bime dintre gemenii identici", "Respingerea grefelor provenite de la al\u021bi oameni", "Concentrarea familial\u0103 a bolilor comune", "Varia\u021bia proteomului de la un \u021besut la altul"], "correct": 1, "explain": "\u201eXenofobia organic\u0103\u201d, respingerea oric\u0103rui \u021besut str\u0103in \u0219i rezisten\u021ba imunologic\u0103 la grefe, arat\u0103 c\u0103 fiecare are o individualitate genetic\u0103 unic\u0103. Diferen\u021bele dintre gemenii identici \u021bin de mediu, deci de fenotip; concentrarea familial\u0103 \u0219i varia\u021bia proteomului nu privesc unicitatea genotipului.", "tag": "Genotipul"}, {"q": "Prin ce se deosebe\u0219te genomul de proteom?", "opts": ["Genomul e acela\u0219i \u00een toate celulele, proteomul difer\u0103", "Proteomul e acela\u0219i \u00een toate celulele, genomul difer\u0103", "Genomul e ADN-ul codant, proteomul cel necodant", "Genomul e mo\u0219tenit, proteomul se formeaz\u0103 din mediu"], "correct": 0, "explain": "Genomul, totalitatea informa\u021biei genetice din ADN, e acela\u0219i \u00een toate celulele organismului; proteomul, setul de proteine codificat de genom, difer\u0103 dup\u0103 tipul de celul\u0103, \u021besut \u0219i etapa vie\u021bii, pentru c\u0103 activitatea genelor e diferen\u021biat\u0103. Proteomul nu e un tip de ADN \u0219i nu vine din mediu.", "tag": "Genom \u0219i proteom"}, {"q": "Cum trateaz\u0103 genetica comportamental\u0103 un comportament, de pild\u0103 timiditatea?", "opts": ["Ca genotip: constitu\u021bia genetic\u0103 a individului", "Ca tr\u0103s\u0103tur\u0103 mo\u0219tenit\u0103 ca atare de la p\u0103rin\u021bi", "Ca fenotip: o caracteristic\u0103 observabil\u0103 \u0219i m\u0103surabil\u0103", "Ca produs al mediului, f\u0103r\u0103 vreo baz\u0103 genetic\u0103"], "correct": 2, "explain": "Pentru genetica comportamental\u0103, comportamentul e un fenotip: o caracteristic\u0103 observabil\u0103, pe care o putem m\u0103sura, chiar dac\u0103 dificil. Genotipul e accesibil doar prin fenotip; comportamentul nu e mo\u0219tenit per se, dar nici nu e lipsit de baz\u0103 ereditar\u0103.", "tag": "Comportamentul ca fenotip"}, {"q": "Cum se explic\u0103 faptul c\u0103 omul are doar de circa dou\u0103 ori mai multe gene dec\u00e2t musculi\u021ba de o\u021bet?", "opts": ["Multe gene umane nu au fost \u00eenc\u0103 identificate", "Complexitatea uman\u0103 \u021bine mai ales de cultur\u0103", "Genele umane produc \u00een medie c\u00e2te trei proteine", "Genele umane sunt mult mai lungi dec\u00e2t la insecte"], "correct": 2, "explain": "Rezultatele Programului Genomul Uman (25.000\u201335.000 de gene) se explic\u0103 prin func\u021bionarea foarte eficient\u0103 a genelor umane, care au mai multe func\u021bii \u0219i produc \u00een medie trei proteine pe gen\u0103, nu una, ca la alte specii. De aici \u0219i precau\u021biile legate de manipul\u0103rile genetice la om.", "tag": "Pu\u021bine gene, multe proteine"}]}, {"id": "2", "eticheta": "Runda 2 \u00b7 Aplica\u021bii", "titlu": "Runda 2 \u2014 Scenarii \u0219i ra\u021bionament", "desc": "Situa\u021bii cu mai mul\u021bi pa\u0219i: interpretezi cazuri, corectezi ra\u021bionamente, explici mecanisme.", "intrebari": [{"q": "\u00centr-o \u021bar\u0103, \u00een\u0103l\u021bimea medie a recru\u021bilor a crescut cu 8 cm \u00een 60 de ani, timp \u00een care popula\u021bia s-a schimbat foarte pu\u021bin genetic. Un student conclude c\u0103 \u00een\u0103l\u021bimea nu e ereditar\u0103. Unde gre\u0219e\u0219te?", "opts": ["Cre\u0219terea arat\u0103 c\u0103 \u00een popula\u021bie au ap\u0103rut muta\u021bii noi favorabile", "\u00cen\u0103l\u021bimea e strict genetic\u0103, deci datele sunt eronate", "Cre\u0219terea vine dintr-o recombinare genetic\u0103 mai intens\u0103", "Ereditatea d\u0103 un poten\u021bial, mediul decide c\u00e2t se realizeaz\u0103"], "correct": 3, "explain": "\u00cen\u0103l\u021bimea e un caracter multifactorial, condi\u021bionat genetic \u00een propor\u021bie mare, dar atingerea limitei superioare depinde de mediu; de aceea a crescut peste tot unde condi\u021biile socio-economice s-au \u00eembun\u0103t\u0103\u021bit. Muta\u021biile \u0219i recombinarea nu schimb\u0103 media unei popula\u021bii \u00een dou\u0103 genera\u021bii, iar ideea unui caracter strict genetic contrazice chiar datele.", "tag": "Determinism eco-genetic"}, {"q": "Un medic afl\u0103 c\u0103 pacientul s\u0103u de 45 de ani are hipertensiune arterial\u0103 primar\u0103, ca tat\u0103l \u0219i bunicul lui. De ce \u00ee\u0219i extinde aten\u021bia la fra\u021bii \u0219i copiii pacientului?", "opts": ["Boala se transmite dominant, deci jum\u0103tate din rude vor fi afectate", "Genele de susceptibilitate se transmit \u00een familie, f\u0103r\u0103 tipar mendelian", "Hipertensiunea e congenital\u0103 \u0219i se poate depista \u00eenc\u0103 de la na\u0219tere", "Rudele au acela\u0219i mediu de via\u021b\u0103, deci vor face sigur \u0219i ele aceea\u0219i boal\u0103"], "correct": 1, "explain": "Bolile comune ale adultului au concentrare familial\u0103 pentru c\u0103 genele de susceptibilitate (de obicei \u00een num\u0103r necunoscut) se transmit \u00een familie, de\u0219i nu dup\u0103 legile lui Mendel; de aceea atribu\u021biile medicului se extind de la bolnav la familie, pentru depistarea celor predispu\u0219i \u0219i evitarea factorilor de mediu. Un raport de 1/2 ar cere transmitere monogenic\u0103 dominant\u0103, iar predispozi\u021bia nu e o certitudine.", "tag": "Predispozi\u021bia genetic\u0103"}, {"q": "Doi copii au aceea\u0219i boal\u0103 metabolic\u0103 ereditar\u0103 care duce la retard. Primul e depistat la na\u0219tere \u0219i prime\u0219te imediat dieta potrivit\u0103, al doilea nu e diagnosticat. Doar al doilea dezvolt\u0103 retard sever. Ce arat\u0103 cazul?", "opts": ["\u0218i o boal\u0103 monogenic\u0103 poate fi modelat\u0103 de factori de mediu", "Boala primului copil nu era, de fapt, una de natur\u0103 ereditar\u0103", "Retardul e produs de mediu, iar gena are un rol secundar", "Muta\u021bia s-a corectat la copilul care a primit dieta"], "correct": 0, "explain": "Exemplul fenilcetonuriei: caracterele cu determinism genetic pot fi influen\u021bate de terapie, deci de condi\u021bii de mediu; \u201eereditar nu \u00eenseamn\u0103 inevitabil\u201d. Ambii copii au aceea\u0219i muta\u021bie, care nu se corecteaz\u0103 prin diet\u0103; f\u0103r\u0103 gen\u0103 nu ar exista boala, deci nici explica\u021bia strict prin mediu nu \u021bine.", "tag": "Ereditar nu \u00eenseamn\u0103 inevitabil"}, {"q": "La \u00eenceputul secolului XX, un medic numea \u201eeredosifilis\u201d sifilisul unui nou-n\u0103scut infectat de mam\u0103 \u00een timpul sarcinii. \u00cen ce const\u0103 eroarea?", "opts": ["Boala era genetic\u0103, dar f\u0103r\u0103 s\u0103 fie \u0219i congenital\u0103", "Sifilisul e o boal\u0103 ereditar\u0103 cu debut tardiv", "Confund\u0103 transmiterea feto-matern\u0103 cu transmiterea ereditar\u0103", "Termenul potrivit ar fi fost cel de boal\u0103 genetic\u0103, nu ereditar\u0103"], "correct": 2, "explain": "Sifilisul nou-n\u0103scutului e congenital (prezent la na\u0219tere), dar produs de contaminarea feto-matern\u0103, deci dob\u00e2ndit \u00een via\u021ba intrauterin\u0103, nu mo\u0219tenit prin gene. Nu e nici genetic, nici ereditar; boala nu \u021bine de genom, iar debutul tardiv e tr\u0103s\u0103tura altui exemplu, coreea Huntington.", "tag": "Congenital"}, {"q": "Un cuplu s\u0103n\u0103tos are un copil cu o boal\u0103 genetic\u0103 produs\u0103 de o muta\u021bie ap\u0103rut\u0103 \u00een embrion. Rudele se tem c\u0103 boala \u201ee \u00een familie\u201d \u0219i c\u0103 \u00eei va afecta \u0219i pe ceilal\u021bi nepo\u021bi. Ce le po\u021bi spune?", "opts": ["E ereditar\u0103, deci unul dintre p\u0103rin\u021bi e purt\u0103tor ascuns", "E genetic\u0103, dar nu mo\u0219tenit\u0103: p\u0103rin\u021bii nu sunt purt\u0103tori", "E congenital\u0103, deci produs\u0103 de mediul din timpul sarcinii", "E multifactorial\u0103, deci fra\u021bii au un risc mult crescut"], "correct": 1, "explain": "O boal\u0103 genetic\u0103 poate s\u0103 nu fie ereditar\u0103 dac\u0103 apare dup\u0103 o muta\u021bie nou\u0103 la embrion sau la gamet, f\u0103r\u0103 ca vreun p\u0103rinte s\u0103 fie purt\u0103tor. A o numi congenital\u0103 spune doar c\u0103 e prezent\u0103 la na\u0219tere, nu c\u0103 e produs\u0103 de mediu; multifactorial\u0103 ar fi o boal\u0103 cu gene de susceptibilitate transmise \u00een familie.", "tag": "Genetic"}, {"q": "Un ziarist \u00eentreab\u0103: \u201eC\u00e2t la sut\u0103 din agresivitatea unui adolescent vine din gene \u0219i c\u00e2t din mediu?\u201d Un genetician r\u0103spunde cu exemplul suprafe\u021bei unui dreptunghi. Ce vrea s\u0103 arate?", "opts": ["Contribu\u021biile celor doi se pot aduna ca procente separate", "Cei doi factori sunt necesari \u0219i se intercondi\u021bioneaz\u0103", "Mediul conteaz\u0103 doar acolo unde genele lipsesc", "Genele fixeaz\u0103 forma, iar mediul doar m\u0103rimea"], "correct": 1, "explain": "Suprafa\u021ba nu exist\u0103 f\u0103r\u0103 lungime \u0219i l\u0103\u021bime \u0219i se schimb\u0103 dac\u0103 se schimb\u0103 oricare dintre ele: la fel, comportamentul e determinat de ereditate \u0219i de mediu, care interac\u021bioneaz\u0103 \u0219i se intercondi\u021bioneaz\u0103. De aceea \u00eentrebarea \u201ec\u00e2t la sut\u0103\u201d e gre\u0219it pus\u0103: contribu\u021biile nu se adun\u0103 separat, iar mediul nu intervine doar unde \u201elipsesc\u201d genele.", "tag": "Analogia dreptunghiului"}, {"q": "Un inculpat invoc\u0103 \u201egenele lui\u201d ca scuz\u0103 pentru o fapt\u0103 violent\u0103, sus\u021bin\u00e2nd c\u0103 nu a fost liber s\u0103 aleag\u0103. Ce obiec\u021bie i se poate aduce din perspectiva lui Lewontin?", "opts": ["Genele violen\u021bei au fost g\u0103site pe cromozomul X, deci scuza lui e valabil\u0103", "Comportamentul e mo\u0219tenit ca atare, deci r\u0103spunderea e a p\u0103rin\u021bilor", "Doar mediul social explic\u0103 faptele, deci vinovat\u0103 e societatea", "Opusul libert\u0103\u021bii e coerci\u021bia, iar biologia ne face creatori ai mediului"], "correct": 3, "explain": "Lewontin arat\u0103 c\u0103 biologia uman\u0103 (creierul, m\u00e2inile, limbajul) ne face independen\u021bi de multe caracteristici ale mediului \u0219i creatori care \u00eel recreeaz\u0103: \u201ebiologia ne face liberi\u201d; \u00een plus, opusul libert\u0103\u021bii nu e determinismul, ci coerci\u021bia. Ideea unei gene pe cromozomul X aminte\u0219te de specula\u021biile eugeniste ale lui Davenport, iar comportamentul nu e mo\u0219tenit per se.", "tag": "Lewontin: biologia ne face liberi"}, {"q": "Fratele vitreg al lui Leonardo da Vinci, care \u00eel venera, s-a \u00eensurat cu o \u021b\u0103ranc\u0103 din Vinci asem\u0103n\u0103toare mamei lui Leonardo, sper\u00e2nd s\u0103 aib\u0103 un urma\u0219 ca Leonardo. Fiul lor a devenit un sculptor de oarecare talent. Ce scap\u0103 din vedere acest \u201eexperiment\u201d?", "opts": ["Talentul se transmite cultural, deci genele nu au contat", "Fiecare urma\u0219 prime\u0219te o combina\u021bie genetic\u0103 nou\u0103, \u00eent\u00e2mpl\u0103toare", "Tr\u0103s\u0103turile tat\u0103lui trec mai ales la fiice, nu la fii", "Mama aleas\u0103 nu avea, de fapt, genele mamei lui Leonardo"], "correct": 1, "explain": "La fiecare concep\u021bie, game\u021bii p\u0103rin\u021bilor aduc alt\u0103 combina\u021bie de gene, prin recombinare: fiecare om e o experien\u021b\u0103 unic\u0103, irepetabil\u0103, decis\u0103 la fecunda\u021bie, deci un urma\u0219 nu poate fi \u201eplanificat\u201d dup\u0103 un model. Chiar cu o mam\u0103 identic\u0103 genetic, combina\u021bia ar fi fost alta. Talentul nu e strict cultural, iar \u201eereditatea \u00eencruci\u0219at\u0103\u201d e o prejudecat\u0103.", "tag": "Variabilitatea genetic\u0103"}, {"q": "Un ministru sus\u021bine c\u0103 to\u021bi copiii se nasc cu acelea\u0219i posibilit\u0103\u021bi \u0219i c\u0103 diferen\u021bele \u0219colare vin numai din s\u0103r\u0103cie \u0219i din familie. De aceea respinge orice form\u0103 de \u00eenv\u0103\u021b\u0103m\u00e2nt diferen\u021biat. Ce orientare reflect\u0103 \u0219i ce i-ar obiecta genetica comportamental\u0103?", "opts": ["Ambientalism; ignor\u0103 diferen\u021bele interindividuale ereditare", "Eugenism; supraestimeaz\u0103 rolul eredit\u0103\u021bii \u00een reu\u0219ita \u0219colar\u0103", "Psihogenetic\u0103; neag\u0103 rolul educa\u021biei \u00een formarea aptitudinilor", "Darwinism social; propune selec\u021bia elevilor dup\u0103 origine"], "correct": 0, "explain": "Doctrina uniformit\u0103\u021bii esen\u021biale a copiilor la na\u0219tere \u021bine de teoriile ambientaliste (\u0219i de behaviorism), dup\u0103 care comportamentul e modelat decisiv de mediu. Genetica comportamental\u0103 r\u0103spunde c\u0103 diferen\u021bele interindividuale au \u0219i baz\u0103 ereditar\u0103, iar politica educa\u021bional\u0103 ar trebui s\u0103 diferen\u021bieze \u00eenv\u0103\u021b\u0103m\u00e2ntul dup\u0103 posibilit\u0103\u021bile elevilor. Eugenismul \u0219i darwinismul social spun opusul ministrului.", "tag": "Eugenismul \u0219i ambientalismul"}, {"q": "O client\u0103 e foarte anxioas\u0103 de mic\u0103, la fel ca mama ei. Psihoterapeutul nu \u00eencearc\u0103 s\u0103-i schimbe temperamentul, ci o ajut\u0103 s\u0103 g\u0103seasc\u0103 strategii care \u021bin cont de el. Ce consecin\u021b\u0103 a studierii diferen\u021belor interindividuale aplic\u0103?", "opts": ["Identific\u0103 datele \u00eenn\u0103scute, care nu se pot schimba, \u0219i caut\u0103 alte c\u0103i", "Trateaz\u0103 anxietatea ca rezultat al educa\u021biei primite, deci reversibil\u0103", "Consider\u0103 anxietatea ereditar\u0103, deci inevitabil\u0103 \u0219i f\u0103r\u0103 tratament posibil", "Atribuie anxietatea unei gene unice a mamei, transmise mendelian"], "correct": 0, "explain": "Pentru psihoterapie, \u00een\u021belegerea aspectelor \u00eenn\u0103scute ale personalit\u0103\u021bii duce la identificarea datelor care nu pot fi schimbate \u0219i la orientarea spre c\u0103i mai eficiente de rezolvare. A le trata drept simplu efect al educa\u021biei ignor\u0103 baza ereditar\u0103; \u201eereditar\u201d nu \u00eenseamn\u0103 \u00eens\u0103 \u201ef\u0103r\u0103 solu\u021bie\u201d, iar o tr\u0103s\u0103tur\u0103 complex\u0103 e pu\u021bin probabil monogenic\u0103.", "tag": "Diferen\u021bele interindividuale"}, {"q": "Doi copii au am\u00e2ndoi ochii c\u0103prui. Un student conclude c\u0103 au, sigur, acela\u0219i genotip pentru culoarea ochilor. Ce-i scap\u0103?", "opts": ["Culoarea ochilor \u021bine mai ales de mediu, nu de genotip", "Genotipul copiilor se modific\u0103 odat\u0103 cu v\u00e2rsta", "Acela\u0219i fenotip poate ascunde genotipuri diferite", "Fenotipul se mo\u0219tene\u0219te direct, f\u0103r\u0103 genotip"], "correct": 2, "explain": "Genotipul nu poate fi dedus cu precizie din structura morfologic\u0103: el e accesibil doar prin fenotip, dar fenotipul e starea final\u0103 a caracterului, care nu arat\u0103 ce alele se afl\u0103 \u00een spate (partitura fa\u021b\u0103 de simfonie). Genotipul e constant toat\u0103 via\u021ba, iar culoarea ochilor e un caracter ereditar.", "tag": "Genotipul se vede prin fenotip"}, {"q": "Un cercet\u0103tor constat\u0103 c\u0103 aceea\u0219i secven\u021b\u0103 de ADN d\u0103 o protein\u0103 \u00een ficat \u0219i alta \u00een creier. Ce descoperire, care a schimbat chiar conceptul de gen\u0103, explic\u0103 observa\u021bia?", "opts": ["Genele reglatoare sunt traduse \u00een proteine diferite \u00een fiecare organ", "Ficatul \u0219i creierul au genoame u\u0219or diferite", "O muta\u021bie a modificat gena \u00een celulele creierului", "Exonii sunt decupa\u021bi \u0219i citi\u021bi diferit dup\u0103 tipul de celul\u0103"], "correct": 3, "explain": "Decuparea \u0219i citirea segmentelor codante (exonii) depind de tipul de celul\u0103 sau de starea ei, iar o gen\u0103 poate fi \u201ecitit\u0103\u201d diferit \u0219i poate codifica proteine diferite; de aceea gena a devenit \u201eo entitate func\u021bional\u0103 labil\u0103\u201d. Genele reglatoare nu sunt traduse \u00een proteine, iar genomul e acela\u0219i \u00een toate celulele.", "tag": "Bre\u0219ele dogmei centrale"}, {"q": "Doi pacien\u021bi cu acela\u0219i diagnostic r\u0103spund foarte diferit la acela\u0219i medicament, de\u0219i genele enzimelor implicate sunt identice la ei. Unde ar c\u0103uta un genetician explica\u021bia, dup\u0103 constat\u0103rile Programului Genomul Uman?", "opts": ["\u00cen num\u0103rul diferit de gene al celor doi", "\u00cen proteomul, identic la to\u021bi oamenii", "\u00cen polimorfismele ADN din zonele necodante", "\u00cen cromozomii suplimentari ai unuia"], "correct": 2, "explain": "Variantele f\u0103r\u0103 efecte vizibile care se acumuleaz\u0103 \u00een zonele necodante, polimorfismele ADN, sunt considerate probabil responsabile de susceptibilitatea la boli comune \u0219i de r\u0103spunsul diferen\u021biat la medicamente. Num\u0103rul de gene e acela\u0219i la to\u021bi oamenii, proteomul difer\u0103 chiar \u00eentre celulele aceluia\u0219i om, iar o anomalie cromozomial\u0103 nu ar trece neobservat\u0103.", "tag": "ADN-ul necodant"}, {"q": "Un student spune: \u201eDac\u0103 99,9% din genom e identic la to\u021bi oamenii, diferen\u021bele dintre noi trebuie s\u0103 fie doar de mediu.\u201d Ce \u00eei r\u0103spunzi?", "opts": ["Genomul a doi oameni ne\u00eenrudi\u021bi difer\u0103 de fapt cu 10%", "Diferen\u021bele vin din num\u0103rul diferit de cromozomi", "Cele 0,1% \u00eenseamn\u0103 totu\u0219i milioane de nucleotide variabile", "Diferen\u021bele \u021bin numai de ADN-ul codant al fiec\u0103ruia"], "correct": 2, "explain": "Procentul de 0,1% care ne diferen\u021biaz\u0103 \u00eenseamn\u0103 circa 3 milioane de nucleotide, variabile la r\u00e2ndul lor, c\u0103rora li se atribuie individualitatea \u0219i unicitatea fiec\u0103ruia. Ideea unei diferen\u021be de 10% exagereaz\u0103, num\u0103rul de cromozomi e acela\u0219i, iar variantele se g\u0103sesc mai ales \u00een ADN-ul necodant.", "tag": "99,9% identic"}, {"q": "Programul Genomul Uman a fost demarat \u00een 1990, planificat pentru 15 ani, dar finalizarea a fost anun\u021bat\u0103 \u00een aprilie 2003. Ce a permis devansarea?", "opts": ["Automatizarea, informatica \u0219i intrarea \u00een scen\u0103 a Celera Genomics", "Renun\u021barea la secven\u021bierea ADN-ului necodant al genomului", "Num\u0103rul de gene mult mai mic dec\u00e2t cel estimat ini\u021bial", "Reglement\u0103rile bioetice adoptate de UNESCO \u00een anul 1997"], "correct": 0, "explain": "Finalizarea a fost devansat\u0103 datorit\u0103 progreselor automatiz\u0103rii \u0219i informaticii \u0219i intr\u0103rii, al\u0103turi de consor\u021biul public interna\u021bional coordonat de HUGO, a unei firme private americane, Celera Genomics. Num\u0103rul mic de gene e un rezultat al programului, nu o cauz\u0103 a gr\u0103birii; Declara\u021bia UNESCO prive\u0219te etica, nu ritmul secven\u021bierii.", "tag": "Desf\u0103\u0219urarea programului"}]}]}, {"nr": 2, "titlu": "Ereditatea mendelian\u0103: legile lui Mendel", "harta": {"centru": "Ereditatea mendelian\u0103: legile lui Mendel", "ramuri": [{"titlu": "Teoria mendelian\u0103", "noduri": [{"t": "Mendel \u0219i hibridarea", "d": "Gregor Mendel, c\u0103lug\u0103r \u0219i matematician din Brno, a publicat \u00een 1865 experien\u021bele de hibridare (\u00eencruci\u0219are \u00eentre indivizi genetic diferi\u021bi) cu soiuri de maz\u0103re. Noutatea: a num\u0103rat descenden\u021bii, deci a permis previziuni statistice. A v\u0103zut \u201efactorii ereditari\u201d (genele) ca particule distincte care nu se amestec\u0103, contra teoriei amestecului. Teoria a fost confirmat\u0103 de teoria cromozomial\u0103 \u0219i de genetica molecular\u0103."}, {"t": "Caractere mendeliene", "d": "Cele mai simple caractere genetice: prezen\u021ba lor depinde de genotipul de pe un singur locus (ereditate monogenic\u0103). Dac\u0103 o tr\u0103s\u0103tur\u0103 uman\u0103 urmeaz\u0103 tiparele mendeliene, baza ei genetic\u0103 e sigur\u0103."}, {"t": "Conceptele cheie", "d": "Fiecare individ are o pereche de gene pentru o tr\u0103s\u0103tur\u0103 (una de la mam\u0103, una de la tat\u0103); fiecare descendent prime\u0219te la \u00eent\u00e2mplare una dintre ele, cu probabilitate \u00bd; alelele r\u0103m\u00e2n distincte, \u201enecontaminate\u201d: o alel\u0103 A transmis\u0103 de un p\u0103rinte AA nu difer\u0103 de una transmis\u0103 de un p\u0103rinte Aa."}, {"t": "Homozigot \u0219i heterozigot", "d": "Locus = pozi\u021bia genei pe cromozom; alele = variantele de pe acela\u0219i locus, notate cu aceea\u0219i liter\u0103 (A, a). Homozigot: dou\u0103 alele identice (AA, aa); heterozigot: dou\u0103 alele diferite (Aa). Cromozomi omologi: pereche cu aceea\u0219i morfologie \u0219i acela\u0219i con\u021binut de gene."}]}, {"titlu": "Monohibridarea \u0219i legea I", "lat": true, "figuri": [{"titlu": "Monohibridarea \u00een trei genera\u021bii (gust\u0103tori PTC)", "nota": "Redesenat\u0103 dup\u0103 figura din manual. Albastru = fenotip dominant (gust\u0103tor), portocaliu = recesiv (negust\u0103tor).", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 300\" role=\"img\" aria-label=\"Monohibridarea: GG \u00d7 gg d\u0103 \u00een F1 numai Gg; Gg \u00d7 Gg d\u0103 \u00een F2 GG, Gg, Gg, gg, adic\u0103 3 la 1 dup\u0103 fenotip\" font-family=\"Georgia, serif\" font-size=\"13\"><text x=\"8.0\" y=\"44.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.8\" font-weight=\"bold\">P</text><text le\" fill=\"#ffffff\" font-size=\"12.0\" font-weight=\"bold\">gg</text><text x=\"90.0\" y=\"198.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.8\">\u00bc GG \u00b7 \u00bd Gg \u00b7 \u00bc gg</text><text x=\"90.0\" y=\"212.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.8\">3 : 1 dup\u0103 fenotip</text><text x=\"258.0\" y=\"198.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.8\">\u00bd Gg \u00b7 \u00bd gg</text><text x=\"258.0\" y=\"212.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.8\">1 : 1 dup\u0103 fenotip</text><rect x=\"52.0\" y=\"226.0\" width=\"10.0\" height=\"10.0\" fill=\"#2a78d6\"></rect><text x=\"66.0\" y=\"235.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">gust\u0103tor (G_)</text><rect x=\"160.6\" y=\"226.0\" width=\"10.0\" height=\"10.0\" fill=\"#eb6834\"></rect><text x=\"174.6\" y=\"235.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">negust\u0103tor (gg)</text></svg>"}], "noduri": [{"t": "Monohibridarea", "d": "\u00cencruci\u0219area \u00eentre p\u0103rin\u021bi care difer\u0103 printr-o singur\u0103 pereche de caractere, urm\u0103rit\u0103 pe mai multe genera\u021bii. Exemplu: gustul amar al PTC (circa 70% gust\u0103tori, 30% negust\u0103tori la albi). P: GG \u00d7 gg \u2192 F1: to\u021bi Gg \u2192 F1 \u00d7 F1 \u2192 F2."}, {"t": "Uniformitatea hibrizilor din F1", "d": "To\u021bi hibrizii din F1 sunt la fel \u0219i arat\u0103 caracterul dominant. Aten\u021bie la prejudec\u0103\u021bi: p\u0103rin\u021bii nu transmit direct caracterele, iar prezen\u021ba genei nu asigur\u0103 caracterul (g nu se manifest\u0103 la Gg)."}, {"t": "Dominant \u0219i recesiv", "d": "Gena dominant\u0103 se manifest\u0103 la heterozigot (majuscul\u0103 sau +); gena recesiv\u0103 e mascat\u0103 de alela dominant\u0103 \u0219i se manifest\u0103 doar la homozigot (liter\u0103 mic\u0103 sau \u2212)."}, {"t": "Principiul reciprocit\u0103\u021bii", "d": "Sensul \u00eencruci\u0219\u0103rii nu conteaz\u0103: ac\u021biunea genei nu depinde de originea matern\u0103 sau patern\u0103 (\u201egenele \u00ee\u0219i uit\u0103 originea\u201d). Prejudecata \u201eeredit\u0103\u021bii \u00eencruci\u0219ate\u201d (mama \u2192 fiu, tata \u2192 fiic\u0103) e valabil\u0103 doar pentru unele tr\u0103s\u0103turi legate de X."}, {"t": "Disjunc\u021bia \u00een F2", "d": "\u00cen F2 reapar fenotipurile bunicilor al\u0103turi de cele ale p\u0103rin\u021bilor: caracterul recesiv, disp\u0103rut la hibrizi, reapare nemodificat cu probabilitate 25%. Genotip 1 GG : 2 Gg : 1 gg; fenotip 3 : 1. Cunoa\u0219terea ratelor permite predic\u021bii (sfatul genetic)."}, {"t": "Legea I: puritatea game\u021bilor", "d": "Game\u021bii sunt puri genetic: con\u021bin o singur\u0103 alel\u0103 din pereche; heterozigotul formeaz\u0103 dou\u0103 tipuri de game\u021bi, \u00een propor\u021bii egale. Separarea se produce \u00een meioz\u0103, odat\u0103 cu separarea cromozomilor omologi (Rostand: \u201ep\u0103rin\u021bii divor\u021beaz\u0103 \u00een celulele sexuale ale copiilor\u201d). Unirea game\u021bilor la fecunda\u021bie e probabilistic\u0103 \u2192 3 dominant : 1 recesiv \u00een F2."}, {"t": "Ratele de segregare", "d": "Probabilitatea ac\u021bioneaz\u0103 la fiecare sarcin\u0103; ratele nu se verific\u0103 \u00eentr-o singur\u0103 familie mic\u0103, ci \u00eensum\u00e2nd date din multe familii. Depind de tipul \u00eencruci\u0219\u0103rii: AA \u00d7 AA, AA \u00d7 Aa, Aa \u00d7 aa, AA \u00d7 aa, aa \u00d7 aa, Aa \u00d7 Aa."}, {"t": "Retro\u00eencruci\u0219area", "d": "Back-cross: hibrid (F1 sau F2) \u00d7 p\u0103rinte recesiv. Gg \u00d7 gg d\u0103 1 : 1 (\u00bd Gg, \u00bd gg); GG \u00d7 gg d\u0103 numai Gg. Deosebe\u0219te astfel purt\u0103torii heterozigo\u021bi ai genei dominante de homozigo\u021bi; e mult folosit\u0103 \u00een genetica experimental\u0103."}]}, {"titlu": "Gametogeneza \u0219i meioza", "figuri": [{"titlu": "Gametogeneza: ovogenez\u0103 \u0219i spermatogenez\u0103", "nota": "Schem\u0103 simplificat \" stroke=\"#2a78d6\" stroke-width=\"1.4\"/><circle cx=\"240.0\" cy=\"246.0\" r=\"2.2\" fill=\"#2a78d6\"/><line x1=\"240.0\" y1=\"252.0\" x2=\"243.0\" y2=\"266.0\" stroke=\"#2a78d6\" stroke-width=\"1.2\"/><line x1=\"260.0\" y1=\"208.0\" x2=\"276.0\" y2=\"234.0\" stroke=\"#6b6760\" stroke-width=\"1.2\"/><polygon points=\"276.0,234.0 270.9,230.8 275.4,228.0\" fill=\"#6b6760\"/><circle cx=\"276.0\" cy=\"246.0\" r=\"6\" fill=\"#2a78d6\" fill-opacity=\"0.25\" stroke=\"#2a78d6\" stroke-width=\"1.4\"/><circle cx=\"276.0\" cy=\"246.0\" r=\"2.2\" fill=\"#2a78d6\"/><line x1=\"276.0\" y1=\"252.0\" x2=\"279.0\" y2=\"266.0\" stroke=\"#2a78d6\" stroke-width=\"1.2\"/><line x1=\"330.0\" y1=\"208.0\" x2=\"314.0\" y2=\"234.0\" stroke=\"#6b6760\" stroke-width=\"1.2\"/><polygon points=\"314.0,234.0 314.6,228.0 319.1,230.8\" fill=\"#6b6760\"/><circle cx=\"314.0\" cy=\"246.0\" r=\"6\" fill=\"#2a78d6\" fill-opacity=\"0.25\" stroke=\"#2a78d6\" stroke-width=\"1.4\"/><circle cx=\"314.0\" cy=\"246.0\" r=\"2.2\" fill=\"#2a78d6\"/><line x1=\"314.0\" y1=\"252.0\" x2=\"317.0\" y2=\"266.0\" stroke=\"#2a78d6\" stroke-width=\"1.2\"/><line x1=\"330.0\" y1=\"208.0\" x2=\"350.0\" y2=\"234.0\" stroke=\"#6b6760\" stroke-width=\"1.2\"/><polygon points=\"350.0,234.0 344.6,231.3 348.8,228.1\" fill=\"#6b6760\"/><circle cx=\"350.0\" cy=\"246.0\" r=\"6\" fill=\"#2a78d6\" fill-opacity=\"0.25\" stroke=\"#2a78d6\" stroke-width=\"1.4\"/><circle cx=\"350.0\" cy=\"246.0\" r=\"2.2\" fill=\"#2a78d6\"/><line x1=\"350.0\" y1=\"252.0\" x2=\"353.0\" y2=\"266.0\" stroke=\"#2a78d6\" stroke-width=\"1.2\"/><text x=\"295.0\" y=\"280.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.2\">spermatide \u2192 spermatozoizi</text><text x=\"295.0\" y=\"300.0\" text-anchor=\"middle\" fill=\"#2a78d6\" font-size=\"10.8\" font-weight=\"bold\">4 spermatozoizi</text><text x=\"295.0\" y=\"314.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">din fiecare spermatocit primar</text></svg>"}], "noduri": [{"t": "Meioza", "d": "Diviziunea celular\u0103 prin care se formeaz\u0103 game\u021bii, cu num\u0103r haploid (\u00eenjum\u0103t\u0103\u021bit) de cromozomi: din 2n = 46 rezult\u0103 n = 23. Separ\u0103 cromozomii omologi, deci \u0219i alelele, \u00een celule diferite."}, {"t": "Ovogeneza \u0219i spermatogeneza", "d": "Ovogenez\u0103: oogonie \u2192 oocit primar (2n) \u2192 meioza I: oocit secundar (n) + primul glob polar \u2192 meioza II: un ovul matur + al doilea glob polar. Spermatogenez\u0103: spermatogonie \u2192 spermatocit primar (2n) \u2192 dou\u0103 spermatocite secundare (n) \u2192 patru spermatide \u2192 patru spermatozoizi."}]}, {"titlu": "Alte rela\u021bii \u00eentre alele", "noduri": [{"t": "Dominan\u021ba complet\u0103", "d": "Heterozigotul Aa are acela\u0219i fenotip ca homozigotul AA; \u00een F2 raportul fenotipic e 3 : 1."}, {"t": "Dominan\u021ba incomplet\u0103", "d": "Heterozigo\u021bii au un fenotip intermediar; segregarea devine 1 AA : 2 Aa : 1 aa (p\u0103r cre\u021b, ondulat, neted)."}, {"t": "Codominan\u021ba", "d": "Ambele alele se manifest\u0103 la heterozigot, f\u0103r\u0103 s\u0103 se domine (alele echipotente, notate cu majuscule vecine). Sistemul MN: M \u00d7 N \u2192 to\u021bi MN; MN \u00d7 MN \u2192 M : MN : N = 1 : 2 : 1, propor\u021bia fenotipurilor coincide cu cea a genotipurilor. \u0218i grupa AB (L\u1d2c \u0219i L\u1d2e)."}]}, {"titlu": "Polialelia: sistemul ABO", "tabel": {"cap": ["Grupa (fenotip)", "Antigen pe hematii", "Anticorpi \u00een ser", "Genotip"], "randuri": [["O (I)", "absent", "anti-A, anti-B", "ll"], ["A (II)", "A", "anti-B", "L\u1d2cL\u1d2c sau L\u1d2cl"], ["B (III)", "B", "anti-A", "L\u1d2eL\u1d2e sau L\u1d2el"], ["AB (IV)", "A \u0219i B", "absen\u021bi", "L\u1d2cL\u1d2e"]]}, "noduri": [{"t": "Polialelia", "d": "Mai mult de dou\u0103 alele pe acela\u0219i locus, care determin\u0103 varia\u021bii ale aceluia\u0219i caracter; apar prin muta\u021bii consecutive ale unei gene (a\u2081, a\u2082, \u2026 a\u2099). Exemplul tipic: sistemul ABO."}, {"t": "Alelele ABO", "d": "Locusul ABO e pe bra\u021bele lungi ale cromozomului 9. Alelele (notate dup\u0103 Landsteiner) L\u1d2c \u0219i L\u1d2e sunt codominante \u00eentre ele \u0219i dominante fa\u021b\u0103 de l, care \u00eempiedic\u0103 formarea antigenelor. \u00cen ser apar anticorpi doar contra antigenului absent; reac\u021bia antigen\u2013anticorp (aglutinarea) explic\u0103 accidentele transfuzionale observate \u00eenc\u0103 din 1667."}, {"t": "Grupele \u00een popula\u021bii", "d": "Frecven\u021bele difer\u0103 \u00eentre popula\u021bii, poate prin adaptare (imunitate la bolile unei zone). Ex.: grupa O ~69% la amerindieni, unde B \u0219i AB aproape lipsesc; la rom\u00e2ni A 41%, O 36%, B 16%, AB 7%. Alela B are frecven\u021ba maxim\u0103 \u00een Asia central\u0103, de unde s-ar fi r\u0103sp\u00e2ndit: distribu\u021bia alelelor urm\u0103re\u0219te marile migra\u021bii."}]}, {"titlu": "Dihibridarea \u0219i legea a II-a", "lat": true, "figuri": [{"titlu": "Dihibridarea: de la p\u0103rin\u021bi la game\u021bii din F1", "nota": "Redesenat\u0103 dup\u0103 figura din manual. Game\u021bii Ab \u0219i aB, absen\u021bi la p\u0103rin\u021bi, sunt recombina\u021bi.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Dihibridarea: AABB \u00d7 aabb d\u0103 \u00een F1 AaBb, care formeaz\u0103 patru tipuri de game\u021bi, AB \u0219i ab parentali, Ab \u0219i aB recombina\u021bi\" font-family=\"Georgia, serif\" font-size=\"13\"><text x=\"8.0\" y=\"34.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.8\" font-weight=\"bold\">P</text><text x=\"8.0\" y=\"112.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.8\" font-weight=\"bold\">F1</text><text x=\"8.0\" y=\"172.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.8\" font-weight=\"bold\">game\u021bi</text><rect x=\"86.0\" y=\"16.0\" width=\"70.0\" height=\"28.0\" rx=\"5\" fill=\"#2a78d6\"/><text x=\"121.0\" y=\"34.2\" text-anchor=\"middle\" fill=\"#f
