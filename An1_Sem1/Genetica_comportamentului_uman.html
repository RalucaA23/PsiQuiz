t><text x=\"297.5\" y=\"174.0\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"10.2\">15</text><rect x=\"306.0\" y=\"160.0\" width=\"15.0\" height=\"20.0\" fill=\"#ffffff\" stroke=\"#8a7f72\" stroke-width=\"1\"></rect><text x=\"313.5\" y=\"174.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.2\">16</text><rect x=\"322.0\" y=\"160.0\" width=\"15.0\" height=\"20.0\" fill=\"#8a7f72\" stroke=\"#8a7f72\" stroke-width=\"1\"></rect><text x=\"329.5\" y=\"174.0\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"10.2\">17</text><rect x=\"338.0\" y=\"160.0\" width=\"15.0\" height=\"20.0\" fill=\"#ffffff\" stroke=\"#8a7f72\" stroke-width=\"1\"></rect><text x=\"345.5\" y=\"174.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.2\">18</text><rect x=\"354.0\" y=\"160.0\" width=\"15.0\" height=\"20.0\" fill=\"#8a7f72\" stroke=\"#8a7f72\" stroke-width=\"1\"></rect><text x=\"361.5\" y=\"174.0\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"10.2\">19</text><rect x=\"370.0\" y=\"160.0\" width=\"15.0\" height=\"20.0\" fill=\"#8a7f72\" stroke=\"#8a7f72\" stroke-width=\"1\"></rect><text x=\"377.5\" y=\"174.0\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"10.2\">20</text><rect x=\"386.0\" y=\"160.0\" width=\"15.0\" height=\"20.0\" fill=\"#8a7f72\" stroke=\"#8a7f72\" stroke-width=\"1\"></rect><text x=\"393.5\" y=\"174.0\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"10.2\">21</text><rect x=\"402.0\" y=\"160.0\" width=\"15.0\" height=\"20.0\" fill=\"#ffffff\" stroke=\"#8a7f72\" stroke-width=\"1\"></rect><text x=\"409.5\" y=\"174.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.2\">22</text><rect x=\"418.0\" y=\"160.0\" width=\"15.0\" height=\"20.0\" fill=\"#ffffff\" stroke=\"#8a7f72\" stroke-width=\"1\"></rect><text x=\"425.5\" y=\"174.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.2\">Y</text><rect x=\"66.0\" y=\"196.0\" width=\"10.0\" height=\"10.0\" fill=\"#8a7f72\"></rect><text x=\"80.0\" y=\"205.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">de la mam\u0103</text><rect x=\"186.0\" y=\"196.0\" width=\"10.0\" height=\"10.0\" fill=\"#ffffff\" stroke=\"#8a7f72\" stroke-width=\"1\"></rect><text x=\"200.0\" y=\"205.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">de la tat\u0103</text><text x=\"220.0\" y=\"232.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.8\" font-weight=\"bold\">2\u00b2\u00b3 = 8.388.608 game\u021bi posibili; 2\u2074\u2076 zigo\u021bi (f\u0103r\u0103 crossing-over)</text></svg>"}], "noduri": [{"t": "Dihibridarea", "d": "\u00cencruci\u0219area \u00eentre organisme care difer\u0103 prin dou\u0103 perechi de caractere: AABB \u00d7 aabb \u2192 F1 AaBb. F1 formeaz\u0103 4 tipuri de game\u021bi: doi parentali (AB, ab) \u0219i doi recombina\u021bi (Ab, aB), fiecare cu un caracter de la un genitor \u0219i cel\u0103lalt de la cel\u0103lalt."}, {"t": "Raportul 9:3:3:1", "d": "Din 4 \u00d7 4 game\u021bi rezult\u0103 16 combina\u021bii, 9 genotipuri \u0219i 4 fenotipuri: 9/16 cu ambele caractere dominante, 3/16 \u0219i 3/16 combina\u021biile noi, 1/16 cu ambele recesive. Exemplu: gust\u0103tor/negust\u0103tor \u00d7 brunet/blond. Fiecare caracter luat separat d\u0103 tot 3 : 1 (12 : 4)."}, {"t": "Legea a II-a: asortarea independent\u0103", "d": "Genele din perechi diferite de alele se asorteaz\u0103 (combin\u0103) independent la formarea game\u021bilor, cu condi\u021bia s\u0103 fie pe cromozomi diferi\u021bi. La baz\u0103: asortarea independent\u0103 a cromozomilor materni \u0219i paterni din perechi diferite \u00een meioz\u0103 (recombinare cromozomial\u0103), primul nivel de diversitate genetic\u0103."}, {"t": "Diversitatea genetic\u0103", "d": "2\u00b2\u00b3 = 8.388.608 variante de game\u021bi; prin fecunda\u021bie, 2\u2074\u2076 indivizi posibili (peste 70.000 de miliarde), f\u0103r\u0103 a socoti crossing-over-ul (schimbul de segmente \u00eentre omologi), care face num\u0103rul combina\u021biilor practic nelimitat. Reproducerea sexuat\u0103 a fost un progres imens: variabilitatea genetic\u0103 e \u201esine qua non\u201d-ul evolu\u021biei."}]}, {"titlu": "Genetica comportamental\u0103 mendelian\u0103", "noduri": [{"t": "Ipoteza genei unice", "d": "Comportamentul e un fenotip m\u0103surabil, dar adesea o colec\u021bie heterogen\u0103 de comportamente; e pu\u021bin probabil ca cele complexe s\u0103 fie monogenice. Ipoteza unei gene se testeaz\u0103 prin \u00eencruci\u0219\u0103ri controlate \u0219i analiza segreg\u0103rii (F1, F2, back-cross), de obicei la \u0219oarece (ex.: gustul sucrozei octoacetat, al chininei, al stricninei). O gen\u0103 nu produce direct un comportament: controleaz\u0103 produc\u021bia de proteine."}, {"t": "\u0218oarecii waltzing", "d": "\u0218oareci care \u00ee\u0219i scutur\u0103 capul \u0219i se rotesc rapid. \u00cencruci\u0219a\u021bi \u00eentre ei: urma\u0219i identici (linie homozigot\u0103, consangvinizat\u0103). Cu \u0219oareci normali: niciunul dintre 254 de urma\u0219i nu valseaz\u0103 \u2192 alela waltzing e recesiv\u0103. F2: 3 normali : 1 waltzing; back-cross-ul confirm\u0103 modelul monogenic. Peste 300 de defecte neurologice la \u0219oarece \u021bin mai ales de muta\u021bii recesive."}]}, {"titlu": "Paternitatea \u0219i grupele sanguine", "tabel": {"cap": ["P\u0103rin\u021bi", "Copii posibili", "Copii imposibili"], "randuri": [["O \u00d7 O", "O", "A, B, AB"], ["A \u00d7 O", "A, O", "B, AB"], ["B \u00d7 O", "B, O", "A, AB"], ["A \u00d7 A", "A, O", "B, AB"], ["B \u00d7 B", "B, O", "A, AB"], ["A \u00d7 B", "A, B, AB, O", "\u2014"], ["AB \u00d7 O", "A, B", "AB, O"], ["A \u00d7 AB", "A, B, AB", "O"], ["B \u00d7 AB", "A, B, AB", "O"], ["AB \u00d7 AB", "A, B, AB", "O"]]}, "noduri": [{"t": "Excluderea paternit\u0103\u021bii", "d": "Modul \u00een care se mo\u0219tenesc grupele sanguine permite stabilirea \u00eenrudirii. Testarea grupelor (ABO, MN, Rh) e doar un test de excludere: un b\u0103rbat poate fi exclus, dar nu confirmat. Confirmarea se face prin testul ADN (amprenta genetic\u0103)."}, {"t": "P\u0103rin\u021bi AB \u0219i O", "d": "P\u0103rin\u021bii AB (L\u1d2cL\u1d2e) \u0219i O (ll) au copii numai A (L\u1d2cl) sau B (L\u1d2el), cu o grup\u0103 diferit\u0103 de a ambilor p\u0103rin\u021bi: contra prejudec\u0103\u021bii c\u0103 p\u0103rin\u021bii transmit direct caracterele."}, {"t": "Mai multe sisteme de grup", "d": "Combinarea sistemelor (ABO cu MN) cre\u0219te puterea de excludere: un b\u0103rbat compatibil dup\u0103 ABO poate fi exclus dup\u0103 MN (de pild\u0103 un tat\u0103 N pentru un copil M)."}]}]}, "sectiuni": [], "runde": [{"id": "1", "eticheta": "Runda 1 \u00b7 Baz\u0103", "titlu": "Runda 1 \u2014 Concepte de baz\u0103", "desc": "Teorie: legile lui Mendel, rela\u021biile dintre alele \u0219i consecin\u021bele lor, \u00een \u00eentreb\u0103ri directe.", "intrebari": [{"q": "Ce arat\u0103 faptul c\u0103 to\u021bi hibrizii din prima genera\u021bie au fenotipul unuia dintre p\u0103rin\u021bi?", "opts": ["Caracterul acelui p\u0103rinte e recesiv", "Alelele celor doi p\u0103rin\u021bi sunt codominante", "Caracterul acelui p\u0103rinte e dominant", "Gena e legat\u0103 de cromozomul X"], "correct": 2, "explain": "C\u00e2nd hibrizii heterozigo\u021bi arat\u0103 to\u021bi caracterul unui p\u0103rinte, alela acestuia \u00ee\u0219i manifest\u0103 ac\u021biunea la heterozigot, deci e dominant\u0103; cealalt\u0103, mascat\u0103, e recesiv\u0103. La codominan\u021b\u0103 hibrizii ar ar\u0103ta ambele caractere, iar o gen\u0103 legat\u0103 de X ar da rezultate diferite dup\u0103 sensul \u00eencruci\u0219\u0103rii.", "tag": "Dominant \u0219i recesiv"}, {"q": "Ce raport fenotipic d\u0103 \u00eencruci\u0219area a doi heterozigo\u021bi, c\u00e2nd dominan\u021ba e complet\u0103?", "opts": ["1 dominant : 1 recesiv", "3 dominan\u021bi : 1 recesiv", "1 : 2 : 1, ca genotipurile", "9 : 3 : 3 : 1, pe fenotipuri"], "correct": 1, "explain": "Aa \u00d7 Aa d\u0103 \u00bc AA, \u00bd Aa, \u00bc aa; la dominan\u021b\u0103 complet\u0103 AA \u0219i Aa arat\u0103 la fel, deci 3 : 1 dup\u0103 fenotip (1 : 2 : 1 r\u0103m\u00e2ne raportul genotipic). 1 : 1 e rezultatul retro\u00eencruci\u0219\u0103rii, iar 9 : 3 : 3 : 1 apare la dihibridare.", "tag": "Disjunc\u021bia \u00een F2"}, {"q": "La ce folose\u0219te retro\u00eencruci\u0219area cu p\u0103rintele recesiv?", "opts": ["Deosebe\u0219te heterozigo\u021bii de homozigo\u021bii dominan\u021bi", "Deosebe\u0219te alelele codominante de cele recesive", "Arat\u0103 dac\u0103 dou\u0103 gene sunt situate pe cromozomi diferi\u021bi", "Produce hibrizi uniformi \u00een prima genera\u021bie"], "correct": 0, "explain": "\u00cencruci\u0219at cu un recesiv aa, un homozigot AA d\u0103 numai urma\u0219i dominan\u021bi, iar un heterozigot Aa d\u0103 jum\u0103tate recesivi: a\u0219a se afl\u0103 genotipul unui individ cu fenotip dominant. Uniformitatea hibrizilor \u021bine de \u00eencruci\u0219area a doi homozigo\u021bi diferi\u021bi, iar pozi\u021bia genelor pe cromozomi se vede din dihibridare.", "tag": "Retro\u00eencruci\u0219area"}, {"q": "Prin ce se deosebe\u0219te codominan\u021ba de dominan\u021ba incomplet\u0103?", "opts": ["La codominan\u021b\u0103 heterozigotul are un fenotip intermediar", "La codominan\u021b\u0103 ambele alele se v\u0103d, f\u0103r\u0103 intermediar", "La codominan\u021b\u0103 o alel\u0103 o mascheaz\u0103 pe cealalt\u0103", "La codominan\u021b\u0103 exist\u0103 mai mult de dou\u0103 alele"], "correct": 1, "explain": "La codominan\u021b\u0103 ambele alele se manifest\u0103 \u00een fenotipul heterozigotului, f\u0103r\u0103 s\u0103 se domine (grupa AB, grupa MN); la dominan\u021ba incomplet\u0103 heterozigotul are un fenotip intermediar (p\u0103rul ondulat). Mascarea unei alele descrie dominan\u021ba complet\u0103, iar mai mult de dou\u0103 alele pe locus \u00eenseamn\u0103 polialelie.", "tag": "Codominan\u021ba"}, {"q": "Ce raport fenotipic apare la urma\u0219ii a doi heterozigo\u021bi, \u00een dominan\u021ba incomplet\u0103?", "opts": ["1 : 2 : 1, ca raportul genotipic", "3 : 1, ca la dominan\u021ba complet\u0103", "1 : 1, ca la retro\u00eencruci\u0219are", "9 : 3 : 3 : 1, ca la dihibridare"], "correct": 0, "explain": "Heterozigotul are fenotip propriu (intermediar), deci fiecare genotip se vede: 1 AA : 2 Aa : 1 aa, de pild\u0103 p\u0103r cre\u021b, ondulat, neted. Raportul 3 : 1 cere ca heterozigotul s\u0103 arate ca homozigotul dominant.", "tag": "Dominan\u021ba incomplet\u0103"}, {"q": "Ce anticorpi are \u00een ser o persoan\u0103 cu grupa sanguin\u0103 O?", "opts": ["Numai anti-A", "Numai anti-B", "Nu are anticorpi", "Anti-A \u0219i anti-B"], "correct": 3, "explain": "Grupa O nu are antigene pe hematii, iar \u00een ser are anticorpi \u00eempotriva ambelor antigene absente: anti-A \u0219i anti-B. Numai anti-A are grupa B, numai anti-B grupa A, iar grupa AB nu are niciunul dintre ace\u0219ti anticorpi.", "tag": "Alelele ABO"}, {"q": "Ce rela\u021bie exist\u0103 \u00eentre alelele L\u1d2c, L\u1d2e \u0219i l ale sistemului ABO?", "opts": ["L\u1d2c e dominant\u0103 fa\u021b\u0103 de L\u1d2e, iar L\u1d2e e dominant\u0103 fa\u021b\u0103 de l", "Cele trei sunt codominante, dou\u0103 c\u00e2te dou\u0103", "l e dominant\u0103 fa\u021b\u0103 de L\u1d2c \u0219i fa\u021b\u0103 de L\u1d2e", "L\u1d2c \u0219i L\u1d2e sunt codominante \u0219i dominante fa\u021b\u0103 de l"], "correct": 3, "explain": "L\u1d2c \u0219i L\u1d2e se manifest\u0103 \u00eempreun\u0103 la heterozigotul L\u1d2cL\u1d2e (grupa AB), deci sunt codominante, dar fiecare o domin\u0103 pe l, care \u00eempiedic\u0103 formarea antigenelor: L\u1d2cl are grupa A, L\u1d2el grupa B. Dac\u0103 l ar fi codominant\u0103, L\u1d2cl ar avea un fenotip propriu.", "tag": "Alelele ABO"}, {"q": "Ce afirm\u0103 principiul reciprocit\u0103\u021bii \u00een \u00eencruci\u0219\u0103rile mendeliene?", "opts": ["Rezultatul nu depinde de sensul \u00eencruci\u0219\u0103rii", "Mama transmite fiului, iar tat\u0103l fiicei", "Hibrizii din F1 sunt uniformi ca fenotip", "Game\u021bii con\u021bin o singur\u0103 alel\u0103 din pereche"], "correct": 0, "explain": "Indiferent care p\u0103rinte are caracterul dominant, rezultatul e acela\u0219i: ac\u021biunea genei nu depinde de originea ei matern\u0103 sau patern\u0103. \u201eMama transmite fiului, tat\u0103l fiicei\u201d e prejudecata eredit\u0103\u021bii \u00eencruci\u0219ate; uniformitatea hibrizilor \u0219i puritatea game\u021bilor sunt alte principii.", "tag": "Principiul reciprocit\u0103\u021bii"}, {"q": "Ce afirm\u0103 legea I a lui Mendel?", "opts": ["Heterozigo\u021bii au un fenotip intermediar \u00eentre p\u0103rin\u021bi", "Hibrizii din F1 arat\u0103 to\u021bi caracterul recesiv", "Alelele se amestec\u0103 la urma\u0219i \u00een variante noi", "Game\u021bii sunt puri: au o singur\u0103 alel\u0103 din pereche"], "correct": 3, "explain": "Legea segreg\u0103rii \u0219i purit\u0103\u021bii game\u021bilor: fiecare gamet con\u021bine o singur\u0103 gen\u0103 din perechea de alele, iar prin unirea \u00eent\u00e2mpl\u0103toare a game\u021bilor apare \u00een F2 segregarea 3 : 1. Fenotipul intermediar \u021bine de dominan\u021ba incomplet\u0103, hibrizii arat\u0103 caracterul dominant, iar alelele nu se amestec\u0103.", "tag": "Legea I: puritatea game\u021bilor"}, {"q": "Ce rezult\u0103, ca fenotipuri, \u00een a doua genera\u021bie a unei dihibrid\u0103ri cu dominan\u021b\u0103 complet\u0103?", "opts": ["Trei fenotipuri, \u00een raport 1 : 2 : 1", "Patru fenotipuri, \u00een raport 9 : 3 : 3 : 1", "Dou\u0103 fenotipuri, \u00een raport 3 : 1", "Nou\u0103 fenotipuri, c\u00e2te unul pe genotip"], "correct": 1, "explain": "Din 16 combina\u021bii de game\u021bi rezult\u0103 9 genotipuri, dar numai 4 fenotipuri: ambele caractere dominante (9/16), c\u00e2te unul dominant (3/16 \u0219i 3/16), ambele recesive (1/16). Fiecare caracter luat separat d\u0103 3 : 1; nou\u0103 e num\u0103rul genotipurilor, nu al fenotipurilor.", "tag": "Raportul 9:3:3:1"}, {"q": "Prin ce apare polialelia la un locus?", "opts": ["Prin recombinarea genelor de pe locusuri diferite", "Prin crossing-over \u00eentre cromozomii omologi", "Prin muta\u021bii consecutive ale aceleia\u0219i gene", "Prin codominan\u021ba a dou\u0103 alele la heterozigot"], "correct": 2, "explain": "Polialelia (alelismul multiplu) \u00eenseamn\u0103 mai mult de dou\u0103 alele pe acela\u0219i locus, produse prin muta\u021bii consecutive ale unei gene (a\u2081, a\u2082, \u2026 a\u2099), ca \u00een sistemul ABO. Recombinarea \u0219i crossing-over-ul combin\u0103 gene existente, iar codominan\u021ba e o rela\u021bie \u00eentre dou\u0103 alele.", "tag": "Polialelia"}, {"q": "C\u00e2te tipuri de game\u021bi formeaz\u0103 un dublu heterozigot AaBb, cu genele pe cromozomi diferi\u021bi?", "opts": ["Dou\u0103, ca p\u0103rin\u021bii lui", "Patru, \u00een propor\u021bii egale", "Patru, recombina\u021bii fiind rari", "\u0218aisprezece, c\u00e2te o combina\u021bie"], "correct": 1, "explain": "Fiecare gamet prime\u0219te o alel\u0103 din fiecare pereche, iar perechile se asorteaz\u0103 independent: AB, Ab, aB, ab, c\u00e2te \u00bc (doi parentali, doi recombina\u021bi). Recombina\u021bii ar fi mai rari doar pentru gene apropiate pe acela\u0219i cromozom; 16 e num\u0103rul combina\u021biilor la fecunda\u021bie.", "tag": "Dihibridarea"}, {"q": "Ce poate stabili testarea grupelor sanguine \u00eentr-o expertiz\u0103 de paternitate?", "opts": ["Poate exclude un b\u0103rbat, dar nu-l poate confirma", "Poate confirma tat\u0103l, dac\u0103 grupele coincid", "Poate confirma tat\u0103l, dac\u0103 se adaug\u0103 Rh", "Poate exclude mama, dar nu \u0219i pe tat\u0103"], "correct": 0, "explain": "Testarea grupelor (ABO, MN, Rh) e doar un test de excludere: mul\u021bi b\u0103rba\u021bi au alele compatibile cu ale copilului. Confirmarea paternit\u0103\u021bii e posibil\u0103 prin testul ADN (amprenta genetic\u0103), oric\u00e2te sisteme de grupe s-ar ad\u0103uga.", "tag": "Excluderea paternit\u0103\u021bii"}, {"q": "Ce a adus nou Mendel fa\u021b\u0103 de cresc\u0103torii care observaser\u0103 deja separarea tr\u0103s\u0103turilor la urma\u0219i?", "opts": ["Descoperirea cromozomilor purt\u0103tori de gene", "Identificarea ADN-ului ca suport ereditar", "Num\u0103rarea urma\u0219ilor \u0219i calculul propor\u021biilor", "Ideea c\u0103 tr\u0103s\u0103turile se amestec\u0103 la urma\u0219i"], "correct": 2, "explain": "Mendel, c\u0103lug\u0103r \u0219i matematician, a cuantificat rezultatele hibrid\u0103rilor, ceea ce a permis previziuni statistice; fermierii nu se g\u00e2ndiser\u0103 s\u0103 numere. Cromozomii \u0219i ADN-ul au fost descoperi\u021bi ulterior \u0219i i-au confirmat teoria, iar teoria amestecului e chiar cea pe care a infirmat-o.", "tag": "Mendel \u0219i hibridarea"}, {"q": "Ce fel de celule rezult\u0103 din meioz\u0103?", "opts": ["Celule cu num\u0103r diploid de cromozomi", "Celule cu un set de cromozomi dublat", "Celule cu num\u0103r haploid de cromozomi", "Celule identice cu celula din care provin"], "correct": 2, "explain": "Meioza e diviziunea prin care se formeaz\u0103 game\u021bii, cu num\u0103r haploid (\u00eenjum\u0103t\u0103\u021bit) de cromozomi: din 2n = 46 rezult\u0103 n = 23. Setul diploid se reface la fecunda\u021bie; celule identice cu celula-mam\u0103 rezult\u0103 din mitoz\u0103.", "tag": "Meioza"}]}, {"id": "2", "eticheta": "Runda 2 \u00b7 Aplica\u021bii", "titlu": "Runda 2 \u2014 Scenarii \u0219i ra\u021bionament", "desc": "Situa\u021bii cu mai mul\u021bi pa\u0219i: calculezi probabilit\u0103\u021bi, deduci genotipuri, faci diagnostice de paternitate.", "intrebari": [{"q": "Un cresc\u0103tor are un \u0219oarece cu fenotip dominant \u0219i vrea s\u0103 afle dac\u0103 e AA sau Aa. Ce \u00eencruci\u0219are face \u0219i ce rezultat ar ar\u0103ta c\u0103 e heterozigot?", "opts": ["Cu un \u0219oarece aa; numai urma\u0219i cu fenotipul dominant", "Cu un alt dominant; urma\u0219i dominan\u021bi \u0219i recesivi 3 : 1", "Cu un heterozigot; urma\u0219i \u00een raportul genotipic 1 : 2 : 1", "Cu un \u0219oarece aa; apari\u021bia unor urma\u0219i cu fenotip recesiv"], "correct": 3, "explain": "Retro\u00eencruci\u0219area cu p\u0103rintele recesiv deosebe\u0219te heterozigo\u021bii de homozigo\u021bii dominan\u021bi: AA \u00d7 aa d\u0103 numai urma\u0219i dominan\u021bi, Aa \u00d7 aa d\u0103 jum\u0103tate recesivi. Numai urma\u0219i dominan\u021bi ar indica tocmai homozigotul; \u00eencruci\u0219area cu un dominant sau cu un heterozigot nu permite citirea direct\u0103 a genotipului.", "tag": "Retro\u00eencruci\u0219area"}, {"q": "Un p\u0103rinte gust\u0103tor brunet, homozigot pentru ambele caractere, are copii cu un partener negust\u0103tor blond. Copiii lor (dublu heterozigo\u021bi) au, la r\u00e2ndul lor, copii cu parteneri la fel de dublu heterozigo\u021bi. Ce frac\u021bie din nepo\u021bi se a\u0219teapt\u0103 s\u0103 fie gust\u0103tori blonzi?", "opts": ["9/16", "3/16", "1/16", "1/4"], "correct": 1, "explain": "Gust\u0103tor (\u00be) \u0219i blond (\u00bc), caractere care segreg\u0103 independent: \u00be \u00d7 \u00bc = 3/16, una dintre cele dou\u0103 combina\u021bii noi din raportul 9 : 3 : 3 : 1. 9/16 sunt gust\u0103torii brune\u021bi, 1/16 negust\u0103torii blonzi, iar \u00bc e propor\u021bia blonzilor dac\u0103 se urm\u0103re\u0219te doar culoarea p\u0103rului.", "tag": "Raportul 9:3:3:1"}, {"q": "\u00cen aceea\u0219i familie, printre nepo\u021bi apar gust\u0103tori blonzi \u0219i negust\u0103tori brune\u021bi, combina\u021bii pe care nu le avea niciun bunic. Ce explic\u0103 apari\u021bia lor?", "opts": ["Genele din perechi diferite de alele se combin\u0103 independent", "Muta\u021bii noi ap\u0103rute la formarea game\u021bilor copiilor", "Dominan\u021ba incomplet\u0103 a alelelor pentru culoarea p\u0103rului", "Amestecarea caracterelor p\u0103rin\u021bilor \u00een s\u00e2ngele tuturor urma\u0219ilor"], "correct": 0, "explain": "Legea a II-a: perechile de alele aflate pe cromozomi diferi\u021bi se asorteaz\u0103 independent la formarea game\u021bilor, de aceea apar fenotipuri noi, recombinate. Muta\u021biile sunt rare \u0219i nu ar da propor\u021bii regulate; dominan\u021ba incomplet\u0103 ar da fenotipuri intermediare, iar ideea amestecului e tocmai teoria respins\u0103 de Mendel.", "tag": "Legea a II-a: asortarea independent\u0103"}, {"q": "Un cercet\u0103tor urm\u0103re\u0219te dou\u0103 tr\u0103s\u0103turi ale c\u0103ror gene se afl\u0103 foarte aproape una de alta, pe acela\u0219i cromozom. \u00cen a doua genera\u021bie nu ob\u021bine raportul 9 : 3 : 3 : 1. Cum explici?", "opts": ["Una dintre cele dou\u0103 tr\u0103s\u0103turi are, probabil, dominan\u021b\u0103 incomplet\u0103", "Legea I nu se aplic\u0103 genelor de pe un acela\u0219i cromozom", "Legea a II-a presupune gene situate pe cromozomi diferi\u021bi", "E\u0219antionul e prea mare pentru propor\u021biile mendeliene"], "correct": 2, "explain": "Asortarea independent\u0103 se bazeaz\u0103 pe separarea independent\u0103 a cromozomilor din perechi diferite \u00een meioz\u0103; genele de pe acela\u0219i cromozom tind s\u0103 treac\u0103 \u00eempreun\u0103. Fiecare tr\u0103s\u0103tur\u0103 luat\u0103 separat respect\u0103 \u00een continuare legea I; dominan\u021ba incomplet\u0103 ar schimba fenotipurile, dar nu e sugerat\u0103 de premis\u0103, iar propor\u021biile se verific\u0103 tocmai pe e\u0219antioane mari.", "tag": "Legea a II-a: asortarea independent\u0103"}, {"q": "Doi so\u021bi heterozigo\u021bi Gg au patru copii, to\u021bi negust\u0103tori (gg). Un vecin conclude c\u0103 legile lui Mendel \u201enu func\u021bioneaz\u0103 la oameni\u201d. Ce \u00eei r\u0103spunzi?", "opts": ["Copiii au probabil alt tat\u0103 biologic dec\u00e2t cel declarat de mam\u0103", "\u0218ansa se reia la fiecare sarcin\u0103; ratele apar doar pe multe familii", "Alela g se comport\u0103 ca o alel\u0103 dominant\u0103 \u00een aceast\u0103 familie anume", "Legile lui Mendel au fost stabilite \u0219i se aplic\u0103 doar la maz\u0103re"], "correct": 1, "explain": "Raportul 3 : 1 e o probabilitate, care se aplic\u0103 independent la fiecare sarcin\u0103; \u00eentr-o familie mic\u0103 poate ap\u0103rea orice combina\u021bie, iar ratele de segregare se verific\u0103 doar \u00eensum\u00e2nd datele din multe familii. Patru copii gg sunt posibili cu doi p\u0103rin\u021bi Gg (probabilitate (\u00bc)\u2074), deci nu dovedesc alt\u0103 paternitate sau o schimbare a dominan\u021bei.", "tag": "Ratele de segregare"}, {"q": "Un p\u0103rinte are grupa A, cel\u0103lalt grupa B, iar printre copiii lor exist\u0103 toate cele patru grupe: A, B, AB \u0219i O. Ce genotipuri au p\u0103rin\u021bii?", "opts": ["L\u1d2cL\u1d2c \u0219i L\u1d2eL\u1d2e", "L\u1d2cl \u0219i L\u1d2el", "L\u1d2cL\u1d2e \u0219i ll", "L\u1d2cl \u0219i L\u1d2eL\u1d2e"], "correct": 1, "explain": "Un copil cu grupa O (ll) cere ca ambii p\u0103rin\u021bi s\u0103 poarte alela l, deci p\u0103rintele A e L\u1d2cl, iar p\u0103rintele B e L\u1d2el; combina\u021biile dau A, B, AB \u0219i O. Doi homozigo\u021bi ar avea numai copii AB, iar L\u1d2cL\u1d2e \u00d7 ll nu corespunde fenotipurilor A \u0219i B ale p\u0103rin\u021bilor.", "tag": "Alelele ABO"}, {"q": "Mama are grupa AB, tat\u0103l grupa O. Bunica se mir\u0103 c\u0103 niciunul dintre copii nu are grupa vreunuia dintre p\u0103rin\u021bi. Ce i se poate explica?", "opts": ["Grupele p\u0103rin\u021bilor s-au amestecat la copii \u00een grupe intermediare", "Alela l a tat\u0103lui e dominant\u0103 fa\u021b\u0103 de L\u1d2c \u0219i L\u1d2e", "Grupa AB nu se transmite, fiind codominant\u0103", "Fiecare copil prime\u0219te L\u1d2c sau L\u1d2e de la mam\u0103 \u0219i l de la tat\u0103"], "correct": 3, "explain": "Mama L\u1d2cL\u1d2e d\u0103 L\u1d2c sau L\u1d2e, tat\u0103l ll d\u0103 l: copiii sunt L\u1d2cl (grupa A) sau L\u1d2el (grupa B). Exemplul combate prejudecata c\u0103 p\u0103rin\u021bii transmit direct caracterele lor: se transmit gene, nu caractere. Alelele nu se amestec\u0103, iar l e recesiv\u0103.", "tag": "P\u0103rin\u021bi AB \u0219i O"}, {"q": "Mama are grupa B, iar copilul grupa AB. \u00cen cauz\u0103 sunt doi presupu\u0219i ta\u021bi: unul cu grupa A, cel\u0103lalt cu grupa B. Ce concluzie permit grupele ABO?", "opts": ["E exclus cel cu grupa A; cel cu grupa B r\u0103m\u00e2ne posibil", "E exclus cel cu grupa B; cel cu grupa A r\u0103m\u00e2ne posibil", "Sunt exclu\u0219i am\u00e2ndoi; copilul AB cere un tat\u0103 AB", "Cel cu grupa A este confirmat ca tat\u0103 biologic"], "correct": 1, "explain": "Copilul AB a primit L\u1d2e de la mam\u0103, deci de la tat\u0103 a primit L\u1d2c: b\u0103rbatul cu grupa B nu are L\u1d2c \u0219i e exclus, iar cel cu grupa A o are. Un tat\u0103 AB nu e necesar, iar grupele de s\u00e2nge pot doar exclude, nu confirma paternitatea.", "tag": "Excluderea paternit\u0103\u021bii"}, {"q": "Mama are grupele A \u0219i M, copilul O \u0219i M. Presupu\u0219ii ta\u021bi: primul are grupele A \u0219i M, al doilea O \u0219i N. Ce concluzie permit cele dou\u0103 sisteme de grupe luate \u00eempreun\u0103?", "opts": ["E exclus al doilea, care nu are alela M", "E exclus primul, care nu poate da alela l", "R\u0103m\u00e2n posibili am\u00e2ndoi, ca la ABO", "E exclus al doilea, care nu poate da alela l"], "correct": 0, "explain": "Copilul M (MM) a primit M \u0219i de la tat\u0103; b\u0103rbatul cu grupa N (NN) nu are M, deci e exclus. Dup\u0103 ABO singur nu ar fi fost exclus niciunul: copilul O (ll) poate primi l de la un tat\u0103 O sau de la un tat\u0103 A heterozigot. Combinarea sistemelor cre\u0219te puterea de excludere.", "tag": "Mai multe sisteme de grup"}, {"q": "Pentru un b\u0103rbat, testele ABO \u0219i MN nu au dus la excludere. Avocatul lui sus\u021bine c\u0103, prin urmare, paternitatea e dovedit\u0103. Ce gre\u0219e\u0219te?", "opts": ["Grupele de s\u00e2nge doar exclud; confirmarea cere testul ADN", "Grupele confirm\u0103 paternitatea doar dac\u0103 se adaug\u0103 \u0219i sistemul Rh", "ABO dovede\u0219te paternitatea, iar MN o poate doar exclude", "Grupele de s\u00e2nge ale copilului se schimb\u0103 \u00een copil\u0103rie"], "correct": 0, "explain": "Testarea grupelor (ABO, MN, Rh etc.) e doar un test de excludere: mul\u021bi b\u0103rba\u021bi au alelele compatibile. Confirmarea e posibil\u0103 prin testul ADN (amprenta genetic\u0103). Niciun sistem de grupe nu dovede\u0219te singur paternitatea, iar grupele sunt determinate genetic, nu se schimb\u0103.", "tag": "Excluderea paternit\u0103\u021bii"}, {"q": "\u0218oareci \u201ewaltzing\u201d, \u00eencruci\u0219a\u021bi \u00eentre ei, au numai urma\u0219i waltzing. \u00cencruci\u0219a\u021bi cu \u0219oareci normali, dau 254 de urma\u0219i dintre care niciunul nu valseaz\u0103; \u00een a doua genera\u021bie valseaz\u0103 aproximativ un sfert. Ce rezult\u0103?", "opts": ["Comportamentul e determinat de o singur\u0103 gen\u0103 dominant\u0103", "Comportamentul e multifactorial, cu prag de manifestare", "Comportamentul e determinat de o singur\u0103 gen\u0103 recesiv\u0103", "Comportamentul e \u00eenv\u0103\u021bat de la mamele care valseaz\u0103"], "correct": 2, "explain": "Linia waltzing e homozigot\u0103; dispari\u021bia tr\u0103s\u0103turii la hibrizi arat\u0103 c\u0103 alela waltzing e recesiv\u0103, iar raportul 3 : 1 \u00een F2 (\u0219i propor\u021biile din back-cross) se potrivesc modelului mendelian monogenic. O gen\u0103 dominant\u0103 ar ap\u0103rea la hibrizi; un caracter multifactorial nu ar da propor\u021bii mendeliene regulate.", "tag": "\u0218oarecii waltzing"}, {"q": "O cercet\u0103toare observ\u0103 c\u0103 unii \u0219oareci evit\u0103 o solu\u021bie amar\u0103, iar al\u021bii nu. Vrea s\u0103 testeze ipoteza c\u0103 diferen\u021ba \u021bine de o singur\u0103 gen\u0103. Ce plan urmeaz\u0103?", "opts": ["Compar\u0103 perechi de gemeni monozigo\u021bi \u0219i dizigo\u021bi din aceea\u0219i cresc\u0103torie", "Secven\u021biaz\u0103 genomul unui singur \u0219oarece care evit\u0103 solu\u021bia amar\u0103", "M\u0103soar\u0103 corela\u021bia dintre comportamentul p\u0103rin\u021bilor \u0219i al urma\u0219ilor", "Linii homozigote, apoi F1, F2 \u0219i retro\u00eencruci\u0219are, compar\u00e2nd propor\u021biile"], "correct": 3, "explain": "Ipoteza genei unice se testeaz\u0103 prin analiza segreg\u0103rii, ca la Mendel: linii pure \u00eencruci\u0219ate, hibrizi F1, F2 \u0219i back-cross; propor\u021biile 3 : 1 \u0219i 1 : 1 sus\u021bin determinismul monogenic (ca la gustul sucrozei octoacetat, al chininei \u0219i al stricninei la \u0219oareci). Gemenii \u0219i corela\u021biile familiale sunt metode pentru caracterele multifactoriale.", "tag": "Ipoteza genei unice"}, {"q": "Un jurnalist scrie despre \u0219oarecii waltzing c\u0103 s-a descoperit \u201egena valsului\u201d, care produce direct acest comportament. Ce corectur\u0103 \u00eei faci?", "opts": ["Valsul e \u00eenv\u0103\u021bat de la mam\u0103, deci gena e doar un marker al lui", "Gena e dominant\u0103, deci titlul e corect m\u0103car pentru hibrizii F1", "Gena controleaz\u0103 produc\u021bia unei proteine, nu comportamentul", "Comportamentul nu poate urma tipare mendeliene la \u0219oareci"], "correct": 2, "explain": "O gen\u0103 nu produce direct un comportament particular, ci opereaz\u0103 prin controlul produc\u021biei de proteine; comportamentul r\u0103m\u00e2ne un fenotip. Experimentele arat\u0103 c\u0103 tr\u0103s\u0103tura e monogenic\u0103 \u0219i recesiv\u0103, deci comportamentul poate urma tipare mendeliene, dar nu e \u201escris\u201d ca atare \u00een gen\u0103.", "tag": "Ipoteza genei unice"}, {"q": "Un bunic gust\u0103tor homozigot are cu o negust\u0103toare numai copii gust\u0103tori \u0219i conclude c\u0103 alela \u201enegust\u0103tor\u201d s-a pierdut. Copiii lui se c\u0103s\u0103toresc cu parteneri tot heterozigo\u021bi. Ce se va vedea la nepo\u021bi?", "opts": ["Alela reapare sl\u0103bit\u0103, \u00eentr-un fenotip intermediar", "Alela s-a pierdut definitiv \u00een copiii heterozigo\u021bi", "Alela reapare nemodificat\u0103, la circa un sfert din nepo\u021bi", "Alela reapare doar la nepo\u021bii de sex masculin"], "correct": 2, "explain": "Alelele nu se amestec\u0103 \u0219i nu se altereaz\u0103: g r\u0103m\u00e2ne intact\u0103 la heterozigo\u021bi, mascat\u0103 de G, \u0219i reapare \u00een F2 cu probabilitate \u00bc, cu fenotipul bunicii. Fenotipul intermediar ar \u021bine de dominan\u021ba incomplet\u0103, iar o gen\u0103 autozomal\u0103 nu se manifest\u0103 diferit dup\u0103 sex.", "tag": "Disjunc\u021bia \u00een F2"}, {"q": "Aproximativ 7% dintre oameni nu simt mirosul de mosc. Doi p\u0103rin\u021bi care nu-l simt au numai copii care nu-l simt; doi p\u0103rin\u021bi care \u00eel simt au uneori \u0219i copii care nu-l simt. Presupun\u00e2nd un singur locus, cum se transmite abilitatea?", "opts": ["Dominant; p\u0103rin\u021bii care o au pot purta alela recesiv\u0103", "Recesiv; p\u0103rin\u021bii care o au o mascau \u00een stare heterozigot\u0103", "Codominant, cu fenotip intermediar la heterozigo\u021bi", "Multifactorial, f\u0103r\u0103 propor\u021bii mendeliene stabile"], "correct": 0, "explain": "Doi p\u0103rin\u021bi f\u0103r\u0103 abilitate au numai copii f\u0103r\u0103 ea: sunt homozigo\u021bi recesivi. C\u00e2nd doi p\u0103rin\u021bi cu abilitate au \u0219i copii f\u0103r\u0103 ea, ei sunt heterozigo\u021bi, iar tr\u0103s\u0103tura \u201ef\u0103r\u0103 abilitate\u201d e recesiv\u0103; deci abilitatea e dominant\u0103. O tr\u0103s\u0103tur\u0103 recesiv\u0103 nu poate fi \u201emascat\u0103\u201d la purt\u0103torul ei.", "tag": "Dominant \u0219i recesiv"}]}]}, {"nr": 3, "titlu": "Modele de transmitere a caracterelor monogenice (mendeliene) \u00een familiile umane", "harta": {"centru": "Modele de transmitere a caracterelor monogenice \u00een familiile umane", "ramuri": [{"titlu": "Caracterele monogenice", "noduri": [{"t": "Caracterul monogenic", "d": "Determinat de un singur cuplu de gene (un locus); segreg\u0103 \u00een propor\u021bii mendeliene fixe. Un genotip anume e atunci necesar \u0219i suficient pentru caracter."}, {"t": "Catalogul OMIM (McKusick)", "d": "\u201eMendelian Inheritance in Man\u201d, ini\u021biat de Victor McKusick \u00een 1966 cu 400 de caractere; azi peste 6000 de caractere normale \u0219i patologice, consultabil online."}, {"t": "Gena definit\u0103 prin boal\u0103", "d": "Eroare frecvent\u0103: \u201eX are gena bolii\u201d. To\u021bi avem gena; bolnavul are o muta\u021bie a ei. E ca \u0219i cum ai spune c\u0103 ficatul exist\u0103 ca s\u0103 produc\u0103 ciroza."}, {"t": "Frecven\u021ba bolilor monogenice", "d": "Peste 6000 de boli distincte descrise, cu o frecven\u021b\u0103 global\u0103 de 1\u20132% dintre nou-n\u0103scu\u021bii vii."}], "tabel": {"cap": ["Transmitere", "Tr\u0103s\u0103turi normale", "Tr\u0103s\u0103turi patologice"], "randuri": [["Dominant\u0103 autozomal\u0103", "gust\u0103tor PTC, diastem\u0103 (strung\u0103rea\u021b\u0103), lobul urechii liber", "brahidactilie, polidactilie, acondroplazie, hipercolesterolemie familial\u0103, coreea Huntington, sindromul de Habsburg, rinichi polichistic"], ["Recesiv\u0103 autozomal\u0103", "negust\u0103tor PTC, lobul urechii ata\u0219at", "albinism, fenilcetonurie, galactozemie, beta-talasemie, hipotiroidism, surditate congenital\u0103"], ["Recesiv\u0103 legat\u0103 de X", "\u2014", "daltonism, hemofilia A \u0219i B, distrofia muscular\u0103 Duchenne"]]}}, {"titlu": "Ancheta familial\u0103 \u0219i pedigree-ul", "noduri": [{"t": "Omul ca obiect de studiu genetic", "d": "Dificult\u0103\u021bi: diversitate mare, caractere de interes rare, genera\u021bii lungi (un observator vede direct cel mult 5), familii mici, f\u0103r\u0103 experien\u021be. Familiile mici se compenseaz\u0103 cumul\u00e2nd date din mai multe familii."}, {"t": "Ancheta familial\u0103", "d": "Singura cale de a urm\u0103ri la om caracterele \u00een descenden\u021b\u0103. Cere c\u00e2t mai mul\u021bi membri examina\u021bi direct, pe cel pu\u021bin trei genera\u021bii, cu fra\u021bii p\u0103rin\u021bilor \u0219i ascenden\u021bii lor."}, {"t": "Pedigree-ul (arborele genealogic)", "d": "Reprezentarea grafic\u0103 a rudeniei, cu simboluri interna\u021bionale: genera\u021bii cu cifre romane, indivizi cu cifre arabe. Din model se deduce natura genetic\u0103 a tr\u0103s\u0103turii."}, {"t": "Proband, consultand, fratrie", "d": "Proband (propositus, caz index): primul bolnav descoperit. Consultand: persoan\u0103 s\u0103n\u0103toas\u0103 care cere sfat genetic. Fratrie: fra\u021bii \u0219i surorile. Not\u0103: o dat\u0103, textul nume\u0219te proband persoana care cere sfatul."}, {"t": "Cele patru modele de transmitere", "d": "Depind de doi factori: gena e dominant\u0103 sau recesiv\u0103; e pe un autozom sau pe un gonozom. Rezult\u0103: autozomal dominant, autozomal recesiv, dominant legat de X, recesiv legat de X."}], "figuri": [{"titlu": "Simbolurile pedigree-ului", "nota": "Simbolurile standard interna\u021bionale, redesenate; setul din manual poate diferi \u00een detalii.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 326\" role=\"img\" aria-label=\"Simbolurile pedigree-ului: p\u0103trat b\u0103rbat, cerc femeie, plin afectat, jum\u0103tate plin heterozigot, punct purt\u0103toare X, linie oblic\u0103 decedat, s\u0103geat\u0103 proband, linie dubl\u0103 c\u0103s\u0103torie consangvin\u0103\" font-family=\"Georgia, serif\" font-size=\"13\"><rect x=\"15.0\" y=\"17.0\" width=\"18\" height=\"18\" fill=\"#ffffff\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><text x=\"42.0\" y=\"30.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">b\u0103rbat</text><circle cx=\"182.0\" cy=\"26.0\" r=\"9.0\" fill=\"#ffffff\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><text x=\"200.0\" y=\"30.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">femeie</text><rect x=\"15.0\" y=\"55.0\" width=\"18\" height=\"18\" fill=\"#b5453a\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><text x=\"42.0\" y=\"68.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">b\u0103rbat afectat</text><circle cx=\"182.0\" cy=\"64.0\" r=\"9.0\" fill=\"#b5453a\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><text x=\"200.0\" y=\"68.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">femeie afectat\u0103</text><rect x=\"15.0\" y=\"93.0\" width=\"18\" height=\"18\" fill=\"#ffffff\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><rect x=\"15.0\" y=\"93.0\" width=\"9.0\" height=\"18\" fill=\"#b5453a\"/><rect x=\"15.0\" y=\"93.0\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><text x=\"42.0\" y=\"106.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">heterozigot (purt\u0103tor)</text><circle cx=\"182.0\" cy=\"102.0\" r=\"9.0\" fill=\"#ffffff\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><circle cx=\"182.0\" cy=\"102.0\" r=\"2.6\" fill=\"#b5453a\"/><text x=\"200.0\" y=\"106.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">purt\u0103toare a unei gene de pe X</text><rect x=\"15.0\" y=\"131.0\" width=\"18\" height=\"18\" fill=\"#ffffff\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><line x1=\"11.0\" y1=\"153.0\" x2=\"37.0\" y2=\"127.0\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><text x=\"42.0\" y=\"144.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">decedat</text><circle cx=\"182.0\" cy=\"140.0\" r=\"9.0\" fill=\"#b5453a\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><line x1=\"157.0\" y1=\"161.0\" x2=\"171.0\" y2=\"148.0\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><polygon points=\"171.0,148.0 168.8,153.6 165.3,149.8\" fill=\"#2c2a26\"/><text x=\"200.0\" y=\"144.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">proband (caz index)</text><rect x=\"11.0\" y=\"169.0\" width=\"18\" height=\"18\" fill=\"#ffffff\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><circle cx=\"64.0\" cy=\"178.0\" r=\"9.0\" fill=\"#ffffff\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><line x1=\"29.0\" y1=\"178.0\" x2=\"55.0\" y2=\"178.0\" stroke=\"#2c2a26\" stroke-width=\"1.3\"/><text x=\"82.0\" y=\"182.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">c\u0103s\u0103torie</text><rect x=\"169.0\" y=\"169.0\" width=\"18\" height=\"18\" fill=\"#ffffff\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><circle cx=\"222.0\" cy=\"178.0\" r=\"9.0\" fill=\"#ffffff\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><line x1=\"187.0\" y1=\"176.0\" x2=\"213.0\" y2=\"176.0\" stroke=\"#2c2a26\" stroke-width=\"1.3\"/><line x1=\"187.0\" y1=\"180.0\" x2=\"213.0\" y2=\"180.0\" stroke=\"#2c2a26\" stroke-width=\"1.3\"/><text x=\"240.0\" y=\"182.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">consangvin\u0103</text><rect x=\"11.0\" y=\"211.0\" width=\"18\" height=\"18\" fill=\"#ffffff\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><circle cx=\"64.0\" cy=\"220.0\" r=\"9.0\" fill=\"#ffffff\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><line x1=\"29.0\" y1=\"220.0\" x2=\"55.0\" y2=\"220.0\" stroke=\"#2c2a26\" stroke-width=\"1.3\"/><line x1=\"42.0\" y1=\"220.0\" x2=\"42.0\" y2=\"241.5\" stroke=\"#2c2a26\" stroke-width=\"1.3\"/><line x1=\"14.0\" y1=\"241.5\" x2=\"70.0\" y2=\"241.5\" stroke=\"#2c2a26\" stroke-width=\"1.3\"/><line x1=\"14.0\" y1=\"241.5\" x2=\"14.0\" y2=\"263.0\" stroke=\"#2c2a26\" stroke-width=\"1.3\"/><line x1=\"42.0\" y1=\"241.5\" x2=\"42.0\" y2=\"263.0\" stroke=\"#2c2a26\" stroke-width=\"1.3\"/><line x1=\"70.0\" y1=\"241.5\" x2=\"70.0\" y2=\"263.0\" stroke=\"#2c2a26\" stroke-width=\"1.3\"/><circle cx=\"14.0\" cy=\"272.0\" r=\"9.0\" fill=\"#ffffff\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><rect x=\"33.0\" y=\"263.0\" width=\"18\" height=\"18\" fill=\"#ffffff\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><rect x=\"61.0\" y=\"263.0\" width=\"18\" height=\"18\" fill=\"#ffffff\" stroke=\"#2c2a26\" stroke-width=\"1.4\"/><text x=\"94.0\" y=\"254.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">fratrie: fra\u021bii \u0219i surorile</text><text x=\"94.0\" y=\"269.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">dintr-un cuplu (sibling)</text><text x=\"222.0\" y=\"290.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\"></text><text x=\"14.0\" y=\"304.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.2\">Genera\u021biile: cifre romane (I, II, III), de sus \u00een jos;</text><text x=\"14.0\" y=\"318.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.2\">indivizii unei genera\u021bii: cifre arabe, de la st\u00e2nga (III\u2081, III\u2082).</text></svg>"}]}, {"titlu": "Modelul autozomal dominant", "lat": true, "noduri": [{"t": "Farabee \u0219i brahidactilia", "d": "Prima dovad\u0103 c\u0103 o malforma\u021bie se transmite dominant autozomal (1905): degetele scurte, urm\u0103rite la 36 de persoane din 5 familii."}, {"t": "\u00cencruci\u0219area bolnav \u00d7 s\u0103n\u0103tos", "d": "Mn \u00d7 nn, cazul obi\u0219nuit \u00een patologia uman\u0103: \u00bd Mn bolnavi, \u00bd nn s\u0103n\u0103to\u0219i, deci risc de 50% la fiecare sarcin\u0103."}, {"t": "Homozigotul dominant", "d": "MM e rar (din doi heterozigo\u021bi) \u0219i adesea mai grav sau letal (acondroplazie). Hipercolesterolemia familial\u0103: +/+ normal, +/\u2212 moarte ca adult t\u00e2n\u0103r, \u2212/\u2212 \u00een copil\u0103rie, deci semidominan\u021b\u0103."}, {"t": "Criteriile transmiterii dominante", "d": "Continuitate pe vertical\u0103; transmite doar p\u0103rintele afectat; risc 50%; sexe afectate egal (sex ratio = 1); doi p\u0103rin\u021bi bolnavi heterozigo\u021bi pot avea copii s\u0103n\u0103to\u0219i; consangvinitate obi\u0219nuit\u0103."}], "figuri": [{"titlu": "Diagrama eredit\u0103\u021bii autozomale dominante", "nota": "Redesenat\u0103 dup\u0103 manual: M = gena mutant\u0103 dominant\u0103, n = alela normal\u0103. \u00cencruci\u0219area cea mai frecvent\u0103, bolnav heterozigot \u00d7 s\u0103n\u0103tos.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 226\" role=\"img\" aria-label=\"Ereditatea autozomal\u0103 dominant\u0103: Mn \u00d7 nn d\u0103 jum\u0103tate copii Mn bolnavi \u0219i jum\u0103tate nn s\u0103n\u0103to\u0219i\" font-family=\"Geor ize=\"10.2\">s\u0103n\u0103tos (nn)</text></svg>"}]}, {"titlu": "Excep\u021bii de la modelul dominant", "noduri": [{"t": "Muta\u021bia de novo", "d": "Muta\u021bie nou\u0103 \u00een gametul unui p\u0103rinte s\u0103n\u0103tos (80% din acondroplazii, mai ales la ta\u021bi v\u00e2rstnici). Risc neglijabil pentru p\u0103rin\u021bi \u0219i fra\u021bi; 50% pentru copiii probandului."}, {"t": "Penetran\u021ba incomplet\u0103", "d": "Unii purt\u0103tori nu manifest\u0103 boala: \u201esaltul unei genera\u021bii\u201d. Riscul = riscul mendelian \u00d7 penetran\u021ba (polidactilie cu 3 din 4 purt\u0103tori afecta\u021bi: 0,50 \u00d7 0,75)."}, {"t": "Expresivitatea variabil\u0103", "d": "Purt\u0103torii afecta\u021bi au boala \u00een grade diferite (degete: uni- sau bilateral, u\u0219or sau grav). Camptodactilia arat\u0103 \u0219i penetran\u021b\u0103 incomplet\u0103, \u0219i expresivitate variabil\u0103."}, {"t": "Formele fruste", "d": "Manifest\u0103ri foarte u\u0219oare (osteogeneza imperfect\u0103 doar cu sclere albastre). La un p\u0103rinte, deosebesc o muta\u021bie mo\u0219tenit\u0103 (risc 50%) de una nou\u0103 (risc neglijabil)."}, {"t": "Ereditatea influen\u021bat\u0103 de sex", "d": "O gen\u0103 autozomal\u0103 se manifest\u0103 mai des la un sex: guta \u0219i calvi\u021bia frontal\u0103 la b\u0103rba\u021bi, c\u0103derea precoce a din\u021bilor la femei."}, {"t": "Anticipa\u021bia", "d": "Boala debuteaz\u0103 tot mai devreme \u00een genera\u021bii succesive. Cauza: muta\u021bii dinamice, un triplet repetat care se amplific\u0103 \u00een meioz\u0103 (CAG \u00een coreea Huntington)."}, {"t": "Bolile cu debut tardiv", "d": "Purt\u0103torii par s\u0103n\u0103to\u0219i p\u00e2n\u0103 t\u00e2rziu (coreea Huntington: 35\u201365 de ani). Boala apare de obicei dup\u0103 reproducere, deci scap\u0103 selec\u021biei naturale \u0219i persist\u0103."}, {"t": "Fenocopiile", "d": "Modific\u0103ri produse de mediu care imit\u0103 o boal\u0103 ereditar\u0103 \u0219i nu se transmit (  "Consangvinitatea", "noduri": [{"t": "Consangvinitatea", "d": "P\u0103rin\u021bi cu str\u0103mo\u0219i comuni (inbreeding; endogamie = uniuni \u00eentr-o popula\u021bie \u00eenchis\u0103). Cre\u0219te \u0219ansa ca ambii s\u0103 poarte aceea\u0219i muta\u021bie recesiv\u0103 (albinism: 1/38 000 \u00een SUA, 18\u201324% la familiile Hopi)."}, {"t": "Coeficien\u021bii de \u00eenrudire \u0219i consangvinitate", "d": "\u00cenrudirea: propor\u021bia de gene comune rudelor. Consangvinitatea (F): probabilitatea ca un copil al cuplului s\u0103 primeasc\u0103 ambele alele ale unei gene de la str\u0103mo\u0219ul comun."}, {"t": "Consangvinizarea nu e un r\u0103u \u00een sine", "d": "Riscul depinde de muta\u021biile din familie: Darwin, c\u0103s\u0103torit cu veri\u0219oara primar\u0103, a avut 10 copii s\u0103n\u0103to\u0219i. Totu\u0219i, fiecare om poart\u0103 c\u00e2teva (2\u20134) muta\u021bii recesive."}, {"t": "Prohibi\u021bia incestului", "d": "Interzis peste tot (excep\u021bie: faraonii). Ipoteza unui mecanism \u00eenn\u0103scut (Jane Goodall, la primate): dezgustul a dus la legi. L\u00e9vi-Strauss: prohibi\u021bia marcheaz\u0103 trecerea de la natur\u0103 la cultur\u0103."}], "tabel": {"cap": ["Cuplu consangvin", "Coef. de \u00eenrudire", "Coef. de consangvinitate (F)", "Risc (\u00een manual)"], "randuri": [["fra\u021bi", "1/2", "1/4", "1/8"], ["fra\u021bi vitregi; unchi \u2013 nepoat\u0103; m\u0103tu\u0219\u0103 \u2013 nepot", "1/4", "1/8", "1/16"], ["veri primari", "1/8", "1/16", "1/32"], ["unchi \u2013 nepoat\u0103 de v\u0103r; m\u0103tu\u0219\u0103 \u2013 nepot de v\u0103r", "1/16", "1/32", "1/64"], ["veri de gradul II", "1/32", "1/64", "1/128"]]}}, {"titlu": "Screening \u0219i sfat genetic", "noduri": [{"t": "Screeningul genetic", "d": "Cercetarea sistematic\u0103 a unui grup cu risc: nou-n\u0103scu\u021bi (postnatal), sarcini (prenatal), purt\u0103tori s\u0103n\u0103to\u0219i (al heterozigo\u021bilor). Limite: unele muta\u021bii nu se pot detecta (albinism)."}, {"t": "Talasemia \u0219i malaria", "d": "Talasemia e frecvent\u0103 \u00een bazinul mediteranean (p\u00e2n\u0103 la 40% purt\u0103tori \u00een unele sate din Sardinia): heterozigo\u021bii rezist\u0103 mai bine la malarie \u0219i au mai mul\u021bi urma\u0219i."}, {"t": "Screeningul heterozigo\u021bilor", "d": "Reu\u0219it cu informare \u0219i sfat genetic: talasemia \u00een Sardinia, Tay-Sachs la evreii a\u0219kenazi. E\u0219uat \u00een SUA pentru hemoglobina S: f\u0103r\u0103 informare, popula\u021bia s-a sim\u021bit discriminat\u0103."}, {"t": "Pa\u0219ii sfatului genetic", "d": "Diagnostic precis; pedigree complet, \u00eencadrat \u00eentr-unul din cele patru modele; genotipurile membrilor familiei; probabilit\u0103\u021bile calculate dup\u0103 legile lui Mendel."}, {"t": "Riscul de recuren\u021b\u0103", "d": "R\u0103m\u00e2ne acela\u0219i la fiecare sarcin\u0103, indiferent c\u00e2\u021bi copii bolnavi exist\u0103 deja. P\u0103rin\u021bi s\u0103n\u0103to\u0219i cu un copil mm: risc \u00bc pentru \u00eenc\u0103 un copil bolnav."}, {"t": "Consim\u021b\u0103m\u00e2ntul \u0219i diagnosticul prenatal", "d": "Orice diagnostic genetic e precedat de sfat genetic, cu consim\u021b\u0103m\u00e2nt informat. Diagnosticul prenatal (amniocentez\u0103, teste moleculare) compenseaz\u0103 faptul c\u0103 sfatul d\u0103 doar probabilit\u0103\u021bi."}]}, {"titlu": "Ereditatea legat\u0103 de sex", "lat": true, "noduri": [{"t": "Cromozomii de sex", "d": "B\u0103rbatul e heterogametic (XY: game\u021bi X \u0219i Y), femeia homogametic\u0103 (XX). La p\u0103s\u0103ri \u0219i fluturi e invers (femela WZ). De la mam\u0103 primim mereu un X."}, {"t": "Cromozomul Y \u0219i ereditatea holandric\u0103", "d": "Y e mic, aproape inert, masculinizant prin gena SRY. Transmiterea exclusiv tat\u0103 \u2192 fiu se nume\u0219te holandric\u0103 (exemplul citat, hipertricoza urechilor, e incert)."}, {"t": "Hemizigo\u021bia", "d": "B\u0103rbatul are o singur\u0103 copie a genelor de pe X, deci orice muta\u021bie recesiv\u0103 de pe X se manifest\u0103 la el; la femeia heterozigot\u0103 e mascat\u0103 de alela normal\u0103."}, {"t": "Daltonismul", "d": "Atribuit cromozomului X \u00een 1911: prima gen\u0103 localizat\u0103 pe un cromozom anume. Numele vine de la Dalton, care avea boala. 8% la caucazieni, foarte rar la eschimo\u0219i."}, {"t": "Transmiterea recesiv\u0103 legat\u0103 de X", "d": "B\u0103rbat bolnav \u2192 fiice purt\u0103toare \u2192 nepo\u021bi bolnavi (oblic). Mama purt\u0103toare: \u00bd din fii bolnavi, \u00bd din fiice purt\u0103toare. Nu trece de la tat\u0103 la fiu."}, {"t": "Femeile heterozigote par\u021bial afectate", "d": "Prin inactivarea \u00eent\u00e2mpl\u0103toare a unui X, unele purt\u0103toare au simptome u\u0219oare, c\u00e2nd \u00een celulele de interes a r\u0103mas activ X-ul cu muta\u021bia."}, {"t": "Transmiterea dominant\u0103 legat\u0103 de X", "d": "De dou\u0103 ori mai frecvent\u0103 la femei. Tat\u0103l afectat o transmite tuturor fiicelor \u0219i niciunui fiu (rahitismul vitamino-rezistent, amelogeneza imperfect\u0103)."}], "figuri": [{"titlu": "Transmiterea recesiv\u0103 legat\u0103 de X (hemofilia)", "nota": "Redesenat\u0103 dup\u0103 manual: X\u1d34 = alela normal\u0103 dominant\u0103, X\u02b0 = alela hemofiliei.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 226\" role=\"img\" aria-label=\"Ereditatea recesiv\u0103 legat\u0103 de X: mama purt\u0103toare \u0219i tat\u0103l s\u0103n\u0103tos au fiice s\u0103n\u0103toase, jum\u0103tate purt\u0103toare, \u0219i jum\u0103tate din fii bolnavi\" font-family=\"Georgia, serif\" font-size=\"13\"><text x=\"8.0\" y=\"36.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.8\" font-weight=\"bold\">P\u0103rin\u021bi</text><text x=\"8.0\" y=\"86.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.8\" font-weight=\"bold\">Game\u021bi</text><text x=\"8.0\" y=\"158.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.8\" font-weight=\"bold\">Copii</tex
