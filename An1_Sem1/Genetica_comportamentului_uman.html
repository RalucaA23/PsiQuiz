tul, deci curba predispozi\u021biei lor e deplasat\u0103 spre dreapta \u0219i mai mul\u021bi dep\u0103\u0219esc acela\u0219i prag; cu fiecare grad de rudenie curba revine spre popula\u021bie. O alel\u0103 dominant\u0103 ar da rapoarte mendeliene.", "tag": "Gene de susceptibilitate \u0219i prag"}, {"q": "Dou\u0103 familii au c\u00e2te un copil cu despic\u0103tur\u0103 labio-palatin\u0103: \u00een prima forma e unilateral\u0103, \u00een a doua bilateral\u0103. Unde e mai mare riscul pentru urm\u0103torul copil?", "opts": ["Egal, fiindc\u0103 boala e aceea\u0219i \u00een ambele familii", "\u00cen a doua, fiindc\u0103 forma probandului e mai sever\u0103", "\u00cen prima, fiindc\u0103 formele u\u0219oare sunt mai ereditare", "Egal, c\u00e2t frecven\u021ba bolii \u00een popula\u021bie"], "correct": 1, "explain": "Riscul de recuren\u021b\u0103 cre\u0219te cu gravitatea formei probandului: de la 2% la formele unilaterale la peste 6% la cele bilaterale (o form\u0103 grav\u0103 sugereaz\u0103 o predispozi\u021bie mai mare \u00een familie). Riscul la fra\u021bi e mult peste cel din popula\u021bie.", "tag": "Gravitatea formei"}, {"q": "Un b\u0103rbat are un frate cu schizofrenie, iar o femeie are un v\u0103r primar cu aceea\u0219i boal\u0103. Pentru care dintre ei e riscul mai mare \u0219i de ce?", "opts": ["Egal: la bolile multifactoriale rudenia nu conteaz\u0103", "Pentru b\u0103rbat: riscul scade rapid cu gradul de rudenie", "Pentru femeie: verii au mai multe gene comune ca fra\u021bii", "Egal: am\u00e2ndoi au riscul din popula\u021bia general\u0103"], "correct": 1, "explain": "Fratele e rud\u0103 de gradul I (1/2 din gene), v\u0103rul primar de gradul III (1/8); la schizofrenie riscul e de 10\u201315% la gradul I \u0219i scade spre valoarea popula\u021biei la gradele \u00eendep\u0103rtate. Riscul r\u0103m\u00e2ne totu\u0219i peste cel popula\u021bional la ambii.", "tag": "Gradul de rudenie"}, {"q": "O afec\u021biune are concordan\u021ba de 30% la gemenii monozigo\u021bi \u0219i tot de 30% la dizigo\u021bi, c\u00e2t la fra\u021bii obi\u0219nui\u021bi. Ce sugereaz\u0103 aceste rate?", "opts": ["Afec\u021biunea e monogenic\u0103, cu penetran\u021b\u0103 mare", "Afec\u021biunea e multifactorial\u0103, cu ereditate mare", "Afec\u021biunea e cromozomial\u0103, prin non-disjunc\u021bie", "Afec\u021biunea e determinat\u0103 mai ales de mediu"], "correct": 3, "explain": "Dac\u0103 genele identice nu cresc concordan\u021ba MZ peste cea DZ, componenta genetic\u0103 e mic\u0103: tiparul mezologic. Monogenicul \u0219i cromozomialul ar da 100% la MZ, iar o ereditate mare ar ridica MZ mult peste DZ.", "tag": "Tiparele de concordan\u021b\u0103"}, {"q": "Pentru tulburarea bipolar\u0103, concordan\u021ba e 70% la gemenii MZ \u0219i 15% la DZ; pentru cancer, 17% la MZ \u0219i 11% la DZ. Ce po\u021bi conchide?", "opts": ["Cancerul e mai ereditar, fiindc\u0103 diferen\u021ba e mai mic\u0103", "Componenta genetic\u0103 e mai puternic\u0103 la bipolar", "Sunt monogenice, fiindc\u0103 MZ dep\u0103\u0219esc DZ la am\u00e2ndou\u0103", "Mediul conteaz\u0103 mai mult la tulburarea bipolar\u0103"], "correct": 1, "explain": "Cu c\u00e2t concordan\u021ba MZ o dep\u0103\u0219e\u0219te mai mult pe cea DZ, cu at\u00e2t componenta ereditar\u0103 e mai mare: 70 vs 15 la bipolar, fa\u021b\u0103 de 17 vs 11 la cancer. Ratele MZ sub 100% arat\u0103 afec\u021biuni multifactoriale, nu monogenice.", "tag": "Concordan\u021ba"}, {"q": "Copiii unor p\u0103rin\u021bi cu schizofrenie, adopta\u021bi de familii s\u0103n\u0103toase, fac boala \u00een 8\u201310% din cazuri, fa\u021b\u0103 de 1% la adopta\u021bii cu p\u0103rin\u021bi s\u0103n\u0103to\u0219i. Ce argument aduce compara\u021bia?", "opts": ["Un factor genetic important, separat de mediul familial", "Un efect al mediului din familia adoptiv\u0103", "O transmitere mendelian\u0103 dominant\u0103 a bolii", "Un efect al stresului adop\u021biei asupra copiilor"], "correct": 0, "explain": "Ambele grupuri sunt adoptate \u00een familii s\u0103n\u0103toase, deci mediul \u0219i stresul adop\u021biei sunt comparabile; diferen\u021ba \u021bine de p\u0103rin\u021bii biologici, adic\u0103 de gene. O transmitere dominant\u0103 ar da riscuri de ordinul a 50%, nu 8\u201310%.", "tag": "Studiile de adop\u021bie"}, {"q": "Un articol afirm\u0103: \u201eHeritabilitatea IQ-ului e de 0,7, deci 70% din inteligen\u021ba fiec\u0103ruia vine din gene.\u201d Ce gre\u0219e\u0219te autorul?", "opts": ["h prive\u0219te varia\u021bia dintr-o popula\u021bie, nu individul", "Valoarea pentru IQ e 0,078, nu 0,7", "h = 0,7 arat\u0103 c\u0103 educa\u021bia nu schimb\u0103 IQ-ul", "Heritabilitatea se aplic\u0103 doar caracterelor discontinue"], "correct": 0, "explain": "Heritabilitatea arat\u0103 ce parte din diferen\u021bele dintre indivizii unei popula\u021bii, \u00eentr-un loc \u0219i timp dat, \u021bine de genele lor; nu \u00eemparte inteligen\u021ba unui om \u00een procente. 0,078 e heritabilitatea greut\u0103\u021bii, iar metoda co-geam\u0103nului arat\u0103 c\u0103 educa\u021bia cre\u0219te IQ-ul.", "tag": "Heritabilitatea (h)"}, {"q": "Heritabilitatea \u00een\u0103l\u021bimii e de 0,80, iar a greut\u0103\u021bii de 0,078. Un nutri\u021bionist vrea s\u0103 \u0219tie pe care o poate influen\u021ba mai mult prin diet\u0103, \u00eentr-o popula\u021bie dat\u0103. Ce \u00eei spun datele?", "opts": ["\u00cen\u0103l\u021bimea, fiindc\u0103 e mai u\u0219or de m\u0103surat", "Pe am\u00e2ndou\u0103 la fel, fiindc\u0103 sunt poligenice", "Greutatea, a c\u0103rei varia\u021bie \u021bine mai ales de mediu", "\u00cen\u0103l\u021bimea, fiindc\u0103 are heritabilitatea mai mare"], "correct": 2, "explain": "O heritabilitate mic\u0103 (0,078) \u00eenseamn\u0103 c\u0103 diferen\u021bele de greutate \u021bin mai ales de mediu, deci schimbarea mediului le influen\u021beaz\u0103 cel mai mult; la \u00een\u0103l\u021bime, 80% din varia\u021bie e genetic\u0103. Faptul c\u0103 ambele sunt poligenice nu le face egal de sensibile la mediu.", "tag": "Valori ale heritabilit\u0103\u021bii"}, {"q": "\u00cen anii \u201940, un guvern a introdus la 11 ani un examen care \u00eemp\u0103r\u021bea elevii \u00een trei tipuri de \u0219coli, pe baza unor studii pe gemeni ce d\u0103deau IQ-ului o determinare genetic\u0103 de 77%. Ce s-a aflat apoi despre studii?", "opts": ["Erau corecte, dar pe un e\u0219antion prea mic", "Ar\u0103tau de fapt o determinare de mediu de 77%", "Fuseser\u0103 f\u0103cute doar pe gemeni dizigo\u021bi", "Datele fuseser\u0103 \u00een mare parte fabricate"], "correct": 3, "explain": "Studiile lui Cyril Burt, care lega s\u0103r\u0103cia de inteligen\u021ba sc\u0103zut\u0103, s-au dovedit dup\u0103 moartea lui o fraud\u0103: cele mai multe date fuseser\u0103 inventate. Examenul \u201eunsprezece plus\u201d r\u0103m\u00e2ne un exemplu de politic\u0103 \u00eentemeiat\u0103 pe date false.", "tag": "Frauda lui Burt"}, {"q": "Doi gemeni monozigo\u021bi de 4 ani comunic\u0103 \u00eentre ei \u00eentr-un limbaj pe care p\u0103rin\u021bii nu-l \u00een\u021beleg, iar unul preia mereu conducerea \u00een joc. De ce trebuie s\u0103 \u021bin\u0103 cont un psiholog care \u00eei include \u00eentr-un studiu?", "opts": ["Comportamentele diferite arat\u0103 c\u0103 nu sunt monozigo\u021bi", "Limbajul propriu semnaleaz\u0103 o anomalie cromozomial\u0103", "Gemenii formeaz\u0103 o lume aparte, care le modeleaz\u0103 psihicul", "Rolurile diferite dovedesc o heritabilitate nul\u0103"], "correct": 2, "explain": "Gemenii se dezvolt\u0103 \u00eentr-un context de gemeni: MZ \u00ee\u0219i refuz\u0103 sau \u00ee\u0219i accentueaz\u0103 identitatea, \u00ee\u0219i \u00eempart roluri (unul dominant) \u0219i au adesea un limbaj propriu, ceea ce complic\u0103 interpretarea tr\u0103s\u0103turilor psihice. Rolurile diferite nu contrazic identitatea genetic\u0103.", "tag": "Lumea gemenilor"}, {"q": "Pentru o gard\u0103 de elit\u0103 format\u0103 numai din b\u0103rba\u021bi \u00eenal\u021bi, se aleg cupluri foarte \u00eenalte, \u00een speran\u021ba unor fii la fel de \u00eenal\u021bi. De ce mul\u021bi fii ar ie\u0219i mai scunzi dec\u00e2t p\u0103rin\u021bii lor?", "opts": ["Alelele pentru talie mare sunt recesive \u0219i se pierd", "Talia fiilor e dat\u0103 mai ales de genele mamei", "Combina\u021bia de gene \u0219i mediu a p\u0103rin\u021bilor rar se repet\u0103", "Cuplurile alese sunt heterozigote pentru o gen\u0103"], "correct": 2, "explain": "Talia e poligenic\u0103 \u0219i multifactorial\u0103: combina\u021bia favorabil\u0103 de gene \u0219i mediu a fiec\u0103rui p\u0103rinte rar se reg\u0103se\u0219te la copil, deci fiii regreseaz\u0103 spre medie (r\u0103m\u00e2n totu\u0219i peste ea). Nu e vorba de o singur\u0103 gen\u0103 recesiv\u0103 sau de una mo\u0219tenit\u0103 de la mam\u0103.", "tag": "Regresia spre medie"}, {"q": "O cercet\u0103toare observ\u0103 c\u0103 un accent regional rar apare aproape numai \u00een anumite familii, din genera\u021bie \u00een genera\u021bie. Ce trebuie s\u0103 verifice \u00eenainte s\u0103 presupun\u0103 o baz\u0103 genetic\u0103?", "opts": ["Dac\u0103 apare \u0219i la ne\u00eenrudi\u021bi din acela\u0219i mediu", "Dac\u0103 propor\u021biile \u00een familie sunt 3 : 1 sau 1 : 1", "Dac\u0103 e mai frecvent la rude dec\u00e2t \u00een popula\u021bie", "Dac\u0103 tr\u0103s\u0103tura are distribu\u021bie continu\u0103"], "correct": 0, "explain": "Concentrarea familial\u0103 poate veni din mediul comun: dac\u0103 ne\u00eenrudi\u021bii crescu\u021bi \u00een acela\u0219i loc au acela\u0219i accent, tr\u0103s\u0103tura e transmis\u0103 social. Frecven\u021ba mai mare la rude e chiar agregarea care trebuie explicat\u0103, iar distribu\u021bia nu decide \u00eentre gene \u0219i mediu.", "tag": "Agregarea nu dovede\u0219te"}]}]}], "teste": [{"desc": "30 de \u00eentreb\u0103ri ascunse \u2014 nu apar \u00een paginile capitolelor \u0219i nu se repet\u0103 \u00een alt quiz final.", "intrebari": [{"q": "Care a fost primul exemplu de gen\u0103 atribuit\u0103 unui cromozom anume?", "opts": ["Gena pentru brahidactilie, pe un autozom", "Muta\u021bia pentru hemofilie, pe cromozomul X", "Gena SRY, pe bra\u021bul scurt al cromozomului Y", "Muta\u021bia pentru daltonism, pe cromozomul X"], "correct": 3, "explain": "\u00cen 1911, muta\u021bia pentru daltonism a fost repartizat\u0103 cromozomului X, prima gen\u0103 localizat\u0103 pe un cromozom. Farabee (1905) ar\u0103tase doar c\u0103 brahidactilia se transmite dominant autozomal, f\u0103r\u0103 s\u0103 o localizeze; hemofilia \u0219i SRY sunt exemple ulterioare.", "tag": "Daltonismul", "src": "Cap. 3 (Modele de transmitere a caracterelor monogenice (mendeliene) \u00een familiile umane)"}, {"q": "Ce rol au telomerele?", "opts": ["Separ\u0103 cromozomul \u00eentr-un bra\u021b scurt \u0219i unul lung", "Fixeaz\u0103 cromozomul pe fibrele fusului \u00een timpul diviziunii celulare", "Dau stabilitate cromozomului \u0219i \u00eempiedic\u0103 asocierea capetelor", "Leag\u0103 cele dou\u0103 cromatide pe toat\u0103 lungimea lor"], "correct": 2, "explain": "Telomera e cap\u0103tul fiec\u0103rei cromatide; ea stabilizeaz\u0103 cromozomul \u0219i \u00eempiedic\u0103 lipirea lui de al\u021bi cromozomi. Fixarea pe fus \u0219i \u00eemp\u0103r\u021birea \u00een bra\u021bele p \u0219i q \u021bin de centromer, iar cromatidele sunt libere pe lungime, unite doar la centromer.", "tag": "Telomerele", "src": "Cap. 4 (Bazele cromozomiale ale eredit\u0103\u021bii. Cromozomii umani: morfologie, structur\u0103, func\u021bie)"}, {"q": "Un cercet\u0103tor observ\u0103 c\u0103 femeile cu sindrom Turner se adapteaz\u0103 social mai greu \u0219i propune existen\u021ba unei \u201egene a adaptabilit\u0103\u021bii sociale\u201d pe X. Ce explica\u021bie alternativ\u0103 e mai probabil\u0103?", "opts": ["Complexele legate de statur\u0103 \u0219i de aspect", "\u00cenapoierea mental\u0103 moderat\u0103, frecvent\u0103 la ele", "Sterilitatea, descoperit\u0103 \u00eenc\u0103 din copil\u0103rie", "Deficitul spa\u021bial, care le izoleaz\u0103 de colegi"], "correct": 0, "explain": "Adaptarea social\u0103 deficitar\u0103 e mai cur\u00e2nd consecin\u021ba complexelor legate de statura mic\u0103 \u0219i de aspectul somatic dec\u00e2t a unor gene de pe X-ul absent. \u00cenapoierea moderat\u0103 e rar\u0103 \u00een Turner, iar deficitul spa\u021bial e cognitiv, nu social.", "tag": "Sindromul Turner", "src": "Cap. 5 (Anomaliile cromozomiale \u0219i consecin\u021bele lor clinice)"}, {"q": "Ce a ar\u0103tat metoda co-geam\u0103nului despre coeficientul de inteligen\u021b\u0103?", "opts": ["Depinde de mediu, nu \u0219i de gene", "Educa\u021bia \u00eel cre\u0219te; mo\u0219tenim aptitudinea, nu IQ-ul", "Cre\u0219te doar la geam\u0103nul cu gene mai favorabile", "E fixat la na\u0219tere, iar educa\u021bia nu-l poate schimba"], "correct": 1, "explain": "Un geam\u0103n MZ prime\u0219te interven\u021bia, cel\u0103lalt e martor: diferen\u021ba arat\u0103 efectul educa\u021biei, deci nu mo\u0219tenim un IQ anume, ci aptitudinea de a-l dezvolta. Gemenii MZ au acelea\u0219i gene, deci nu unul are gene mai favorabile.", "tag": "Metoda co-geam\u0103nului", "src": "Cap. 6 (Ereditatea multifactorial\u0103 sau poligenic\u0103)"}, {"q": "Ce cuprinde mediul, \u00een sensul larg folosit \u00een genetica uman\u0103?", "opts": ["Factori ecologici, psihologici \u0219i socio-culturali", "Factorii fizici \u0219i chimici din via\u021ba intrauterin\u0103", "Factorii naturali: clima, hrana, agen\u021bii patogeni", "Factorii socio-economici, f\u0103r\u0103 cei ecologici"], "correct": 0, "explain": "Mediul nu \u00eenseamn\u0103 doar factorii naturali: cuprinde totalitatea factorilor ecologici (fizici, chimici, biologici) \u0219i mai ales psihologici \u0219i socio-culturali, inclusiv cultura, adic\u0103 tot ce omul c\u00e2\u0219tig\u0103, nu mo\u0219tene\u0219te. Concep\u021bia limitat\u0103 la factorii naturali e numit\u0103 unilateral\u0103.", "tag": "Mediul", "src": "Cap. 1 (Introducere \u00een genetic\u0103)"}, {"q": "Un psihiatru sper\u0103 ca, \u00een viitor, e\u0219antioanele de ADN s\u0103 \u00eenlocuiasc\u0103 geamurile de unic sens folosite la observarea pacien\u021bilor. Ce direc\u021bie de cercetare are \u00een vedere?", "opts": ["Epidemiologia genetic\u0103 a tr\u0103s\u0103turilor normale", "Genetica formal\u0103 a \u00eencruci\u0219\u0103rilor controlate", "Scanarea genomului pentru gene de predispozi\u021bie", "Analiza riscului de discriminare genetic\u0103"], "correct": 2, "explain": "Scanarea genomului urm\u0103re\u0219te localizarea genelor multiple de predispozi\u021bie pentru tulbur\u0103ri ca boala maniaco-depresiv\u0103, schizofrenia sau autismul; de aici speran\u021ba c\u0103 ADN-ul va \u00eenlocui observarea. Epidemiologia genetic\u0103 \u0219i problemele etice sunt celelalte dou\u0103 direc\u021bii, iar genetica formal\u0103 nu lucreaz\u0103 cu tulbur\u0103rile psihice umane.", "tag": "Direc\u021bii de cercetare", "src": "Cap. 1 (Introducere \u00een genetic\u0103)"}, {"q": "De ce are un cromozom Y suplimentar consecin\u021be clinice reduse?", "opts": ["Y suplimentar e inactivat ca un corpuscul Barr", "Y suplimentar se pierde \u00een primele diviziuni", "Y poart\u0103 doar gene recesive, mascate de X", "Y are pu\u021bine gene, mai ales pentru sexul masculin"], "correct": 3, "explain": "Y con\u021bine foarte pu\u021bine gene, iar func\u021bia lui important\u0103 e determinarea sexului masculin (gena SRY); b\u0103rba\u021bii XYY sunt fertili. Corpusculii Barr sunt X-uri inactivate, nu Y, iar Y-ul \u00een plus r\u0103m\u00e2ne \u00een celule.", "tag": "Cromozomul Y \u0219i SRY", "src": "Cap. 5 (Anomaliile cromozomiale \u0219i consecin\u021bele lor clinice)"}, {"q": "Ce deosebe\u0219te un individ homozigot de unul heterozigot pentru un locus?", "opts": ["Are alele identice, respectiv diferite, pe acel locus", "Are numai alele dominante, respectiv recesive, pe acel locus", "Are gene pe un cromozom, respectiv pe doi", "Are un fenotip vizibil, respectiv unul ascuns"], "correct": 0, "explain": "Homozigotul are dou\u0103 copii ale aceleia\u0219i alele pe cei doi cromozomi omologi (AA sau aa), heterozigotul dou\u0103 alele diferite (Aa). Un homozigot poate fi \u0219i recesiv (aa), deci deosebirea nu \u021bine de dominan\u021b\u0103, iar fenotipul heterozigotului nu e neap\u0103rat ascuns.", "tag": "Homozigot \u0219i heterozigot", "src": "Cap. 2 (Ereditatea mendelian\u0103: legile lui Mendel)"}, {"q": "\u00centr-o familie, trei din cei \u0219ase copii ai unor p\u0103rin\u021bi s\u0103n\u0103to\u0219i, b\u0103ie\u021bi \u0219i fete, au aceea\u0219i boal\u0103; nici bunicii, nici unchii, nici copiii bolnavilor nu o au. Ce model de transmitere e cel mai probabil?", "opts": ["Dominant legat de X", "Dominant autozomal cu debut tardiv", "Recesiv autozomal", "Recesiv legat de X"], "correct": 2, "explain": "Bolnavii doar \u00eentr-o fratrie, din p\u0103rin\u021bi s\u0103n\u0103to\u0219i, la ambele sexe: modelul orizontal al eredit\u0103\u021bii recesive autozomale. O boal\u0103 dominant\u0103 ar ap\u0103rea \u0219i la un p\u0103rinte (debutul tardiv nu explic\u0103 bunicii s\u0103n\u0103to\u0219i peste tot), cea recesiv\u0103 legat\u0103 de X ar afecta aproape numai b\u0103ie\u021bi.", "tag": "Criteriile transmiterii recesive", "src": "Cap. 3 (Modele de transmitere a caracterelor monogenice (mendeliene) \u00een familiile umane)"}, {"q": "Ce tip de ereditate are o tr\u0103s\u0103tur\u0103 transmis\u0103 numai de la tat\u0103 la fiu?", "opts": ["Holandric\u0103, prin cromozomul Y", "Dominant\u0103, legat\u0103 de cromozomul X", "Influen\u021bat\u0103 de sex, pe un autozom", "Recesiv\u0103, legat\u0103 de cromozomul X"], "correct": 0, "explain": "Doar Y trece exclusiv de la tat\u0103 la fiu: ereditatea holandric\u0103. O gen\u0103 de pe X nu se transmite niciodat\u0103 de la tat\u0103 la fiu (fiul prime\u0219te de la tat\u0103 Y), iar ereditatea influen\u021bat\u0103 de sex \u021bine de o gen\u0103 autozomal\u0103, transmis\u0103 de ambii p\u0103rin\u021bi.", "tag": "Cromozomul Y \u0219i ereditatea holandric\u0103", "src": "Cap. 3 (Modele de transmitere a caracterelor monogenice (mendeliene) \u00een familiile umane)"}, {"q": "De ce a fost stabilit abia \u00een 1956 num\u0103rul exact de cromozomi ai omului?", "opts": ["Structura ADN-ului nu fusese \u00eenc\u0103 descoperit\u0103", "Num\u0103rul cromozomilor difer\u0103 de la o ras\u0103 uman\u0103 la alta", "Imaginile microscopice fiabile erau greu de ob\u021binut", "Cromozomii se vedeau numai \u00een celulele sexuale"], "correct": 2, "explain": "Dificult\u0103\u021bile tehnice explic\u0103 \u00eent\u00e2rzierea: p\u00e2n\u0103 atunci se credea c\u0103 omul are, ca alte primate, 48 de cromozomi, de\u0219i modelul ADN era deja cunoscut din 1953. Cromozomii sunt similari la toate rasele \u0219i se v\u0103d \u00een orice celul\u0103 aflat\u0103 \u00een diviziune.", "tag": "Formula cromozomial\u0103", "src": "Cap. 4 (Bazele cromozomiale ale eredit\u0103\u021bii. Cromozomii umani: morfologie, structur\u0103, func\u021bie)"}, {"q": "\u00centr-un program care urm\u0103re\u0219te fii \u00eenal\u021bi din cupluri \u00eenalte, hrana copiilor difer\u0103 mult de la un ora\u0219 la altul \u0219i de la o familie la alta. Ce efect are asta asupra rezultatelor?", "opts": ["Face din talie un caracter discontinuu, cu prag", "Nu are efect, fiindc\u0103 heritabilitatea e de 0,80", "Schimb\u0103 genele transmise copiilor din ora\u0219ele s\u0103race", "M\u0103re\u0219te varia\u021bia taliei, peste cea dat\u0103 de gene"], "correct": 3, "explain": "Acela\u0219i genotip d\u0103 talii diferite \u00een medii diferite (norma de reac\u021bie), deci hrana inegal\u0103 adaug\u0103 varia\u021bie peste cea genetic\u0103. Heritabilitatea de 0,80 e m\u0103surat\u0103 \u00eentr-o popula\u021bie \u0219i nu exclude efectul mediului; hrana nu schimb\u0103 genele.", "tag": "Norma de reac\u021bie", "src": "Cap. 6 (Ereditatea multifactorial\u0103 sau poligenic\u0103)"}, {"q": "De ce au gemenii monozigo\u021bi aceea\u0219i frecven\u021b\u0103 \u00een toate popula\u021biile, spre deosebire de dizigo\u021bi?", "opts": ["Apari\u021bia lor nu pare condi\u021bionat\u0103 genetic", "Provin dintr-o ovula\u021bie dubl\u0103, ereditar\u0103", "Depind de v\u00e2rsta mamei, ca trisomia 21", "Sunt mai des elimina\u021bi prin avort spontan"], "correct": 0, "explain": "MZ apar prin scindarea unui zigot \u00een primele 14 zile, cu frecven\u021b\u0103 constant\u0103 (0,3\u20130,4%), deci nu par condi\u021biona\u021bi genetic. Ovula\u021bia dubl\u0103 e mecanismul dizigo\u021bilor, care are concentrare familial\u0103 \u0219i variaz\u0103 \u00eentre popula\u021bii.", "tag": "Gemenii MZ \u0219i DZ", "src": "Cap. 6 (Ereditatea multifactorial\u0103 sau poligenic\u0103)"}, {"q": "De ce se ocup\u0103 genetica formal\u0103?", "opts": ["De secven\u021bierea \u0219i analiza genomului uman", "De ereditatea la nivelul moleculelor de ADN", "De legile transmiterii caracterelor ereditare", "De setul de proteine codificat de genom"], "correct": 2, "explain": "Genetica formal\u0103 trateaz\u0103 legile transmiterii caracterelor ereditare. Ereditatea la nivel molecular e domeniul geneticii moleculare, secven\u021bierea genomului \u021bine de genomic\u0103, iar studiul proteinelor, de proteomic\u0103.", "tag": "Ramurile geneticii", "src": "Cap. 1 (Introducere \u00een genetic\u0103)"}, {"q": "O femeie are un copil cu grupa O din prima c\u0103s\u0103torie (so\u021bul avea grupa A) \u0219i un copil cu grupa AB din a doua (so\u021bul are grupa B). Ce grup\u0103 \u0219i ce genotip are femeia?", "opts": ["Grupa AB, genotipul L\u1d2cL\u1d2e", "Grupa A, genotipul L\u1d2cl", "Grupa O, genotipul ll", "Grupa A, genotipul L\u1d2cL\u1d2c"], "correct": 1, "explain": "Copilul AB prime\u0219te L\u1d2e de la tat\u0103l B, deci de la mam\u0103 L\u1d2c; copilul O (ll) prime\u0219te l de la mam\u0103. Mama are deci L\u1d2c \u0219i l: grupa A, genotip L\u1d2cl. Cu L\u1d2cL\u1d2e nu ar fi putut avea un copil O, iar cu ll nu ar fi avut un copil AB.", "tag": "Alelele ABO", "src": "Cap. 2 (Ereditatea mendelian\u0103: legile lui Mendel)"}, {"q": "Ce efect a avut citogenetica molecular\u0103 asupra distinc\u021biei dintre muta\u021biile cromozomiale \u0219i cele genice?", "opts": ["A confirmat-o, fiindc\u0103 arat\u0103 doar cromozomi \u00eentregi", "A mutat-o la nivelul nucleotidelor izolate", "A estompat-o, ar\u0103t\u00e2nd modific\u0103ri mult sub 4 Mb", "A \u00eent\u0103rit-o, fix\u00e2nd un prag vizibil de 4 Mb"], "correct": 2, "explain": "Preparatele standard arat\u0103 pierderi sau c\u00e2\u0219tiguri de la circa 4 Mb; colorarea fluorescent\u0103 \u0219i hibridizarea in situ arat\u0103 modific\u0103ri mult mai mici, deci linia dintre anomalia citogenetic\u0103 \u0219i defectul ADN a disp\u0103rut. Pragul de 4 Mb \u021bine de tehnica veche.", "tag": "Pragul vizibilit\u0103\u021bii (4 Mb)", "src": "Cap. 5 (Anomaliile cromozomiale \u0219i consecin\u021bele lor clinice)"}, {"q": "De ce e pu\u021bin probabil ca un comportament uman complex s\u0103 fie determinat de o singur\u0103 gen\u0103?", "opts": ["Comportamentul nu e un fenotip care s\u0103 poat\u0103 fi m\u0103surat", "Comportamentele sunt adesea colec\u021bii heterogene \u0219i complexe", "Muta\u021biile nu afecteaz\u0103 func\u021bionarea sistemului nervos", "Genele implicate \u00een comportament sunt recesive"], "correct": 1, "explain": "Comportamentele sunt deseori colec\u021bii heterogene de comportamente diverse \u0219i complicate, deci cele complexe sunt rar monogenice. Comportamentul e totu\u0219i un fenotip m\u0103surabil, iar la \u0219oarece peste 300 de defecte neurologice \u021bin de muta\u021bii, mai ales recesive.", "tag": "Ipoteza genei unice", "src": "Cap. 2 (Ereditatea mendelian\u0103: legile lui Mendel)"}, {"q": "O celul\u0103 a epidermului cu 46 de cromozomi se divide de trei ori la r\u00e2nd prin mitoz\u0103. C\u00e2\u021bi cromozomi are fiecare dintre cele opt celule rezultate?", "opts": ["6", "92", "23", "46"], "correct": 3, "explain": "Mitoza p\u0103streaz\u0103 num\u0103rul \u0219i con\u021binutul cromozomial: dup\u0103 oric\u00e2te diviziuni, fiecare celul\u0103 are tot 2n = 46, fiindc\u0103 ADN-ul se replic\u0103 \u00een faza S \u00eenaintea fiec\u0103rei diviziuni. 23 e num\u0103rul game\u021bilor, dup\u0103 meioz\u0103; 92 ar cere dublare f\u0103r\u0103 diviziune.", "tag": "Mitoza", "src": "Cap. 4 (Bazele cromozomiale ale eredit\u0103\u021bii. Cromozomii umani: morfologie, structur\u0103, func\u021bie)"}, {"q": "De ce a e\u0219uat \u00een SUA screeningul purt\u0103torilor de hemoglobin\u0103 S?", "opts": ["Testul se putea face doar \u00een timpul sarcinii, prenatal", "F\u0103r\u0103 informare, popula\u021bia s-a sim\u021bit discriminat\u0103", "Muta\u021bia nu poate fi detectat\u0103 la purt\u0103torii s\u0103n\u0103to\u0219i", "Boala era rar\u0103 \u00een popula\u021bia c\u0103reia i s-a oferit testul"], "correct": 1, "explain": "\u00cen lipsa unei campanii de informare, popula\u021bia de culoare a refuzat testul. Screeningul talasemiei \u00een Sardinia \u0219i cel pentru Tay-Sachs au reu\u0219it tocmai pentru c\u0103 au fost precedate de informare \u0219i sfat genetic. Nedetectabilitatea e o limit\u0103 real\u0103, dar a altor muta\u021bii (albinismul).", "tag": "Screeningul heterozigo\u021bilor", "src": "Cap. 3 (Modele de transmitere a caracterelor monogenice (mendeliene) \u00een familiile umane)"}, {"q": "Prin ce a indus Morgan muta\u021bii la musculi\u021bele de o\u021bet?", "opts": ["Prin substan\u021be chimice puse \u00een hran\u0103", "Prin iradierea lor cu raze X", "Prin cre\u0219terea lor la temperaturi extreme", "Prin \u00eencruci\u0219\u0103ri repetate \u00eentre rude"], "correct": 1, "explain": "Morgan a ajuns la dovada c\u0103 genele stau \u00een cromozomi dup\u0103 experien\u021be \u00eendelungi de inducere a muta\u021biilor prin raze X. \u00cencruci\u0219\u0103rile \u00eentre rude cresc homozigo\u021bia, dar nu produc muta\u021bii; substan\u021bele chimice sunt \u0219i ele mutagene, dar nu au fost metoda lui.", "tag": "Muta\u021bia \u0219i mutageneza", "src": "Cap. 4 (Bazele cromozomiale ale eredit\u0103\u021bii. Cromozomii umani: morfologie, structur\u0103, func\u021bie)"}, {"q": "Un model evolutiv porne\u0219te de la o maimu\u021b\u0103 cu 47 de cromozomi, purt\u0103toare a unei fuziuni \u00eentre doi acrocentrici. De ce ar fi fost nevoie, pentru fixarea fuziunii, de \u00eemperecherea a doi fra\u021bi, urma\u0219i ai ei?", "opts": ["Fra\u021bii aveau deja c\u00e2te 46 de cromozomi", "Fuziunea devine homozigot\u0103 doar din doi game\u021bi cu 23", "Fuziunea se transmite doar pe linie patern\u0103", "Consangvinitatea repar\u0103 game\u021bii neechilibra\u021bi"], "correct": 1, "explain": "Purt\u0103torul face game\u021bi cu 24 (normali) \u0219i cu 23 (cu fuziunea); 46 cu fuziunea dubl\u0103 apare doar din doi game\u021bi cu 23. Fiindc\u0103 e greu ca acela\u0219i accident s\u0103 apar\u0103 la doi parteneri, s-a presupus incestul a doi urma\u0219i, fiecare cu 50% game\u021bi cu 23.", "tag": "Ipoteza incestului", "src": "Cap. 5 (Anomaliile cromozomiale \u0219i consecin\u021bele lor clinice)"}, {"q": "De ce nu pot studiile pe gemeni identifica genele unui caracter multifactorial?", "opts": ["Gemenii MZ au gene diferite \u00een fiecare \u021besut", "Gemenii nu au caractere multifactoriale", "Gemenii au prea pu\u021bine gene \u00een comun", "Arat\u0103 ponderea genelor, nu care gene sunt"], "correct": 3, "explain": "Compara\u021bia MZ\u2013DZ estimeaz\u0103 c\u00e2t conteaz\u0103 genele, dar nu le localizeaz\u0103; locul gemenilor \u00eel iau tehnologiile moderne de studiu direct al genelor. MZ au toate genele \u00een comun, DZ jum\u0103tate.", "tag": "Studiul direct al genelor", "src": "Cap. 6 (Ereditatea multifactorial\u0103 sau poligenic\u0103)"}, {"q": "Ce rezult\u0103 din muta\u021bia unei gene?", "opts": ["Un locus nou, plasat pe alt cromozom", "Un fenotip nou, dob\u00e2ndit din mediu", "Un genotip nou, identic la to\u021bi urma\u0219ii", "O variant\u0103 genic\u0103 nou\u0103, numit\u0103 alel\u0103"], "correct": 3, "explain": "Modificarea brusc\u0103 a structurii moleculare a unei gene produce o variant\u0103 genic\u0103 numit\u0103 alel\u0103, normal\u0103 sau anormal\u0103, care se poate transmite urma\u0219ilor. Locusul e pozi\u021bia genei pe cromozom \u0219i nu se schimb\u0103 prin muta\u021bie, iar o tr\u0103s\u0103tur\u0103 dob\u00e2ndit\u0103 din mediu nu e o muta\u021bie.", "tag": "Muta\u021bia \u0219i alela", "src": "Cap. 1 (Introducere \u00een genetic\u0103)"}, {"q": "Un laborator trebuie s\u0103 stabileasc\u0103 dac\u0103 doi gemeni de acela\u0219i sex sunt monozigo\u021bi sau dizigo\u021bi. Ce caractere compar\u0103 \u0219i de ce?", "opts": ["Inteligen\u021ba, condi\u021bionat\u0103 genetic \u0219i de mediu", "Grupele sanguine \u0219i HLA, care nu depind de mediu", "Tensiunea arterial\u0103, cu o component\u0103 familial\u0103", "\u00cen\u0103l\u021bimea \u0219i greutatea, condi\u021bionate puternic genetic"], "correct": 1, "explain": "Diagnosticul diferen\u021bial al gemenilor monozigo\u021bi \u0219i dizigo\u021bi se face pe caractere determinate genetic, f\u0103r\u0103 influen\u021ba mediului: grupe sanguine, grupe tisulare, proteine serice. \u00cen\u0103l\u021bimea, greutatea, inteligen\u021ba \u0219i tensiunea sunt multifactoriale, deci pot diferi \u0219i la gemeni identici crescu\u021bi diferit.", "tag": "Determinism exclusiv genetic", "src": "Cap. 1 (Introducere \u00een genetic\u0103)"}, {"q": "Pentru ce conteaz\u0103 distinc\u021bia dintre anomaliile cromozomiale accidentale \u0219i cele mo\u0219tenite?", "opts": ["Pentru stadiul \u00een care e eliminat embrionul", "Pentru riscul de repetare la copiii urm\u0103tori", "Pentru gravitatea manifest\u0103rilor la purt\u0103tor", "Pentru tehnica de colorare a cromozomilor"], "correct": 1, "explain": "Distinc\u021bia prive\u0219te riscul reproductiv: o anomalie accidental\u0103 are risc mic de repetare, una mo\u0219tenit\u0103 de la un p\u0103rinte purt\u0103tor (de pild\u0103 o transloca\u021bie echilibrat\u0103) are risc mare. Gravitatea depinde de tipul anomaliei, nu de originea ei.", "tag": "Accidentale vs mo\u0219tenite", "src": "Cap. 5 (Anomaliile cromozomiale \u0219i consecin\u021bele lor clinice)"}, {"q": "C\u00e2te combina\u021bii de cromozomi materni \u0219i paterni pot ap\u0103rea \u00een game\u021bii unui om, f\u0103r\u0103 crossing-over?", "opts": ["2\u00b2\u00b3, adic\u0103 peste 8 milioane", "2\u2074\u2076, adic\u0103 peste 70.000 de miliarde", "23, c\u00e2te una pentru fiecare pereche", "46, c\u00e2te una pentru fiecare cromozom"], "correct": 0, "explain": "Din fiecare dintre cele 23 de perechi intr\u0103 \u00een gamet, la \u00eent\u00e2mplare, cromozomul matern sau cel patern: 2\u00b2\u00b3 = 8.388.608 variante. 2\u2074\u2076 e num\u0103rul combina\u021biilor posibile la fecunda\u021bie, prin unirea a doi game\u021bi.", "tag": "Diversitatea genetic\u0103", "src": "Cap. 2 (Ereditatea mendelian\u0103: legile lui Mendel)"}, {"q": "Un b\u0103rbat cu galactozemie (recesiv\u0103 autozomal\u0103), tratat de mic, vrea copii cu o femeie s\u0103n\u0103toas\u0103, f\u0103r\u0103 boala \u00een familie. Ce se a\u0219teapt\u0103 la copiii lor?", "opts": ["To\u021bi s\u0103n\u0103to\u0219i \u0219i to\u021bi purt\u0103tori", "Bolnavi, fiindc\u0103 tat\u0103l e homozigot", "Jum\u0103tate bolnavi, jum\u0103tate purt\u0103tori", "Un sfert bolnavi, restul s\u0103n\u0103to\u0219i"], "correct": 0, "explain": "mm \u00d7 NN d\u0103 numai copii Nm: s\u0103n\u0103to\u0219i, dar purt\u0103tori. Jum\u0103tate bolnavi ar cere o mam\u0103 purt\u0103toare (Nm \u00d7 mm), un sfert doi p\u0103rin\u021bi purt\u0103tori; homozigo\u021bia tat\u0103lui nu ajunge, copilul prime\u0219te de la mam\u0103 alela normal\u0103.", "tag": "Criteriile transmiterii recesive", "src": "Cap. 3 (Modele de transmitere a caracterelor monogenice (mendeliene) \u00een familiile umane)"}, {"q": "Ce trebuie s\u0103 precead\u0103 orice procedur\u0103 de diagnostic genetic?", "opts": ["Screeningul tuturor rudelor de gradul I ale persoanei", "Un diagnostic prenatal f\u0103cut prin amniocentez\u0103", "Stabilirea cariotipului tuturor membrilor familiei", "Un sfat genetic, cu consim\u021b\u0103m\u00e2nt informat"], "correct": 3, "explain": "Regula general\u0103: diagnosticul genetic e precedat de sfat genetic, care include obligatoriu consim\u021b\u0103m\u00e2ntul informat. Diagnosticul prenatal e una dintre procedurile care urmeaz\u0103, nu condi\u021bia lor; testarea tuturor rudelor sau a cariotipurilor nu e cerut\u0103.", "tag": "Consim\u021b\u0103m\u00e2ntul \u0219i diagnosticul prenatal", "src": "Cap. 3 (Modele de transmitere a caracterelor monogenice (mendeliene) \u00een familiile umane)"}, {"q": "Ce afirm\u0103 axioma lui Virchow?", "opts": ["Celulele noi se formeaz\u0103 prin diviziunea celor existente", "Celulele noi se formeaz\u0103 din materie neorganizat\u0103", "Cromozomii devin vizibili doar \u00een timpul diviziunii", "Genele sunt a\u0219ezate liniar de-a lungul cromozomilor"], "correct": 0, "explain": "\u201eOmnis cellula e cellula\u201d: orice celul\u0103 provine dintr-o alt\u0103 celul\u0103, prin diviziune. A\u0219ezarea liniar\u0103 a genelor e o tez\u0103 a teoriei lui Morgan, iar vizibilitatea cromozomilor doar \u00een diviziune e o proprietate a lor, nu axioma lui Virchow.", "tag": "Axioma lui Virchow", "src": "Cap. 4 (Bazele cromozomiale ale eredit\u0103\u021bii. Cromozomii umani: morfologie, structur\u0103, func\u021bie)"}, {"q": "La copiii cu deficit de aten\u021bie\u2013hiperactivitate dintr-o familie se g\u0103sesc rezisten\u021b\u0103 la hormonii tiroidieni \u0219i o muta\u021bie dominant\u0103 \u00een gena receptorului acestor hormoni. Ce ilustreaz\u0103 cercetarea?", "opts": ["Un caz de mozaic cromozomial cu o linie celular\u0103 anormal\u0103", "Un efect de mediu confundat cu unul genetic", "Studiul direct al genelor, care completeaz\u0103 gemelologia", "Un model cu prag \u00een care genele nu se pot identifica"], "correct": 2, "explain": "Pornind de la concentrarea familial\u0103 \u0219i de la hiperactivitatea din rezisten\u021ba la hormonii tiroidieni, s-a studiat gena receptorului (cromozomul 3): peste 30 de muta\u021bii dominante. E un exemplu de studiu direct al genelor, unde gemenii nu ajung; mecanismul r\u0103m\u00e2ne neclar.", "tag": "Studiul direct al genelor", "src": "Cap. 6 (Ereditatea multifactorial\u0103 sau poligenic\u0103)"}]}, {"desc": "30 de \u00eentreb\u0103ri ascunse \u2014 nu apar \u00een paginile capitolelor \u0219i nu se repet\u0103 \u00een alt quiz final.", "intrebari": [{"q": "Ce frecven\u021b\u0103 global\u0103 au bolile multifactoriale, fa\u021b\u0103 de cele monogenice?", "opts": ["Circa 50%, fa\u021b\u0103 de 10%", "Circa 0,5%, fa\u021b\u0103 de 5%", "Circa 1\u20132%, fa\u021b\u0103 de 15%", "Circa 15%, fa\u021b\u0103 de 1\u20132%"], "correct": 3, "explain": "Bolile monogenice sunt rare (1\u20132% global), cele multifactoriale frecvente (circa 15%), de aceea sunt numite \u201ecomune\u201d. Varianta inversat\u0103 confund\u0103 cele dou\u0103 categorii.", "tag": "Frecven\u021ba: 1\u20132% vs 15%", "src": "Cap. 6 (Ereditatea multifactorial\u0103 sau poligenic\u0103)"}, {"q": "Ce sus\u021bine Voltaire despre educa\u021bie, \u00een citatul folosit pentru psihogenetic\u0103?", "opts": ["E inutil\u0103 acolo unde zestrea ereditar\u0103 e s\u0103rac\u0103", "Conteaz\u0103 mai pu\u021bin dec\u00e2t selec\u021bia elevilor", "Pune \u00een valoare calit\u0103\u021bile omului, dar nu le poate crea", "Poate crea \u0219i calit\u0103\u021bile care lipsesc omului pe cale ereditar\u0103"], "correct": 2, "explain": "\u201eO educa\u021bie aleas\u0103 pune \u00een valoare calit\u0103\u021bile omului, dar nu poate s\u0103 le creeze\u201d: poten\u021bialul genetic se realizeaz\u0103 doar \u00eentr-un mediu adecvat. Psihogenetica nu vede o contradic\u021bie \u00eentre influen\u021ba genetic\u0103 \u0219i educa\u021bie, deci educa\u021bia nu e inutil\u0103, dar nici nu creeaz\u0103 ce lipse\u0219te.", "tag": "Psihogenetica", "src": "Cap. 1 (Introducere \u00een genetic\u0103)"}, {"q": "Ignor\u00e2nd crossing-over-ul, care e probabilitatea ca un gamet al unei persoane s\u0103 con\u021bin\u0103 numai cromozomii primi\u021bi de la mama ei?", "opts": ["1/23, una din cele 23 de perechi", "(\u00bd)\u00b2\u00b3, o valoare infim\u0103", "\u00bd, ca pentru o singur\u0103 pereche", "1/46, unul din cei 46 de cromozomi"], "correct": 1, "explain": "Pentru fiecare dintre cele 23 de perechi, cromozomul matern intr\u0103 \u00een gamet cu probabilitate \u00bd, independent de celelalte; to\u021bi 23: (\u00bd)\u00b2\u00b3, aproximativ 1 la 8 milioane. Probabilitatea \u00bd e valabil\u0103 pentru o singur\u0103 pereche.", "tag": "Diversitatea genetic\u0103", "src": "Cap. 2 (Ereditatea mendelian\u0103: legile lui Mendel)"}, {"q": "Ce rol are, pentru specie, sterilitatea frecvent\u0103 a purt\u0103torilor de anomalii cromozomiale?", "opts": ["Cre\u0219te variabilitatea genetic\u0103 a popula\u021biei", "Favorizeaz\u0103 apari\u021bia unor specii noi", "Elimin\u0103 treptat genele recesive d\u0103un\u0103toare", "Protejeaz\u0103 cariotipul de schimb\u0103ri drastice"], "correct": 3, "explain": "Fiindc\u0103 purt\u0103torii au poten\u021bial reproductiv redus, anomaliile de obicei nu se transmit: la nivel de specie, e o ap\u0103rare \u00eempotriva modific\u0103rilor drastice ale cariotipului. Genele recesive se ascund la heterozigo\u021bi, deci nu sunt eliminate astfel.", "tag": "Sterilitatea ca ap\u0103rare", "src": "Cap. 5 (Anomaliile cromozomiale \u0219i consecin\u021bele lor clinice)"}, {"q": "Ce poate ar\u0103ta distribu\u021bia alelelor ABO \u00een popula\u021biile de pe glob?", "opts": ["Urma marilor migra\u021bii ale popula\u021biilor", "Gradul de consangvinizare al popula\u021biilor", "Vechimea muta\u021biilor ap\u0103rute la om", "Propor\u021bia gemenilor dintr-o popula\u021bie"], "correct": 0, "explain": "Frecven\u021bele grupelor ABO difer\u0103 \u00eentre popula\u021bii (poate prin adaptare la bolile unei zone), iar modelul lor de distribu\u021bie permite adesea trasarea marilor migra\u021bii: alela B s-ar fi r\u0103sp\u00e2ndit din Asia central\u0103, unde are frecven\u021ba maxim\u0103.", "tag": "Grupele \u00een popula\u021bii", "src": "Cap. 2 (Ereditatea mendelian\u0103: legile lui Mendel)"}, {"q": "Un student deseneaz\u0103 un cariotip uman \u0219i pune printre cromozomi unul cu centromerul chiar la cap\u0103t, f\u0103r\u0103 bra\u021b scurt. Ce gre\u0219eal\u0103 a f\u0103cut?", "opts": ["Cromozomii acrocentrici nu exist\u0103 la om", "Centromerul st\u0103 de regul\u0103 la mijlocul cromozomului", "Bra\u021bul scurt se deseneaz\u0103 sub centromer", "Cromozomii telocentrici nu exist\u0103 la om"], "correct": 3, "explain": "Cu centromerul absolut terminal, cromozomul e telocentric, tip care nu exist\u0103 \u00een specia uman\u0103. Acrocentricii (centromer aproape terminal) exist\u0103; centromerul poate sta \u00een orice punct, iar bra\u021bul scurt p se deseneaz\u0103 deasupra.", "tag": "Tipurile morfologice", "src": "Cap. 4 (Bazele cromozomiale ale eredit\u0103\u021bii. Cromozomii umani: morfologie, structur\u0103, func\u021bie)"}, {"q": "Ce explic\u0103 frecven\u021ba mare a talasemiei \u00een zonele cu malarie?", "opts": ["Heterozigo\u021bii rezist\u0103 la malarie \u0219i au mai mul\u021bi urma\u0219i", "Homozigo\u021bii bolnavi se vindec\u0103 mai repede de malarie", "C\u0103s\u0103toriile dintre rude sunt mai dese \u00een aceste sate", "Malaria produce la purt\u0103tori muta\u021bia care d\u0103 talasemia"], "correct": 0, "explain": "Avantajul selectiv al heterozigo\u021bilor: purt\u0103torii talasemiei rezist\u0103 la malarie, iar homozigo\u021bii normali erau secera\u021bi de boal\u0103, deci alela s-a r\u0103sp\u00e2ndit. Mediul nu produce muta\u021bia \u021bintit, homozigo\u021bii au forma major\u0103, foarte grav\u0103, iar consangvinitatea ar m\u0103ri frecven\u021ba oric\u0103rei boli recesive, nu doar acolo unde e malarie.", "tag": "Talasemia \u0219i malaria", "src": "Cap. 3 (Modele de transmitere a caracterelor monogenice (mendeliene) \u00een familiile umane)"}, {"q": "Ce arat\u0103 faptul c\u0103 genele unuia dintre cromozomii X ai femeii exist\u0103, dar nu func\u021bioneaz\u0103?", "opts": ["Genele inactive sunt eliminate treptat din celulele adulte", "Expresia genelor depinde de reglarea activit\u0103\u021bii lor", "Fenotipul depinde numai de num\u0103rul de gene prezente", "Fiecare gen\u0103 se exprim\u0103 la fel \u00een toate celulele"], "correct": 1, "explain": "Inactivarea unui X e un mecanism de reglaj genetic: genele sunt prezente, dar oprite. De aici concluzia c\u0103 nu genele singure fac \u201esimfonia vie\u021bii\u201d, ci dirijarea activit\u0103\u021bii lor. Genele nu sunt eliminate, iar femeile sunt mozaicuri tocmai pentru c\u0103 expresia difer\u0103 \u00eentre celule.", "tag": "Reglajul genetic", "src": "Cap. 4 (Bazele cromozomiale ale eredit\u0103\u021bii. Cromozomii umani: morfologie, structur\u0103, func\u021bie)"}, {"q": "Doi b\u0103ie\u021bi 47,XXY cresc \u00een familii diferite: unul \u00eentr-o familie stabil\u0103, cel\u0103lalt \u00eentr-una conflictual\u0103. Primul difer\u0103 pu\u021bin de fra\u021bii lui, al doilea are probleme serioase de dezvoltare. Ce ilustreaz\u0103 cazul?", "opts": ["Penetran\u021ba incomplet\u0103 a unei gene dominante", "Interac\u021biunea dintre genotip \u0219i mediu", "Efectul mozaicului asupra gravit\u0103\u021bii", "Expresivitatea variabil\u0103 a unei boli X-linkate"], "correct": 1, "explain": "Acela\u0219i cariotip d\u0103 tablouri diferite dup\u0103 mediu: \u00een familiile stabile, copiii cu anomalii gonozomale difer\u0103 pu\u021bin de fra\u021bi. Penetran\u021ba \u0219i expresivitatea, din Cap. 3 (Modele de transmitere a caracterelor monogenice (mendeliene) \u00een familiile umane), privesc o gen\u0103, iar b\u0103ie\u021bii nu sunt descri\u0219i ca mozaicuri.", "tag": "Genotip\u2013mediu \u00een anomalii", "src": "Cap. 5 (Anomaliile cromozomiale \u0219i consecin\u021bele lor clinice)"}, {"q": "Ce afirm\u0103 modelul oligogenic propus pentru determinismul taliei?", "opts": ["Multe gene mici \u0219i egale, f\u0103r\u0103 vreo gen\u0103 cu efect major", "Patru perechi de gene egale, f\u0103r\u0103 rol al mediului", "O singur\u0103 gen\u0103 major\u0103, cu dominan\u021b\u0103 incomplet\u0103", "Dou\u0103 gene majore, plus gene \u0219i mediu cu efecte mici"], "correct": 3, "explain": "Modelul oligogenic propune dou\u0103 gene cu efect major, la care se adaug\u0103 componenta multifactorial\u0103: alte gene \u0219i factori de mediu cu efecte mici. Patru perechi de gene e modelul ulterior al culorii pielii; \u201emulte gene mici\u201d e modelul poligenic clasic.", "tag": "Modelul oligogenic al taliei", "src": "Cap. 6 (Ereditatea multifactorial\u0103 sau poligenic\u0103)"}, {"q": "Ce stabile\u0219te Declara\u021bia Universal\u0103 asupra Genomului Uman (UNESCO, 1997)?", "opts": ["Testele genetice devin obligatorii la angajare", "Clonarea uman\u0103 e permis\u0103 \u00een scop terapeutic", "Genomul apar\u021bine statului ale c\u0103rui laboratoare \u00eel secven\u021biaz\u0103", "Genomul e patrimoniu comun, f\u0103r\u0103 discriminare genetic\u0103"], "correct": 3, "explain": "Declara\u021bia consider\u0103 genomul uman patrimoniu comun al umanit\u0103\u021bii, interzice discriminarea pe baza caracteristicilor genetice, fixeaz\u0103 limite interven\u021biilor \u0219i respinge orice determinism genetic. Testele obligatorii sau proprietatea statului asupra genomului ar contrazice-o; clonarea e una dintre temele care provoac\u0103 \u00eengrijorare.", "tag": "Declara\u021bia Universal\u0103 asupra Genomului Uman", "src": "Cap. 1 (Introducere \u00een genetic\u0103)"}, {"q": "Un laborator analizeaz\u0103 ADN-ul de pe un pahar l\u0103sat de o persoan\u0103 la restaurant, la cererea unei rude, f\u0103r\u0103 s\u0103 o anun\u021be sau s\u0103-i cear\u0103 acordul. Ce principii ale bioeticii \u00eencalc\u0103?", "opts": ["Nediscriminarea genetic\u0103 \u0219i dreptul la un transplant", "Autonomia, consim\u021b\u0103m\u00e2ntul informat \u0219i confiden\u021bialitatea", "Medicina predictiv\u0103 \u0219i screeningul genetic la na\u0219tere", "Patrimoniul comun al umanit\u0103\u021bii \u0219i libertatea cercet\u0103rii \u0219tiin\u021bifice"], "correct": 1, "explain": "Mostrele de ADN pe care le l\u0103s\u0103m peste tot fac folosirea lor incontrolabil\u0103 dac\u0103 nu se respect\u0103 autonomia \u0219i consim\u021b\u0103m\u00e2ntul informat, precum \u0219i confiden\u021bialitatea. Medicina predictiv\u0103 \u0219i screeningul sunt aplica\u021bii, nu principii, iar nediscriminarea prive\u0219te tratamentul aplicat persoanei dup\u0103 aflarea datelor.", "tag": "Principiile bioeticii", "src": "Cap. 1 (Introducere \u00een genetic\u0103)"}, {"q": "C\u00e2\u021bi cromozomi are un zigot format dintr-un gamet cu non-disjunc\u021bie meiotic\u0103 \u0219i unul normal?", "opts": ["69 de cromozomi, adic\u0103 un triploid", "44 sau 48 de cromozomi", "45 sau 47 de cromozomi", "46 de cromozomi, dar \u00een mozaic"], "correct": 2, "explain": "Gametul anormal are 22 sau 24 de cromozomi; cu un gamet normal (23) d\u0103 un zigot monosomic (45) sau trisomic (47). Mozaicul vine din non-disjunc\u021bia mitotic\u0103, dup\u0103 fecundare, iar 69 de cromozomi \u00eenseamn\u0103 un set \u00eentreg \u00een plus.", "tag": "Non-disjunc\u021bia", "src": "Cap. 5 (Anomaliile cromozomiale \u0219i consecin\u021bele lor clinice)"}, {"q": "Prin ce difer\u0103 rezultatul ovogenezei de cel al spermatogenezei?", "opts": ["Patru ovule, fa\u021b\u0103 de un spermatozoid \u0219i globuli polari", "Un ovul diploid, fa\u021b\u0103 de patru spermatozoizi", "Un ovul \u0219i globuli polari, fa\u021b\u0103 de patru spermatozoizi", "Ovule diploide, fa\u021b\u0103 de spermatozoizi haploizi"], "correct": 2, "explain": "Din oocitul primar rezult\u0103 un singur ovul matur, restul produselor fiind globuli polari; din spermatocitul primar rezult\u0103 patru spermatozoizi. Ambele tipuri de game\u021bi sunt haploizi (n), pentru c\u0103 ies din meioz\u0103.", "tag": "Ovogeneza \u0219i spermatogeneza", "src": "Cap. 2 (Ereditatea mendelian\u0103: legile lui Mendel)"}, {"q": "Un b\u0103rbat cu hemofilie, tratat, are copii cu o femeie care nu e purt\u0103toare. Ce se a\u0219teapt\u0103 la copiii lor?", "opts": ["Fii s\u0103n\u0103to\u0219i; toate fiicele purt\u0103toare", "To\u021bi fiii bolnavi; jum\u0103tate din fiice purt\u0103toare", "Jum\u0103tate din fii bolnavi; fiicele s\u0103n\u0103toase", "Fii \u0219i fiice purt\u0103tori \u00een propor\u021bii egale"], "correct": 0, "explain": "Fiii primesc de la tat\u0103 Y, deci sunt s\u0103n\u0103to\u0219i; fiicele primesc X-ul patern cu muta\u021bia, deci toate sunt purt\u0103toare \u0219i pot transmite boala mai departe. Jum\u0103tate din fii bolnavi ar fi situa\u021bia unei mame purt\u0103toare; un b\u0103rbat nu poate fi purt\u0103tor s\u0103n\u0103tos al unei gene de pe X.", "tag": "Transmiterea recesiv\u0103 legat\u0103 de X", "src": "Cap. 3 (Modele de transmitere a caracterelor monogenice (mendeliene) \u00een familiile umane)"}, {"q": "Doi gemeni monozigo\u021bi separa\u021bi la na\u0219tere, crescu\u021bi \u00een ora\u0219e diferite, au la 45 de ani IQ-uri la fel de apropiate ca ale gemenilor MZ crescu\u021bi \u00eempreun\u0103. Ce concluzie se potrive\u0219te?", "opts": ["La adult, genele conteaz\u0103 mai mult dec\u00e2t mediul", "Mediul familial comun e decisiv \u0219i la adult", "Separarea a \u0219ters influen\u021ba genelor asupra IQ-ului", "Gemenii erau de fapt dizigo\u021bi, cu gene diferite"], "correct": 0, "explain": "E rezultatul studiului Minnesota (Bouchard): adul\u021bii MZ nu sunt mai asem\u0103n\u0103tori dac\u0103 au crescut \u00eempreun\u0103, iar influen\u021ba genelor cre\u0219te cu v\u00e2rsta. Dac\u0103 mediul comun ar fi decisiv, gemenii crescu\u021bi \u00eempreun\u0103 ar fi mai asem\u0103n\u0103tori.", "tag": "Studiul Minnesota (Bouchard)", "src": "Cap. 6 (Ereditatea multifactorial\u0103 sau poligenic\u0103)"}, {"q": "Doi p\u0103rin\u021bi au am\u00e2ndoi p\u0103rul ondulat, tr\u0103s\u0103tur\u0103 cu dominan\u021b\u0103 incomplet\u0103 \u00eentre p\u0103rul cre\u021b \u0219i cel neted. Ce propor\u021bie din copiii lor se a\u0219teapt\u0103 s\u0103 aib\u0103 p\u0103rul cre\u021b?", "opts": ["3/4", "1/3", "1/2", "1/4"], "correct": 3, "explain": "P\u0103rul ondulat e fenotipul heterozigotului; doi heterozigo\u021bi dau \u00bc cre\u021b (homozigot), \u00bd ondulat \u0219i \u00bc neted, raport 1 : 2 : 1, cu fenotipurile identice genotipurilor. \u00bd e propor\u021bia copiilor ondula\u021bi, ca p\u0103rin\u021bii; \u00be ar fi propor\u021bia \u201edominant\u0103\u201d dintr-un raport 3 : 1, inexistent aici.", "tag": "Dominan\u021ba incomplet\u0103", "src": "Cap. 2 (Ereditatea mendelian\u0103: legile lui Mendel)"}, {"q": "Un cercet\u0103tor compar\u0103 cariotipurile unor oameni din popula\u021bii de pe continente diferite. Ce se a\u0219teapt\u0103 s\u0103 g\u0103seasc\u0103?", "opts": ["Acela\u0219i num\u0103r, dar alte tipuri morfologice", "Un num\u0103r diferit de autozomi, dup\u0103 popula\u021bie", "Acela\u0219i num\u0103r \u0219i aceea\u0219i morfologie a cromozomilor", "Un num\u0103r diferit de gonozomi, dup\u0103 clim\u0103"], "correct": 2, "explain": "Morfologia cromozomilor e constant\u0103 \u00een cadrul speciei \u0219i similar\u0103 la toate rasele umane; cariotipul e un parametru specific invariabil (46,XX sau 46,XY). Diferen\u021bele de num\u0103r sau form\u0103 \u021bin de anomalii individuale, nu de popula\u021bie.", "tag": "Cromozomii", "src": "Cap. 4 (Bazele cromozomiale ale eredit\u0103\u021bii. Cromozomii umani: morfologie, structur\u0103, func\u021bie)"}, {"q": "Un diagnostic prenatal descoper\u0103 \u00eent\u00e2mpl\u0103tor cariotipul 47,XYY, iar p\u0103rin\u021bii se tem c\u0103 fiul va fi violent. Ce informa\u021bie e corect\u0103?", "opts": ["Va fi steril, ca b\u0103rba\u021bii cu sindrom Klinefelter", "Va avea un IQ sever sc\u0103zut, ca \u00een trisomia 21", "Va avea un risc mare de violen\u021b\u0103, dovedit statistic", "Are multe \u0219anse s\u0103 fie normal; decizia e a lor"], "correct": 3, "explain": "Majoritatea b\u0103rba\u021bilor XYY sunt integra\u021bi social, pot fi fertili \u0219i au mai ales dificult\u0103\u021bi \u0219colare \u0219i de limbaj; de aceea screeningul postnatal e suspendat, iar diagnosticul prenatal se comunic\u0103 atent. IQ-ul e variabil, iar sterilitatea \u021bine de Klinefelter.", "tag": "Moratoriul screeningului XYY", "src": "Cap. 5 (Anomaliile cromozomiale \u0219i consecin\u021bele lor clinice)"}, {"q": "Doi cercet\u0103tori se contrazic: unul afirm\u0103 c\u0103 inteligen\u021ba e \u201e\u00eenn\u0103scut\u0103\u201d, cel\u0103lalt c\u0103 e \u201edob\u00e2ndit\u0103\u201d, fiecare cit\u00e2nd date care \u00eei sus\u021bin pozi\u021bia. Ce pozi\u021bie sus\u021bine genetica actual\u0103?", "opts": ["Inteligen\u021ba e jum\u0103tate \u00eenn\u0103scut\u0103 \u0219i jum\u0103tate dob\u00e2ndit\u0103, ca sume separate", "\u00cenn\u0103scutul \u0219i dob\u00e2nditul se pot separa net, ca \u00een teoriile clasice", "Ereditatea \u0219i mediul interac\u021bioneaz\u0103, fiecare depinz\u00e2nd de cel\u0103lalt", "Inteligen\u021ba e dob\u00e2ndit\u0103, iar testele m\u0103soar\u0103 doar efectul \u0219colii"], "correct": 2, "explain": "Teoriile clasice f\u0103ceau o deosebire net\u0103 \u00eentre \u00eenn\u0103scut \u0219i dob\u00e2ndit; cercet\u0103rile recente arat\u0103 c\u0103 cele dou\u0103 interac\u021bioneaz\u0103, fiecare depinz\u00e2nd de cel\u0103lalt, mai ales \u00een dezvoltarea creierului \u0219i a inteligen\u021bei. A le \u00eemp\u0103r\u021bi \u201ejum\u0103tate\u2013jum\u0103tate\u201d presupune tot c\u0103 se pot separa, iar varianta strict ambientalist\u0103 ignor\u0103 poten\u021bialul genetic.", "tag": "Interac\u021biunea ereditate\u2013mediu", "src": "Cap. 1 (Introducere \u00een genetic\u0103)"}, {"q": "Un b\u0103rbat daltonist are copii cu o femeie cu vedere normal\u0103, al c\u0103rei tat\u0103 era daltonist. Ce propor\u021bie dintre fiicele lor se a\u0219teapt\u0103 s\u0103 fie daltoniste?", "opts": ["1/4", "1", "1/2", "0"], "correct": 2, "explain": "Femeia a primit X-ul tat\u0103lui daltonist, deci e purt\u0103toare (X\u1d30X\u1d48). Fiicele primesc X\u1d48 de la tat\u0103 \u0219i, cu probabilitate \u00bd, X\u1d48 de la mam\u0103: jum\u0103tate daltoniste, jum\u0103tate purt\u0103toare. 0 ar fi dac\u0103 mama n-ar fi purt\u0103toare, 1/4 e propor\u021bia din to\u021bi copiii, iar 1 ar cere o mam\u0103 daltonist\u0103.", "tag": "Transmiterea recesiv\u0103 legat\u0103 de X", "src": "Cap. 3 (Modele de transmitere a caracterelor monogenice (mendeliene) \u00een familiile umane)"}, {"q": "Familia A are un copil cu stenoz\u0103 piloric\u0103, iar familia B are doi copii \u0219i un unchi cu aceea\u0219i boal\u0103. Pentru care familie e mai mare riscul empiric de recuren\u021b\u0103?", "opts": ["Egal, fiindc\u0103 stenoza piloric\u0103 e monogenic\u0103", "Pentru B, unde sunt mai mul\u021bi membri afecta\u021bi", "Egal, fiindc\u0103 riscul empiric \u021bine doar de popula\u021bie", "Pentru A, fiindc\u0103 B \u0219i-a epuizat deja riscul"], "correct": 1, "explain": "Riscul empiric cre\u0219te cu num\u0103rul membrilor afecta\u021bi: mai mul\u021bi afecta\u021bi indic\u0103 o \u00eenc\u0103rc\u0103tur\u0103 mai mare de gene de susceptibilitate \u00een familie. Riscul nu se \u201eepuizeaz\u0103\u201d, iar stenoza piloric\u0103 e multifactorial\u0103.", "tag": "Mai mul\u021bi membri afecta\u021bi", "src": "Cap. 6 (Ereditatea multifactorial\u0103 sau poligenic\u0103)"}, {"q": "Un b\u0103rbat cu grupa O se c\u0103s\u0103tore\u0219te cu o femeie cu grupa A, al c\u0103rei tat\u0103 are grupa O. Care e probabilitatea ca un copil al lor s\u0103 aib\u0103 grupa O?", "opts": ["1/8", "1/4", "1/2", "3/4"], "correct": 2, "explain": "Femeia a primit l de la tat\u0103l ei cu grupa O, deci e L\u1d2cl; b\u0103rbatul e ll. Copilul are grupa O dac\u0103 prime\u0219te l de la mam\u0103: \u00bd. 1/4 ar fi r\u0103spunsul pentru doi p\u0103rin\u021bi heterozigo\u021bi L\u1d2cl \u00d7 L\u1d2cl.", "tag": "Legea I: puritatea game\u021bilor", "src": "Cap. 2 (Ereditatea mendelian\u0103: legile lui Mendel)"}, {"q": "ADN-ul unui cromozom mediu are circa 5 cm, iar cromatida lui \u00een metafaz\u0103 circa 5 \u00b5m. De c\u00e2te ori e scurtat ADN-ul prin \u00eempachetare?", "opts": ["De circa 10 000 de ori", "De circa 36 de ori", "De circa 100 de ori", "De circa 100 000 de ori"], "correct": 0, "explain": "5 cm = 50 000 \u00b5m; 50 000 / 5 = 10 000, rata de compactare a cromozomului metafazic (peste 1 : 10 000). 36 e rata fibrei de cromatin\u0103 de 30 nm, doar un nivel intermediar; 100 000 ar \u00eensemna o cromatid\u0103 de 0,5 \u00b5m.", "tag": "Nivelurile de \u00eempachetare", "src": "Cap. 4 (Bazele cromozomiale ale eredit\u0103\u021bii. Cromozomii umani: morfologie, structur\u0103, func\u021bie)"}, {"q": "O femeie de 38 de ani, la 10 s\u0103pt\u0103m\u00e2ni de sarcin\u0103, vrea s\u0103 afle sigur dac\u0103 f\u0103tul are trisomie 21. Ce i se poate spune corect despre op\u021biuni?", "opts": ["Amniocenteza, din s\u0103pt\u0103m\u00e2na 16, d\u0103 un diagnostic sigur", "Testul serologic de acum confirm\u0103 sau exclude trisomia", "Ecografia f\u0103cut\u0103 acum \u00eei poate da diagnosticul sigur", "Un cariotip al ei arat\u0103 dac\u0103 f\u0103tul e afectat"], "correct": 0, "explain": "Doar metodele invazive (biopsia de trofoblast, amniocenteza) dau cariotipul f\u0103tului; amniocenteza se face din s\u0103pt\u0103m\u00e2na a 16-a, cu rezultat dup\u0103 2\u20133 s\u0103pt\u0103m\u00e2ni de cultur\u0103. Ecografia \u0219i serologia sugereaz\u0103 doar un risc, iar cariotipul mamei nu arat\u0103 trisomia accidental\u0103 a f\u0103tului.", "tag": "Diagnosticul prenatal", "src": "Cap. 5 (Anomaliile cromozomiale \u0219i consecin\u021bele lor clinice)"}, {"q": "Un istoric al psihologiei caut\u0103 cine a propus primul s\u0103 fie studia\u021bi gemenii \u0219i copiii adopta\u021bi pentru a separa rolul eredit\u0103\u021bii de cel al mediului. La cine ajunge?", "opts": ["Fuller \u0219i Thompson", "Francis Galton", "Charles Darwin", "Charles Davenport"], "correct": 1, "explain": "Galton a studiat \u201eavant la lettre\u201d ereditatea caracteristicilor mentale \u0219i a sugerat folosirea gemenilor \u0219i a copiilor adopta\u021bi. Darwin a scris despre expresia emo\u021biilor, Davenport a fost un eugenist, iar Fuller \u0219i Thompson au publicat \u00een 1960 prima carte care a consacrat genetica comportamental\u0103 ca disciplin\u0103.", "tag": "Genetica comportamental\u0103", "src": "Cap. 1 (Introducere \u00een genetic\u0103)"}, {"q": "Un om de \u0219tiin\u021b\u0103 s-a c\u0103s\u0103torit cu veri\u0219oara lui primar\u0103 \u0219i au avut zece copii s\u0103n\u0103to\u0219i, dintre care unii au devenit academicieni. Ce arat\u0103 cazul despre consangvinizare?", "opts": ["Verii primari nu au gene comune mo\u0219tenite de la str\u0103mo\u0219i", "Riscul ei depinde de muta\u021biile din familie, nu e un r\u0103u \u00een sine", "Consangvinizarea protejeaz\u0103 urma\u0219ii de bolile recesive", "Riscul ei apare abia dup\u0103 dou\u0103 genera\u021bii consangvine"], "correct": 1, "explain": "Familia lui Darwin arat\u0103 c\u0103 unei eredit\u0103\u021bi s\u0103n\u0103toase \u00eei corespunde o consangvinitate s\u0103n\u0103toas\u0103: riscul vine din muta\u021biile recesive purtate \u00een familie. Verii primari au 1/8 din gene comune, iar consangvinizarea cre\u0219te, nu scade, riscul pentru bolile recesive.", "tag": "Consangvinizarea nu e un r\u0103u \u00een sine", "src": "Cap. 3 (Modele de transmitere a caracterelor monogenice (mendeliene) \u00een familiile umane)"}, {"q": "Un studiu g\u0103se\u0219te o variant\u0103 genetic\u0103 mai frecvent\u0103 la persoanele cu un anumit comportament impulsiv, iar un ziar titreaz\u0103 \u201eS-a descoperit gena bolii\u201d. Ce corectur\u0103 e potrivit\u0103?", "opts": ["Predispune \u00eentr-un mediu dat, nu e patologic\u0103", "Gena e patologic\u0103, dar cu penetran\u021b\u0103 incomplet\u0103", "Gena dovede\u0219te c\u0103 acel comportament e monogenic", "Gena e recesiv\u0103, deci nu se exprim\u0103 la purt\u0103tori"], "correct": 0, "explain": "La caracterele multifactoriale genele nu determin\u0103 direct boala, ci o favorizeaz\u0103 \u00eentr-un context de mediu; o gen\u0103 de predispozi\u021bie nu e o gen\u0103 patologic\u0103. Penetran\u021ba \u0219i recesivitatea privesc boli monogenice, iar o singur\u0103 variant\u0103 nu face comportamentul monogenic.", "tag": "Predispozi\u021bia nu e boala", "src": "Cap. 6 (Ereditatea multifactorial\u0103 sau poligenic\u0103)"}, {"q": "O psiholog\u0103 constat\u0103 c\u0103 o tr\u0103s\u0103tur\u0103 comportamental\u0103 rar\u0103 apare \u00een familii \u00een propor\u021biile 3 : 1 \u0219i 1 : 1, exact ca \u00een experimentele lui Mendel. Ce poate conchide?", "opts": ["Tr\u0103s\u0103tura are o baz\u0103 genetic\u0103, pe un singur locus", "Tr\u0103s\u0103tura e congenital\u0103, f\u0103r\u0103 cauz\u0103 genetic\u0103", "Tr\u0103s\u0103tura e transmis\u0103 cultural \u00een familie", "Tr\u0103s\u0103tura e multifactorial\u0103, cu prag familial"], "correct": 0, "explain": "E de ajuns ca o tr\u0103s\u0103tur\u0103 uman\u0103 s\u0103 urmeze tiparele mendeliene de transmitere ca s\u0103 fim siguri de baza ei genetic\u0103; caracterele mendeliene depind de genotipul de pe un singur locus (ereditate monogenic\u0103). Caracterele multifactoriale, din Cap. 1 (Introducere \u00een genetic\u0103), au concentrare familial\u0103, dar f\u0103r\u0103 propor\u021bii mendeliene.", "tag": "Caractere mendeliene", "src": "Cap. 2 (Ereditatea m     var key = t.getAttribute('data-k'), qi = parseInt(t.getAttribute('data-qi'), 10);
    S.ans[key] = S.ans[key] || {};
    if (S.ans[key][qi] === undefined) S.ans[key][qi] = parseInt(t.getAttribute('data-oi'), 10);
    return rerender(sec);
  }
  if (act === 'reset') { S.ans[t.getAttribute('data-k')] = {}; S.copied = null; rerender(sec); return jump(sec); }
  if (act === 'copy') {
    var k2 = t.getAttribute('data-k'), ta = document.getElementById('res-' + k2), txt = ta ? ta.value : '';
    var done = function(){ S.copied = k2; rerender(sec); };
    var fallback = function(){ if (ta) ta.select(); try { document.execCommand('copy'); } catch (y) {} done(); };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (x) { fallback(); }
  }
});

window.QZ = { pageHtml: pageHtml, sectionBody: sectionBody, zoomOpen: zoomOpen, data: D, S: S };
document.getElementById('app').innerHTML = pageHtml();
</script>
