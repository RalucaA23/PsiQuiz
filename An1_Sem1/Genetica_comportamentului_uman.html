></circle><circle cx=\"242.0\" cy=\"66.0\" r=\"6.5\" fill=\"#eb6834\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><circle cx=\"260.0\" cy=\"68.0\" r=\"6.5\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><text x=\"256.0\" y=\"90.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">dou\u0103 linii din acela\u0219i zigot</text><line x1=\"4.0\" y1=\"104.0\" x2=\"326.0\" y2=\"104.0\" stroke=\"#e6e0d4\" stroke-width=\"1\"/><text x=\"4.0\" y=\"124.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"12.0\" font-weight=\"bold\">Himer\u0103: doi zigo\u021bi</text><circle cx=\"24.0\" cy=\"148.0\" r=\"11\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><circle cx=\"24.0\" cy=\"178.0\" r=\"11\" fill=\"#1baf7a\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><line x1=\"42.0\" y1=\"148.0\" x2=\"68.0\" y2=\"148.0\" stroke=\"#6b6760\" stroke-width=\"1.4\"/><path d=\"M68,144 L74,148 L68,152 Z\" fill=\"#6b6760\"/><line x1=\"42.0\" y1=\"178.0\" x2=\"68.0\" y2=\"178.0\" stroke=\"#6b6760\" stroke-width=\"1.4\"/><path d=\"M68,174 L74,178 L68,182 Z\" fill=\"#6b6760\"/><circle cx=\"90.0\" cy=\"148.0\" r=\"8\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><circle cx=\"104.0\" cy=\"148.0\" r=\"8\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><circle cx=\"90.0\" cy=\"178.0\" r=\"8\" fill=\"#1baf7a\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><circle cx=\"104.0\" cy=\"178.0\" r=\"8\" fill=\"#1baf7a\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><line x1=\"116.0\" y1=\"150.0\" x2=\"150.0\" y2=\"162.0\" stroke=\"#6b6760\" stroke-width=\"1.4\"/><line x1=\"116.0\" y1=\"176.0\" x2=\"150.0\" y2=\"164.0\" stroke=\"#6b6760\" stroke-width=\"1.4\"/><line x1=\"150.0\" y1=\"163.0\" x2=\"208.0\" y2=\"163.0\" stroke=\"#6b6760\" stroke-width=\"1.4\"/><path d=\"M208,159 L214,163 L208,167 Z\" fill=\"#6b6760\"/><text x=\"180.0\" y=\"155.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.2\">fuziune</text><circle cx=\"230.0\" cy=\"140.0\" r=\"6.5\" fill=\"#1baf7a\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><circle cx=\"246.0\" cy=\"146.0\" r=\"6.5\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><circle cx=\"262.0\" cy=\"136.0\" r=\"6.5\" fill=\"#1baf7a\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><circle cx=\"236.0\" cy=\"160.0\" r=\"6.5\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><circle cx=\"254.0\" cy=\"162.0\" r=\"6.5\" fill=\"#1baf7a\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><circle cx=\"270.0\" cy=\"154.0\" r=\"6.5\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><circle cx=\"242.0\" cy=\"176.0\" r=\"6.5\" fill=\"#1baf7a\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><circle cx=\"260.0\" cy=\"178.0\" r=\"6.5\" fill=\"#2a78d6\" stroke=\"#faf8f3\" stroke-width=\"1.5\"></circle><text x=\"248.0\" y=\"200.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">linii din doi zigo\u021bi (ex. XX/XY)</text></svg>", "nota": "Schem\u0103 simplificat\u0103 dup\u0103 figura manualului."}], "noduri": [{"t": "Mixoploidia", "d": "Dou\u0103 sau mai multe linii celulare genetic diferite la acela\u0219i individ (\u201emai mul\u021bi \u00een unul singur\u201d), de\u0219i \u00een mod normal toate cele circa 60 de miliarde de celule sunt identice."}, {"t": "Mozaicul", "d": "Liniile provin din acela\u0219i zigot, printr-o non-disjunc\u021bie sau o pierdere dup\u0103 fecundare (de pild\u0103 o linie normal\u0103 \u0219i una monosomic\u0103). Cele mai multe mozaicuri implic\u0103 gonozomii \u0219i trisomia 21."}, {"t": "Himera", "d": "Liniile provin din doi zigo\u021bi, de obicei prin dubl\u0103 fecundare urmat\u0103 de fuziunea timpurie a doi gemeni dizigo\u021bi. Trece adesea neobservat\u0103; la constitu\u021bia XX/XY poate da un hermafrodit adev\u0103rat."}, {"t": "Linia normal\u0103 atenueaz\u0103", "d": "Distribu\u021bia liniei anormale \u00een \u021besuturi explic\u0103 variabilitatea clinic\u0103; o linie normal\u0103 atenueaz\u0103 de obicei manifest\u0103rile, iar anomalii letale \u00een form\u0103 omogen\u0103 pot supravie\u021bui \u00een mozaic."}, {"t": "Liniile eliminate", "d": "Celulele cu monosomii autozomale nu sunt viabile \u0219i se elimin\u0103, ca \u0219i celulele care au un singur gonozom, \u0219i acela Y."}]}, {"titlu": "Consecin\u021bele anomaliilor numerice", "tabel": {"cap": ["Anomalia", "Exemple", "Consecin\u021ba"], "randuri": [["Triploidie", "69,XXX; 69,XXY; 69,XYY", "1\u20133% din concep\u021bii; incompatibil\u0103 cu supravie\u021buirea"], ["Nulisomie", "lipse\u0219te o pereche de omologi", "letal\u0103 \u00eenainte de implantare"], ["Monosomie autozomal\u0103", "lipse\u0219te un autozom", "letal\u0103 \u00een stadiul embrionar"], ["Trisomie autozomal\u0103", "13 (Patau), 18 (Edwards), 21 (Down)", "de obicei letal\u0103; 13 \u0219i 18 p\u00e2n\u0103 la termen; 21 p\u00e2n\u0103 la 40 de ani sau mai mult, cu \u00eent\u00e2rziere mental\u0103 grav\u0103"], ["Gonozom \u00een plus", "47,XXX; 47,XXY (Klinefelter); 47,XYY", "probleme relativ minore, via\u021b\u0103 de durat\u0103 normal\u0103; cu 4\u20135 X, \u00eent\u00e2rziere mental\u0103"], ["Gonozom lips\u0103", "45,X (Turner); 45,Y", "\u2248 99% avorta\u021bi; Turner: inteligen\u021b\u0103 normal\u0103, sterilitate; 45,Y neviabil"]]}, "noduri": [{"t": "Dozajul genic", "d": "Dezvoltarea depinde de interac\u021biunile dintre produ\u0219ii genelor de pe cromozomi diferi\u021bi; schimbarea num\u0103rului relativ de cromozomi le perturb\u0103. Cromozomul 21 \u00een plus e perfect normal, dar schimb\u0103 dozajul genelor lui."}, {"t": "Monosomie vs trisomie", "d": "Monosomiile autozomale sunt letale foarte devreme: unele gene nu tolereaz\u0103 50% din produs, iar sute de efecte mici se adun\u0103. Trisomiile schimb\u0103 mai pu\u021bin nivelurile relative, deci embrionii tr\u0103iesc mai mult."}, {"t": "Gonozomii: efecte reduse", "d": "Erorile numerice ale cromozomilor de sex au mult mai pu\u021bine efecte dec\u00e2t cele autozomale: 47,XXX \u0219i 47,XYY sunt \u00een limite normale \u0219i pot fi fertili; 47,XXY are mai ales sterilitate."}, {"t": "Inactivarea X \u0219i testul Barr", "d": "R\u0103m\u00e2ne activ un singur X, oric\u00e2\u021bi ar fi, deci dozajul genelor X se schimb\u0103 pu\u021bin. Corpusculii Barr = num\u0103rul de X \u2212 1 (0 la 45,X; 1 la XXY; 2 la XXX), de aceea testul Barr depisteaz\u0103 aceste anomalii."}, {"t": "Cromozomul Y \u0219i SRY", "d": "Un Y \u00een plus are efecte reduse: Y are foarte pu\u021bine gene, iar func\u021bia lui important\u0103 e determinarea sexului masculin (gena SRY). Lipsa oric\u0103rui X e \u00een schimb letal\u0103, chiar \u00een culturi celulare."}]}, {"titlu": "Anomaliile structurale \u0219i X fragil", "figuri": [{"titlu": "Meioza la un purt\u0103tor de transloca\u021bie robertsonian\u0103", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 304\" role=\"img\" aria-label=\"Un purt\u0103tor echilibrat de transloca\u021bie robertsonian\u0103 14/21 poate avea copii normali, purt\u0103tori echilibra\u021bi sau cu trisomie 21 prin transloca\u021bie; trisomia 14 \u0219i monosomiile sunt letale\" font-family=\"Georgia, serif\" font-size=\"13\"><text x=\"4.0\" y=\"14.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\" font-weight=\"bold\">Purt\u0103tor echilibrat: 14, 21 \u0219i t(14;21)</text><rect x=\"136.5\" y=\"32.0\" width=\"7\" height=\"9.2\" rx=\"3\" fill=\"#2a78d6\"/><rect x=\"136.5\" y=\"43.2\" width=\"7\" height=\"22.8\" rx=\"3\" fill=\"#2a78d6\"/><text x=\"140.0\" y=\"77.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">14</text><rect x=\"156.5\" y=\"48.0\" width=\"7\" height=\"4.4\" rx=\"3\" fill=\"#eb6834\"/><rect x=\"156.5\" y=\"54.4\" width=\"7\" height=\"11.6\" rx=\"3\" fill=\"#eb6834\"/><text x=\"160.0\" y=\"77.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">21</text><rect x=\"182.5\" y=\"20.0\" width=\"7\" hei cu un gamet normal (14 + 21).</text></svg>", "nota": "Dup\u0103 figura manualului (transloca\u021bia 14/21); cromozomii sunt schematici."}], "lat": true, "noduri": [{"t": "Rupturi \u0219i agen\u021bi clastogeni", "d": "Rupturile ADN reparate imperfect rearanjeaz\u0103 segmentele. Ruperea e spontan\u0103 (p\u00e2n\u0103 la 1/1000 game\u021bi), dar cre\u0219te sub agen\u021bi clastogeni: radia\u021bii ionizante, virusuri, chimicale (anomalii tranzitorii dup\u0103 radio- sau chimioterapie)."}, {"t": "Neechilibrate: dele\u021bia 5p", "d": "Pierdere (dele\u021bie) sau ad\u0103ugare (duplica\u021bie, inser\u021bie) de segmente: tulbur\u0103ri de cre\u0219tere, \u00eent\u00e2rziere psihomotorie \u0219i mental\u0103, malforma\u021bii. Exemplu: \u201e\u021bip\u0103tul de pisic\u0103\u201d, monosomie par\u021bial\u0103 a cromozomului 5."}, {"t": "Echilibrate: inversii, transloca\u021bii", "d": "Doar redistribuie materialul (inversie: segment \u00eentors cu 180\u00b0; transloca\u021bie: segment mutat pe alt cromozom), deci purt\u0103torul e s\u0103n\u0103tos; meioza lui d\u0103 game\u021bi neechilibra\u021bi: avorturi, sterilitate, copii malforma\u021bi."}, {"t": "Down prin transloca\u021bie", "d": "5% din cazuri: fuziune centric\u0103 \u00eentre doi acrocentrici, echilibrat\u0103 la p\u0103rinte, mo\u0219tenit\u0103 neechilibrat. Forma accidental\u0103 are risc de recuren\u021b\u0103 de circa 1% la p\u0103rin\u021bi tineri; forma ereditar\u0103, risc major."}, {"t": "Cromozomul Philadelphia", "d": "Transloca\u021bie somatic\u0103 din limfocite, ap\u0103rut\u0103 sub factori de mediu \u0219i specific\u0103 unor leucemii: de\u0219i echilibrat\u0103, e patogen\u0103 fiindc\u0103 activeaz\u0103 o oncogen\u0103."}, {"t": "Siturile fragile", "d": "Discontinuit\u0103\u021bi pe locuri specifice ale unor cromozomi, din deficien\u021be ale repar\u0103rii ADN; f\u0103r\u0103 consecin\u021be clinice, cu o excep\u021bie: situl fragil de pe X. Fragilit\u0103\u021bile \u00eent\u00e2mpl\u0103toare dau sindroame de instabilitate."}, {"t": "Sindromul X fragil", "d": "Cea mai frecvent\u0103 cauz\u0103 a \u00eent\u00e2rzierii mentale familiale (1/1300 b\u0103ie\u021bi, 1/2500 fete): sit fragil Xq27\u2013q28, IQ 30\u201365, fa\u021b\u0103 lung\u0103, frunte bombat\u0103, urechi mari, macroorhidie."}, {"t": "Transmiterea X-ului fragil", "d": "Mamele sunt de obicei heterozigote (30% cu \u00eenapoiere u\u0219oar\u0103); riscul e cel X-recesiv: 50% din b\u0103ie\u021bi mo\u0219tenesc X-ul fragil. Gena (FMR1) permite diagnostic molecular, inclusiv prenatal, \u0219i estimarea gravit\u0103\u021bii."}]}, {"titlu": "Anomaliile cromozomiale \u0219i comportamentul", "lat": true, "tabel": {"cap": ["Sindrom", "Cariotip", "Frecven\u021b\u0103", "Cogni\u021bie", "Comportament"], "randuri": [["Down", "47,+21", "1/700 na\u0219teri", "IQ mediu sub 50; retardul cre\u0219te cu v\u00e2rsta", "lini\u0219ti\u021bi, afectuo\u0219i, iubesc muzica"], ["Klinefelter", "47,XXY", "1/1000 b\u0103ie\u021bi", "de obicei normal\u0103; scade cu fiecare X \u00een plus", "limbaj \u00eent\u00e2rziat, dislexie, anxietate, retragere"], ["XYY", "47,XYY", "c\u00e2t Klinefelter", "variabil\u0103", "dificult\u0103\u021bi \u0219colare, impulsivitate"], ["XXX", "47,XXX", "c\u00e2t Klinefelter", "probleme cognitive; mai grave la 48\u201349 de cromozomi", "probleme emo\u021bionale; uneori fertile"], ["Turner", "45,X", "rar (cea mai rar\u0103 viabil\u0103)", "variat\u0103; deficit spa\u021bial specific", "adaptare social\u0103 sc\u0103zut\u0103"]]}, "noduri": [{"t": "Efectul general asupra cogni\u021biei", "d": "Nicio anomalie nu are un semn biochimic sau morfologic specific; aproape toate afecteaz\u0103 cogni\u021bia, fiindc\u0103 inteligen\u021ba e poligenic\u0103: un instrument dezacordat stric\u0103 toat\u0103 \u201eorchestra genetic\u0103\u201d."}, {"t": "Sterilitatea ca ap\u0103rare", "d": "Anomaliile altereaz\u0103 calitatea vie\u021bii \u0219i integrarea social\u0103, dar de obicei nu se transmit, fiindc\u0103 dau sterilitate; pentru specie, e o ap\u0103rare \u00eempotriva schimb\u0103rilor drastice ale cariotipului."}, {"t": "Sindromul Down", "d": "Ochi oblici, pliu palmar unic, IQ mediu sub 50. Literatura veche, centrat\u0103 pe institu\u021bionaliza\u021bi, i-a subestimat: mul\u021bi sunt \u00een r\u00e2ndul mediei. \u00cemb\u0103tr\u00e2nesc precoce; mul\u021bi fac Alzheimer dup\u0103 40 de ani, dar doar 8% trec de 40."}, {"t": "Sindromul Klinefelter", "d": "Sterilitate cu azoospermie, c\u00e2teva note ginoide, intelect de obicei normal; \u00eent\u00e2rzierea limbajului, dislexie, anxietate, retragere. Nedetectat p\u00e2n\u0103 la pubertate; terapia hormonal\u0103 ajut\u0103, sterilitatea r\u0103m\u00e2ne."}, {"t": "Ipoteza XYY criminogen", "d": "Jacobs (1965) g\u0103se\u0219te 7 XYY din 196 de de\u021binu\u021bi \u0219i porne\u0219te ideea \u201esupermasculului\u201d criminal. Un studiu danez arat\u0103 delicte minore, din lips\u0103 de discern\u0103m\u00e2nt, nu agresivitate; majoritatea XYY sunt integra\u021bi social."}, {"t": "Moratoriul screeningului XYY", "d": "Constat\u0103rile nu justific\u0103 avertizarea p\u0103rin\u021bilor, de aceea screeningul postnatal al b\u0103ie\u021bilor XYY e suspendat; un diagnostic prenatal se comunic\u0103 atent: b\u0103iatul are multe \u0219anse s\u0103 fie normal."}, {"t": "Sindromul Turner", "d": "Singura monosomie viabil\u0103 (probabil doar ca mozaic 45,X/46,XX): sub 1,50 m, g\u00e2t palmat, ovare rudimentare, sterilitate. Intelect variat, cu deficit al abilit\u0103\u021bii spa\u021biale (ipoteza unei gene recesive pe X, neconfirmat\u0103)."}, {"t": "Genotip\u2013mediu \u00een anomalii", "d": "Copiii cu acela\u0219i cariotip difer\u0103 mult: \u00een familiile stabile, cei cu anomalii gonozomale difer\u0103 pu\u021bin de fra\u021bi. Adaptarea social\u0103 slab\u0103 din Turner \u021bine mai cur\u00e2nd de complexe dec\u00e2t de gene de pe X."}]}, {"titlu": "Originea cariotipului uman", "figuri": [{"titlu": "Originea cromozomului 2 uman", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 158\" role=\"img\" aria-label=\"Cromozomul 2 uman provine din fuziunea a doi cromozomi acrocentrici prezen\u021bi la marile maimu\u021be\" font-family=\"Georgia, serif\" font-size=\"13\"><rect x=\"55.0\" y=\"40.0\" width=\"10\" height=\"3.2\" rx=\"3\" fill=\"#2a78d6\"/><rect x=\"55.0\" y=\"45.2\" width=\"10\" height=\"46.8\" rx=\"3\" fill=\"#2a78d6\"/><rect x=\"85.0\" y=\"46.0\" width=\"10\" height=\"2.7\" rx=\"3\" fill=\"#1baf7a\"/><rect x=\"85.0\" y=\"50.7\" width=\"10\" height=\"41.3\" rx=\"3\" fill=\"#1baf7a\"/><text x=\"75.0\" y=\"120.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">doi acrocentrici</text><text x=\"75.0\" y=\"134.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">la marile maimu\u021be (48)</text><line x1=\"118.0\" y1=\"70.0\" x2=\"196.0\" y2=\"70.0\" stroke=\"#6b6760\" stroke-width=\"1.5\"/><path d=\"M196,65 L204,70 L196,75 Z\" fill=\"#6b6760\"/><text x=\"160.0\" y=\"62.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.2\">fuziune centric\u0103</text><text x=\"160.0\" y=\"86.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">(robertsonian\u0103)</text><rect x=\"245.0\" y=\"22.0\" width=\"10\" height=\"43.0\" rx=\"3\" fill=\"#1baf7a\"/><rect x=\"245.0\" y=\"67.0\" width=\"10\" height=\"51.0\" rx=\"3\" fill=\"#2a78d6\"/><text x=\"250.0\" y=\"134.0\" text-anchor=\"middle\" fill=\"#2c2a26\" font-size=\"10.2\" font-weight=\"bold\">cromozomul 2 uman</text><text x=\"250.0\" y=\"148.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">submetacentric (46)</text></svg>", "nota": "Schem\u0103 proprie dup\u0103 text; lungimile sunt ilustrative."}], "noduri": [{"t": "Tricotomia om\u2013cimpanzeu\u2013goril\u0103", "d": "Huxley a identificat cimpanzeul \u0219i gorila drept rudele noastre cele mai apropiate; \u00eentrebarea: care e mai aproape de om, sau liniile s-au desp\u0103r\u021bit simultan? Datele moleculare sus\u021bin \u00eenrudirea cu cimpanzeul."}, {"t": "Cariotipuri conservate", "d": "Modelele de benzi ale omului \u0219i marilor primate sunt conservate (s-a propus un cariotip ancestral); diferim de cimpanzeu prin 1\u20132% din proteine, iar la nivelul cariotipului prin c\u00e2teva inversii \u0219i o fuziune."}, {"t": "Cromozomul 2 uman", "d": "Are morfologia \u0219i benzile a doi acrocentrici de maimu\u021b\u0103: s-a format printr-o fuziune centric\u0103 (transloca\u021bie robertsonian\u0103), o remaniere f\u0103r\u0103 pierdere de material."}, {"t": "Game\u021bi cu 24 \u0219i 23", "d": "Maimu\u021ba purt\u0103toare a fuziunii are 47 de cromozomi \u0219i face game\u021bi cu 24 (normali) \u0219i cu 23 (cu fuziunea). Accidentul se fixeaz\u0103 doar c\u00e2nd se \u00eent\u00e2lnesc doi game\u021bi cu 23."}, {"t": "Ipoteza incestului", "d": "Fiindc\u0103 e greu ca acela\u0219i accident s\u0103 apar\u0103 la doi parteneri, s-a propus \u00eemperecherea a doi fra\u021bi, urma\u0219i ai primului mutant: fuziunea devine homozigot\u0103. Ipotez\u0103 plauzibil\u0103, dar controversat\u0103."}]}]}, "sectiuni": [], "runde": [{"id": "1", "eticheta": "Runda 1 \u00b7 Baz\u0103", "titlu": "Runda 1 \u2014 Concepte de baz\u0103", "desc": "Teorie: tipurile de anomalii cromozomiale, mecanismele lor, consecin\u021bele clinice \u0219i comportamentale, \u00een \u00eentreb\u0103ri directe.", "intrebari": [{"q": "Ce a ar\u0103tat Lejeune, \u00een 1958, despre sindromul Down?", "opts": ["C\u0103 e produs de o gen\u0103 recesiv\u0103 autozomal\u0103", "C\u0103 apare prin fuziunea a doi acrocentrici", "C\u0103 are un cromozom 21 suplimentar", "C\u0103 e o monosomie a unui cromozom mic"], "correct": 2, "explain": "Lejeune descoper\u0103 c\u0103 sindromul numit atunci \u201emongolism\u201d are un cromozom 21 \u00een plus (trisomia 21). Fuziunea a doi acrocentrici explic\u0103 doar forma prin transloca\u021bie, rar\u0103 (5%); nu e o gen\u0103 recesiv\u0103 \u0219i nici o monosomie.", "tag": "Lejeune \u0219i trisomia 21 (1958)"}, {"q": "Ce deosebe\u0219te o anomalie cromozomial\u0103 constitu\u021bional\u0103 de una somatic\u0103?", "opts": ["Prima e mo\u0219tenit\u0103 de la p\u0103rin\u021bi, a doua e accidental\u0103", "Prima e \u00een toate celulele, a doua doar \u00een unele", "Prima e numeric\u0103, a doua e structural\u0103", "Prima afecteaz\u0103 autozomii, a doua gonozomii"], "correct": 1, "explain": "Criteriul e extinderea \u00een corp: anomalia constitu\u021bional\u0103 exist\u0103 \u00een toate celulele (deci a ap\u0103rut foarte devreme), cea somatic\u0103 doar \u00een unele \u021besuturi, iar individul e un mozaic. Mo\u0219tenit\u0103/accidental\u0103, numeric\u0103/structural\u0103 sunt alte clasific\u0103ri, independente de aceasta.", "tag": "Constitu\u021bional\u0103 vs somatic\u0103"}, {"q": "Ce arat\u0103 sc\u0103derea frecven\u021bei anomaliilor cromozomiale de la avorturile timpurii la nou-n\u0103scu\u021bi?", "opts": ["O selec\u021bie intrauterin\u0103 a concep\u021biilor anormale", "O reparare a cromozomilor \u00een cursul sarcinii", "O eroare de num\u0103rare \u00een avorturile timpurii", "Un efect al v\u00e2rstei mamei asupra ovulelor"], "correct": 0, "explain": "De la 50\u201360% \u00een avorturile din trimestrul I la 0,5\u20130,7% la na\u0219tere: majoritatea concep\u021biilor cu anomalii se elimin\u0103, iar cele viabile sunt \u201ev\u00e2rful aisbergului\u201d. Anomaliile nu se repar\u0103; v\u00e2rsta mamei schimb\u0103 frecven\u021ba la concep\u021bie, nu sc\u0103derea pe parcursul sarcinii.", "tag": "Selec\u021bia intrauterin\u0103"}, {"q": "Care e cauza cea mai obi\u0219nuit\u0103 a triploidiei?", "opts": ["Non-disjunc\u021bia unei perechi \u00een meioza mamei", "Dispermia sau fecundarea cu un gamet diploid", "Reduplicarea endomitotic\u0103 a zigotului", "Transloca\u021bia dintre doi cromozomi acrocentrici"], "correct": 1, "explain": "Triploidia e un accident de fecunda\u021bie: un ovul fecundat de doi spermatozoizi sau un gamet cu 2n. Non-disjunc\u021bia d\u0103 trisomii sau monosomii, endomitoza primei diviziuni d\u0103 tetraploidie, iar transloca\u021bia schimb\u0103 structura, nu num\u0103rul seturilor.", "tag": "Accidentul de fecunda\u021bie"}, {"q": "Prin ce se deosebe\u0219te o triploidie de o trisomie?", "opts": ["Triploidia adaug\u0103 un set \u00eentreg, trisomia un cromozom", "Triploidia e viabil\u0103, trisomia e letal\u0103 \u00een embrion", "Triploidia apare \u00een mitoz\u0103, trisomia \u00een meioz\u0103", "Triploidia afecteaz\u0103 gonozomii, trisomia autozomii"], "correct": 0, "explain": "Triploidia (3n = 69) e o poliploidie, deci euploidie cu un set \u00een plus; trisomia (2n + 1) e o aneuploidie, cu un singur cromozom \u00een plus. Viabilitatea e chiar invers\u0103: triploidia e incompatibil\u0103 cu via\u021ba postnatal\u0103, trisomia 21 permite supravie\u021buirea.", "tag": "Euploidie vs aneuploidie"}, {"q": "Care monosomie e compatibil\u0103 cu via\u021ba la om?", "opts": ["Monosomia 21, \u00een sindromul Down", "Monosomia Y, la persoanele 45,Y", "Monosomia 5, \u00een \u201e\u021bip\u0103tul de pisic\u0103\u201d", "Monosomia X, \u00een sindromul Turner"], "correct": 3, "explain": "Singura monosomie viabil\u0103 e 45,X (sindromul Turner). Sindromul Down e o trisomie 21, 45,Y nu e viabil (lipsa oric\u0103rui X e letal\u0103), iar \u201e\u021bip\u0103tul de pisic\u0103\u201d e o monosomie doar par\u021bial\u0103, prin dele\u021bia unui segment al cromozomului 5.", "tag": "Monosomia (2n\u22121)"}, {"q": "Ce particularitate a ovogenezei ar explica efectul v\u00e2rstei mamei asupra non-disjunc\u021biei?", "opts": ["Ovulele se formeaz\u0103 din nou la fiecare ciclu", "Ovulele trec prin mai multe mitoze dec\u00e2t spermatozoizii", "Ovulele pierd inactivarea X odat\u0103 cu v\u00e2rsta", "Ovulele stau blocate ani \u00eentregi \u00een meioz\u0103"], "correct": 3, "explain": "Meioza femeii \u00eencepe \u00een ovarul fetal, iar ovulele r\u0103m\u00e2n blocate \u00een dictioten p\u00e2n\u0103 la ovula\u021bie; blocajul de mul\u021bi ani ar favoriza erorile de separare. Ovulele nu se formeaz\u0103 din nou la fiecare ciclu, iar inactivarea X nu \u021bine de segregarea cromozomilor.", "tag": "Efectul v\u00e2rstei materne"}, {"q": "Ce metode prenatale pot preciza, nu doar sugera, o anomalie cromozomial\u0103?", "opts": ["Biopsia de trofoblast \u0219i amniocenteza", "Ecografia \u0219i testele serologice materne", "Testul Barr pe celulele bucale ale mamei", "Arborele genealogic al ambilor p\u0103rin\u021bi"], "correct": 0, "explain": "Doar metodele invazive, care ob\u021bin celule fetale (vilozit\u0103\u021bi coriale, lichid amniotic), permit cariotipul f\u0103tului. Ecografia \u0219i testele serologice sunt neinvazive \u0219i doar sugereaz\u0103 un risc; celulele mamei sau arborele genealogic nu arat\u0103 cromozomii f\u0103tului.", "tag": "Diagnosticul prenatal"}, {"q": "Prin ce se deosebe\u0219te un mozaic de o himer\u0103?", "opts": ["Mozaicul are o linie anormal\u0103, himera dou\u0103", "Mozaicul apare \u00een meioz\u0103, himera \u00een mitoz\u0103", "Mozaicul afecteaz\u0103 gonozomii, himera autozomii", "Mozaicul provine dintr-un zigot, himera din doi"], "correct": 3, "explain": "Ambele au dou\u0103 linii celulare diferite (mixoploidie); la mozaic ele deriv\u0103 din acela\u0219i zigot, printr-un accident dup\u0103 fecundare, la himer\u0103 din doi zigo\u021bi, de obicei gemeni dizigo\u021bi fuziona\u021bi. Mozaicul apare printr-o eroare mitotic\u0103, nu meiotic\u0103.", "tag": "Himera"}, {"q": "De ce sunt monosomiile autozomale mai grave dec\u00e2t trisomiile?", "opts": ["Cromozomul lips\u0103 purta genele dominante ale perechii", "Reducerea la 50% a unor produ\u0219i genici e intolerabil\u0103", "Cromozomul \u00een plus e inactivat ca un corpuscul Barr", "Monosomiile apar mai t\u00e2rziu \u00een dezvoltarea embrionului"], "correct": 1, "explain": "Pe fiecare cromozom exist\u0103 probabil gene pentru care jum\u0103tate din produs nu ajunge, iar sute de efecte mici se adun\u0103; trisomia schimb\u0103 mai pu\u021bin nivelurile relative. Inactivarea de tip Barr prive\u0219te doar X-ul, iar dominan\u021ba nu explic\u0103 dozajul.", "tag": "Monosomie vs trisomie"}, {"q": "De ce au anomaliile numerice ale gonozomilor efecte mult mai mici dec\u00e2t cele autozomale?", "opts": ["Gonozomii nu poart\u0103 gene necesare vie\u021bii", "Gonozomii \u00een plus se pierd \u00een primele diviziuni", "R\u0103m\u00e2ne activ un singur X, oric\u00e2\u021bi ar fi", "Gonozomii se exprim\u0103 abia dup\u0103 pubertate"], "correct": 2, "explain": "Inactivarea X, din Cap. 4 (Bazele cromozomiale ale eredit\u0103\u021bii. Cromozomii umani: morfologie, structur\u0103, func\u021bie), \u021bine constant dozajul genelor X; Y are pu\u021bine gene. X-ul e \u00eens\u0103 esen\u021bial: lipsa lui total\u0103 e letal\u0103, deci gonozomii poart\u0103 gene vitale \u0219i nu se pierd.", "tag": "Inactivarea X \u0219i testul Barr"}, {"q": "De ce poate avea e\u0219ecuri reproductive un purt\u0103tor s\u0103n\u0103tos de transloca\u021bie echilibrat\u0103?", "opts": ["Transloca\u021bia \u00eei scade num\u0103rul de game\u021bi", "Meioza lui produce game\u021bi neechilibra\u021bi", "Transloca\u021bia activeaz\u0103 o oncogen\u0103 \u00een gonade", "Copiii mo\u0219tenesc transloca\u021bia \u00een form\u0103 dubl\u0103"], "correct": 1, "explain": "Transloca\u021bia doar mut\u0103 material, deci purt\u0103torul e s\u0103n\u0103tos; \u00een meioz\u0103 \u00eens\u0103 cromozomii remania\u021bi se distribuie dezechilibrat, de unde avorturi, sterilitate sau copii malforma\u021bi. Activarea unei oncogene e cazul transloca\u021biei somatice Philadelphia.", "tag": "Echilibrate: inversii, transloca\u021bii"}, {"q": "Care e cea mai frecvent\u0103 cauz\u0103 a \u00eent\u00e2rzierii mentale familiale?", "opts": ["Sindromul X fragil", "Trisomia 21 liber\u0103", "Sindromul Klinefelter", "Sindromul Turner"], "correct": 0, "explain": "Sindromul X fragil (1/1300 b\u0103ie\u021bi, 1/2500 fete) e cea mai frecvent\u0103 cauz\u0103 familial\u0103, fiindc\u0103 se transmite. Trisomia 21 e mai frecvent\u0103, dar e de obicei un accident nemo\u0219tenit; Klinefelter are intelect de obicei normal, iar Turner rareori are \u00eenapoiere moderat\u0103.", "tag": "Sindromul X fragil"}, {"q": "De ce afecteaz\u0103 aproape toate anomaliile cromozomiale abilit\u0103\u021bile cognitive?", "opts": ["Fiecare cromozom poart\u0103 o gen\u0103 a inteligen\u021bei", "Anomaliile apar mai ales pe cromozomul X", "Inteligen\u021ba depinde de multe gene care interac\u021bioneaz\u0103", "Anomaliile produc aceea\u0219i leziune a creierului"], "correct": 2, "explain": "Inteligen\u021ba e poligenic\u0103: fiecare cromozom particip\u0103 la \u201eorchestra genetic\u0103\u201d, iar un dezechilibru oriunde stric\u0103 ansamblul. Nu exist\u0103 o gen\u0103 a inteligen\u021bei pe fiecare cromozom, anomaliile nu sunt mai ales pe X \u0219i nu au o leziune biochimic\u0103 sau morfologic\u0103 specific\u0103.", "tag": "Efectul general asupra cogni\u021biei"}, {"q": "Prin ce mecanism s-a format cromozomul 2 uman?", "opts": ["Duplicarea unui cromozom mic de maimu\u021b\u0103", "Pierderea unui bra\u021b de la un metacentric", "Fuziunea centric\u0103 a doi acrocentrici de maimu\u021b\u0103", "Non-disjunc\u021bia unei perechi la primul hominid"], "correct": 2, "explain": "Cromozomul 2 are benzile a doi acrocentrici de maimu\u021b\u0103: s-au unit printr-o transloca\u021bie robertsonian\u0103, f\u0103r\u0103 pierdere de material, iar num\u0103rul a sc\u0103zut de la 48 la 46. Non-disjunc\u021bia ar fi ad\u0103ugat sau scos un cromozom, nu le-ar fi unit.", "tag": "Cromozomul 2 uman"}]}, {"id": "2", "eticheta": "Runda 2 \u00b7 Aplica\u021bii", "titlu": "Runda 2 \u2014 Scenarii \u0219i ra\u021bionament", "desc": "Situa\u021bii cu mai mul\u021bi pa\u0219i: interpretezi cariotipuri, estimezi riscuri, explici sindroame \u0219i ipoteze.", "intrebari": [{"q": "Sindromul Down apare la 1 din 700 de na\u0219teri, iar sindromul Turner la 1 din 5000, independent unul de altul. Ce risc are un copil s\u0103 le aib\u0103 pe am\u00e2ndou\u0103?", "opts": ["1 la 5700, suma numitorilor celor dou\u0103 riscuri", "1 la 700, riscul anomaliei mai frecvente", "1 la 2850, media celor dou\u0103 riscuri", "1 la 3 500 000, produsul celor dou\u0103 riscuri"], "correct": 3, "explain": "Pentru dou\u0103 evenimente independente, probabilitatea ca ambele s\u0103 apar\u0103 e produsul lor: 1/700 \u00d7 1/5000 = 1/3 500 000. Adunarea numitorilor sau media nu au sens probabilistic, iar riscul anomaliei mai frecvente ar fi riscul de a avea m\u0103car una dintre ele, aproximativ.", "tag": "Non-disjunc\u021bia"}, {"q": "Dou\u0103 surori sunt \u00eens\u0103rcinate \u00een acela\u0219i timp: una are 40 de ani, cealalt\u0103 25. Riscurile observate \u00een popula\u021bie sunt 1 la 90 la 40 de ani \u0219i 1 la 1500 la 25. Ce po\u021bi spune despre riscul de trisomie 21?", "opts": ["E egal: riscul depinde mai ales de v\u00e2rsta tat\u0103lui", "E de circa 17 ori mai mare la sora de 40 de ani", "E mai mare la cea de 40 de ani, dar doar cu circa 15%", "E egal, fiindc\u0103 trisomia e un accident \u00eent\u00e2mpl\u0103tor"], "correct": 1, "explain": "1500 / 90 \u2248 17: riscul cre\u0219te abrupt cu v\u00e2rsta mamei, fiindc\u0103 95% din non-disjunc\u021biile din trisomia 21 au loc \u00een ovogenez\u0103. Faptul c\u0103 e un accident nu-l face egal la orice v\u00e2rst\u0103; contribu\u021bia tat\u0103lui e minor\u0103.", "tag": "Efectul v\u00e2rstei materne"}, {"q": "La o femeie, analiza arat\u0103 dou\u0103 linii celulare, 46,XX \u0219i 45,X; toate celelalte gene sunt identice \u00een cele dou\u0103 linii, deci nu e vorba de un al doilea zigot. Cum s-a format, cel mai probabil, aceast\u0103 constitu\u021bie?", "opts": ["Un X s-a pierdut \u00eentr-o diviziune dup\u0103 fecundare", "Doi zigo\u021bi diferi\u021bi au fuzionat la \u00eenceputul dezvolt\u0103rii", "Mama a produs un ovul f\u0103r\u0103 cromozom X", "Tat\u0103l a transmis un spermatozoid cu doi X"], "correct": 0, "explain": "Dou\u0103 linii din acela\u0219i zigot \u00eenseamn\u0103 un mozaic: un accident mitotic dup\u0103 fecundare (pierderea sau non-disjunc\u021bia unui X) a creat linia 45,X. O eroare meiotic\u0103 a unui p\u0103rinte ar fi dat o singur\u0103 constitu\u021bie \u00een tot corpul, iar fuziunea a doi zigo\u021bi ar da o himer\u0103.", "tag": "Mozaicul"}, {"q": "La un control de rutin\u0103, un b\u0103rbat s\u0103n\u0103tos are dou\u0103 popula\u021bii de hematii, de grupe sanguine diferite; alte gene arat\u0103 dou\u0103 genotipuri distincte, ca la doi fra\u021bi. Ce explica\u021bie e cea mai probabil\u0103?", "opts": ["O non-disjunc\u021bie dup\u0103 fecundare a creat a doua linie", "O muta\u021bie somatic\u0103 a schimbat grupa unei linii", "A rezultat din fuziunea timpurie a doi zigo\u021bi gemeni", "O transloca\u021bie echilibrat\u0103 a dublat genele grupei"], "correct": 2, "explain": "Dou\u0103 genotipuri complete, ca de fra\u021bi, cer doi zigo\u021bi: e o himer\u0103, de obicei din fuziunea a doi gemeni dizigo\u021bi, descoperit\u0103 \u00eent\u00e2mpl\u0103tor. Non-disjunc\u021bia sau o muta\u021bie somatic\u0103 ar schimba un cromozom sau o gen\u0103, nu tot genotipul.", "tag": "Himera"}, {"q": "Un cuplu t\u00e2n\u0103r are al doilea copil cu sindrom Down. Mama, s\u0103n\u0103toas\u0103, are 45 de cromozomi: un cromozom 14 \u0219i un 21 sunt uni\u021bi \u00eentr-unul singur. Ce \u00eenseamn\u0103 asta pentru o nou\u0103 sarcin\u0103?", "opts": ["Risc de circa 1%, ca la un cuplu t\u00e2n\u0103r oarecare", "Risc mare: mama poate da game\u021bi neechilibra\u021bi", "Risc mic: anomalia mamei nu are efect fenotipic", "Risc crescut doar dup\u0103 v\u00e2rsta de 35 de ani"], "correct": 1, "explain": "Mama e purt\u0103toare echilibrat\u0103 a unei transloca\u021bii robertsoniene: e s\u0103n\u0103toas\u0103, dar o parte din game\u021bii ei poart\u0103 material 21 \u00een plus, deci forma ereditar\u0103 a sindromului Down are risc genetic major. Riscul de 1% e al formei accidentale, iar v\u00e2rsta nu conteaz\u0103 aici.", "tag": "Down prin transloca\u021bie"}, {"q": "Un b\u0103rbat s\u0103n\u0103tos e purt\u0103tor echilibrat al unei transloca\u021bii \u00eentre cromozomii 14 \u0219i 21; so\u021bia are cariotip normal. Ce copii n\u0103scu\u021bi vii poate avea cuplul?", "opts": ["Numai copii normali, fiindc\u0103 el e s\u0103n\u0103tos", "Normali, purt\u0103tori echilibra\u021bi sau cu sindrom Down", "Normali sau cu trisomie 14, ca form\u0103 viabil\u0103", "Doar purt\u0103tori echilibra\u021bi, ca tat\u0103l lor"], "correct": 1, "explain": "Meioza purt\u0103torului d\u0103 \u0219ase tipuri de zigo\u021bi: normal, purt\u0103tor echilibrat, trisomie 21 prin transloca\u021bie (viabil\u0103, sindrom Down) \u0219i trei letale (trisomie 14, monosomie 14, monosomie 21). S\u0103n\u0103tatea tat\u0103lui nu garanteaz\u0103 game\u021bi echilibra\u021bi.", "tag": "Echilibrate: inversii, transloca\u021bii"}, {"q": "Un nou-n\u0103scut are un pl\u00e2ns ascu\u021bit, ca un mieunat, \u00eent\u00e2rziere de cre\u0219tere \u0219i malforma\u021bii ale capului; analiza arat\u0103 c\u0103 lipse\u0219te un fragment al unui cromozom 5. Ce fel de anomalie are?", "opts": ["Structural\u0103 echilibrat\u0103, f\u0103r\u0103 pierdere de material", "Numeric\u0103: o monosomie a \u00eentregului cromozom 5", "Numeric\u0103: o trisomie par\u021bial\u0103 a cromozomului 5", "Structural\u0103 neechilibrat\u0103: o monosomie par\u021bial\u0103"], "correct": 3, "explain": "Sindromul \u201e\u021bip\u0103tului de pisic\u0103\u201d e o dele\u021bie: lipse\u0219te un segment, deci genele lui sunt \u00eentr-o singur\u0103 copie (monosomie par\u021bial\u0103), cu efectele comune anomaliilor neechilibrate. O anomalie echilibrat\u0103 n-ar avea simptome, iar o monosomie autozomal\u0103 \u00eentreag\u0103 e letal\u0103.", "tag": "Neechilibrate: dele\u021bia 5p"}, {"q": "Un pacient cu leucemie are, doar \u00een limfocite, o transloca\u021bie echilibrat\u0103 pe care nu o au p\u0103rin\u021bii lui \u0219i nici celelalte \u021besuturi. F\u0103r\u0103 pierdere de material, cum produce ea boala?", "opts": ["Produce game\u021bi neechilibra\u021bi, care afecteaz\u0103 m\u0103duva", "Activeaz\u0103 o oncogen\u0103 prin noua pozi\u021bie a segmentului", "Dubleaz\u0103 dozajul genelor de pe segmentul mutat", "E mo\u0219tenit\u0103 de la un p\u0103rinte purt\u0103tor echilibrat"], "correct": 1, "explain": "E cazul cromozomului Philadelphia: o remaniere somatic\u0103, echilibrat\u0103, dar patogen\u0103 fiindc\u0103 activeaz\u0103 o oncogen\u0103. Game\u021bii privesc urma\u0219ii, nu boala pacientului; o transloca\u021bie echilibrat\u0103 nu schimb\u0103 dozajul, iar absen\u021ba la p\u0103rin\u021bi \u0219i \u00een alte \u021besuturi exclude mo\u0219tenirea.", "tag": "Cromozomul Philadelphia"}, {"q": "O femeie are un frate cu sindrom X fragil \u0219i afl\u0103 c\u0103 e heterozigot\u0103 pentru X-ul fragil; so\u021bul ei e s\u0103n\u0103tos. Ce risc au fiii lor s\u0103 mo\u0219teneasc\u0103 X-ul fragil?", "opts": ["50%, ca la genele recesive legate de X", "25%, ca la o boal\u0103 autozomal\u0103 recesiv\u0103", "100%, fiindc\u0103 X-ul fiului vine de la mam\u0103", "Aproape zero, fiindc\u0103 tat\u0103l e s\u0103n\u0103tos"], "correct": 0, "explain": "Fiul prime\u0219te X-ul de la mam\u0103, care are un X fragil \u0219i unul normal: 50% din fii \u00eel mo\u0219tenesc, ca la transmiterea X-recesiv\u0103. X-ul vine de la mam\u0103, dar ea are dou\u0103; tat\u0103l d\u0103 fiului Y-ul, deci s\u0103n\u0103tatea lui nu schimb\u0103 riscul fiilor.", "tag": "Transmiterea X-ului fragil"}, {"q": "Un b\u0103rbat \u00eenalt, de 30 de ani, consult\u0103 un medic pentru infertilitate; spermograma arat\u0103 azoospermie, iar \u00een copil\u0103rie a avut dislexie \u0219i o \u00eent\u00e2rziere a limbajului. Ce cariotip e cel mai probabil?", "opts": ["47,XXY", "47,XYY", "46,XX", "47,XY,+21"], "correct": 0, "explain": "Sterilitatea cu azoospermie, cu \u00eent\u00e2rzierea limbajului \u0219i dislexia, descrie sindromul Klinefelter. B\u0103rba\u021bii XYY sunt \u0219i ei \u00eenal\u021bi \u0219i pot avea \u00eent\u00e2rzieri ale limbajului, dar sunt de obicei fertili; trisomia 21 ar da retard mental important \u0219i semne vizibile.", "tag": "Sindromul Klinefelter"}, {"q": "Un jurnalist cite\u0219te c\u0103, \u00eentr-un studiu din \u00eenchisori de maxim\u0103 securitate, 7 din 196 de de\u021binu\u021bi erau XYY, \u0219i scrie c\u0103 un Y \u00een plus \u201eface criminali\u201d. Ce au ar\u0103tat cercet\u0103rile ulterioare?", "opts": ["Un Y \u00een plus cre\u0219te agresivitatea, dar doar la adul\u021bi", "Rezultatul era un artefact: XYY nu exist\u0103 la de\u021binu\u021bi", "Cei mai mul\u021bi XYY sunt integra\u021bi; conteaz\u0103 discern\u0103m\u00e2ntul", "Leg\u0103tura e real\u0103, de aceea s-a introdus screeningul"], "correct": 2, "explain": "Studiul echipei Jacobs (1965) a lansat ipoteza; un studiu danez pe b\u0103rba\u021bi \u00eenal\u021bi neinstitu\u021bionaliza\u021bi a g\u0103sit la XYY mai ales delicte minore, din lips\u0103 de discern\u0103m\u00e2nt, nu din agresivitate. Frecven\u021ba la de\u021binu\u021bi e totu\u0219i mai mare, iar screeningul postnatal e suspendat (moratoriu).", "tag": "Ipoteza XYY criminogen"}, {"q": "O adolescent\u0103 de 1,45 m, cu g\u00e2t palmat \u0219i f\u0103r\u0103 menstrua\u021bie, are note bune la limb\u0103 \u0219i istorie, dar se descurc\u0103 greu cu h\u0103r\u021bile \u0219i cu copierea figurilor geometrice. Ce diagnostic e cel mai probabil?", "opts": ["Sindromul X fragil, cu \u00eenapoiere mental\u0103", "Sindromul XXX, cu menopauz\u0103 precoce", "Sindromul Down, cu retard mental global", "Sindromul Turner, cu deficit spa\u021bial specific"], "correct": 3, "explain": "Statura mic\u0103, g\u00e2tul palmat \u0219i amenoreea primar\u0103, cu dificult\u0103\u021bi specifice \u00een abilitatea spa\u021bial\u0103 \u0219i intelect altfel normal, descriu sindromul Turner (45,X). Retardul global din Down sau X fragil n-ar l\u0103sa neatinse celelalte materii; XXX are statur\u0103 normal\u0103.", "tag": "Sindromul Turner"}, {"q": "O cercet\u0103toare compar\u0103 dou\u0103 studii despre inteligen\u021ba persoanelor cu sindrom Down: unul vechi, pe pacien\u021bi din institu\u021bii, g\u0103se\u0219te aproape numai retard sever; unul recent, pe copii crescu\u021bi \u00een familie, g\u0103se\u0219te mul\u021bi aproape de medie. Ce explic\u0103 diferen\u021ba?", "opts": ["Sindromul s-a atenuat genetic de la o genera\u021bie la alta", "Al doilea a inclus \u0219i copii f\u0103r\u0103 trisomie 21", "Primul a subestimat, prin e\u0219antionul ales", "Retardul apare abia dup\u0103 40 de ani, cu Alzheimer"], "correct": 2, "explain": "Literatura veche s-a concentrat pe indivizi institu\u021bionaliza\u021bi, deci a subestimat capacit\u0103\u021bile; \u00een realitate doar unii sunt sever \u00eent\u00e2rzia\u021bi. Trisomia e aceea\u0219i de la o genera\u021bie la alta, iar demen\u021ba de dup\u0103 40 de ani agraveaz\u0103 un retard deja prezent.", "tag": "Sindromul Down"}, {"q": "Un embrion avortat spontan are 69 de cromozomi (69,XXY): dou\u0103 seturi sunt de la tat\u0103, unul de la mam\u0103. Ce mecanism e cel mai frecvent compatibil cu aceste date?", "opts": ["O non-disjunc\u021bie a gonozomilor la tat\u0103", "O endomitoz\u0103 \u00een prima diviziune a zigotului", "Un ovul fecundat de doi spermatozoizi", "Un ovul diploid fecundat de un spermatozoid"], "correct": 2, "explain": "Dou\u0103 seturi paterne cer un aport dublu al tat\u0103lui: dispermia (cea mai frecvent\u0103) sau, mai rar, un spermatozoid diploid. Un ovul diploid ar da dou\u0103 seturi materne, endomitoza ar da 4n, iar non-disjunc\u021bia ar ad\u0103uga un singur cromozom.", "tag": "Accidentul de fecunda\u021bie"}, {"q": "Doi copii au trisomie 21: unul \u00een toate celulele, cel\u0103lalt doar \u00een 30% din celule, restul fiind normale. Ce te a\u0219tep\u021bi s\u0103 observi la ei?", "opts": ["Al doilea are, de obicei, manifest\u0103ri mai u\u0219oare", "Acela\u0219i tablou la ambii, fiindc\u0103 trisomia e aceea\u0219i", "Al doilea va transmite sigur anomalia copiilor lui", "Al doilea are manifest\u0103ri mai grave, prin dezechilibru"], "correct": 0, "explain": "Al doilea e un mozaic: linia celular\u0103 normal\u0103 atenueaz\u0103 de obicei gravitatea, iar manifest\u0103rile depind de distribu\u021bia liniei anormale \u00een \u021besuturi. Nimic nu-i garanteaz\u0103 transmiterea, fiindc\u0103 gonadele pot avea linia normal\u0103.", "tag": "Linia normal\u0103 atenueaz\u0103"}]}]}, {"nr": 6, "titlu": "Ereditatea multifactorial\u0103 sau poligenic\u0103", "harta": {"centru": "Ereditatea multifactorial\u0103 sau poligenic\u0103", "ramuri": [{"titlu": "Caracterele multifactoriale", "lat": true, "tabel": {"cap": ["Caractere normale", "Malforma\u021bii congenitale comune", "Boli comune ale adultului"], "randuri": [["Greutatea", "Despic\u0103tura labio-palatin\u0103", "Diabetul zaharat"], ["Talia", "Spina bifida", "Glaucomul"], ["Tensiunea arterial\u0103", "Piciorul str\u00e2mb congenital", "Hipertensiunea arterial\u0103"], ["Dermatoglifele", "Luxa\u021bia congenital\u0103 de \u0219old", "Epilepsia"], ["Inteligen\u021ba", "Stenoza hipertrofic\u0103 de pilor", "Schizofrenia"], ["Culoarea pielii", "Malforma\u021biile cardiace congenitale", "Boala coronarian\u0103"]]}, "noduri": [{"t": "Determinism mixt", "d": "Mai multe gene, de obicei necunoscute, \u0219i factori de mediu greu de precizat. Fiecare gen\u0103 e mendelian\u0103, dar interac\u021biunile \u0219terg rapoartele de segregare, calculul riscului \u0219i pedigree-urile tipice."}, {"t": "Poligenic vs multifactorial", "d": "Poligenic: doar ac\u021biunea aditiv\u0103 a dou\u0103 sau mai multe gene; multifactorial: plus o component\u0103 de mediu (mezologic\u0103). \u00cen practic\u0103, diferen\u021bierea e imposibil\u0103."}, {"t": "Continue vs discontinue", "d": "Caracterele normale cantitative au distribu\u021bie continu\u0103; malforma\u021biile \u0219i bolile comune au distribu\u021bie discontinu\u0103 (bimodal\u0103): unii le au, al\u021bii nu."}, {"t": "Frecven\u021ba: 1\u20132% vs 15%", "d": "Bolile monogenice sunt rare (frecven\u021b\u0103 global\u0103 1\u20132%), cele multifactoriale sunt frecvente (circa 15%)."}]}, {"titlu": "Galton, Fisher \u0219i poligenia", "noduri": [{"t": "Caractere cantitative", "d": "Greutatea, \u00een\u0103l\u021bimea, inteligen\u021ba, tensiunea, dermatoglifele: le avem to\u021bi, \u00een grade diferite, deci nu se pot face pedigree-uri \u0219i nu se \u00eempart \u00een clase distincte, ca \u00een analiza mendelian\u0103."}, {"t": "Galton \u0219i biometria", "d": "Galton, v\u0103rul lui Darwin, m\u0103soar\u0103 atribute fizice \u00een laboratorul antropometric din Londra \u0219i le analizeaz\u0103 statistic (biometria), \u00eentr-o \u0219coal\u0103 rival\u0103 celei mendeliene; stabile\u0219te corela\u021bia familial\u0103 dintre rude."}, {"t": "Galton, fondator", "d": "Public\u0103 \u201eHereditary Genius\u201d \u00een acela\u0219i an cu lucrarea lui Mendel; e considerat fondatorul geneticii comportamentale, al gemelologiei, biometriei \u0219i eugeniei, \u0219i inventatorul amprentelor digitale."}, {"t": "Sinteza lui Fisher", "d": "Statisticianul Fisher tran\u0219eaz\u0103 disputa: o tr\u0103s\u0103tur\u0103 controlat\u0103 de mul\u021bi factori mendelieni independen\u021bi are tocmai ce descriau biometricienii: natur\u0103 continu\u0103, varia\u021bie cantitativ\u0103, corela\u021bie familial\u0103."}, {"t": "Poligenia", "d": "Mai multe gene independente (care segreg\u0103 independent), cu efecte aditive, realizeaz\u0103 un caracter cantitativ; fiecare st\u0103 pe un locus de tr\u0103s\u0103tur\u0103 cantitativ\u0103 \u0219i are un efect limitat, dar cumulativ."}]}, {"titlu": "Distrib  y=\"132.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.2\">foarte scunzi</text><text x=\"308.0\" y=\"120.0\" text-anchor=\"end\" fill=\"#6b6760\" font-size=\"10.2\">pu\u021bini</text><text x=\"308.0\" y=\"132.0\" text-anchor=\"end\" fill=\"#6b6760\" font-size=\"10.2\">foarte \u00eenal\u021bi</text><line x1=\"30.0\" y1=\"170.0\" x2=\"310.0\" y2=\"170.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><line x1=\"30.0\" y1=\"170.0\" x2=\"30.0\" y2=\"174.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"30.0\" y=\"185.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">150</text><line x1=\"86.0\" y1=\"170.0\" x2=\"86.0\" y2=\"174.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"86.0\" y=\"185.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">160</text><line x1=\"142.0\" y1=\"170.0\" x2=\"142.0\" y2=\"174.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"142.0\" y=\"185.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">170</text><line x1=\"198.0\" y1=\"170.0\" x2=\"198.0\" y2=\"174.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"198.0\" y=\"185.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">180</text><line x1=\"254.0\" y1=\"170.0\" x2=\"254.0\" y2=\"174.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"254.0\" y=\"185.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">190</text><line x1=\"310.0\" y1=\"170.0\" x2=\"310.0\" y2=\"174.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"310.0\" y=\"185.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">200</text><text x=\"170.0\" y=\"202.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">\u00een\u0103l\u021bimea (cm)</text></svg>", "nota": "Dup\u0103 figura manualului; media de 175 cm \u0219i \u00eempr\u0103\u0219tierea sunt ilustrative."}], "noduri": [{"t": "Curba lui Gauss", "d": "Caracterele poligenice, cu multe variante, au distribu\u021bie \u00een form\u0103 de clopot: majoritatea indivizilor se grupeaz\u0103 \u00een jurul mediei, pu\u021bini la extreme."}, {"t": "Regresia spre medie", "d": "P\u0103rin\u021bii foarte \u00eenal\u021bi au copii peste medie, dar mai pu\u021bin \u00eenal\u021bi ca ei: combina\u021bia lor de gene \u0219i mediu rareori se repet\u0103 la copil. La fel la talia mic\u0103; efectul e mai clar c\u00e2nd p\u0103rin\u021bii sunt extremi."}, {"t": "Modelul oligogenic al taliei", "d": "Propune dou\u0103 gene cu efect major, la care se adaug\u0103 componenta multifactorial\u0103: alte gene \u0219i factori de mediu cu efecte mici."}, {"t": "Norma de reac\u021bie", "d": "\u0218irul fenotipurilor pe care le d\u0103 acela\u0219i genotip \u00eentr-o gam\u0103 de medii. O mic\u0103 varia\u021bie de mediu neteze\u0219te clasele genetice \u00eentr-o adev\u0103rat\u0103 curb\u0103 gaussian\u0103."}]}, {"titlu": "Culoarea pielii: un model de poligenie", "figuri": [{"titlu": "Num\u0103rul de loci \u0219i clasele fenotipice", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 302\" role=\"img\" aria-label=\"Cu c\u00e2t sunt mai mul\u021bi loci, cu at\u00e2t sunt mai multe clase fenotipice, iar distribu\u021bia se apropie de un clopot: 1:2:1 pentru un locus, 1:4:6:4:1 pentru doi, 1:6:15:20:15:6:1 pentru trei\" font-family=\"Georgia, serif\" font-size=\"13\"><text x=\"4.0\" y=\"18.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\" font-weight=\"bold\">1 locus: 1 : 2 : 1 (raportul mendelian)</text><rect x=\"40.0\" y=\"54.0\" width=\"52.0\" height=\"26.0\" fill=\"#2a78d6\"><title>1/4</title></rect><rect x=\"144.0\" y=\"28.0\" width=\"52.0\" height=\"52.0\" fill=\"#2a78d6\"><title>2/4</title></rect><rect x=\"248.0\" y=\"54.0\" width=\"52.0\" height=\"26.0\" fill=\"#2a78d6\"><title>1/4</title></rect><line x1=\"30.0\" y1=\"80.0\" x2=\"310.0\" y2=\"80.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"4.0\" y=\"108.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\" font-weight=\"bold\">2 loci (Davenport): 1 : 4 : 6 : 4 : 1</text><rect x=\"40.0\" y=\"163.5\" width=\"28.9\" height=\"6.5\" fill=\"#2a78d6\"><title>1/16</title></rect><rect x=\"97.8\" y=\"144.0\" width=\"28.9\" height=\"26.0\" fill=\"#2a78d6\"><title>4/16</title></rect><rect x=\"155.6\" y=\"131.0\" width=\"28.9\" height=\"39.0\" fill=\"#2a78d6\"><title>6/16</title></rect><rect x=\"213.3\" y=\"144.0\" width=\"28.9\" height=\"26.0\" fill=\"#2a78d6\"><title>4/16</title></rect><rect x=\"271.1\" y=\"163.5\" width=\"28.9\" height=\"6.5\" fill=\"#2a78d6\"><title>1/16</title></rect><line x1=\"30.0\" y1=\"170.0\" x2=\"310.0\" y2=\"170.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"4.0\" y=\"198.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\" font-weight=\"bold\">3 loci: 1 : 6 : 15 : 20 : 15 : 6 : 1</text><rect x=\"40.0\" y=\"258.4\" width=\"20.0\" height=\"1.6\" fill=\"#2a78d6\"><title>1/64</title></rect><rect x=\"80.0\" y=\"250.2\" width=\"20.0\" height=\"9.8\" fill=\"#2a78d6\"><title>6/64</title></rect><rect x=\"120.0\" y=\"235.6\" width=\"20.0\" height=\"24.4\" fill=\"#2a78d6\"><title>15/64</title></rect><rect x=\"160.0\" y=\"227.5\" width=\"20.0\" height=\"32.5\" fill=\"#2a78d6\"><title>20/64</title></rect><rect x=\"200.0\" y=\"235.6\" width=\"20.0\" height=\"24.4\" fill=\"#2a78d6\"><title>15/64</title></rect><rect x=\"240.0\" y=\"250.2\" width=\"20.0\" height=\"9.8\" fill=\"#2a78d6\"><title>6/64</title></rect><rect x=\"280.0\" y=\"258.4\" width=\"20.0\" height=\"1.6\" fill=\"#2a78d6\"><title>1/64</title></rect><line x1=\"30.0\" y1=\"260.0\" x2=\"310.0\" y2=\"260.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"40.0\" y=\"278.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.2\">mai pu\u021bin pigment</text><text x=\"310.0\" y=\"278.0\" text-anchor=\"end\" fill=\"#6b6760\" font-size=\"10.2\">mai mult pigment</text><text x=\"170.0\" y=\"294.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">clasele fenotipice (alele dominante: 0 \u2026 2n)</text></svg>", "nota": "Reune\u0219te schema monohibrid\u0103rii (1:2:1) \u0219i figura cu 1, 2 \u0219i 3 loci; rapoartele rezult\u0103 din modelul aditiv."}], "noduri": [{"t": "Ipoteza monogenic\u0103 respins\u0103", "d": "Cu o singur\u0103 pereche P/p, F2 din mulatri ar da 1 negru : 2 mulatri : 1 alb (50% mulatri). Davenport (Jamaica, Bermude) g\u0103se\u0219te circa 80% mulatri, deci sunt implicate mai multe perechi de gene."}, {"t": "Modelul lui Davenport", "d": "Dou\u0103 perechi de gene aditive, P\u2081p\u2081 \u0219i P\u2082p\u2082: negrii P\u2081P\u2081P\u2082P\u2082, albii p\u2081p\u2081p\u2082p\u2082. Culoarea depinde de num\u0103rul alelelor dominante (0\u20134), nu de care anume."}, {"t": "Raportul 1:4:6:4:1", "d": "Din mulatri P\u2081p\u2081P\u2082p\u2082 rezult\u0103 \u00een F2 cinci clase: albi, mulatri deschi\u0219i, mulatri, mulatri \u00eenchi\u0219i, negri, \u00een raport 1 : 4 : 6 : 4 : 1; reapar culorile bunicilor."}, {"t": "Mai mul\u021bi loci, mai multe clase", "d": "Cu fiecare locus \u00een plus cresc clasele fenotipice, iar distribu\u021bia se apropie de clopot. Fiecare gen\u0103 r\u0103m\u00e2ne mendelian\u0103; doar rezultatul interac\u021biunii nu mai arat\u0103 segregarea clasic\u0103."}, {"t": "Limitele modelului", "d": "Davenport simplific\u0103: ignor\u0103 variabilitatea din fiecare ras\u0103 \u0219i mediul. Stern (1960) analizeaz\u0103 2\u201320 de perechi; m\u0103sur\u0103torile ulterioare duc la un model cu patru perechi."}]}, {"titlu": "Caracterele discontinue: modelul cu prag", "figuri": [{"titlu": "Modelul cu prag al predispozi\u021biei", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 192\" role=\"img\" aria-label=\"Predispozi\u021bia are distribu\u021bie continu\u0103; boala apare dincolo de prag. La rudele de gradul I curba e deplasat\u0103 spre dreapta, deci mai mul\u021bi dep\u0103\u0219esc pragul\" font-family=\"Georgia, serif\" font-size=\"13\"><path d=\"M227.2,166.0 L227.2,141.1 L228.7,143.2 L230.2,145.3 L231.6,147.2 L233.1,148.9 L234.6,150.6 L236.1,152.1 L hor=\"end\" fill=\"#6b6760\" font-size=\"10.2\">(0,1% afecta\u021bi)</text><text x=\"236.1\" y=\"70.0\" text-anchor=\"start\" fill=\"#2a78d6\" font-size=\"10.2\">rude de gradul I</text><text x=\"236.1\" y=\"82.0\" text-anchor=\"start\" fill=\"#2a78d6\" font-size=\"10.2\">(4% afecta\u021bi)</text><line x1=\"245.0\" y1=\"160.0\" x2=\"265.7\" y2=\"120.0\" stroke=\"#6b6760\" stroke-width=\"1\"/><text x=\"267.7\" y=\"116.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.2\">afecta\u021bi</text><text x=\"168.0\" y=\"184.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">predispozi\u021bia (gene de susceptibilitate + mediu)</text></svg>", "nota": "Dup\u0103 figura manualului; procentele sunt cele ale despic\u0103turii labio-palatine din text, forma curbelor e ilustrativ\u0103."}], "noduri": [{"t": "Bolile comune", "d": "Malforma\u021biile congenitale comune \u0219i bolile multifactoriale ale adultului afecteaz\u0103 peste 5% din popula\u021bie; se concentreaz\u0103 \u00een familii, dar f\u0103r\u0103 pedigree-uri mendeliene (diabet, boli psihice, despic\u0103turi palatine)."}, {"t": "Concentrarea familial\u0103", "d": "Inciden\u021ba la rude e mai mare dec\u00e2t \u00een popula\u021bie, dar mult sub cea mendelian\u0103: buza de iepure apare la 0,1% din popula\u021bie \u0219i la 4% din rudele de gradul I ale afecta\u021bilor."}, {"t": "Agregarea nu dovede\u0219te", "d": "Agregarea familial\u0103 nu dovede\u0219te singur\u0103 un determinism genetic: \u0219i factorii sociali se transmit \u00een familie (limbajul copilului). Condi\u021bia: tr\u0103s\u0103tura s\u0103 nu apar\u0103 la ne\u00eenrudi\u021bi \u00een acela\u0219i mediu."}, {"t": "Varia\u021bia \u00eentre popula\u021bii", "d": "Frecven\u021ba caracterelor multifactoriale difer\u0103 de la o popula\u021bie la alta, semn c\u0103 factori favorizan\u021bi de mediu se adaug\u0103 susceptibilit\u0103\u021bii genetice."}, {"t": "Gene de susceptibilitate \u0219i prag", "d": "Predispozi\u021bia, dat\u0103 de multe gene cu efect slab \u0219i aditiv, are distribu\u021bie continu\u0103; boala apare doar peste un prag. La rudele afecta\u021bilor curba e deplasat\u0103 spre dreapta, deci mai mul\u021bi dep\u0103\u0219esc pragul."}, {"t": "Predispozi\u021bia nu e boala", "d": "Genele nu determin\u0103 direct boala (nici cea psihic\u0103), ci o favorizeaz\u0103 \u00eentr-un context de mediu dat; o gen\u0103 de predispozi\u021bie pentru un comportament nu e o gen\u0103 patologic\u0103."}]}, {"titlu": "Corela\u021bia familial\u0103 \u0219i gemenii", "figuri": [{"titlu": "Concordan\u021ba gemenilor MZ \u0219i DZ", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 290\" role=\"img\" aria-label=\"Concordan\u021ba gemenilor monozigo\u021bi e mai mare dec\u00e2t a dizigo\u021bilor la toate tr\u0103s\u0103turile, dar sub 100%\" font-family=\"Georgia, serif\" font-size=\"13\"><rect x=\"150.0\" y=\"4.0\" width=\"10.0\" height=\"10.0\" fill=\"#2a78d6\"></rect><text x=\"164.0\" y=\"13.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">MZ</text><rect x=\"190.4\" y=\"4.0\" width=\"10.0\" height=\"10.0\" fill=\"#eb6834\"></rect><text x=\"204.4\" y=\"13.0\" text-anchor=\"start\" fill=\"#2c2a26\" font-size=\"10.8\">DZ</text><text x=\"146.0\" y=\"36.0\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.2\">Despic\u0103tur\u0103 labio-palatin\u0103</text><rect x=\"150.0\" y=\"26.0\" width=\"73.5\" height=\"7.0\" fill=\"#2a78d6\"><title>Despic\u0103tur\u0103 labio-palatin\u0103: MZ 35%</title></rect><rect x=\"150.0\" y=\"34.0\" width=\"10.5\" height=\"7.0\" fill=\"#eb6834\"><title>Despic\u0103tur\u0103 labio-palatin\u0103: DZ 5%</title></rect><text x=\"226.5\" y=\"33.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.2\">35</text><text x=\"146.0\" y=\"58.0\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.2\">Spina bifida</text><rect x=\"150.0\" y=\"48.0\" width=\"12.6\" height=\"7.0\" fill=\"#2a78d6\"><title>Spina bifida: MZ 6%</title></rect><rect x text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.2\">61</text><text x=\"146.0\" y=\"168.0\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.2\">Artrita reumatoid\u0103</text><rect x=\"150.0\" y=\"158.0\" width=\"63.0\" height=\"7.0\" fill=\"#2a78d6\"><title>Artrita reumatoid\u0103: MZ 30%</title></rect><rect x=\"150.0\" y=\"166.0\" width=\"10.5\" height=\"7.0\" fill=\"#eb6834\"><title>Artrita reumatoid\u0103: DZ 5%</title></rect><text x=\"216.0\" y=\"165.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.2\">30</text><text x=\"146.0\" y=\"190.0\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.2\">Cancer</text><rect x=\"150.0\" y=\"180.0\" width=\"35.7\" height=\"7.0\" fill=\"#2a78d6\"><title>Cancer: MZ 17%</title></rect><rect x=\"150.0\" y=\"188.0\" width=\"23.1\" height=\"7.0\" fill=\"#eb6834\"><title>Cancer: DZ 11%</title></rect><text x=\"188.7\" y=\"187.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.2\">17</text><text x=\"146.0\" y=\"212.0\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.2\">Epilepsie</text><rect x=\"150.0\" y=\"202.0\" width=\"77.7\" height=\"7.0\" fill=\"#2a78d6\"><title>Epilepsie: MZ 37%</title></rect><rect x=\"150.0\" y=\"210.0\" width=\"21.0\" height=\"7.0\" fill=\"#eb6834\"><title>Epilepsie: DZ 10%</title></rect><text x=\"230.7\" y=\"209.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.2\">37</text><text x=\"146.0\" y=\"234.0\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.2\">Schizofrenie</text><rect x=\"150.0\" y=\"224.0\" width=\"94.5\" height=\"7.0\" fill=\"#2a78d6\"><title>Schizofrenie: MZ 45%</title></rect><rect x=\"150.0\" y=\"232.0\" width=\"25.2\" height=\"7.0\" fill=\"#eb6834\"><title>Schizofrenie: DZ 12%</title></rect><text x=\"247.5\" y=\"231.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.2\">45</text><text x=\"146.0\" y=\"256.0\" text-anchor=\"end\" fill=\"#2c2a26\" font-size=\"10.2\">Tulburarea bipolar\u0103</text><rect x=\"150.0\" y=\"246.0\" width=\"147.0\" height=\"7.0\" fill=\"#2a78d6\"><title>Tulburarea bipolar\u0103: MZ 70%</title></rect><rect x=\"150.0\" y=\"254.0\" width=\"31.5\" height=\"7.0\" fill=\"#eb6834\"><title>Tulburarea bipolar\u0103: DZ 15%</title></rect><text x=\"300.0\" y=\"253.0\" text-anchor=\"start\" fill=\"#6b6760\" font-size=\"10.2\">70</text><line x1=\"150.0\" y1=\"24.0\" x2=\"150.0\" y2=\"268.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><line x1=\"150.0\" y1=\"268.0\" x2=\"318.0\" y2=\"268.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><line x1=\"150.0\" y1=\"268.0\" x2=\"150.0\" y2=\"272.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"150.0\" y=\"283.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">0%</text><line x1=\"192.0\" y1=\"268.0\" x2=\"192.0\" y2=\"272.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"192.0\" y=\"283.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">20%</text><line x1=\"234.0\" y1=\"268.0\" x2=\"234.0\" y2=\"272.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"234.0\" y=\"283.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">40%</text><line x1=\"276.0\" y1=\"268.0\" x2=\"276.0\" y2=\"272.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"276.0\" y=\"283.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">60%</text><line x1=\"318.0\" y1=\"268.0\" x2=\"318.0\" y2=\"272.0\" stroke=\"#b9b0a0\" stroke-width=\"1\"/><text x=\"318.0\" y=\"283.0\" text-anchor=\"middle\" fill=\"#6b6760\" font-size=\"10.2\">80%</text></svg>", "nota": "Datele tabelului din manual (coloanele, comasate \u00een PDF, au fost puse \u00een ordine)."}], "tabel": {"cap": ["Tulburarea", "Concordan\u021ba MZ", "Concordan\u021ba DZ"], "randuri": [["Monogenic\u0103", "100%", "ca la fra\u021bi"], ["Cromozomial\u0103", "100%", "ca la fra\u021bi"], ["Multifactorial\u0103", "sub 100%, dar peste DZ", "ca la fra\u021bi"], ["Mezologic\u0103", "ca la fra\u021bi", "ca la fra\u021bi"]]}, "lat": true, "noduri": [{"t": "Corela\u021bia familial\u0103", "d": "Frecven\u021ba tr\u0103s\u0103turii la rudele unui afectat: scade odat\u0103 cu propor\u021bia genelor comune, dar r\u0103m\u00e2ne peste cea din popula\u021bia general\u0103."}, {"t": "Gemenii MZ \u0219i DZ", "d": "MZ: acela\u0219i zigot, scindat \u00een primele 14 zile; identici genetic, frecven\u021b\u0103 constant\u0103 (0,3\u20130,4%). DZ: ovula\u021bie dubl\u0103, cu concentrare familial\u0103 \u0219i frecven\u021b\u0103 variabil\u0103; au 1/2 din gene \u00een comun."}, {"t": "Concordan\u021ba", "d": "Ambii gemeni au tr\u0103s\u0103tura (concordan\u021bi) sau doar unul (discordan\u021bi). Cu c\u00e2t concordan\u021ba MZ o dep\u0103\u0219e\u0219te mai mult pe cea DZ, cu at\u00e2t componenta ereditar\u0103 e mai puternic\u0103."}, {"t": "Tiparele de concordan\u021b\u0103", "d": "Monogenic \u0219i cromozomial: MZ 100%, DZ ca fra\u021bii. Multifactorial: MZ sub 100%, dar peste DZ. Mezologic: MZ ca DZ. \u00cen fapt, concordan\u021ba MZ e rar 100%."}, {"t": "Gemenii crescu\u021bi separat", "d": "MZ crescu\u021bi \u00eempreun\u0103 \u00eempart \u0219i mediul; separa\u021bi cur\u00e2nd dup\u0103 na\u0219tere, sunt o experien\u021b\u0103 a naturii (gemelaritatea) \u0219i una a culturii (adop\u021bia). Dac\u0103 MZ r\u0103m\u00e2n mai concordan\u021bi dec\u00e2t DZ, rolul genelor e admis."}, {"t": "Studiile de adop\u021bie", "d": "Copiii unor p\u0103rin\u021bi schizofreni, adopta\u021bi de familii s\u0103n\u0103toase, fac boala \u00een 8\u201310% din cazuri, fa\u021b\u0103 de 1% la adopta\u021bii cu p\u0103rin\u021bi s\u0103n\u0103to\u0219i: argument pentru un factor genetic important."}, {"t": "Lumea gemenilor", "d": "Gemenii cresc \u00eentr-un context aparte: MZ \u00ee\u0219i refuz\u0103 sau \u00ee\u0219i accentueaz\u0103 identitatea, \u00ee\u0219i asum\u0103 roluri diferite (unul dominant), dezvolt\u0103 adesea un limbaj propriu; conteaz\u0103 la caracterele psihice."}]}, {"titlu": "Heritabilitatea \u0219i studiile despre inteligen\u021b\u0103", "noduri": [{"t": "Heritabilitatea (h)", "d": "Propor\u021bia din varia\u021bia unui caracter datorat\u0103 cauzelor genetice: h = 1, determinat genetic; h = 0, determinat de mediu. Se estimeaz\u0103 din studii familiale, gemelologice \u0219i popula\u021bionale."}, {"t": "Valori ale heritabilit\u0103\u021bii", "d": "\u00cen\u0103l\u021bimea: 0,80; \u00een\u0103l\u021bimea \u0219ez\u00e2nd: 0,76; greutatea: doar 0,078. Pentru IQ exist\u0103 un consens puternic c\u0103 e heritabil: \u00een propor\u021bie de 60\u201370%, balan\u021ba \u00eenclin\u0103 spre \u00eenn\u0103scut."}, {"t": "Frauda lui Burt", "d": "Cyril Burt sus\u021binea c\u0103 IQ-ul e genetic \u00een propor\u021bie de 77% \u0219i c\u0103 s\u0103r\u0103cia vine din inteligen\u021ba sc\u0103zut\u0103; dup\u0103 moartea lui s-a dovedit c\u0103 datele erau fabricate. Teoria dusese la examenul \u201eunsprezece plus\u201d."}, {"t": "Studiul Minnesota (Bouchard)", "d": "Echipa lui Bouchard conchide c\u0103 influen\u021ba genelor asupra inteligen\u021bei cre\u0219te cu v\u00e2rsta, iar adul\u021bii MZ nu sunt mai asem\u0103n\u0103tori dac\u0103 au crescut \u00eempreun\u0103 dec\u00e2t separat."}, {"t": "Metoda co-geam\u0103nului", "d": "Un geam\u0103n MZ prime\u0219te o interven\u021bie, cel\u0103lalt r\u0103m\u00e2ne martor. A\u0219a s-a v\u0103zut c\u0103 educa\u021bia cre\u0219te IQ-ul: nu mo\u0219tenim un IQ anume, ci aptitudinea de a-l dezvolta."}, {"t": "Studiul direct al genelor", "d": "Gemenii arat\u0103 ponderea genelor, nu genele; le g\u0103sesc tehnologiile moderne. Exemplu: hiperactivitatea cu deficit de aten\u021bie la rezisten\u021ba la hormonii tiroidieni, cu peste 30 de muta\u021bii dominante ale receptorului (cromozomul 3)."}, {"t": "Ereditate \u0219i mediu \u00eempreun\u0103", "d": "Comportamentul rezult\u0103 din jocul eredit\u0103\u021bii cu mediul (stimulant-cooperator sau distructiv), iar tentativele de a le cuantifica separat au e\u0219uat. \u00centrebarea cu sens prive\u0219te diferen\u021bele dintre indivizii unei popula\u021bii date."}]}, {"titlu": "Sfatul genetic: riscul empiric", "tabel": {"cap": ["Tr\u0103s\u0103tura", "Rude gr. I", "Rude gr. II", "Rude gr. III", "Popula\u021bia"], "randuri": [["Buz\u0103 de iepure", "4%", "0,6%", "0,3%", "0,1%"], ["Spina bifida / anencefalie", "4%", "1,5%", "0,6%", "0,3%"], ["Stenoz\u0103 piloric\u0103", "2%", "1%", "0,4%", "0,3%"], ["Epilepsie", "5%", "2,5%", "1,5%", "1%"], ["Schizofrenie", "10%", "4%", "2%", "1%"], ["Tulburare bipolar\u0103", "15%", "5%", "3,5%", "1%"]]}, "noduri": [{"t": "Riscul empiric de recuren\u021b\u0103", "d": "Nu se cunosc num\u0103rul genelor, alelele p\u0103rin\u021bilor \u0219i rolul mediului, deci riscul nu se calculeaz\u0103 mendelian, ci empiric, din statistici popula\u021bionale ample, \u00een familiile cu un afectat; pedigree-ul nu ajut\u0103."}, {"t": "Mai mul\u021bi membri afecta\u021bi", "d": "Riscul de recuren\u021b\u0103 cre\u0219te c\u00e2nd \u00een familie sunt mai mul\u021bi membri afecta\u021bi."}, {"t": "Gravitatea formei", "d": "Riscul e mai mare c\u00e2nd probandul are o form\u0103 mai sever\u0103: la despic\u0103tura labio-palatin\u0103, de la 2% (unilateral\u0103) la peste 6% (bilateral\u0103)."}, {"t": "Sexul \u0219i consangvinitatea", "d": "La bolile mai frecvente la un sex, riscul variaz\u0103 dup\u0103 sex; consangvinitatea amplific\u0103 riscul."}, {"t": "Gradul de rudenie", "d": "Riscul scade rapid cu gradul de rudenie: schizofrenie 10\u201315% la gradul I, 3% la gradul II; autism infantil 4,5% (I), 0,1% (II), 0,05% (III), c\u00e2t \u00een popula\u021bia general\u0103."}, {"t": "Riscul difer\u0103 \u00eentre popula\u021bii", "d": "Riscul de recuren\u021b\u0103 variaz\u0103 de la o popula\u021bie la alta, fiindc\u0103 difer\u0103 frecven\u021ba genelor mutante \u0219i factorii de mediu."}]}]}, "sectiuni": [], "runde": [{"id": "1", "eticheta": "Runda 1 \u00b7 Baz\u0103", "titlu": "Runda 1 \u2014 Concepte de baz\u0103", "desc": "Teorie: poligenia, modelul cu prag, metodele (corela\u021bia familial\u0103, gemenii, adop\u021bia), heritabilitatea \u0219i riscul empiric, \u00een \u00eentreb\u0103ri directe.", "intrebari": [{"q": "Prin ce se deosebe\u0219te, \u00een sens strict, ereditatea multifactorial\u0103 de cea poligenic\u0103?", "opts": ["Cea poligenic\u0103 include \u0219i gene cu efect major", "Cea multifactorial\u0103 prive\u0219te doar boli, nu caractere normale", "Cea multifactorial\u0103 include \u0219i un efect al mediului", "Cea poligenic\u0103 prive\u0219te un singur locus cu multe alele"], "correct": 2, "explain": "Poligenia cuprinde doar ac\u021biunea aditiv\u0103 a mai multor gene; multifactorialul adaug\u0103 o component\u0103 de mediu (mezologic\u0103), de\u0219i \u00een practic\u0103 cele dou\u0103 nu se pot separa. Ambele privesc \u0219i caractere normale; un locus cu multe alele e polialelie, nu poligenie.", "tag": "Poligenic vs multifactorial"}, {"q": "De ce nu se pot studia caracterele cantitative prin pedigree-uri, ca cele mendeliene?", "opts": ["Genele lor sunt pe gonozomi, deci pedigree-ul \u00een\u0219al\u0103", "Le avem to\u021bi, \u00een grade diferite, f\u0103r\u0103 clase distincte", "Apar doar la adul\u021bi, deci genera\u021biile nu se compar\u0103", "Sunt produse de muta\u021bii noi, ap\u0103rute \u00een fiecare genera\u021bie"], "correct": 1, "explain": "Analiza mendelian\u0103 cere caractere dicotomice (le ai sau nu); \u00een\u0103l\u021bimea sau inteligen\u021ba variaz\u0103 continuu, deci nu po\u021bi marca purt\u0103tori \u0219i nepurt\u0103tori. Genele lor nu sunt \u00een special pe gonozomi, iar muta\u021biile noi nu explic\u0103 varia\u021bia continu\u0103.", "tag": "Caractere cantitative"}, {"q": "Ce a adus Galton \u00een studiul caracterelor cu varia\u021bie continu\u0103?", "opts": ["Analiza lor statistic\u0103, prin biometrie", "Primele rapoarte de segregare 3 : 1 la om", "Descoperirea cromozomilor de sex", "Prima hart\u0103 a genelor pentru talie"], "correct": 0, "explain": "\u00cen laboratorul antropometric din Londra, Galton a m\u0103surat atribute fizice \u0219i le-a analizat statistic (biometria), stabilind corela\u021bia familial\u0103 dintre rude, \u00eentr-o \u0219coal\u0103 rival\u0103 celei mendeliene. Rapoartele 3 : 1 sunt ale lui Mendel, iar genele taliei nu sunt cunoscute nici azi.", "tag": "Galton \u0219i biometria"}, {"q": "Ce a ar\u0103tat Fisher \u00een disputa dintre mendelieni \u0219i biometricieni?", "opts": ["C\u0103 legile lui Mendel nu se aplic\u0103 la om", "C\u0103 multe gene mendeliene dau varia\u021bie continu\u0103", "C\u0103 varia\u021bia continu\u0103 vine din amestecul s\u00e2ngelui", "C\u0103 tr\u0103s\u0103turile continue nu au baz\u0103 genetic\u0103"], "correct": 1, "explain": "Fisher demonstreaz\u0103 c\u0103 o tr\u0103s\u0103tur\u0103 controlat\u0103 de mul\u021bi factori mendelieni independen\u021bi are tocmai ce descriau biometricienii: natur\u0103 continu\u0103, varia\u021bie cantitativ\u0103, corela\u021bie familial\u0103. Disputa se \u00eenchide deci printr-o sintez\u0103, nu prin respingerea uneia dintre \u0219coli.", "tag": "Sinteza lui Fisher"}, {"q": "Ce caracterizeaz\u0103 poligenele care controleaz\u0103 un caracter cantitativ?", "opts": ["Efecte mici, aditive, la loci care segreg\u0103 independent", "Efecte mari, dominante, la loci \u00eenl\u0103n\u021bui\u021bi pe un cromozom", "Mai multe alele ale aceluia\u0219i locus, cu dominan\u021b\u0103", "Efecte opuse, care se anuleaz\u0103 la heterozigo\u021bi"], "correct": 0, "explain": "Fiecare poligen\u0103 st\u0103 pe un locus de tr\u0103s\u0103tur\u0103 cantitativ\u0103 \u0219i are un efect limitat, dar cumulativ; genele segreg\u0103 independent, de obicei pe cromozomi diferi\u021bi. Alelele multiple ale unui locus \u00eenseamn\u0103 polialelie, din Cap. 2 (Ereditatea mendelian\u0103: legile lui Mendel).", "tag": "Poligenia"}, {"q": "Ce arat\u0103 faptul c\u0103 un genotip are o norm\u0103 de reac\u021bie larg\u0103?", "opts": ["C\u0103 are multe alele diferite pe acela\u0219i locus", "C\u0103 se exprim\u0103 identic, oricare ar fi mediul", "C\u0103 are penetran\u021b\u0103 complet\u0103 \u00een toate familiile", "C\u0103 d\u0103 fenotipuri diferite \u00een medii diferite"], "correct": 3, "explain": "Norma de reac\u021bie e \u0219irul fenotipurilor pe care le d\u0103 acela\u0219i genotip \u00eentr-o gam\u0103 de medii; una larg\u0103 \u00eenseamn\u0103 un fenotip sensibil la mediu. Exprimarea identic\u0103 ar fi o norm\u0103 \u00eengust\u0103, iar penetran\u021ba, din Cap. 3 (Modele de transmitere a caracterelor monogenice (mendeliene) \u00een familiile umane), prive\u0219te o gen\u0103.", "tag": "Norma de reac\u021bie"}, {"q": "Ce raport fenotipic d\u0103 \u00een F2 din mulatri modelul cu dou\u0103 perechi de gene aditive?", "opts": ["1 : 2 : 1", "9 : 3 : 3 : 1", "3 : 1", "1 : 4 : 6 : 4 : 1"], "correct": 3, "explain": "Cu dou\u0103 perechi aditive conteaz\u0103 num\u0103rul de alele dominante (0\u20134): cinci clase, de la alb la negru, \u00een raport 1 : 4 : 6 : 4 : 1. Raportul 1 : 2 : 1 ar fi pentru o pereche cu dominan\u021b\u0103 incomplet\u0103, iar 9 : 3 : 3 : 1 pentru dou\u0103 perechi cu dominan\u021b\u0103 complet\u0103.", "tag": "Raportul 1:4:6:4:1"}, {"q": "Ce se \u00eent\u00e2mpl\u0103 cu distribu\u021bia fenotipurilor c\u00e2nd cre\u0219te num\u0103rul locilor implica\u021bi?", "opts": ["Se apropie de o curb\u0103 \u00een form\u0103 de clopot", "Se apropie de raportul 3 : 1 al lui Mendel", "Se \u00eemparte \u00een dou\u0103 clase net separate", "R\u0103m\u00e2ne la trei clase, ca la un locus"], "correct": 0, "explain": "Fiecare locus \u00een plus adaug\u0103 clase fenotipice, iar frecven\u021bele lor se apropie de curba lui Gauss; o mic\u0103 varia\u021bie de mediu o neteze\u0219te complet. Dou\u0103 clase separate descriu un caracter dicotomic, iar trei clase, un singur locus.", "tag": "Mai mul\u021bi loci, mai multe clase"}, {"q": "Ce dou\u0103 concepte au permis extinderea teoriei poligenice la caracterele discontinue?", "opts": ["Penetran\u021ba incomplet\u0103 \u0219i expresivitatea", "Dominan\u021ba \u0219i recesivitatea", "Heritabilitatea \u0219i norma de reac\u021bie", "Susceptibilitatea genetic\u0103 \u0219i pragul"], "correct": 3, "explain": "Predispozi\u021bia dat\u0103 de multe gene de susceptibilitate, cu efect slab \u0219i aditiv, are distribu\u021bie continu\u0103, iar boala apare doar dincolo de un prag. Penetran\u021ba, expresivitatea \u0219i dominan\u021ba descriu gene unice, din Cap. 3 (Modele de transmitere a caracterelor monogenice (mendeliene) \u00een familiile umane).", "tag": "Gene de susceptibilitate \u0219i prag"}, {"q": "De ce nu dovede\u0219te singur\u0103 agregarea familial\u0103 a unei tr\u0103s\u0103turi un determinism genetic?", "opts": ["Rudele au prea pu\u021bine gene \u00een comun", "\u0218i factorii sociali se transmit \u00een familie", "Tr\u0103s\u0103turile genetice nu apar \u00een familii", "Agregarea apare numai la bolile monogenice rare"], "correct": 1, "explain": "Familia \u00eemparte \u0219i mediul, nu doar genele: limbajul copilului seam\u0103n\u0103 cu al p\u0103rin\u021bilor f\u0103r\u0103 s\u0103 fie genetic. Condi\u021bia ar fi ca tr\u0103s\u0103tura s\u0103 nu apar\u0103 la ne\u00eenrudi\u021bi \u00een acela\u0219i mediu. Agregarea apare \u0219i la bolile multifactoriale.", "tag": "Agregarea nu dovede\u0219te"}, {"q": "Ce indic\u0103 faptul c\u0103 frecven\u021ba unei boli multifactoriale difer\u0103 mult \u00eentre popula\u021bii?", "opts": ["Transmiterea ei dup\u0103 legile lui Mendel", "Absen\u021ba unei componente genetice", "Interven\u021bia unor factori favorizan\u021bi de mediu", "Originea ei cromozomial\u0103, prin non-disjunc\u021bie"], "correct": 2, "explain": "Diferen\u021bele dintre popula\u021bii arat\u0103 factori de mediu care se adaug\u0103 unei susceptibilit\u0103\u021bi genetice; nu exclud componenta genetic\u0103. Transmiterea mendelian\u0103 sau originea cromozomial\u0103 nu explic\u0103 varia\u021bia legat\u0103 de popula\u021bie.", "tag": "Varia\u021bia \u00eentre popula\u021bii"}, {"q": "Ce rat\u0103 de concordan\u021b\u0103 au gemenii monozigo\u021bi pentru o tulburare multifactorial\u0103?", "opts": ["100%, fiindc\u0103 au acelea\u0219i gene", "Sub 100%, dar peste cea a dizigo\u021bilor", "Aceea\u0219i cu a dizigo\u021bilor \u0219i a fra\u021bilor", "Sub a dizigo\u021bilor, prin rolurile diferite"], "correct": 1, "explain": "La tulbur\u0103rile multifactoriale genele identice cresc concordan\u021ba MZ peste cea DZ, dar mediul o \u021bine sub 100%. Concordan\u021ba de 100% e a tulbur\u0103rilor monogenice \u0219i cromozomiale, iar egalitatea MZ = DZ arat\u0103 o tulburare de mediu.", "tag": "Tiparele de concordan\u021b\u0103"}, {"q": "Ce avantaj au studiile pe gemeni monozigo\u021bi crescu\u021bi separat?", "opts": ["Despart efectul genelor de cel al mediului comun", "Permit identificarea genelor implicate", "Elimin\u0103 diferen\u021bele genetice dintre gemeni", "M\u0103resc mult num\u0103rul de perechi disponibile pentru studiu"], "correct": 0, "explain": "MZ crescu\u021bi \u00eempreun\u0103 au \u0219i gene, \u0219i mediu comune; separa\u021bi cur\u00e2nd dup\u0103 na\u0219tere, asem\u0103narea lor r\u0103mas\u0103 \u021bine de gene (o experien\u021b\u0103 a naturii \u0219i una a culturii). Gemenii nu identific\u0103 genele, iar MZ sunt oricum identici genetic.", "tag": "Gemenii crescu\u021bi separat"}, {"q": "Ce m\u0103soar\u0103 heritabilitatea unui caracter?", "opts": ["Ce parte din caracterul unui om vine din gene", "C\u00e2t de des apare caracterul la rudele de gradul I", "Ce parte din varia\u021bia lui are cauze genetice", "C\u00e2t de des au ambii gemeni caracterul"], "correct": 2, "explain": "Heritabilitatea e propor\u021bia din varia\u021bia caracterului \u00eentr-o popula\u021bie care \u021bine de cauze genetice (h = 1: genetic; h = 0: mediu); nu se aplic\u0103 unui individ. Frecven\u021ba la rude e corela\u021bia familial\u0103, iar apari\u021bia la ambii gemeni, concordan\u021ba.", "tag": "Heritabilitatea (h)"}, {"q": "Pe ce se bazeaz\u0103 riscul de recuren\u021b\u0103 dat \u00een sfatul genetic pentru o boal\u0103 multifactorial\u0103?", "opts": ["Pe legile lui Mendel aplicate genotipurilor ambilor p\u0103rin\u021bi", "Pe analiza pedigree-ului pe mai multe genera\u021bii", "Pe statistici popula\u021bionale din familii cu un afectat", "Pe identificarea genelor de susceptibilitate"], "correct": 2, "explain": "Fiindc\u0103 nu se cunosc num\u0103rul genelor, alelele p\u0103rin\u021bilor \u0219i rolul mediului, riscul e empiric, din date popula\u021bionale ample. Calculul mendelian cere genotipuri cunoscute, iar cazurile sunt de obicei sporadice, deci pedigree-ul nu ajut\u0103.", "tag": "Riscul empiric de recuren\u021b\u0103"}]}, {"id": "2", "eticheta": "Runda 2 \u00b7 Aplica\u021bii", "titlu": "Runda 2 \u2014 Scenarii \u0219i ra\u021bionament", "desc": "Situa\u021bii cu mai mul\u021bi pa\u0219i: calculezi clase fenotipice, interpretezi concordan\u021be \u0219i heritabilit\u0103\u021bi, estimezi riscuri empirice.", "intrebari": [{"q": "Doi mulatri, ambii heterozigo\u021bi pentru cele dou\u0103 perechi de gene ale modelului lui Davenport (P\u2081p\u2081P\u2082p\u2082), au mul\u021bi copii. Ce culori ale pielii pot ap\u0103rea la copiii lor?", "opts": ["Numai mulatri, ca p\u0103rin\u021bii lor", "Mulatri de nuan\u021be diferite, f\u0103r\u0103 albi sau negri", "Albi, mulatri \u0219i negri, \u00een raport 1 : 2 : 1", "De la alb la negru, cele mai multe intermediare"], "correct": 3, "explain": "Fiecare p\u0103rinte poate da game\u021bi de la p\u2081p\u2082 la P\u2081P\u2082, deci copiii au \u00eentre 0 \u0219i 4 alele dominante: albi, mulatri deschi\u0219i, mulatri, mulatri \u00eenchi\u0219i, negri (1 : 4 : 6 : 4 : 1), cu majoritatea intermediari; reapar culorile bunicilor. Raportul 1 : 2 : 1 ar fi al unei singure perechi.", "tag": "Modelul lui Davenport"}, {"q": "\u00centr-o popula\u021bie cu multe c\u0103s\u0103torii mixte, copiii a doi mulatri sunt mulatri \u00een aproximativ 80% din cazuri. Ce concluzie permite aceast\u0103 propor\u021bie?", "opts": ["Pigmenta\u021bia \u021bine de o pereche, cu dominan\u021b\u0103", "Pigmenta\u021bia \u021bine de mai multe perechi de gene", "Pigmenta\u021bia e determinat\u0103 numai de mediu", "Mulatrii sunt homozigo\u021bi pentru o alel\u0103 intermediar\u0103"], "correct": 1, "explain": "Cu o singur\u0103 pereche, F2 ar avea 50% mulatri (1 : 2 : 1); 80% intermediari cer mai multe perechi aditive, cum a conchis Davenport. Homozigo\u021bii pentru o alel\u0103 intermediar\u0103 ar avea numai copii mulatri, iar reapari\u021bia albilor \u0219i negrilor arat\u0103 segregare genetic\u0103.", "tag": "Ipoteza monogenic\u0103 respins\u0103"}, {"q": "\u00cen modelul lui Davenport, ce propor\u021bie din copiii a doi p\u0103rin\u021bi P\u2081p\u2081P\u2082p\u2082 ar avea pielea la fel de deschis\u0103 ca a albilor?", "opts": ["1/16, fiindc\u0103 trebuie s\u0103 fie p\u2081p\u2081p\u2082p\u2082", "1/4, ca la un singur locus recesiv", "1/8, jum\u0103tate din clasa cu o alel\u0103", "6/16, c\u00e2t clasa intermediar\u0103"], "correct": 0, "explain": "Pielea alb\u0103 cere zero alele dominante, adic\u0103 p\u2081p\u2081 (1/4) \u0219i p\u2082p\u2082 (1/4): 1/4 \u00d7 1/4 = 1/16, prima clas\u0103 din 1 : 4 : 6 : 4 : 1. 1/4 ar fi valabil pentru un singur locus, iar 6/16 e clasa cu dou\u0103 alele dominante.", "tag": "Raportul 1:4:6:4:1"}, {"q": "Despic\u0103tura labio-palatin\u0103 apare la 0,1% din popula\u021bie, dar la 4% din rudele de gradul I ale unui afectat. Cum explic\u0103 modelul cu prag diferen\u021ba?", "opts": ["Rudele au o alel\u0103 dominant\u0103 cu penetran\u021b\u0103 mic\u0103", "Rudele \u00eempart un mediu care produce malforma\u021bia", "Rudele au predispozi\u021bia deplasat\u0103 spre prag", "Rudele au un prag de boal\u0103 mai cobor\u00e2t"], "correct": 2, "explain": "Rudele de gradul I au multe gene de susceptibilitate \u00een comun cu afecta
