<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ortezare și protezare — recapitulare și quiz-uri finale</title>
<style>
  :root { --bg:#f4f1ea; --card:#fff; --ink:#2c2a26; --muted:#6b6760; --accent:#7a5c3e; --soft:#efe6d8;
    --border:#ddd5c7; --optbg:#faf8f3; --ok:#2e7d52; --okbg:#e6f3ec; --bad:#b5453a; --badbg:#f8e9e7; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, 'Times New Roman', serif; background: var(--bg); color: var(--ink); margin: 0; line-height: 1.55; }
  .wrap { max-width: var(--pagew, 960px); margin: 0 auto; padding: 24px 12px 80px; }
  .book { text-align: center; padding: 28px 16px 18px; }
  .book h1 { font-size: 2.1rem; margin: 0; color: var(--accent); }
  .book .sub { color: var(--muted); font-style: italic; margin: 6px 0 0; }
  .toc { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin: 8px 0 28px; }
  .toc h2 { font-size: 1rem; margin: 0 0 10px; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
  .toc ol { margin: 0; padding-left: 22px; columns: 2; column-gap: 28px; }
  .toc li { margin: 3px 0; break-inside: avoid; }
  .toc a { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--border); cursor: pointer; }
  .toc a:hover { color: var(--accent); }
  .toc .todo { color: var(--muted); font-style: italic; }
  .finals { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--soft); border: 1px solid var(--border); color: var(--accent); border-radius: 999px;
    padding: 6px 14px; font-size: .92rem; cursor: pointer; font-family: inherit; }
  .fnotes { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: .8rem; line-height: 1.45; }
  .fnotes b { color: var(--ink); }
  .chsec, .fq { margin: 0 0 38px; scroll-margin-top: 10px; }
  .chhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--accent);
    padding: 0 4px 6px; margin-bottom: 14px; }
  .chhead h2 { margin: 0; font-size: 1.35rem; color: var(--accent); }
  .chhead a { color: var(--muted); font-size: .85rem; white-space: nowrap; cursor: pointer; text-decoration: none; }
  .finals-intro { background: var(--card); border: 2px solid var(--accent); border-radius: 14px; padding: 18px 20px; margin-bottom: 22px; }
  .finals-intro h2 { margin: 0 0 6px; color: var(--accent); }
  .finals-intro p { margin: 0; color: var(--muted); }
  .tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
  .tab { background: var(--card); border: 1px solid var(--border); padding: 8px 16px; border-radius: 999px;
    cursor: pointer; font-family: inherit; font-size: .93rem; color: var(--ink); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .qz { max-width: 740px; margin: 0 auto; }
  .scorebar { position: sticky; top: 0; z-index: 5; background: var(--soft); border: 1px solid var(--border);
    border-radius: 12px; padding: 9px 14px; margin-bottom: 16px; display: flex; justify-content: space-between; }
  .scorebar b { color: var(--accent); }
  .rtitle { font-size: 1.15rem; color: var(--accent); margin: 4px 0 2px; }
  .rdesc { color: var(--muted); font-style: italic; margin: 0 0 16px; font-size: .95rem; }
  .q { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
  .qnum { color: var(--accent); font-weight: bold; font-size: .82rem; letter-spacing: .04em; text-transform: uppercase; }
  .qtext { font-size: 1.05rem; margin: 6px 0 14px; }
  .opt { display: block; width: 100%; text-align: left; background: var(--optbg); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 14px; margin-bottom: 9px; cursor: pointer; font-family: inherit; font-size: 1rem; color: var(--ink); }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--soft); }
  .opt:disabled { cursor: default; }
  .opt.ok { background: var(--okbg); border-color: var(--ok); color: var(--ok); font-weight: bold; }
  .opt.bad { background: var(--badbg); border-color: var(--bad); color: var(--bad); }
  .mark { float: right; font-weight: bold; }
  .explain { padding: 11px 14px; border-radius: 10px; background: var(--soft); border-left: 3px solid var(--accent); font-size: .95rem; }
  .explain b { color: var(--accent); }
  .explain .src { display: block; margin-top: 6px; color: var(--muted); font-size: .85rem; font-style: italic; }
  .final { background: var(--card); border: 2px solid var(--accent); border-radius: 14px; padding: 22px; text-align: center; }
  .final h3 { color: var(--accent); margin: 0 0 6px; }
  .final .pct { font-size: 2.3rem; font-weight: bold; color: var(--accent); }
  .btn { background: var(--accent); color: #fff; border: none; padding: 9px 20px; border-radius: 999px; cursor: pointer;
    font-family: inherit; font-size: .93rem; margin: 8px 4px 0; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .rlabel { font-weight: bold; color: var(--accent); margin-top: 12px; text-align: left; font-size: .95rem; }
  textarea.res { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; background: var(--optbg);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-top: 6px; color: var(--ink); line-height: 1.4; }
  .hint { color: var(--muted); font-size: .85rem; font-style: italic; margin-top: 8px; }
  .mmroot { text-align: center; margin: 4px auto 18px; background: var(--accent); color: #fff; border-radius: 999px;
    padding: 14px 20px; font-size: 1.1rem; font-weight: bold; max-width: 520px; }
  .mmtools { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-bottom: 10px; }
  .mmtools .btn { padding: 6px 14px; font-size: .85rem; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--mmw, 280px)), 1fr)); gap: 14px; }
  .branch { background: var(--card); border: 1px solid var(--border); border-top: 5px solid var(--bc); border-radius: 14px; padding: 12px 16px; }
  .branch.wide { grid-column: 1 / -1; }
  .bhead { color: var(--bc); font-weight: bold; font-size: 1.02rem; margin: 0 0 10px; }
  .node { background: var(--optbg); border-left: 3px solid var(--bc); border-radius: 8px; margin: 0 0 8px; }
  .node .nt { padding: 8px 12px; font-weight: bold; font-size: .95rem; cursor: pointer; }
  .node .nt.plain { cursor: default; }
  .node .mk { color: var(--bc); display: inline-block; width: 16px; }
  .node .nd { padding: 0 12px 10px 28px; font-size: .92rem; }
  .tscroll { overflow-x: auto; margin-top: 10px; }
  table.ct { border-collapse: collapse; width: 100%; font-size: .88rem; }
  table.ct th, table.ct td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
  table.ct th { background: var(--soft); }
  .muted { color: var(--muted); font-style: italic; text-align: center; }
  .sintro { max-width: 820px; margin: 0 auto 14px; color: var(--muted); font-size: .95rem; text-align: center; }
  .figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--figw, 250px)), 1fr)); gap: 12px; margin-top: 12px; }
  figure.fig { margin: 0; background: var(--optbg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; cursor: zoom-in; }
  figure.fig:hover { border-color: var(--accent); }
  .zoom { position: fixed; inset: 0; z-index: 50; background: rgba(44,42,38,.78); display: none; align-items: center; justify-content: center; padding: 2vh 2vw; cursor: zoom-out; }
  .zoom.on { display: flex; }
  .zbox { background: var(--card); border-radius: 14px; padding: 14px 18px; width: min(96vw, 1100px); max-height: 96vh; overflow: auto; }
  .zbox svg { width: 100%; height: auto; max-height: 78vh; display: block; }
  .zbox .zcap { color: var(--muted); font-size: .95rem; margin-top: 6px; }
  .zbox .zcap b { color: var(--ink); }
  .zbox .zclose { float: right; color: var(--muted); font-size: .85rem; }
  figure.fig svg { width: 100%; height: auto; display: block; }
  figure.fig figcaption { font-size: .95rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  figure.fig figcaption b { color: var(--ink); display: block; }
  @media (max-width: 560px) { .toc ol { columns: 1; } .book h1 { font-size: 1.7rem; } .wrap { padding: 12px 6px 60px; } }
</style>
</head>

<div class="wrap" id="app"></div>
<div class="zoom" id="zoom" data-act="unzoom"></div>
<script>
var D = {"curs": "Ortezare \u0219i protezare", "sursa": "Ghid practic de ortezare \u00b7 Ghid practic de protezare \u0219i reabilitare func\u021bional\u0103 \u00b7 recapitulare \u0219i quiz-uri", "eticheta": "Partea", "lista": [{"nr": 1, "titlu": "Ghid practic de ortezare"}, {"nr": 2, "titlu": "Ghid practic de protezare \u0219i reabilitare func\u021bional\u0103"}], "capitole": [{"nr": 1, "titlu": "Ghid practic de ortezare", "harta": {"centru": "Ortezarea: rol, mecanic\u0103, materiale \u0219i aplica\u021bii", "ramuri": [{"titlu": "Ce este o ortez\u0103 \u0219i la ce folose\u0219te", "noduri": [{"t": "Ortez\u0103 vs protez\u0103", "d": "Proteza \u00eenlocuie\u0219te o parte a corpului care lipse\u0219te (un picior sau un bra\u021b amputat). Orteza se a\u0219az\u0103 peste o parte care exist\u0103, dar e sl\u0103bit\u0103, r\u0103nit\u0103, deformat\u0103 sau dureroas\u0103: e un suport extern care \u00eembrac\u0103 bra\u021bul, piciorul sau spatele \u0219i \u00eel ajut\u0103 s\u0103-\u0219i fac\u0103 treaba mai u\u0219or \u0219i f\u0103r\u0103 suferin\u021b\u0103. Defini\u021bia medical\u0103: orice aparat aplicat pe exteriorul corpului pentru a \u00eembun\u0103t\u0103\u021bi func\u021bionarea oaselor, mu\u0219chilor \u0219i articula\u021biilor. Fa\u0219a elastic\u0103, atela, corsetul \u0219i genunchiera sunt, toate, orteze."}, {"t": "Analogia ochelarilor", "d": "Ochelarii nu schimb\u0103 ochiul, ci focalizeaz\u0103 lumina; la fel, orteza nu schimb\u0103 for\u021bat corpul, ci ghideaz\u0103 for\u021bele \u0219i mi\u0219c\u0103rile, ca omul s\u0103 poat\u0103 merge, prinde o can\u0103 sau sta drept f\u0103r\u0103 durere. Istoric: \u00een antichitate se foloseau be\u021be legate cu scoar\u021b\u0103 sau piele de animal ca s\u0103 \u021bin\u0103 drept un os rupt; azi ortezele se fac din materiale foarte u\u0219oare, termoplastice modelabile \u00een ap\u0103 cald\u0103 sau fibr\u0103 de carbon. Oric\u00e2t de simpl\u0103 ar fi, o ortez\u0103 urm\u0103re\u0219te cel pu\u021bin una dintre cele patru misiuni de mai jos."}, {"t": "Misiunea 1: odihn\u0103 \u0219i protec\u021bie", "d": "\u00cen entorsa de glezn\u0103 ligamentele se \u00eentind sau se rup par\u021bial; zona se umfl\u0103, se \u00eenro\u0219e\u0219te \u0219i doare la fiecare pas. Dac\u0103 omul ar merge ca \u00eenainte, ligamentele s-ar rupe mai mult \u0219i nu s-ar vindeca bine. Orteza de imobilizare \u021bine glezna blocat\u0103 \u00eentr-o pozi\u021bie sigur\u0103, ca o armur\u0103, iar \u021besuturile au lini\u0219tea necesar\u0103 s\u0103 se refac\u0103 f\u0103r\u0103 cicatrice dureroase."}, {"t": "Misiunea 2: corectare \u0219i \u00eendreptare", "d": "Exemplul tipic: scolioza la copii \u0219i adolescen\u021bi, coloana curbat\u0103 lateral ca un S. C\u00e2t timp copilul cre\u0219te, oasele sunt moi \u0219i maleabile; l\u0103sat\u0103 liber\u0103, curbura se poate agrava p\u00e2n\u0103 apas\u0103 pe pl\u0103m\u00e2ni \u0219i inim\u0103. Corsetul rigid \u00eempinge bl\u00e2nd, dar ferm, curbura din lateral \u0219i ghideaz\u0103 cre\u0219terea oaselor \u00een direc\u021bia corect\u0103 \u2014 ca aracul de care gr\u0103dinarul leag\u0103 un cop\u0103cel t\u00e2n\u0103r."}, {"t": "Misiunea 3: asistarea mi\u0219c\u0103rii", "d": "C\u00e2nd nervul care ridic\u0103 laba piciorului e paralizat apare \u201epiciorul c\u0103zut\u201d: la fiecare pas v\u00e2rful pantofului at\u00e2rn\u0103, se aga\u021b\u0103 de covoare \u0219i borduri, iar omul poate c\u0103dea. O ortez\u0103 dinamic\u0103, cu lam\u0103 elastic\u0103 sau arc, lucreaz\u0103 ca un mu\u0219chi artificial exterior: de fiecare dat\u0103 c\u00e2nd piciorul se ridic\u0103 de pe sol, trage automat v\u00e2rful \u00een sus, iar omul p\u0103\u0219e\u0219te drept, f\u0103r\u0103 teama de c\u0103dere."}, {"t": "Misiunea 4: desc\u0103rcarea greut\u0103\u021bii", "d": "\u00cen artroza de genunchi cartilajul \u2014 garnitura dintre oase \u2014 se toce\u0219te, cel mai des pe partea interioar\u0103, iar la fiecare pas oasele se freac\u0103 os pe os. Orteza de desc\u0103rcare lucreaz\u0103 ca o mic\u0103 macara: preia for\u021ba greut\u0103\u021bii corporale \u0219i o transfer\u0103 pe partea s\u0103n\u0103toas\u0103 a genunchiului. C\u00e2nd presiunea dispare de pe zona uzat\u0103, durerea scade, iar omul poate merge din nou la plimbare sau la pia\u021b\u0103."}]}, {"titlu": "Mecanica ortezei", "noduri": [{"t": "Regula celor trei puncte", "d": "Ca la \u00eendreptarea unei crengi curbate: m\u00e2inile la capete, degetul mare pe mijlocul curburii, \u00eemping\u00e2nd \u00een sens opus. For\u021ba principal\u0103 de corec\u021bie se pune pe v\u00e2rful curburii, adic\u0103 pe articula\u021bia care vrea s\u0103 se \u00eendoaie gre\u0219it (dac\u0103 genunchiul fuge spre interior, orteza apas\u0103 dinspre interior spre exterior). Singur\u0103, ar deplasa tot membrul lateral, ca un b\u0103\u021b \u00eempins pe ap\u0103; de aceea mai trebuie dou\u0103 puncte de sprijin, unul deasupra (pe coaps\u0103) \u0219i unul dedesubt (pe gamb\u0103), care ac\u021bioneaz\u0103 din partea opus\u0103. C\u00e2nd cele trei for\u021be sunt echilibrate, articula\u021bia r\u0103m\u00e2ne stabil\u0103 \u0219i dreapt\u0103."}, {"t": "Regula p\u00e2rghiei lungi", "d": "Ca la piuli\u021ba ruginit\u0103: cu o cheie scurt\u0103 tragi tare \u0219i te dor palmele, cu una lung\u0103 o desfaci cu dou\u0103 degete. Cu c\u00e2t orteza e mai lung\u0103 \u0219i \u00eembrac\u0103 o por\u021biune mai mare din membru, cu at\u00e2t for\u021bele necesare ca s\u0103-l \u021bin\u0103 drept sunt mai mici \u0219i mai bl\u00e2nde. O ortez\u0103 prea scurt\u0103 trebuie s\u0103 str\u00e2ng\u0103 ca o menghin\u0103 ca s\u0103 aib\u0103 efect \u0219i provoac\u0103 v\u00e2n\u0103t\u0103i \u0219i dureri; una bine proiectat\u0103 e lung\u0103 \u0219i distribuie efortul pe o suprafa\u021b\u0103 mare, \u00eenc\u00e2t abia o sim\u021bi."}, {"t": "Presiunea capilar\u0103 \u0219i escara", "d": "Sub piele curg capilare cu presiune foarte mic\u0103 \u2014 ghidul o compar\u0103 cu o coloan\u0103 de ap\u0103 de numai 30 mm. Dac\u0103 orteza apas\u0103 mai tare dec\u00e2t curge s\u00e2ngele \u00een capilare, vasele se turtesc, ca furtunul de gr\u0103din\u0103 c\u0103lcat cu c\u0103lc\u00e2iul. Celulele pielii nu mai primesc oxigen; dac\u0103 ap\u0103sarea continu\u0103 peste dou\u0103 ore f\u0103r\u0103 pauz\u0103, pielea moare \u00een profunzime \u0219i apare escara (ulcerul de presiune), o ran\u0103 grav\u0103 \u0219i dureroas\u0103."}, {"t": "Presiune vs suprafa\u021b\u0103", "d": "Legea pe care ortezistul o respect\u0103: presiunea scade c\u00e2nd suprafa\u021ba cre\u0219te. V\u00e2rful unui cui ap\u0103sat pe m\u00e2n\u0103 doare \u0219i te face s\u0103 s\u00e2ngerezi; palma deschis\u0103, cu aceea\u0219i for\u021b\u0103, abia se simte. De aceea o ortez\u0103 bun\u0103 nu are muchii t\u0103ioase, nu apas\u0103 \u00eentr-un singur punct \u0219i se muleaz\u0103 ca o m\u0103nu\u0219\u0103 pe relieful corpului."}, {"t": "Zone tolerante vs zone sensibile", "d": "Zonele acoperite de mu\u0219chi \u0219i gr\u0103sime \u2014 pulpa gambei, coapsa, bra\u021bul \u2014 tolereaz\u0103 presiunea, absorb \u0219ocurile \u0219i pot primi sprijinul ortezei. Proeminen\u021bele osoase cu piele sub\u021bire \u201eca o foi\u021b\u0103 de ceap\u0103\u201d \u2014 creasta tibiei (fluierul piciorului), maleolele, rotula, osul mic \u0219i ascu\u021bit de la \u00eencheietura m\u00e2inii \u2014 nu se str\u00e2ng niciodat\u0103: \u00een dreptul lor plasticul se bombeaz\u0103 spre exterior ca o cupol\u0103 protectoare, l\u0103s\u00e2nd osul liber."}]}, {"titlu": "Materialele ortezelor", "noduri": [{"t": "Termoplastice de joas\u0103 temperatur\u0103", "d": "Foi rigide la temperatura camerei care, dup\u0103 un minut \u00eentr-o baie de ap\u0103 la 65 \u00b0C, devin moi \u0219i elastice ca plastilina. Terapeutul le tamponeaz\u0103 pe un prosop \u0219i le muleaz\u0103 direct pe m\u00e2na sau degetele pacientului \u2014 plasticul e c\u0103ldu\u021b, f\u0103r\u0103 risc de arsur\u0103 \u2014 urm\u0103rind fiecare cut\u0103; \u00een c\u00e2teva minute, la aer, se \u00eent\u0103resc \u0219i p\u0103streaz\u0103 forma exact\u0103. Marele avantaj e memoria: dac\u0103 dup\u0103 dou\u0103 s\u0103pt\u0103m\u00e2ni m\u00e2na s-a desumflat \u0219i atela a r\u0103mas larg\u0103, foaia se pune din nou \u00een ap\u0103 cald\u0103, revine la forma ini\u021bial\u0103 \u0219i se remuleaz\u0103, f\u0103r\u0103 un aparat nou."}, {"t": "Polipropilena (\u0219i polietilena)", "d": "Plastic tehnic foarte durabil, pentru ortezele unui adult de 80\u201390 kg care merge pe picioarele lui, unde termoplasticul de m\u00e2n\u0103 nu face fa\u021b\u0103. Se \u00eenc\u0103lze\u0219te \u00een cuptoare speciale la aproape 200 \u00b0C \u0219i se muleaz\u0103 prin vidare peste un model din gips al membrului. Se poate \u00eendoi de sute de mii de ori f\u0103r\u0103 s\u0103 se rup\u0103 \u2014 de aceea e materialul ideal pentru ortezele de glezn\u0103 \u0219i corsetele de spate."}, {"t": "Fibra de carbon", "d": "Fire foarte sub\u021biri de carbon pur, \u00eempletite ca o p\u00e2nz\u0103 \u0219i lipite cu r\u0103\u0219ini \u2014 acela\u0219i material din care se fac avioane \u0219i monoposturi de Formula 1. O ortez\u0103 din carbon e sub\u021bire c\u00e2t o moned\u0103, c\u00e2nt\u0103re\u0219te sub 200 g \u0219i \u00eencape \u00een orice pantof de strad\u0103. Calitatea principal\u0103 e elasticitatea dinamic\u0103: la contactul cu c\u0103lc\u00e2iul lama se \u00eendoaie \u0219i acumuleaz\u0103 energie ca o trambulin\u0103, iar la desprinderea v\u00e2rfului revine brusc \u0219i \u201earunc\u0103\u201d piciorul \u00eenainte. Purt\u0103torii descriu senza\u021bia unui arc nev\u0103zut la c\u0103lc\u00e2i; mersul devine mult mai pu\u021bin obositor."}, {"t": "Plastazote \u0219i benzile Velcro", "d": "Interiorul ortezelor e c\u0103ptu\u0219it cu spume cu celule \u00eenchise; cea mai cunoscut\u0103 e Plastazote: hipoalergenic\u0103, nu re\u021bine transpira\u021bia, nu miroase \u0219i, sub c\u0103ldura \u0219i greutatea corpului, se turte\u0219te discret exact unde ape\u0219i mai tare, cre\u00e2ndu-\u0219i singur\u0103 amprenta anatomic\u0103. E materialul de elec\u021bie pentru diabetici, cu pielea fragil\u0103 \u0219i predispus\u0103 la r\u0103ni. Orteza se fixeaz\u0103 cu benzi de scai (Velcro), u\u0219or de str\u00e2ns \u0219i de descheiat chiar de o persoan\u0103 v\u00e2rstnic\u0103 cu degetele amor\u021bite sau sl\u0103bite."}]}, {"titlu": "Membrul superior: de la degete la um\u0103r", "noduri": [{"t": "M\u00e2na trebuie s\u0103 r\u0103m\u00e2n\u0103 func\u021bional\u0103", "d": "M\u00e2na scrie, g\u0103te\u0219te, c\u00e2nt\u0103 la pian \u0219i simte atingerea; orteza trebuie s\u0103 rezolve durerea f\u0103r\u0103 s\u0103 o transforme \u00eentr-un \u201ebu\u0219tean\u201d inutil. O ortez\u0103 de m\u00e2n\u0103 bine f\u0103cut\u0103 las\u0103 degetele libere s\u0103 se mi\u0219te, dac\u0103 boala o permite, \u0219i nu acoper\u0103 niciodat\u0103 buricele degetelor, ca omul s\u0103-\u0219i p\u0103streze sim\u021bul tactil."}, {"t": "Tunelul carpian: orteza de noapte", "d": "La \u00eencheietur\u0103, pe fa\u021ba palmei, un tunel \u00eengust din oase \u0219i un ligament gros con\u021bine nou\u0103 tendoane flexoare \u0219i nervul median. Munca la birou, sp\u0103latul manual \u0219i mi\u0219c\u0103rile repetitive inflameaz\u0103 tendoanele, dar tunelul nu se poate l\u0103rgi, iar nervul e strivit. Semnul tipic: trezirea noaptea cu degetele amor\u021bite, \u201e\u00een\u021bepate de ace\u201d, \u0219i nevoia de a scutura m\u00e2na. \u00cen somn pumnul se flecteaz\u0103 incon\u0219tient, iar presiunea din tunel cre\u0219te de opt ori. Orteza de repaus \u021bine \u00eencheietura dreapt\u0103 (pozi\u021bie neutr\u0103), unde presiunea e minim\u0103; se poart\u0103 doar noaptea, amor\u021belile dispar \u0219i mul\u021bi pacien\u021bi scap\u0103 de opera\u021bie."}, {"t": "Rizartroza: atela Spica", "d": "Degetul mare (policele) asigur\u0103 jum\u0103tate din utilitatea m\u00e2inii, pentru c\u0103 se rote\u0219te \u0219i atinge toate celelalte degete: cheia \u00een u\u0219\u0103, pixul, borcanul. Rizartroza e uzura articula\u021biei de la baza lui, iar orice prindere devine un chin. Atela Spica \u00eembrac\u0103 doar degetul mare \u0219i \u00eencheietura, l\u0103s\u00e2nd celelalte patru degete complet libere; stabilizeaz\u0103 articula\u021bia uzat\u0103, elimin\u0103 frecarea dureroas\u0103 \u0219i red\u0103 puterea de a str\u00e2nge m\u00e2na."}, {"t": "Tenosinovita De Quervain", "d": "Tendoanele care ridic\u0103 degetul mare se freac\u0103 de teaca lor \u0219i se inflameaz\u0103. Apare foarte des la tinerele mame care \u00ee\u0219i ridic\u0103 bebelu\u0219ul \u00een bra\u021be \u0219i la cei care tasteaz\u0103 mult pe telefon. O atel\u0103 u\u0219oar\u0103 \u021bine degetul mare nemi\u0219cat 10\u201314 zile, c\u00e2t inflama\u021bia s\u0103 se sting\u0103 complet, f\u0103r\u0103 injec\u021bii."}, {"t": "Paralizia de nerv radial", "d": "Dup\u0103 o fractur\u0103 de bra\u021b sau dup\u0103 somnul ad\u00e2nc cu bra\u021bul at\u00e2rnat peste sp\u0103tarul unui scaun, nervul radial lezat las\u0103 \u201em\u00e2na c\u0103zut\u0103\u201d: pumnul at\u00e2rn\u0103 ca un g\u00e2t de leb\u0103d\u0103, iar nici pumnul, nici degetele nu se mai ridic\u0103. De\u0219i flexorii sunt s\u0103n\u0103to\u0219i, f\u0103r\u0103 extensia pumnului omul nu poate prinde nici o sticl\u0103 cu ap\u0103. Orteza dinamic\u0103: o carcas\u0103 u\u0219oar\u0103 pe antebra\u021b, din care pornesc bra\u021be sub\u021biri cu inele de piele pentru fiecare deget, sus\u021binute de elastice sau arcuri. Elasticele deschid automat m\u00e2na, iar mu\u0219chii proprii o \u00eenchid \u00eenving\u00e2nd elasticul; pacientul m\u0103n\u00e2nc\u0103, se \u00eembrac\u0103 \u0219i scrie din prima zi, c\u00e2t a\u0219teapt\u0103 regenerarea nervului."}, {"t": "Epicondilita: banda de contrapresiune", "d": "\u201eCotul tenismenului\u201d sau \u201ebra\u021bul instalatorului\u201d: de\u0219i numele duce cu g\u00e2ndul la sportivi, 90% dintre cei afecta\u021bi sunt oameni care au vopsit un tavan, au str\u00e2ns \u0219uruburi sau au lucrat intens cu mouse-ul. Tendoanele de la cot sunt suprasolicitate \u0219i dor la orice str\u00e2ngere de m\u00e2n\u0103. Tratamentul clasic e banda de contrapresiune: o curelu\u0219\u0103 cu pern\u0103 de silicon str\u00e2ns\u0103 pe antebra\u021b, la dou\u0103 degete sub cot. Ea func\u021bioneaz\u0103 ca o punte \u2014 absoarbe \u0219ocul mi\u0219c\u0103rii \u00eenainte ca for\u021ba s\u0103 ajung\u0103 la tendon \u2014, iar tendonul se vindec\u0103 chiar dac\u0103 omul continu\u0103 s\u0103 munceasc\u0103."}, {"t": "Um\u0103rul: orteza cu pern\u0103 de abduc\u021bie", "d": "Um\u0103rul e at\u00e2t de mobil \u00eenc\u00e2t capul humeral seam\u0103n\u0103 cu o minge de golf pe o farfuriu\u021b\u0103 plat\u0103, \u021binut doar de c\u00e2teva tendoane delicate \u2014 coafa rotatorilor. Dup\u0103 o c\u0103dere sau dup\u0103 ce chirurgul a cusut o ruptur\u0103 a coafei, bra\u021bul nu trebuie l\u0103sat s\u0103 at\u00e2rne lipit de corp, pentru c\u0103 greutatea lui ar rupe cus\u0103tura. Orteza modern\u0103 are o pern\u0103 mare de spum\u0103 pe care bra\u021bul se sprijin\u0103 la 30\u201345\u00b0 \u00een lateral: tendoanele sunt relaxate, s\u00e2ngele circul\u0103 din abunden\u021b\u0103, iar vindecarea vine cu mai pu\u021bine dureri."}]}, {"titlu": "Membrul inferior: pas, talp\u0103, glezn\u0103, genunchi", "noduri": [{"t": "Cele trei rul\u0103ri ale pasului", "d": "Pasul corect are trei rul\u0103ri succesive: 1) c\u0103lc\u00e2iul atinge solul \u0219i amortizeaz\u0103 impactul; 2) talpa se a\u0219az\u0103 plan, iar tibia trece lin peste glezn\u0103 \u0219i duce corpul \u00eenainte; 3) c\u0103lc\u00e2iul se ridic\u0103, iar degetele \u00eemping solul \u0219i propulseaz\u0103 corpul \u00een pasul urm\u0103tor. La o glezn\u0103 instabil\u0103 sau paralizat\u0103 succesiunea se rupe: omul \u0219chiop\u0103teaz\u0103, \u00ee\u0219i arunc\u0103 piciorul lateral, \u00ee\u0219i r\u0103suce\u0219te spatele \u0219i obose\u0219te dup\u0103 o sut\u0103 de metri. Ortezele de membru inferior refac aceast\u0103 mecanic\u0103 lin\u0103 \u0219i protejeaz\u0103 articula\u021biile de uzura prematur\u0103."}, {"t": "Sus\u021bin\u0103tor rigid \u00een platfus", "d": "Sus\u021bin\u0103torul plantar medical nu e o pernu\u021b\u0103 de magazin: se modeleaz\u0103 pe amprenta t\u0103lpii \u0219i rezolv\u0103 dou\u0103 categorii de probleme \u2014 deform\u0103rile flexibile \u0219i protec\u021bia t\u0103lpilor sensibile. \u00cen piciorul plat (platfus) bolta s-a pr\u0103bu\u0219it spre interior, c\u0103lc\u00e2iul fuge lateral, iar genunchii se apropie \u00een X. Un sus\u021bin\u0103tor rigid ridic\u0103 bolta \u0219i \u021bine c\u0103lc\u00e2iul drept \u201eca o potcoav\u0103\u201d, realiniind tot corpul, de jos p\u00e2n\u0103 la coloana vertebral\u0103."}, {"t": "Bran\u021b moale pentru diabetic", "d": "La pacientul diabetic cu picioarele amor\u021bite, care nu simte durerea, bran\u021bul e f\u0103cut din straturi moi de spum\u0103 \u0219i gel. Rolul lui nu e corec\u021bia, ci protec\u021bia: preia presiunea de pe oasele ascu\u021bite ale t\u0103lpii \u0219i previne r\u0103nile, care la diabetic s-ar putea infecta."}, {"t": "AFO rigid (gheata fix\u0103)", "d": "AFO (Ankle-Foot Orthosis, ortez\u0103 glezn\u0103-picior) \u00eembrac\u0103 talpa \u0219i urc\u0103 pe spatele gambei p\u00e2n\u0103 aproape de genunchi; exist\u0103 \u00een trei variante. AFO rigid e o carcas\u0103 din plastic dur \u0219i gros care blocheaz\u0103 orice mi\u0219care a gleznei, cu piciorul fixat la 90\u00b0. E de ne\u00eenlocuit dup\u0103 un AVC sever, cu mu\u0219chii gambei spastici care trag laba piciorului \u00een jos \u0219i spre interior, ca un v\u00e2rf de balerin\u0103 (atitudine equin-var): gheata for\u021beaz\u0103 c\u0103lc\u00e2iul s\u0103 stea pe sol \u0219i \u00eempiedic\u0103 str\u00e2mbarea piciorului la fiecare pas."}, {"t": "AFO articulat (cu balamale)", "d": "\u00cen dreptul gleznei are dou\u0103 balamale mecanice mici. Balamaua nu las\u0103 piciorul s\u0103 cad\u0103 \u00een jos c\u00e2nd e ridicat de pe sol \u2014 omul nu se mai \u00eempiedic\u0103 de covoare \u2014, dar \u00eei permite gleznei s\u0103 se \u00eendoaie liber \u00eenainte c\u00e2nd calc\u0103 pe ea. Mersul e mult mai natural \u0219i mai fluid dec\u00e2t cu gheata rigid\u0103."}, {"t": "Orteza de reac\u021bie la sol (FRO)", "d": "Are o plac\u0103 rigid\u0103 pe fa\u021ba anterioar\u0103 a tibiei (pe \u201efluierul piciorului\u201d). E conceput\u0103 pentru cei ai c\u0103ror genunchi se \u00eendoaie \u0219i se pr\u0103bu\u0219esc la fiecare pas din cauza sl\u0103biciunii mu\u0219chilor coapsei \u2014 de pild\u0103 copiii cu paralizie cerebral\u0103 care merg ghemuit. C\u00e2nd pacientul calc\u0103 pe talp\u0103, for\u021ba solului apas\u0103 pe placa din fa\u021ba tibiei \u0219i \u00eempinge genunchiul \u00eenapoi \u00een extensie, \u021bin\u00e2ndu-l drept."}, {"t": "KAFO clasic vs Stance-Control", "d": "KAFO (Knee-Ankle-Foot Orthosis) e orteza lung\u0103, pe tot piciorul, pentru sl\u0103biciunea care cuprinde genunchiul \u0219i glezna. Varianta veche avea inele de fier care blocau genunchiul drept ca o sc\u00e2ndur\u0103: omul st\u0103tea \u00een picioare, dar ca s\u0103 mearg\u0103 \u00ee\u0219i arunca piciorul lateral \u00eentr-un cerc larg (mers cosit), ceea ce distrugea \u0219oldul \u0219i spatele \u00een c\u00e2\u021biva ani. Ortezele Stance-Control au la genunchi un microprocesor sau un mecanism hidraulic: c\u00e2nd greutatea apas\u0103 pe picior, blocheaz\u0103 genunchiul \u00eentr-o frac\u021biune de secund\u0103; c\u00e2nd c\u0103lc\u00e2iul se ridic\u0103, \u00eel deblocheaz\u0103 \u0219i-l las\u0103 s\u0103 se \u00eendoaie p\u00e2n\u0103 la 60\u00b0, ca un genunchi s\u0103n\u0103tos. Mersul e drept, cu un consum de energie de dou\u0103 ori mai mic."}]}, {"titlu": "Corsete \u0219i gulere cervicale", "tabel": {"cap": ["Dispozitiv", "C\u00e2t limiteaz\u0103", "C\u00e2nd se folose\u0219te"], "randuri": [["Guler moale (burete)", "10\u201315% din mi\u0219c\u0103ri", "febr\u0103 muscular\u0103, r\u0103ceal\u0103 la ceaf\u0103"], ["Guler rigid Philadelphia", "circa 70% din mi\u0219c\u0103ri", "fractur\u0103 de vertebr\u0103 cervical\u0103"], ["Halo-Vest", "imobilizare absolut\u0103", "vertebr\u0103 de la baza craniului zdrobit\u0103"]]}, "noduri": [{"t": "Cilindrul hidraulic abdominal", "d": "Coloana are 33 de vertebre separate prin discuri \u0219i str\u0103b\u0103tute de m\u0103duva spin\u0103rii. Cum descarc\u0103 un corset coloana str\u00e2ng\u00e2nd pe abdomen? Organele abdominale con\u021bin mai ales ap\u0103, iar apa nu se comprim\u0103. Corsetul str\u00e2ns comprim\u0103 peretele abdominal \u0219i face din abdomen un st\u00e2lp rigid, presurizat, care preia aproape o treime din greutatea trunchiului \u0219i a capului \u0219i o transmite direct pe oasele bazinului. Discurile \u0219i vertebrele lombare sunt desc\u0103rcate cu circa 30% \u2014 de aceea pacien\u021bii cu hernii de disc sau tas\u0103ri vertebrale simt u\u0219urare imediat\u0103."}, {"t": "Gulerul cervical moale", "d": "G\u00e2tul e partea cea mai mobil\u0103, dar \u0219i cea mai fragil\u0103 a coloanei. Gulerele moi, din burete alb, de la farmacie, opresc doar 10\u201315% din mi\u0219c\u0103ri: func\u021bioneaz\u0103 mai degrab\u0103 ca un fular c\u0103lduros, care \u021bine mu\u0219chii calzi \u0219i relaxa\u021bi \u0219i \u00eei aminte\u0219te omului s\u0103 nu fac\u0103 mi\u0219c\u0103ri bru\u0219te dup\u0103 o febr\u0103 muscular\u0103 sau o r\u0103ceal\u0103 la ceaf\u0103. La o fractur\u0103 de vertebr\u0103 cervical\u0103 buretele moale e inutil \u0219i periculos."}, {"t": "Gulerul Philadelphia \u0219i Halo-Vest", "d": "Dup\u0103 un accident de ma\u0219in\u0103 sau o c\u0103dere grav\u0103, cu fractur\u0103 de vertebr\u0103 cervical\u0103, se folosesc gulere rigide din dou\u0103 piese, ca gulerul Philadelphia, sprijinite ferm pe b\u0103rbie, piept \u0219i ceaf\u0103; ele blocheaz\u0103 circa 70% din mi\u0219c\u0103ri \u0219i protejeaz\u0103 m\u0103duva de sec\u021bionare. \u00cen cazurile extreme, c\u00e2nd o vertebr\u0103 de la baza craniului e zdrobit\u0103, se folose\u0219te Halo-Vest: un inel prins direct de craniu, legat prin tije de o vest\u0103 toracic\u0103, care garanteaz\u0103 imobilizarea absolut\u0103 p\u00e2n\u0103 la sudarea osului."}, {"t": "Corsetul Jewett (hiperextensie)", "d": "\u00cen osteoporoz\u0103 oasele devin poroase \u0219i fragile ca un fagure uscat; o tuse puternic\u0103 sau o saco\u0219\u0103 ridicat\u0103 poate tasa o vertebr\u0103 lombar\u0103: partea ei din fa\u021b\u0103 se turte\u0219te ca o cutie de carton c\u0103lcat\u0103, iar omul se \u00eencovoiaz\u0103 \u0219i nu se mai poate mi\u0219ca de durere. Corsetul cruciform Jewett are un cadru metalic u\u0219or cu trei perne \u2014 pe piept, pe pubis \u0219i una lat\u0103 pe mijlocul spatelui (o aplicare a regulii celor trei puncte, ca interpretare) \u2014 care \u021bin corpul \u00een hiperextensie. Partea anterioar\u0103 a vertebrelor tasate e deschis\u0103 \u0219i desc\u0103rcat\u0103; durerea dispare \u00een c\u00e2teva ore, iar v\u00e2rstnicul poate merge iar singur la baie sau la mas\u0103."}, {"t": "Corsetul Ch\u00eaneau pentru scolioz\u0103", "d": "Scolioza descoperit\u0103 la timp, la 11\u201313 ani, poate fi tratat\u0103 cu corset personalizat \u00een loc de bisturiu \u0219i tije metalice. Ch\u00eaneau, cel mai cunoscut corset pentru scolioz\u0103, e asimetric \u0219i modelat prin scanare 3D. Nu doar \u00eempinge coastele str\u00e2mbe, ci are decupate ferestre mari \u0219i goale pe partea opus\u0103: la respira\u021bia ad\u00e2nc\u0103, aerul umfl\u0103 toracele tocmai \u00een acele spa\u021bii \u0219i \u00eendreapt\u0103 coloana dinspre interior spre exterior, la fiecare respira\u021bie. (Titlul ghidului pomene\u0219te \u0219i corsetul Boston, f\u0103r\u0103 s\u0103-l descrie.)"}, {"t": "Purtarea corsetului de scolioz\u0103", "d": "Cere un sacrificiu mare de voin\u021b\u0103: corsetul se poart\u0103 20\u201323 de ore pe zi, inclusiv la \u0219coal\u0103 \u0219i \u00een somn, \u0219i se scoate doar pentru du\u0219 \u0219i pentru orele de kinetoterapie. Fiecare lun\u0103 de purtare disciplinat\u0103 e o b\u0103t\u0103lie c\u00e2\u0219tigat\u0103 \u00eempotriva diformit\u0103\u021bii. C\u00e2nd cre\u0219terea oaselor se \u00eencheie, corsetul se scoate definitiv, iar copilul r\u0103m\u00e2ne cu coloana dreapt\u0103, f\u0103r\u0103 opera\u021bie."}]}, {"titlu": "Ghidul practic: de la evaluare la \u00eengrijire", "noduri": [{"t": "Evaluarea clinic\u0103", "d": "O ortez\u0103 serioas\u0103 nu se cump\u0103r\u0103 de pe internet f\u0103r\u0103 recomandare medical\u0103. \u00cenainte de proiectare, medicul \u0219i terapeutul testeaz\u0103 trei lucruri: mobilitatea articula\u021biilor (orteza poate \u00eendrepta doar o articula\u021bie care se las\u0103 mi\u0219cat\u0103; una \u00een\u021bepenit\u0103 ca un bloc de ciment nu poate fi for\u021bat\u0103 f\u0103r\u0103 s\u0103 rup\u0103 pielea), puterea mu\u0219chilor \u0219i, cel mai important, sensibilitatea pielii. Pacientul care nu simte durerea din cauza unei boli a nervilor trebuie supravegheat de dou\u0103 ori mai atent."}, {"t": "Amprenta: gips sau scanare 3D", "d": "Clasic: peste membru sau trunchi se pune un ciorap sub\u021bire de bumbac, apoi fa\u0219e umede de gips; c\u00e2t gipsul se \u00eent\u0103re\u0219te, terapeutul \u021bine articula\u021biile \u00een pozi\u021bia ideal\u0103 de corec\u021bie. Dup\u0103 circa cinci minute mulajul se taie cu o foarfec\u0103 cu v\u00e2rf bont \u0219i se scoate ca o carapace. Modern: un scaner optic 3D cu laser, plimbat un minut \u00een jurul corpului f\u0103r\u0103 s\u0103-l ating\u0103, d\u0103 o copie digital\u0103 precis\u0103 la zecimi de milimetru. Pe calculator, ortezistul adaug\u0103 spa\u021bii libere peste oasele ascu\u021bite, iar o ma\u0219in\u0103 robotizat\u0103 sau o imprimant\u0103 3D fabric\u0103 orteza."}, {"t": "Acomodarea progresiv\u0103", "d": "Orteza nou\u0103 e ca o pereche de bocanci rigizi: purtat\u0103 toat\u0103 ziua din prima zi, las\u0103 r\u0103ni. Schema: zilele 1\u20132, doar 1\u20132 ore pe zi, \u00een cas\u0103, apoi scoatere obligatorie \u0219i inspec\u021bia pielii; zilele 3\u20134, 3\u20134 ore pe zi, dac\u0103 pielea a fost curat\u0103; zilele 5\u20136, 5\u20136 ore pe zi; din ziua a 7-a, purtarea complet\u0103 prescris\u0103 de medic (toat\u0103 ziua sau pe timpul nop\u021bii)."}, {"t": "Testul ro\u0219e\u021bii", "d": "La fiecare scoatere a ortezei pielea se prive\u0219te la lumin\u0103 bun\u0103. O urm\u0103 roz sau ro\u0219iatic\u0103 acolo unde orteza a ap\u0103sat ferm e normal\u0103 dac\u0103 dispare complet \u00een 20, cel mult 30 de minute: e eritemul fiziologic normal. Dac\u0103 ro\u0219ea\u021ba persist\u0103 peste 30 de minute, pielea e ro\u0219ie-violacee, fierbinte, \u00eent\u0103rit\u0103, dureroas\u0103 sau apare o flicten\u0103 (b\u0103\u0219ic\u0103 cu lichid), se preg\u0103te\u0219te o escar\u0103: orteza nu se mai pune, iar tehnicianul \u00eenc\u0103lze\u0219te plasticul cu un pistol cu aer cald \u0219i \u00eel evazeaz\u0103 c\u00e2\u021biva milimetri \u00een dreptul acelui punct."}, {"t": "Igiena ortezei", "d": "Sub ortez\u0103 se poart\u0103 mereu o \u0219oset\u0103 lung\u0103 din bumbac 100% curat sau un tricou f\u0103r\u0103 cus\u0103turi groase: bumbacul absoarbe transpira\u021bia \u0219i \u00eempiedic\u0103 frecarea direct\u0103 a plasticului de piele. Orteza se spal\u0103 s\u0103pt\u0103m\u00e2nal cu o lavet\u0103 umed\u0103 \u0219i s\u0103pun neutru, apoi se cl\u0103te\u0219te cu ap\u0103 c\u0103ldu\u021b\u0103; nu se las\u0103 pe caloriferul fierbinte \u0219i nu se usuc\u0103 cu aer cald, pentru c\u0103 plasticul se deformeaz\u0103 ireversibil. Lunar se verific\u0103 benzile de scai \u0219i balamalele: o balama care sc\u00e2r\u021b\u00e2ie sau se clatin\u0103 merge la atelier pentru lubrifiant \u0219i str\u00e2ngerea \u0219uruburilor."}]}]}, "sectiuni": [], "runde": [{"id": "1", "eticheta": "Runda 1 \u00b7 Baz\u0103", "titlu": "Runda 1 \u2014 Concepte de baz\u0103", "desc": "Teorie: roluri, deosebiri, indica\u021bii \u0219i principii, \u00een \u00eentreb\u0103ri directe.", "intrebari": [{"q": "Prin ce se deosebe\u0219te o ortez\u0103 de o protez\u0103?", "opts": ["\u00cenlocuie\u0219te un segment amputat, iar proteza sus\u021bine unul existent", "Se poart\u0103 doar temporar, iar proteza se implanteaz\u0103 chirurgical", "Corecteaz\u0103 doar deform\u0103ri osoase, iar proteza trateaz\u0103 durerea", "Se aplic\u0103 peste un segment existent, dar sl\u0103bit sau dureros"], "correct": 3, "explain": "Orteza \u00eembrac\u0103 o parte a corpului care exist\u0103, dar e sl\u0103bit\u0103, r\u0103nit\u0103, deformat\u0103 sau dureroas\u0103; proteza \u00eenlocuie\u0219te o parte care lipse\u0219te. Varianta care le inverseaz\u0103 rolurile e capcana clasic\u0103; nici durata purt\u0103rii, nici tipul de problem\u0103 nu sunt criteriul de deosebire.", "tag": "Ortez\u0103 vs protez\u0103"}, {"q": "Ce urm\u0103re\u0219te orteza de imobilizare \u00eentr-o entors\u0103 de glezn\u0103?", "opts": ["Mobilizeaz\u0103 glezna zilnic, ca ligamentele s\u0103 nu se retracte \u00een repaus", "\u021aine glezna fix\u0103, ca ligamentele s\u0103 se refac\u0103 f\u0103r\u0103 noi \u00eentinderi", "Ridic\u0103 v\u00e2rful piciorului la fiecare pas, ca un mu\u0219chi exterior", "Mut\u0103 greutatea pe marginea s\u0103n\u0103toas\u0103 a gleznei la fiecare pas"], "correct": 1, "explain": "Prima misiune a ortezei e odihna \u0219i protec\u021bia: glezna blocat\u0103 \u00eentr-o pozi\u021bie sigur\u0103 le d\u0103 ligamentelor \u00eentinse sau par\u021bial rupte lini\u0219tea necesar\u0103 s\u0103 se refac\u0103. Ridicarea v\u00e2rfului \u021bine de asistarea mi\u0219c\u0103rii (piciorul c\u0103zut), iar mutarea greut\u0103\u021bii de desc\u0103rcare (artroza de genunchi).", "tag": "Misiunea 1: odihn\u0103 \u0219i protec\u021bie"}, {"q": "De ce corsetul pentru scolioz\u0103 corecteaz\u0103 mai ales \u00een perioada de cre\u0219tere?", "opts": ["Oasele sunt \u00eenc\u0103 maleabile, iar cre\u0219terea lor poate fi ghidat\u0103", "Mu\u0219chii spatelui sunt \u00eenc\u0103 slabi \u0219i pot fi \u00eent\u0103ri\u021bi de presiunea corsetului", "Curbura e \u00eenc\u0103 mic\u0103 \u0219i nu apas\u0103 pe pl\u0103m\u00e2ni sau pe inim\u0103", "Discurile sunt mai elastice \u0219i preiau presiunea corsetului"], "correct": 0, "explain": "C\u00e2t timp copilul cre\u0219te, oasele sunt moi \u0219i maleabile, iar corsetul ghideaz\u0103 cre\u0219terea \u00een direc\u021bia corect\u0103, ca aracul unui cop\u0103cel. Faptul c\u0103 o curbur\u0103 netratat\u0103 poate ajunge s\u0103 apese pe pl\u0103m\u00e2ni \u0219i inim\u0103 e motivul pentru care se trateaz\u0103, nu mecanismul corec\u021biei.", "tag": "Misiunea 2: corectare \u0219i \u00eendreptare"}, {"q": "Pe ce se bazeaz\u0103 orteza dinamic\u0103 pentru piciorul c\u0103zut?", "opts": ["O carcas\u0103 rigid\u0103 blocheaz\u0103 glezna la 90\u00b0 pe tot parcursul pasului", "O plac\u0103 anterioar\u0103 \u00eempinge genunchiul \u00een extensie la sprijin", "Un element elastic ridic\u0103 v\u00e2rful c\u00e2nd piciorul p\u0103r\u0103se\u0219te solul", "O pern\u0103 moale preia presiunea de pe proeminen\u021bele t\u0103lpii"], "correct": 2, "explain": "La piciorul c\u0103zut, lama elastic\u0103 sau arcul lucreaz\u0103 ca un mu\u0219chi artificial exterior \u0219i trage v\u00e2rful \u00een sus la fiecare ridicare a piciorului. Carcasa rigid\u0103 e AFO-ul pentru spasticitate, placa anterioar\u0103 e orteza de reac\u021bie la sol, iar perna moale e bran\u021bul pentru diabetici.", "tag": "Misiunea 3: asistarea mi\u0219c\u0103rii"}, {"q": "Cum reduce durerea orteza de desc\u0103rcare din artroza de genunchi?", "opts": ["Blocheaz\u0103 genunchiul \u00een extensie, ca oasele s\u0103 nu se mai mi\u0219te", "Comprim\u0103 genunchiul, ca inflama\u021bia din articula\u021bie s\u0103 scad\u0103", "Ridic\u0103 rotula, ca s\u0103 elibereze cartilajul de sub ea", "Mut\u0103 for\u021ba greut\u0103\u021bii de pe zona uzat\u0103 pe partea s\u0103n\u0103toas\u0103"], "correct": 3, "explain": "Orteza de desc\u0103rcare func\u021bioneaz\u0103 ca o mic\u0103 macara: preia for\u021ba greut\u0103\u021bii \u0219i o transfer\u0103 pe partea s\u0103n\u0103toas\u0103 a genunchiului (de obicei cea exterioar\u0103, pentru c\u0103 uzura e mai des pe interior). Blocarea sau compresia nu ar opri frecarea os pe os din zona uzat\u0103.", "tag": "Misiunea 4: desc\u0103rcarea greut\u0103\u021bii"}, {"q": "\u00cen regula celor trei puncte, unde se aplic\u0103 for\u021ba principal\u0103 de corec\u021bie?", "opts": ["Pe v\u00e2rful curburii, adic\u0103 pe articula\u021bia care deviaz\u0103", "Pe cap\u0103tul de sus al membrului, deasupra deform\u0103rii", "Pe cap\u0103tul de jos al membrului, sub articula\u021bia care deviaz\u0103", "Pe partea concav\u0103 a curburii, \u00een sensul devia\u021biei"], "correct": 0, "explain": "For\u021ba principal\u0103 se pune chiar pe v\u00e2rful curburii, \u00eemping\u00e2nd \u00een sens opus devia\u021biei; cele dou\u0103 puncte de deasupra \u0219i de dedesubt sunt contrasprijinurile, care ac\u021bioneaz\u0103 din partea opus\u0103 \u0219i \u00eempiedic\u0103 deplasarea \u00eentregului membru. Ap\u0103sarea \u00een sensul devia\u021biei ar accentua-o.", "tag": "Regula celor trei puncte"}, {"q": "De ce o ortez\u0103 mai lung\u0103 poate corecta cu for\u021be mai mici?", "opts": ["Materialul mai lung e mai rigid \u0219i nu cedeaz\u0103 sub greutate", "Suprafa\u021ba mai mare cre\u0219te presiunea util\u0103 asupra pielii", "Mai multe articula\u021bii blocate \u00eempart deformarea \u00eentre ele", "Bra\u021bul de p\u00e2rghie mai lung reduce for\u021ba necesar\u0103 la capete"], "correct": 3, "explain": "E regula p\u00e2rghiei lungi, ca la cheia lung\u0103 care desface u\u0219or o piuli\u021b\u0103: cu c\u00e2t orteza \u00eembrac\u0103 o por\u021biune mai mare, cu at\u00e2t for\u021bele de la capete sunt mai mici. Suprafa\u021ba mai mare scade presiunea (nu o cre\u0219te) \u2014 e un avantaj \u00een plus, dar nu explica\u021bia p\u00e2rghiei.", "tag": "Regula p\u00e2rghiei lungi"}, {"q": "Ce combina\u021bie de factori duce la escar\u0103 sub o ortez\u0103?", "opts": ["O presiune sub cea capilar\u0103, men\u021binut\u0103 f\u0103r\u0103 pauz\u0103 pe toat\u0103 durata nop\u021bii", "Frecarea plasticului pe pielea transpirat\u0103 timp de o or\u0103", "O presiune peste cea capilar\u0103, men\u021binut\u0103 peste dou\u0103 ore f\u0103r\u0103 pauz\u0103", "O ro\u0219ea\u021b\u0103 care persist\u0103 c\u00e2teva minute dup\u0103 scoaterea ortezei"], "correct": 2, "explain": "Escara apare c\u00e2nd orteza apas\u0103 mai tare dec\u00e2t presiunea din capilare (care e foarte mic\u0103), vasele se turtesc, iar lipsa de oxigen dureaz\u0103 peste dou\u0103 ore. Sub presiunea capilar\u0103 s\u00e2ngele continu\u0103 s\u0103 curg\u0103; o ro\u0219ea\u021b\u0103 care dispare \u00een minute e chiar semnul normal.", "tag": "Presiunea capilar\u0103 \u0219i escara"}, {"q": "Care dintre aceste zone tolereaz\u0103 cel mai bine sprijinul unei orteze?", "opts": ["Maleola, la marginea gleznei", "Rotula, \u00een fa\u021ba genunchiului", "Pulpa gambei, acoperit\u0103 de mu\u0219chi", "Creasta tibiei, pe fa\u021ba gambei"], "correct": 2, "explain": "Zonele acoperite de mu\u0219chi \u0219i gr\u0103sime (pulpa gambei, coapsa, bra\u021bul) absorb presiunea. Maleolele, rotula \u0219i creasta tibiei sunt proeminen\u021be osoase cu piele sub\u021bire: \u00een dreptul lor plasticul se bombeaz\u0103 ca o cupol\u0103, ca s\u0103 nu le ating\u0103.", "tag": "Zone tolerante vs zone sensibile"}, {"q": "Ce avantaj au termoplasticele de joas\u0103 temperatur\u0103 fa\u021b\u0103 de alte materiale?", "opts": ["Se pot re\u00eenc\u0103lzi \u0219i remula pe aceea\u0219i m\u00e2n\u0103 c\u00e2nd volumul ei se schimb\u0103", "Suport\u0103 greutatea unui adult la mers f\u0103r\u0103 s\u0103 se fisureze \u00een timp", "Acumuleaz\u0103 energie la contactul c\u0103lc\u00e2iului \u0219i o redau la desprinderea v\u00e2rfului", "Se turtesc sub greutatea corpului \u0219i \u00ee\u0219i fac singure amprenta"], "correct": 0, "explain": "Termoplasticele au \u201ememorie\u201d: puse din nou \u00een ap\u0103 cald\u0103, revin la forma ini\u021bial\u0103 \u0219i se remuleaz\u0103, de pild\u0103 dup\u0103 ce m\u00e2na s-a desumflat. Rezisten\u021ba la greutatea adultului e a polipropilenei, energia elastic\u0103 a fibrei de carbon, iar amprenta format\u0103 sub greutate a spumei Plastazote.", "tag": "Termoplastice de joas\u0103 temperatur\u0103"}, {"q": "Ce rol au ferestrele goale ale corsetului Ch\u00eaneau?", "opts": ["Aerisesc pielea de sub corset \u0219i previn apari\u021bia escarelor pe coaste", "Las\u0103 respira\u021bia s\u0103 umfle toracele acolo \u0219i s\u0103 \u00eendrepte coloana", "U\u0219ureaz\u0103 \u00eembr\u0103carea corsetului de c\u0103tre copil, f\u0103r\u0103 ajutor", "Reduc greutatea corsetului, ca s\u0103 poat\u0103 fi purtat la \u0219coal\u0103"], "correct": 1, "explain": "Ferestrele sunt decupate pe partea opus\u0103 zonelor \u00eempinse: la respira\u021bia ad\u00e2nc\u0103, aerul umfl\u0103 toracele tocmai \u00een acele spa\u021bii \u0219i \u00eendreapt\u0103 coloana dinspre interior. Aerisirea sau greutatea mai mic\u0103 ar fi efecte secundare, nu principiul corec\u021biei.", "tag": "Corsetul Ch\u00eaneau pentru scolioz\u0103"}, {"q": "De ce mersul cu o ortez\u0103 din fibr\u0103 de carbon e mai pu\u021bin obositor?", "opts": ["Lama e rigid\u0103 \u0219i blocheaz\u0103 glezna, a\u0219a c\u0103 mu\u0219chii se odihnesc", "Lama se \u00eendoaie la sprijin \u0219i restituie energia la desprindere", "Lama e grea \u0219i stabilizeaz\u0103 pendularea piciorului \u00eenainte", "Lama amortizeaz\u0103 \u0219ocul la c\u0103lc\u00e2i \u0219i opre\u0219te rularea t\u0103lpii"], "correct": 1, "explain": "Fibra de carbon are elasticitate dinamic\u0103: se \u00eendoaie sub greutate ca o trambulin\u0103 \u0219i, la desprinderea v\u00e2rfului, revine brusc \u0219i arunc\u0103 piciorul \u00eenainte. Orteza din carbon e foarte u\u0219oar\u0103 (sub 200 g), iar oprirea rul\u0103rii ar face mersul mai greu, nu mai u\u0219or.", "tag": "Fibra de carbon"}, {"q": "De ce spuma Plastazote e potrivit\u0103 pentru pacientul diabetic?", "opts": ["Se muleaz\u0103 sub presiune \u0219i fere\u0219te pielea fragil\u0103 de puncte dure", "Se \u00eent\u0103re\u0219te la r\u0103cire \u0219i blocheaz\u0103 ferm articula\u021biile deformate ale piciorului", "\u00cenc\u0103lze\u0219te piciorul \u0219i stimuleaz\u0103 circula\u021bia din capilare", "Rezist\u0103 la \u00eendoiri repetate f\u0103r\u0103 s\u0103 se fisureze \u00een timp"], "correct": 0, "explain": "Plastazote se turte\u0219te discret exact unde ape\u0219i mai tare \u0219i \u00ee\u0219i face singur\u0103 amprenta anatomic\u0103; e hipoalergenic\u0103 \u0219i nu re\u021bine transpira\u021bia \u2014 de aceea e materialul de elec\u021bie pentru pielea fragil\u0103 a diabeticului. \u00cent\u0103rirea la r\u0103cire descrie termoplasticele, rezisten\u021ba la \u00eendoiri polipropilena.", "tag": "Plastazote \u0219i benzile Velcro"}, {"q": "De ce orteza pentru tunelul carpian se poart\u0103 mai ales noaptea?", "opts": ["Noaptea tendoanele se r\u0103cesc \u0219i se contract\u0103 \u00een interiorul tunelului", "\u00cen somn pumnul se flecteaz\u0103, iar presiunea din tunel cre\u0219te mult", "Ziua mi\u0219c\u0103rile degetelor maseaz\u0103 nervul \u0219i \u00eei reduc presiunea", "Noaptea circula\u021bia scade \u0219i nervul median se umfl\u0103 \u00een tunel"], "correct": 1, "explain": "\u00cen somn to\u021bi flect\u0103m incon\u0219tient pumnul, iar presiunea din tunel cre\u0219te de opt ori \u0219i comprim\u0103 nervul median \u2014 de aici amor\u021belile nocturne. Orteza \u021bine \u00eencheietura dreapt\u0103, \u00een pozi\u021bia neutr\u0103, unde presiunea e minim\u0103.", "tag": "Tunelul carpian: orteza de noapte"}, {"q": "Ce imobilizeaz\u0103 atela Spica folosit\u0103 \u00een rizartroz\u0103?", "opts": ["Cele patru degete lungi, cu \u00eencheietura l\u0103sat\u0103 liber\u0103", "\u00cencheietura \u00een pozi\u021bie neutr\u0103, cu toate degetele libere", "Degetul mare \u0219i \u00eencheietura, cu celelalte degete libere", "Cotul \u0219i antebra\u021bul, cu o pern\u0103 sub epicondil"], "correct": 2, "explain": "Rizartroza e uzura articula\u021biei de la baza degetului mare; atela Spica \u00eembrac\u0103 doar policele \u0219i \u00eencheietura, ca celelalte patru degete s\u0103 lucreze. \u00cencheietura neutr\u0103 cu degetele libere e orteza pentru tunelul carpian, iar perna pe antebra\u021b \u021bine de epicondilit\u0103.", "tag": "Rizartroza: atela Spica"}]}, {"id": "2", "eticheta": "Runda 2 \u00b7 Aplica\u021bii", "titlu": "Runda 2 \u2014 Cazuri \u0219i ra\u021bionament clinic", "desc": "Situa\u021bii clinice: alegi dispozitivul, interpretezi semnele, decizi ce urmeaz\u0103.", "intrebari": [{"q": "O pacient\u0103 de 74 de ani, cu osteoporoz\u0103, simte o durere lombar\u0103 brusc\u0103 dup\u0103 o tuse puternic\u0103; radiografia arat\u0103 partea din fa\u021b\u0103 a unei vertebre turtit\u0103. Ce corset descarc\u0103 zona lezat\u0103?", "opts": ["Jewett, care \u021bine trunchiul \u00een hiperextensie \u0219i deschide fa\u021ba vertebrei", "Ch\u00eaneau, care ghideaz\u0103 respira\u021bia spre ferestrele de pe partea opus\u0103", "Un corset \u00een flexie, care \u00eenchide spa\u021biul din spatele vertebrei tasate", "Un guler Philadelphia, care blocheaz\u0103 aproape 70% din mi\u0219c\u0103rile trunchiului"], "correct": 0, "explain": "Tasarea osteoporotic\u0103 turte\u0219te partea anterioar\u0103 a vertebrei. Corsetul cruciform Jewett (perne pe stern, pubis \u0219i spate) \u021bine corpul \u00een hiperextensie \u0219i descarc\u0103 tocmai partea anterioar\u0103. Flexia ar strivi-o mai tare, Ch\u00eaneau e pentru scolioz\u0103, iar Philadelphia e un guler cervical.", "tag": "Corsetul Jewett (hiperextensie)"}, {"q": "Un t\u00e2mplar de 45 de ani simte durere la cotul drept ori de c\u00e2te ori str\u00e2nge \u0219uruburi sau str\u00e2nge m\u00e2na cuiva. Nu face sport \u0219i nu-\u0219i poate \u00eentrerupe lucrul. Ce ortez\u0103 i se potrive\u0219te?", "opts": ["O atel\u0103 care \u021bine pumnul \u00een pozi\u021bie neutr\u0103, purtat\u0103 doar noaptea", "O atel\u0103 pentru police \u0219i \u00eencheietur\u0103, purtat\u0103 10\u201314 zile la r\u00e2nd", "O band\u0103 cu pern\u0103 str\u00e2ns\u0103 pe antebra\u021b, sub cot, purtat\u0103 la lucru", "O ortez\u0103 cu pern\u0103 care \u021bine bra\u021bul dep\u0103rtat de corp, la 30\u201345\u00b0"], "correct": 2, "explain": "Tabloul e de epicondilit\u0103 (\u201ebra\u021bul instalatorului\u201d), frecvent\u0103 la cei care lucreaz\u0103 manual, nu doar la sportivi. Banda de contrapresiune se poart\u0103 chiar \u00een timpul lucrului, pentru c\u0103 absoarbe for\u021ba \u00eenainte de tendon. Celelalte orteze \u021bin de tunelul carpian, De Quervain \u0219i um\u0103r.", "tag": "Epicondilita: banda de contrapresiune"}, {"q": "Un ortezist proiecteaz\u0103 o ortez\u0103 pentru un genunchi care fuge spre interior la fiecare pas. Cum plaseaz\u0103 cele trei puncte de sprijin?", "opts": ["Corec\u021bie pe fa\u021ba extern\u0103 a genunchiului, contrasprijin pe fa\u021ba intern\u0103 a coapsei \u0219i gambei", "Corec\u021bie pe fa\u021ba intern\u0103 a genunchiului, contrasprijin tot pe fa\u021ba intern\u0103 a coapsei \u0219i gambei", "Corec\u021bie pe fa\u021ba intern\u0103 a genunchiului, contrasprijin pe fa\u021ba extern\u0103 a coapsei \u0219i gambei", "Corec\u021bie pe rotul\u0103, din fa\u021b\u0103, cu contrasprijin \u00een spatele coapsei \u0219i \u00een spatele gambei"], "correct": 2, "explain": "Genunchiul care deviaz\u0103 spre interior se \u00eempinge dinspre interior spre exterior, pe v\u00e2rful devia\u021biei; cele dou\u0103 contrasprijinuri, pe coaps\u0103 \u0219i pe gamb\u0103, ac\u021bioneaz\u0103 din partea opus\u0103 (exterior). Varianta inversat\u0103 ar accentua devia\u021bia, iar toate for\u021bele pe aceea\u0219i parte ar \u00eempinge doar membrul lateral.", "tag": "Regula celor trei puncte"}, {"q": "Dou\u0103 atele de antebra\u021b dau aceea\u0219i corec\u021bie. Atela A acoper\u0103 un sfert din antebra\u021b, atela B aproape tot antebra\u021bul. Pacientul cu atela A are v\u00e2n\u0103t\u0103i la margini. Ce explic\u0103 diferen\u021ba?", "opts": ["P\u00e2rghia scurt\u0103 a atelei A cere for\u021be mari pe puncte apropiate", "Atela B apas\u0103 mai tare, dar numai pe zone acoperite de mu\u0219chi", "Atela A e prea rigid\u0103 \u0219i nu se poate mula pe relieful antebra\u021bului", "Atela B are mai multe puncte de sprijin dec\u00e2t cele trei obi\u0219nuite"], "correct": 0, "explain": "Regula p\u00e2rghiei lungi: o ortez\u0103 scurt\u0103 trebuie s\u0103 str\u00e2ng\u0103 ca o menghin\u0103 ca s\u0103 ob\u021bin\u0103 aceea\u0219i corec\u021bie, deci for\u021bele mari se concentreaz\u0103 la capete. Atela lung\u0103 distribuie efortul pe o suprafa\u021b\u0103 mare, cu for\u021be mai mici, f\u0103r\u0103 s\u0103 adauge puncte de sprijin.", "tag": "Regula p\u00e2rghiei lungi"}, {"q": "Dup\u0103 o leziune a nervului peronier, un t\u00e2n\u0103r aga\u021b\u0103 v\u00e2rful pantofului de borduri. Glezna nu e spastic\u0103, iar el vrea un mers fluid, \u00een pantofii lui obi\u0219nui\u021bi. Ce ortez\u0103 e cea mai potrivit\u0103?", "opts": ["O gheat\u0103 rigid\u0103 din plastic gros, cu glezna fixat\u0103 la 90\u00b0 pe tot pasul", "O ortez\u0103 cu plac\u0103 rigid\u0103 pe fa\u021ba tibiei, care \u00eempinge genunchiul \u00eenapoi", "O ortez\u0103 sub\u021bire din carbon, cu lam\u0103 care ridic\u0103 \u0219i propulseaz\u0103 piciorul", "Un sus\u021bin\u0103tor plantar rigid, care ridic\u0103 bolta \u0219i \u021bine c\u0103lc\u00e2iul drept"], "correct": 2, "explain": "E un picior c\u0103zut f\u0103r\u0103 spasticitate: e nevoie de asistarea mi\u0219c\u0103rii, iar lama de carbon e sub\u021bire, \u00eencape \u00een pantof \u0219i restituie energie. Gheata rigid\u0103 e indicat\u0103 c\u00e2nd gamba e spastic\u0103, placa anterioar\u0103 e pentru genunchiul care cedeaz\u0103, iar sus\u021bin\u0103torul plantar trateaz\u0103 platfusul.", "tag": "Fibra de carbon"}, {"q": "Dup\u0103 un AVC sever, un pacient are mu\u0219chii gambei spastici, care trag laba piciorului \u00een jos \u0219i spre interior la fiecare pas. Ce ortez\u0103 \u00eei \u021bine c\u0103lc\u00e2iul pe sol?", "opts": ["Un AFO articulat, care las\u0103 glezna s\u0103 se \u00eendoaie \u00eenainte", "O ortez\u0103 de reac\u021bie la sol, cu plac\u0103 pe fa\u021ba tibiei", "O lam\u0103 dinamic\u0103 din carbon, care restituie energia", "Un AFO rigid, care \u021bine glezna fix\u0103 la 90\u00b0"], "correct": 3, "explain": "Atitudinea equin-var spastic\u0103 cere o carcas\u0103 rigid\u0103 care blocheaz\u0103 glezna \u0219i for\u021beaz\u0103 c\u0103lc\u00e2iul pe sol. Balamalele sau lama elastic\u0103 ar l\u0103sa mu\u0219chii spastici s\u0103 trag\u0103 piciorul \u00een pozi\u021bia vicioas\u0103; orteza de reac\u021bie la sol trateaz\u0103 genunchiul care cedeaz\u0103.", "tag": "AFO rigid (gheata fix\u0103)"}, {"q": "Un copil cu paralizie cerebral\u0103 merge ghemuit: genunchii i se \u00eendoaie \u0219i cedeaz\u0103 la fiecare pas din cauza sl\u0103biciunii coapsei. Prin ce mecanism \u00eel \u021bine drept orteza potrivit\u0103?", "opts": ["Balamaua de la glezn\u0103 \u00eempiedic\u0103 v\u00e2rful s\u0103 cad\u0103 \u00een timpul pendul\u0103rii", "Inelul de blocare \u021bine genunchiul drept, ca o sc\u00e2ndur\u0103, pe tot parcursul pasului", "Microprocesorul de la genunchi \u00eel blocheaz\u0103 numai c\u00e2nd greutatea apas\u0103 pe el", "Placa din fa\u021ba tibiei prime\u0219te for\u021ba solului \u0219i \u00eempinge genunchiul \u00een extensie"], "correct": 3, "explain": "Orteza de reac\u021bie la sol (FRO) folose\u0219te chiar for\u021ba p\u0103m\u00e2ntului: la sprijinul pe talp\u0103, placa anterioar\u0103 a tibiei \u00eempinge genunchiul \u00eenapoi \u00een extensie. Inelul de blocare \u0219i microprocesorul \u021bin de KAFO, o ortez\u0103 lung\u0103 pe tot piciorul, iar balamaua de AFO-ul articulat.", "tag": "Orteza de reac\u021bie la sol (FRO)"}, {"q": "Un pacient cu KAFO clasic, cu genunchiul blocat, merge arunc\u00e2nd piciorul lateral \u00eentr-un cerc larg \u0219i a \u00eenceput s\u0103 aib\u0103 dureri de \u0219old. Ce schimb\u0103 o ortez\u0103 Stance-Control?", "opts": ["Blocheaz\u0103 genunchiul tot timpul, dar cu un mecanism mai u\u0219or \u0219i mai silen\u021bios", "Blocheaz\u0103 genunchiul doar sub greutate \u0219i \u00eel las\u0103 s\u0103 se \u00eendoaie \u00een pendulare", "Las\u0103 genunchiul liber \u0219i blocheaz\u0103 doar glezna, la 90\u00b0, pe tot parcursul pasului", "Blocheaz\u0103 genunchiul \u00een pendulare \u0219i \u00eel las\u0103 liber c\u00e2t greutatea apas\u0103 pe el"], "correct": 1, "explain": "Mersul cosit apare tocmai pentru c\u0103 genunchiul blocat nu se poate \u00eendoi ca piciorul s\u0103 treac\u0103 \u00eenainte. Stance-Control blocheaz\u0103 genunchiul c\u00e2nd simte greutatea (ca s\u0103 nu cedeze) \u0219i \u00eel elibereaz\u0103 la ridicarea c\u0103lc\u00e2iului, p\u00e2n\u0103 la 60\u00b0 de flexie. Varianta invers\u0103 ar duce la pr\u0103bu\u0219ire la sprijin.", "tag": "KAFO clasic vs Stance-Control"}, {"q": "O pacient\u0103 poart\u0103 de dou\u0103 s\u0103pt\u0103m\u00e2ni o atel\u0103 termoplastic\u0103 de m\u00e2n\u0103. Edemul a sc\u0103zut, iar atela a r\u0103mas larg\u0103 \u0219i alunec\u0103. Ce face terapeutul?", "opts": ["Comand\u0103 o atel\u0103 nou\u0103 din polipropilen\u0103, mulat\u0103 prin vidare", "Re\u00eenc\u0103lze\u0219te atela \u00een ap\u0103 cald\u0103 \u0219i o remuleaz\u0103 pe m\u00e2na actual\u0103", "Adaug\u0103 straturi de spum\u0103 \u00een interior, ca s\u0103 umple spa\u021biul liber", "Str\u00e2nge mai tare benzile de scai, ca s\u0103 compenseze golul"], "correct": 1, "explain": "Termoplasticele de joas\u0103 temperatur\u0103 au memorie: \u00een ap\u0103 cald\u0103 revin la forma plan\u0103 \u0219i se remuleaz\u0103, f\u0103r\u0103 aparat nou. Benzile str\u00e2nse mai tare ar crea puncte de presiune; spuma suplimentar\u0103 e o improviza\u021bie, iar polipropilena e pentru orteze care duc greutatea corpului.", "tag": "Termoplastice de joas\u0103 temperatur\u0103"}, {"q": "Un pacient \u00ee\u0219i scoate orteza de glezn\u0103 seara. Pe gamb\u0103 are o urm\u0103 roz acolo unde a ap\u0103sat cureaua; dup\u0103 25 de minute urma a disp\u0103rut. Cum se interpreteaz\u0103?", "opts": ["E o escar\u0103 incipient\u0103, iar orteza nu se mai pune", "Orteza e prea larg\u0103, iar benzile trebuie str\u00e2nse", "E un eritem fiziologic, iar schema de purtare continu\u0103", "Pielea reac\u021bioneaz\u0103 la plastic, iar c\u0103ptu\u0219eala se schimb\u0103"], "correct": 2, "explain": "O ro\u0219ea\u021b\u0103 care dispare \u00een 20, cel mult 30 de minute arat\u0103 c\u0103 s\u00e2ngele circul\u0103 din nou normal \u2014 e eritemul fiziologic. Alarma apare abia c\u00e2nd ro\u0219ea\u021ba persist\u0103 peste 30 de minute, e violacee, cald\u0103, \u00eent\u0103rit\u0103 sau cu flicten\u0103.", "tag": "Testul ro\u0219e\u021bii"}, {"q": "Un pacient prime\u0219te o ortez\u0103 nou\u0103 de glezn\u0103 luni. Miercuri, \u00een a treia zi, a purtat-o c\u00e2te 2 ore pe zi f\u0103r\u0103 probleme \u0219i vrea s\u0103 o poarte 8 ore la o nunt\u0103. Ce i se spune?", "opts": ["Poate, dac\u0103 poart\u0103 pe dedesubt o \u0219oset\u0103 din bumbac curat", "E prea devreme: acum se urc\u0103 la 3\u20134 ore, cu inspec\u021bia pielii", "Poate, dac\u0103 scoate orteza c\u00e2teva minute din or\u0103 \u00een or\u0103", "E prea devreme: dup\u0103 2 ore pe zi trebuie o pauz\u0103 de o zi"], "correct": 1, "explain": "Acomodarea e progresiv\u0103: zilele 1\u20132, 1\u20132 ore; zilele 3\u20134, 3\u20134 ore dac\u0103 pielea a fost curat\u0103; zilele 5\u20136, 5\u20136 ore; purtarea complet\u0103 abia din ziua a 7-a. \u0218oseta de bumbac e o regul\u0103 de igien\u0103, nu \u00eenlocuie\u0219te adaptarea pielii; schema nu prevede zile de pauz\u0103.", "tag": "Acomodarea progresiv\u0103"}, {"q": "La evaluarea unui pacient, genunchiul deformat nu se las\u0103 mi\u0219cat deloc, ca un bloc. Medicul se g\u00e2nde\u0219te la o ortez\u0103 corectoare. Ce rezult\u0103 din evaluare?", "opts": ["O ortez\u0103 mai scurt\u0103 ar ap\u0103sa mai eficient \u0219i ar reu\u0219i s\u0103 \u00eendrepte genunchiul", "O ortez\u0103 care ar for\u021ba corec\u021bia ar r\u0103ni pielea f\u0103r\u0103 s\u0103 \u00eendrepte genunchiul", "O ortez\u0103 dinamic\u0103, cu arcuri mai puternice, ar \u00eendrepta treptat genunchiul", "For\u021ba de corec\u021bie trebuie mutat\u0103 direct pe rotul\u0103, ca s\u0103 fie mai eficient\u0103"], "correct": 1, "explain": "Orteza poate \u00eendrepta doar o articula\u021bie care se las\u0103 mi\u0219cat\u0103; una \u00een\u021bepenit\u0103 nu poate fi for\u021bat\u0103 f\u0103r\u0103 a rupe pielea. Orteza scurt\u0103 ar cere for\u021be \u0219i mai mari, iar rotula e o proeminen\u021b\u0103 osoas\u0103 pe care nu se pune presiune.", "tag": "Evaluarea clinic\u0103"}, {"q": "Un pacient cu hernie de disc lombar\u0103 simte u\u0219urare imediat\u0103 cu un corset str\u00e2ns pe abdomen, de\u0219i corsetul nu apas\u0103 direct pe vertebre. Ce explic\u0103 efectul?", "opts": ["Abdomenul presurizat preia o parte din greutatea trunchiului spre bazin", "Corsetul \u00eenc\u0103lze\u0219te mu\u0219chii lombari \u0219i le reduce spasmul dureros", "Corsetul \u00eempinge vertebrele lombare \u00eenapoi \u00een aliniamentul corect", "Corsetul blocheaz\u0103 aplecarea \u0219i opre\u0219te frecarea discului de vertebre"], "correct": 0, "explain": "E cilindrul hidraulic abdominal: organele, pline mai ales cu ap\u0103, nu se comprim\u0103, iar abdomenul str\u00e2ns devine un st\u00e2lp presurizat care duce aproape o treime din greutatea trunchiului \u0219i a capului pe bazin, desc\u0103rc\u00e2nd discurile cu circa 30%.", "tag": "Cilindrul hidraulic abdominal"}, {"q": "O contabil\u0103 se treze\u0219te de c\u00e2teva nop\u021bi cu degetele amor\u021bite, ca \u00een\u021bepate de ace, \u0219i \u00ee\u0219i scutur\u0103 m\u00e2na ca s\u0103-\u0219i revin\u0103. Ce ortez\u0103 i se recomand\u0103?", "opts": ["O ortez\u0103 care \u021bine \u00eencheietura neutr\u0103, purtat\u0103 noaptea", "O atel\u0103 Spica pentru police, purtat\u0103 ziua la birou", "O band\u0103 cu pern\u0103 pe antebra\u021b, purtat\u0103 c\u00e2nd tasteaz\u0103", "O ortez\u0103 care \u021bine pumnul flectat, purtat\u0103 noaptea"], "correct": 0, "explain": "Amor\u021beala nocturn\u0103 tipic\u0103 arat\u0103 sindromul de tunel carpian. \u00cencheietura dreapt\u0103 (neutr\u0103) e pozi\u021bia cu presiune minim\u0103 \u00een tunel; pumnul flectat e exact pozi\u021bia care cre\u0219te presiunea de opt ori. Atela Spica e pentru police, banda pentru epicondilit\u0103.", "tag": "Tunelul carpian: orteza de noapte"}, {"q": "Un ortezist preg\u0103te\u0219te prin scanare 3D o ortez\u0103 de glezn\u0103 pentru un pacient slab, cu maleole proeminente. Ce modific\u0103 pe modelul digital \u00eenainte de fabricare?", "opts": ["Str\u00e2nge modelul \u00een dreptul maleolelor, ca orteza s\u0103 stea mai fix pe glezn\u0103", "Scurteaz\u0103 orteza sub gamb\u0103, ca presiunea s\u0103 se concentreze pe glezn\u0103", "Mut\u0103 sprijinul principal pe creasta tibiei, unde osul e foarte aproape", "Adaug\u0103 spa\u021biu liber \u00een dreptul maleolelor, ca plasticul s\u0103 nu le ating\u0103"], "correct": 3, "explain": "Pe calculator, ortezistul adaug\u0103 spa\u021bii libere peste proeminen\u021bele osoase: maleolele au piele sub\u021bire \u0219i nu suport\u0103 presiune. Sprijinul se caut\u0103 pe zonele musculare; creasta tibiei e tot o zon\u0103 sensibil\u0103, iar o ortez\u0103 scurtat\u0103 ar cere for\u021be mai mari.", "tag": "Amprenta: gips sau scanare 3D"}]}]}, {"nr": 2, "titlu": "Ghid practic de protezare \u0219i reabilitare func\u021bional\u0103", "harta": {"centru": "Protezarea: tipuri de proteze \u0219i reabilitare func\u021bional\u0103", "ramuri": [{"titlu": "Proteze de genunchi (artroplastie)", "tabel": {"cap": ["Implant", "Ce p\u0103streaz\u0103 / ce \u00eenlocuie\u0219te", "Indica\u021bie"], "randuri": [["PUG", "un compartiment; p\u0103streaz\u0103 restul \u0219i ambele ligamente \u00eencruci\u0219ate", "artroz\u0103 unicompartimental\u0103"], ["Patelofemural\u0103 / bicompartimental\u0103", "trohleea \u0219i fa\u021beta rotulian\u0103 (\u00b1 un compartiment tibiofemural)", "artroze izolate, netricompartimentale"], ["Total\u0103 CR", "p\u0103streaz\u0103 L\u00ceP", "L\u00ceP intact, f\u0103r\u0103 flexum sever"], ["Total\u0103 PS", "rezec\u0103 L\u00ceP; pivot + cam\u0103", "control al transla\u021biei anterioare"], ["CCK (semiconstr\u00e2ns\u0103)", "pivot central \u00eenalt", "laxitate colateral\u0103 masiv\u0103, pierdere osoas\u0103 asimetric\u0103"], ["Balama rotativ\u0103", "ax central femur\u2013tibie", "instabilit\u0103\u021bi extreme, revizii, anchiloze"]]}, "noduri": [{"t": "Proteza unicompartimental\u0103 (PUG)", "d": "Protezele de genunchi se clasific\u0103 dup\u0103 compartimentele \u00eenlocuite \u0219i dup\u0103 stabilitatea mecanic\u0103 pe care o d\u0103 implantul. PUG \u00eenlocuie\u0219te doar compartimentul medial sau lateral degradat \u0219i p\u0103streaz\u0103 compartimentul opus, articula\u021bia patelofemural\u0103 \u0219i ambele ligamente \u00eencruci\u0219ate. Pentru c\u0103 structurile native r\u0103m\u00e2n, se p\u0103streaz\u0103 propriocep\u021bia genunchiului, iar arcul de mobilitate se recupereaz\u0103 rapid."}, {"t": "Bicompartimental\u0103 \u0219i patelofemural\u0103", "d": "Proteza patelofemural\u0103 izolat\u0103 \u00eenlocuie\u0219te trohleea femural\u0103 \u0219i fa\u021beta rotulian\u0103; cea bicompartimental\u0103 \u00eenlocuie\u0219te un compartiment tibiofemural \u00eempreun\u0103 cu cel patelofemural. Se indic\u0103 \u00een artrozele izolate, f\u0103r\u0103 afectarea tuturor celor trei compartimente (f\u0103r\u0103 afectare tricompartimental\u0103)."}, {"t": "Proteza total\u0103 CR (p\u0103streaz\u0103 L\u00ceP)", "d": "Cruciate-Retaining men\u021bine ligamentul \u00eencruci\u0219at posterior (L\u00ceP). Avantajul: o rulare posterioar\u0103 fiziologic\u0103 a femurului \u00een flexia profund\u0103. Condi\u021bii: un L\u00ceP intact din punct de vedere mecanic \u0219i absen\u021ba unei deform\u0103ri severe \u00een flexum (genunchi care nu se mai \u00eentinde)."}, {"t": "Proteza total\u0103 PS (\u00eenlocuie\u0219te L\u00ceP)", "d": "Posterior-Stabilized rezec\u0103 L\u00ceP \u0219i \u00eei preia rolul printr-un mecanism: un pivot central de polietilen\u0103 \u0219i o cam\u0103 metalic\u0103 femural\u0103, \u00eentre condili. Mecanismul previne transla\u021bia anterioar\u0103 anormal\u0103 a femurului pe tibie."}, {"t": "Proteza semiconstr\u00e2ns\u0103 (CCK)", "d": "Constrained Condylar Knee are un pivot central \u00eenalt \u0219i robust, care d\u0103 stabilitate frontal\u0103, \u00een varus\u2013valg. Se indic\u0103 \u00een laxit\u0103\u021bile ligamentare colaterale masive sau \u00een pierderile osoase asimetrice, c\u00e2nd ligamentele proprii nu mai stabilizeaz\u0103 lateral genunchiul."}, {"t": "Balama rotativ\u0103 (Rotating Hinge)", "d": "Protez\u0103 total constr\u00e2ns\u0103: componentele femural\u0103 \u0219i tibial\u0103 sunt solidarizate mecanic printr-un ax central, care permite doar flexie\u2013extensie \u0219i o rota\u021bie axial\u0103 limitat\u0103. E implantul de elec\u021bie \u00een instabilit\u0103\u021bi extreme, revizii complexe sau anchiloze. Ca sintez\u0103 a clasific\u0103rii (interpretare): de la PUG la balama, contribu\u021bia ligamentelor proprii scade, iar constr\u00e2ngerea implantului cre\u0219te."}]}, {"titlu": "Proteze de \u0219old, um\u0103r \u0219i cot", "noduri": [{"t": "Hemiartroplastia unipolar\u0103", "d": "Alegerea protezei de \u0219old \u021bine de v\u00e2rst\u0103, de capitalul osos \u0219i de nivelul de solicitare. Proteza cervicocefalic\u0103 unipolar\u0103 (tip Austin-Moore sau Thompson) \u00eenlocuie\u0219te doar capul \u0219i colul femural cu o pies\u0103 metalic\u0103 monobloc, de dimensiune anatomic\u0103, ce pivoteaz\u0103 direct \u00een cartilajul acetabular natural. E rezervat\u0103 pacien\u021bilor foarte v\u00e2rstnici, sedentari, cu fracturi de col femural."}, {"t": "Hemiartroplastia bipolar\u0103", "d": "O bil\u0103 femural\u0103 intern\u0103 mic\u0103 se articuleaz\u0103 \u00eentr-o cup\u0103 mobil\u0103 exterioar\u0103, c\u0103ptu\u0219it\u0103 cu polietilen\u0103. Rezult\u0103 o dubl\u0103 articula\u021bie care disipeaz\u0103 for\u021bele de frecare \u0219i \u00eent\u00e2rzie uzura cotilului osos nativ (cotilul nu se \u00eenlocuie\u0219te nici aici)."}, {"t": "Proteza total\u0103 de \u0219old (PTS)", "d": "\u00cenlocuie\u0219te complet ambele versante articulare: cotilul, prin cup\u0103 acetabular\u0103 \u0219i insert de contact, \u0219i femurul, prin tij\u0103 centromedular\u0103 \u0219i cap sferic modular. Restabile\u0219te complet centrul anatomic de rota\u021bie \u0219i egalitatea lungimii membrelor. Aten\u021bie: aceea\u0219i sigl\u0103, PTS, denume\u0219te \u0219i o cup\u0103 transtibial\u0103 (supracondilian\u0103)."}, {"t": "Tije scurte \u0219i resurfacing", "d": "Proteze care conserv\u0103 colul femural. Tijele scurte se ancoreaz\u0103 metafizar \u0219i cru\u021b\u0103 canalul diafizar; proteza de suprafa\u021b\u0103 (resurfacing) acoper\u0103 doar capul femural. Ambele sunt rezervate pacien\u021bilor tineri, cu stoc osos excelent."}, {"t": "Proteza anatomic\u0103 de um\u0103r (TSA)", "d": "La membrul superior, cinematica urm\u0103re\u0219te mobilitatea tridimensional\u0103 \u0219i dexteritatea. Proteza anatomic\u0103 reproduce geometria natural\u0103: cap humeral sferic pe o cup\u0103 glenoidian\u0103 concav\u0103. Condi\u021bie obligatorie: o coaf\u0103 a rotatorilor complet intact\u0103."}, {"t": "Proteza inversat\u0103 de um\u0103r (rTSA)", "d": "Schimb\u0103 orientarea articular\u0103: o glenosfer\u0103 convex\u0103 fixat\u0103 pe scapul\u0103 \u0219i o cup\u0103 concav\u0103 pe extremitatea superioar\u0103 a humerusului. Centrul de rota\u021bie se mut\u0103 medial \u0219i distal, iar mu\u0219chiul deltoid poate prelua singur ridicarea bra\u021bului atunci c\u00e2nd coafa rotatorilor lipse\u0219te."}, {"t": "Proteza total\u0103 de cot", "d": "Exist\u0103 proteze semiconstr\u00e2nse \u0219i neconstr\u00e2nse. Cele cu balama lax\u0103 semiconstr\u00e2ns\u0103 asigur\u0103 stabilitatea \u00een fa\u021ba for\u021belor de forfecare, dar impun limitarea ridic\u0103rii sarcinilor la maximum 3\u20135 kg, pe via\u021b\u0103."}]}, {"titlu": "Fixarea implantului \u0219i cuplurile de frecare", "noduri": [{"t": "Fixarea cimentat\u0103", "d": "Modul de ancorare a protezei \u00een os dicteaz\u0103 cum se \u00eencarc\u0103 membrul \u00een s\u0103pt\u0103m\u00e2nile postoperatorii. Fixarea cimentat\u0103 folose\u0219te polimetilmetacrilat (PMMA), care ac\u021bioneaz\u0103 ca un mortar viscoelastic \u0219i repartizeaz\u0103 uniform presiunile \u00eentre implant \u0219i patul osos. Stabilitatea mecanic\u0103 primar\u0103 e imediat\u0103 \u0219i complet\u0103, deci se permite precoce sprijinul total sau la toleran\u021b\u0103."}, {"t": "Fixarea necimentat\u0103 (biologic\u0103)", "d": "Implanturile sunt acoperite cu titan poros, trabecular sau hidroxiapatit\u0103 \u0219i se introduc prin presare (press-fit). Fixarea secundar\u0103 depinde de osteointegrarea trabecular\u0103 \u00een porii metalului, care dureaz\u0103 6\u20138 s\u0103pt\u0103m\u00e2ni; \u00een acest timp pacientul respect\u0103 \u00eenc\u0103rcarea par\u021bial\u0103 prescris\u0103, de 15\u201330% din greutate."}, {"t": "Fixarea hibrid\u0103 \u0219i hibrid\u0103 inversat\u0103", "d": "Hibrida clasic\u0103 folose\u0219te o cup\u0103 acetabular\u0103 necimentat\u0103 \u0219i o tij\u0103 femural\u0103 cimentat\u0103; varianta inversat\u0103, o cup\u0103 cimentat\u0103 \u0219i o tij\u0103 necimentat\u0103. Combina\u021bia se adapteaz\u0103 densit\u0103\u021bii osoase locale."}, {"t": "Metal pe polietilen\u0103 (MoP)", "d": "Materialele aflate \u00een frecare decid durabilitatea implantului \u0219i riscul de osteoliz\u0103 periprotetic\u0103 (pierderea de os din jurul protezei). MoP: cap metalic din aliaj cobalt-crom pe insert de polietilen\u0103 cu greutate molecular\u0103 ultra-\u00eenalt\u0103 (UHMWPE). Robust \u0219i elastic, dar \u00een timp genereaz\u0103 uzur\u0103 polietilenic\u0103 microscopic\u0103."}, {"t": "Ceramic\u0103 pe polietilen\u0103 (CoP)", "d": "Cap din ceramic\u0103 (alumin\u0103 sau compozit alumin\u0103\u2013zirconiu) pe insert de polietilen\u0103 reticulat\u0103 cu vitamina E. Coeficient de frecare sc\u0103zut \u0219i uzur\u0103 redus\u0103: excelent pentru pacien\u021bii activi."}, {"t": "Ceramic\u0103 pe ceramic\u0103 (CoC)", "d": "Are cel mai sc\u0103zut coeficient de frecare \u0219i o bioiner\u021bie excep\u021bional\u0103. Riscuri specifice: fragilitate la \u0219ocuri mari de impact, fractur\u0103 casant\u0103 \u0219i fenomenul acustic de sc\u00e2r\u021b\u00e2it (squeaking)."}, {"t": "Metal pe metal (MoM)", "d": "Abandonat clinic: elibereaz\u0103 \u00een circula\u021bie ioni toxici de cobalt \u0219i crom \u0219i produce reac\u021bii adverse pseudotumorale periprotetice."}]}, {"titlu": "Exoproteze de membru inferior: arhitectur\u0103 \u0219i cupe", "noduri": [{"t": "Proteza exoscheletic\u0103", "d": "Conven\u021bional\u0103: peretele exterior din r\u0103\u0219in\u0103 laminat\u0103 dur\u0103 e \u00een acela\u0219i timp structura portant\u0103 \u0219i forma cosmetic\u0103. E foarte rezistent\u0103 mecanic \u0219i la intemperii, dar are greutate crescut\u0103 \u0219i nu permite ajust\u0103ri de aliniament."}, {"t": "Proteza endoscheletic\u0103 (modular\u0103)", "d": "Structura portant\u0103 e un tub metalic sau din fibr\u0103 de carbon (pylon), iar cuplurile mecanice sunt asigurate de adaptoare reglabile \u00een plan sagital \u0219i frontal. Peste tub se pune o hus\u0103 cosmetic\u0103 moale din spum\u0103. Permite ajust\u0103ri fine \u0219i schimbarea modular\u0103 a componentelor."}, {"t": "Cupa PTB", "d": "Cupa (socket-ul) transmite for\u021bele \u00eentre bont \u0219i protez\u0103. Patellar Tendon Bearing (transtibial\u0103) descarc\u0103 greutatea predominant pe tendonul patelar, condilii tibiali \u0219i diafiza peronier\u0103 \u0219i are concavit\u0103\u021bi de desc\u0103rcare pe capul peroneului \u0219i pe creasta tibial\u0103 anterioar\u0103."}, {"t": "Cupa PTS (supracondilian\u0103)", "d": "Proth\u00e8se Tibiale Supracondylienne: transtibial\u0103, cu aripioare laterale prelungite peste condilii femurali, care asigur\u0103 autosuspensie mecanic\u0103, f\u0103r\u0103 curele externe."}, {"t": "Cupa TSB", "d": "Total Surface Bearing: desc\u0103rcare hidrostatic\u0103 uniform\u0103 pe toat\u0103 suprafa\u021ba bontului, cu un man\u0219on intern de silicon care amortizeaz\u0103 forfecarea pielii."}, {"t": "Cupa patrulater\u0103", "d": "La coaps\u0103, stabilitatea depinde de controlul adductorilor \u0219i de sprijinul pe tuberozitatea ischiatic\u0103. Cupa patrulater\u0103 are form\u0103 orizontalizat\u0103, cu sprijin direct pe tuberozitatea ischiatic\u0103, dar tinde s\u0103 permit\u0103 devierea femurului \u00een abduc\u021bie."}, {"t": "Cupa cu conten\u021bie ischiatic\u0103", "d": "Ischial Containment / CAT-CAM: \u00eenglobeaz\u0103 tuberozitatea ischiatic\u0103 \u0219i ramura ischiopubian\u0103 \u00een interiorul cupei \u0219i men\u021bine femurul \u00een adduc\u021bie fiziologic\u0103, pentru un randament optim al mu\u0219chilor fesieri la mers."}, {"t": "Cupa MAS (sub-ischial\u0103)", "d": "Cup\u0103 cu vacuum total \u0219i contact sub-ischial: contururi joase care elibereaz\u0103 fesa \u0219i tuberozitatea ischiatic\u0103; stabilizarea e strict muscular\u0103 \u0219i hidraulic\u0103, prin vacuum."}]}, {"titlu": "Suspensie \u0219i genunchi protetici", "noduri": [{"t": "Liner de silicon cu pin", "d": "Suspensia men\u021bine leg\u0103tura intim\u0103 dintre bont \u0219i protez\u0103 \u0219i previne pistonajul (mi\u0219carea bontului \u00een sus \u0219i-n jos \u00een cup\u0103). Locking Pin: un \u0219tift distal filetat, pe liner, se blocheaz\u0103 \u00eentr-un mecanism cu clichet \u00een baza cupei; securitatea e confirmat\u0103 acustic, imediat, la \u00eembr\u0103care."}, {"t": "Vacuum pasiv", "d": "Un man\u0219on elastic extern etan\u0219eaz\u0103 marginea cupei, iar o valv\u0103 unidirec\u021bional\u0103 expulzeaz\u0103 aerul \u00een faza de sprijin."}, {"t": "Vacuum activ", "d": "Sisteme ca Harmony sau e-Pulse: o pomp\u0103 mecanic\u0103 sau electronic\u0103 genereaz\u0103 o presiune negativ\u0103 constant\u0103 de 15\u201320 inHg, care elimin\u0103 jocul axial \u0219i stimuleaz\u0103 vasculariza\u021bia bontului."}, {"t": "Harna\u0219amente anatomice", "d": "Prindere supracondilian\u0103, curea silesian\u0103 sau centur\u0103 pelvin\u0103 rigid\u0103 cu articula\u021bie de \u0219old \u2014 solu\u021bii pentru bonturile foarte scurte."}, {"t": "Genunchi monoaxiali", "d": "Genunchiul protetic decide siguran\u021ba la c\u0103dere \u0219i consumul de energie. Monoaxial cu blocare manual\u0103: rigid \u00een extensie pe tot mersul, deblocat voluntar cu un levier pentru a\u0219ezare \u2014 stabilitate maxim\u0103 pentru pacien\u021bii fragili. Monoaxial cu fr\u00e2n\u0103 de fric\u0
