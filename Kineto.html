21biune la \u00eenc\u0103rcare: fr\u00e2neaz\u0103 automat flexia c\u00e2nd greutatea vine pe c\u0103lc\u00e2i cu genunchiul u\u0219or \u00eendoit."}, {"t": "Genunchi policentric", "d": "Are 4 sau 7 axe de rota\u021bie. Centrul instantaneu de rota\u021bie se deplaseaz\u0103 posterior \u0219i superior \u00een extensie, ceea ce d\u0103 stabilitate mare \u00een sprijin; \u00een pendulare scurteaz\u0103 lungimea membrului \u0219i previne ag\u0103\u021barea v\u00e2rfului de sol."}, {"t": "Genunchi pneumatic sau hidraulic", "d": "Cilindrul pneumatic sau hidraulic regleaz\u0103 viteza fazei de pendulare \u00een func\u021bie de ritmul de mers al pacientului."}, {"t": "Genunchi cu microprocesor (MPK)", "d": "Genunchi bionic (de pild\u0103 C-Leg, Genium): senzorii citesc for\u021bele \u0219i unghiurile de 50\u2013100 de ori pe secund\u0103 \u0219i adapteaz\u0103 rezisten\u021ba hidraulic\u0103 \u00een timp real; previne c\u0103derile la \u00eempiedicare \u0219i permite cobor\u00e2rea alternant\u0103 a sc\u0103rilor."}]}, {"titlu": "Laba protetic\u0103 \u0219i nivelurile K", "tabel": {"cap": ["Nivel", "Mobilitate", "Componente tipice"], "randuri": [["K0", "f\u0103r\u0103 poten\u021bial de deplasare", "protezarea nu e indicat\u0103"], ["K1", "deplasare limitat\u0103, de interior, caden\u021b\u0103 fix\u0103", "picior SACH, genunchi cu blocare manual\u0103"], ["K2", "mers comunitar limitat, borduri mici, denivel\u0103ri reduse", "\u2014"], ["K3", "mers comunitar independent, caden\u021b\u0103 variabil\u0103", "lame ESR din carbon, genunchi MPK"], ["K4", "sport de performan\u021b\u0103, munc\u0103 fizic\u0103 grea", "\u2014"]]}, "noduri": [{"t": "Piciorul SACH", "d": "Piciorul protetic asigur\u0103 contactul cu solul, amortizarea \u0219i propulsia. SACH (Solid Ankle Cushion Heel): picior nearticulat, rigid, cu miez de lemn \u0219i c\u0103lc\u00e2i din spum\u0103 amortizoare; simplu \u0219i ieftin, pentru pacien\u021bii cu mobilitate redus\u0103, de interior."}, {"t": "Picior articulat monoaxial", "d": "Permite o flexie plantar\u0103 mecanic\u0103 rapid\u0103 la c\u0103lcarea pe sol, ceea ce confer\u0103 stabilitate precoce genunchiului."}, {"t": "Picior multiaxial", "d": "Permite inversie, eversie \u0219i rota\u021bie transversal\u0103 \u0219i amortizeaz\u0103 denivel\u0103rile terenului accidentat."}, {"t": "Picior ESR (restituire de energie)", "d": "Energy Storage and Return: lame curbate din fibr\u0103 de carbon stocheaz\u0103 energia cinetic\u0103 \u00een prima parte a sprijinului \u0219i o elibereaz\u0103 elastic la desprindere (push-off), reduc\u00e2nd efortul cardiac. E acela\u0219i principiu ca la ortezele din fibr\u0103 de carbon din Cap. 1 (Ghid practic de ortezare)."}, {"t": "Picior bionic cu microprocesor", "d": "Are un micromotor electric care genereaz\u0103 flexie plantar\u0103 activ\u0103 la desprindere: \u00eempinge efectiv pasul \u0219i egalizeaz\u0103 munca membrului s\u0103n\u0103tos. Spre deosebire de ESR, care doar restituie energia stocat\u0103, motorul adaug\u0103 energie (precizare de interpretare)."}, {"t": "Clasificarea K-Levels", "d": "Barem de mobilitate care orienteaz\u0103 prescrierea componentelor. K0: f\u0103r\u0103 poten\u021bial de deplasare, protezarea nu e indicat\u0103. K1: deplasare limitat\u0103, de interior, la caden\u021b\u0103 fix\u0103 (picior SACH, genunchi cu blocare manual\u0103). K2: mers comunitar limitat, cu borduri mici \u0219i denivel\u0103ri reduse. K3: mers comunitar independent, la caden\u021b\u0103 variabil\u0103, peste majoritatea obstacolelor (lame ESR din carbon, genunchi MPK). K4: activit\u0103\u021bi atletice, sport de performan\u021b\u0103 sau munc\u0103 fizic\u0103 grea, cu impact biomecanic ridicat."}]}, {"titlu": "Proteze de membru superior", "noduri": [{"t": "Proteze pasive (estetice)", "d": "\u00cenveli\u0219uri din silicon sau PVC care reproduc detaliile anatomice, unghiile \u0219i culoarea pielii. Nu au func\u021bie activ\u0103; rolul lor utilitar e stabilizarea obiectelor u\u0219oare."}, {"t": "Proteze ac\u021bionate de corp", "d": "Body-Powered: un harna\u0219ament \u00een form\u0103 de opt pe centura scapular\u0103, legat de un cablu de o\u021bel Bowden. Protrac\u021bia um\u0103rului sau flexia bra\u021bului trac\u021bioneaz\u0103 cablul \u0219i deschide un c\u00e2rlig func\u021bional (split hook) sau o m\u00e2n\u0103 mecanic\u0103."}, {"t": "Proteze mioelectrice monomodale", "d": "Control bazat pe activitatea neuromuscular\u0103 rezidual\u0103: doi electrozi de suprafa\u021b\u0103 capteaz\u0103 microvoltajul mu\u0219chilor flexori \u0219i extensori ai bontului. Contrac\u021bia flexorilor \u00eenchide m\u00e2na, iar contrac\u021bia extensorilor o deschide."}, {"t": "M\u00e2ini bionice multi-articulare", "d": "Motoare individuale \u00een fiecare deget execut\u0103 zeci de prize predefinite \u2014 pens\u0103 de precizie, priz\u0103 cilindric\u0103 de for\u021b\u0103, mod tastatur\u0103 \u2014, comutate prin co-contrac\u021bii musculare sau din aplica\u021bii mobile."}, {"t": "Proteze hibride", "d": "Combin\u0103 un cot ac\u021bionat prin cablu mecanic de la um\u0103r cu o m\u00e2n\u0103 sau o pens\u0103 mioelectric\u0103 ac\u021bionat\u0103 electronic, optimiz\u00e2nd greutatea total\u0103 a protezei."}]}, {"titlu": "Reabilitare \u0219i semne de alarm\u0103", "noduri": [{"t": "Faza acut\u0103 (zilele 0\u201314)", "d": "Dup\u0103 artroplastie, obiectivele sunt controlul durerii, combaterea edemului \u0219i rec\u00e2\u0219tigarea extensiei. Edemul \u0219i staza: crioterapie intermitent\u0103 c\u00e2te 20 de minute, drenaj postural decliv la 30\u00b0 \u0219i pompaj venos prin flexii plantare \u0219i dorsale repetate. La genunchi, prioritatea major\u0103 e extensia complet\u0103 de 0\u00b0: f\u0103r\u0103 perne sub genunchi, cu contrac\u021bii izometrice viguroase de cvadriceps. \u0218coala mersului cu cadrul, \u00een 3 timpi: avansarea cadrului, pasul cu membrul operat, egalizarea cu membrul s\u0103n\u0103tos."}, {"t": "Faza subacut\u0103 (s\u0103pt\u0103m\u00e2nile 3\u201312)", "d": "Obiective: hipertrofie muscular\u0103, lan\u021b kinetic \u00eenchis, propriocep\u021bie. Lan\u021b kinetic \u00eenchis: mini-genuflexiuni la perete (0\u201345\u00b0), pres\u0103 de picioare cu \u00eenc\u0103rcare progresiv\u0103, urcare pe step de 10\u201315 cm. Terapie manual\u0103 periprotetic\u0103: mobilizarea rotulei supero-inferior \u0219i medio-lateral \u0219i masaj transversal profund Cyriax pe cicatrice, pentru prevenirea artrofibrozei. Biciclet\u0103 ergonomic\u0103 cu \u0219aua reglat\u0103 ini\u021bial mai sus \u0219i pedalare oscilant\u0103 \u00eenainte\u2013\u00eenapoi; pl\u0103ci de balans \u0219i perne cu aer pentru recalibrarea mecanoreceptorilor."}, {"t": "Reguli antiluxante la \u0219old", "d": "Pentru pacien\u021bii cu protez\u0103 de \u0219old prin abord posterolateral. F\u0103r\u0103 flexie peste 90\u00b0: nu se apleac\u0103 trunchiul la \u0219iretul pantofului \u0219i nu se st\u0103 pe fotolii joase. F\u0103r\u0103 adduc\u021bie peste linia median\u0103: picioarele nu se \u00eencruci\u0219eaz\u0103, iar \u00een pat se folose\u0219te o pern\u0103 de abduc\u021bie \u00eentre coapse. F\u0103r\u0103 rota\u021bie intern\u0103 a membrului operat: v\u00e2rful piciorului r\u0103m\u00e2ne neutru sau u\u0219or orientat \u00een afar\u0103."}, {"t": "Preg\u0103tirea bontului", "d": "Preg\u0103te\u0219te \u021besutul pentru contactul intim cu cupa. Bandajul compresiv \u00een spic de gr\u00e2u se aplic\u0103 numai \u00een form\u0103 de opt, cu presiune maxim\u0103 distal: asigur\u0103 conicitatea bontului \u0219i previne garoul vascular. Desensibilizarea: fric\u021biuni bl\u00e2nde cu texturi gradate (m\u0103tase, bumbac, prosop, burete), pentru tolerarea forfec\u0103rilor. Prevenirea contracturilor: f\u0103r\u0103 pern\u0103 sub genunchi la amputa\u021bia transtibial\u0103; la cea transfemural\u0103, decubit ventral zilnic 30\u201345 de minute, pentru \u00eentinderea flexorilor \u0219oldului."}, {"t": "Reeducarea mersului cu proteza", "d": "Trei etape. 1) \u00cen bare paralele: transferul greut\u0103\u021bii de pe un picior pe altul, balans medio-lateral, flectarea genunchiului protetic. 2) Pas pendular \u0219i rularea c\u0103lc\u00e2iului: a\u0219ezarea sigur\u0103 a c\u0103lc\u00e2iului protetic la sol, f\u0103r\u0103 devia\u021bii laterale ale trunchiului. 3) Mers \u00een afara barelor \u0219i pe sc\u0103ri: de la dou\u0103 c\u00e2rje la o c\u00e2rj\u0103 contralateral\u0103, apoi mers liber; \u201es\u0103n\u0103tosul urc\u0103 primul\u201d, \u201eproteza coboar\u0103 prima\u201d. Se corecteaz\u0103 mersul cu circumduc\u021bie, saltul pe v\u00e2rf (vaulting) \u0219i \u00eenclinarea lateral\u0103 a trunchiului."}, {"t": "Semne de alarm\u0103 (red flags)", "d": "Impun oprirea imediat\u0103 a \u0219edin\u021bei \u0219i trimiterea la medic. Tromboz\u0103 venoas\u0103 profund\u0103: semn Homans pozitiv, indura\u021bie dureroas\u0103 a gambei, tumefiere asimetric\u0103, c\u0103ldur\u0103 local\u0103. Infec\u021bie acut\u0103 periprotetic\u0103: febr\u0103, frisoane, eritem perilesional extins, secre\u021bie purulent\u0103 din cicatrice, durere nocturn\u0103 progresiv\u0103. Leziuni ischemice pe bont: flictene, zone cianotice sau hiperemie care persist\u0103 peste 30 de minute dup\u0103 dezechipare \u2014 acela\u0219i prag de 30 de minute ca la testul ro\u0219e\u021bii din Cap. 1 (Ghid practic de ortezare)."}]}]}, "sectiuni": [], "runde": [{"id": "1", "eticheta": "Runda 1 \u00b7 Baz\u0103", "titlu": "Runda 1 \u2014 Concepte de baz\u0103", "desc": "Teorie: roluri, deosebiri, indica\u021bii \u0219i principii, \u00een \u00eentreb\u0103ri directe.", "intrebari": [{"q": "Ce structuri p\u0103streaz\u0103 proteza unicompartimental\u0103 de genunchi?", "opts": ["Compartimentul opus \u0219i L\u00ceP, dar rezec\u0103 ligamentul \u00eencruci\u0219at anterior al genunchiului", "Articula\u021bia patelofemural\u0103, dar \u00eenlocuie\u0219te ambele compartimente tibiofemurale", "Compartimentul opus, articula\u021bia patelofemural\u0103 \u0219i ambele ligamente \u00eencruci\u0219ate", "Compartimentele tibiofemurale, dar \u00eenlocuie\u0219te trohleea \u0219i fa\u021beta rotulian\u0103"], "correct": 2, "explain": "PUG \u00eenlocuie\u0219te doar compartimentul medial sau lateral degradat \u0219i p\u0103streaz\u0103 restul: compartimentul opus, articula\u021bia patelofemural\u0103 \u0219i ambele ligamente \u00eencruci\u0219ate \u2014 de aici propriocep\u021bia nativ\u0103 \u0219i recuperarea rapid\u0103. \u00cenlocuirea trohleei \u0219i a fa\u021betei rotuliene descrie proteza patelofemural\u0103.", "tag": "Proteza unicompartimental\u0103 (PUG)"}, {"q": "Ce condi\u021bie cere o protez\u0103 total\u0103 de genunchi de tip CR?", "opts": ["Ligamente colaterale laxe, compensate de un pivot central \u00eenalt", "Un ligament \u00eencruci\u0219at posterior rezecat, \u00eenlocuit de pivot \u0219i cam\u0103", "Un ligament \u00eencruci\u0219at posterior intact, f\u0103r\u0103 flexum sever", "O pierdere osoas\u0103 asimetric\u0103, compensat\u0103 de un implant constr\u00e2ns"], "correct": 2, "explain": "Cruciate-Retaining p\u0103streaz\u0103 L\u00ceP, deci are nevoie de un ligament s\u0103n\u0103tos mecanic \u0219i de absen\u021ba unui flexum sever; \u00een schimb ofer\u0103 rularea posterioar\u0103 fiziologic\u0103 a femurului \u00een flexie. L\u00ceP rezecat \u0219i \u00eenlocuit de pivot \u0219i cam\u0103 e proteza PS; pivotul \u00eenalt pentru laxitate colateral\u0103 e CCK.", "tag": "Proteza total\u0103 CR (p\u0103streaz\u0103 L\u00ceP)"}, {"q": "Ce rol au pivotul de polietilen\u0103 \u0219i cama femural\u0103 la proteza PS?", "opts": ["Preiau rolul ligamentelor colaterale \u0219i stabilizeaz\u0103 genunchiul \u00een varus\u2013valg", "Leag\u0103 femurul de tibie \u0219i permit doar flexia \u0219i extensia genunchiului", "P\u0103streaz\u0103 L\u00ceP \u0219i ajut\u0103 rularea posterioar\u0103 a femurului \u00een flexie", "Preiau rolul L\u00ceP \u0219i \u00eempiedic\u0103 alunecarea anterioar\u0103 a femurului pe tibie"], "correct": 3, "explain": "La proteza Posterior-Stabilized L\u00ceP se rezec\u0103, iar mecanismul pivot\u2013cam\u0103 \u00eempiedic\u0103 transla\u021bia anterioar\u0103 anormal\u0103 a femurului pe tibie. Stabilitatea \u00een varus\u2013valg e rolul pivotului \u00eenalt al CCK, legarea prin ax e balama rotativ\u0103, iar p\u0103strarea L\u00ceP define\u0219te proteza CR.", "tag": "Proteza total\u0103 PS (\u00eenlocuie\u0219te L\u00ceP)"}, {"q": "\u00cen ce situa\u021bii se indic\u0103 proteza de genunchi cu balama rotativ\u0103?", "opts": ["\u00cen artroza limitat\u0103 la compartimentul medial al genunchiului", "\u00cen instabilit\u0103\u021bi extreme, revizii complexe sau anchiloze", "\u00cen artroza patelofemural\u0103 izolat\u0103, f\u0103r\u0103 alte leziuni asociate", "\u00cen laxitatea u\u0219oar\u0103 a ligamentului \u00eencruci\u0219at posterior"], "correct": 1, "explain": "Balama rotativ\u0103 leag\u0103 mecanic componentele printr-un ax \u0219i las\u0103 doar flexie\u2013extensie \u0219i o rota\u021bie axial\u0103 limitat\u0103: e cel mai constr\u00e2ns implant, rezervat instabilit\u0103\u021bilor extreme, reviziilor complexe \u0219i anchilozelor. Artrozele limitate la un compartiment se trateaz\u0103 cu proteze par\u021biale.", "tag": "Balama rotativ\u0103 (Rotating Hinge)"}, {"q": "Ce deosebe\u0219te hemiartroplastia bipolar\u0103 de cea unipolar\u0103?", "opts": ["\u00cenlocuirea cotilului cu o cup\u0103 acetabular\u0103 fix\u0103 \u0219i un insert de contact", "Ancorarea metafizar\u0103 a tijei femurale, cu canalul diafizar al femurului cru\u021bat", "O dubl\u0103 articula\u021bie, cu bil\u0103 intern\u0103 \u00eentr-o cup\u0103 mobil\u0103, care cru\u021b\u0103 cotilul", "O pies\u0103 monobloc care pivoteaz\u0103 direct \u00een cartilajul acetabular natural"], "correct": 2, "explain": "Bipolara are o bil\u0103 femural\u0103 mic\u0103 \u00eentr-o cup\u0103 exterioar\u0103 mobil\u0103 c\u0103ptu\u0219it\u0103 cu polietilen\u0103; dubla articula\u021bie disipeaz\u0103 frecarea \u0219i \u00eent\u00e2rzie uzura cotilului nativ. Piesa monobloc care pivoteaz\u0103 direct \u00een cartilaj e chiar unipolara, cupa acetabular\u0103 fix\u0103 \u021bine de proteza total\u0103, iar ancorarea metafizar\u0103 de tijele scurte.", "tag": "Hemiartroplastia bipolar\u0103"}, {"q": "Ce pacien\u021bi vizeaz\u0103 tijele femurale scurte \u0219i proteza de resurfacing?", "opts": ["Pacien\u021bii tineri, cu stoc osos excelent", "Pacien\u021bii foarte v\u00e2rstnici, sedentari, cu fractur\u0103 de col", "Pacien\u021bii cu osteoporoz\u0103 \u0219i os metafizar fragil", "Pacien\u021bii opera\u021bi anterior, afla\u021bi la o revizie"], "correct": 0, "explain": "Ambele solu\u021bii conserv\u0103 colul femural (tija scurt\u0103 se ancoreaz\u0103 \u00een metafiz\u0103, resurfacingul acoper\u0103 doar capul) \u0219i au nevoie de os de foarte bun\u0103 calitate, deci se rezerv\u0103 tinerilor. V\u00e2rstnicul sedentar cu fractur\u0103 de col e candidatul hemiartroplastiei unipolare.", "tag": "Tije scurte \u0219i resurfacing"}, {"q": "Ce condi\u021bie obligatorie cere proteza anatomic\u0103 de um\u0103r?", "opts": ["Un deltoid puternic, care s\u0103 preia ridicarea", "O glenosfer\u0103 convex\u0103 fixat\u0103 pe scapul\u0103", "O balama lax\u0103, care rezist\u0103 la forfecare", "O coaf\u0103 a rotatorilor intact\u0103"], "correct": 3, "explain": "Proteza anatomic\u0103 reproduce geometria natural\u0103 (cap sferic pe glen\u0103 concav\u0103) \u0219i func\u021bioneaz\u0103 doar dac\u0103 coafa rotatorilor e complet intact\u0103. Glenosfera convex\u0103 \u0219i ridicarea preluat\u0103 de deltoid descriu proteza inversat\u0103; balamaua lax\u0103 \u021bine de proteza de cot.", "tag": "Proteza anatomic\u0103 de um\u0103r (TSA)"}, {"q": "Cum permite proteza inversat\u0103 de um\u0103r ridicarea bra\u021bului f\u0103r\u0103 coafa rotatorilor?", "opts": ["Mut\u0103 centrul de rota\u021bie lateral, iar supraspinosul lucreaz\u0103 mai eficient", "Leag\u0103 humerusul de scapul\u0103 printr-o balama care ghideaz\u0103 ridicarea", "Reproduce geometria natural\u0103, cu cap sferic pe o cup\u0103 glenoidian\u0103", "Mut\u0103 centrul de rota\u021bie medial \u0219i distal, iar deltoidul ridic\u0103 bra\u021bul"], "correct": 3, "explain": "rTSA inverseaz\u0103 geometria (glenosfer\u0103 convex\u0103 pe scapul\u0103, cup\u0103 concav\u0103 pe humerus) \u0219i mut\u0103 centrul de rota\u021bie medial \u0219i distal; astfel deltoidul poate prelua singur ridicarea bra\u021bului. Supraspinosul face parte chiar din coafa care lipse\u0219te, iar geometria natural\u0103 e a protezei anatomice.", "tag": "Proteza inversat\u0103 de um\u0103r (rTSA)"}, {"q": "De ce fixarea cimentat\u0103 permite sprijin precoce pe membrul operat?", "opts": ["Cimentul d\u0103 o stabilitate primar\u0103 imediat\u0103 a implantului", "Osul cre\u0219te \u00een porii implantului \u00eenc\u0103 din primele zile", "Implantul presat \u00een os se blocheaz\u0103 imediat prin frecare", "Cimentul se resoarbe \u0219i las\u0103 osul s\u0103 preia sarcina"], "correct": 0, "explain": "PMMA lucreaz\u0103 ca un mortar viscoelastic care repartizeaz\u0103 presiunile \u00eentre implant \u0219i os, iar stabilitatea mecanic\u0103 e imediat\u0103, deci se poate c\u0103lca total sau la toleran\u021b\u0103 devreme. Cre\u0219terea osului \u00een pori (osteointegrarea) \u0219i presarea press-fit \u021bin de fixarea necimentat\u0103 \u0219i dureaz\u0103 6\u20138 s\u0103pt\u0103m\u00e2ni.", "tag": "Fixarea cimentat\u0103"}, {"q": "De ce dup\u0103 fixarea necimentat\u0103 se \u00eencarc\u0103 par\u021bial 6\u20138 s\u0103pt\u0103m\u00e2ni?", "opts": ["Fixarea secundar\u0103 a\u0219teapt\u0103 cre\u0219terea osului \u00een porii implantului", "Cimentul din jurul implantului are nevoie de timp s\u0103 se \u00eent\u0103reasc\u0103", "Insertul de polietilen\u0103 se uzeaz\u0103 mai repede sub greutatea \u00eentreag\u0103", "Ligamentele din jurul articula\u021biei trebuie s\u0103 se readapteze la implant"], "correct": 0, "explain": "Implantul necimentat (titan poros, trabecular sau hidroxiapatit\u0103, introdus press-fit) se fixeaz\u0103 definitiv prin osteointegrare \u00een 6\u20138 s\u0103pt\u0103m\u00e2ni; p\u00e2n\u0103 atunci pacientul \u00eencarc\u0103 15\u201330% din greutate. Varianta cu cimentul e o capcan\u0103: fixarea necimentat\u0103 nu folose\u0219te ciment.", "tag": "Fixarea necimentat\u0103 (biologic\u0103)"}, {"q": "Ce combina\u021bie folose\u0219te fixarea hibrid\u0103 clasic\u0103 la \u0219old?", "opts": ["Cup\u0103 acetabular\u0103 cimentat\u0103 \u0219i tij\u0103 femural\u0103 necimentat\u0103", "Cup\u0103 acetabular\u0103 necimentat\u0103 \u0219i tij\u0103 femural\u0103 cimentat\u0103", "Cup\u0103 \u0219i tij\u0103 cimentate, cu un insert ceramic \u00eentre ele", "Cup\u0103 \u0219i tij\u0103 necimentate, acoperite cu hidroxiapatit\u0103"], "correct": 1, "explain": "Hibrida clasic\u0103: cup\u0103 necimentat\u0103, tij\u0103 cimentat\u0103. Combina\u021bia invers\u0103 (cup\u0103 cimentat\u0103, tij\u0103 necimentat\u0103) e hibrida inversat\u0103; alegerea \u021bine de densitatea osoas\u0103 local\u0103.", "tag": "Fixarea hibrid\u0103 \u0219i hibrid\u0103 inversat\u0103"}, {"q": "Ce risc specific are cuplul de frecare ceramic\u0103 pe ceramic\u0103?", "opts": ["Eliberarea \u00een s\u00e2nge a ionilor de cobalt \u0219i crom", "Fractura casant\u0103 \u0219i sc\u00e2r\u021b\u00e2itul articular", "Uzura microscopic\u0103 a insertului de polietilen\u0103", "Reac\u021biile pseudotumorale din jurul implantului"], "correct": 1, "explain": "CoC are cea mai mic\u0103 frecare \u0219i o bioiner\u021bie excep\u021bional\u0103, dar e fragil la \u0219ocuri mari: fractur\u0103 casant\u0103 \u0219i sc\u00e2r\u021b\u00e2it (squeaking). Ionii de cobalt \u0219i crom \u0219i reac\u021biile pseudotumorale sunt motivele abandon\u0103rii metalului pe metal; uzura polietilenei \u021bine de cuplurile cu polietilen\u0103.", "tag": "Ceramic\u0103 pe ceramic\u0103 (CoC)"}, {"q": "De ce a fost abandonat clinic cuplul metal pe metal?", "opts": ["Produce fracturi casante \u0219i sc\u00e2r\u021b\u00e2it articular la \u0219ocurile mari de impact", "Genereaz\u0103 uzur\u0103 polietilenic\u0103 microscopic\u0103 \u0219i osteoliz\u0103 \u00een jurul tijei", "Elibereaz\u0103 ioni toxici de cobalt \u0219i crom \u0219i produce reac\u021bii pseudotumorale", "Are cel mai mare coeficient de frecare dintre cuplurile folosite azi"], "correct": 2, "explain": "MoM elibereaz\u0103 \u00een circula\u021bie ioni de cobalt \u0219i crom \u0219i declan\u0219eaz\u0103 reac\u021bii adverse pseudotumorale periprotetice. Fractura casant\u0103 \u0219i sc\u00e2r\u021b\u00e2itul sunt riscurile ceramicii pe ceramic\u0103, iar uzura polietilenic\u0103 a cuplurilor cu insert de polietilen\u0103.", "tag": "Metal pe metal (MoM)"}, {"q": "Ce avantaj are o protez\u0103 de membru inferior endoscheletic\u0103 fa\u021b\u0103 de una exoscheletic\u0103?", "opts": ["Permite reglarea aliniamentului \u0219i schimbarea modulelor", "Rezist\u0103 mai bine la intemperii \u0219i la \u0219ocuri mecanice", "Peretele ei exterior preia singur sarcina de sprijin", "Are un \u00eenveli\u0219 cosmetic dur, f\u0103r\u0103 hus\u0103 de spum\u0103"], "correct": 0, "explain": "Endoscheletica are un pylon (tub metalic sau din carbon) cu adaptoare reglabile \u00een plan sagital \u0219i frontal, sub o hus\u0103 moale de spum\u0103: aliniament reglabil \u0219i componente modulare. Peretele dur care e \u0219i structur\u0103 portant\u0103, \u0219i rezisten\u021ba la intemperii descriu proteza exoscheletic\u0103.", "tag": "Proteza endoscheletic\u0103 (modular\u0103)"}, {"q": "Pe ce zone descarc\u0103 greutatea cupa transtibial\u0103 PTB?", "opts": ["Pe toat\u0103 suprafa\u021ba bontului, printr-un man\u0219on de silicon", "Pe tendonul patelar, condilii tibiali \u0219i diafiza peronier\u0103", "Pe condilii femurali, prin aripioare laterale \u00eenalte", "Pe capul peroneului \u0219i pe creasta tibial\u0103 anterioar\u0103"], "correct": 1, "explain": "PTB (Patellar Tendon Bearing) sprijin\u0103 pe tendonul patelar, condilii tibiali \u0219i diafiza peronier\u0103, iar pe capul peroneului \u0219i pe creasta tibial\u0103 are tocmai concavit\u0103\u021bi de desc\u0103rcare. Sprijinul pe toat\u0103 suprafa\u021ba e cupa TSB, aripioarele peste condilii femurali sunt ale cupei PTS.", "tag": "Cupa PTB"}]}, {"id": "2", "eticheta": "Runda 2 \u00b7 Aplica\u021bii", "titlu": "Runda 2 \u2014 Cazuri \u0219i ra\u021bionament clinic", "desc": "Situa\u021bii clinice: alegi dispozitivul, interpretezi semnele, decizi ce urmeaz\u0103.", "intrebari": [{"q": "O pacient\u0103 de 84 de ani, sedentar\u0103, \u00ee\u0219i fractureaz\u0103 colul femural; cartilajul acetabular e bun. Ce implant e indicat?", "opts": ["O protez\u0103 de resurfacing, care acoper\u0103 doar suprafa\u021ba capului femural", "O protez\u0103 cu tij\u0103 scurt\u0103, ancorat\u0103 metafizar \u00een femur", "O hemiartroplastie unipolar\u0103, care \u00eenlocuie\u0219te doar capul \u0219i colul", "O protez\u0103 PTS cu cuplu de frecare ceramic\u0103 pe ceramic\u0103"], "correct": 2, "explain": "Pacientul foarte v\u00e2rstnic \u0219i sedentar cu fractur\u0103 de col e candidatul tipic pentru proteza cervicocefalic\u0103 unipolar\u0103 (Austin-Moore, Thompson), care pivoteaz\u0103 direct \u00een cartilajul natural. Resurfacingul \u0219i tijele scurte cer os excelent \u0219i pacient t\u00e2n\u0103r; o protez\u0103 total\u0103 cu ceramic\u0103 ar fi o solu\u021bie pentru un pacient activ.", "tag": "Hemiartroplastia unipolar\u0103"}, {"q": "Un b\u0103rbat activ de 58 de ani are artroz\u0103 doar \u00een compartimentul medial al genunchiului; ligamentele \u00eencruci\u0219ate sunt intacte, iar el vrea o recuperare rapid\u0103 a mobilit\u0103\u021bii. Ce implant i se potrive\u0219te?", "opts": ["O protez\u0103 PUG, care p\u0103streaz\u0103 celelalte structuri", "O protez\u0103 PS, cu rezec\u021bia ligamentului \u00eencruci\u0219at posterior", "O protez\u0103 semiconstr\u00e2ns\u0103 CCK, cu pivot central \u00eenalt", "O protez\u0103 patelofemural\u0103 izolat\u0103, pe trohlee \u0219i rotul\u0103"], "correct": 0, "explain": "Leziunea limitat\u0103 la un compartiment, cu ligamente \u00eencruci\u0219ate intacte, e indica\u021bia PUG: p\u0103streaz\u0103 restul genunchiului \u0219i propriocep\u021bia, cu recuperare rapid\u0103. PS \u0219i CCK sacrific\u0103 sau constr\u00e2ng inutil; proteza patelofemural\u0103 ar trata alt compartiment dec\u00e2t cel bolnav.", "tag": "Proteza unicompartimental\u0103 (PUG)"}, {"q": "O pacient\u0103 de 72 de ani are artroz\u0103 de um\u0103r \u0219i o ruptur\u0103 masiv\u0103, ireparabil\u0103, a coafei rotatorilor; deltoidul func\u021bioneaz\u0103. Ce protez\u0103 \u00eei poate reda ridicarea bra\u021bului?", "opts": ["Proteza inversat\u0103, cu glenosfer\u0103 convex\u0103 pe scapul\u0103", "Proteza anatomic\u0103, cu cap sferic pe o glen\u0103 concav\u0103", "Proteza anatomic\u0103, urmat\u0103 de \u00eent\u0103rirea supraspinosului", "O protez\u0103 cu balama lax\u0103, care rezist\u0103 la forfecare"], "correct": 0, "explain": "F\u0103r\u0103 coaf\u0103, proteza anatomic\u0103 nu poate func\u021biona (coafa intact\u0103 e condi\u021bia ei obligatorie), iar supraspinosul face parte chiar din coafa rupt\u0103. rTSA mut\u0103 centrul de rota\u021bie medial \u0219i distal, astfel \u00eenc\u00e2t deltoidul ridic\u0103 singur bra\u021bul. Balamaua lax\u0103 descrie proteza de cot.", "tag": "Proteza inversat\u0103 de um\u0103r (rTSA)"}, {"q": "Un t\u00e2mplar cu protez\u0103 total\u0103 de cot semiconstr\u00e2ns\u0103 vrea s\u0103 revin\u0103 la c\u0103rat saci de 25 kg dup\u0103 recuperare. Ce i se explic\u0103?", "opts": ["Poate, dup\u0103 6\u20138 s\u0103pt\u0103m\u00e2ni de osteointegrare a implantului", "Nu poate: implantul limit\u0103 ridicarea la 3\u20135 kg, pe via\u021b\u0103", "Poate, dac\u0103 poart\u0103 la efort o ortez\u0103 de cot cu balamale", "Nu \u00een primul an; apoi cre\u0219te treptat greutatea spre 10 kg"], "correct": 1, "explain": "Proteza de cot cu balama lax\u0103 semiconstr\u00e2ns\u0103 rezist\u0103 la forfecare, dar impune ridicarea a cel mult 3\u20135 kg pentru tot restul vie\u021bii. Osteointegrarea prive\u0219te fixarea necimentat\u0103 \u0219i nu ridic\u0103 limita; nici orteza, nici o cre\u0219tere treptat\u0103 nu schimb\u0103 restric\u021bia implantului.", "tag": "Proteza total\u0103 de cot"}, {"q": "Dou\u0103 paciente au primit aceea\u0219i zi o protez\u0103 total\u0103 de \u0219old: A cu fixare cimentat\u0103, B cu fixare necimentat\u0103 press-fit. Ce sprijin li se permite \u00een prima s\u0103pt\u0103m\u00e2n\u0103?", "opts": ["A poate c\u0103lca la toleran\u021b\u0103; B r\u0103m\u00e2ne la 15\u201330% din greutate", "Am\u00e2ndou\u0103 r\u0103m\u00e2n la 15\u201330% din greutate p\u00e2n\u0103 la 8 s\u0103pt\u0103m\u00e2ni", "A r\u0103m\u00e2ne la 15\u201330% din greutate; B poate c\u0103lca la toleran\u021b\u0103", "Am\u00e2ndou\u0103 pot c\u0103lca la toleran\u021b\u0103 din prima zi postoperator"], "correct": 0, "explain": "Cimentul d\u0103 stabilitate primar\u0103 imediat\u0103, deci sprijin total sau la toleran\u021b\u0103 precoce. Implantul necimentat a\u0219teapt\u0103 osteointegrarea 6\u20138 s\u0103pt\u0103m\u00e2ni, timp \u00een care pacientul \u00eencarc\u0103 par\u021bial, 15\u201330%. Inversarea celor dou\u0103 e gre\u0219eala tipic\u0103.", "tag": "Fixarea necimentat\u0103 (biologic\u0103)"}, {"q": "Un pacient de 45 de ani, activ, prime\u0219te o protez\u0103 de \u0219old. Chirurgul vrea uzur\u0103 redus\u0103, dar f\u0103r\u0103 riscul de fractur\u0103 casant\u0103 \u0219i sc\u00e2r\u021b\u00e2it. Ce cuplu de frecare alege?", "opts": ["Ceramic\u0103 pe ceramic\u0103, cu frecarea cea mai sc\u0103zut\u0103", "Ceramic\u0103 pe polietilen\u0103 reticulat\u0103 cu vitamina E", "Metal pe polietilen\u0103 conven\u021bional\u0103, foarte robust", "Metal pe metal, f\u0103r\u0103 polietilen\u0103 care s\u0103 se uzeze"], "correct": 1, "explain": "CoP are coeficient de frecare sc\u0103zut \u0219i uzur\u0103 redus\u0103, potrivit pacien\u021bilor activi, f\u0103r\u0103 fragilitatea ceramicii pe ceramic\u0103. MoP e robust, dar produce \u00een timp uzur\u0103 polietilenic\u0103; MoM a fost abandonat din cauza ionilor de cobalt \u0219i crom.", "tag": "Ceramic\u0103 pe polietilen\u0103 (CoP)"}, {"q": "Un amputat transtibial lucreaz\u0103 la c\u00e2mp, \u00een ploaie \u0219i praf, cu multe \u0219ocuri, \u0219i ajunge rar la atelier pentru reglaje. Ce arhitectur\u0103 de protez\u0103 e mai potrivit\u0103 pentru el?", "opts": ["Endoscheletic\u0103: tubul de carbon rezist\u0103 mai bine la intemperii \u0219i praf", "Exoscheletic\u0103: rezistent\u0103 mecanic \u0219i la intemperii, de\u0219i mai grea", "Endoscheletic\u0103: permite reglarea aliniamentului chiar pe c\u00e2mp", "Exoscheletic\u0103: permite schimbarea modular\u0103 a componentelor"], "correct": 1, "explain": "Proteza exoscheletic\u0103 are peretele din r\u0103\u0219in\u0103 laminat\u0103 dur\u0103, care e structur\u0103 portant\u0103 \u0219i form\u0103 cosmetic\u0103: foarte rezistent\u0103 mecanic \u0219i la intemperii, dar grea \u0219i f\u0103r\u0103 reglaje de aliniament. Reglajele \u0219i modularitatea sunt avantajele endoscheleticei, care nu conteaz\u0103 aici.", "tag": "Proteza exoscheletic\u0103"}, {"q": "Un amputat transtibial are pielea bontului fragil\u0103, care se irit\u0103 la forfecare. Ce cup\u0103 protejeaz\u0103 cel mai bine pielea?", "opts": ["PTB, cu sprijin principal pe tendonul patelar", "PTS, cu aripioare \u00eenalte peste condilii femurali", "TSB, cu desc\u0103rcare uniform\u0103 \u0219i man\u0219on intern de silicon", "O cup\u0103 cu sprijin pe tuberozitatea ischiatic\u0103"], "correct": 2, "explain": "Cupa TSB (Total Surface Bearing) distribuie hidrostatic sarcina pe toat\u0103 suprafa\u021ba bontului, iar man\u0219onul de silicon amortizeaz\u0103 forfecarea cutanat\u0103. PTB concentreaz\u0103 sprijinul pe zone anume, PTS e despre autosuspensie, iar sprijinul ischiatic \u021bine de cupele transfemurale.", "tag": "Cupa TSB"}, {"q": "Un amputat transfemural cu cup\u0103 patrulater\u0103 merge \u00eenclin\u00e2nd trunchiul lateral, iar femurul din cup\u0103 deviaz\u0103 \u00een abduc\u021bie. Ce cup\u0103 ar corecta problema?", "opts": ["O cup\u0103 patrulater\u0103 mai orizontalizat\u0103, cu sprijin ischiatic mai lat", "Cupa PTB, cu sprijin pe tendonul patelar \u0219i pe condili", "O cup\u0103 cu liner \u0219i pin, care elimin\u0103 jocul \u00een cup\u0103", "Cupa cu conten\u021bie ischiatic\u0103, care \u021bine femurul \u00een adduc\u021bie"], "correct": 3, "explain": "Devierea \u00een abduc\u021bie e dezavantajul cupei patrulatere. Cupa cu conten\u021bie ischiatic\u0103 (CAT-CAM) \u00eenglobeaz\u0103 tuberozitatea ischiatic\u0103 \u0219i ramura ischiopubian\u0103 \u0219i men\u021bine femurul \u00een adduc\u021bie fiziologic\u0103, pentru un randament bun al fesierilor la mers. PTB e o cup\u0103 transtibial\u0103; pinul \u021bine de suspensie, nu de aliniere.", "tag": "Cupa cu conten\u021bie ischiatic\u0103"}, {"q": "Un amputat simte c\u0103 bontul \u201ejoac\u0103\u201d \u00een sus \u0219i \u00een jos \u00een cup\u0103 la fiecare pas, iar pielea bontului e palid\u0103, slab irigat\u0103. Ce sistem de suspensie rezolv\u0103 ambele probleme?", "opts": ["Vacuumul activ, cu pomp\u0103 care men\u021bine o presiune negativ\u0103 constant\u0103", "Linerul de silicon cu pin, care se blocheaz\u0103 cu un clic sigur \u00een baza cupei", "Cureaua silesian\u0103, folosit\u0103 pentru bonturile foarte scurte", "Piciorul SACH, cu un c\u0103lc\u00e2i din spum\u0103 care amortizeaz\u0103 \u0219ocul"], "correct": 0, "explain": "Mi\u0219carea \u00een sus \u0219i-n jos e pistonajul. Vacuumul activ (Harmony, e-Pulse) men\u021bine 15\u201320 inHg presiune negativ\u0103, elimin\u0103 jocul axial \u0219i stimuleaz\u0103 vasculariza\u021bia bontului. Pinul d\u0103 siguran\u021ba clicului, dar nu irig\u0103 bontul; cureaua silesian\u0103 e pentru bonturi foarte scurte, iar piciorul nu e un sistem de suspensie.", "tag": "Vacuum activ"}, {"q": "Un amputat transfemural v\u00e2rstnic \u0219i fragil se deplaseaz\u0103 doar prin cas\u0103, cu un ritm constant al pasului. Ce componente se potrivesc nivelului lui de mobilitate?", "opts": ["Genunchi cu microprocesor \u0219i picior ESR din carbon", "Genunchi hidraulic \u0219i picior multiaxial pentru teren", "Genunchi cu blocare manual\u0103 \u0219i picior SACH", "Genunchi policentric \u0219i picior bionic cu micromotor"], "correct": 2, "explain": "Deplasarea limitat\u0103 de interior, la caden\u021b\u0103 fix\u0103, \u00eenseamn\u0103 nivelul K1, pentru care se prescriu piciorul SACH \u0219i genunchiul cu blocare manual\u0103 (stabilitate maxim\u0103). MPK \u0219i lamele ESR \u021bin de K3; reglarea vitezei la hidraulic conteaz\u0103 doar la caden\u021b\u0103 variabil\u0103.", "tag": "Clasificarea K-Levels"}, {"q": "La o s\u0103pt\u0103m\u00e2n\u0103 dup\u0103 o protez\u0103 de \u0219old cu abord posterolateral, un pacient vrea s\u0103-\u0219i lege \u0219iretul st\u00e2nd pe un fotoliu jos, cu piciorul operat \u00eencruci\u0219at peste cel\u0103lalt. Ce reguli antiluxante \u00eencalc\u0103?", "opts": ["Doar flexia peste 90\u00b0; \u00eencruci\u0219area e permis\u0103", "Doar adduc\u021bia peste linia median\u0103 a corpului", "Rota\u021bia extern\u0103 \u0219i abduc\u021bia membrului operat", "Flexia peste 90\u00b0 \u0219i adduc\u021bia peste linia median\u0103"], "correct": 3, "explain": "Aplecarea la \u0219iret pe un fotoliu jos duce \u0219oldul peste 90\u00b0 de flexie, iar \u00eencruci\u0219area picioarelor e adduc\u021bie peste linia median\u0103 \u2014 dou\u0103 dintre cele trei reguli. A treia interzice rota\u021bia intern\u0103; rota\u021bia u\u0219or spre exterior \u0219i abduc\u021bia (perna dintre coapse) sunt chiar recomandate.", "tag": "Reguli antiluxante la \u0219old"}, {"q": "\u00cen a treia zi dup\u0103 o protez\u0103 de genunchi, un pacient doarme cu o pern\u0103 sub genunchi, pentru c\u0103 a\u0219a \u00eel doare mai pu\u021bin. Cum se evalueaz\u0103 obiceiul?", "opts": ["Corect: perna \u021bine membrul decliv \u0219i reduce edemul postoperator", "Gre\u0219it: perna \u00eel \u00eempiedic\u0103 s\u0103 rec\u00e2\u0219tige extensia complet\u0103 de 0\u00b0", "Corect, dac\u0103 ziua face izometrie viguroas\u0103 de cvadriceps", "Gre\u0219it: perna cre\u0219te riscul de luxa\u021bie a protezei de genunchi"], "correct": 1, "explain": "\u00cen faza acut\u0103, la genunchi prioritatea major\u0103 e extensia complet\u0103 de 0\u00b0, iar plasarea pernelor sub genunchi se evit\u0103. Drenajul decliv se face cu membrul ridicat la 30\u00b0, nu cu genunchiul flectat; regulile antiluxante \u021bin de proteza de \u0219old.", "tag": "Faza acut\u0103 (zilele 0\u201314)"}, {"q": "Un amputat transfemural petrece mult timp \u00een fotoliu \u0219i a \u00eenceput s\u0103 nu-\u0219i mai poat\u0103 \u00eentinde complet \u0219oldul. Ce m\u0103sur\u0103 de preg\u0103tire a bontului e indicat\u0103?", "opts": ["O pern\u0103 sub coaps\u0103, ca bontul s\u0103 stea ridicat", "Bandaj \u00een opt, cu presiune maxim\u0103 proximal", "Decubit ventral zilnic, 30\u201345 de minute", "Fric\u021biuni bl\u00e2nde cu texturi gradate pe bont"], "correct": 2, "explain": "Contractura \u00een flexie a \u0219oldului se previne prin decubit ventral zilnic 30\u201345 de minute, care \u00eentinde flexorii \u0219oldului. Perna sub coaps\u0103 ar men\u021bine flexia, bandajul se str\u00e2nge maxim distal (nu proximal), iar fric\u021biunile cu texturi servesc la desensibilizare.", "tag": "Preg\u0103tirea bontului"}, {"q": "La 10 zile dup\u0103 o protez\u0103 de genunchi, gamba operat\u0103 e umflat\u0103 asimetric, cald\u0103, indurat\u0103 \u0219i dureroas\u0103 la dorsiflexia piciorului; pacientul nu are febr\u0103. Ce face kinetoterapeutul?", "opts": ["Continu\u0103 \u0219edin\u021ba, cu drenaj postural decliv la 30\u00b0 \u0219i pompaj venos repetat", "Aplic\u0103 crioterapie 20 de minute, apoi reia exerci\u021biile programate", "Opre\u0219te \u0219edin\u021ba \u0219i \u00eel trimite la medic, cu suspiciune de infec\u021bie", "Opre\u0219te \u0219edin\u021ba \u0219i \u00eel trimite la medic, cu suspiciune de tromboz\u0103 venoas\u0103"], "correct": 3, "explain": "Tumefierea asimetric\u0103, c\u0103ldura, indura\u021bia \u0219i semnul Homans pozitiv indic\u0103 TVP \u2014 semn de alarm\u0103 absolut\u0103 care opre\u0219te \u0219edin\u021ba. Pompajul venos sau crioterapia nu se fac peste o tromboz\u0103 suspectat\u0103; infec\u021bia periprotetic\u0103 ar avea febr\u0103, frisoane \u0219i secre\u021bie din cicatrice.", "tag": "Semne de alarm\u0103 (red flags)"}]}]}], "teste": [{"desc": "20 de \u00eentreb\u0103ri ascunse \u2014 nu apar \u00een paginile capitolelor \u0219i nu se repet\u0103 \u00een alt quiz final.", "intrebari": [{"q": "Ce urm\u0103re\u0219te bandajarea bontului \u00een spic de gr\u00e2u?", "opts": ["Desensibilizarea pielii bontului prin texturi gradate", "Un bont cilindric, cu presiune maxim\u0103 la r\u0103d\u0103cina lui", "Un bont conic, cu presiune maxim\u0103 distal \u0219i f\u0103r\u0103 garou", "\u00centinderea flexorilor \u0219oldului prin decubit ventral"], "correct": 2, "explain": "Bandajul se aplic\u0103 doar \u00een opt, cu presiune maxim\u0103 distal: bontul devine conic \u0219i se evit\u0103 garoul vascular. Presiunea maxim\u0103 proximal ar strangula circula\u021bia; texturile gradate \u0219i decubitul ventral sunt alte componente ale preg\u0103tirii bontului (desensibilizarea \u0219i prevenirea contracturilor).", "tag": "Preg\u0103tirea bontului", "src": "Cap. 2 (Ghid practic de protezare \u0219i reabilitare func\u021bional\u0103)"}, {"q": "Ce face un AFO articulat, spre deosebire de unul rigid?", "opts": ["Las\u0103 v\u00e2rful s\u0103 cad\u0103, dar blocheaz\u0103 \u00eendoirea gleznei \u00eenainte la sprijin", "Blocheaz\u0103 glezna la 90\u00b0, dar permite rota\u021bia ei lateral\u0103", "Opre\u0219te c\u0103derea v\u00e2rfului, dar las\u0103 glezna s\u0103 se \u00eendoaie \u00eenainte", "\u00cempinge genunchiul \u00een extensie la fiecare sprijin ferm pe talp\u0103"], "correct": 2, "explain": "Balamalele AFO-ului articulat nu las\u0103 piciorul s\u0103 cad\u0103 c\u00e2nd e ridicat de pe sol, dar permit flexia \u00eenainte a gleznei c\u00e2nd omul calc\u0103 \u2014 mersul e mai fluid. Varianta invers\u0103 descrie exact opusul, iar \u00eempingerea genunchiului \u00een extensie e rolul ortezei de reac\u021bie la sol.", "tag": "AFO articulat (cu balamale)", "src": "Cap. 1 (Ghid practic de ortezare)"}, {"q": "La prima opera\u021bie de genunchi, o pacient\u0103 are laxitate masiv\u0103 a ligamentului colateral medial \u0219i o pierdere osoas\u0103 asimetric\u0103, f\u0103r\u0103 anchiloz\u0103. Ce implant \u00eei d\u0103 stabilitate \u00een varus\u2013valg?", "opts": ["O protez\u0103 unicompartimental\u0103 pe partea afectat\u0103", "O protez\u0103 CR, care se sprijin\u0103 pe ligamentul posterior", "O protez\u0103 PS, cu pivot \u0219i cam\u0103 contra transla\u021biei", "O protez\u0103 semiconstr\u00e2ns\u0103 CCK, cu pivot central \u00eenalt"], "correct": 3, "explain": "Laxitatea colateral\u0103 masiv\u0103 \u0219i pierderea osoas\u0103 asimetric\u0103 sunt indica\u021biile CCK, al c\u0103rei pivot \u00eenalt d\u0103 stabilitate frontal\u0103. Pivotul \u0219i cama PS controleaz\u0103 doar transla\u021bia anterioar\u0103; CR \u0219i PUG se bazeaz\u0103 pe ligamente proprii func\u021bionale.", "tag": "Proteza semiconstr\u00e2ns\u0103 (CCK)", "src": "Cap. 2 (Ghid practic de protezare \u0219i reabilitare func\u021bional\u0103)"}, {"q": "Ce dezavantaj are cupa transfemural\u0103 patrulater\u0103?", "opts": ["\u021aine femurul blocat \u00een adduc\u021bie for\u021bat\u0103", "Las\u0103 femurul s\u0103 devieze \u00een abduc\u021bie", "\u00cenglobeaz\u0103 ramura ischiopubian\u0103 \u00een cup\u0103", "Comprim\u0103 fesa prin contururi foarte joase"], "correct": 1, "explain": "Cupa patrulater\u0103 are form\u0103 orizontalizat\u0103 \u0219i sprijin direct pe tuberozitatea ischiatic\u0103, dar tinde s\u0103 lase femurul \u00een abduc\u021bie. Men\u021binerea adduc\u021biei fiziologice \u0219i \u00eenglobarea ramurii ischiopubiene sunt chiar avantajele cupei cu conten\u021bie ischiatic\u0103; contururile joase \u021bin de cupa MAS, care elibereaz\u0103 fesa.", "tag": "Cupa patrulater\u0103", "src": "Cap. 2 (Ghid practic de protezare \u0219i reabilitare func\u021bional\u0103)"}, {"q": "C\u00e2t limiteaz\u0103 un guler cervical moale mi\u0219c\u0103rile g\u00e2tului?", "opts": ["Aproximativ 10\u201315%", "Aproximativ 50%", "Aproximativ 30\u201340%", "Aproximativ 70%"], "correct": 0, "explain": "Gulerul de burete opre\u0219te doar 10\u201315% din mi\u0219c\u0103ri: e mai degrab\u0103 un fular care \u021bine mu\u0219chii calzi \u0219i aminte\u0219te de evitarea mi\u0219c\u0103rilor bru\u0219te. Circa 70% blocheaz\u0103 gulerul rigid Philadelphia, folosit la fracturi cervicale.", "tag": "Gulerul cervical moale", "src": "Cap. 1 (Ghid practic de ortezare)"}, {"q": "Un adolescent are bolta piciorului pr\u0103bu\u0219it\u0103 spre interior, c\u0103lc\u00e2iul deviat \u0219i genunchii apropia\u021bi \u00een X; piciorul se corecteaz\u0103 u\u0219or cu m\u00e2na. Ce ortez\u0103 i se face?", "opts": ["Un sus\u021bin\u0103tor rigid, modelat pe talp\u0103, care ridic\u0103 bolta", "Un AFO rigid, care blocheaz\u0103 glezna la 90\u00b0 la fiecare pas", "Un bran\u021b moale din gel, care preia presiunea de pe oase", "O genunchier\u0103 de desc\u0103rcare, care mut\u0103 greutatea lateral"], "correct": 0, "explain": "Platfusul flexibil se corecteaz\u0103 cu un sus\u021bin\u0103tor rigid care ridic\u0103 bolta \u0219i \u021bine c\u0103lc\u00e2iul drept, realiniind corpul p\u00e2n\u0103 la coloan\u0103. Bran\u021bul moale e pentru protec\u021bia t\u0103lpii diabetice; AFO-ul rigid \u0219i genunchiera trateaz\u0103 alte probleme.", "tag": "Sus\u021bin\u0103tor rigid \u00een platfus", "src": "Cap. 1 (Ghid practic de ortezare)"}, {"q": "Ce face genunchiul protetic policentric \u00een faza de pendulare?", "opts": ["Ajusteaz\u0103 rezisten\u021ba hidraulic\u0103 \u00een timp real", "Scurteaz\u0103 membrul \u0219i previne ag\u0103\u021barea v\u00e2rfului de sol", "Fr\u00e2neaz\u0103 flexia c\u00e2nd greutatea vine pe c\u0103lc\u00e2i", "Blocheaz\u0103 genunchiul \u00een extensie p\u00e2n\u0103 la a\u0219ezarea pe scaun"], "correct": 1, "explain": "La genunchiul policentric (4 sau 7 axe) centrul instantaneu de rota\u021bie se mut\u0103 posterior \u0219i superior \u00een extensie (stabilitate \u00een sprijin), iar \u00een pendulare membrul se scurteaz\u0103. Blocarea p\u00e2n\u0103 la a\u0219ezare \u0219i fr\u00e2na de fric\u021biune \u021bin de genunchii monoaxiali, ajustarea \u00een timp real de MPK.", "tag": "Genunchi policentric", "src": "Cap. 2 (Ghid practic de protezare \u0219i reabilitare func\u021bional\u0103)"}, {"q": "Cum ac\u021bioneaz\u0103 banda de contrapresiune din epicondilit\u0103?", "opts": ["\u021aine pumnul \u00een extensie, ca tendonul s\u0103 se scurteze \u0219i s\u0103 cedeze", "Absoarbe for\u021ba pe antebra\u021b \u00eenainte s\u0103 ajung\u0103 la tendonul de la cot", "Comprim\u0103 direct cotul, ca umfl\u0103tura tendonului s\u0103 scad\u0103", "Imobilizeaz\u0103 cotul \u00een flexie, ca tendonul suprasolicitat s\u0103 se odihneasc\u0103"], "correct": 1, "explain": "Banda se str\u00e2nge pe antebra\u021b, la dou\u0103 degete sub cot, \u0219i func\u021bioneaz\u0103 ca o punte: preia \u0219ocul mi\u0219c\u0103rii \u00eenainte ca for\u021ba s\u0103 ajung\u0103 la tendon, care se vindec\u0103 chiar dac\u0103 omul lucreaz\u0103. Nu imobilizeaz\u0103 cotul \u0219i nu se pune pe cot.", "tag": "Epicondilita: banda de contrapresiune", "src": "Cap. 1 (Ghid practic de ortezare)"}, {"q": "Un amputat de 40 de ani, care merge independent prin ora\u0219, se \u00eempiedic\u0103 uneori \u0219i ar vrea s\u0103 coboare sc\u0103rile alternant, ca \u00eenainte. Ce genunchi protetic i se potrive\u0219te?", "opts": ["Un genunchi monoaxial cu blocare manual\u0103, deblocat pentru a\u0219ezare", "Un genunchi cu microprocesor, care adapteaz\u0103 rezisten\u021ba \u00een timp real", "Un genunchi monoaxial cu fr\u00e2n\u0103 de fric\u021biune la \u00eenc\u0103rcarea c\u0103lc\u00e2iului", "Un genunchi policentric, care scurteaz\u0103 membrul \u00een pendulare"], "correct": 1, "explain": "MPK (C-Leg, Genium) cite\u0219te for\u021bele \u0219i unghiurile de 50\u2013100 de ori pe secund\u0103 \u0219i adapteaz\u0103 rezisten\u021ba hidraulic\u0103: previne c\u0103derile la \u00eempiedicare \u0219i permite cobor\u00e2rea alternant\u0103 a sc\u0103rilor; se potrive\u0219te nivelului K3. Blocarea manual\u0103 e pentru pacien\u021bi fragili, K1.", "tag": "Genunchi cu microprocesor (MPK)", "src": "Cap. 2 (Ghid practic de protezare \u0219i reabilitare func\u021bional\u0103)"}, {"q": "Cum deschide pacientul c\u00e2rligul unei proteze de bra\u021b ac\u021bionate de corp?", "opts": ["Prin co-contrac\u021bii care comut\u0103 \u00eentre prize predefinite", "Prin contrac\u021bia extensorilor, captat\u0103 de electrozi", "Prin protrac\u021bia um\u0103rului, care trage un cablu Bowden", "Prin motorul din fiecare deget, comandat din aplica\u021bie"], "correct": 2, "explain": "Proteza body-powered are un harna\u0219ament \u00een opt pe centura scapular\u0103, legat de un cablu de o\u021bel Bowden; protrac\u021bia um\u0103rului sau flexia bra\u021bului trage cablul \u0219i deschide c\u00e2rligul (split hook) sau m\u00e2na mecanic\u0103. Electrozii, co-contrac\u021biile \u0219i motoarele din degete \u021bin de protezele mioelectrice \u0219i bionice.", "tag": "Proteze ac\u021bionate de corp", "src": "Cap. 2 (Ghid practic de protezare \u0219i reabilitare func\u021bional\u0103)"}, {"q": "De ce, dup\u0103 sutura coafei rotatorilor, bra\u021bul st\u0103 pe o pern\u0103 la 30\u201345\u00b0 lateral?", "opts": ["Um\u0103rul e mobilizat pasiv, u\u0219or, la fiecare respira\u021bie a pacientului", "Tendoanele se relaxeaz\u0103, iar greutatea bra\u021bului nu trage de sutur\u0103", "Deltoidul r\u0103m\u00e2ne \u00eentins, iar atrofia lui e prevenit\u0103", "Capul humeral e \u00eempins mai ad\u00e2nc \u0219i mai stabil \u00een cavitatea glenoid\u0103"], "correct": 1, "explain": "L\u0103sat s\u0103 at\u00e2rne lipit de corp, bra\u021bul ar trage cu greutatea lui de cus\u0103tura coafei. Pe perna de abduc\u021bie tendoanele sunt relaxate \u0219i bine irigate, iar vindecarea e mai pu\u021bin dureroas\u0103.", "tag": "Um\u0103rul: orteza cu pern\u0103 de abduc\u021bie", "src": "Cap. 1 (Ghid practic de ortezare)"}, {"q": "Un pacient diabetic \u00ee\u0219i scoate orteza dup\u0103 o zi de purtare. Dup\u0103 45 de minute, pielea de pe maleol\u0103 e violacee, cald\u0103 \u0219i are o mic\u0103 b\u0103\u0219ic\u0103. Ce urmeaz\u0103?", "opts": ["Purtarea scade la 1\u20132 ore pe zi, iar schema de acomodare se reia de la \u00eenceput", "Se pune o \u0219oset\u0103 mai groas\u0103 din bumbac \u0219i purtarea continu\u0103", "Se a\u0219teapt\u0103 dispari\u021bia ro\u0219e\u021bii, iar benzile se str\u00e2ng mai pu\u021bin", "Orteza nu se mai pune, iar tehnicianul l\u0103rge\u0219te plasticul \u00een acel punct"], "correct": 3, "explain": "Ro\u0219ea\u021ba care persist\u0103 peste 30 de minute, violacee, cald\u0103, cu flicten\u0103, anun\u021b\u0103 o escar\u0103: orteza nu se mai pune, iar tehnicianul \u00eenc\u0103lze\u0219te \u0219i evazeaz\u0103 plasticul \u00een dreptul punctului. Reluarea schemei sau o \u0219oset\u0103 mai groas\u0103 las\u0103 neschimbat punctul care apas\u0103.", "tag": "Testul ro\u0219e\u021bii", "src": "Cap. 1 (Ghid practic de ortezare)"}, cte flexorii din bont, ca m\u00e2na s\u0103 se deschid\u0103", "S\u0103 trag\u0103 um\u0103rul \u00eenainte, ca un cablu s\u0103 deschid\u0103 m\u00e2na", "S\u0103 contracte extensorii din bont, ca m\u00e2na s\u0103 se deschid\u0103"], "correct": 3, "explain": "La proteza mioelectric\u0103 monomodal\u0103 doi electrozi capteaz\u0103 semnalul: contrac\u021bia flexorilor \u00eenchide m\u00e2na, contrac\u021bia extensorilor o deschide. Tragerea um\u0103rului \u00eenainte ac\u021bioneaz\u0103 protezele body-powered, iar co-contrac\u021bia comut\u0103 prizele la m\u00e2inile bionice multi-articulare.", "tag": "Proteze mioelectrice monomodale", "src": "Cap. 2 (Ghid practic de protezare \u0219i reabilitare func\u021bional\u0103)"}, {"q": "O fat\u0103 de 12 ani a primit un corset Ch\u00eaneau pentru scolioz\u0103. Ar vrea s\u0103-l poarte doar la \u0219coal\u0103, cam 8 ore pe zi, \u0219i s\u0103-l scoat\u0103 acas\u0103. Ce i se explic\u0103?", "opts": ["Nu ajunge: corsetul se poart\u0103 20\u201323 de ore pe zi, \u0219i \u00een somn", "Ajunge, cu condi\u021bia s\u0103 \u00eel poarte zilnic, inclusiv \u00een weekend, f\u0103r\u0103 zile libere", "Nu ajunge: corsetul se poart\u0103 doar noaptea, c\u00e2t doarme", "Ajunge, cu condi\u021bia s\u0103 fac\u0103 zilnic \u0219i kinetoterapie"], "correct": 0, "explain": "Corsetul de scolioz\u0103 cere 20\u201323 de ore pe zi, inclusiv la \u0219coal\u0103 \u0219i \u00een somn, scos doar pentru du\u0219 \u0219i kinetoterapie, p\u00e2n\u0103 se \u00eencheie cre\u0219terea. Kinetoterapia e unul dintre momentele \u00een care corsetul se scoate, nu un substitut pentru purtare.", "tag": "Purtarea corsetului de scolioz\u0103", "src": "Cap. 1 (Ghid practic de ortezare)"}, {"q": "Un pacient cu protez\u0103 de \u0219old ceramic\u0103 pe ceramic\u0103 aude un sc\u00e2r\u021b\u00e2it din \u0219old c\u00e2nd urc\u0103 sc\u0103rile. Ce explic\u0103 fenomenul?", "opts": ["E sl\u0103birea cimentului dintre implant \u0219i os", "E semnul eliber\u010 function branchLabel(t, i){ var c = String(t).charCodeAt(0); return (c >= 48 && c <= 57) ? t : (i + 1) + '. ' + t; }

function tableHtml(t){

function branchesHtml(sec, pre, ramuri, nr){

function resultsText(key, qs, ctx){
  var a = S.ans[key] || {}, score = 0, n = 0, wrong = [];
  qs.forEach(function(q, i){ if (a[i] === undefined) return; n++; if (a[i] === q.correct) score++; else wrong.push(i); });
  var L = [U.resultsHeader, ctx + ' ' + DASH + ' ' + D.curs, '', U.score + score + '/' + n];
  if (!wrong.length) L.push(U.allCorrect);
  wrong.forEach(function(i){
    var q = qs[i], stem = q.q.length > 60 ? q.q.slice(0, 60) + ELL : q.q;
    var tag = (q.src ? q.src + ' ' + MID + ' ' : '') + (q.tag || '');
    L.push('Q' + (i + 1) + ' [' + tag + ']: ' + U.chosen + String.fromCharCode(65 + a[i]) + ', ' + U.correct
      + String.fromCharCode(65 + q.correct) + ' ' + DASH + ' ' + stem);
  });
  return L.join(NL);
}

function quizHtml(sec, key, qs, ctx){
  var a = S.ans[key] || {}, answered = 0, score = 0;
  qs.forEach(function(q, i){ if (a[i] !== undefined) { answered++; if (a[i] === q.correct) score++; } });
  var h = '<div class="scorebar"><span>' + esc(U.progress) + '<b>' + answered + '</b> / <b>' + qs.length + '</b></span><span>'
    + esc(U.score) + '<b>' + score + '</b></span></div>';
  qs.forEach(function(q, i){
    var done = a[i] !== undefined;
    h += '<div class="q"><div class="qnum">' + esc(U.qword) + (i + 1) + '</div><div class="qtext">' + esc(q.q) + '</div>';
    q.opts.forEach(function(o, j){
      var cls = 'opt', mark = '';
      if (done && j === q.correct) { cls += ' ok'; mark = '<span class="mark">' + CHECK + '</span>'; }
      else if (done && j === a[i]) { cls += ' bad'; mark = '<span class="mark">' + CROSS + '</span>'; }
      h += '<button class="' + cls + '" data-act="ans" data-sec="' + sec + '" data-k="' + key + '" data-qi="' + i + '" data-oi="' + j + '"'
        + (done ? ' disabled' : '') + '>' + esc(o) + mark + '</button>';
    });
    if (done && (q.explain || q.src)) h += '<div class="explain">' + (q.explain ? '<b>' + esc(U.explain) + '</b>' + esc(q.explain) : '')
      + (q.src ? '<span class="src">' + esc(U.src + q.src) + '</span>' : '') + '</div>';
    h += '</div>';
  });
  if (qs.length && answered === qs.length) {
    var pct = Math.round(100 * score / qs.length);
    var msg = pct === 100 ? U.msgPerfect : pct >= 80 ? U.msgGood : pct >= 60 ? U.msgOk : U.msgLow;
    h += '<div class="final"><h3>' + esc(U.finalTitle + ' ' + NDASH + ' ' + ctx) + '</h3><div class="pct">' + pct + '%</div><p>'
      + esc(U.correctAns + score + U.outOf + qs.length + U.qsuffix + msg) + '</p>';
    h += '<div class="rlabel">' + esc(U.resultsLabel) + '</div><textarea class="res" id="res-' + key + '" rows="8" readonly>'
      + esc(resultsText(key, qs, ctx)) + '</textarea>';
    h += '<button class="btn" data-act="copy" data-sec="' + sec + '" data-k="' + key + '">' + esc(S.copied === key ? U.copied : U.copy) + '</button>';
    h += '<button class="btn ghost" data-act="reset" data-sec="' + sec + '" data-k="' + key + '">' + esc(U.reset) + '</button>';
    h += '<div class="hint">' + esc(U.resultsHint) + '</div></div>';
  }
  return h;
}

function topLink(){ return D.single ? '' : '<a data-act="jump" data-to="top">' + UP + ' ' + esc(U.top) + '</a>'; }

function pageHtml(){
  var h = '<header class="book" id="top"><h1>' + esc(D.curs) + '</h1><p class="sub">' + esc(D.sursa) + '</p></header>';
  if (D.single) {
    return h + D.capitole.map(function(c){ return '<section class="chsec" id="cap' + c.nr + '"><div class="chhead"><h2>' + esc(capHead(c))
      + '</h2></div><div id="body-cap' + c.nr + '">' + chapterBody(c) + '</div></section>'; }).join('');
  }
  h += '<nav class="toc"><h2>' + esc(U.toc) + '</h2><ol>';
  D.lista.forEach(function(it){
    var has = !!findCap(it.nr);
    h += '<li>' + (has ? '<a data-act="jump" data-to="cap' + it.nr + '">' + esc(D.eticheta + ' ' + it.nr + ' ' + NDASH + ' ' + it.titlu) + '</a>'
      : '<span class="todo">' + esc(D.eticheta + ' ' + it.nr + ' ' + NDASH + ' ' + it.titlu + ' (' + U.inLucru + ')') + '</span>') + '</li>';
  });
  h += '</ol><div class="finals">';
  D.teste.forEach(function(t, k){ h += '<button class="chip" data-act="jump" data-to="fq' + k + '">' + esc(U.finalWord + (k + 1)) + '</button>'; });
  if (D.grile) h += '<button class="chip" data-act="jump" data-to="grile">' + esc(D.grile.titlu) + '</button>';
  h += '</div><ul class="fnotes">';
  D.note.forEach(function(n){ h += '<li><b>' + esc(n[0]) + '</b> ' + esc(n[1]) + '</li>'; });
  if (D.grile && D.grile.nota) h += '<li><b>' + esc(D.grile.titlu) + ':</b> ' + esc(D.grile.nota) + '</li>';
  h += '</ul></nav>';
  if (!D.capitole.length) return h + '<p class="muted">' + esc(U.noChapters) + '</p>';
  D.capitole.forEach(function(c){
    h += '<section class="chsec" id="cap' + c.nr + '"><div class="chhead"><h2>' + esc(capHead(c)) + '</h2>' + topLink() + '</div>'
      + '<div id="body-cap' + c.nr + '">' + chapterBody(c) + '</div></section>';
  });
  if (D.teste.length) {
    h += '<section id="finale"><div class="finals-intro"><h2>' + esc(U.finalsTitle) + '</h2><p>' + esc(D.finalsDesc) + '</p></div>';
    D.teste.forEach(function(t, k){
      h += '<div class="fq" id="fq' + k + '"><div class="chhead"><h2>' + esc(U.finalWord + (k + 1)) + '</h2>' + topLink() + '</div>'
        + '<div id="body-fq' + k + '">' + finalBody(k) + '</div></div>';
    });
    h += '</section>';
  }
  if (D.grile) {
    h += '<section class="fq" id="grile"><div class="finals-intro"><div class="chhead" style="border:0;padding:0;margin:0 0 6px"><h2>'
      + esc(D.grile.titlu) + '</h2>' + topLink() + '</div><p>' + esc(D.grile.desc) + '</p>'
      + (D.grile.nota ? '<p class="hint"><b>' + esc(D.grile.titlu) + ':</b> ' + esc(D.grile.nota) + '</p>' : '') + '</div>'
      + '<div id="body-grile">' + grileBody() + '</div></section>';
  }
  return h;
}

function zoomOpen(nr, bi, fi){
  var f = findCap(nr).harta.ramuri[bi].figuri[fi], z = document.getElementById('zoom');
  z.innerHTML = '<div class="zbox"><span class="zclose">' + esc(U.zoomClose) + '</span>' + f.svg
    + '<div class="zcap"><b>' + esc(f.titlu) + '</b> ' + esc(f.nota || '') + '</div></div>';
  z.className = 'zoom on';
}
function zoomClose(){ var z = document.getElementById('zoom'); z.className = 'zoom'; z.innerHTML = ''; }
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') zoomClose(); });

function rerender(sec){ var el = document.getElementById('body-' + sec); if (el) el.innerHTML = sectionBody(sec); }
function jump(id){ var el = document.getElementById(id); if (el && el.scrollIntoView) el.scrollIntoView(); }

document.addEventListener('click', function(e){
  var t = e.target;
  while (t && t.getAttribute && !t.getAttribute('data-act')) t = t.parentNode;
  if (!t || !t.getAttribute) return;
  var act = t.getAttribute('data-act'), sec = t.getAttribute('data-sec');
  if (act === 'zoom') return zoomOpen(t.getAttribute('data-nr'), parseInt(t.getAttribute('data-b'), 10), parseInt(t.getAttribute('data-f'), 10));
  if (act === 'unzoom') return zoomClose();
  if (act === 'jump') { e.preventDefault(); return jump(t.getAttribute('data-to')); }
  if (act === 'tab') { S.tab[t.getAttribute('data-nr')] = t.getAttribute('data-t'); rerender(sec); return jump(sec); }
  if (act === 'nd') { var k = t.getAttribute('data-k'); S.open[k] = !S.open[k]; return rerender(sec); }
  if (act === 'mmall') {
    var pre = t.getAttribute('data-pre'), op = t.getAttribute('data-open') === '1', c = findCap(sec.slice(3)), ram = c.harta.ramuri;
    (c.sectiuni || []).forEach(function(x){ if (pre === 's' + c.nr + '_' + x.id) ram = x.ramuri; });
    setAll(pre, ram, op); return rerender(sec);
  }
  if (act === 'ans') {
    var key = t.getAttribute('data-k'), qi = parseInt(t.getAttribute('data-qi'), 10);
    S.ans[key] = S.ans[key] || {};
    if (S.ans[key][qi] === undefined) S.ans[key][qi] = parseInt(t.getAttribute('data-oi'), 10);
    return rerender(sec);
  }
  if (act === 'reset') { S.ans[t.getAttribute('data-k')] = {}; S.copied = null; rerender(sec); return jump(sec); }
  if (act === 'copy') {
    var k2 = t.getAttribute('data-k'), ta = document.getElementById('res-' + k2), txt = ta ? ta.value : '';
    var done = function(){ S.copied = k2; rerender(sec); };
    var fallback = function(){ if (ta) ta.select(); try { document.execCommand('copy'); } catch (y) {} done(); };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (x) { fallback(); }
  }
});

window.QZ = { pageHtml: pageHtml, sectionBody: sectionBody, zoomOpen: zoomOpen, data: D, S: S };
document.getElementById('app').innerHTML = pageHtml();
</script>
</body>
</html>
