<style>
  :root { --bg:#f4f1ea; --card:#fff; --ink:#2c2a26; --muted:#6b6760; --accent:#7a5c3e; --accent-soft:#efe6d8; --border:#ddd5c7; }
  * { box-sizing:border-box; }
  body { font-family:Georgia,'Times New Roman',serif; background:var(--bg); color:var(--ink); margin:0; line-height:1.55; }
  .wrap { max-width:720px; margin:0 auto; padding:32px 16px 60px; }

  .an { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-bottom:20px; }
  .an h2 { margin:0 0 12px; font-size:1.5rem; color:var(--accent); border-bottom:2px solid var(--accent); padding-bottom:6px; }
  .sem h3 { margin:14px 0 8px; font-size:1.15rem; color:var(--ink); }
  .sem ul { list-style:none; margin:0; padding:0; }
  .sem li { margin:0 0 8px; }
  .sem a { display:block; background:var(--accent-soft); border:1px solid var(--border); border-radius:10px; padding:12px 16px;
    color:var(--ink); text-decoration:none; font-size:1.05rem; }
  .sem a:hover { border-color:var(--accent); color:var(--accent); }
  .sem a.blue { color:#1f5fa8; }
  .sem a.blue:hover { border-color:#1f5fa8; color:#1f5fa8; }
  footer { color:var(--muted); font-size:.82rem; text-align:center; margin-top:28px; }
</style>
</head>
